name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @echofinders/core
      - run: npm run content:validate

  # The rest of `npm run gate`: contrast, frame, controls, spec and layout, the audits that
  # used to run only when somebody remembered to. They render the built app in Chromium, so
  # they are slower and live in their own job.
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # The Ubuntu package mirror has hung for the whole job (39 minutes on 7 Oct, both
      # jobs). Five minutes a try, three tries, so a stuck mirror costs minutes, not the run.
      - name: Install Chromium
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $i stalled or failed; retrying"
            sleep 10
          done
          exit 1
      - run: npm run build --workspace @echofinders/core
      - run: npm run library:build
      - run: npm run audit:contrast
      - run: npm run audit:frame
      - run: npm run audit:controls
      - run: npm run audit:spec
      - run: npm run audit:layout

  # The checks that walk the app (a simulated walk to the fort, real timers) are slow, and
  # with alignment and flows added they took the audits job past its 40 minutes. They run
  # alongside it instead, so both finish sooner and neither is cut off.
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The Ubuntu package mirror has hung for the whole job (39 minutes on 7 Oct, both
      # jobs). Five minutes a try, three tries, so a stuck mirror costs minutes, not the run.
      - name: Install Chromium
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $i stalled or failed; retrying"
            sleep 10
          done
          exit 1
      - run: npm run build --workspace @echofinders/core
      - run: npm run library:build
      - run: npm run audit:paywall
      - run: npm run audit:align
      - run: npm run audit:flows
