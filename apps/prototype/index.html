<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Echo Finders</title>
    <!--
      INSTALLABLE, so "Add to Home Screen" opens Echo Finders as its own full-screen app
      rather than another Safari window. That is also the only place iOS (18.4+) lets a web
      app hold the screen awake, which is what keeps a walk going without the phone
      sleeping: `useScreenAwake` in wake.ts asks for it, and from here it can be granted.

      The status bar is solid black, not translucent, so the app starts below the clock
      and the Dynamic Island exactly as it does in a Safari tab. The home indicator below
      is handled by `--nav-h`, which grows by the phone's own inset.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Echo Finders" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      THE FONTS, which were never actually loaded.

      This file had the preconnect and no stylesheet, so Sora, Space Grotesk and the
      Poppins the CSS asked for were all absent and every screen fell back to whatever
      sans the device had. A preconnect opens a socket to a server nobody then asks for
      anything, which is why it looked deliberate and survived: the line is there, it is
      just half of the pair.

      `display=swap` so text is readable immediately on a cold phone rather than invisible
      while the font arrives. That matters more here than usual — the first thing anybody
      does with this is open it in a street.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
