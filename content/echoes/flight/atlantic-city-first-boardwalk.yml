teaser: The pale line along the beach below is the original of its kind.
script: |
  Down on your right, that pale line running along the back of the beach.

  Boardwalks exist everywhere now. That one is where the idea came from, and it was not
  built for strolling.

  In eighteen seventy the hotels and the railway on that beachfront had the same complaint:
  guests walked in off the sand and brought most of the beach with them, into the lobbies,
  onto the carpets, into the railway carriages. Sweeping it out was a full-time job.

  So a conductor and a hotelier proposed a wooden walkway, laid straight onto the sand, that
  people would use because it was easier than not using it.

  It was taken up every autumn and stored for the winter.

  Everything else that word now means — the piers, the postcards, the amusements — grew on
  top of a solution to a cleaning problem.
