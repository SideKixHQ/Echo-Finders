teaser: The pale line along the beach below is the original of its kind.
script: |
  Down on your right, that pale line running along the back of the beach.

  It was not built for strolling. It was built because of sand.

  Atlantic City was a commercial venture from the start, created by a railroad and a land company from Philadelphia. In eighteen seventy the town laid its first boardwalk, a footpath so that people would not walk back into the hotels, the trains and the shops with sand in their shoes.

  It was ten feet wide, made of removable twelve foot sections laid on posts in the sand.

  A bigger one followed ten years later, and after a winter storm in eighteen eighty four, a sturdier one again, raised five feet above the beach, with businesses on both sides.

  Everything else that word now means, the piers and the postcards and the amusements, grew on top of a solution to a cleaning problem.

