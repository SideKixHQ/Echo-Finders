teaser: The cape below you is the reason that stretch of sea is called the Graveyard of the Atlantic.
script: |
  The hook of sand below is Cape Hatteras. The Diamond Shoals run out from it as much as ten miles underwater, the Gulf Stream meets the Labrador Current over them, and together they earned this stretch of sea its name: the Graveyard of the Atlantic.

  Which is why there has been a lighthouse down there since eighteen oh three, and the current one since eighteen seventy: brick, two hundred and eight feet from the foundation to the top of the lantern, the tallest brick light tower in the country.

  When it was finished it stood fifteen hundred feet from the sea. By nineteen seventy the sea was a hundred and twenty feet away.

  So in nineteen ninety nine they jacked up four thousand eight hundred and thirty tons of brick, put it on rails, and pushed it two thousand nine hundred feet to the southwest. It set off on the seventeenth of June and was set down on its new foundation on the ninth of July.

  That November the light came back on.

