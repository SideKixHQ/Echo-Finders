teaser: The cape below you is the reason that stretch of sea is called the Graveyard of the Atlantic.
script: |
  The hook of sand below is Cape Hatteras. The shoals run out from it for a dozen miles
  underwater, two ocean currents meet directly over them, and the wrecks in that stretch of
  sea number in the hundreds. It has been called the Graveyard of the Atlantic since the
  eighteen hundreds.

  Which is why there has been a lighthouse down there since eighteen oh three, and the
  current one — a hundred and ninety-eight feet of brick, the tallest in the country —
  since eighteen seventy.

  It was built fifteen hundred feet from the sea. By the nineteen nineties the sea was a
  hundred and twenty feet away.

  So in nineteen ninety-nine they jacked up four thousand eight hundred tons of brick,
  put it on rails, and moved it. It took twenty-three days to travel twenty-nine hundred
  feet.

  It did not crack.
