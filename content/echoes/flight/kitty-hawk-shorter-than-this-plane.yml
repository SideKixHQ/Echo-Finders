teaser: Look down at the sandbar on your left. Then look along the cabin.
script: |
  Look down and to your left. That thin line of sand between the sea and the sound is the Outer Banks.

  On the seventeenth of December nineteen oh three, at the Kill Devil Hills down there, Orville Wright took off in a powered aeroplane and kept it in the air until it hit the sand about a hundred and twenty feet from the rail.

  Now look along the cabin you are sitting in.

  Depending on the aircraft, that entire first flight would have started and finished without leaving this fuselage. They flew three more times that day; the last and longest, with Wilbur at the controls, covered eight hundred and fifty two feet in fifty nine seconds.

  Then a gust of wind caught the machine, rolled it over, and damaged it beyond easy repair. It never flew again.

