teaser: Look down at the sandbar on your left. Then look along the cabin.
script: |
  Look down and to your left. That thin line of sand between the sea and the sound is the
  Outer Banks.

  On the seventeenth of December nineteen oh three, on the dunes down there, an aeroplane
  left the ground under its own power with a person aboard and landed at a point higher than
  where it started. It was in the air for twelve seconds and it travelled a hundred and
  twenty feet.

  Now look along the cabin you are sitting in.

  Depending on the aircraft, that entire first flight would have started and finished
  without leaving this fuselage. They flew three more times that day; the longest covered
  eight hundred and fifty-two feet.

  Sixty-six years after the fourth flight, people landed on the moon.
