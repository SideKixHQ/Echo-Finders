teaser: The cape below is where almost everything the United States has launched went up.
script: |
  The cape below you is where nearly everything the United States has ever launched went up.

  The reason it is there and not in Nevada comes down to two things, and neither is the
  weather.

  The first is the ocean. Rockets go east, and everything that falls off one on the way —
  spent stages, and occasionally the whole thing — has to fall somewhere that is not a town.
  East of that cape there is nothing but water for three thousand miles.

  The second is that the Earth is already turning. At that latitude the ground is moving
  east at about nine hundred miles an hour. Launch in the same direction and you start with
  that speed for free.

  The closer to the equator, the more you get. That is most of the reason the map of the
  world's launch sites looks the way it does.
