teaser: If the cloud is thin, look for the pattern. You will know it when you see it.
script: |
  If you can see the ground on the left, look for a pattern: a grid, interrupted at regular
  intervals by small green squares.

  That layout was drawn in seventeen thirty-three, before there was a city to put it in.
  James Oglethorpe laid out a repeating unit, a square with house lots and civic lots
  around it, and the plan was simply to keep repeating it as the place grew.

  Twenty-four were eventually built. Twenty-two are still there.

  Cities almost never survive this. Street plans get widened for carts, then for trams, then
  for cars, and the awkward bits get straightened out. Savannah's squares are exactly the
  awkward bits. They force traffic to slow down and go around.

  A few have been lost along the way. The plan has not.
