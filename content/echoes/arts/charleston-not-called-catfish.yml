teaser: "Look across the street at numbers eighty-nine and ninety-one. They have two names."
script: |
  Look across the street at numbers eighty-nine and ninety-one Church Street. The federal
  survey of historic buildings files them under two names. Cabbage Row. And Catfish Row.

  Only one of those is a Charleston name.

  In the nineteen twenties two Charlestonians, DuBose and Dorothy Heyward, wrote a play called Porgy. It is set among the Black Charlestonians of a place called Catfish Row. Its hero is a disabled beggar with a little goat cart.

  It ran for more than a year in New York, then went on tour. When it came to Washington, the Evening Star explained to its readers that the sets were
  authentic, drawn after a visit to Charleston. And then it added a correction. The row
  itself, the paper said, is not called Catfish in Charleston. It is referred to as
  Cabbage Row. Porgy himself, it said, was based on a real person.

  A few years later George Gershwin turned the play into an opera, Porgy and Bess. A
  Washington paper reported, perhaps generously, that he had spent all his spare time for two years in Charleston, visiting Catfish Row.

  He could not have. There is no such place. It is across the street, under another name.
