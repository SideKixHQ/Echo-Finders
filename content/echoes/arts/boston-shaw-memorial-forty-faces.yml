teaser: "Look at the soldiers in the bronze, not the man on the horse. Look at their faces."
script: |
  Look at the soldiers in the bronze, not the man on the horse. Look at their faces.

  They are not one face repeated. Some are young, some older. The features and the builds
  are different.

  That was the point. The sculptor, Augustus Saint-Gaudens, was first expected to make a
  statue of Colonel Robert Gould Shaw alone on horseback. Shaw's family objected. He had not
  been a great commander, they said, and it seemed pretentious. So Saint-Gaudens put him
  among his men.

  The men were the Fifty-fourth Massachusetts, one of the first Black regiments of the Civil
  War. They marched down this street, off to the war, in eighteen sixty-three. That July, in
  the assault on Fort Wagner in South Carolina, Shaw and many of his men were killed.

  In his New York studio, Saint-Gaudens hired Black men to pose, and modelled some forty
  heads. The work took him about fourteen years, longer than anything else in his career.

  It was unveiled in eighteen ninety-seven, and the original inscriptions named only the
  white officers who fell. The names of the Black soldiers were added in the early
  nineteen-eighties.

  The faces came first. The names took another eighty-five years.
