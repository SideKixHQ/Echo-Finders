teaser: "The murals that stayed are on the walls. Look for the ones that did not."
script: |
  If the doors are open, step inside the base of this tower. The walls are covered in murals, painted in nineteen thirty four by artists on a federal relief program.

  Now look above the windows.

  The artists painted in fresco, into wet plaster. Near the end, one of them, Clifford Wight, added small paintings above the windows. A dollar sign. The blue eagle of the New Deal. And a hammer and sickle.

  That summer, the dockworkers went on strike, and then the whole city. On the fifth of July, two waterfront workers were killed by police. The same day, a newspaper printed a doctored photograph that laid Wight's hammer and sickle over another artist's mural, and said the murals were part of a communist plot.

  The city locked the tower and cancelled the opening.

  When it finally opened, in October, the artwork over the windows had been removed. All of it, not only the hammer and sickle.

  The murals that stayed are the ones you can see. Above the windows is what they took away.
detail: >-
  From the National Register additional documentation for Coit Memorial Tower: the Public Works of Art Project murals, the dockworkers strike from 9 May 1934 and the general strike of 16 to 19 July, Wight's late additions of a dollar sign, the NRA blue eagle and a hammer and sickle, the deaths of two waterfront workers killed by police on 5 July, the San Francisco Examiner's photograph superimposing the hammer and sickle on Zakheim's mural and alleging a communist plot, the Park and Art Commissions locking the doors and cancelling the opening, and the removal of all the artwork over the east, south and west windows before the October 1934 opening. CBS San Francisco (2018) gives the Public Works of Art Project. The NR gives the opening as 12 October in one place and 20 October in another, so the script says only October. "The blue eagle of the New Deal" stands for the NRA's blue eagle; a reviewer may prefer "the eagle of the National Recovery Administration".
