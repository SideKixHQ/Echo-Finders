teaser: "Find the little brick building with the steep roof."
script: |
  Find the little brick building on the corner with the steep, two sloped roof. It is one of
  the oldest buildings in the city, and among the taller ones around it, it looks it.

  Before it was built, this ground belonged to a woman named Anne Hutchinson.

  She held meetings in her house here, talking about religion. The colony's leaders judged
  her teaching dangerous. In sixteen thirty eight she was tried and banished.

  At the end of the trial she asked why she was being sent away. The governor told her, say
  no more. The court knows wherefore, and is satisfied.

  Later, fire took the houses on this corner. The building in front of you went up in its
  place as an apothecary's shop, and stayed one for about a hundred years.

  Then the booksellers moved in.

  By the middle of the eighteen hundreds this was the home of Ticknor and Fields, the
  leading publisher in the country, and the writers came here with their manuscripts.
  Hawthorne. Emerson. Longfellow. Harriet Beecher Stowe. Louisa May Alcott.

  So on this one small corner, a woman was thrown out of the colony and told to say no more.

  Two hundred years later, saying more was the whole business.
