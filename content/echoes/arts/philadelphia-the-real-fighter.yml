teaser: "For decades the museum kept its distance from him."
script: |
  Look at the bronze boxer at the top of the steps, with his arms up in the air. He never lived. Rocky Balboa is a made up boxer from South Philadelphia. And about four million people a year come to see him.

  For decades, the museum behind him kept its distance.

  Sylvester Stallone had the statue made for a film, Rocky Three, and then gave it to the city. It was put up here, at the top of the steps. Then some of the city's art commissioners said it was not art. It was kitsch. And it was taken away. In two thousand six it came back, but only to the bottom of the steps. It stood down there for twenty years, while millions of people queued to take its picture.

  Then, in the spring of twenty twenty six, the museum changed its mind. It invited Rocky inside, as art. A curator stood him among two thousand years of boxers in paintings and sculpture. When the show closed, a crane lifted him up here, to the top of the steps, where the sculptor had meant him to stand.

  Now look down the steps, to the bottom. Where Rocky used to be, there is a different statue. Joe Frazier. A real boxer, from South Philadelphia.

  The fighter who never lived is at the top.

  The real one is at the bottom.
detail: >-
  The Rocky statue was moved to the top of the steps in 2026 after the exhibition 'Rising Up: Rocky and the Making of Monuments' (April to August 2026).
