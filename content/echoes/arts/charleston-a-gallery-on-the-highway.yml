teaser: "Ten hours of work in your hands. And a shape older than the road."
script: |
  Look at the baskets on the stands along the road. Coiled, tight, the colour of straw. It looks like a country road. It is really a working art gallery.

  The grass grows wild. A weaver named Lynette Youson showed a reporter how she gathers it. She grabs a handful of green sweetgrass, puts her foot on the root, and pulls. Then it dries in the sun for three to five days, and turns a pale beige.

  You tie a knot, she said, and then you work around that knot. It's like crocheting. A basket can take her about ten hours.

  The weavers are Gullah, descendants of West Africans enslaved on this coast. Their baskets were tools before they were art. One flat shape was for rice. You threw the grain up in the air, and let the breeze carry the husks away.

  Back in nineteen forty one, the state guide already noticed baskets for sale at wayside stands near Charleston. Woven, it said, by a process handed down from generation to generation.

  Henrietta Snype, who has woven since she was seven, put it this way. When I do these baskets, it reflects my entire community.

  Pick one up. Turn it over.

  It was made to hold rice.
detail: >-
  CBS News (2015) reports Highway 17 as a working gallery, Lynette Youson's description of gathering, drying and weaving sweetgrass, about ten hours for one basket, the Gullah heritage and the rice fanner basket as described by Henrietta Snype, and her words on community. The 1941 Federal Writers' Project guide records baskets offered at wayside stands near Charleston. Both weavers named are public in that report.
