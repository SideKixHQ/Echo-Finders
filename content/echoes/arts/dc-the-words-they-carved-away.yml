detail: >-
  Angelou's words were said to the Washington Post and reported by NPR; the script attributes them. The full sermon passage is quoted from NPR. "The government agreed" summarises the Interior Secretary's December 2012 decision, endorsed by the King family, to remove rather than replace the inscription.
