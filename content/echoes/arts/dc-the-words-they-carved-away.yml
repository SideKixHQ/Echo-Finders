teaser: "Look at the grooves on this side of the stone. Words used to be here."
script: |
  Walk around to the north side of the great stone. Look at the deep horizontal grooves cut into the granite. They look like the rest of the stone, torn from the mountain.

  Some of them are hiding something.

  When the memorial opened in twenty eleven, there were words here. I was a drum major for justice, peace and righteousness.

  King did say something like it. In a sermon in nineteen sixty eight, he imagined his own funeral, and hoped nobody would talk too long. And he said, if you want to say that I was a drum major, say that I was a drum major for justice.

  If. The carving had dropped that word. The architect said there simply was not room on this side for the full quote.

  The poet Maya Angelou had advised on the memorial. She said the short version made Dr. King look like an arrogant twit. The if clause, she said, changes the meaning completely.

  The government agreed. So in the summer of twenty thirteen, the sculptor, Master Lei Yixin, came back and carved grooves straight over the letters, to match the marks around them.

  Look at those grooves again.

  He asked for a short eulogy.

  For two years, this stone gave him one that was too short.
