script: |
  Wilmington's tourism authority identifies this riverfront area as the Dawson's Creek
  location of Andie and Pacey's first kiss.

  The romance was fiction. The place where the scene was filmed is real, and people can
  return to it after the cameras and actors have gone.

  Stand on the public Riverwalk and look at what a production gained here: water, space,
  and a city backdrop that could become part of another town's screen identity.

  That transformation is part of Wilmington's arts history. Filmmaking asks a real place
  to play a role. Once the episode reaches an audience, the setting can hold two meanings
  at once: an ordinary local walkway and a remembered moment in a television story. You
  are standing in the overlap.
