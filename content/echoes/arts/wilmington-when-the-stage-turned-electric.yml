script: |
  In 1909, Thalian Hall installed electric stage lights. Its renovation also changed the
  balconies and proscenium, the frame around the stage.

  The theater was adapting to new expectations instead of preserving every feature from
  its opening. The audience's view and the performers' working conditions could change
  while the building continued serving the same larger purpose.

  If you can enter through an authorized visit, look toward the stage opening. The frame
  tells you where to direct attention; light tells you what to notice within it.

  From outside, the story still works. A historic theater is not one unaltered machine. It
  is a place repeatedly adjusted so performance can continue. The 1909 work reminds us
  that what now looks traditional was once a substantial modern improvement.
