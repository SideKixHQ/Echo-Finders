teaser: "The tile mosaic on this veranda was never finished, and that was a protest."
script: |
  Look at the building shaped like a ship, and at the tile mosaic on its veranda. It was never finished.

  The Works Progress Administration built this bathhouse from 1936 to 1939, as a public place for swimmers. Showers switched on by electric eyes. Lockers for hundreds.

  Sargent Claude Johnson, the most prominent African American artist working for the WPA in Northern California, carved the green slate on the front, and designed that mosaic.

  It opened on the twenty-second of January, 1939. Then the city leased most of the building to private businessmen, who opened an exclusive restaurant and nightclub. When a group of schoolboys brought their sack lunches to the veranda, they were told to leave. Signs went up. Private. Keep out.

  Sargent Johnson walked away from the project. The sculptor Beniamino Bufano took his animal statues away. He said he would rather have kids playing over his statues than drunks stumbling over them.

  The city was found guilty of mismanagement, and the nightclub was thrown out. But the mosaic stayed the way Johnson left it.
