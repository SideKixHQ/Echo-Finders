teaser: "He came here for the light."
script: |
  Look at the dark bird on the statue by the garden, and the plain brick house behind it. Edgar Allan Poe lived in Philadelphia for six years, in five different houses. This is the only one left.

  You might expect it to be gloomy. It isn't.

  Just before they moved in, his young wife Virginia was found to have tuberculosis. They chose this house because it was bright and airy, to help heal her lungs. Her mother, Maria, kept everything spotless. They called her Muddy. There was a cat, called Catterina. Money was short. When Poe filed for bankruptcy around this time, he had hardly any furniture to list.

  But in this bright house, he published The Black Cat. In that story, a man walls up a body in his cellar, behind a false chimney. The cellar of this house has a false chimney. And by the kitchen door, someone once carved a single word into the plaster. Death. Nobody knows who did it.

  Look at the windows. In Poe's day, the house stood alone on the corner, and the light came pouring in.

  He came here for the light.

  He wrote about the cellar.
