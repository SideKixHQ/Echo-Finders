tags: [nashville, wedgewood-houston, records, motown, segregation]
teaser: "This record plant was built with a hotel suite on top, because its customers could not get a room in town."
script: |
  Look at the mosaic front of this plant. It was built to press records, and it was built with a hotel suite on the top floor.

  The company was called Southern Plastics. By the early 1960s it was turning out about a million records a month, including every single for Motown.

  It moved into this new building in 1963.

  In those years the South was segregated. Black customers coming to Nashville for their records would have struggled to find anywhere to stay.

  So the plant gave them somewhere. Up in the penthouse, a living room, a bedroom with two twin beds, a full bathroom, and a kitchen with a push button stove.

  They called it the United Hilton. Now it is known as the Motown Suite.

  Motown's founder, Berry Gordy, was one of the guests.

  The plant also pressed some of the Beatles' first American records, for a label in Chicago.

  When a federal survey documented the building in 2012, it was still pressing vinyl, one of the largest plants of its kind in the country.

  A record factory with a hotel on the roof, because the hotels in town were not an option.
