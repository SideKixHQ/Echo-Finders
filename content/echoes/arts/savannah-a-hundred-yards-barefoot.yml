# Listening spot: the north sidewalk of East Oglethorpe Avenue between Abercorn and Lincoln streets, the block of No. 228 where the Aiken family lived in 1901, facing Colonial Park Cemetery and, diagonally across the avenue at Habersham Street, the police barracks.
# Position: Oglethorpe at Abercorn and Oglethorpe at Lincoln from the street segments in the app's Savannah street file, midpoint set onto the north sidewalk; about 60 m from the Colonial Park vaults echo and 150 m from the police barracks echo (medium confidence for the house, high for the block). The script does not say the 1901 house still stands.
# Category: arts. The echo is about the poet and the morning his writing kept returning to; the 1901 deaths are told only as the boy reported them, with no detail. No living person is named.
