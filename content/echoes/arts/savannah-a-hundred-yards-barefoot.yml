teaser: "A boy ran a hundred yards with news no child should carry. He spent his life writing."
script: |
  Stand on this side of the avenue and look east, across to the corner of Habersham Street, at the old police barracks.

  One winter morning a boy ran there from this block, with no shoes on.

  His name was Conrad Aiken. He was eleven. His father was a doctor, and the family lived in a house on this block, at number two twenty eight. Early on the twenty seventh of February, nineteen hundred and one, a patrolman at the barracks heard behind him the patter of bare and boyish feet. That is how the Morning News put it. The boy told him that his father had shot his mother, and then himself.

  The paper measured the distance. A hundred yards, diagonally across the avenue.

  The children were sent north to relatives. Conrad went to Harvard, where he became friends with T. S. Eliot. In nineteen thirty he won the Pulitzer Prize for poetry. His writing, a Georgia columnist noted, mentions that morning.

  In his last years he came home to Savannah. When he died in nineteen seventy three, he was buried in Bonaventure, on the lot where his parents lie. No flowers, no clergy. A friend read lines from one of his poems at the grave.

  Should I not hear, as I lie down in dust, the horns of glory blowing above my burial?

  Look across at the barracks again.

  He ran a hundred yards that morning. He was still writing seventy years later.
detail: >-
  Savannah Morning News, 28 February 1901: the family "at No. 228 Oglethorpe avenue, east, between Abercorn and Lincoln streets; a hundred yards away, diagonally across Oglethorpe avenue, on the corner of Habersham street, is the police station house"; the patrolman "heard behind him the patter of bare and boyish feet. He turned to face Conrad Aiken". The paper calls him "12-year-old"; UPI (1973) says he "left Savannah at the age of 11" and that he had turned 84 on 5 August, which makes him eleven in February 1901, so the script says eleven. The 1901 report's graphic description of the room is not used. Savannah Morning News, 2 March 1901: buried in Bonaventure. UPI obituary and burial reports (Griffin Daily News, 18 and 21 August 1973): Pulitzer, Harvard and Eliot, returned to Savannah, buried "on the lot where his parents are buried", "There were no flowers and no clergy", and the lines of "Tetelestai" read at the grave (the poem was published before 1929). UPI says he returned "two years ago"; the script says only "in his last years". The column by Bernice McCullar (Griffin Daily News, 12 September 1973) is the second, independent source for the Pulitzer and for his writing mentioning the deaths. Whether the 1901 house survives is not checked and not claimed.
