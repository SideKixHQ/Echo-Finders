teaser: "The sign says Dock Street Theatre. Look at the street sign. You are on Queen Street."
script: |
  Look up at the iron balcony on the corner. The name on the building is the Dock Street
  Theatre.

  Now look at the street sign. You are standing on Queen Street.

  Queen Street used to be called Dock Street. And on this side of the block, in seventeen
  thirty-six, Charleston put up a building for one purpose only. Plays. It is said to have
  been the first building in America made for the theatre.

  Nobody was building a monument. A history of the city written in nineteen-oh-six says the
  early playhouses here were described as temporary, and were probably not much more than
  barns. Planters and merchants came to watch tragedies, and Addison's Cato, and a comedy
  called The Recruiting Officer, put on by special request of the local militia.

  The barn is long gone. The building in front of you started life around eighteen-oh-nine
  as the Planter's Hotel, where planters from up-country stayed for the horse-racing season.
  Then, in the nineteen-thirties, the city restored it as a Works Progress Administration
  project. It built an eighteenth-century style theatre into the back of the old hotel, and
  gave the whole thing the old playhouse's name.

  So America's first theatre is a story told by a hotel, about a barn, on a street that
  changed its name.

  For a theatre, that seems about right.
