teaser: "A grave with no name, guarded by a figure nobody can name either."
script: |
  Find the bronze figure sitting here, very still, wrapped in heavy drapery. One hand rises to the edge of its face. The hood throws a dark shadow over the eyes.

  Look for a name. There is none.

  This marks the grave of Marian Adams. Her friends called her Clover. She was witty and athletic, and a skilled photographer. In December eighteen eighty five, suffering from depression, she took her own life.

  Her husband, the historian Henry Adams, could hardly bear to speak of her again. He went to Japan, and came back drawn to the Buddhist idea of a peace beyond suffering. Then he asked the sculptor Augustus Saint-Gaudens to make this.

  In his sketchbook Saint-Gaudens wrote, mental repose, calm reflection.

  The figure is not her likeness. It does not say who she was. Adams insisted that it stay nameless. The sculptor gave it a name of his own anyway. The Mystery of the Hereafter.

  Adams said the sculptor meant it to ask a question, not to give an answer.

  Look under the hood again.

  It is still asking.
