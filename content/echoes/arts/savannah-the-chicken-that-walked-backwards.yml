teaser: "A terrible speller with a famous chicken. Then the books."
script: |
  Find number two oh seven on Charlton Street, one of the tall houses facing the square.

  A girl who grew up in that house was in the newsreels as a child. Not for anything she wrote. For a chicken.

  Her name was Mary Flannery O'Connor. She was born in Savannah in nineteen twenty five, and lived in this house until nineteen thirty eight. Her childhood friends, gathered in nineteen eighty nine to remember her, recalled a child devoted to birds. In the nineteen thirties, they said, Pathé News photographed a chicken she had trained to walk backwards. One of them swore that she turned up at a Girl Scout meeting leading a chicken on a string.

  They remembered something else. She was a terrible speller. She rarely got high marks in composition.

  She grew up to write Wise Blood, and A Good Man Is Hard to Find. She won the O. Henry award twice. By the time her friends met to remember her, she was being named in the same breath as William Faulkner.

  Look at the house again.

  Low marks in composition. Faulkner's name beside hers.
detail: >-
  Southern Cross (Diocese of Savannah), 6 July 1989, "Flannery O'Connor's Girlhood Remembered" by Hugh Brown: a May 1989 panel of childhood friends at Armstrong State College; "the now-famous episode of the chicken she trained to walk backwards (a marvel photographed by Pathe News in the 1930's)", the Girl Scout meeting "leading a chicken on a string", "a terrible speller", "rarely got high grades in composition", born in Savannah in 1925, the novels and story collections, two O. Henry awards, "mentioned in the same breath with William Faulkner". The chicken rests on this one report of friends' memories, hence single-source; the script attributes it to them. The script says only "as a child": the source dates the film to "the 1930's", and her exact age (six or seven by most accounts) is in no fetched source. The house: Southern Cross, 20 February 1997, "the Flannery O'Connor Childhood Home at 207 East Charlton Street, on Lafayette Square"; Flagpole (Athens), 22 April 1998, the house "where O'Connor lived from the time of her birth in 1925 until 1938 ... at 207 E Charlton St on Lafayette Square". Her own later words about the chicken (an essay of 1961) were not reachable and are not quoted.
