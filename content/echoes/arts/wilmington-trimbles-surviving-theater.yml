script: |
  Thalian Hall is the only surviving theater designed by John Montague Trimble, according
  to its institutional history.

  That makes this building more than a local survivor. It carries physical evidence of a
  theater architect's work after his other theaters have disappeared.

  The original project joined performance with municipal functions. Art and government
  shared a substantial downtown building rather than occupying separate civic worlds.

  From outside, notice how confidently the building addresses the street. A theater begins
  its work before an audience reaches a seat: the approach, entrance, and sense of
  occasion all matter.

  The surviving structure lets today's visitors encounter a design that written
  descriptions alone cannot replace. Trimble's name may be unfamiliar, but the building
  still performs one part of his intention: making an arrival feel significant.
