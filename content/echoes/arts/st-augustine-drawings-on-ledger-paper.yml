teaser: "Prisoners from the Great Plains were held on top of this fort. What they drew there still survives."
script: |
  Look up at the top of the north wall. In the 1870s, a long wooden barracks stood up there on the gun deck, built by prisoners.

  They had come from the Great Plains. Seventy-four of them, mostly warriors, taken from a reservation after the Red River War. There were Cheyenne, Kiowa, Comanche, Arapaho and Caddo. They arrived in chains and shackles.

  Then a new jailer, Lieutenant Richard Henry Pratt, had the chains taken off. He also set out to make them give up who they were.

  Many of the young men began to draw. Not on buffalo hide, the traditional way, but on paper from an accountant's ledger book. Army rosters. Day books. Whatever paper they could find.

  They drew life on the plains. The long journey to Florida. Their days inside this fort.

  Many of those drawings survive. Native artists still make ledger art today.

  And one prisoner, in an act of resistance, etched a Kiowa Sundance camp into the walls of the prison itself.
