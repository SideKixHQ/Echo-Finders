script: |
  The Thalian Association traces its beginnings to 1788, long before the theater now
  called Thalian Hall was built.

  That order matters. Wilmington had people organizing dramatic activity before it had the
  famous surviving stage. A building later gave the activity a landmark; it did not create
  the interest from nothing.

  You are at the association's present arts-center setting, not its original
  eighteenth-century meeting place. The institution's history links these different
  locations.

  Pause by the entrance. Community theater depends on people agreeing to work together,
  return for rehearsals, and invite others to watch. The association's long history
  records that recurring effort. A stage can be constructed once. A theater community has
  to be made again whenever people choose to put on the next performance.
