teaser: "A ten dollar mixing board, after six o'clock."
script: |
  Look along this block of Locust Street. At number fourteen oh five, up on the sixth floor, there used to be the offices of a little Philadelphia record company called Cameo.

  One day, a phone call came to Dick Clark, the host of American Bandstand. A television host in Baltimore said the kids on his show were dancing to a song called The Twist. It was by Hank Ballard, but it was a B side, and Ballard sang songs a lot of parents did not like.

  So Clark called the man who ran Cameo, Bernie Lowe. Why not make your own version? Lowe had just the singer. A teenager named Ernest Evans, who could imitate anybody. Dick Clark's wife had already given him a stage name. A joke on Fats Domino. Chubby Checker.

  The musicians came up to the sixth floor here. They had to wait until after six in the evening, when the other offices emptied out. They put a carpet on the floor and rugs on the walls, to deaden the sound. The mixing board, the guitarist said, was worth about ten dollars. They listened to Ballard's record a few times. Then they played it, almost note for note.

  Chubby Checker sang. It came out on Lowe's own label. That August, America saw the dance for the first time.

  Look up at the windows along this block.

  The whole world twisted to a song made in an office, after hours, with rugs on the walls.
