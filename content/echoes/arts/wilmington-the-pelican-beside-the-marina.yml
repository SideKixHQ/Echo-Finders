script: |
  Dumay Gorham's Pelican places a coastal bird in sculptural form beside Port City Marina.

  The marina setting changes how you encounter the work. Water, boats, and open air supply
  part of its context; the sculpture turns attention toward a bird that belongs to the
  region's coastal imagination.

  You are looking at art, not a live animal or an exact scientific diagram. Its shape
  reflects choices about what a viewer will recognize and what the material can express.

  Use the public viewing route and leave private docks alone. Notice the outline before
  looking for smaller details. A sculpture can make you pause in a place built for
  departures and arrivals. This bird stays while the boats move, giving the waterfront a
  different sort of permanent resident.
