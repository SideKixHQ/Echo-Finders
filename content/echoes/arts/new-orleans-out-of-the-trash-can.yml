teaser: "Somebody went back for it."
script: |
  Look at the lounge on this corner. It is named for a song that was thrown in the garbage.

  In nineteen sixty one, a young songwriter and producer named Allen Toussaint made a song called Mother in Law. After a few bad takes, he threw it in the trash. One of the backup singers fished it out. Toussaint remembers the singer walking over to Ernie K Doe and saying, look, try this again, man.

  It went to number one in the country. K Doe always knew he was special. I'm cocky, he liked to say, but I'm good.

  Then the hits stopped. By the middle of the seventies he had pretty much dropped out. He drank, and people remember seeing him living on the streets.

  In the early nineteen nineties, an old friend, Antoinette, took him in. They married. She dressed him in capes and feathered hats, and she opened this lounge, so he could sing again. It was wall to wall, one of his backup singers remembers.

  He died in two thousand one. But he didn't exactly leave. Antoinette had a likeness of him made from a department store mannequin, and set it up in the lounge. Everybody wanted to take a picture with Ernie.

  Look at the lounge again.

  Somebody went back for the song. Somebody went back for him.
detail: >-
  Ernie K-Doe (Ernest Kador Jr.) died on 5 July 2001. The lounge was damaged by Hurricane Katrina and rebuilt at its original location; Antoinette K-Doe ran it after his death. The mannequin is no longer kept there.
