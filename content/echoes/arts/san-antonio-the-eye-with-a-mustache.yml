teaser: "For decades people called it the Eye of God. Then the cleaners found a goatee."
script: |
  Look at the church walls. They are weathered and pale now, but they were once covered in colorful designs, inside and out.

  The paint was made with lime and water, and possibly goat's milk. Mission artisans painted it into wet plaster, quickly, before the plaster dried.

  Inside the convento, the priest's residence, the library has the best known fresco of all, on the ceiling. A sunburst with an eye.

  For decades, only one eye and a few rays could be seen. Legends called it the Eye of God. The All Seeing Eye.

  In 1988, conservators began removing two hundred and fifty years of dirt and plaster that did not belong there. To the surprise of many, they found a second eye. Then a mustache. Then a goatee.

  Historians now think it was not a religious symbol at all, but a Spanish medallion. A face.

  So the Eye of God turned out to have a beard. It is still up there, looking down at whoever comes in.
