teaser: "Stand at the foot of the steps and look up at the statue in the doorway."
script: |
  Stand at the foot of the steps and look up at the statue in the doorway.

  On Easter Sunday, the ninth of April 1939, a singer stood up there with Lincoln at her
  back and a row of microphones in front of her.

  Her name was Marian Anderson. Toscanini had said a voice like hers came along once in a
  hundred years. She had already sung at the White House.

  She could not sing at Constitution Hall, which is nearby. Its owners, the Daughters of
  the American Revolution, barred Black performers, and they would not make an exception.
  A mostly white high school turned her down as well.

  So these steps were offered instead. The concert was free. About seventy-five thousand
  people came, of every race, and NBC radio carried it live across the country.

  She opened with America. My country, 'tis of thee.

  The song says, of thee I sing.

  She sang, to thee we sing.
