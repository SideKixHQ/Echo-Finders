teaser: "A new film every day for rainy weeks, then rock bands loud enough to end it."
script: |
  Look at the building at 38 North Lumina Avenue. It began as the Crest Theatre.

  The Crest opened for the summer season in 1946. A different movie played every day, so visitors
  staying a week could come back daily when the weather turned. It showed current American films and
  foreign films by directors like Federico Fellini, and the popcorn was beloved by all.

  The town's timeline says the movies ran every summer until 1973. Then the Crest became a concert
  stage for local bands and touring rock acts. It grew so popular, and so loud, that in 1981 it was
  sold to the town.

  Today it is a restaurant and bar. A room built for rainy afternoons ended its show business days
  too noisy for its neighbors.
