teaser: "He expected ninety percent of America to come and see it. Hardly anyone did."
script: |
  Look at the walls in front of you, all tile and steel and bright paint. Somewhere in them are words, set in tile. Eat oranges and live.

  A mail carrier built all of this, by himself, to tell the world about one fruit.

  His name was Jeff McKissack. In the Depression he trucked oranges around the Southeast, and he came to believe the orange was a pure source of energy. In the war years he learned to weld in a navy shipyard. Then he moved to Houston and carried the mail.

  He bought two lots across the street from his house. He got a permit to build a beauty parlor. Then he typed onto the permit, Beauty parlors are going out of style. Have a better idea. The Orange Show.

  For about twenty years, he hauled in what the city threw away. Roof tiles, fire escapes, steel wheels, turnstiles, tractor seats, from Houston buildings being torn down. He worked without plans. Stairs and catwalks, two little amphitheaters, a wishing well, a steamboat floating in a tank.

  He called it the most beautiful show on earth. He expected ninety percent of the country to want to see it. It opened on the ninth of May, nineteen seventy nine.

  The crowds did not come. Seven months later, he died of a stroke.

  But some of the few who had come were artists. They raised the money to buy it and save it. Dominique de Menil gave. So did ZZ Top.

  Find the words in the tile again.

  Love me, orange, please love me.

