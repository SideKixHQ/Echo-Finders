# Listening spot: outside the Orange Show, 2401 Munger Street, the monument a Houston mail carrier built by himself between the 1950s and 1979 (Handbook of Texas, two entries; Houston Chronicle, 2022). The Chronicle reported in 2022 that a restoration was under way; the echo is heard from the street.
# Position: Overture place "Orange Show Center for Visionary Art", 2402 Munger St, 29.71763, -95.32433 (high confidence for the site; the Handbook gives 2401 Munger). No other echo within 300 m.
