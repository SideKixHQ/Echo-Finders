teaser: "A telegram, a little paperback, an arrest, and a poem nobody could stop."
script: |
  Look at the bookshop on the corner. City Lights. A poet named Lawrence Ferlinghetti opened it in nineteen fifty three.

  In nineteen fifty five, he heard a young poet, Allen Ginsberg, read a new poem called Howl. Ferlinghetti sent him a telegram.

  I greet you at the beginning of a great career, it said.

  Then he added a second line. When do we get the manuscript?

  In the fall of nineteen fifty six, he published it, as a little paperback that cost seventy five cents.

  Howl described sex, between men and women, and between men. Not long after it came out, police arrested a bookseller here, and Ferlinghetti was charged with obscenity.

  Ginsberg was delighted. He knew a trial would only make the poem more famous.

  At the end of it, the judge found that Howl had redeeming social importance. It was not obscene.

  Ferlinghetti lived to a hundred and one. His shop is still on the corner.
detail: >-
  NPR (2006) gives the 1955 telegram, "I greet you at the beginning of a great career" and the coda "When do we get the manuscript?", police arresting a bookseller at City Lights and charging Ferlinghetti with obscenity, Ginsberg's delight at a trial he knew would enhance the poem's reputation, and Judge Clayton Horn's ruling. NPR (2021, obituary) gives the 75 cent paperback in the fall of 1956, the passages about sex between men and women and between two men, the 1957 arrest, the finding of redeeming social importance, and his death at 101. CBS San Francisco (2021) gives the founding in 1953. Two independent publishers. NPR calls the trial "a long federal trial"; it was in San Francisco municipal court before Judge Horn, so the script does not call it federal.
