script: |
  Thalian Hall's history lists appearances by performers including Lillian Russell,
  Buffalo Bill Cody, and John Philip Sousa.

  They brought different kinds of entertainment, but their presence made the same point:
  Wilmington belonged to a national touring circuit. A port city could receive artistic
  traffic as well as commercial cargo.

  We do not need to invent the sound of a particular concert or borrow a famous tune. The
  documented appearances are enough to establish the connection.

  Stand outside the theater and consider the practical journey behind a celebrated name.
  Performers, equipment, schedules, and audiences had to meet here on the same date. The
  building supplied the local end of that arrangement. For an evening, a touring
  reputation became something Wilmington residents could experience together.
