teaser: "A ballroom lit so brightly that ships could steer by it."
script: |
  Look along South Lumina Avenue. Near here stood Lumina, the pavilion people called the Palace
  of Light.

  It opened on June 3, 1905, near the end of the electric trolley line. Its builder, Hugh MacRae,
  owned the local electric utility, and over a thousand incandescent bulbs lit it up. He hoped the
  glow would get more people using electricity. Ships could navigate by it.

  The second level was a dance floor with a band shell for the orchestra. Above it, a promenade
  fifteen feet wide looked down on the dancers. All three levels were for white visitors only.

  The pavilion was condemned in 1972 and demolished in 1973. On a summer evening here, picture the
  lights coming on along this shore, bright enough to steer a ship by.
