script: |
  The 1898 memorial uses six tall bronze paddles to remember Wilmington's coup and its
  victims. Artist Ayokunle Odeleye designed it, and it was dedicated in November 2008.

  This park is a place of remembrance. The events it commemorates happened across the
  city, not all on this patch of ground.

  Walk slowly along the public path. The sculpture asks for a different pace from the
  surrounding streets. Its repeated forms can bring separate lives into a single field of
  attention without pretending the violence had a simple or settled ending.

  Public art carries a responsibility here. It makes history present while leaving room
  for reflection. The bronze survives in the open air; the work of understanding what the
  city lost must continue among the people who visit.
