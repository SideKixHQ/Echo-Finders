teaser: "He went around the world. He always came back here."
script: |
  Find the brownstone at number twenty East One Hundred Twenty Seventh Street, with the stoop and the iron railings. Now look up, to the top floor.

  When he was young, a poet named Langston Hughes wrote that he wanted to see Harlem more than Paris. More than Shakespeare's country, or Berlin, or the Alps.

  He came to New York for college in nineteen twenty one, and met the young writers of Harlem. Then he kept moving. He worked on ships, to Europe and Africa. He spent a year in the Soviet Union. He reported from Madrid during the war in Spain.

  And he always came back to Harlem.

  For years he could not afford much. In nineteen forty two, he finally rented a studio, and took his meals with two friends he thought of as his uncle and aunt, Emerson and Toy Harper.

  In nineteen forty seven, the Harpers bought this house. Hughes moved in with them, and took the top floor as his workroom.

  He stayed twenty years. It was the only home he ever kept for long.

  Up there he wrote about a Harlem man called Jess B. Semple. Just Be Simple. Book after book of him. He wrote poems, and books about jazz and Africa, and the words for an opera.

  He died in May, nineteen sixty seven.

  Look at the top floor windows again.

  He wanted to see Harlem more than Paris. He ended up with a room at the top of it.

