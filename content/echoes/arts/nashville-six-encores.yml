teaser: "A twenty-six year old's first night on this stage would not let him leave it."
script: |
  On the eleventh of June, 1949, a twenty-six year old walked out on this stage for his first night on the Grand Ole Opry.

  His name was Hank Williams, and the song was Lovesick Blues.

  He had not written it. It came from the nineteen twenties, from songwriters in New York, and it was not even a country song to begin with.

  He yodeled it, and he made it his. It had gone to number one and stayed there for sixteen weeks.

  That night the audience here, three thousand people, called him back for six encores.

  One witness said he stopped the show colder than it had ever been stopped in its thirty-one years.

  Three years later, the Opry fired him for drinking.

  He died on the first of January, 1953, in the back seat of a car on the way to a show. He was twenty-nine.

  Six encores, on the first night. Nobody in the room could have guessed how few nights were left.
