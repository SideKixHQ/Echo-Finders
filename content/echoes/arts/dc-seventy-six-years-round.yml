teaser: "Look up to the band of painted figures that runs right round the rotunda."
script: |
  Look up, to the band of painted figures that runs right round the rotunda, below the
  dome.

  It is one long procession through American history, a little over eight feet high and
  about three hundred feet around.

  It was designed by Constantino Brumidi, a painter from Rome who had come to America as an
  exile, and who spent more than twenty years decorating this building. He began the band
  in 1877. He was in his seventies, working on a scaffold high above this floor.

  In the autumn of 1879 he very nearly fell from it. A newspaper reported that he never
  completely recovered from the shock. He died the following February. He had painted six
  scenes and part of a seventh.

  Another Italian, Filippo Costaggini, carried on with Brumidi's designs for eight more
  years. When he finished, there was still a gap. About thirty feet of the circle was empty.

  It stayed empty for more than sixty years.

  In 1952 and 1953 a New York artist, Allyn Cox, filled it with the Civil War, the Spanish
  American War and the birth of aviation. The papers announced that the frieze was complete.

  It had taken seventy-six years to go once around the room. The man who started it saw six
  scenes of it.
