certaintyNote: >-
  The block, the publishers and the 1903 coinage are in the Landmarks Preservation Commission's 2019 designation report for 55 West 28th Street. Who coined the name is unknown; the report lists four candidates and calls the newspaper and piano story folklore. The script says so.
