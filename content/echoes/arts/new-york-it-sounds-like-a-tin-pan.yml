tags: [new-york, nomad, tin-pan-alley, sheet-music, popular-music, piano, landmark]
teaser: "Every window open, a piano in every one. The neighbors had a name for it."
script: |
  Look at the row of old houses along this side of West Twenty Eighth Street. Five of them, numbers forty seven to fifty five.

  Now open every window in your mind, and put a piano behind each one.

  Around nineteen hundred, this block held more sheet music publishers than anywhere else in New York. Records were still too dear for most families. If you wanted a song, you bought the sheet music, and played it at home on the piano.

  So the publishers played their new songs all day, to sell them. One writer described a great room with four or five pianos in it, and a composer at every piano, all playing and singing at the tops of their voices. With the windows wide open, so the music floated down to the street.

  The noise needed a name.

  Nobody knows who said it first. There is a story, and it is only a story, about a publisher who stuffed strips of newspaper behind his piano strings to quiet it down. A journalist heard it and said, it sounds like a tin pan.

  By January, nineteen oh three, the name was in print. West Twenty Eighth Street, more commonly known as Tin Pan Alley.

  It was meant as an insult.

  Look along the block.

  The insult became the name for American popular music.

