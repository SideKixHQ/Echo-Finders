script: |
  On October 12, 1858, Thalian Hall opened with a gala. Wilmington gained a theater that
  would connect local audiences with performers traveling through the country.

  For the people arriving that evening, this was a new room, not a historic landmark.
  The expectation lay ahead: a curtain would rise, a performance would begin, and the
  city's investment would become an experience.

  Stand outside the entrance. A theater's opening can be remembered as a date, but its
  real test comes when people gather and listen together.

  Every later audience added another use to the building. That opening night began the
  pattern. Before the reputation, restorations, and anniversary celebrations, the town
  had to take the simple step that makes a theater work: open the doors and invite
  people in.
