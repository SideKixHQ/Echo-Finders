teaser: "The navy was finished with her. A twenty two year old with a poem was not."
script: |
  Look at the ship. In eighteen thirty, she was nearly lost without a shot being fired.

  The age of sail was ending, and steam was coming in. The navy was simply letting its old sailing ships fall apart. And there was a rumour that this one was going to be scrapped.

  An unknown twenty two year old law student, Oliver Wendell Holmes, wrote a poem about her, and a Boston newspaper printed it. He called it Old Ironsides.

  Its second verse ends: The harpies of the shore shall pluck the eagle of the sea.

  Newspapers around the country picked it up. People in Boston, and then across the nation, rallied to save her.

  As one historian puts it, from then on she stopped being the navy's ship, and started being the people's ship.

  She is still the oldest commissioned warship afloat in the world.

  The navy had cannon. The people had a poem. The poem won.
