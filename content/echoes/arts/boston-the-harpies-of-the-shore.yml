detail: >-
  Prologue magazine (National Archives, spring 2005), interviewing the historian David Fitz-Enz, gives 1830, the waning age of sail, the navy letting old sailing ships deteriorate, the unknown 22 year old law student Holmes publishing the poem in a Boston newspaper, the closing lines of its second stanza, newspapers around the country picking it up, and "Old Ironsides stopped being the Navy's ship and started being the people's ship". WBUR (2012), quoting Matthew Brenckle of the USS Constitution Museum, independently gives the 1830s rumour that the navy would scrap the ship and the poem rallying Boston and then the nation, and calls her the oldest commissioned warship afloat in the world. Inspo evidence is "site": the poem is about this ship, which is in view; Holmes wrote it elsewhere. The poem itself (1830) is in the public domain. "The navy had cannon" is the script's own turn of phrase.
