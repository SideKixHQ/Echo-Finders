teaser: "Look under the horse."
script: |
  Look under the horse.

  Andrew Jackson's horse is rearing. Its front hooves are in the air. Fifteen tons of
  bronze, balanced on the back legs.

  The man who made it, Clark Mills, was a former ornamental plasterer from South Carolina.
  He had never seen Jackson. He had never seen an equestrian statue either.

  He built a furnace near this park and cast the whole thing himself, in ten pieces. The
  horse alone took six castings before the final one was done.

  To learn how a horse rears, he bought a retired racehorse named Olympus. He taught it to
  stand on its hind legs, so that he could watch how it was done.

  The statue was unveiled on the eighth of January, eighteen fifty-three. It was the first
  equestrian statue cast in the United States. Stephen Douglas gave the speech, and he
  compared it with the famous horses of Europe. Peter the Great's horse leans on a bronze
  serpent. Wellington's has its hind legs and tail riveted to the pedestal.

  Of this one, Douglas said: no props. No serpents.

  Look under the horse again.
