teaser: "Look under the horse."
script: |
  Look under the horse.

  Andrew Jackson's horse is rearing. Its front hooves are in the air. Fifteen tons of
  bronze, balanced on the back legs.

  The man who made it, Clark Mills, was a self-taught sculptor. He had never seen an
  equestrian statue.

  He built a studio and a furnace near this park, and cast the whole thing in ten pieces,
  four for the horse and six for Jackson. The horse alone took six castings before the
  final one was done, in December 1852.

  The statue was unveiled on the eighth of January, eighteen fifty-three, the thirty-eighth
  anniversary of the Battle of New Orleans. A cheering crowd of fifteen thousand followed
  Mills along Pennsylvania Avenue to the ceremony.

  It was the first equestrian statue cast in the United States, made by a man who had
  never seen one.

  Look under the horse again.
