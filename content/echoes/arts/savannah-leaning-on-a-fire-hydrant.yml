teaser: "A bronze man at ease in the square. Look at what he is leaning on."
script: |
  Find the bronze man in this square, life size, standing at his ease. Look at how he leans.

  He was posed from a photograph. In it, he is leaning on a fire hydrant.

  His name was Johnny Mercer, and he was born in Savannah. He wrote his first song at fifteen. It was called Sister Suzy Struts Her Stuff. In nineteen twenty nine he went to New York and worked on Wall Street, until he broke into show business.

  Then the songs came. Jeepers Creepers. Goody Goody. That Old Black Magic. About fifteen hundred songs in all. He won four Academy Awards. One of them was for Moon River.

  When he died in nineteen seventy six, the obituary began with Jeepers Creepers and ended with Autumn Leaves. Back home, people remembered the words to a southern lullaby.

  The statue was unveiled here on the eighteenth of November, two thousand nine. It was the day he would have turned a hundred.

  Look at him leaning again.

  Fifteen hundred songs, and the city put him in the square, at his ease, as if he had just stepped out for a minute.
detail: >-
  UPI obituary (Griffin Daily News, 26 June 1976): "Mercer's lyrics moved Americans from the days of 'Jeepers, Creepers' to 'Autumn Leaves.' He won four Academy Awards, for 'Moon River,' ...", "Born in Savannah, Ga., he wrote his first song at 15, 'Sister Suzy Struts Her Stuff.' He went to New York in 1929, and worked on Wall Street until he broke into show business", "He wrote 1,500 songs and some 75 hits, including 'Goodie, Goodie,' 'That Old Black Magic'". The Savannah Tribune, 25 November 2009: dedicated in Ellis Square on 18 November 2009, "the date that would have been Johnny Mercer's 100th birthday", "the man who wrote the words of the southern lullaby, Moon River", "life-size bronze statue which was designed by sculptor Susie Chisholm. The stable [statue] was a concept from a photo Mercer leaning against a fire hydrant." The Savannah Tribune, 22 April 2009, on the council vote placing it in Ellis Square. Whether the statue leans on anything, and on which corner it stands, should be checked on site; the script says only how he leans and that the pose came from the photograph. The landing "as if he had just stepped out" is the narrator's image, not a claim.
