teaser: "Elvis Presley's first real session in this little studio went nowhere for hours. Then they took a break."
script: |
  Look at this small brick building on Union Avenue. On the evening of the fifth of July, 1954, three young men came in here to make a record.

  It was hot and sticky, in the nineties. The studio had no air conditioning, because studios could not risk the noise.

  The singer was Elvis Presley. He had been in once before, to record a birthday song for his mother.

  The man who owned the place, Sam Phillips, could not say what he was looking for. All he would say was, I'll know it when I hear it.

  For hours, nothing worked. They went down one musical dead end after another.

  By around midnight the air inside was rancid. The only fresh air was out the back door.

  Then, on the break, Elvis started strumming his guitar and singing a blues song, That's All Right.

  Bill Black jumped up and slapped his bass along. Scotty Moore came in on electric guitar.

  Phillips stuck his head out of the control room door. Try it again, he said. Let me get in there.

  Two weeks later it was a record. And out of this room came the kind of music that would be called rock and roll.

  All night they had tried to play what they thought they were supposed to. It worked when they stopped.
