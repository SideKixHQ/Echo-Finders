script: |
  The Latimer museum counts Henry Gould Latimer's 1918 depiction of Wilmington's Dram Tree
  among his most popular works. Latimer trained as an artist and painted in watercolor.

  A tree can remain available through art. The picture records an artist's view, not a
  replacement for the actual tree or a photograph of every detail.

  You are at the house associated with the artist and the collection. If the work is
  available on your authorized visit, look at what the artist chose to emphasize. Do
  not assume every object in the collection is always on display.

  The image gives the landmark a different kind of life. Memory of the tree moved into
  pigment and preservation. An artist's decision to look closely became something later
  Wilmington visitors could still encounter.
