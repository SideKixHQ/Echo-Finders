script: |
  The Latimer museum identifies a 1918 watercolor of Wilmington's Dram Tree by Henry Gould
  Latimer among his works.

  A tree that no longer survives can remain available through art. The painting records an
  artist's view, not a replacement for the actual tree or a photograph of every detail.

  You are at the house associated with the artist and the collection. If the work is
  available on your authorized visit, look first at what the artist chose to emphasize. Do
  not assume every object in the collection is always on display.

  The image gives the vanished landmark a different kind of life. Waterfront memory moved
  from a living tree into paper, pigment, and preservation. An artist's decision to look
  closely became something later Wilmington visitors could still encounter.
