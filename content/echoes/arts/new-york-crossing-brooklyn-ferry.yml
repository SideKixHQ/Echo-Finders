teaser: "He wrote it about the people who would stand here after him. That means you."
script: |
  Look at the railing around this pier. There are words stamped into the metal.

  They were written for you. Not for anyone in particular. For whoever happened to be standing here, years after the man who wrote them was gone.

  Before there were bridges, ferries crossed to Manhattan from this landing. The first one, back in sixteen forty two, was just a man rowing a boat.

  In the eighteen forties, Walt Whitman worked near here, as the editor of the Brooklyn Eagle. He crossed this river many, many times. And in one poem, he stopped looking at the water, and started thinking about the people who would cross it after him.

  Others will enter the gates of the ferry and cross from shore to shore.

  A hundred years hence, or ever so many hundred years hence, others will see them.

  And then he spoke to them. To you.

  It avails not, time nor place. Distance avails not. I am with you, you men and women of a generation, or ever so many generations hence.

  Just as you feel when you look on the river and sky, so I felt.

  Just as you stand and lean on the rail, I stood.

  Rest your hand on the rail, and look across the water.

  Consider, he wrote, whether I may not in unknown ways be looking upon you.

