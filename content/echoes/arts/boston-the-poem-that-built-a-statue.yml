teaser: "This statue was designed in 1884. Look at the date it went up."
script: |
  Look at the rider. When this design was first described, it was Revere stopping for a
  moment in the middle of his ride, to warn the people.

  It won a competition in eighteen eighty-four. Ten models were entered. The winner
  was a sculptor from Utah, twenty-three years old, who had come to Boston a few years before
  with no money at all.

  The newspapers announced the winner and got his name wrong. They called him Charles Dillon.
  His name was Cyrus Dallin.

  On the Fourth of July, eighteen eighty-five, he signed a contract for a bronze to stand in
  Copley Square. The money was supposed to come from public subscription. It never did.

  Dallin became one of the best-known sculptors in the country. He kept asking Boston about
  his statue. Boston kept being sympathetic.

  After more than half a century, he tried something new. He wrote a poem, in the rhythm of
  Longfellow.

  Listen, my children, and you shall hear, of the ignoble failure of Boston to rear, the
  greatest creation of my long career, the equestrian statue of Paul Revere.

  The city found the money. In nineteen forty, fifty-five years after the contract, this
  statue went up here. Dallin was seventy-eight.

  He said it was the poem that did it. It was probably the only poem he ever wrote.
