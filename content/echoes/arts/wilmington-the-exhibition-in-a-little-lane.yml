teaser: "A gallery the width of a lane."
script: |
  In 1953, Claude Howell and Gar Faulkner staged a Cottage Lane art show during the Azalea
  Festival, according to Cape Fear Museum's historical account.

  The setting made an exhibition part of the neighborhood rather than an event confined to
  a grand gallery. Artists could bring work into a small downtown place already associated
  with creative life.

  Do not enter a private courtyard to recreate the show. The public lane is enough to
  understand the scale.

  Look along the buildings and imagine the practical decision: choose a place, gather the
  work, and invite people to see it. A local art community grows through events like that,
  where the audience meets artists nearby. The lane's size is part of the story. Cultural
  beginnings do not always require a monumental address.
