teaser: "Thomas Wolfe grew up in this boardinghouse, wrote it into a novel, and Asheville banned the book."
script: |
  Look at the big rambling house with the porches. A boardinghouse. A previous owner named it the Old Kentucky Home.

  In 1906, a boy named Thomas Wolfe moved in. His mother ran the place. She did not need the money. His father made enough from his tombstone shop on the city square. But Julia Wolfe was obsessed with real estate, and she used the boardinghouse profits to buy more of it.

  Her son grew up, and wrote it all down. His novel Look Homeward, Angel came out in 1929. In it, this house became Dixieland. A big cheaply constructed frame house of eighteen or twenty drafty, high-ceilinged rooms.

  He wrote so frankly about the town and its people that Asheville was not amused. The book was banned from the city's public library for over five years, and Wolfe stayed away from his hometown for nearly eight.

  In a later book he wrote that his mother's old dilapidated house had now become a fit museum.

  He was right. It opened as one in 1949. The novel has never gone out of print.
