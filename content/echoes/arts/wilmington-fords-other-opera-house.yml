script: |
  John T. Ford, associated with Ford's Theatre in Washington, leased this Wilmington
  theater from 1867 to 1871. During his tenure, it was called the Opera House.

  The connection can surprise visitors who know Ford's name only through Abraham Lincoln's
  assassination. This story concerns his theater business here, not a claim that the
  crime in the capital happened in this building.

  Names and management changed while the local building continued hosting entertainment.
  Its history reaches through people whose careers crossed several cities.

  Look at the entrance and imagine a playbill announcing the Opera House rather than
  Thalian Hall. A different title could mark a different business strategy without moving
  the stage. The theater's long life includes those shifts: familiar walls, new operators,
  and another invitation to an audience.
