teaser: "Look up at the windows of the Willard."
script: |
  Look up at the windows of the Willard.

  In November eighteen sixty-one, Julia Ward Howe was a guest at the hotel on this corner.
  The Civil War had begun, and she had come to Washington with her husband to see the war
  effort for themselves, and to meet President Lincoln.

  One night, she woke from a dream with a poem in her head. Years later, she described what
  she did next.

  With a sudden effort, she wrote, I sprang out of bed, and found in the dimness an old
  stump of a pen. I scrawled the verses almost without looking at the paper.

  The Atlantic Monthly printed them in February. People sang them to the tune of the John
  Brown song, and they still do.

  The building has changed. The old Willard was replaced at the turn of the century, on the
  same corner, under the same name.

  The song has not. You probably know how it begins. Mine eyes have seen the glory.

  She wrote it without looking.
