teaser: "St. James preserves the story of Ecce Homo, a painting associated with the capture of a Spanish privateer vessel near Brunswick Town in 1748."
script: |
  St. James preserves the story of Ecce Homo, a painting associated with the capture of a
  Spanish privateer vessel near Brunswick Town in 1748.

  The parish's account says the salvaged painting went first to St. Philip's Church and
  later to St. James after Brunswick Town was abandoned. Its artist remains uncertain.

  The parish has reported sending the painting to Durham for conservation. This stop
  therefore connects you with its history, not a promise that it is currently hanging inside.

  Stand outside and consider an artwork that outlasted changes in location and care. Its
  story is more than what it depicts. The journeys, the uncertain attribution, and the work
  needed to stabilize the canvas all belong to it. The object survives because later
  people keep accepting responsibility for its future.
