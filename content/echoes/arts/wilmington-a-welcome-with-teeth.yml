script: |
  Paul Hill's Southern Hospitality takes the shape of an enormous Venus flytrap. The
  tourism authority describes the sculpture as metal and glass, about fifteen feet high.

  Its title creates a playful tension. Hospitality promises welcome; the plant's trap
  suggests a very different relationship with its visitors.

  The artwork does not need to move to make that joke work. Its scale changes a small,
  locally associated plant into something that can meet your gaze on the waterfront.

  Stand back far enough to see the silhouette. Then notice the materials: manufactured
  surfaces representing a living organism. A public sculpture can make a familiar place
  feel briefly strange. Here, an emblem of the region becomes a greeting you are unlikely
  to mistake for an ordinary street sign.
