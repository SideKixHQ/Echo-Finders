script: |
  The USO's wartime program included big-band dances, plays, recitals, and radio
  broadcasts. Entertainment was part of what the building offered people far from home.

  That did not make the war disappear. It gave service members a temporary change of
  rhythm: a chance to listen, move, and join a crowd for reasons other than military duty.

  Stand in the open lobby if permitted, or listen from the sidewalk. The building helps
  you locate the idea without pretending a particular dance is happening around you.

  Art can do practical work. A song or performance may help a stranger feel less isolated,
  even when the larger circumstances remain difficult. Here, organized entertainment
  belonged to a wider effort of hospitality. The dance floor was one way Wilmington
  offered an evening's company.
