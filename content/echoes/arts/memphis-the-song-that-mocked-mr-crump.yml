teaser: "The first blues ever recorded began as a campaign song that made fun of the candidate."
script: |
  This park is named for W. C. Handy. The city of Memphis created it in 1931, to honor him.

  In 1909, Handy was hired to write a campaign song for a man running for mayor, Edward Crump.

  The song was called Mr. Crump. And its words made fun of Crump's own reform platform.

  Nobody knows whether Crump ever listened to the lyrics. Later, he said he had not hired Handy at all.

  Crump won anyway, and the song caught on around town.

  In 1912 Handy put new words to it and published it as The Memphis Blues.

  Sales were tiny at first, so he sold the rights, keeping only his name as composer.

  By the fall of 1913, the man who bought it had sold fifty thousand copies of the sheet music.

  And on the fifteenth of July, 1914, it became the very first blues song ever recorded.

  A joke at a politician's expense became the first blues on record. Handy learned the music business from it the hard way.
