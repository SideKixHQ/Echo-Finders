teaser: "Fourteen paintings that look almost black. The painter's son nearly walked out."
script: |
  In front of you is a pool, and in it a steel obelisk, standing on its point. Behind it, a brick building with eight sides and no windows.

  Inside are fourteen enormous paintings that, at first, look almost black.

  John and Dominique de Menil commissioned the chapel from the painter Mark Rothko. It opened in February nineteen seventy one. Rothko did not live to see it. He had died the year before.

  His son, Christopher, was a child when it opened. He did not come to see it until he was thirty three.

  He grew up with his father's paintings. He talked with them every day. But on that first visit, in here, nothing happened. I almost left with nothing, he said.

  He stayed a little longer.

  He stayed an hour and fifteen minutes. The time, he said, just sort of stopped running.

  The chapel's historian said Rothko chose the dark on purpose. Bright colors stop your vision at the canvas, she said. Dark colors go beyond.

  Look at the door. Inside, a skylight lets the Houston sun in, softly, and as clouds pass outside, the paintings change.

  Give them longer than you think.

