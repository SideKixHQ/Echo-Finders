teaser: "One pastor turned an actor's funeral away. He gave the mourners directions."
script: |
  Look through the gate at the little cluster of stone buildings, set back in a garden, in the middle of Midtown. It looks like a village church that got lost.

  It has a nickname. And it started as a brush off.

  In eighteen seventy, an actor named George Holland died. A friend of his, Joseph Jefferson, went to the pastor of a fashionable church on Madison Avenue to ask for a funeral.

  The pastor said no. Not for an actor.

  But he did make a suggestion. Try, he said, the little church around the corner.

  So they did. And this church buried him.

  When the story got out, the theater people of New York made this their church. An actors' guild made its home in the building.

  Couples came to marry here, perhaps more than at any other church in the city. And it is still better known by the pastor's words than by its own name.

  The Little Church Around the Corner.

  A brush off.

  It turned into a blessing.

