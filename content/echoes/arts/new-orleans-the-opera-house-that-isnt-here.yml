teaser: "Stand at the corner of Bourbon and Toulouse, and look for an opera house."
script: |
  Stand at the corner of Bourbon and Toulouse, and look for an opera house.

  There isn't one. For sixty years, there was.

  The French Opera House opened here in December eighteen fifty-nine. A city guide from nineteen-oh-four counted about two thousand eight hundred seats, in four tiers, and every tier had its own French name. The gallery, at the top, was popularly called le paradis. Paradise.

  During the Civil War the house went dark. In eighteen sixty-six it was ready to open again, and its new director was sailing from France with a whole company of singers, aboard a ship called the Evening Star.

  The ship went down. The entire company was lost.

  The house opened anyway, and kept going for another half century.

  Then, early on the fourth of December, nineteen nineteen, a fire started in a restaurant at the front of the building. Within hours the French Opera House had burned to the ground. Its season had opened on Armistice night, barely three weeks before. The management said it was the most successful season the house had ever had.

  So look up, above the corner, into the empty air.

  That is about where Paradise used to be.
