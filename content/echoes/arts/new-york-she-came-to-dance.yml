teaser: "She had planned to dance. Then the lights came up."
script: |
  Look up at the tall sign over these doors, the one that spells out Apollo.

  Since nineteen thirty four, strangers have walked out onto the stage in there for Amateur Night. There are no judges. The audience decides, and the audience is not forgiving.

  On a Wednesday night in November, nineteen thirty four, a seventeen year old girl walked out onto that stage. Her name was Ella Fitzgerald.

  Her mother had died. She had been sent to a reform school, where she was beaten, and she ran away. She was living on the streets, with no money, sleeping wherever she could.

  She had come to dance.

  But the act before her was a pair of dancing sisters, and they had stopped the show. And when she got out under the lights and saw all those people, she froze.

  The man said, well, you're out here. Do something.

  So she sang.

  She won. The prize was twenty five dollars and a week's work. Soon after, the bandleader Chick Webb asked her to join his orchestra. She became the First Lady of Song.

  Look at those doors again. A girl with nowhere to sleep walked through them, to dance.

  I never thought I was a singer, she said.

