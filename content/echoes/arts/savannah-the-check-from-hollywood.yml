teaser: "Savannah lost a square that year. The Mercers got their name back."
script: |
  Look for Johnny Mercer, in bronze. Savannah put him up for his hundredth birthday. He was born here, and he wrote the words to more than a thousand songs. Moon River. Skylark. That Old Black Magic.

  As a boy in Savannah, he learned to speak Geechee, and he would sit outside Black churches to listen to the singing.

  In nineteen twenty seven, when he was about to go to college, his father's real estate business lost more than a million dollars. His father, George Mercer, could have declared bankruptcy. Instead he put his own savings into the debt, and spent the rest of his life paying people back. When he died in nineteen forty, he still owed more than a quarter of a million dollars.

  Johnny went to New York instead of college. Some weeks, he had nothing to eat but oatmeal.

  He made it. He helped found Capitol Records. In nineteen fifty four, he sold his share for nearly two million dollars. The first thing he did was send a check to a Savannah bank, and pay back every one of his father's creditors.

  That same year, nineteen fifty four, this square was torn down for a parking garage.

  Savannah lost a square that year. The Mercers got their name back.
detail: >-
  The Library of Congress essay is by Philip Furia, Mercer's biographer, for the National Recording Registry. NPR reported the statue's unveiling on 18 November 2009; its placement in Ellis Square is not confirmed by these sources.
