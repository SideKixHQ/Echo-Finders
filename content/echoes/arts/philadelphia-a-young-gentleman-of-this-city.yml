teaser: "The playbill did not give his name. It did not need to, for long."
script: |
  Look at the theatre on this corner of Ninth and Walnut. It did not start as a theatre. In eighteen oh nine, it opened as a circus, with a dome eighty feet over the ring, and a circus company that had come all the way from Spain.

  A few years later they added a stage. And in November of eighteen twenty, the playbill for this house carried a curious line. Young Norval, the hero of the play, would be performed by a young gentleman of this city.

  No name. Just a young gentleman. He was fourteen.

  His name was Edwin Forrest. His father had been a runner for a bank. Edwin had worked in a newspaper office, and then in a cooper's shop, where, it was said, he would turn a barrel tub upside down, climb on top, and make speeches to the workmen. They thought it was hilarious.

  The young gentleman was a success. He played the part again, and then a benefit night was given for him, and this time the bill used his name. Master Forrest.

  He went on to become the great tragic actor of his day, the pride of Philadelphia. Six years later he was a star, playing Othello.

  And in eighteen seventy one, for his very last performance in his home city, he came back to this same stage.

  Look at the doors. The first real stage he ever stood on was the last one he played in his home town.

  Fifty one years apart.
