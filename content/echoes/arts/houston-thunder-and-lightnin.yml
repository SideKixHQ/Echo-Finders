teaser: "He played Carnegie Hall. He kept coming back to the corner."
script: |
  Read the street sign. Emancipation Avenue. Until twenty seventeen, this was Dowling Street.

  A bluesman who played Carnegie Hall kept coming back to the corners of this street.

  Sam Hopkins was born in Centerville, Texas. At eight he made his first guitar, out of a cigar box, with chicken wire for strings. As a boy he played with Blind Lemon Jefferson, who told him to keep at it.

  In the nineteen forties he settled in Houston, and became a fixture of the Third Ward clubs, on this street and around it. In nineteen forty six a record company sent him to Los Angeles. The piano player at the session was called Thunder Smith. Thunder, and Lightnin'. The name stuck.

  He made hits. He recorded for nearly twenty labels, sometimes for one while under contract to another. In the sixties he played Carnegie Hall. Later he played for Queen Elizabeth.

  And all along, he kept playing here. Dance parties. Street corners. The bars of Dowling Street.

  After a car crash in nineteen seventy, many of his shows were on his own front porch, or at a bar near his house.

  He died in Houston in nineteen eighty two. More than four thousand people came to his funeral.

  Look along the avenue.

  Carnegie Hall had him for a night. This street had him for thirty years.

