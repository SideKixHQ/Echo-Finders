script: |
  Look at the walls here, covered in broken tile and mirror, glittering in every direction. The man who made them was Isaiah Zagar. His mosaics run up and down this street, on alleys and shop fronts and houses.

  And in the late nineteen sixties, this street was supposed to disappear. An expressway was coming. Buildings were almost worthless, so artists could afford to buy them.

  In nineteen sixty eight, Isaiah and his wife Julia opened a gallery here, called Eyes. Julia was an artist too. She had studied sculpture, and shown her work in Mexico and New York. She ran the business, raised the children, and stopped making her own art. For nearly fifty years. Her steadiness, their friends said, is what let her husband transform this neighbourhood.

  The expressway never came. And in two thousand sixteen, inside these gardens, there was a show called Dear Julia. It hung her own drawings, at last, beside portraits of her made by folk artists all over the world. Isaiah called it a visual love letter. Julia said it made her want to get her time back, and begin to work again.

  Look at the walls again. If you're lucky, he once said, you find that person.

  If you're lucky, that person finds you.
