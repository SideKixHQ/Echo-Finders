teaser: "A community movement founded St. John's Art Gallery here, in the oldest Masonic lodge in the state."
script: |
  Forty years after the painter Elisabeth Chant arrived in Wilmington, a community movement
  founded St. John's Art Gallery here, in the oldest Masonic lodge in the state.

  Artists and supporters wanted Wilmington to have a place to encounter visual art. The
  institution grew into the museum that later moved to its present Cameron Art Museum
  location outside downtown.

  The downtown buildings gained another use: the Children's Museum acquired the complex in
  2004. You are at the earlier art-museum setting, not Cameron Art Museum today.

  Look at the old buildings from Orange Street. Their cultural work has changed, but the
  impulse remains recognizable: make spaces where people can look, learn, and try
  something new. The art gallery's beginnings belong here, even though the institution
  continued its journey elsewhere.
