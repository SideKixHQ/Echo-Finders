claims:
  - says: "Forty years after the painter Elisabeth Chant arrived in Wilmington, a community movement founded St. John's Art Gallery here, in the oldest Masonic lodge in the state."
    source: 1
    quote: "Forty years after Chant’s arrival, at least three of her students and colleagues, Claude Howell, Hester Donnelly, and Peggy Hall, were part of the community movement that founded St. John’s Art Gallery in the oldest Masonic Lodge in the state."
  - says: "the painter Elisabeth Chant arrived in Wilmington"
    source: 1
    quote: "Elisabeth Chant, long auburn hair coiled around her head, arrived in Wilmington in late 1922 carrying a trunk of belongings and art supplies."
  - says: "Artists and supporters wanted Wilmington to have a place to encounter visual art."
    source: 1
    quote: "The best way in which this can be done is for Wilmington to establish a community gallery or museum, not so much for the purpose of buying a permanent collection, but for the express purpose of exhibiting traveling shows of first rate painting and sculpture."
  - says: "The institution grew into the museum that later moved"
    source: 1
    quote: "In 1997, the community of St. John’s found itself at a crossroads – it had outgrown the cluster of historic buildings in downtown Wilmington and now started a capital campaign to build a new modern art museum."
  - says: "its present Cameron Art Museum location outside downtown"
    source: 1
    quote: "The museum was named Louise Wells Cameron Art Museum in her memory."
  - says: "The downtown buildings gained another use: the Children's Museum acquired the complex in 2004."
    source: 2
    quote: "To meet the steadily growing number of visitors, in 2004 the Museum purchased the three buildings that comprised the former St. John's Museum of Art as the new site for The Children's Museum of Wilmington (CMoW)."
  - says: "You are at the earlier art-museum setting, not Cameron Art Museum today."
    source: 2
    quote: "The St. John's Masonic Lodge, Greek Orthodox Church, and The Cowan House are dear pieces of Downtown Wilmington's history. They are preserved today as CMoW's new home."
