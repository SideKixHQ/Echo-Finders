teaser: "When it opened, people said the subway entrance looked like a mausoleum. They did not know the half of it."
script: |
  Look at the small granite entrance to Boylston station, at the corner of the Common. When it was new, critics said it resembled a mausoleum.

  They had more of a point than they knew.

  Below Tremont Street is the first subway in America. Ground was broken in eighteen ninety five. On the first of September, eighteen ninety seven, the first stretch opened, from the Public Garden to Park Street. Only four cities in the world had a subway before it.

  But the digging ran along the old Central Burying Ground, a short walk west of here, on the Boylston Street side of the Common.

  And the crews found people. Ninety in their tombs, undisturbed. About eight hundred and twenty more, crushed, or piled, or scattered in pieces through the ground.

  Crowds came to watch. An undertaker was hired to bury them again.

  The kiosk in front of you is essentially as it was built, and still in use, on what is now the Green Line.

  America's first subway goes down past a graveyard, through a door that looks like a tomb.
detail: >-
  The National Historic Landmark nomination for the Tremont Street Subway (National Park Service) gives ground broken on 28 March 1895, the Public Garden incline to Park Street segment opening on 1 September 1897, the first underground public transportation system in the United States and only the fifth in the world, the Classical Revival kiosks at Boylston and Park streets described as "resembling mausoleums", the Boylston kiosks "essentially unaltered", and the reinterment of 910 bodies exhumed from colonial burial grounds. WBUR (2024) independently gives the Central Burying Ground dug in 1756 along Boylston and Tremont streets, 90 bodies in undisturbed tombs and another 820 found crushed, piled or scattered, the crowds and the undertaker. The Boston Globe (2022) gives the MBTA's statement that the 1897 tunnel still connects the Green Line's Boylston and Park Street stations. "Only four cities had a subway before it" restates "fifth in the world"; the nomination names London, Glasgow and Paris among them.
