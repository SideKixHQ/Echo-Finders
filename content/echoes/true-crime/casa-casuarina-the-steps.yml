teaser: Look at the steps in front of the gate. Not the house.
script: |
  Look at the steps in front of the gate. Not the house — the steps.

  At about a quarter to nine on the morning of the fifteenth of July, nineteen ninety-seven,
  Gianni Versace came back up Ocean Drive carrying his magazines and stopped here to open
  his own front door.

  A man walked up behind him and fired twice. Versace was fifty. He did not get through the
  door.

  Police identified the man who shot him as Andrew Cunanan, already on the FBI's Ten Most
  Wanted list. Eight days later Cunanan was found dead on a houseboat two miles north of
  where you are standing. He was never tried. He left nothing behind explaining any of it,
  and no motive has ever been established.

  By the time he reached Miami Beach, four other people were already dead. Jeffrey Trail.
  David Madson. Lee Miglin. William Reese.

  This address is famous because of who died at it.

  Nobody stands outside the other four.
