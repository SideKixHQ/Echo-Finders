# The payoff of the Ocean Drive pair.
#
# One idea: he did not get through his own front door. The landing is the other four names,
# which is the only reason this echo is defensible at all — an address is famous because of
# who died at it, and saying so out loud is the difference between reporting and tourism.
#
# What is deliberately absent: the parking garage, the discarded clothing, the stolen truck,
# the documents inside it. All true, all sourced, all procedural filler that serves the
# true-crime genre rather than the place. Rule 4 in docs/writing-echoes.md — one idea.
id: casa-casuarina-the-steps
title: He did not get through the door
summary: Gianni Versace was killed on these steps in 1997, coming back from breakfast.
place: Casa Casuarina, 1116 Ocean Drive, Miami Beach
