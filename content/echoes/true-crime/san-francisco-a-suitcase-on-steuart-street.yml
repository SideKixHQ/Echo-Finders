# Drafted by Claude Code (2026-11-12) for San Francisco (second pass), following docs/writing-echoes.md (format v2) and docs/14-true-crime.md.
# Listening spot: The public sidewalk on Steuart Street just south of Market Street, by the Embarcadero and the Ferry Building. The bomb was on the west side of Steuart Street, just south of Market, per the Library of Congress. Public street; no home, no business door.
# Position: Steuart Street just south of Market from general map knowledge (medium to high confidence for the block).
# Conviction status: exonerated. Thomas Mooney and Warren K. Billings were convicted in 1917; Governor Culbert Olson granted Mooney a full pardon on 7 January 1939, which the Washington Times said "absolves Mooney of guilt". Billings's 1939 release is described as a pardon by one Library of Congress text and a commutation by another, so the script says only what is agreed of him. No one else was ever convicted. Everyone named is dead. The victims are not named.
# Sources: three independent publishers: the Library of Congress film record (its own description), The Washington Times editorial of 10 January 1939, and the 1916 wire report printed in The Brandon News (Mississippi).
