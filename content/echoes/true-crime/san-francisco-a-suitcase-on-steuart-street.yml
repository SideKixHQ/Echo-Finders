script: |
  Stand on Steuart Street, just south of Market, and look toward the Ferry Building.

  On Saturday the twenty second of July, nineteen sixteen, the city held a parade here to argue for getting ready for war. It was perhaps the largest parade San Francisco had ever seen. More than fifty thousand marchers.

  At six minutes past two, half an hour in, a bomb went off on the west side of this street. It had been hidden in a cheap suitcase, left beside the marchers. Ten bystanders were killed, and forty wounded.

  The city wanted someone. Police arrested two radical labour men, Thomas Mooney and his assistant, Warren Billings.

  The trial was hasty, and it included several false witnesses. Both men were convicted. Mooney was sentenced to death.

  A commission set up by President Wilson found no clear evidence of his guilt, and his sentence was changed to life in prison.

  He served twenty two years. In January, nineteen thirty nine, a new governor gave Mooney a full pardon.

  Nobody else was ever convicted. Whoever left the suitcase on this street has never been named.
detail: >-
  Key facts and their sources. The parade on Saturday 22 July 1916, its size (51,329 marchers), the bomb at 2.06 pm about half an hour in, on the west side of Steuart Street just south of Market, concealed in a suitcase, ten bystanders killed and forty wounded, the arrest of Mooney and Billings, the hasty trial with several false witnesses, the convictions, the death sentence, the Mediation Commission finding no clear evidence of guilt, the 1918 commutation to life, and the 1939 pardon: Library of Congress film record "San Francisco's future" (1916). The corner of Steuart and Market, the cheap suit case by the side of the marchers, and no trace of the bombers at the time: The Brandon News, 27 July 1916, a wire report (it gives seven dead, the early count). Ten killed and forty wounded, twenty two years in San Quentin, Olson's full pardon absolving Mooney, and the bomber likely never to be known: The Washington Times, 10 January 1939. Status exonerated: the script says "pardon" aloud. Victims are not named and no injuries are described. "To argue for getting ready for war" glosses "Preparedness Day"; a reviewer may prefer the name itself.
