script: |
  Look across the avenue at the big insurance building with the gold top. Before it, the corner held Madison Square Garden, designed by the architects McKim, Mead and White.

  Stanford White was one of the partners. And the Garden had a theatre on its roof.

  In June nineteen oh six, the roof was showing the opening night of a musical called Mam'zelle Champagne. About a thousand people were there.

  White had spent the evening at his club, across the street. At five to eleven he walked over, went up to the roof, and sat at a table near the stage, his chin resting on his hand, listening to the music.

  Harry Thaw had been there all evening. He came from a well known Pittsburgh family. He was married to Evelyn Nesbit, an artists' model and chorus girl, and he blamed White for ruining his life with her. He was pale, and kept walking about the roof as if looking for someone.

  On stage there had been talk of a duel. Thaw walked up to White's table, drew a revolver, and fired three times. White died almost at once.

  For a moment, much of the audience thought the shooting was part of the play.

  Thaw walked calmly toward the elevators, the gun held up and pointed at the sky, and handed it to a fireman.

  He was tried for murder. The first jury could not agree. In February nineteen oh eight a second jury acquitted him, on the ground that he had been insane, and the judge sent him to the Matteawan asylum for the criminally insane.

  Look at the gold top again.

  White's firm built the Garden. Demolition began in May nineteen twenty five, to make room for the building you are looking at.
