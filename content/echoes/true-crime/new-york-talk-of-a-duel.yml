detail: >-
  Conviction status: acquitted by reason of insanity, recorded as "exonerated" as the Sickles echo is, because the schema has no "acquitted"; the script says plainly that the jury acquitted him on the ground of insanity and that he was committed to an asylum. Nobody named is alive (Thaw died 1947, Nesbit 1967). The night itself is from the New-York Tribune of 26 June 1906, with the place and the arrest in the Evening Star of the same day; the trials and verdict are in the Evening Star of 1 February 1908 and the New-York Tribune of 2 February 1908. Injuries are not described; the Tribune's detail of where the shots struck is left out on purpose.
