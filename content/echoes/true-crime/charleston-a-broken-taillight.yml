# Drafted by Claude Code (2026-11-11) for the second Charleston pass, following docs/writing-echoes.md (format v2) and docs/14-true-crime.md.
# Listening spot: The public sidewalk at the corner of Remount Road and Craig Road, North Charleston. The traffic stop ended in the auto parts store's car park at this corner; the shooting followed in the cut through behind it. The listener stays on the public sidewalk and is not pointed at any business.
# Position: The Remount Road and Craig Road intersection from the Overture street segments (high confidence for the corner, which the Post and Courier names).
# Conviction status: convicted. Michael Slager pleaded guilty in federal court in May 2017 to violating Walter Scott's civil rights; on 7 December 2017 a federal judge found the killing was second degree murder and sentenced him to 20 years. Slager is living and is public in this case as the convicted officer. The bystander who filmed is living and is not named. No relative is named.
# Sources: three independent publishers, as the rule for a living person requires: The Post and Courier (its own reporting), NBC News (its own report) and CBS News (an Associated Press report).
