script: |
  Stand on the corner and look at the car park of the auto parts store. On a Saturday morning in April, twenty fifteen, a police car pulled a man over here, for a broken taillight.

  The driver was Walter Scott. He was fifty years old, and a father of four.

  The officer was Michael Slager, of the North Charleston police.

  As the officer checked his papers, Scott opened his door and ran. Slager went after him, with his Taser. There was a struggle on the ground.

  Then, over the radio, Slager said: Shots fired. Subject is down. He grabbed my Taser.

  In the days that followed, that was the police account. A traffic stop gone wrong. A man who fought for an officer's Taser.

  But a bystander had been filming on his phone.

  The video began after the struggle. It showed Scott running away, and the officer firing eight times. Five shots hit him. It did not show Scott taking the Taser.

  Slager was charged with murder. His state trial ended with a deadlocked jury. In twenty seventeen, he pleaded guilty in federal court to violating Walter Scott's civil rights. The judge found that the killing was murder, and sentenced him to twenty years in prison.

  Look at the corner again. The radio call said one thing.

  A stranger's phone said another.
detail: >-
  Key facts and their sources. The stop on Remount Road at Craig Road on Saturday 4 April 2015, for a broken taillight, into an auto parts store's car park, Scott running, the Taser and the struggle, the radio call in Slager's words, and the police account in the following days: The Post and Courier (2015 and 2020). Scott's age and children: The Post and Courier (2021) and NBC News. The bystander's video starting after the struggle and showing Scott running and the eight shots, five of which hit him: CBS News (AP) and NBC News, with The Post and Courier. The video not showing Scott taking the Taser: NBC News. The deadlocked state murder trial, the federal guilty plea to violating Scott's civil rights, the judge's finding of murder and the twenty year sentence: NBC News and CBS News (AP), with The Post and Courier (2021). Slager was convicted, so the script states the facts his plea and sentence cover and attributes the Taser claim to him. The Post and Courier article reached through its search is readable without a subscription; a reviewer should confirm it is not metered on a normal visit. The sentencing date (7 December 2017) is in the CBS and NBC reports.
