teaser: Stop at the mosaic and look down.
script: |
  Stop at the mosaic and look down.

  One word. The mosaic was a gift from the city of Naples.

  Turn around. Through the trees, you can still see the Dakota. You walked it in three
  minutes.

  The city named this part of the park after a song rather than after a man. Yoko Ono wanted
  a landscape instead of a statue, and she wanted it dedicated to peace rather than to what
  happened across the road.

  So there are two places, three minutes apart.

  One is where he died. It is unmarked, and people live there.

  The other is a word on the ground, and strangers sit around it all day.

  She chose which one to build.
