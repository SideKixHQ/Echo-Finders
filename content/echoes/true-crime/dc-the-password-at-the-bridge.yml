teaser: "The guard on the bridge had not heard the news. The rider knew the password."
script: |
  Look along Eleventh Street to the river. In April eighteen sixty five, a bridge crossed here, from the Navy Yard to the far shore. The city was still at war, and the bridge was guarded.

  At nine o'clock each night it closed to ordinary traffic. You needed a pass, or the password.

  On the fourteenth of April, the sentry was Sergeant Silas Cobb, of the Third Massachusetts Heavy Artillery. At about a quarter to eleven, a rider came down Eleventh Street and asked to cross.

  He had no pass. But he was calm, and, the Park Service says, he knew the password. He said he was running late, and only wanted to get home. Cobb hesitated. Then he let him through.

  No one had told the sergeant yet. Twenty minutes earlier, at Ford's Theatre, the rider had shot President Lincoln.

  He was John Wilkes Booth, an actor, and he had just given the performance that got him out of Washington. He crossed into Maryland, and stayed free for twelve days, until soldiers cornered him at a farm in Virginia, where he was shot and killed.

  Look across the water.

  The city's only lock that night was a password, and he had it.
detail: >-
  Conviction status recorded as "alleged", following the library's existing Booth echo (the-distance-across-the-street): Booth died before any trial, and his guilt is settled history. No living person is named. The crossing, the time and Cobb's name are from the Park Service's Anacostia Park page; Ford's Theatre's page says he "talked his way across the closed bridge, as the sentries had not yet heard". The New York Times of 28 April 1865 (Library of Congress transcription) reports Booth being shot at the barn; the Park Service gives the twelve days and Port Royal, Virginia. The second independent source for the crossing is the sworn testimony of Sergeant Silas T. Cobb at the conspirators' trial (16 May 1865, Pitman's official record): the Navy Yard bridge, the night of 14 April, half past ten or eleven, a rider who gave the name Booth, said he was going home and was passed. Cobb does not mention a password, so the password rests on the Park Service alone and the script attributes it.
