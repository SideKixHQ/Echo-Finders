teaser: "For a few days in July, this alley paid everyone back."
script: |
  Look down the narrow alley beside you. This is Pi Alley.

  In the summer of nineteen twenty, a man named Charles Ponzi had offices here, and round the corner, on School Street. He had started with one room, at twenty seven School Street.

  His idea was postage. He said he could buy international postal reply coupons cheaply in countries with weak currencies, and cash them in here for more. He promised his investors fifty percent.

  Over eight months, he took in roughly fifteen million dollars. The early investors really were paid. But the money came from the people who invested after them.

  At the end of July, doubts were growing. As early as five in the morning, crowds gathered here to get their money back. Thousands jammed into the square around his offices. The cash was handed out from the Pi Alley office, and a newspaper reported that not a claimant was turned away.

  The crowds came to see Ponzi himself, too. They waited every day to watch him arrive in his limousine, until the police banned it from School Street.

  Then the Boston Post revealed that Ponzi had served two terms in prison. The scheme collapsed in August. On the thirtieth of November, Ponzi pleaded guilty in federal court to using the mails to defraud, and was sentenced to five years.

  Look back down the alley. For a few days that summer, it paid everyone. That was how it worked.
