detail: >-
  Conviction status: convicted (Ponzi pleaded guilty to using the mails to defraud on 30 November 1920 and was sentenced to five years; New-York Tribune and Milwaukee Leader of 30 November and 1 December 1920, from the Associated Press and the United Press, which are independent wires). Nobody named is alive. The postal reply coupon pitch, "roughly $15 million" over eight months, early investors paid from later money, and the Boston Post's revelation of two prison terms are from the National Archives' Prologue (2010). The National Archives says 50 percent in 90 days and the 1920 papers say 50 percent in forty five days, so the script gives only "fifty percent". The crowd, the 5 a.m. start, the Pi Alley cash office and "not a claimant was turned away" are from the Washington Times of 30 July 1920; Ponzi's "one room at 27 School street" is his own account in the same article. The limousine ban is from the New-York Tribune of 1 August 1920. No violence. The last line is a turn, not a claim.
