teaser: "One man held out his hand. The other drew a pistol."
script: |
  Look across the square, to the row of old houses on the far side. In eighteen fifty nine, one of them belonged to a congressman from New York, Daniel Sickles.

  That winter a man kept walking round this square, waving a handkerchief at one of those windows.

  He was Philip Barton Key, the federal prosecutor for this city, and the son of Francis Scott Key, who wrote the Star Spangled Banner. He was signalling to Sickles's wife, Teresa. An anonymous note had already told Sickles about the affair. Teresa confessed, in writing.

  On the twenty seventh of February, Sickles saw Key outside. He armed himself and crossed the square.

  They met on this corner, at about two in the afternoon. Key held out his hand. How are you, he said. Sickles would not take it. You have dishonored my home and my family, he said. Key reached into his pocket. Sickles drew a pistol, and fired three times. Key was carried to the club house close by, and died within minutes.

  Sickles was tried for murder. His lawyers, among them Edwin Stanton, argued that he had been temporarily insane. The White House Historical Association calls it the first time that defence was used in an American court. The jury was out for about an hour. Not guilty. Sickles left the court to cheers.

  Stand on the corner for a moment. It is an ordinary corner now.

  What Key had pulled from his pocket was an opera glass.
