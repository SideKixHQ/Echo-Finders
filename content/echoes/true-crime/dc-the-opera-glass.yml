detail: >-
  Conviction status: acquitted, recorded as "exonerated" as the Lizzie Borden echo is, because the schema has no "acquitted"; the script says plainly that the jury found him not guilty. Nobody named is alive. The shooting at this corner, the handshake, the words, the opera glass and the club house are from the National Intelligencer of 28 February 1859, which reports the testimony of the witness Samuel Butterworth. The note, the handkerchief and Teresa's written confession are from the White House Historical Association. The acquittal is in both the Association's page and the New-York Daily Tribune of 27 April 1859. "First time" is the Association's claim, attributed aloud. Told without injuries.
