teaser: "Two men were convicted of killing Malcolm X. In 2021 a judge said they had not."
script: |
  Look at the long, decorated front of this building on Broadway. It was the Audubon Ballroom.

  On Sunday, the twenty first of February, nineteen sixty five, hundreds of people sat inside to hear Malcolm X speak. His wife was there, pregnant. So were his daughters. Several men opened fire. He was killed on the stage.

  Within weeks, three men were arrested. In March, nineteen sixty six, all three were convicted of murder and sent to prison for life. Two of those convictions were wrong, and it would take fifty six years for a court to say so.

  One of them admitted to the shooting. And he said, at the trial and for years afterwards, that the other two had nothing to do with it. Those two men always said they were innocent. One of them had been at a hospital in the Bronx that morning, with an injured leg. The doctor who treated him testified for him.

  They went to prison anyway.

  Fifty six years later, in November, twenty twenty one, a new investigation found evidence that had been kept from the defence, including F B I files that pointed away from them. A judge in Manhattan threw out their convictions. Muhammad Aziz and Khalil Islam were exonerated.

  Aziz was eighty three, and in the courtroom. He said, the events that brought us here should never have occurred.

  Islam had died in two thousand nine, still insisting he was innocent.

  The District Attorney stood up and apologised.

  Look at the ballroom again.

  The question of who else was in that room with a gun has still not been answered.

