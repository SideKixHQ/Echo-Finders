teaser: "They left behind a lantern, a shovel and a rope. They took the millionaire."
script: |
  Look through the iron fence into the old churchyard, with its trees and its flat stones. Not much to see. But one November morning in eighteen seventy eight, the assistant sexton opened this gate, and saw a heap of fresh earth beyond the trees.

  Someone had dug into one of the vaults.

  It was the vault of Alexander T. Stewart. A merchant, and a millionaire. A store of his would one day become part of Wanamaker's.

  The thieves had come on a cold, rainy night. They lifted the stone off the vault. They pried open the cedar box, cut through the lead lining, unscrewed the coffin lid. And they took him. Clothes and all. They even took the silver plate with his name on it.

  They left behind a new lantern, a small iron shovel, and a piece of rope.

  The papers could not believe it. The churchyard could be seen plainly from the avenue, by people passing at all hours of the night. And the family had been warned. A month earlier, someone had dug here and missed. A letter had threatened to take the body unless money was sent. A night watchman had been hired, and let go only days before.

  The police could find no clue to the robbers.

  The ransom demand was twenty thousand dollars. And according to the city guide of nineteen thirty nine, the remains were not returned for two years.

  Look at the flat stones again.

  For two years, a millionaire was missing from under them.

