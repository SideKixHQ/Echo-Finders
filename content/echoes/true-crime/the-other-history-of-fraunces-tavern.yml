script: |
  This block is often associated with the American Revolution.

  But its history includes a much more recent act of violence.

  On January 24, 1975, at lunchtime, a bomb exploded in the building at 101 Broad Street,
  part of the Fraunces Tavern complex.

  Four people were killed, and dozens were injured.

  The organization known as the FALN claimed responsibility.

  That claim belongs to the historical record. It does not establish the identity of every
  person involved in preparing or placing the bomb.

  Look at the buildings together.

  It is easy to imagine a historic place as belonging to one period: colonial rooms, old
  paintings, Washington's farewell to his officers in 1783.

  People continued using these buildings long after that period ended.

  They came here to work, meet, and eat.

  The bombing became another chapter in the life of this block.

  Standing here, you are beside a place associated with the founding of a country and with
  people whose lives ended almost two centuries later.

  Both histories belong to it.
