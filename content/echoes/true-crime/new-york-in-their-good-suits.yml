script: |
  Look out across this park, past the big steel globe, to the paths and lawns all around it. In nineteen thirty nine and nineteen forty, this was a World's Fair.

  On the Fourth of July, nineteen forty, an electrician at the British Pavilion noticed a bag in a ventilation room. He had seen it the day before. This time he picked it up. And from inside it, people heard ticking.

  Police officers carried it out, to an empty spot behind the Polish Pavilion.

  Detective Joseph Lynch of the bomb squad was at home in the Bronx with his family, on call, when the phone rang. He told his wife he would be back for dinner. He picked up his partner, Ferdinand Socha, on the way.

  There was no protective clothing. It had not been invented yet. They walked up to the bag in their business suits.

  Socha knelt down, and cut a small opening in the case with a pen knife, so Lynch could see inside. Lynch said, It's the business.

  Then it went off.

  Both detectives were killed. Other officers were badly hurt.

  The mayor put fifteen hundred officers on the case. The city offered twenty five thousand dollars for the bomber. Nobody was ever convicted. The police still list it as an open case.

  Afterwards, the city built a truck to carry bombs away safely. Its chamber was woven from steel cable, like a basket.

  Look out across the park again.

  Somewhere out here, two men knelt down in their good suits.

