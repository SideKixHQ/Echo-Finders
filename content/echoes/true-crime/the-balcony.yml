script: |
  Look up at the balcony.

  On April 4, 1968, Martin Luther King Jr. stood there.

  He had come to Memphis to support thirteen hundred striking Black sanitation workers
  seeking better pay and safer working conditions.

  The Lorraine was a place to stay while that work continued.

  Then King was shot and killed on the balcony of his room.

  Pause before looking away.

  This site can become so familiar through photographs that the balcony starts to feel
  like an image rather than a place.

  But it was a place.

  There was a room behind him. A city around him. A campaign still underway.

  The workers’ demands had not disappeared. Neither had the need for the work he was
  doing.

  Today, the museum preserves this location within the larger history of civil rights.

  Look at the balcony once more.

  Remember the reason he was in Memphis, as well as what happened here.
