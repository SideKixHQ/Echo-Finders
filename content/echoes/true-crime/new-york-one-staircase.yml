teaser: "Eighty seven people. One staircase. A building the city had already ordered closed."
script: |
  Look along this stretch of Southern Boulevard. Small shops, a bus going by. There is nothing to tell you that this block was once the scene of the deadliest fire in New York in nearly eighty years.

  On the night of the twenty fourth of March, nineteen ninety, a club here called Happy Land was packed. Young men and women, most of them recent immigrants from Honduras, Ecuador and other countries in Latin America. People came to dance.

  The club should not have been open at all. The city had ordered it closed, for breaking the building and fire codes. And there was only one staircase out.

  Earlier that night, a man named Julio Gonzalez argued with his former girlfriend, who worked at the club. A bouncer threw him out.

  He came back just after three in the morning, with a container of gasoline. He poured it on the staircase, and set it alight.

  Eighty seven people died. Sixty one men and twenty six women. Most of them were under twenty five.

  In nineteen ninety one, Gonzalez was convicted of murder and arson, eighty seven counts of each. He was sentenced to twenty five years to life on every count.

  It happened seventy nine years to the day after the Triangle factory fire in Greenwich Village.

  Look along the block once more. Eighty seven people came here to dance.

  There was one way out.

