# Drafted by Claude Code (2026-11-10) for the second Charleston batch, following docs/writing-echoes.md (format v2) and docs/14-true-crime.md.
# Listening spot: The public sidewalk at the corner of Bull Street and Rutledge Avenue. The 1889 trial reports put McDow's house and office near this corner, with Dawson's home on Bull Street. The listener stays on the sidewalk; no house is pointed at.
# Position: Bull Street and Rutledge Avenue intersection from the street segments in the app's Charleston street file (high confidence for the corner; the exact building is not identified).
# Sources: four 1889 newspapers on Chronicling America that likely share wire copy (counted as one source), the Savannah Morning News's own Charleston reports of 12 March and 29 June 1889, and the South Carolina Encyclopedia entry on Dawson. Corroborated 2026-11-11: the killing in McDow's office on 12 March 1889, the governess, McDow's surrender and self defence claim, the attempt to bury the body, and the acquittal are each in at least two of these.
# The wire report puts the jury out two hours and a quarter; the Savannah Morning News has it retire about 1 o'clock and agree shortly after 2. The script now says only that the jury was not out long.
