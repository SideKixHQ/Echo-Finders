teaser: "He stepped off the car near home. He never got there."
script: |
  Stand on the corner, and look along Bull Street. In March eighteen eighty nine, a man stepped off the horse car near here, on his way home for dinner.

  He was Captain Francis Dawson, the editor of the News and Courier. Two men on the car said he was cheerful. He chatted with them, and got off.

  He went into the office of a neighbour, a doctor named McDow. He never came out alive.

  McDow told the police he had killed him. He said it was self defence. Dawson had come to confront him about the way he was pursuing the family's governess, McDow said, and had struck him with a cane.

  At the trial, a surgeon testified that the bullet had come from behind. And the papers reported that someone had begun to dig in the earth under the house, as if to make a grave.

  The jury was out two hours and a quarter. It found McDow not guilty.

  Dawson's friends said that neither justice, nor the shadow of justice, had been done.

  Look along the street again. His own house was just around the corner, on Bull Street.
detail: >-
  Contemporary reports on Chronicling America: the coroner's jury and McDow's surrender (Evening Star, 15 March 1889); McDow's account of the cane and the governess and the evidence of an attempted burial (Waterbury Evening Democrat, 14 March 1889, Charleston dispatch); the streetcar witnesses, the location near Bull and Rutledge, and the surgeon's testimony that the shot came from behind (Charlotte Democrat, 28 June 1889); the acquittal after two hours and a quarter and the words of Dawson's friends (Butler Weekly Times, 3 July 1889, Charleston dispatch of 29 June). McDow was acquitted, so the script says only what the record shows: that he admitted the killing, claimed self defence, and was found not guilty. Everyone named died long ago.
