teaser: "This university exists because someone misspelled a name on a check."
script: |
  Look at the arches of Lovett Hall, the front door of Rice University.

  This place exists because of a name, misspelled on a check.

  William Marsh Rice was a rich man with deep roots in Houston. He owned the hotel on Main Street where the Capitol of Texas had stood. In his last years he lived in New York. In eighteen ninety six he wrote a will leaving the bulk of his money to found an institute here.

  In September, nineteen hundred, he died in his bed in his New York apartment. He was eighty four.

  His valet, Charles Jones, later confessed that he had killed him with chloroform while he slept. Jones swore he did it for a lawyer, Albert Patrick.

  The prosecution's case was that Patrick had forged a newer will, leaving the fortune to himself, and a set of checks to empty Rice's bank accounts.

  But on one of those checks, the name Albert Patrick was written with a letter missing. A bank clerk who had witnessed Rice's real will looked at it, and grew suspicious. When he telephoned, Jones admitted the old man was dead.

  Patrick was convicted of murder and sentenced to death. He always said he was innocent, and that Jones could not be believed. His sentence was cut to life in prison, and in nineteen twelve the governor of New York pardoned him. He was freed. The conviction was never overturned. Jones, who confessed, was never punished.

  The forged will was thrown out. The fortune came to Houston, and the Rice Institute opened here.

  Look at the arches again.

  One letter.

