# Drafted by Claude Code (2026-11-10) for Houston, Rice University.
# Listening spot: in front of Lovett Hall, the arched front building of Rice University, which William Marsh Rice's fortune built (WPA Houston guide, 1942; Standard History of Houston, 1912). The murder itself happened in New York; this is where its consequence stands.
# Position: Wikidata Q107317794 (Lovett Hall), 29.71677, -95.40098 (high confidence for the building).
# True crime notes for the reviewer: conviction status is "convicted": Albert T. Patrick was convicted of murder; his death sentence was commuted to life, and Governor Dix pardoned him in 1912. A pardon is not an exoneration, and the script says both. Everyone named died long ago (Rice 1900; Patrick and Jones decades later). The valet's confession is attributed to him, and Patrick's denial is said aloud. Key facts: the death, the confession, the conviction and the pardon are each in the 1912 Standard History and in the 1912 newspaper reports.
