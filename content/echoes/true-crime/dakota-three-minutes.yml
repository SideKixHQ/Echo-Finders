# Held 2026-11-11: approved content, but its payoff (strawberry-fields-one-word) is held for sources, and this echo sends the listener there. Release the pair together.
# First of the Central Park West pair, and the better of the two stories in this batch.
#
# The idea is not the murder. It is that the killing and the memorial are three minutes
# apart, and that the gap between them was a choice somebody made. The whole echo exists to
# get the listener to walk that three minutes, which is what the format is for.
#
# Chapman is not named, here or in the second echo. He is alive, convicted, and a matter of
# public record, so naming him would be perfectly safe — this is an editorial decision, not
# a legal one. Notoriety was the point for him, and "a man who had been waiting since the
# afternoon" is better writing than his name anyway. It also keeps the echo pointed at
# Lennon rather than at his killer, which is the Respect value doing its job.
id: dakota-three-minutes
title: Three minutes from here
summary: John Lennon was killed in this archway in 1980. His memorial is across the street.
place: The Dakota, 1 West 72nd Street, Manhattan
at: { lat: 40.77625, lng: -73.97596 }
