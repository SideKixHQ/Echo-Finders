teaser: Look across the street, into the park.
script: |
  Look across the street, into the park. Those trees are Strawberry Fields. It is about a
  three-minute walk, and you are going to make it in a moment.

  Behind you is the Dakota. John Lennon lived here with Yoko Ono and their son. Yoko Ono
  lives here still. This is not a monument, it is a building full of people's homes, so
  stay on the pavement and keep out of the archway.

  On the eighth of December nineteen eighty, at around ten to eleven at night, Lennon came
  back from a recording session. He walked from the car towards that arch. A man who had
  been waiting near the entrance since the afternoon fired five shots, and four of them hit
  him. Earlier the same day, Lennon had signed a record for him.

  The police did not wait for an ambulance. They put him in the back of a patrol car and
  drove him to Roosevelt Hospital, where he was pronounced dead. He was forty.

  There is no marker here. There was never going to be one.

  Cross at the lights and walk into the park.
