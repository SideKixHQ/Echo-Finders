teaser: "Her brother said he watched her type his notes. Nearly fifty years later he took it back."
script: |
  Look across the square at the federal courthouse, the tall tower with the gold pyramid on top.

  In March nineteen fifty one, a husband and wife went on trial in New York, accused of passing atomic secrets to the Soviet Union. Julius and Ethel Rosenberg. Their judge was Irving Kaufman, of the federal court here on Foley Square.

  The government's star witness was Ethel's younger brother, David Greenglass. During the war he had been an Army machinist at Los Alamos, where the bomb was built. He testified that he had passed what he learned there to the Rosenbergs.

  And he said something else. He had seen his sister type up his handwritten notes, on a portable typewriter, in their New York apartment.

  On the twenty ninth of March, the jury found them guilty. On the fifth of April, the judge sentenced them both to death. I consider your crime worse than murder, he told them.

  They were executed at Sing Sing in June nineteen fifty three. They were the only people ever executed in the United States for Cold War espionage. Some historians have said the evidence against Ethel was weak, compared with the evidence against her husband.

  Then, in two thousand one, nearly fifty years after her death, her brother admitted he had lied under oath. He told a reporter that he did not know who had typed the notes. To this day, he said, I can't remember that the typing took place. He said it was likely his own wife who had typed them.

  In two thousand fifteen, after his death, his grand jury testimony was finally released. It shows Julius at the centre of a spy ring.

  It does not mention the typing.
