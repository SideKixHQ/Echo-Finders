detail: >-
  Conviction status: convicted (Julius and Ethel Rosenberg, 29 March 1951; Evening Star of 29 March and 5 April 1951). Everyone named is dead: Julius and Ethel Rosenberg (1953), David Greenglass (2014), Ruth Greenglass (2008, not named aloud), Irving Kaufman (1992). The Rosenbergs' two sons are alive and are deliberately not named or mentioned. Morton Sobell, convicted with them, is not named. The recantation is from CBS News (2001, with AP), corroborated by NPR (2015) and CBS News (2015, AP); the grand jury release is in both 2015 reports. "Only people executed for Cold War espionage" is CBS/AP's claim. The script does not say Ethel was innocent; it says what her brother later said and what the released testimony does and does not contain. Execution is mentioned, not described.
