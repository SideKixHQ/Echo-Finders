# Listening spot: Foley Square (Thomas Paine Park), the public plaza in front of the federal courthouse at 40 Centre Street, Lower Manhattan.
# Position: the Evening Star of 12 February 1953 gives Judge Kaufman's address as the "Federal Court Building, Foley Square"; the pin is in the open plaza across Centre Street from the courthouse steps (high confidence on the square, medium that the trial courtroom was in the 40 Centre Street building rather than another federal building on the square: the sources say "Foley Square" and "the federal courthouse" without a street number). About 180 m from the nearest echo (African Burial Ground).
