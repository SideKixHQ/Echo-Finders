# Drafted by Claude Code (2026-11-11) for the second Savannah pass, following docs/14-true-crime.md and the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: the East Bay Street sidewalk in front of the U.S. Custom House (1852), 1 to 3 East Bay Street at Bull, whose courtroom held the federal trials over the slave ship Wanderer.
# Position: Bay at Bull and Bay at Drayton from the street segments in the app's Savannah street file, a point about a third of the block east of Bull set onto the south sidewalk (medium confidence; the nomination gives a 110 foot front on Bay). About 45 m from the City Hall dome echo and 80 m from the Cotton Exchange echo, which tell other stories; a reviewer should check the triggers do not crowd each other at this corner.
#
# True crime, per docs/14-true-crime.md:
# - Conviction status: alleged. The men named were indicted; the script reports the first crew trial, which ended in a hung jury, and two crew members discharged. No conviction is claimed, and none was found in a fetched source.
# - Living people: none (1858 to 1860).
# - Independent sources: the National Register nomination for the Custom House (NPS, 1974) for the building, its courtroom and the 1860 Wanderer case; the National Archives at Atlanta finding aid for the landing (407 Africans, Jekyll Island, 28 November 1858), Lamar's role and the indictments; the Savannah Daily Morning News of November and December 1859 for the trial testimony, the 8 to 4 jury and the discharges. Three publishers, none drawing on another.
# - What is not said: how anyone on the ship died, beyond the pilot's sworn words that he saw one body thrown overboard.
