teaser: "Six granite columns. Behind them, a jury that could not agree."
script: |
  Look at the granite building on this corner, and its six tall columns. It was built as the custom house, and inside it was a courtroom for the federal courts.

  In that courtroom, the United States tried to punish the men behind one of the last slave ships ever to reach this country.

  The ship was a racing yacht called the Wanderer. Bringing enslaved people into the United States was against federal law. In November eighteen fifty eight, the Wanderer landed four hundred and seven Africans on Jekyll Island, down the coast. The National Archives names a Savannah man, Charles Lamar, as the central figure, who stayed behind the scenes.

  A year later, men from the crew went on trial here. A pilot named James Chubbs swore that he had brought the Wanderer in. He was told there were four hundred and thirteen people on board. About daylight, he said, he saw one dead body thrown overboard.

  The jury could not agree. The Morning News reported eight for acquittal and four for conviction. The judge declared a mistrial. Days later, two of those prisoners were discharged.

  Look up at the columns again.

  Four hundred and seven people were landed on that beach. Inside these walls, twelve men could not agree on anyone's guilt.
detail: >-
  National Register nomination (NPS, 1974): the Custom House at East Bay and Bull, "a splendid court room for the Circuit and District Courts" in the 1852 description, "six fluted solid granite columns", and "In 1860, the case of the yacht 'Wanderer' was tried before the court as the last violation of the law against the importation of slaves." The script says "one of the last slave ships", not the last. National Archives at Atlanta finding aid: "landing 407 Africans on Jekyll Island, GA on November 28, 1858", Lamar "appears to be the central figure" and "stayed behind the scenes", the circuit court minutes listing indictments for "importing Africans, holding Africans, Piracy". Daily Morning News, 18 November 1859: the pilot "James C. Chubbs" testified he piloted the Wanderer in, "Was in formed by Capt. Cole that there were 413 negroes on board. Saw one dead body thrown overboard about daylight". 28 November 1859: "the jury were discharged ... Judge Wayne announcing it as a miss-trial. We understand that the jury stood eight lor acquittal and four for conviction"; the prisoner Brown was held for retrial. The nomination dates the case to 1860; the first trial reported here was in November 1859, and the paper also reports trials in April and May 1860. 2 December 1859: "Two of the Wanderer prisoners, Rajesta and Aguirra ... were discharged." The outcome of the later trials, including any against Lamar, is not in a fetched source and is not told. The script uses the sources' figure of 407 landed and the pilot's 413 on board as each source gives it.
