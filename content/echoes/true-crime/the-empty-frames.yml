script: |
  Look at the empty frames.

  In most museums, an empty frame means something is being moved or restored.

  Here, it means something was stolen.

  Early on March 18, 1990, two men dressed as police officers arrived at the Isabella
  Stewart Gardner Museum. They claimed they were responding to a disturbance.

  A guard let them inside.

  The men restrained the guards and stole thirteen works of art.

  Among the missing pieces were paintings by Rembrandt and Vermeer. The thieves left
  behind spaces that visitors would continue to see for decades.

  Pause beside one of those spaces.

  A museum normally asks you to examine what is present: the brushwork, the light, the
  expression on a face.

  This room also asks you to notice what is missing.

  The theft remains unresolved, and the museum continues seeking the return of its art.

  Those frames are waiting.

  The most striking thing in this room may be something nobody can show you.
