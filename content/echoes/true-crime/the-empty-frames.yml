script: |
  Look at the empty frames.

  In most museums, an empty frame means something is being moved or restored.

  Here, it means something was stolen.

  Isabella Stewart Gardner built this place after 1898, as her house and her museum.

  Early on March 18, 1990, two men in police uniforms rang the intercom at the Isabella
  Stewart Gardner Museum. They said they were responding to a disturbance.

  The guard on duty broke protocol and let them inside.

  The men restrained the guards and stole thirteen works of art.

  Among the missing pieces were paintings by Rembrandt and Vermeer. The thieves cut two
  Rembrandts from their frames, and left the frame of a Manet behind.

  Pause beside an empty frame.

  A museum normally asks you to examine what is present: the brushwork, the light, the
  expression on a face.

  This room also asks you to notice what is missing.

  The theft remains unresolved, and the museum continues seeking the return of its art.

  Those frames are waiting.

  The most striking thing in this room might be something nobody can show you.
