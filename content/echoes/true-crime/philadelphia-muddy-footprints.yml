script: |
  Look at the pavement here, in front of the great stone wall. Somewhere under your feet, in the spring of nineteen forty five, there was a tunnel.

  It started inside, in Cellblock Seven, cell sixty eight. The man in that cell was a burglar named Clarence Klinedinst. Everyone called him Kliney. He was a mason, and the prison trusted him to repair its plaster and stone. So when he asked if he could re plaster his own cell, the warden said yes.

  Behind a wooden panel, Kliney started digging.

  It took about a year. Fifteen feet down. Ninety seven feet out, under the wall, toward this street. Then fifteen feet up. He shored it with wood. He even put in lights.

  On the third of April, nineteen forty five, Kliney and his cellmate broke through the ground out here. Ten more men followed them up. One of them was the most famous bank robber in America. Willie Sutton. Slick Willie. Sentenced for the machine gun robbery of a Philadelphia bank.

  Sutton was caught within minutes, two blocks away. He later explained why, the prison says. When he came out on the street, he was wet through, and covered in mud. He looked back, and saw his own muddy footprints, leading down the street.

  Every man was caught. One of them came back on his own, a week later. He rang the doorbell, and asked to be let in. He was hungry.

  Look down at the pavement again. The guards filled the tunnel with ash.

  A year of digging, undone by a trail of mud.
