# Drafted by Claude Code (2026-11-11) for Philadelphia (Fairmount, Eastern State Penitentiary), second pass, following docs/writing-echoes.md (format v2) and docs/14-true-crime.md. Male narrator per content/voices.yml.
# Listening spot: The Fairmount Avenue sidewalk in front of Eastern State Penitentiary, toward Twenty Second Street, where the 1945 tunnel came up. The site's tour says a painted line now traces the tunnel's path.
# Position: west of the main gate along Fairmount Avenue, about 100 m from the existing Eastern State echo (the-prison-corridor, at the gate). Eastern State is outside the app's street map, so the line of Fairmount Avenue is taken from that echo's pin (medium confidence; widened radius).
# Key facts and their sources (docs/14-true-crime.md): the April 1945 escape of twelve men, Sutton among them, through a tunnel under the wall to Fairmount Avenue, and that all were caught, are in both Eastern State Penitentiary's audio tour transcript (the institution's own account) and the Encyclopedia of Greater Philadelphia. Klinedinst's cell, the dimensions, the muddy footprints and James Grace's return are in the Eastern State transcript only, and are attributed to it in the script. Sutton was convicted (Corn Exchange Bank robbery). No one named is alive.
