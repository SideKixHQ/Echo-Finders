teaser: "Everyone knows the number. The number was wrong."
script: |
  Look along Austin Street. Shops, a railroad station, apartment windows above. It looks like a safe place to come home late.

  In March, nineteen sixty four, a woman named Kitty Genovese came home along this street from work, at three in the morning. She was twenty eight. She managed a bar.

  A man named Winston Moseley attacked her here with a knife. A neighbour shouted from a window. Leave that girl alone. Moseley ran, and then came back, and found her inside the back of her building. She died on the way to hospital. Moseley was convicted of her murder, and died in prison more than fifty years later.

  It was one of more than six hundred murders in the city that year. It might have been forgotten.

  But two weeks later, a newspaper put it on the front page. Thirty eight respectable, law abiding citizens, it said, had watched, and not one of them had called the police.

  The number had come from the police commissioner, over lunch with an editor.

  And it was wrong. Nobody saw the whole attack. Many people heard only noises, and thought it was a quarrel or a drunk. Two people did call the police. And a seventy year old neighbour went out into the dark, and held Kitty in her arms until help came.

  The wrong version is the one the world remembers. It became a lesson about strangers, taught in classrooms everywhere.

  Remember the other one.

  Somebody went out.

