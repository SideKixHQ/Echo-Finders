script: |
  Look up at the great stone face of City Hall. In nineteen twenty nine, the police station and the courts were inside. And on the night of the sixteenth of May, they brought in the man who ran Chicago's beer runners.

  Al Capone had come up from a meeting in Atlantic City, with his bodyguard, Frank Cline. That evening, two Philadelphia detectives were watching the crowds coming out of the movie theaters, looking for anyone suspicious. They spotted two men leaving a picture house. Capone and Cline did not resist. Each was carrying a thirty eight calibre pistol.

  They were brought here. At a midnight hearing, bail was set at thirty five thousand dollars each. As he was led away, Capone wiped the sweat off his brow. This is some city, he said. They work fast here. But I'll beat this rap yet.

  He did not. In less than twelve hours, a grand jury had indicted him for carrying a concealed weapon. That same day, both men pleaded guilty. The judge gave them the most the law allowed. One year.

  Some people in Philadelphia whispered that Capone had wanted to be arrested, to hide from his enemies. The mayor said he believed Capone was really glad to go to jail. Capone denied it.

  He served his time in Eastern State Penitentiary. On the day of his release, hundreds of people waited outside the gate. But the warden had moved him out in secret.

  Look at City Hall again. This is some city, he had said.

  They work fast here.
