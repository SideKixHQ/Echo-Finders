# Listening spot: The east side of City Hall, on East Penn Square facing Juniper Street and Market Street East; the 1929 central police station and courts were inside City Hall.
# Position: near the Overture place "Philadelphia City Hall's East Facade" (39.952361, -75.162843), moved onto the East Penn Square sidewalk; kept apart from the existing City Hall echoes on the north, south and west sides (medium confidence: the sources say City Hall, not which room).
# Key facts and their sources (docs/14-true-crime.md): the arrest leaving a motion picture house, the pistols, City Hall, the guilty pleas and the one year sentence are in both the Evening Star (Associated Press, 17 May 1929) and the Washington Daily News (18 May 1929). Eastern State and the secret release rest on the Eastern State Penitentiary audio tour, which is the institution's own account. No one named is alive.
