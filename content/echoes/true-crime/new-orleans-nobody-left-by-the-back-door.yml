teaser: "One staircase in. One back door out."
script: |
  Find the plaque at this corner. The bar it remembers was upstairs, on the second floor of this building. You could not see it from the street. One staircase went up, and it was the only way in.

  On a Sunday night, the twenty fourth of June, nineteen seventy three, someone set a fire in that stairwell. The windows had bars on them.

  A bartender named Buddy Rasmussen leaped over the bar and yelled, follow me, follow me. He led people out through a back door. It turned out to be the only way out.

  Thirty two people died. No one was ever charged. Some churches would not bury the dead, and some families would not claim them.

  A pastor named Troy Perry called church after church, looking for somewhere to hold a service. He says they laughed in his face. At last, one Methodist pastor said yes. The church filled up, standing room only.

  Across the street, the press and the television cameras were waiting. To be photographed coming out could cost someone a job, or a family. So Perry told them there was another way. Down a hallway, there was a door to the street.

  Look at the plaque again.

  This time, nobody left by the back door.
detail: >-
  The Up Stairs Lounge fire of 24 June 1973 is officially unsolved; no one was charged. This echo does not name the man most often suspected, who died in 1974, because the story belongs to the thirty two people who died and to those who mourned them. The memorial service Troy Perry describes was held at a Methodist church; the National Park Service podcast notes the first memorial in the French Quarter was held at St. Mark's Church on 1 July 1973.
