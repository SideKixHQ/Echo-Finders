teaser: "From the yard of this jail, you could see the Capitol."
script: |
  Look at the long federal office building on this block, between Seventh and Eighth Streets. Then turn east, and find the Capitol dome.

  In eighteen forty one, on this block, stood a house that looked like a quiet private residence. Painted yellow, set back behind poplar trees. It was a jail.

  Solomon Northup was a free man from New York. He played the violin. Two men offered him work with a circus, and brought him to Washington. They arrived the evening before President Harrison's funeral. The next day, they walked with him around the Capitol grounds, and bought him drinks.

  By evening, he was very ill. In the night, someone led him out into the street, towards a light in a window. That is the last thing he remembered.

  He woke alone, in the dark, in chains. His money and his free papers were gone. He was in a cellar here, in a slave pen run by William Williams. A slave dealer named James Burch told him he was his slave, and would be sent to New Orleans.

  He was. Northup spent twelve years enslaved in Louisiana before he was freed, in eighteen fifty three.

  On his way home, he came back through Washington, and had Burch arrested for kidnapping. Burch was acquitted. Northup wrote that a human tribunal had permitted him to escape.

  Turn east again, to the dome. Northup described this view himself.

  A slave pen, he wrote, within the very shadow of the Capitol.
