detail: >-
  Conviction status: alleged. Burch was charged with kidnapping in Washington in January 1853 and discharged; Northup's own book records the hearing and calls it an acquittal. The two men who brought him to Washington are not named in the script. Nobody named is alive. The house's appearance, the poplar trees and the site are from the White House Historical Association (Jeff Forret); the drink, the night, the waking, the dealer, the view of the Capitol and the hearing are from Northup's narrative of 1853. The Association says he was drugged and kidnapped from the National Hotel; Northup calls it Gadsby's Hotel, so the script names neither. Told without the beatings in the pen.
