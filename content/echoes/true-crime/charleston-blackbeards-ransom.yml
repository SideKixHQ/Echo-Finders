teaser: "The pirate wanted medicine. Or he would send back heads."
script: |
  Look out at the harbour, toward the open sea. In May of seventeen eighteen, four ships sat off the bar out there, with at least sixty guns between them.

  They belonged to the pirate called Blackbeard.

  For a week, he blockaded the port. He took eight or nine ships as they came and went. And he took hostages.

  One of them was Samuel Wragg, a member of the governor's council. An old history of the city says Wragg's little son was taken too.

  Then a small boat rowed up to the town's wharf, with a message for the governor.

  The message was a list. Blackbeard wanted medicines. If they were not sent, it said, the heads of the prisoners would be presented to the council instead.

  Governor Robert Johnson was furious. He paid anyway. A chest of medicine went out to the pirate ships.

  The same history says the hostages were stripped of everything they had, and put ashore almost naked.

  Blackbeard was never tried for any of it. Six months later, he was cornered at Ocracoke, in North Carolina, and killed.

  Look out at the harbour again.

  The ransom for a town was a box of medicine.
detail: >-
  The South Carolina Encyclopedia entry on Blackbeard (Lindley S. Butler) gives the four ship flotilla with at least sixty guns, the blockade of Charleston for a week in mid May 1718, the eight or nine ships plundered, the hostages including the councilman Samuel Wragg, the threat to the hostages, Governor Robert Johnson's reluctant ransom of a chest of medicine, and Blackbeard's death at Ocracoke on 22 November 1718. Harriott Horry Ravenel's history of Charleston (1906) independently gives the boat at the Charles Town wharf, the list of drugs and the threat to send the heads of Wragg, his little son and others to the council, the governor's fury, and the hostages robbed and sent ashore almost naked. The son and the stripping rest on Ravenel alone, so the script attributes them to "an old history of the city". Blackbeard was never tried, so the status is alleged; the script says plainly that he was never tried.
