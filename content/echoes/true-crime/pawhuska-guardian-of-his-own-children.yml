teaser: "A government ledger named the guardian of two Osage children. It was their father."
script: |
  Look up the hill at the old agency buildings.

  In the early nineteen twenties the federal government decided which Osage were unfit to control their own money.

  Those it judged incompetent were given guardians.

  Guardians often used the system, in the writer David Grann's words, to swindle the very people they were supposedly protecting.

  The National Archives keeps a handwritten ledger of those guardians, the Register of Guardians, from 1919 to 1924.

  Mollie Burkhart was Osage. She and her family were victims of William Hale, who planned the killing of several Osage people to inherit their oil rights and money.

  Hale brought in his nephew, Ernest Burkhart, to help.

  Ernest had married Mollie. He was later arrested for his part in the deaths of her family.

  Now open the register at their children. The guardian listed for them is Ernest.

  The system meant to protect the children's money put it in their father's hands.
