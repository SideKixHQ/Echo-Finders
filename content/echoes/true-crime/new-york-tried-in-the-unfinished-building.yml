teaser: "They tried him inside the courthouse. It still was not finished."
script: |
  Look up the steps at the marble building in front of you. Its builders called it the new county courthouse. Everyone else calls it the Tweed Courthouse.

  William Tweed and his Ring ran this city and county while it went up. Building began in eighteen sixty one. A few days later, Tweed bought a marble quarry in Massachusetts, and a large part of the marble for this courthouse was bought from it.

  The state authorised about four and a half million dollars for the job. In nineteen fourteen, a city board put the real cost at between eleven and twelve million. Almost every major contractor on it was tied to the Ring, and sent in padded bills. Some of the contractors did not even exist.

  In July eighteen seventy one, the New York Times began printing the courthouse payments, copied by a county auditor from the Comptroller's own books. Tweed was arrested that October.

  His trial was held in the Court of Oyer and Terminer, here, in this courthouse, which was still not complete. In November eighteen seventy three, the jury came back. Guilty, on the counts covering the bills of Garvey and Keyser, two of the men whose courthouse accounts the Times had printed. The newspapers' bulletin boards put it in big letters. Tweed Guilty. A Verdict at Last.

  He was sentenced to twelve years. The Court of Appeals cut it to one. Held again on new charges, he escaped his guards in eighteen seventy five, and fled to Cuba and then to Spain, where officials knew his face from a Thomas Nast cartoon. He was brought back, and in April eighteen seventy eight he died in the Ludlow Street Jail.

  Look at the steps again.

  The records of what was paid for this building were a large part of the evidence that brought him down. They tried him inside it, and they had not finished it yet.
