detail: >-
  Conviction status: convicted (November 1873, New-York Tribune of 20 November 1873 and the Landmarks Preservation Commission report). Nobody named is alive. The verdict counts are from the Tribune ("Keyser, Garvey, and Davidson counts"); the LPC report says he was convicted on 204 counts, which the script does not repeat because the two sources frame the counts differently. Cost figures, the quarry, the contractors, the Times exposure, the trial in the unfinished building, the sentence, the escape and the Nast cartoon are from the LPC report; the death in Ludlow Street Jail is in both the LPC report and The Sun of 13 April 1878. No violence is described.
