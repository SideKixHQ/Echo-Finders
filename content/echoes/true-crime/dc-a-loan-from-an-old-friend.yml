detail: >-
  Conviction status: convicted. Fall was convicted of accepting the bribe on 25 October 1929 (Washington Times, same day, and the Associated Press report of Doheny's trial in the Evening Star, 22 March 1930, which says Fall "Was Convicted in Case"). Doheny was acquitted of giving it on 22 March 1930 (Evening Star). The satchel and Doheny's admission before the Walsh committee are from the Producers News of 1 February 1924, a Montana paper, the only fetched source for the satchel, so that detail rests on one source. The Caucus Room as the place of the Teapot Dome hearings is from the Architect of the Capitol. Everyone named is long dead. Strictly, Fall's bribe was for the Elk Hills lease in California; Teapot Dome in Wyoming went to Harry Sinclair, which is why the script says Teapot Dome only of the hearings. Fall's sentence (a year in prison and a fine) is left out for want of a fetched source.
