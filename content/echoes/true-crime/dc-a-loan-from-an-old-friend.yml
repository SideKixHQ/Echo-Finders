teaser: "One jury said he took a bribe. The next said nobody gave one."
script: |
  Look at the corner of the Senate office building in front of you, the Russell Building. Inside, up twin marble staircases, is its Caucus Room. In nineteen twenty three and twenty four, that room held the hearings into the Teapot Dome scandal.

  It was about oil. Under President Harding, the Secretary of the Interior, Albert Fall, leased naval oil reserves to private companies. One lease, to the oil fields at Elk Hills in California, went to a company of Edward Doheny's.

  Early in nineteen twenty four, Doheny came before Senator Walsh's committee and admitted that he had given Fall one hundred thousand dollars. In cash. Carried to Washington in a satchel by his own son.

  It was a loan, Doheny said. A loan from one old friend to another.

  In October nineteen twenty nine, a jury of eight men and four women found Albert Fall guilty of accepting a bribe of one hundred thousand dollars from Doheny, in exchange for the lease. They had taken twenty three hours and fifty minutes. Fall received the verdict slumped in the invalid's chair he had used through the trial.

  In March nineteen thirty, another jury heard the case against Doheny himself, for giving the same money. That jury accepted that the hundred thousand dollars was a loan, and acquitted him.

  Look at the building again. One man was guilty of taking the money. The other was not guilty of giving it.
