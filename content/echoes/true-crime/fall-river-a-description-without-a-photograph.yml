teaser: "Two years before the trial, she described her own face on a passport form."
script: |
  This house is famous for a crime. Before that, here is how its best known resident once described herself.

  In June 1890 a woman from Fall River signed a passport application, to sail for Europe.

  Passports did not need photographs then. So she wrote a description instead.

  Five feet three inches tall. Grey eyes. Light brown hair. And a full face.

  Her name was Lizzie Borden.

  Two years later she was arrested and tried for the murder of her father, Andrew, and her stepmother, Abby.

  A jury acquitted her.

  Her name lives on anyway, in the rhyme about forty whacks.

  A jury cleared her. The rhyme never has.
