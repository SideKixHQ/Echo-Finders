script: |
  Watch the curve of Elm Street.

  On November 22, 1963, President John F. Kennedy’s motorcade passed through this plaza.

  People had gathered to see him.

  At about twelve-thirty, Kennedy was shot while riding along Elm Street.

  He was taken to Parkland Memorial Hospital, where he was pronounced dead.

  Look toward the former Texas School Book Depository.

  The Warren Commission concluded that Lee Harvey Oswald fired from that building. Later
  investigations and decades of debate followed.

  This short account does not settle every disputed question.

  But the central event is documented: a president was fatally shot during a public
  motorcade on the street beside you.

  Notice how compact the setting is.

  The road. The windows. The sidewalks where witnesses stood.

  An event that expanded into millions of pages of investigation began within this small
  stretch of city.

  You can stand beside the route.

  You cannot recover the certainty people had before the motorcade reached it.
