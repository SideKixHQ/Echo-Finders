script: |
  Watch the curve of Elm Street.

  On November 22, 1963, President John F. Kennedy's motorcade turned here, off Houston Street and onto Elm.

  People had gathered to see him. He waved to the crowd outside the Texas School Book Depository as he passed it.

  The clock on top of that building said twelve thirty. Seconds later, shots rang out, and Kennedy was hit while riding along Elm Street.

  He was taken to Parkland Memorial Hospital, where he was pronounced dead at one o'clock.

  Look toward the former Texas School Book Depository.

  According to the Warren Commission, the shots were fired from a sixth floor window of that building, and they were fired by Lee Harvey Oswald. Oswald never stood trial. He was shot dead two days later, in the basement of the Dallas police building. Years afterwards, a committee of the House of Representatives agreed that Oswald fired, but concluded that the President was probably assassinated as a result of a conspiracy.

  This short account does not settle every disputed question.

  But the central event is documented: a president was fatally shot during a public motorcade on the street beside you.

  Notice how compact the setting is.

  The road. The windows. The sidewalks where witnesses stood.

  An event that has been investigated ever since began within this small stretch of city.

  You can stand beside the route.

  You cannot recover the certainty people had before the motorcade reached it.

