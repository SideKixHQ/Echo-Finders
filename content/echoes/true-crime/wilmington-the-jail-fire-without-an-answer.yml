script: |
  Before this was a handsome house, it was Wilmington's jail. The museum's timeline
  records that its roof burned in 1768 under suspicious circumstances.

  Suspicious is the crucial word. The surviving account does not give us a proven culprit
  or a settled motive. Calling it a solved arson would turn a historical uncertainty into
  an accusation.

  The fire nevertheless changed what happened to the property. John Burgwin subsequently
  acquired the site, and the house built in 1770 incorporated the old jail's walls.

  Look at the building from the public street. It can seem like a clean beginning: a
  merchant's residence rising on a downtown corner. Underneath lies the unresolved damage
  that made the transformation possible. This case ends with a new building, not an
  identified offender. The physical aftermath survives more clearly than the answer.
