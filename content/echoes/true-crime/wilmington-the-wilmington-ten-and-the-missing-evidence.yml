script: |
  In 1971, students protesting unequal treatment during school desegregation made a
  local church their headquarters. In February 1971, Mike's Grocery was firebombed.

  Ten people were convicted on charges connected with the fire. Their case became known
  as the Wilmington Ten. The evidence and prosecution were later exposed as deeply
  flawed, including perjured testimony.

  The convictions were overturned by the federal appeals court in 1980. Governor Beverly
  Perdue issued pardons in 2012. Responsibility for the grocery arson remains unclear;
  these ten people should not be presented as its proven perpetrators.

  Listen beside the marker, not inside the church without permission. This true crime
  story includes a crime committed against justice itself: people losing years while a
  false case was challenged. The ending is correction, but correction cannot return the
  time already taken.
