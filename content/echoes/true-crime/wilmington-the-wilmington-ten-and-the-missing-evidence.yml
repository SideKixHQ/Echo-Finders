    source: 1
    quote: "Demanding fairer treatment and a Black studies curriculum, Black high school students, led by civil rights activist Ben Chavis, began a boycott of classes in late January 1971. The protesters established headquarters at a local church, which became the epicenter of violence after the school board rejected their demands."
  - says: "In February 1971, Mike's Grocery was firebombed."
    source: 1
    quote: "On February 6, 1971, Mike's Grocery, a mom-and-pop store in Wilmington, was firebombed and burned."
  - says: "Ten people were convicted on charges connected with the fire."
    source: 1
    quote: "About a year later local and state authorities, intent on punishing Chavis, arrested him, eight Black high school students and a White anti-poverty worker on charges related to the arson at Mike's. Despite the lack of real evidence tying them to the arson, the prosecutor secured guilty verdicts by using perjured testimony and illegally excluding African Americans from the jury."
  - says: "Their case became known as the Wilmington Ten."
    source: 1
    quote: "The case garnered national press attention, and in 1976, Amnesty International became involved in an effort to free the Wilmington 10."
  - says: "The evidence and prosecution were later exposed as deeply flawed, including perjured testimony."
    source: 1
    quote: "Key witnesses recanted their testimony in the late 1970s and investigatory pieces by 60 Minutes, the New York Times and others suggested evidence had been fabricated."
  - says: "The convictions were overturned by the federal appeals court in 1980."
    source: 1
    quote: "The convictions of the Wilmington 10 were ultimately overturned by the U.S. Court of Appeals for the Fourth Circuit in 1980."
  - says: "Governor Beverly Perdue issued pardons in 2012."
    source: 1
    quote: "Governor Beverly Perdue issued them pardons in 2012."
  - says: "Responsibility for the grocery arson remains unclear; these ten people should not be presented as its proven perpetrators."
    source: 1
