script: |
  Look into the cells.

  In June 1962, the men inside needed the guards to believe they were sleeping.

  So they left faces on their pillows.

  Frank Morris and brothers John and Clarence Anglin made realistic dummy heads, complete
  with human hair.

  Behind the cells, they prepared an escape route, enlarging the vent holes in their back walls. They also made crude life vests and a raft
  from prison-issued raincoats.

  On the night of June 11, the three men disappeared from their cells.

  By morning, the deception was discovered.

  The faces were still in bed.

  The men were gone.

  Their ultimate fate has never been conclusively established. They are officially listed as missing, presumed drowned. The escape does not prove
  they survived the bay.

  When you later look toward the mainland, notice the water between here and there.

  The men overcame the walls, the checks, and the locks.

  The unanswered part begins beyond the island.

  They left behind something that looked like sleep, and a mystery that never settled.
