teaser: "Two words, shouted over a cemetery fence. A father in a parked car heard them."
script: |
  Look along the cemetery fence. Rows of headstones on the other side. In nineteen thirty two, this was a dirt road at the edge of the cemetery.

  On the night of the second of April, a car stopped here. Behind the wheel was Charles Lindbergh, the flier who had crossed the Atlantic alone.

  A month before, his baby son had been taken from his crib, at home in New Jersey. There had been a ransom note. And then more notes, and a go between, a Bronx man named John Condon, who had offered his help.

  Condon got out of the car and walked to the fence. Lindbergh stayed where he was.

  From the dark, among the graves, a voice called out. Two words.

  Hey, Doctor.

  Lindbergh heard it from the car. One history of the case says the strange accent of that voice was fixed in his brain for ever.

  The man called himself John. Condon went back to the car for the money, and handed him fifty thousand dollars. In return he got a note, saying where to find the boy.

  The boy was not there. In May, he was found dead, not far from his home.

  But every serial number on that money had been written down. In September, nineteen thirty four, one of those bills led police to a man in the Bronx named Bruno Richard Hauptmann. Thousands of dollars of the ransom were in his garage.

  Lindbergh listened to him say those two words. Hey, Doctor. And he swore it was the same voice.

  A jury in New Jersey found Hauptmann guilty of murder. He was executed in nineteen thirty six.

  Look at the fence again.

  Two words, in the dark, and a father who never forgot them.

