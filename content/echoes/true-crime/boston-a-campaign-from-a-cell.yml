detail: >-
  Conviction status: convicted (James M. and Thomas F. Curley, conspiracy against the United States by impersonation at a civil service examination; sentenced to two months in jail on 7 November 1904 after the Supreme Court declined to disturb the judgment; Daily Kennebec Journal, Associated Press, 8 November and 17 December 1904). Nobody named is alive (James Michael Curley died 1958). The Charles Street Jail, the renomination from the cell and the re-election are in the Daily Kennebec Journal of 15 December 1904 and the Billings Gazette of 20 December 1904 (both wire reports, counted as one source), and are corroborated by NBC News (2007, Associated Press) and the Boston Globe (2024). "For a friend" is NBC's wording; the 1904 report names the two men for whom the Curleys sat the exams, and the script does not. "Jailbirds" is an editorial in the Daily Kennebec Journal of 17 December 1904, attributed aloud to a paper in Maine. The 1947 prison term, at Danbury, and "fourth non-consecutive term as mayor" are from the Boston Globe. The jail's opening and closing years are from NPR (2007), and the Alibi bar in the former drunk tank from NBC. No violence.
