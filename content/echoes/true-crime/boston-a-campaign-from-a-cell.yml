teaser: "He was in a cell when Boston voted for him. He won."
script: |
  Look at the big granite building across from you, with the tall arched windows. It is a hotel now, the Liberty. For more than a century it was the Charles Street Jail.

  In the winter of nineteen oh four, one of the men inside was a Boston alderman, James Michael Curley.

  He and his brother Thomas, a state representative, had been convicted of taking civil service examinations in other men's names. Curley had sat the exam for a friend who wanted a job.

  They fought it all the way to the Supreme Court, and lost. The judge sentenced them both to two months in jail. He said their effrontery was only equalled by their boldness in running for office after they had been convicted.

  Outside the federal building, several hundred men cheered them on their way to jail.

  Curley stayed on the ballot. He was renominated for the Board of Aldermen after his sentence had begun, and a newspaper reported that he ran his entire campaign himself, from his prison cell.

  In December, while he was still in here, Boston re-elected him.

  A paper in Maine called the brothers jailbirds. It made no difference. Curley went on to be mayor of Boston four times. During his fourth term, convicted of mail fraud at the age of seventy two, he went to federal prison again.

  The jail closed in nineteen seventy nine. The hotel bar is in the old drunk tank.

  It is called the Alibi.
