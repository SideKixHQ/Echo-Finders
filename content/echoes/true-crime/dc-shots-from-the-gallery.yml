teaser: "Visitors sit up here to watch the House. In 1954, four of them came to shoot."
script: |
  Look down from the gallery onto the floor of the House. This is where the public sits, to watch its representatives at work.

  On the first of March, nineteen fifty four, the House was debating, and the floor was crowded. Up in this gallery sat four visitors, three men and a woman, Puerto Rican nationalists from New York.

  They stood up with pistols, and fired down onto the floor. Nearly thirty shots, by one count. They unfurled a Puerto Rican flag, and shouted, Viva Puerto Rico libre.

  Five congressmen were wounded. None of them died.

  The four were sentenced to long prison terms. The woman who led them, Lolita Lebron, spent twenty five years behind bars. In nineteen seventy nine, President Carter granted all four clemency.

  Their cause was independence for Puerto Rico. When Lebron died, a Latino policy leader told NPR she was very controversial. A significant number of Puerto Ricans, he said, see her as a heroine. To the people on this floor, under a hail of bullets, she was something else.

  Look down at the floor again. People still argue about what those shots meant.

  Nobody argues about where they came from.
