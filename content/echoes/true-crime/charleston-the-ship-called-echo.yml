teaser: "The trade had been illegal for fifty years. The ship came in anyway."
script: |
  Look across the water to the little round fort on its island. Castle Pinckney. In the summer of eighteen fifty eight, the people landed there had been brought across the ocean as captives.

  Their ship was called the Echo. Bringing Africans to the Americas for sale had been illegal in the United States for fifty years. Under one of those laws, it was piracy, and the penalty was death.

  In August, an American navy brig caught the Echo off Cuba. Four hundred and fifty people had been forced aboard in Africa. A hundred and thirty seven died on the crossing. The hold was forty four inches high. All but the smallest children could not stand.

  The survivors were landed at Castle Pinckney, then moved to Fort Sumter. More than half were children and teenagers. Thirty five more died there.

  The crew was tried for piracy in the federal court in Charleston. Their lawyer argued the slave trade laws themselves were wrong. The judge ruled that the slave trade was not piracy. None of them was convicted. The captain was freed on a technicality in Florida, and within a year he was back aboard a slaver.

  The survivors were sent to Liberia. Seventy one more died on the way.

  The marshal who guarded them at Fort Sumter had been for slavery. He wrote, it seems to me that I can never forget it.

  Look at the little fort again. No one was ever punished for that ship.

  The marshal, at least, never forgot it.
detail: >-
  The National Park Service article "The Echo" gives the capture on 21 August 1858, 450 captives at departure and 137 deaths on the voyage, the 44 inch hold, the share of children and teenagers, 35 deaths in quarantine at Fort Sumter, the piracy trial in Charleston, Judge Magrath's ruling that the African slave trade is not piracy, Captain Townsend's acquittal in Key West, the voyage to Liberia with 71 deaths, and the marshal's words. The New York Daily Tribune of 30 August 1858 reports the Echo's arrival in Charleston and the landing of the Africans at Castle Pinckney. No one was convicted; the script says so. Everyone named is long dead.
