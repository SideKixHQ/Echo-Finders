# Listening spot: Public sidewalk on the east side of 16th Street NW, between L and M Streets, across the street from the mansion at 1125 16th Street.
# Position: the Evening Star (1950 to 1957) gives the Soviet Embassy as 1125 Sixteenth Street N.W., the house built for Mrs. George M. Pullman; set across the street from it at 38.90465, -77.03635 (high confidence on the house). The 1994 bulletin says only "the Soviet Embassy in Washington, D.C." for April 1985; that the embassy was still in this house in 1985 is widely recorded but is not in a fetched source, and is flagged for James.
