teaser: "He thought he was selling them nothing. He asked for fifty thousand dollars."
script: |
  Look across Sixteenth Street at the big stone house, number eleven twenty five. It was built for the widow of George Pullman, the man who made the sleeping cars, and later sold to the Russian government. For decades, Washington knew it as the Soviet Embassy.

  On the sixteenth of April, nineteen eighty five, a CIA officer named Aldrich Ames walked into the Soviet Embassy in Washington.

  He had been meeting a Soviet diplomat there with the CIA's blessing. The agency thought he was sizing the man up as a possible source.

  At the reception desk, Ames handed the duty officer an envelope and asked for the diplomat by name. The letter inside was meant for the most senior KGB officer in the embassy. The duty officer nodded.

  Inside were two or three CIA cases, Soviets who had offered to work for the Americans. Ames believed they were double agents, really loyal to the KGB, so he thought he was giving away nothing. To prove who he was, he added a page from a CIA directory with his own name highlighted. And he asked for fifty thousand dollars.

  A month later, on the fifteenth of May, he came back. A KGB officer passed him a note. They had agreed to pay.

  Years later, Ames told a court that he had conceived a kind of confidence game to play on the KGB. It did not stay a game. He went on to give them the names of Soviet officials who were truly helping American intelligence, and many of them were later executed. He was sentenced to life in prison without parole.

  Look at the front door. It began with an envelope, handed across a desk.
detail: >-
  Conviction status: convicted. The walk in of 16 April 1985, the envelope, the letter's contents, the request for fifty thousand dollars and the return on 15 May are from the Department of Defense Security Institute's Security Awareness Bulletin 4-94, which reprints the Senate Intelligence Committee's findings, drawing on the statement of facts Ames agreed to at his plea. The Los Angeles Times of 29 April 1994 independently reports, from the court hearing, the April 1985 start, the confidence game, the fifty thousand dollars, the executions and the life sentence. The house and its address are from the Evening Star of 1951 and 1957. The diplomat, Sergey Chuvakhin, is not named in the script. Ames is believed to be alive and serving his sentence (involvesLivingPeople true); he was convicted, so nothing is told as alleged. Uncertain: no fetched source places the 1985 embassy in this house in so many words (see the position note above).
