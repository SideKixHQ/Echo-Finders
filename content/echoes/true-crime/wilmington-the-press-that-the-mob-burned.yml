script: |
  An ordinary block can hold the site of an extraordinary assault. On November 10, 1898, a
  white supremacist mob came to the Daily Record, Wilmington's Black-owned newspaper.

  The newspaper occupied Free Love Hall on this Seventh Street block. The mob invaded the
  building and set it ablaze. Editor Alex Manly had already fled, anticipating the
  violence.

  This was part of the Wilmington coup, not an isolated dispute over a newspaper.
  Destroying the press attacked a community's ability to speak while armed violence spread
  through the city.

  The original building is gone. Listen from the public sidewalk rather than entering
  today's property. Its absence does not make the event less specific. Here, printed words
  were answered with fire. The record we can recover belongs to the people whose right to
  publish was attacked.
