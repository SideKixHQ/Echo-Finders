detail: >-
  Conviction status: convicted. Hiss was convicted of perjury on two counts on 21 January 1950, at his second trial, and sentenced to five years (Evening Star staff report of 22 January 1950; Associated Press reports in the Daily Alaska Empire of 24 January 1950 and the Evening Star of 23 January and 2 May 1950). The hearing of 25 August 1948 in the caucus room "of the old House Office Building", the chairman's warning, the standing identification and "George Crosley" are from Miriam Ottenberg's report in the Evening Star of 25 August 1948. The Architect of the Capitol confirms the Old House Office Building is the Cannon Building, the oldest congressional office building, with its Caucus Room up twin staircases behind the rotunda. Hiss maintained his innocence for the rest of his life; the script says he would not accept the verdict, in his own quoted words. Everyone named is dead. The statute of limitations meant he could not be charged with espionage itself (Evening Star, 23 January 1950); the script says perjury and nothing more.
