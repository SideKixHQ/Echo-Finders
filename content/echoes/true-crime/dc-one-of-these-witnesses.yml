teaser: "Certainly one of these witnesses will be tried for perjury."
script: |
  Look at the corner of the House office building across the avenue, the Cannon Building. It is the oldest congressional office building. At the back of its rotunda, twin marble staircases lead up to the Caucus Room.

  On the twenty fifth of August, nineteen forty eight, that room was packed. The House Committee on Un-American Activities had brought two men face to face.

  One was Whittaker Chambers, a senior editor of Time Magazine, who said he had once been a Communist. He had told the committee that a former State Department official had belonged to an underground Communist group in the government.

  The other was that official. Alger Hiss.

  Before the questions began, the chairman made a promise. As a result of this hearing, he said, certainly one of these witnesses will be tried for perjury.

  Hiss was asked to stand. So was Chambers, fifteen feet away. Have you ever seen the individual who is standing? I have, said Hiss. I identify him as George Crosley.

  The chairman was right, and it was Hiss. In January nineteen fifty, a federal jury in New York convicted him of perjury on both counts. One was for denying that he gave government secrets to Chambers. He was sentenced to five years in prison.

  Hiss would not accept it. It just seems impossible, he was quoted as saying, that any one would believe Chambers, the admitted perjurer.

  Look up at the building. Two men stood up in that room, and before a single question was asked, the chairman had said that one of them would be tried.
