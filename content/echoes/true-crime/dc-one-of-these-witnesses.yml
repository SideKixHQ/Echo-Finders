# Position: the Architect of the Capitol bounds the Cannon Building by Independence Avenue, First Street SE, New Jersey Avenue and C Street SE; set at the Independence and New Jersey corner at 38.88725, -77.00790 (high confidence on the building; the Caucus Room is inside). About 240 m from the nearest Capitol pin.
