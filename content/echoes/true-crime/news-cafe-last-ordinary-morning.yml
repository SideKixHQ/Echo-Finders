tags: [miami-beach, ocean-drive, 1997, versace]
teaser: A café, a stack of magazines, and a four-block walk north.
script: |
  You are outside a café that has been on this corner since the middle of the eighties.

  In the summer of nineteen ninety-seven a man came down here most mornings from a house
  three blocks north. He sat outside. He bought a stack of magazines. The staff knew him by
  sight, the way staff know a regular.

  On the fifteenth of July he did exactly that, and then he walked home.

  His name was Gianni Versace, and this was the last ordinary hour of his life.

  It is three blocks north along the beach side. About six minutes.

  Take it slowly. He did.
