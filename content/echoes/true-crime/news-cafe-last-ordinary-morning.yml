# First of a two-echo pair. This one is deliberately not about the murder: it is about the
# walk, and it withholds. The payoff is four blocks north.
#
# Note the pair is NOT joined by relatedIds. relatedIds means "do not play both" — the
# scheduler treats a related echo as a subject already covered — so using it here would
# silently suppress half the story. Sequence comes from geography, not from a field.
id: news-cafe-last-ordinary-morning
title: The last ordinary hour
summary: He came here most mornings that summer, bought magazines, and walked home.
place: News Café, 800 Ocean Drive, Miami Beach
