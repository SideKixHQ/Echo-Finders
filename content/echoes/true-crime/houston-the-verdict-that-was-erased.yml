teaser: "Guilty on every count. Then, because he died, it was as if the trial never happened."
script: |
  Look at the federal courthouse here on Rusk Street.

  In two thousand six, a jury in this building found the founder of Enron guilty of fraud. Five months later, his conviction no longer existed.

  Enron was a Texas energy giant, based in Houston. Its collapse at the end of two thousand one wiped out more than sixty billion dollars in market value, about two billion dollars in retirement savings, and some fifty six hundred jobs.

  The trial of its two former chief executives, Kenneth Lay and Jeffrey Skilling, ran for nearly four months. Twelve jurors, eight women and four men, deliberated for six days.

  On the twenty fifth of May, two thousand six, they came back. Lay was convicted on every count he faced. Skilling was convicted on nineteen counts, and acquitted on nine.

  In the courtroom, Lay's family gathered round him and prayed. God's got another plan right now, he said. I firmly believe I am innocent.

  On the fifth of July, before he could be sentenced, Kenneth Lay died of a heart attack. He was sixty four.

  In October, Judge Sim Lake vacated his conviction. Under the law of this federal circuit, when a defendant dies before his appeal is heard, his whole case is extinguished. The Justice Department answered that the ruling did not change the fact that Lay was found guilty.

  Days later, in this courthouse, Skilling was sentenced to twenty four years and four months in prison.

  Look at the doors again.

  One verdict stood. The other was erased.

