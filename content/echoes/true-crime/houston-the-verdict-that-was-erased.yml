# Listening spot: the public sidewalk outside the Bob Casey United States Courthouse, where the Enron trial of Kenneth Lay and Jeffrey Skilling was held (NBC News photo caption, 2006).
# Position: Overture places "Federal Courthouse", 515 Rusk St, 29.76103, -95.36758 (high confidence for the building; the address is Overture's, the courthouse name is NBC's).
# True crime notes for the reviewer: conviction status "convicted". Jeffrey Skilling (alive) was convicted by the jury, and that is the only living person named. Kenneth Lay was convicted; after his death the judge vacated the conviction under Fifth Circuit abatement law, and the script says so in the same breath, with the Justice Department's own response. No fraud victim is named. Key facts each have two independent sources: the verdict (Justice Department; NBC/AP), Lay's death (NPR), the vacatur (NBC/AP; CBS/AP is the same wire story, so NPR's report is the second), Skilling's sentence (Justice Department).
