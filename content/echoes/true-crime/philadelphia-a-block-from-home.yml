# Drafted by Claude Code (2026-11-11) for Philadelphia (South Street, Bella Vista and Washington Square West), second pass, following docs/writing-echoes.md (format v2) and docs/14-true-crime.md. Male narrator per content/voices.yml.
# Listening spot: South Street at Eighth Street, on the public sidewalk. Catto lived at 814 South Street and was shot about a block from home; the memorial's own text puts the polling place on the 700 block.
# Position: the Eighth and South intersection from the Overture street map (39.942412, -75.155488), nudged west along South Street toward the 800 block (medium confidence: the sources differ by a block, so the radius covers both).
# Key facts and their sources (docs/14-true-crime.md): that Catto was shot dead on South Street on Election Day, 10 October 1871, is in both the Encyclopedia of Greater Philadelphia and WHYY (2017). The 1877 trial of Frank Kelly is in the Encyclopedia, the 1877 trial pamphlet (the prosecution's opening and the testimony) and the New-York Tribune (10 May 1877), which also reports that he could not be convicted and was set free; South Street and the date are in the pamphlet too (2026-11-11). No one was convicted. No one named is alive.
