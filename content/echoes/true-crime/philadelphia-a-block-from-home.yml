teaser: "He was walking home to fetch the bullets."
script: |
  Look along South Street, toward Ninth. On the afternoon of the tenth of October, eighteen seventy one, a young teacher was walking home along this street. His house was a block away.

  His name was Octavius Catto. He was thirty two. He had helped raise Black regiments in the Civil War. He had fought to let Black Philadelphians ride the streetcars, and to let them vote. Black men in Pennsylvania had won back the vote only the year before.

  That Election Day, white mobs were attacking Black voters around Lombard and South streets. The police did little. Catto closed his school early, to keep his students safe. Then he went and bought a revolver. He was walking home to get ammunition for it.

  Witnesses later said two white men passed him here. No words were spoken. One of them drew a pistol and fired. Catto tried to get behind a streetcar. He died in the arms of a police officer.

  Years later, in eighteen seventy seven, a man named Frank Kelly was put on trial for the murder. Dozens of witnesses testified. The jury acquitted him of all charges. No one was ever convicted.

  Five thousand people followed his coffin through the rain.

  Look along the street once more. In twenty seventeen, the city put up a statue of him at City Hall. It was the first public statue in Philadelphia of an African American.

  He is shown striding forward, hands held out.
