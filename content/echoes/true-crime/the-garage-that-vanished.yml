script: |
  The garage is gone.

  On February 14, 1929, it stood at this address.

  Inside, seven men associated with George “Bugs” Moran’s bootlegging organization were
  lined up against a wall and shot.

  The killings became known as the St. Valentine’s Day Massacre.

  The crime helped define the public image of Prohibition-era Chicago: rival
  organizations, illegal alcohol, and violence reaching far beyond a private dispute.

  Al Capone's Chicago Outfit was widely suspected of ordering it.

  But Capone was never charged with this massacre, nobody was ever prosecuted for it, and the case remains unsolved.

  Look at the space where the building stood.

  You cannot inspect its rooms here. When the garage was due to be demolished in 1967, the
  bricks of the wall were saved; some are now displayed at the Mob Museum in Las Vegas.

  The address survives in Chicago.

  The evidence traveled.

  The name became famous.

  Behind that name were seven deaths, and a crime whose reputation became clearer than its
  complete solution.
