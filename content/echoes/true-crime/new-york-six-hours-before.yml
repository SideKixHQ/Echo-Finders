teaser: "He had an appointment with the District Attorney in the morning. He never kept it."
script: |
  Look along West Forty Third Street, a few steps from the lights of Times Square. In nineteen twelve, this street ran through the Tenderloin, and one of its doors belonged to the Hotel Metropole.

  At two o'clock in the morning, on the sixteenth of July, a gambler named Herman Rosenthal walked out of that door.

  Rosenthal had been talking. He had told the District Attorney, Charles Whitman, that gamblers were paying bribes to the police to stay open. And he had promised more. That very morning, he was due to bring the District Attorney a list of ten or more gamblers, ready to testify about the officers they paid.

  He never got there.

  A gray touring car was waiting up the street. Five men surrounded him on the sidewalk, and shot him dead. Then they ran for the car, and it was gone.

  Six hours before he was due to talk.

  The detectives traced the car within hours. Arrests began that same morning. And the trail led, at last, to a police lieutenant named Charles Becker.

  A jury convicted Becker of the murder of Herman Rosenthal. He was sentenced to death.

  And on the thirtieth of July, nineteen fifteen, at a quarter to six in the morning, Becker was electrocuted at Sing Sing prison, for instigating the murder of the man who was going to talk.

  Look at the doorway again.

  He was six hours from talking.

