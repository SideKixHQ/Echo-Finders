teaser: "Georgia was not yet two years old. It already needed a gallows."
script: |
  Look around this square, at the monument in the middle, and the church across the way. In seventeen thirty five, this was the middle of the town. The public store stood around it, and the mill, and the bake oven.

  Within two years of the first settlers landing, this little town hanged two of its own.

  A farmer named William Wise had come out with the colonists. He fell ill, and kept to his bed. Two Irish servants looked after him, Richard White and Alice Riley. The town's recorder, Thomas Christie, wrote to Oglethorpe that one morning, while White pretended to comb Wise's hair, the two of them killed him. Wise was too weak to fight.

  They were tried and sentenced to hang. Alice Riley was pregnant, so her hanging waited for the birth.

  White broke out of prison. A settler named Edward Jenkins saw a man walking fast outside town, and with two neighbours, armed with two hooks and an axe, he took him. White begged for his life. He said he would rather perish in the woods than die on the gallows. They took him straight to the gallows. He said to the last that he was not guilty.

  Then Jenkins added a line to his letter. The woman was hanged yesterday, and she too denied the murder of Wise.

  Her baby, a boy named James, died soon after.

  Look around the square again. The letters never say where the gallows stood. Only that White was carried into town, and taken straight to it.

  Georgia was not yet two years old. It already had a gallows.
detail: >-
  Christie to Oglethorpe, 14 December 1734: the effects of "The Unfortunate Mr Wise", "that Villian that Murdered him", the account of the killing ("Alice Riley by ye Direction & Influence of White", "White came in also pretending to Assist him in Combing his hairs"), "being very weak it Soon Dispatched him". Editor's note 82: Wise, a farmer, arrived 16 December 1733, "murdered March 1, 1733/4, by Alice Riley and Richard White, two Irish transport servants, who were hanged for the murder". Jenkins to Oglethorpe, 20 January 1734/5: White "Brook out of Prison", taken by Jenkins and the two Parkers with "two hooks & an ax", "He said he woud Joyfull to perish in ye woods rather then dye on the Gallows", "He was had immadiately to ye Gallows & Declared to ye last he was not Guilty", "The woman was Hanged yesterday, & denyed ye Murder of wise". Christie to the Trustees, 19 March 1734/5: "Alice Riley was hang'd ... within Six weeks after her being brought to Bed pursuant to her Sentence of the 11th day of May Last and the Child is Since dead"; the volume's index names the child "Riley, James, son to Alice, dead". Jenkins's letter dates her hanging to 19 January 1735 (new style); the script gives no day. The script reads Jenkins's line in modern spelling as reported speech, not as a quotation. The 1937 guide places the public store, mill and bake oven around Johnson Square, "the first square of the town". The square's present church is Christ Church; the script says only "the church". The 1937 guide mentions a sundial; whether it is still there is not checked, so the script does not point to it. White begging for his life: Jenkins, "He fell on his nees & with many Blows on his Breast baged his Life". The ghost story told about Alice Riley in Wright Square is not used.
