# Drafted by Claude Code (2026-11-11) for the second Savannah pass, following docs/14-true-crime.md and the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: the west side of Johnson Square, the first square of the town, which the 1937 guide says was ringed by the public store, the mill and the bake oven. The colonists' letters do not say where the gallows stood, and the script says so; the square is where the town of 1735 was, not a claimed scene.
# Position: Bull Street at Bryan and at Congress from the street segments in the app's Savannah street file, the square's centre taken at the Greene monument echo and the spot set about 55 m west of it along the Bryan Street line (medium confidence it falls inside the square's west half). About 120 m from the Wesley echo and 135 m from Tondee's Tavern.
#
# True crime, per docs/14-true-crime.md:
# - Conviction status: convicted. Alice Riley and Richard White were sentenced on 11 May 1734 (Christie, March 1735) and hanged. The script also reports, as the letters do, that both denied the murder at the end.
# - Living people: none.
# - Two independent sources: two letters by different men, each writing to the Trustees' side independently: Thomas Christie, Recorder of Savannah (14 December 1734 and 19 March 1735), and Edward Jenkins (20 January 1735). Both are printed in The Colonial Records of the State of Georgia, vol. 20 (1982), so the publication is one, the witnesses two. Key facts: the murder of Wise by White and Riley (Christie; Jenkins "White ... that Murdered Mr Wise"); the sentence and her hanging after the birth (Christie; Jenkins "The woman was Hanged yesterday"); White's escape and recapture (Jenkins; Christie's letter is not about it, so this rests on Jenkins, who made the arrest).
# - What is not said: the manner of the killing beyond "killed him" and that he was too weak to resist. Christie's letter describes it; the script does not.
# - Not used: the ghost of Alice Riley in Wright Square, which tour companies tell and no fetched source supports, and the tradition that the gallows stood in Wright Square.
