script: |
  Stand outside the theatre and look at the entrance.

  On July 22, 1934, John Dillinger walked through it to watch Manhattan Melodrama.

  He was one of the country’s most wanted fugitives.

  Federal agents knew he might come here. A woman accompanying him had provided
  information about his plans.

  They waited outside.

  According to the FBI’s account, Dillinger emerged at about ten-thirty that night. Agent
  Melvin Purvis lit a cigar to signal the others.

  The FBI says Dillinger drew a pistol and ran toward a nearby alley.

  Agents fired. Dillinger was fatally wounded.

  Stay on the sidewalk. There is no need to enter the alley.

  Look back toward the theatre doors.

  Movie audiences leave carrying a story that has just ended.

  That night, Dillinger stepped out of a fictional gangster story and into the final
  moments of his own.

  The theatre remains. The nationwide pursuit ended just beyond it.
