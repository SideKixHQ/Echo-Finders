script: |
  Stand outside the theatre and look at the entrance.

  On the night of July 22, 1934, John Dillinger came here to watch a film called Manhattan Melodrama.

  He was the country's Public Enemy Number One.

  Federal agents knew he might come here. According to the newspapers the next day, a woman who knew him had told them he would be at the Biograph that night.

  They waited outside, for nearly three hours.

  According to the Associated Press, Dillinger walked out through the lobby and down the street, past Melvin Purvis, the agent in charge, who was sitting in a parked car. Purvis moved his right arm in a signal.

  The same report says Dillinger darted toward an alley, reaching for a pistol.

  Agents fired. Three bullets hit him. It was ten forty at night.

  Stay on the sidewalk. There is no need to enter the alley.

  Look back toward the theatre doors.

  Movie audiences leave carrying a story that has just ended.

  That night, Dillinger stepped out of a gangster film and into the final moments of his own story.

  The theatre remains. The nationwide pursuit ended just beyond it.

