teaser: "A strip of tape, found, removed, and put back. That was the mistake."
script: |
  Look at the curved office building in front of you, the Watergate. Down below it is a garage, and a back door to a stairwell. In June nineteen seventy two, someone put a strip of tape across the lock of that door, so it would not catch.

  The man who did it was James McCord. He later described that night himself. He taped the doors from the sixth floor down, he said, and taped the outside door too.

  Then a security guard on his rounds, Frank Wills, found the tape.

  When the burglars came back, the door was locked again. They knew the tape had been found. And they went in anyway. One of them picked the lock and taped the door again, the same way as before.

  The police were called. Plain clothes officers went up through the building with the guard, room by room, turning on the lights. Five men were arrested inside the Democratic National Committee's offices. They had crouched behind a glass partition, hoping not to be seen.

  In January nineteen seventy three, five of the men pleaded guilty, and two more, McCord and Gordon Liddy, were convicted by a jury. And the questions about who sent them did not stop until a President resigned.

  Look at that door again.

  McCord said it plainly. We should not have gone in after the first tape had been found.
