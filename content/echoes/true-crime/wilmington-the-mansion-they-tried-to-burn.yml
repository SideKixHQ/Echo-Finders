script: |
  The columns still stand. That makes it easy to miss the violence committed inside this
  house on March 13, 1972.

  The museum describes an arson attack in which gasoline was spread on floors and ignited.
  Fire damaged plaster, woodwork, fixtures, and mirrors. The outside survived while the
  interior needed extensive restoration.

  No culprit or motive was established. Suggestions about political motives remain
  theories, and this story does not identify anyone as responsible.

  What happened afterward is visible in the building's continued life. Preservation turned
  a damaged, empty mansion into a place where visitors can examine the work of enslaved
  and free Black craftspeople, family history, and the restoration itself.

  From the sidewalk, hold both versions in mind: the building someone tried to destroy,
  and the building a community decided was worth keeping.
