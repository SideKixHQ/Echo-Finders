script: |
  This building has held both city government and a theater. In November 1898, the civic
  part of that history became a scene of forced political change.

  White supremacist leaders used violence and intimidation to overthrow Wilmington's
  elected, biracial government. Officials were compelled to resign, and Alfred Moore
  Waddell assumed the mayor's office.

  The outcome was not a normal transfer of authority after an election. The state
  recognizes the events as a coup. Black residents were killed, threatened, and driven
  from the city; the full death toll remains uncertain.

  Look at the municipal entrance from the sidewalk. Government buildings can make
  authority appear orderly and permanent. This one asks a harder question: how was that
  authority obtained? The architecture remained. The democratic rights of many Wilmington
  residents did not.
