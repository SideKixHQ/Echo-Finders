teaser: "This building has held both city government and a theater."
script: |
  This building has held both city government and a theater. In November 1898, the civic
  part of that history became a scene of forced political change.

  White supremacists seized Wilmington's government by force, removing its legally elected
  mayor and city council. Officials were compelled to resign, and Alfred Moore Waddell
  assumed the mayor's office.

  The outcome was not a normal transfer of authority after an election. The state
  recognizes the events as a coup. Black residents were killed and terrorized, and many
  fled the city; the full death toll remains uncertain.

  Look at the municipal entrance from the sidewalk. Government buildings can make
  authority appear orderly and permanent. This building asks a harder question: how was
  that authority obtained? The architecture remained. The democratic rights of many
  Wilmington residents did not.
