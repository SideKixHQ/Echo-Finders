teaser: "The first trial of a President's assassin was held here. The accused would not stop talking."
script: |
  Look at the pale old building with its columns, set back from Indiana Avenue. It was Washington's City Hall, and then its courthouse. A long list of famous trials happened inside.

  The strangest was in the winter of eighteen eighty one.

  That summer, a man named Charles Guiteau had shot President James Garfield, who later died of his wounds. Guiteau never denied it. He said God had told him to do it. His lawyers argued he was insane. It was the first time an American court had tried a President's killer.

  And Guiteau would not keep quiet. He shouted at the judge, the jury and the audience. Every time he started, the trial simply stopped, and waited, and then went on as if nothing had happened. In the end, the judge gave up asking for order.

  People queued for seats in the public gallery. One spectator said, never have I passed five hours in a theatre so filled with thrills.

  In January eighteen eighty two, the jury took about an hour. Guilty. The courtroom broke into applause. He was hanged that June.

  Look at the building again.

  For a few months, it was the best show in town.
