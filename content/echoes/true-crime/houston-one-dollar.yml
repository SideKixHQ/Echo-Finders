script: |
  Look toward the bayou, and the slow water.

  It was deep enough.

  On the fifth of May, nineteen seventy seven, Joe Campos Torres was twenty three. He was an army veteran, home the year before. He grew up in the East End, one of seven children.

  That night police were called to a fight at a bar, and he was arrested. Officers took him to a spot on this bayou that police called the hole, and beat him.

  When they brought him to the city jail, he was so badly hurt that they were told to take him to the hospital. Instead, they took him back to the hole. They beat him again, and forced him into the water.

  He was too hurt to swim. Three days later, his body came up in the bayou.

  A rookie officer who had been there broke the silence, and told his father.

  Two officers were tried for murder. A jury convicted them of negligent homicide, a misdemeanor. Their sentence was probation, and a fine of one dollar. A federal jury later found three officers guilty of violating his civil rights. Each got a year and a day.

  A year after his death, a crowd at Moody Park, on the north side, clashed with police, and the night ended in a riot.

  In twenty twenty one, Houston's police chief apologized to his family. He called it a straight up murder. The city has since put his name on a plaza and a trail beside this water.

  Look at the bayou again.

  One dollar.

