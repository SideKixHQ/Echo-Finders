# Listening spot: Public sidewalk on Callowhill Street between Thirteenth and Broad, the block where No. 1316 stood, opposite the old Reading station. Not a doorstep: the 1894 row is gone.
# Position: midpoint of Callowhill between the Overture street-map intersections at Thirteenth (39.959322, -75.159893) and Broad (39.959612, -75.1621), on the south side where the even numbers are (medium confidence: 1890s numbering, building demolished).
# Key facts and their sources (docs/14-true-crime.md): the killing of Benjamin Pitezel in Philadelphia, the conviction of H. H. Holmes for it, and his hanging at Moyamensing in 1896 are in both Geyer (1896) and the AP report (2017). The address, the sign, the carpenter and the train robber's letter rest on Geyer alone, the detective on the case; a contemporary newspaper report is the second source still wanted for those.
