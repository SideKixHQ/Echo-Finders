script: |
  Look along this block of Callowhill Street, between Thirteenth and Broad. In the summer of eighteen ninety four, there was a row of red brick houses here. In the window of number thirteen sixteen hung a muslin sign. B. F. Perry. Patents bought and sold.

  A carpenter named Eugene Smith had invented a saw tool, and stopped in to sell it. Perry hired him to build a counter. While he worked, Smith saw another man come in, give Perry a sign, and go upstairs.

  On the third of September, Smith came back. The shop was open, and empty. Perry's hat still hung on its nail. The next morning, it was all the same. Smith climbed the stairs. In the back room, Perry lay dead.

  The coroner called it an accident. But Perry was really Benjamin Pitezel, a married man, and his life was insured for ten thousand dollars. And the man who had gone upstairs was his business partner, who called himself H. H. Holmes.

  What gave him away was a letter. In a jail in St. Louis, Holmes had boasted of his insurance plan to a train robber named Marion Hedgepeth, and promised him a cut. He never paid. So Hedgepeth wrote to the police.

  Holmes was arrested in Boston. In Philadelphia, a jury found him guilty of the murder of Benjamin Pitezel. He was hanged at Moyamensing Prison, in May of eighteen ninety six.

  Look along the block again. A patent dealer's sign. A man who trusted his partner.

  And the train robber who wanted his money.
