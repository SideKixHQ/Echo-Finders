script: |
  Look toward the station entrance.

  On June 17, 1933, officers brought a handcuffed prisoner through Union Station.

  His name was Frank Nash. They were taking him back to federal prison.

  Outside, a car waited.

  As the officers gathered around it, armed men attacked.

  Reports at the time called it an effort by gangsters to free Nash, or to kill him.

  Instead, Nash and four law enforcement officers were killed.

  A journey that should have continued toward prison ended here, outside a railway
  station.

  The killings became known as the Kansas City Massacre.

  They helped drive changes in federal law enforcement, including broader authority for
  federal agents.

  Look at the people arriving and leaving now.

  Stations are places of movement. Someone steps off a train, crosses a lobby, finds a
  ride, continues home.

  For five people that morning, the next part of the journey never happened.

  This entrance became the boundary between an ordinary transfer and a nationally
  consequential crime.
