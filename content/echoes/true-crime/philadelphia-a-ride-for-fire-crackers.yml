script: |
  Look along this lane. In the summer of eighteen seventy four, it was lined with handsome houses set back behind their lawns. Two little boys played on the sidewalk here. Walter Ross was six. His brother Charley was four.

  For several days, two men in a buggy had been stopping to give them candy.

  On the first of July, the boys asked their father for money for fire crackers, for the Fourth. He promised to bring them some. That evening, when he got home, they were gone. A neighbour had seen them ride off with two men.

  The men had promised the boys fire crackers. They drove them miles across the city. They gave Walter twenty five cents and sent him into a cigar shop. When he came out with his fire crackers, the buggy was gone. And Charley with it.

  Two days later, the first letter came. They wanted twenty thousand dollars. Over the months, there were twenty three letters. Charley never came home.

  That December, two burglars were shot breaking into a house in Brooklyn. It was reported that one of them, before he died, said that they were the men who took Charley Ross. Nobody ever found Charley.

  Almost two years later, his father was still searching, and wrote it all down, every letter and every false hope.

  Look along the lane once more.

  The candy came first.
