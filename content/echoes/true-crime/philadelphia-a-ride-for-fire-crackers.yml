# Drafted by Claude Code (2026-11-10) for Philadelphia (Germantown), following docs/writing-echoes.md (format v2) and docs/14-true-crime.md. Male narrator per content/voices.yml.
# Listening spot: Public sidewalk of East Washington Lane, a short way below the Washington Lane railroad station, the stretch where the Ross boys played. The listener stays on the lane, never at a private door.
# Position: Christian Ross (1876) puts his house on the north side of East Washington Lane, eighth from Main Street and second from the Chestnut Hill railroad station; set on the lane just southwest of Wikidata's point for Washington Lane station (40.0511, -75.1716) (low confidence: the house is not identified on the modern map; widened radius).
# Key facts and sources (docs/14-true-crime.md): the date, the two boys taken, Walter released, the ransom of twenty thousand dollars, the twenty three letters and that Charley was never found are in both the father's account (1876) and CBS Philadelphia (2014). The dying confession in Brooklyn rests on the father's account alone; told as what was reported, never as proven. No one named here is alive.
