teaser: "There at seven in the morning. Gone by the afternoon."
script: |
  Look at this corner, where Thirty Seventh Street meets R Street. In October nineteen ninety three, there was a mailbox here, and the FBI was watching it.

  Agents had searched the home of a CIA officer named Aldrich Ames, and found a document on his computer. It identified a mailbox at Thirty Seventh and R Streets as a signal site. In the plan Ames shared with the KGB, the site had a cover name. Smile.

  The signal was a chalk mark on a mailbox. It told the Russians that Ames would load a dead drop, or come to a meeting.

  That October the FBI had a tap on his telephone. It caught his wife asking why he had not left the signal yet. I should have, he said, except it was raining like crazy.

  Then, on the twelfth of October, Ames told her he would leave for work early the next morning, to put a signal down, confirming that I am coming. He had a meeting with the KGB in Bogota.

  Agents followed him here. They did not see him make a mark. But at seven in the morning, there was a horizontal chalk mark on the side of the mailbox.

  Ames had been selling secrets to Moscow since the spring of nineteen eighty five. He was arrested in February nineteen ninety four. He pleaded guilty, and was sentenced to life in prison without parole.

  Look at the corner. By that afternoon, the chalk mark had been erased.
