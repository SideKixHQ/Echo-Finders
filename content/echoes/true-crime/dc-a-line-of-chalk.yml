detail: >-
  Conviction status: convicted. Ames pleaded guilty to conspiracy to commit espionage on 28 April 1994 and was sentenced to life without parole (Los Angeles Times, 29 April 1994; the Department of Defense Security Institute's Security Awareness Bulletin 4-94, which reprints the Senate Intelligence Committee's findings). The search of his home, the computer document naming the mailbox, the cover name SMILE, the call of 12 October 1993, the 7 a.m. chalk mark and its erasure are from the bulletin. The raining call is from the Los Angeles Times of 26 February 1994, quoting the FBI's transcript. Ames is believed to be alive and serving his sentence, so involvesLivingPeople is true; he was convicted, so nothing is told as alleged. His wife is not named; she also pleaded guilty, to lesser charges. Both sources ultimately rest on the FBI's affidavit and the agreed statement of facts, reported independently. The CIA sources Ames betrayed, many of whom were executed, are not described.
