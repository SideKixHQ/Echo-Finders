teaser: "Her sister buried her again, before dawn, and told no one where."
script: |
  Stand on the sidewalk and look in at the cemetery's vaults.

  In nineteen thirty one, a young woman named Elena Hoyos died. She had been treated for tuberculosis at the Marine Hospital in Key West. An X-ray technician there, a man named Karl Tanzler von Cosel, had fallen in love with her.

  After she died, with her family's permission, he paid for a vault for her in this cemetery. He visited it regularly.

  In October nineteen forty, her family grew suspicious. A search warrant was issued. And her body was found in his house, where, police said, it had been for seven years.

  He did not deny taking her. He told reporters he had promised to take care of her, and that he had wanted to see whether life could be restored.

  He was charged with maliciously disturbing the vault. But a grand jury did not indict him. The statute of limitations, it said, barred prosecution. He was never tried.

  That December, before dawn, her sister buried her again. The new grave was not revealed.

  It was kept secret so that he could not find her.
detail: >-
  Told from the record and the 1940 reporting only. He was charged (a warrant for malicious and wanton disfigurement of a burial vault, reported by the Associated Press as maliciously disturbing the contents of a tomb and by the United Press as mutilating a vault), admitted taking the body, and was not indicted because the time limit had passed; so the conviction status is "alleged", and the script says what he was charged with, what he said, and how it ended. The reports' details about the state of the body, its reconstruction and the public viewing at a funeral home are left out on purpose: the echo is about her, the town and the ending, not about the remains. Everyone named died long ago; her relatives are not named. The search warrant and the family's suspicion rest on the United Press report quoting the sheriff's office; the Key West Citizen says county officials had been investigating reports of grave robbing.
