# Drafted by Claude Code (2026-11-12) for the second Key West batch, following docs/writing-echoes.md and docs/14-true-crime.md.
# Listening spot: The Frances Street sidewalk on the east side of the Key West Cemetery (the "city cemetery" of the 1940 reports), where Elena Hoyos was first buried in a vault. The vault is not located or pointed at, and her second grave was kept secret, so the listener stands outside the cemetery on the public sidewalk.
# Position: Frances Street midway between Angela Street (24.55821, -81.79439) and Olivia Street (24.55630, -81.79303) in the app's Key West street file; Wikidata Q14686015 puts the cemetery at 24.5564, -81.7951. This keeps about 300 m from the existing Maine memorial echo at the Margaret Street side (medium confidence).
# Category: the brief listed this case under legend, but the record is documented (an arrest, a charge, a grand jury), and the validator does not allow a documented legend; ADR-0009 says crime told as fact belongs in true crime. So it is filed here, with the true crime rules applied.
# Sources: the Key West Citizen's own report (7 October 1940), Associated Press reports in the Washington Evening Star (8 October, 10 November and 19 December 1940, counted as one source), and United Press reports in the McAllen Daily Press (7 October 1940) and the Washington Daily News (20 December 1940), counted as one source. Corroborated 2026-11-12: her death in 1931 after treatment for tuberculosis at the Marine Hospital where he worked; the vault he paid for with the family's permission; the body found in his house in October 1940 and kept, by the reports, for seven years; the charge of disturbing the vault; no indictment because of the statute of limitations; the secret reburial by her sister in December 1940. Each is in at least two of the three.
# The reports disagree on her age (19 or 22) and spell her name Hoyos, Hoyo and Hoyas; the script gives no age and uses Hoyos.
