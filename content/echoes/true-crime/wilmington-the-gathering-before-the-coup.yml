script: |
  This marker identifies a place of preparation. On November 10, 1898, armed white men
  assembled at the Wilmington Light Infantry armory before marching on the Daily Record.

  The violence that followed was organized around a political aim: removing Wilmington's
  legitimately elected government and suppressing Black political power. It was not simply
  an unexpected crowd losing control.

  Stand beside the marker and look along Market Street. The route began among familiar
  civic buildings and ordinary city blocks. That is part of the story's difficulty.
  Political violence did not arrive in a landscape separate from everyday Wilmington; it
  moved through it.

  The marker now interrupts that everyday view with a record of what happened. Before you
  move on, notice its location. Remembering the starting point helps reveal the planning
  behind the crime.
