    quote: "About 500 men gathered at the armory of the Wilmington Light Infantry on Nov. 10 and Waddell took on the task of leading them to the “Daily Record” office."
  - says: "On November 10, 1898"
    source: 3
    quote: "The events of November 10, 1898, in Wilmington were a turning point in North Carolina history."
  - says: "forcing out the Republicans and Populists then in power in Wilmington"
    source: 1
    quote: "Alfred Moore Waddell, a former Confederate officer and U.S. Congressman, in the days preceding the election of 1898 called for the removal of the Republicans and Populists then in power in Wilmington"
  - says: "and restricting Black voting"
    source: 1
    quote: "Restriction on black voting followed soon thereon marking the onset of the Jim Crow era of segregation."
  - says: "Political violence did not arrive in a landscape separate from everyday Wilmington; it moved through it."
    source: 1
    quote: "Within hours violence had spread to other parts of the city."
  - says: "It was not simply an unexpected crowd losing control."
    source: 3
    quote: "By force, a white mob seized the reins of government in the port city and, in so doing, destroyed the local black-owned newspaper office and terrorized the African American community."
