tags: [new-york, financial-district, 1920, unsolved, morgan]
teaser: Put your hand flat on the stone. Feel the pitting.
script: |
  Put your hand flat on the stone, about waist height. Feel the pitting.

  That is not weathering. On the sixteenth of September nineteen twenty, at one minute past
  noon, a horse-drawn cart stopped outside this building. It was carrying a hundred pounds
  of dynamite and several hundred pounds of cast iron window weights, cut into slugs.

  When it went off, the iron went sideways. Thirty-eight people were killed and hundreds
  were hurt, most of them clerks, messengers and stenographers on their lunch break. The
  youngest was a messenger boy of seventeen.

  This was the House of Morgan, the most powerful bank in the country, and everybody
  assumed the bank was the target. The Bureau of Investigation spent three years on it. They
  questioned anarchists, socialists and union organisers, and they never charged anybody.
  It is still unsolved.

  The bank reopened the next morning. That was the point, and it was also the decision that
  left these marks: Morgan refused to repair the facade. A hundred years of cleaning and
  restoration have gone past them.

  You are standing where the cart stood. Everybody who works on this street walks past this
  wall, and almost nobody touches it.
