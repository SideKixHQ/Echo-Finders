# The first echo written to be RARE, and written that way on purpose.
#
# Every echo in the library until now scored common or uncommon, so the halo on the map,
# the Singular count on My Echoes and the whole "you are the fourth person to stand here"
# idea had nothing to stand on. `rarityOf` earns difficulty from three things: how exactly
# you must place yourself, whether the place is open at all hours, and how far it is from
# anywhere many people go. This echo earns two of the three honestly.
#
#   triggerRadiusKm 0.03  -> +2, because the story IS a specific patch of wall
#   hours 8 to 17         -> +1, because you cannot see pockmarks in the dark
#                            = 3, which is "rare"
#
# Neither is a dial. The scars really are on one facade and really are invisible at night,
# which is the test the engine's own note sets: rarity has to be a fact about the world
# rather than pacing. If either stopped being true the echo should stop being rare.
#
# True Crime with nobody to protect. Everyone involved has been dead for a century, nobody
# was ever charged, and the case is formally unsolved — which is also the most interesting
# thing about it and the reason the script refuses to name a culprit.
id: wall-street-1920-the-scars
title: Nobody ever repaired this wall
summary: >-
  The deadliest attack in America until 1920 happened on this corner, and the building
  still carries it.
place: 23 Wall Street, Manhattan
at: { lat: 40.70687, lng: -74.01029 }
# Thirty metres. You have to be at the Wall Street facade, not merely at the junction:
# stand on the Broad Street side and you are looking at the wrong wall.
triggerRadiusKm: 0.03
# Daylight only. The whole echo asks you to look at shallow marks in grey marble, which is
# a thing you cannot do after dark under sodium light.
hours: { fromHour: 8, toHour: 17 }
voice: wC1005J19tvhoqqC2hkf
category: true-crime
