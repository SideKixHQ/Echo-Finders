teaser: "A long photograph in this museum had a piece cut out of it, on purpose."
script: |
  In 2012 the writer David Grann visited the Osage nation museum and saw a long panoramic photograph on the wall.

  It was taken in 1924. It showed what looked like an innocent pageant of Osage people and white settlers.

  A section of it had been cut out.

  He asked the museum director why. She said it held the image of a figure so frightening that she had decided to remove that piece.

  Then she pointed at the gap, and said, the Devil was standing right there.

  The missing piece showed one of the men behind the killing of Osage people for their oil wealth.

  Oil had been found on Osage land, and in the nineteen twenties they were among the richest people per capita in the world.

  Then, one by one, they began to be killed. The Osage call those years the Reign of Terror.

  William Hale and John Ramsey were tried and sent to prison for their part.

  Grann has written that there was a deeper and darker conspiracy, which the investigators never exposed.

  The director did not cut that figure out to forget. She cut him out because the Osage cannot forget.
