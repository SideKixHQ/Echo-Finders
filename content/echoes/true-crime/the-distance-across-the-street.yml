script: |
  Look from Ford’s Theatre to the house across the street.

  That short distance became the final journey of Abraham Lincoln’s life.

  On April 14, 1865, Lincoln attended a performance of Our American Cousin.

  Actor John Wilkes Booth knew the theatre. That evening, he entered the presidential box
  and shot the president.

  Booth escaped from the theatre. Lincoln could not.

  People carried the wounded president across Tenth Street into the Petersen family’s
  boarding house.

  He died there the following morning, April 15.

  Look at the crossing again.

  Today, it takes only a few seconds to walk from one side to the other.

  On that night, people crossed it carrying the president of the United States, trying to
  find somewhere to care for him.

  The theatre marks the attack.

  The house marks his death.

  Between them is an ordinary city street that briefly became the center of a national
  catastrophe.
