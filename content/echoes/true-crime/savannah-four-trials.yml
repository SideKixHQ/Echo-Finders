# Drafted by Claude Code (2026-11-10) for the second Savannah batch, following docs/14-true-crime.md and the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: the public sidewalk of West Wayne Street at Bull Street, beside the Mercer House on the west side of Monterey Square. Private house museum; the listener stays on the street.
# Position: Bull and Wayne intersection from the street segments in the app's Savannah street file, set onto the Wayne Street sidewalk west of Bull, about 55 m from the Pulaski monument echo (medium confidence for which side the study windows face; NPR's guide says "on this side of the house").
#
# True crime, per docs/14-true-crime.md:
# - Conviction status: Jim Williams was tried four times. Two of the first three trials ended in murder convictions, both overturned by the Georgia Supreme Court; the third ended in a hung jury; the fourth jury acquitted him in 1989 (AP, 1987, and NPR). Filed as `exonerated`: the script says the convictions were thrown out in the same breath as it says they happened.
# - Second pass (2026-11-11): AP's 1987 report (via The Red and Black, Georgia Historic Newspapers) added as the independent second source for the date, the earlier verdicts and the trial count. AP gives Hansford's age as 22, NPR as 21, so the script no longer gives an age.
# - Living people: none named. Williams died in 1990, Danny Hansford in 1981. The author of the book is alive and is not named; nothing here concerns him.
# - Independent sources: NPR (2024, Georgia Public Broadcasting), NBC News (2009) and AP (1987). Key facts: the shooting in this house (NPR; NBC "a fatal shooting there"; AP "killed at Williams' home"), 2 May 1981 (NPR; AP), the trials and earlier verdicts (AP; NPR for the fourth trial and the 1989 verdict), tried and not finally convicted (NBC).
# - What is not said: anything about the relationship beyond NPR's words, any description of the wounds, any claim about what happened in the room beyond Williams's own account as NPR reports it.
