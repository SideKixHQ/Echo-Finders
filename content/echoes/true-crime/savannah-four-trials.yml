teaser: "Two windows on the side of a red brick house. A young man died behind them."
script: |
  Look at the red brick mansion on the west side of Monterey Square. On the side of the house, a local guide points out the first two windows. Behind them is the study.

  A young man named Danny Hansford died in that room.

  It was about two in the morning, on the second of May, nineteen eighty one. Hansford was twenty one. He worked for the man who owned this house, Jim Williams, a wealthy antiques dealer. NPR has described Hansford as Williams's employee and occasional lover.

  Williams shot him. He said it was self defence, that Hansford had tried to shoot him first. He was charged with murder.

  What followed took eight years. Four trials. In nineteen eighty nine, a jury found him not guilty. Williams was acquitted.

  The case became a book, and the book became a film, and the town that had tried him four times became a place people visit with that book in their hands.

  Look at the two windows again.

  The verdict was not guilty. The room still holds a death.
detail: >-
  NPR (2024) gives the time, date, Hansford's age, the self-defence claim, the murder charge, the four trials and the 1989 verdict. NBC News (2009) says Williams "was tried but never convicted in a fatal shooting there". NBC calls Williams the "late art dealer"; his death date is not in either fetched page, so the script does not give it.
