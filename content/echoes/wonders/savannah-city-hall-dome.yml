teaser: "Look up at the dome. It was not built to look like that."
script: |
  Look up at the dome on City Hall.

  It was not built to look like that.

  This is the spot where the City Exchange stood from seventeen ninety nine. In nineteen oh four the city tore it down and started again. The new City Hall was finished at the end of nineteen oh five, and the first council met here in January nineteen oh six.

  The dome rises another seventy feet above the building. It was sheathed in copper, and for many years the city simply let that copper weather on its own.

  Then the air got to it. In nineteen sixty six the city painted the dome to stop it deteriorating. The culprit, according to the federal survey of the building, was a local fertilizer plant.

  Later the survey found it under a protective coating, coloured to look like the weathered copper it had been designed to become all along.

  What you are looking at now came after that.

  It was designed to change colour on its own. The city has been choosing its colour ever since.
detail: >-
  The cornerstone, laid on the eleventh of August 1904, is at the northeast corner about twenty feet above the ground below, and is easiest to see from one of the footbridges over Factors Walk. The architect was Hyman W. Witcover.
