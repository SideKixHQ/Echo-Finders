teaser: Look down at the pavement.
script: |
  Look down at the pavement.

  Set into the sidewalks along this stretch of Broadway, from Battery Place to Chambers Street, are granite markers, one for each ticker-tape parade. Lower Manhattan has had two hundred and nine of them.

  Ticker tape was a one-inch ribbon of paper on which the ticker machine printed stock prices, and the brokers' offices along here produced a lot of it. Once tall buildings had turned these narrow streets into stone canyons, office workers discovered that tape thrown out of the windows made a dramatic effect.

  The first officially organised ticker-tape parades welcomed home the soldiers of the First World War. Since 1919 the mayor has decided who gets one.

  Nobody uses actual ticker tape now. It is confetti.

  So this is a canyon named after confetti, which was named after scrap paper.

