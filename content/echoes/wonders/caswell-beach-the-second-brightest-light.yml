teaser: "For a few years, only one lighthouse on Earth outshone this one."
script: |
  From this deck, look back across the road at the top of the lighthouse. The light up there is not one lamp behind a glass lens, like the old towers. It is banks of lamps and reflectors.

  When it was switched on in 1958, the bottom bank held thirty-six inch reflectors with two thousand five hundred watt mercury bulbs. The reflectors were adapted from aircraft spotlights used in the Second World War.

  The Coast Guard engineers knew it would have to be one of the brightest lights in the world. The tower stands four miles farther inland than the old Cape Fear light it replaced, and it still had to reach farther out to sea.

  It did. Its glow carried more than thirty nautical miles, to the end of Frying Pan Shoals.

  For a few years it was the brightest lighthouse in the United States, and the second brightest in the world. Only a lighthouse on an island off France was brighter.

  Then the mercury bulbs turned out too expensive and difficult to keep. In 1962 a new lighthouse at Sullivan's Island, in South Carolina, took the American title.

  The light still flashes four times every ten seconds. Wait for dark, and count.
