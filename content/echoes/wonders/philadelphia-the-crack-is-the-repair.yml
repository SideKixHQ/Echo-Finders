teaser: "Look along the edges of the crack. They are not clean breaks."
script: |
  Find the bell, and look at the crack.

  It is wide and dark, and it could be the best known flaw in the country. Now look along its edges. They are not clean breaks. They are a row of little round scallops.

  Nobody wrote down when the bell first cracked. The likeliest answer is the early eighteen forties, after almost ninety years of hard use. A thin split, easy to miss.

  In eighteen forty-six the city decided to repair the bell before Washington's birthday. So metal workers drilled out the thin crack and widened it on purpose, to stop it spreading and to bring the tone back. Those scallops are their drill holes. The Park Service counts more than forty of them.

  It did not work. A newspaper, the Public Ledger, reported that the bell had split again. The second crack runs up through the word Liberty, and nobody alive has heard this bell ring freely.

  By then it had a new name. In eighteen thirty-five an abolitionist paper had called it the Liberty Bell, for the verse cast around its top. Proclaim liberty throughout all the land, unto all the inhabitants thereof. The name took years to catch on.

  So the famous crack is not the damage. It is the repair.
