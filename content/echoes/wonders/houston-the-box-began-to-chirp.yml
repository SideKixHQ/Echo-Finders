teaser: "A quarter of a million bats live under this bridge. Some of them have spent a week in an attic."
script: |
  Look at the underside of the Waugh Bridge, at the dark seams between the beams.

  They are full. Something like two hundred and fifty thousand bats live in there.

  They are Mexican free tailed bats. Every night at sunset, people gather here to watch them pour out. In a night, the colony eats almost two and a half tons of insects.

  In December twenty twenty two, an Arctic blast reached Houston. Mary Warwick, the wildlife director of the Houston Humane Society, was out doing her holiday shopping. The freezing wind reminded her of the bats. So she drove here.

  More than a hundred lay on the ground, looking dead. The cold had sent them into shock, and they had lost their grip and fallen.

  She gathered them into a box and set it on her heated passenger seat.

  On the forty minute drive home, the box began to chirp.

  She came back twice a day. Other people joined in. In the end, some sixteen hundred bats from this bridge and one in Pearland spent the freeze in her attic, in dog kennels, asleep.

  When the weather warmed, about seven hundred were due to be set free again, here, at this bridge.

  Look up at the seams. Stay until dusk.

  Some of them have been to her attic.

