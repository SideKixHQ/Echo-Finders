teaser: "Look up at the steel frame. It is a house with nothing filled in."
script: |
  Stand in the courtyard and look up at the steel frame. It is the outline of a house, drawn in the air, with nothing filled in.

  Benjamin Franklin's house stood here. It was large for the city, and unusual, set back from Market Street in a garden court. Franklin died here in seventeen ninety. Twenty-two years later his heirs tore it down. The land had become too valuable to keep one house on it.

  When the Park Service investigated the court, archaeologists found the outline of the house and its cellar. But nobody could find enough evidence of what the house had actually looked like.

  So the architects decided not to guess. They built a frame to the measurements recorded in Franklin's own property insurance, and left it empty.

  Look down through the viewing portals near your feet. You can see what is left of his cellar kitchen.

  Everything above that is exactly as much as anyone knows.
