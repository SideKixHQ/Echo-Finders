teaser: "The kind of boardwalk most beach towns tore up years ago."
script: |
  Walk out onto the boardwalk and look both ways.

  What you are on is rare now. The tourism bureau calls it one of the last vintage seaside
  boardwalks in the country. It still has the arcade, and the legendary donuts.

  Look out at the ocean too. The restaurant down there is built on the remnants of the old
  Center Pier.

  On summer Thursdays, fireworks go up over the beach right in front of you.

  Nothing here is trying to be new. That is the whole point.
