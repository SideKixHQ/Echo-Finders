teaser: "The man who built vaults for New York's subway came to these mountains and built his own church."
script: |
  Look up at the dome of the church of Saint Lawrence. It is made of tile.

  Thin ceramic tile, mortared together in layers. It is a traditional Mediterranean way of building. The man who brought it to America, and made it modern, was born in Valencia, Spain. His name was Rafael Guastavino.

  His vaults were lightweight, fireproof and fast to build. His company helped build more than one thousand buildings. The Boston Public Library. The New York City subway. And in 1894, the vaulted ceilings at George Vanderbilt's Biltmore Estate, here in Asheville.

  Then he did something unusual. In 1895 he bought land near Black Mountain, and built an estate he called Rhododendron.

  And for this church, he went back to being the architect himself. He designed it, built it, helped pay for it, and supplied the materials. Tile, from the floor to the elliptical dome. It was his culminating work.

  Guastavino died in 1908. He was entombed here, at Saint Lawrence.

  The builder never left his dome.
