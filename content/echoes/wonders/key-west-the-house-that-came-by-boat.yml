teaser: "This house had already been somewhere else."
script: |
  Look at the house at seven thirty Eaton Street. Two storeys, with long porches on two sides.

  It was not built here.

  It was built on Green Turtle Key, in the Bahamas. Then it was taken apart, brought across the water, and put back together in Key West, in eighteen forty seven.

  The man who moved it was Captain John Bartlum. His family were Loyalists, who had settled in the Bahamas at the time of the American Revolution.

  When it went up, the house had no stairs inside. To reach the floor above, you went out onto the porch and climbed.

  Bartlum had, the survey says, the barest rudiments of an education. He became a shipbuilder anyway, and built the only clipper ship ever built in Florida.

  Which seems fair. He had already moved a house by sea.
detail: >-
  From the Historic American Buildings Survey record of the house (HABS FL-185, 1967): built on Green Turtle Key in the Bahamas before 1847, dismantled, brought to Key West and reconstructed in 1847 and 1848; one of two houses known to have come this way (HABS records the other, at 408 William Street, as local tradition). Two storeys, verandas on two sides, no interior stairways at first: the stairs were on the porches. Bartlum's Loyalist family and the only clipper ship built in Florida, the Stephen R. Mallory, are from the same record. "By sea" is inferred from a house moved from the Bahamas to an island; the record says "brought". The survey describes the house as it was in 1967; whether it is still a private home today was not checked.
