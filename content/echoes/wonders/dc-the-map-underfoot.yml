teaser: "Look down. You are standing on a map."
script: |
  Look down. You are standing on a map.

  The dark lines in the stone are streets and avenues. The curving edge is the shoreline of
  the Potomac. Bronze plaques set into the pavement mark the places that matter.

  It is the plan Pierre L'Enfant drew for this city in seventeen ninety-one. It was laid into
  the stone of this plaza when the plaza opened in nineteen eighty.

  Find Pennsylvania Avenue on the map. Follow it to the Capitol at one end, and the
  President's house at the other.

  Now look up. The plaza was built so that you can see the Capitol in one direction, and
  the White House in the other.

  The map is the promise. Lift your eyes, and you are standing in the city it turned into.
