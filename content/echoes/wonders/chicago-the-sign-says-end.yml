teaser: "Route 66 ends at this corner. Or starts, depending which way you are facing."
script: |
  At this corner of Jackson and Michigan, look for a sign that reads, End Historic Route 66.

  Grant Park, right beside you, was the historic road's official eastern terminus. From here, Route 66 began its sweeping, arced path through Illinois, into Missouri, and on to Santa Monica, California.

  The road begins here, or ends here, depending on your perspective. The sign is written for the people arriving. Everyone leaving has to imagine theirs.
