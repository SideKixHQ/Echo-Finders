teaser: "Randolph Hall, Towell Library, and the Cistern."
script: |
  Stand under the oaks and look toward the building with the columns at the end of the green. That is the college's main building, and it has a person's name. Randolph Hall. The old library on the green has a person's name too. Towell.

  The green itself is called the Cistern.

  In the nineteenth century, an oval cistern was built here to hold the campus water supply. The name stuck to the whole yard, oaks and all.

  The college is old. It was founded in seventeen seventy, and its founders included three signers of the Declaration of Independence. Its first classes met in former Revolutionary War barracks. The main building went up in eighteen twenty nine. The columns came twenty five years later.

  It is the oldest municipal college in the United States, and a National Historic Landmark.

  And the heart of it is named after a water tank.
