teaser: "Walk beside the polished wall, and watch the soldiers in the field appear in the stone."
script: |
  Walk beside the polished wall, and watch the soldiers in the field appear in the stone.

  There are nineteen of them, out on patrol.

  When the sculptor, Frank Gaylord, first showed his clay models, there were thirty-eight
  soldiers. They were in the middle of a mission, under fire, in every kind of pose. The
  Commission of Fine Arts liked the photographs, and worried the figures would become too
  realistic.

  What was finally built was nineteen.

  The wall beside you carries the faces of the people behind the troops. Nurses,
  chaplains, sailors, supply crews. More than two thousand four hundred photographs went
  into it. The architects wrote that as visitors walked down beside it, the etched faces
  would mix with the reflections of the soldiers.

  So look into the granite now. Count the patrol in the field. Then count it again in the
  stone.

  Nineteen out there. Nineteen in here.

  The record does not say whether anyone planned it that way.

  But that is thirty-eight.
