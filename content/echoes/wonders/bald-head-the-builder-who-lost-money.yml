teaser: "Above the door is the name of the man who built this lighthouse, and lost money doing it."
script: |
  Look above the door of the lighthouse, on its west side. There is a stone tablet. It reads, R. Cochran, Founder. A. D. 1817. D. S. Way, Builder.

  Daniel Way won the contract in July 1816. His terms were much lower than anyone else's.

  He had a plan. The first lighthouse here had been wrecked. He would salvage its brick, and he expected the new tower to stand close to the old one.

  Both hopes went unrealized. The old brick was not the best quality. And the new lighthouse went up a mile west of the old one, too far to haul the brick that could be saved.

  Way lost money on the project.

  But the tower he built is the oldest lighthouse standing in North Carolina. Two hundred years on, his name is still over the door.
