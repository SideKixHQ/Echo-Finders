teaser: "Most people come to this house for its stories. This story is written down."
script: |
  Stand on Bull Street beside the garden wall of the big stuccoed house on the corner of Harris Street.

  Most people come to this house for its stories. This story is written down.

  The house was built around eighteen forty by Francis Sorrel, a Frenchman. One of his sons became a doctor, and kept his office in the basement. The way in to that office was not the front door. It was a gateway in this wall, on Bull Street.

  Later the gateway was bricked up. In nineteen seventeen, a writer remembering the doctor said you could still make out its outline in the wall.

  Then a later owner wanted a gate on Bull Street again. She had the wall opened, but in a different place, and the old opening stayed filled with brick.

  So walk along it slowly, and look for a patch of brick that does not quite match. Nobody can promise it is still there. It was more than a hundred years ago.

  Houses keep their doors. Walls keep the ones they lost.
