teaser: "Look up at the arch. Two men signed it."
script: |
  Find the brick arch on this corner, the old carriage gate with the iron grille. Look at the top of the arch.

  There are names cut into it. Not of heroes. Of the men who designed it and built it.

  When the Civil War ended, Savannah was shaken and disorganised. The city decided the first thing it needed was more police. This was the first large building it put up after the war, in eighteen seventy, as barracks for its police.

  Its architect and its builder were proud enough to sign the gate.

  It never stopped being a police building. The Library of Congress catalogue calls it the oldest continually active police headquarters in the nation. There is a statue of a police officer standing outside.

  Look up at the names again.

  Most of the city's builders are forgotten. These two wrote themselves over the door.
detail: >-
  The 1937 guide: "the first large building erected in Savannah after the War Between the States, when the tragic and disorganized city felt the necessity for greater police protection. The brick arcaded sally port, inscribed with the architect's and builder's names". Carol M. Highsmith's catalog records give the 1870 date, the statue of a police officer, and "the oldest continually active police headquarters in the nation". Neither source gives the two names; read them on site and add them before review.
