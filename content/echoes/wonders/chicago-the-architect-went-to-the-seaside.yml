teaser: "This building has no ornament at all, because of a two-week holiday."
script: |
  Look up at the dark brick walls of the Monadnock. There is not a single ornament on them. That was not the plan.

  The architects were Burnham and Root. The man who controlled the investment kept urging them toward extreme simplicity, and rejected one or two of John Root's sketches as too ornate.

  Then Root went away. A fortnight at the seashore.

  While he was gone, Daniel Burnham ordered one of the draughtsmen to draw a straight-up-and-down, uncompromising, unornamented front.

  When Root came back, he was indignant at this brick box. Gradually, though, he threw himself into it. He said he would throw the thing up without a single ornament.

  What went up was sixteen stories. The walls carry the building themselves, and at their base they are six feet thick. Root called it Jumbo. It was the last of the tall buildings to show walls of solid masonry.

  It was so heavy that it sank. By 1948 it had settled twenty inches.

  One of the plainest famous buildings in America, and it started with an architect taking a holiday.
