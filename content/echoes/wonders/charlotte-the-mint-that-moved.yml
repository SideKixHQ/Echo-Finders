tags: [charlotte, uptown, gold, mint, museum]
teaser: "Mint Street is still here. The mint is not."
script: |
  This federal building stands on the site of Charlotte's branch of the United States Mint. The street beside it is still called Mint Street.

  For years, gold from the mines around Charlotte went all the way to Philadelphia to be made into coins.

  So much came in that Congress opened a branch here. It started work in December 1837, and it only ever made gold coins.

  It was designed by William Strickland, one of the best known architects in the country.

  By the 1930s the government wanted this block for a bigger post office, and the mint was in the way. In 1932 it faced demolition.

  Instead, a group of citizens led by Mary Myers Dwelle paid to take it apart and rebuild it in the Eastover neighborhood.

  It opened again on the first of June, 1936, a century after it was first dedicated. This time it was an art museum, the first in North Carolina.

  It is still there, on Randolph Road.

  So the coins came from here, and the building that made them went to live somewhere quieter.
