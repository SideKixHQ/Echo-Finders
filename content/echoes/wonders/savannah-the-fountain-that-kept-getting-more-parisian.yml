# Listening spot: The paved walk around the fountain basin at the north end of Forsyth Park, on the Bull Street axis south of Gaston Street. Public park.
# Position: Between the two Overture fountain points (32.06925,-81.09559 and 32.07007,-81.09679); the first lies on the Bull Street line of the Pulaski monument (-81.0949) and south of Gaston Street, so the spot is taken just north of it, on the basin's edge (medium confidence).
