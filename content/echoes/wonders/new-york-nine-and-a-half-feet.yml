teaser: "Stretch out your arms. Now imagine that is most of the width of your house."
script: |
  Find the little house squeezed in between its neighbours, with the stepped gable on top. If you are with someone, stand side by side and stretch your arms out wide.

  Not even two people's arm spans. That is how wide this house is.

  Nine and a half feet. Thirty feet deep. Three floors.

  It is wedged in between its neighbours, and for a long time it has been called the narrowest house in New York.

  The stepped gable on its roof is a shape the Dutch brought to this city.

  And people did live here. Not just anybody. One of them was the actor John Barrymore. Another was the poet Edna St. Vincent Millay.

  Picture her climbing the narrow stairs with an armful of books, trying not to touch both walls at once.

  A poet's home, nine and a half feet wide.

