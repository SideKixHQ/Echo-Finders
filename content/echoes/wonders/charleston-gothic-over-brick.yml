teaser: "Crenellated tower, pointed windows, buttresses. Look again at the buttresses."
script: |
  Look at the Unitarian Church. A tower with battlements, pointed windows, buttresses down
  the sides. It looks like a piece of Gothic England.

  Look again at the buttresses.

  Buttresses are supposed to hold a building up. According to the Park Service, these are
  false. They are there for the look. Inside, the vaulted ceiling, modelled on the chapel of
  Henry the Seventh at Westminster, is lath and plaster.

  The Gothic is a costume. Underneath it is a much plainer building.

  In seventeen seventy-two, work began here on a small rectangular brick church, because the Independent Church, now the Circular Church, had more members than it could hold. The Revolution interrupted the work. The church was finally finished in seventeen eighty-seven.

  Then, in eighteen fifty-two, a young architect named Francis Lee was given two years to
  remake it in the romantic taste of the day. He added the chancel at the back and the
  four-storey tower, and he covered the old brick walls in stucco.

  When the earthquake of eighteen eighty-six badly damaged it, people from across the
  country sent money for the repairs.

  So the oldest Unitarian church in the South is an eighteenth-century meeting house in a
  nineteenth-century dream of the Middle Ages. The brick is still in there, under the
  stucco.
