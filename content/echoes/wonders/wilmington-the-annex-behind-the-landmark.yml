    source: 1
    quote: "The Fourth Street church grew in 1910, when additions to the Sunday School behind the sanctuary were completed. The Memorial Hall Annex, as it was called, was donated by William H. Sprunt, in loving memory of his parents—Alexander Sprunt and Jane Dalziel Sprunt—and the founding charter members of the original Second Presbyterian Church."
  - says: "People who gathered in the church also needed rooms for teaching, meetings, and other activities."
    source: 1
    quote: "Located behind the main church building, The Annex held national conferences for the Pentecostal Church."
