certaintyNote: >-
  A treasure legend, not history. The Federal Writers' Project guide of 1939 reports that the pirate Gibbs "was said to have buried" part of his booty on Barren Island and that "legend has it" the treasure is still there. That Gibbs died on the gallows, and that Barren Island was by 1939 "an island in name only", are reported as fact in the same guide. The script says out loud that the treasure is a legend.
