tags: [new-york, brooklyn, barren-island, dead-horse-bay, pirates, treasure, legend]
teaser: "The island is gone. The treasure, they say, is still in it."
script: |
  Look down at the sand under your feet. Then look out at the water of the bay.

  You are standing on an island. Or you would be, if it were still an island.

  This was Barren Island. By the nineteen thirties, the guidebooks were calling it an island in name only. An airfield came right up next to it.

  But the ground kept a secret. Or so they say.

  This is a legend.

  There was a pirate named Gibbs. He was a notorious man, and in the early eighteen hundreds he ended his life on the gallows.

  But before they caught him, the story goes, he came ashore here. And he buried a share of his loot in the sand of Barren Island.

  If anyone has dug it up, they never told.

  So if your foot catches on something hard in the sand, look twice.

  The legend says the treasure is still hidden here.

