teaser: "They tied the watchman's hut shut with a clothesline."
script: |
  Look up at the monument. Built into its walls, inside, are stones sent from all over the world, by tribes, societies, towns and foreign countries. One of them never made it in.

  In the early eighteen fifties, Pope Pius the Ninth sent a block of marble. It came from the ruins of the Temple of Concord, in the Forum in Rome. Not everyone was pleased. Petitions came in, protesting against any stone from the Pope.

  One night in March, eighteen fifty four, between one and two in the morning, a group of men came onto these grounds. They passed a clothesline around the night watchman's hut, and piled stones against his door. They told him that if he kept quiet, he would not be hurt. They pasted newspaper over his windows, so he could not see. Then they wheeled the Pope's stone away on a hand cart. The watchman had a loaded shotgun with him. He told nobody until four. He was suspended.

  The thieves were believed to be Know Nothings, a party against Catholics and immigrants. The next year, they took over the society that was building the monument. Congress took back its money, and for more than twenty years the monument was a stump.

  And the stone? Nobody ever found out for certain. It may have been smashed on the river bank. It may be at the bottom of the Potomac.

  Look up at the monument again. The missing stone came from the Temple of Concord.

  Concord means agreement.
detail: >-
  Accounts differ in detail. Harvey (1903) quotes a newspaper of the day placing the theft early on a Monday morning; the Society's reward notice dates it to the night of the 5th of March 1854. The National Park Service says the stone was supposedly thrown into the Potomac; Harvey says its fate was never known for certain.
