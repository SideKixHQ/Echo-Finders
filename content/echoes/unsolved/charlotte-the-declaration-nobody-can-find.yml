teaser: "North Carolina put a date on its flag for a paper nobody has seen since 1800."
script: |
  There is a date on the North Carolina state flag. May the twentieth, 1775. It points to this crossroads.

  The story goes that in May 1775, twenty-six local men met in the log courthouse that stood where these two streets cross. They were furious about the fighting at Lexington and Concord, and they signed a paper declaring themselves a free and independent people.

  A tavern keeper, Captain James Jack, is said to have ridden it to Philadelphia.

  If it was real, it was the first declaration of independence written by any colony.

  Then the trouble starts. The papers were destroyed in a fire in April 1800. Nineteen years later, one of the signers wrote it out again from memory.

  Nobody has found the original, and the state's own historical marker program calls it widely disputed.

  What nobody disputes is a different paper. On the thirty-first of May, 1775, a committee met at the same courthouse and adopted the Mecklenburg Resolves.

  The royal governor wrote that they surpassed all the horrid and treasonable publications this continent had yet produced.

  So Charlotte has two declarations from that spring. The one with proof, and the one on the flag.

  Every year on May the twentieth, this street still fires a cannon for the second one.
