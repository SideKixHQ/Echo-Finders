teaser: "A German submarine, a chemical plant, and five shells that missed."
script: |
  Look out to sea, after dark if you can. This is a story people here have told since the
  war.

  On the night of the fifteenth of July, 1943, the story goes, a German submarine surfaced off
  Kure Beach under cover of darkness. It fired five shells at the Ethyl-Dow chemical plant,
  which made a key ingredient for high-octane fuel.

  Every shell overshot. All of them plunged into the Cape Fear River.

  The man who told it was an officer stationed at Fort Fisher. Some residents remembered the
  shipyard in Wilmington suddenly going black that night. They had been told that if its
  lights ever went out, a real raid had come.

  A news blackout followed, the story says, and over the years it drifted into legend. So hear
  it that way.

  But five is a very specific number to invent.
