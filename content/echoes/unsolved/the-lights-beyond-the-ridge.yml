script: |
  Look out toward the ridges.

  Since at least 1910, people have reported unusual lights around Brown Mountain.

  The descriptions vary: bright points that appear, seem to move, then disappear.

  The lights became part of local folklore, often given ghostly explanations. The Park Service calls them a legend.

  The National Park Service notes that studies have linked reports to ordinary sources,
  including vehicle headlights.

  So a distant light is not evidence of a spirit.

  But distance makes certainty difficult.

  You might not see the road beneath a moving light. You might not recognize the angle. Trees
  can hide a source and reveal it again.

  That uncertainty is part of why the legend endures.

  Watch from the designated overlook. There is no need to chase anything into the woods.

  If you see a light, notice its direction and movement before deciding what it is.

  The landscape is real.

  The reports are documented.

  What people make of them is where the ghost story begins.
