teaser: "The nuclear age began on a squash court, with no way to switch it off in a hurry."
script: |
  Right about here, there used to be a football field, Stagg Field, with stands that nobody was using.

  On a squash court underneath those unused stands, the scientists of the Manhattan Project built a stack of graphite and uranium blocks, twenty feet tall, over two weeks.

  It had no safety features. No shielding from radiation, and no way to cool it down.

  Enrico Fermi assured Arthur Compton that the likelihood of a catastrophic failure was slim. On the campus of one of the most populous cities in the country, the outcome was never certain.

  On the second of December, 1942, at three fifty-three in the afternoon, with the control rods carefully removed, the Chicago Pile reached criticality. It was the first time in history that a self-sustaining nuclear reaction had been achieved.

  The youngest member of the team, and the only woman, was Leona Woods. The scientists celebrated with a bottle of Chianti.

  The pile was taken apart shortly afterwards. The stands are gone too. What is left is the spot, a National Historic Landmark since 1967, where the nuclear age began under the bleachers.
