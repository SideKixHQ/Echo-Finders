teaser: "Look up the slope across the road. In 1919 a house slid down it."
script: |
  Look across Commercial Street, at the slope rising toward Copp's Hill.

  On the fifteenth of January, nineteen nineteen, a little after noon, a steel tank stood on
  the waterfront here. It held molasses. Close to two million gallons of it, stored for
  making alcohol.

  People nearby heard a muffled roar. The tank split into two great pieces, and the molasses
  came out as a wave.

  It knocked out spans of the elevated railway that ran along this street. It crushed a fire
  station. In a city building close by, workers had been eating their lunch. On the slope
  across the road, a small house slid down into the street.

  Firemen had to hose the molasses away before they could reach anyone. It was days before
  the last of the dead were found. Twenty-one people were killed.

  The next day, the company's lawyer gave a statement. The tank, he suggested, had been blown
  up from outside. Perhaps by enemies of the United States.

  It took six years to answer him. A court auditor sat for eight hundred and fifty-one days
  and heard nine hundred and ten witnesses. In January nineteen twenty-five, he gave his
  finding.

  He found the company responsible.

  The tank had simply not been strong enough to hold what was in it.
