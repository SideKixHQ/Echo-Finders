teaser: "Eighteen airplanes overhead, and a flash from William Penn's statue."
script: |
  Stand at this corner, Broad and Pine, and look up Broad Street toward City Hall. On the afternoon of the twenty eighth of September, nineteen eighteen, the Governor of Pennsylvania was to stand here, reviewing a parade.

  America was at war, and Philadelphia was raising money for it. The city's goal was more than two hundred and fifty million dollars in Liberty Loans. So it threw a pageant. War workers marched down Broad Street, and women too. Wounded American soldiers back from France waited inside City Hall to take their places in line. One corporal had been wounded forty seven times.

  Eighteen airplanes were to fly over the march, in a mock air battle, with guns firing at them from the rooftops. And when the head of the parade reached South Street, a signal would flash from the statue of William Penn on City Hall. Everyone would stop, and sing.

  Five days later, the same newspaper carried a different headline. All theatres, schools, churches, motion picture houses and dance halls in Philadelphia must close immediately, to check the spread of Spanish influenza. The hospitals were crowded beyond capacity.

  The next day, there were seven hundred and eighty eight new cases. The bars were shut. The courts closed for two weeks.

  Look up Broad Street again. Five days.

  That was how long the crowds lasted.
