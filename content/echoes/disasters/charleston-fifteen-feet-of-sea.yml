teaser: "The night the sea did not stop at the sand."
script: |
  Look at the houses near the inlet, and the beach in front of them. Now imagine the sea rising, and not stopping at the sand.

  Around midnight on the twenty second of September, nineteen eighty nine, Hurricane Hugo came ashore at Sullivan's Island, just across this inlet. It was a category four storm, with winds of up to a hundred and forty miles an hour.

  The ocean came with it. Here on the Isle of Palms, the storm tide reached fifteen feet above sea level. Hugo raised the highest storm tides ever recorded on the East Coast of the United States.

  On these islands, most homes could not be lived in afterwards.

  Downtown Charleston was hit hard too. But it was spared the worst. If Hugo had tracked a little further south, the city would have flooded far more.

  Look at the houses again.

  The sea did not stop at the sand.
detail: >-
  From the National Weather Service Charleston office's Hurricane Hugo page: landfall at Sullivan's Island around midnight on 22 September 1989 as a Category 4 with estimated maximum sustained winds of 135 to 140 mph, a storm tide of 15.0 feet above mean sea level at Isle of Palms, the highest storm tide heights ever recorded on the US East Coast, the majority of homes on Sullivan's Island and Isle of Palms rendered uninhabitable, and the observation that a track slightly further south would have flooded downtown far more. The script says "above sea level", not above the ground.
