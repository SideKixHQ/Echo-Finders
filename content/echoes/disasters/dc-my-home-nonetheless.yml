teaser: "Last night I watched my house burn. Not the house where I live."
script: |
  Look at the long brick market hall, with its tall arched windows and the round ones high up. From the day it opened, in eighteen seventy three, it never shut its doors. Not once.

  Until a Monday morning in the spring of two thousand seven. A fire started in a trash bin behind the building. It took a hundred and sixty firefighters two hours to put it out. The southern half of the hall was destroyed.

  Bonny Wolf lived one block away. She stood out in the dark with her neighbours, and watched the flames come through the roof. Then she wrote this. Last night I watched my house burn. Not the house where I live, but my home, nonetheless.

  Her son had grown up working for the farmers who came to the market on weekends. He rang her from New York, his voice shaking. People at work think it's so strange that I care about this, he said. But Mom, I grew up at the market.

  It was the last of this city's old public markets still working. Two years later, it opened again, and hundreds cheered when the mayor cut the ribbon. Bonny went back. At one counter she asked what she owed, and the man told her it was fine. We'll rip you off the next time you're in here.

  There was going to be a next time.
