teaser: "Two identical tankers, fifteen years apart, ended up in the same spot."
script: |
  Look down at the rocks below Lands End. At low tide, if you know where to look, there are engines sitting in the surf.

  They came from two oil tankers. Sisters, built identical.

  In October 1922, the Lyman A. Stewart left San Francisco Bay in thickening fog. A freighter was headed in through the Golden Gate. Horns and whistles were muffled in the fog, and neither ship saw the other until it was too late.

  Her captain ordered the crew to abandon ship, and stayed aboard to steer her to shore. She ripped her hull open on the jagged rocks of Lands End.

  Fifteen years later, her sister met a similar fate in the same spot. In March 1937, the Frank H. Buck was on her way through the Golden Gate in fog, and crashed head-on into a passenger liner.

  The liner merely suffered a crushed bow. The tanker came to rest off Lands End, right next to her sister.

  In 1938 both wrecks were dynamited to clean up the harbor approach. What the dynamite left is still down there.

  Same design, same fog, same rocks.
