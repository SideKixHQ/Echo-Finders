teaser: "The Titanic never reached New York. New York built her a lighthouse anyway."
script: |
  Look at the small white lighthouse standing at the top of Fulton Street. It is a long way from the sea, at the end of a street of shops.

  It was built for a ship that never arrived.

  The Titanic sank on the fifteenth of April, nineteen twelve. She hit an iceberg on her first voyage, on her way to America.

  The next year, New Yorkers paid for a memorial. Not a statue. A lighthouse. It was raised by public subscription, in memory of the passengers, the officers and the crew.

  They put it on the roof of the Seamen's Church Institute, a thirteen storey building on South Street where sailors could sleep and eat and find a church. A lighthouse on a rooftop, looking out over the harbor, for the people who never sailed into it.

  Years later, the lighthouse came down from the roof and was brought here, to the entrance of the Seaport.

  Look up at the lantern on top.

  It is still keeping watch for a ship that never came in.

