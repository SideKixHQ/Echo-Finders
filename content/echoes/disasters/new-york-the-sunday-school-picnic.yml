teaser: "It was as fine a day for a picnic as ever was."
script: |
  Find the small stone monument near the Tenth Street side of the park. Carved on it, a boy and a girl stand together, looking out at a steamboat.

  That steamboat never brought them back.

  On the fifteenth of June, nineteen oh four, the Sunday School of St. Mark's Lutheran Church, on Sixth Street, set off on its yearly excursion. A boat ride up the East River, and a picnic on Long Island. The neighbourhood around this park was German then. Whole families came, with their lunches packed together. Nearly all of them were women and children.

  It was, one writer said, as fine a day for a picnic as ever was. The band was playing on deck. The children lined up below for ice cream.

  The steamboat was called the General Slocum.

  Somewhere up near the bow, a fire had started. By the time the captain knew how bad it was, the flames were racing through the boat. He kept going, with a fierce tide running, for North Brother Island, a mile and a half on, before he ran her ashore. The life preservers, it was found afterwards, were rotten. Some came apart at the touch of a thumbnail.

  More than a thousand people died, most of them from these few streets.

  Afterwards, many of the German families could not bear to stay. They moved away, and the neighbourhood changed for ever.

  Look at the two children on the stone again.

  They are still watching for the boat.

