script: |
  Look for the small Quaker burying ground on King Street. In nineteen forty one, all that was left above ground was two slabs and two white stones.

  The Quakers had worshipped here since sixteen ninety four, on land given by John Archdale.

  In July eighteen thirty seven, a fire was moving through town. To stop it, the meeting house was blown up, so the flames would have nothing to cross.

  The Quakers rebuilt.

  And in eighteen sixty one, the great fire burned it again.
detail: >-
  From the 1941 Federal Writers' Project guide, Charleston point of interest 54: the Quaker churchyard at 138 King Street, the site given by John Archdale in 1694, two slabs and two white stone markers remaining, the building blown up in July 1837 to stop a fire, rebuilt, and burned again in the great fire of 1861. "So the flames would have nothing to cross" explains the purpose of blowing up a building to make a firebreak; the guide says only "to stop a fire".
