teaser: "Look down Church Street at the walls. There is a reason for what they are made of."
script: |
  Look south down Church Street at the walls. Brick. Stucco over brick. Stone.

  That is not just taste. It is a fire, and a law.

  On the afternoon of the eighteenth of November, seventeen forty, a fire broke out in
  Charles Town. By one account it took every house from about this corner, Broad and
  Church, down to Granville Bastion, at the water's edge, where the East Battery now
  begins. Three hundred houses, by the count at the time, and storehouses, stables and
  warehouses with them. This was the oldest part of town, and full of goods. The tide was
  high that afternoon, and by one account, had it not been, the shipping would have burned as well.

  Parliament in London sent twenty thousand pounds.

  And on the tenth of December, three weeks after the fire, the colony passed an act for
  rebuilding the town. Every new building was to be made of brick, or stone, or both. The act even fixed the prices of building materials, bricks included.

  The town had tried a law like that once before and given it up, because bricks were
  scarce. This time the town was rebuilt of brick. A Charleston historian, writing in nineteen-oh-six, noted that
  many of the small, dark brick houses between Broad and Water Street date from that time on.

  You are standing at the edge of the fire. What it took was rebuilt in the materials the law required.
