tags: [charleston, charleston-core, jails, earthquake-1886, architecture]
teaser: "Look up at the Old Jail. It used to be taller."
script: |
  Look up at the old jail. Heavy walls, towers, the look of a building nothing could move.

  It used to be taller.

  It was built in eighteen-oh-two, and through the eighteen hundreds the main building had a fourth floor. Over
  the eight-sided wing at the back stood a tall tower, which the records call the
  ventilator, or the high cupola.

  On the last night of August, eighteen eighty-six, an earthquake struck Charleston.

  The local paper reported that the jail's walls, in some places nearly three feet thick,
  yielded to the quivering earth like so much glass. Cracks ran from the top of the building
  down into the foundations.

  The jailer made a decision. Rather than leave his prisoners in cells that might come down
  on them, he let them out into the jail yard.

  The yard had a wall around it. The earthquake opened a gap in it.

  There were sixty-nine prisoners in the jail that night. Thirty-six of them went out
  through the gap.

  Afterwards the tower was condemned and torn down, and the top storey was removed. The
  building you are looking at is the jail the earthquake left behind. It went on holding
  prisoners until nineteen thirty-nine.

  It still looks like nothing could get out of it. For one night, more than half of the
  people inside proved otherwise.
