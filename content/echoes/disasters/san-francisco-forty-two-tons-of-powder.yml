teaser: "A wrecked ship with nobody aboard turned out to be the dangerous kind."
script: |
  Look north from here, down at the ruins of Sutro Baths and the rocks around them.

  In January 1887, a schooner called the Parallel left the Golden Gate headed for Astoria, Oregon. Her cargo included forty-two tons of black powder.

  The ship fought head winds and a strong tide for two days. Then the captain ordered the crew to abandon ship near the rocks at Point Lobos. The nine men made it safely to Sausalito.

  The empty schooner grounded near the Cliff House, right there, at the future site of Sutro Baths.

  Rescuers from the Life-Saving Station found no crew on board. They posted watchmen and went to bed. Nobody knew what was in the hold.

  At twelve thirty-four in the morning, after hours of being tossed against the rocks, the powder went off. It demolished the ship, damaged the Cliff House, and sent debris over a mile in all directions.

  The next morning, according to the papers, more than fifty thousand people came out to look.

  A wreck with nobody on it. It was still the most dangerous thing on this shore that night.
