tags: [nashville, downtown, cumberland-river, flood, weather]
teaser: "In May 2010 two days of rain put this river into the city's stadium, arena and symphony hall."
script: |
  Look at the river. It looks tame from here.

  On the third of May, 2010, the Cumberland at Nashville rose to fifty-two and a half feet.

  Two days of rain did it. Thirteen and a half inches fell on the first and second of May. That was more than double the old two-day record.

  The second of May was the rainiest day in Nashville's weather records, which go back to the 1870s.

  Downtown, the football stadium, the hockey arena and the symphony hall all took damage. Upriver, so did the Grand Ole Opry House.

  Eleven people died in the Nashville area.

  And it could have been worse. The river's record is fifty-six feet, set in 1927, before dams controlled the Cumberland.

  The Army Corps of Engineers has said that without the dams, the 2010 flood would have come close to that, or gone past it, right here downtown.

  The river looks tame because people keep a hand on it, upstream.
