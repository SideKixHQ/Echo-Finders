teaser: "Her husband fell beside the gun. She did not step back."
script: |
  Look around this small, high park. You are standing on the site of Fort Washington. In seventeen seventy six, the British were coming for it.

  In that battle, one of the American cannons was worked by a man named John Corbin. Beside him was his wife, Margaret.

  Wives often followed their husbands to that war. They washed and mended, and they nursed. Margaret had followed John into the Pennsylvania artillery.

  Then, in the battle for Fort Washington, John was killed.

  Margaret did not run, and she did not kneel beside him. She took his place at the gun, right away, on the firing line.

  She kept fighting until she was wounded. When the fort fell, the British captured her with the rest.

  They let her go. And then came something new. The Continental Congress gave Margaret Corbin a pension, as a soldier. She was the first woman it ever pensioned.

  Today she lies at West Point, among the army she served.

  Look down the slope again, the way the British came.

  Somewhere on these heights, she held her ground.

