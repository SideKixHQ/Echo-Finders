certainty: contested
certaintyNote: >-
  Which gun fired the first shot of the Civil War is disputed. The National Park Service credits the mortar battery at Fort Johnson commanded by Captain George S. James, firing at 4:30 a.m. on 12 April 1861. The same service says Edmund Ruffin, long popularly credited with the first shot, fired "one of the first shots" from Morris Island. Accounts also differ on who pulled the lanyard of the Fort Johnson mortar; the script does not name anyone for that.
minAge: 10
