tags: [charleston, james-island, fort-johnson, fort-sumter, civil-war, military, first-shot]
teaser: "The honour of the first shot was offered to a man who said no."
script: |
  Look east, across the water, to the low, dark shape of Fort Sumter. In the dark, before dawn, a single shell went up from this shore, and burst over it.

  It was the twelfth of April, eighteen sixty one. Somebody had to be the one who started it.

  That night, an officer rowed out here to Fort Johnson with orders to attack. The honour of firing the first shot was offered to Roger Pryor, a former Virginia congressman, and one of the loudest voices for secession.

  Pryor said no.

  So at half past four in the morning, Captain George James ordered his battery to fire. A ten inch mortar shell soared over the harbour and exploded over Fort Sumter. The war had begun.

  And yet another man claimed that honour. An old Virginian named Edmund Ruffin had predicted that the first shots of a civil war would be fired at Fort Sumter. That morning, on Morris Island, he fired one of the first shots himself. But the signal shot came from here.

  George James was killed at South Mountain in Maryland, seventeen months later.

  Look at Fort Sumter again.

  The first shot was offered. And it was refused.
detail: >-
  Second pass (2026-11-11): the South Carolina Encyclopedia entry on Fort Johnson independently confirms that the signal shot was fired from a Fort Johnson mortar battery on 12 April 1861; Pryor's refusal and James's later death still rest on the National Park Service alone, so factCheck stays single-source. The National Park Service page on George S. James gives the orders brought to Fort Johnson, the offer to Roger Pryor and his refusal, and the 4:30 a.m. mortar shell. Its page on Edmund Ruffin gives his prediction in Anticipations of the Future (1860) and his shot from Morris Island, described as one of the first. James died at South Mountain on 14 September 1862. The Ruffin claim is stated as a claim; the popular credit to Ruffin is in the certainty note, not the script.
