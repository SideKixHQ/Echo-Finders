teaser: "The stone on this hill was laid by people who had escaped slavery, and it was never put to the test."
script: |
  Look at the stone walls on this hilltop. They went up during the Civil War, laid by people who had escaped slavery.

  The Union army called them contraband. It was a legal word for an enslaved person who had made it to Union lines.

  It protected them from being sent back to the Confederates. It also let the army use their labor for its own purposes.

  About twenty-five hundred Black masons, carpenters and laborers built Fort Negley.

  They used sixty-two thousand five hundred cubic feet of stone.

  In December 1864, the Battle of Nashville was fought around this city.

  Nobody attacked this fort. It was too strong to try.

  And nearly thirteen thousand men of the United States Colored Troops helped defend Nashville.

  The best compliment a fort can get is to be left alone.
