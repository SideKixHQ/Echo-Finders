tags: [annapolis, maryland-state-house, war-of-1812, military]
teaser: "In 1814 people climbed up there to watch for the British."
script: |
  Find the dome above you. In the War of 1812 it was a lookout post.

  Annapolis expected to be attacked. The British fleet blockaded the town in April and again in July 1813, and came dangerously close in late August 1814.

  Lookouts used the dome to track the movements of the British navy.

  People moved the state's documents and other valuables out of town.

  A British midshipman sailing past wrote that he could plainly see the inhabitants flying in all directions.

  Alarm guns sounded from the forts, and the militia ran to their posts.

  And then nothing. The British never landed near the city.

  All that watching from up there, and the town came through the war untouched.
