teaser: "The last commander was the one who asked for the job."
script: |
  Look at the stone walls around you. In November of seventeen seventy seven, this was a mud island in the Delaware, and almost everything on it was smashed to splinters.

  The British held Philadelphia. But their ships could not get up the river to feed the army. This little fort was in the way. Three hundred men held it.

  Against it, the British brought more than three hundred guns. Batteries on the islands. Warships. And an old East India ship, cut down into a floating gun platform called the Vigilant.

  On the tenth of November, the guns opened up. They kept on, day and night. The commander was wounded and carried off. His replacement gave up the command. And then a major from Rhode Island named Simeon Thayer stepped forward, and volunteered to take it.

  By the fifth day, the blockhouses had crumbled. The Vigilant came in so close her men were throwing hand grenades. Within a day, the fort no longer existed. Its guns knocked off their carriages. Its walls leveled.

  Thayer would not surrender. Early on the sixteenth, he carried off his wounded, set the ruins on fire, and withdrew across the river in the blaze.

  General Knox said the gunfire on that last day exceeded anything ever seen in America. Congress voted a medal to the first commander. Thayer got nothing.

  Look around these walls once more.

  He was the one who asked to be here.
