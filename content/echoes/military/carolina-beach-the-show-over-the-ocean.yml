tags: [carolina-beach, world-war-ii, military]
teaser: "During the war, people sat on this beach to watch the guns fire at night."
script: |
  Face the ocean. During the war, this beach had a view worth sitting down for.

  Down at Fort Fisher, anti-aircraft gunners trained six days a week. At night, searchlights
  picked out the towed targets, and tracers arched out over the ocean.

  One soldier remembered marrying while he was home on furlough. His wife came down and lived
  at Carolina Beach for several months, just before his unit shipped overseas.

  People could sit down on Carolina Beach, he said, and watch the forties and fifties being shot
  out over the ocean. He meant the forty-millimeter cannon and the fifty-caliber machine guns.

  He called it a really beautiful sight. A few months later, he was on his way to the real
  thing.
