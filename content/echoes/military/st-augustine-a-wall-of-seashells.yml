teaser: "Look closely at this fort's walls. They are made of shells, and in 1702 nobody knew if they would hold."
script: |
  Look closely at the wall of this fort. Those gray blocks are full of shells. Tiny clam shells, glued together over thousands of years into stone.

  The stone is called coquina, which is Spanish for tiny shell. The Spanish began building this fort in 1672, and the coquina was quarried across the water on Anastasia Island.

  Nobody had ever built a fort out of coquina before. Nobody knew how it would stand up to cannon fire. So they built the walls an average of twelve feet thick, and on the ocean side as thick as nineteen.

  In 1702 they found out. An English governor from Charleston captured the town and set up his cannon among the houses. Almost fifteen hundred people had taken refuge inside these walls.

  Instead of shattering, the stone simply compressed and absorbed the shock. The cannonballs bounced off, or sank in a few inches.

  The fort held. On the way out, the English burned the town to the ground.

  A wall of seashells, and it did not break.
