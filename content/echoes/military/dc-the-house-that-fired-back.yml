teaser: "Find the old brick house on the corner, beside the big Senate office building."
script: |
  Find the old brick house on the corner, tucked in beside the big Senate office building.

  It is one of the oldest houses in Washington. But it is not quite the house that was
  first built here.

  The first one went up in 1800. On the twenty-fourth of August 1814, the British army
  invaded Washington.

  According to a claim the owner later filed with Congress, a group of Commodore Joshua
  Barney's men, retreating from the battle at Bladensburg, got into this house and shot at
  the British troops coming up the street.

  They killed several men. They also killed the horse of the British commander, General
  Ross.

  Ross's troops set the house on fire, and it was destroyed.

  The house you are looking at was rebuilt on the same spot by 1820.

  A little over a century later, the National Woman's Party bought it, and campaigned for
  equal rights from here, just behind the Capitol.

  In the 1960s, when the Senate office building next door was going up, the house was
  threatened again. The Woman's Party lobbied to have it protected, and won.

  This time, nobody had to fire a shot.
