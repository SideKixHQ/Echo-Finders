tags: [charleston, james-island, secessionville, fort-lamar, civil-war, military, battle]
teaser: "His commander told him not to attack. He waited until the commander left."
script: |
  Find the low walls of earth beside the road. This was a Confederate battery, first called the Tower Battery, then Fort Lamar. It stands at the narrowest point of the peninsula, about a hundred and twenty five yards across, with marsh on both sides.

  That narrow neck decided a battle.

  In June eighteen sixty two, Union troops were working their way across the islands toward Charleston. Their commander, General David Hunter, warned General Henry Benham not to attack. Then Hunter left for Hilton Head.

  Benham used his absence. On the morning of the sixteenth of June, he sent his men straight at these walls.

  The ground did the rest. The marsh forced the attackers into the mouths of the guns. The pluff mud kept a second column from getting round the side. After three hours, Benham pulled back. Nearly seven hundred of his men were killed, wounded or missing.

  Benham was arrested. Then he was reduced to the rank of major.

  The Union never came this way at the city again.

  Now look just to the west of the walls. Under that ground is the unmarked grave of three hundred and forty one Union soldiers, buried by the men they had been fighting.

  When the site was surveyed in nineteen seventy nine, it was a horse pasture.

  The horses grazed on it.
detail: >-
  The South Carolina Encyclopedia entry (Pat Brennan) gives Hunter's warning to Benham and his departure for Hilton Head on 11 June, Benham's assault on the Tower Battery on the morning of 16 June 1862, the marsh forcing the attackers into the guns, the pluff mud stopping the second wing, the withdrawal after three hours, nearly 700 casualties, and the view that Secessionville blunted the North's best chance to take Charleston. The National Register nomination for the Secessionville Historic District (1979) gives the fort at the narrowest point of the peninsula, about 125 yards wide with marsh on both sides, the names Tower Battery and Fort Lamar, Benham's arrest and reduction to major, the unmarked grave of 341 Union soldiers directly west of the battery, buried by Confederate troops, and both sites in use as horse pasture. The sources differ on the size of the Union force (about 3,500 in the nomination, 4,500 in the encyclopedia), so the script gives no number for it. "The Union never came this way at the city again" rests on the nomination's statement that the victory led to the withdrawal of Union forces from James Island and ended a major offensive; a reviewer may prefer the encyclopedia's softer wording. Whether the grave is marked today was not checked; the script ties "unmarked" and the pasture to the 1979 survey.
