teaser: "The ground was frozen too hard to dig a fort. So they brought one with them."
script: |
  Look up at the white marble tower. It stands on the last of the hills that once looked down on Boston and its harbour.

  In the winter of seventeen seventy six, the British held Boston, and the Americans had them trapped. Whoever fortified this hill could fire down on the town. But the ground was rocky and frozen. Nobody could dig a fort into it fast enough.

  Then one of Washington's officers, Rufus Putnam, came across a word in a military engineering book. Chandeliers. He did not know what it meant.

  It meant wooden frames, built somewhere else and carried in, then filled with bundles of sticks and bales of hay to stop the shot. A fort you could bring with you.

  The army spent February nailing them together. Then, in one night in March, more than twelve hundred men and three hundred oxcarts hauled everything up this hill as quietly as they could.

  At dawn on the fifth of March, Boston woke up to cannon above it. The British general, William Howe, is reported to have said: My God, these fellows have done more work in one night than I could make my army do in three months.

  Twelve days later, the British left Boston.

  It began with an officer who did not know what a word meant, and looked it up.
detail: >-
  The Library of Congress Bibliomania blog (25 February 2026) gives the frozen, rocky ground, Lieutenant Colonel Rufus Putnam not knowing the term "chandeliers" from John Muller's The Attack and Defense of Fortified Places, Muller's definition, the army building frames and tying fascines and hay bales in February 1776, and Howe's reported words. The National Park Service page for Dorchester Heights gives the last surviving hill, the night of 4 March, more than 1,200 soldiers and volunteers and 300 oxcarts, the dawn of 5 March revealing the fort, the same Howe quotation, and the evacuation on 17 March. The two sources disagree on the night: the blog says "the night of March 5th", the park service says 4 March with the works revealed at dawn on 5 March; the script follows the park service and does not name the night. Howe's words are told as reported, because both sources hedge or quote them second hand. Knox's guns from Ticonderoga, which also made the position work, are left out to keep one idea.
