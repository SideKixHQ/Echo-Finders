tags: [charleston, charleston-core, denmark-vesey, the-citadel, architecture]
teaser: "It looks like a fortress because it was one."
script: |
  Look at the long building on the north side of the square. Battlements along the roof. Towers at the corners. It looks like a fortress because it was meant to be one. Not against a foreign army.

  In eighteen twenty two, the authorities said they had uncovered a plan by enslaved Charlestonians to rise and take the city. In the aftermath, the state built an arsenal here, to house a guard of armed men who patrolled the city. When federal surveyors described the building in the nineteen fifties, they put its purpose plainly. A safeguard against slave uprisings.

  In the eighteen forties, cadets of a new state military academy moved in. That academy was the Citadel. For decades its cadets drilled and paraded on the grass in front of you, which was called Citadel Green.

  The building kept growing. A third storey, then wings, then a fourth. In nineteen twenty two the academy left the building, and after it moved away the green was renamed for Francis Marion.

  The building is a hotel now. It still has the battlements.
