teaser: "Find the plaque on the lodge. It starts with the name of a different hill."
script: |
  Find the plaque on the eastern wall of the lodge beside the monument. It begins with two
  words. Breed's Hill.

  You are not standing on Bunker Hill. Bunker Hill is the higher one, to the northwest. A
  church stands on top of it now.

  In June seventeen seventy-five, the colonial officers had orders to fortify Bunker Hill.
  They talked it over, and on the night of the sixteenth they dug in here instead. This hill
  was lower, but it was closer to Boston and steep for anyone marching up it.

  At the time, it barely had a name of its own. Some locals called it Breed's, after a family
  whose cattle grazed here.

  The battle was fought on this hill the next day, and it went into print as Bunker Hill. A
  British map even swapped the two hills round.

  The Breeds asked for the battle to be renamed almost at once. In the seventeen nineties they
  bought land up here, and asked again. They kept asking for decades.

  In nineteen twenty-three, the state finally gave them something. Not the battle. The plaque.

  Read it. Breed's Hill. Site of the Battle of Bunker Hill.

  That is as far as anyone was ever willing to go.
