tags: [san-francisco, presidio, crissy-field, world-war-ii, military, japanese-american, nisei]
teaser: "In a tin hangar on this field, the Army ran a secret school in 1941."
script: |
  Somewhere along the edge of this old airfield is a hangar called Building 640. In November 1941, the Army turned it into a school.

  One of the teachers described it as an abandoned, empty, unpainted, crusty-looking corrugated tin building.

  The students were Nisei, Japanese Americans born to parents who had come from Japan. The Army needed them as translators in a war with Japan. They learned terms for every branch of the Japanese military, and how to read the handwritten diaries Japanese soldiers kept.

  After lights out at ten at night, students could regularly be found studying in the bathroom. It was the only place in the building where the lights were kept on.

  In February 1942 an executive order sent people of Japanese descent away from their homes. The students and teachers here were not given leave to help their own families.

  In May 1942, forty-five of them graduated. The program went on to turn out six thousand graduates. One general credited the linguists with ending the war two years early.

  For decades, hardly anyone knew. The work stayed classified until the 1970s.
