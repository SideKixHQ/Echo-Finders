tags: [fort-fisher, kure-beach, world-war-ii, military]
teaser: "The army had to teach its gunners how to live on a beach."
script: |
  Look at the water and imagine you have never seen it before.

  Many of the men who trained here in the war came from the interior of the country, and had
  never seen a beach. Federal Point was a shock. There was sand in everything, and mosquitoes.
  One soldier called it a forlorn spit of sand and scrub growth, pinched between the Atlantic
  Ocean and the Cape Fear River.

  So the post taught them the beach. Swimming lessons. Advice on how to avoid sunburn. Beach
  safety. More than a few refused to eat the fried clams and oysters.

  For a show, they boxed. In January 1944, the boxing champion Joe Louis came to visit.

  They had come to learn to shoot down aircraft. Before that, they had to learn the ocean.
