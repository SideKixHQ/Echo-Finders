teaser: "In June 1862 a river battle was fought in front of this city at dawn, and Memphis fell by breakfast."
script: |
  Look out over the river. On the sixth of June, 1862, a battle was fought on the water in front of this city.

  The Confederate army had already pulled its troops out of Memphis. What was left to defend it was a small river fleet, and a few soldiers camped outside town.

  The Union boats set out from an island just north of Memphis a little after four in the morning. They arrived off the city about half past five, and the battle began.

  It lasted an hour and a half. When it was over, the Union had sunk or captured every Confederate boat but one.

  Then the son of the Union colonel, a medical cadet named Charles Ellet, went ashore, met the mayor, and raised the Union flag over the courthouse.

  Memphis, one of the great trading cities on the Mississippi, had fallen. Another stretch of the river was open to Union shipping.

  A city that size, taken before most people had finished breakfast.
