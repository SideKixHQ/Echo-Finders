teaser: "The whole army got away in the night. One officer went back for his horse."
script: |
  Look down this street to the water, where the old ferry landing is.

  In August, seventeen seventy six, George Washington's army was trapped on this side of the river. They had just lost the Battle of Brooklyn. In front of them was a British army nearly three times their size. Behind them, a mile of fast water, and a British fleet that could close it.

  On the night of the twenty ninth, they started to leave. Quietly, one regiment at a time, so no gap would show in the lines. Washington stood here, at the ferry, watching them go. Fishermen from Marblehead, Massachusetts, rowed them over, all night, against the tide, without being seen or heard by the British warships.

  By dawn, there were still men in the trenches. Then a fog came down.

  A young officer named Benjamin Tallmadge was in that last guard. The fog was so dense, he wrote, that I could scarcely discern a man at six yards' distance.

  When his regiment reached the ferry, he stepped into one of the last boats. He thought he saw Washington on the ferry stairs. And he left his horse tied to a post, right here.

  Safe on the other side, he could not stop thinking about that horse. So he asked permission, found a crew of volunteers, and rowed back through the fog. He got his horse, and pushed off just as the British reached the landing. They fired at him with muskets, and then with cannon.

  He made it.

  Look at the water again. Nine thousand men crossed it in one night, with their horses and their guns.

  Even the horse.

