teaser: "Long ladders ran up the tallest pines here. Somebody was watching the sea."
script: |
  Look up at the tallest trees you can see, and picture a ladder leaning against one, all
  the way to the top.

  In 1861, soldiers arriving on Federal Point noticed long ladders stretching to the highest
  reaches of the tall pines. The locals explained. River pilots climbed them with a spy glass
  to watch the ocean for incoming blockade runners.

  When a pilot got the signal, he hurried down to his small boat, went out to the ship, and
  guided it to the mouth of the river and on up to Wilmington.

  The Confederacy's last great supply line began, some nights, with a man at the top of a pine
  tree, waiting to see a ship.
