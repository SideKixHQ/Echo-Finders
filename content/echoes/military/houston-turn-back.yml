teaser: "The most powerful man in Mexico was found hiding in the grass, dressed as a private."
script: |
  Look west, toward the trees by the bayou. The Texans camped there, in the curve of the water.

  The day after the battle, a prisoner was walked into that camp in a private soldier's clothes. He was the President of Mexico.

  The battle had ended on the evening of the twenty first of April, eighteen thirty six. Santa Anna was not among the prisoners.

  The next day, a man was found hiding in the weeds. He wore a tattered, mud stained private's uniform. Dressed like that, he was taken to General Houston.

  Sam Houston had been badly wounded in the battle. He was lying under an oak tree.

  So the president of a nation stood in front of a wounded man on the ground. And lying there, Houston dictated the terms. Every Mexican army in Texas would withdraw, below the Rio Grande.

  Far to the east, families who had run from the war were still out on the prairie, in the rain. One of them, Dilue Harris, later remembered a man on horseback, waving his hat.

  Turn back, he was shouting. The Texas army has whipped the Mexican army. No danger. Turn back.

  Look at the trees again, where the prisoner was brought in.

  And all over Texas, people turned around.

