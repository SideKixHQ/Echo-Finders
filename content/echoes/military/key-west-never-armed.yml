teaser: "A fort, built against a war, that the same war made useless."
script: |
  Look at the square brick tower in the middle, behind the low walls. On the side facing the sea, its walls are more than eight feet thick.

  Work began in eighteen sixty two, in the Civil War, because the Union feared Confederate forces would attack the island.

  Its job was to guard the land side of Fort Taylor, against an enemy landing. Four towers were planned. Only two were begun.

  Then, in eighteen sixty six, the orders came to stop. It was never finished. No gun was ever mounted on it.

  The reason was the war itself. New rifled artillery had come into use, and towers like this one were obsolete.

  It stood empty and unarmed for a long time. In nineteen fifty, it opened as a museum.

  So the fort was out of date before it was finished. And what it guards now is a collection.
detail: >-
  From the National Register of Historic Places nomination for East Martello Tower (1972): begun in 1862 out of fear of a Confederate attack, to secure the island and the land side of Fort Taylor against landing forces; four towers planned and two begun; work suspended in 1866, never completed and never armed, the type proven obsolete by rifled artillery in the Civil War; a square central tower 56 feet on a side with seaward walls 8 feet 4 inches thick; used for defence purposes in later wars, declared surplus in 1944, and opened as the Key West Art and Historical Society's museum in 1950. "Stood empty" compresses the later wartime uses; the script says only that it stood unarmed. Robert the Doll is kept in this museum; that legend is not in this echo because no source reachable from this session covered it.
