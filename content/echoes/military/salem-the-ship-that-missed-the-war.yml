teaser: "The crew sailed home from Russia without knowing their country was at war."
script: |
  If a tall ship is tied up at this wharf, it is a copy, built to look like a Salem ship from 1797.

  The original Friendship made fifteen voyages, to China, India, Russia and beyond, and came home with pepper, silk, sugar and coffee.

  In the summer of 1812 she was in Archangel, in Russia, when war began between Britain and the United States.

  Nobody on board knew. The captain and crew set off for Salem.

  On the fifth of September a British warship, HMS Rosamond, stopped them in the Atlantic, and took them as a prize of war.

  The crew made it home to Salem. The ship did not. She was sold at auction in London in March 1813.

  The war was months old before the news reached them. It came as a warship.
