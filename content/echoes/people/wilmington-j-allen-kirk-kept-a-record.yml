script: |
  J. Allen Kirk came to Wilmington as a Baptist pastor in 1897. The following year, the
  coup forced him to seek safety.

  He later published an account of the violence and his escape. That record preserves the
  perspective of a Black community leader who experienced the danger directly.

  Historians disagree on some details of his route and timing. His account should be read
  as testimony, with its particular viewpoint, rather than treated as an all-seeing
  description of every event.

  Listen beside the marker. Kirk survived the attempt to silence and drive out people like
  him, then made a written record. His story demonstrates another form of resistance:
  preserving an experience so later generations would have evidence beyond the version
  offered by those who seized power.
