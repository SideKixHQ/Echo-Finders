teaser: "He was property when he plastered these walls."
script: |
  Look up at the plaster where the wall meets the ceiling. The leaves, the scrolls, the
  run of it around the whole room. That was pressed into place wet, by hand, and it had to
  be finished before it set. There is no going back over plaster.

  Some of the hands that did this work belonged to men who were owned.

  The house was designed for a wealthy physician and merchant, Doctor John Bellamy. It
  went up between eighteen fifty-nine and eighteen sixty-one, and the museum's own account
  is plain about who did the work: skilled enslaved workers and local free Black artisans.
  Twenty-two rooms. Ten thousand square feet.

  One of the plasterers was a man named George Price.

  Hold that, because the next part happens quickly.

  Seven years after the plaster dried, in eighteen sixty-eight, George Price was elected
  to the North Carolina state legislature, as one of three representatives for New Hanover
  County.

  The same year, on the fourth of July, President Johnson issued an amnesty to former
  Confederates. A man was pardoned for the war he had lost, and another, who had been
  property while this ceiling was going up, was sent to help write the laws.

  That day is worth standing in for a moment.

  White Wilmington did not come out. The town's own paper, the Daily Journal, reported it
  with its teeth showing. The only public demonstrations, it said, were not by the whites,
  for whom the Declaration was made, but by negro organizations of small boys and the fire
  companies, parading the streets, rejoicing in a new found feeling of patriotism which
  they are incapable of analyzing.

  Hear that again. A newspaper watching Black children march on Independence Day, and
  deciding the problem was that they did not understand it.

  They understood it.

  And then it was ordinary. For thirty years, Black Wilmingtonians served as elected
  officials, ran businesses, worked as civil servants, led civic life, in the same streets
  you are standing in.

  It did not fade out. It was taken. In eighteen ninety-eight Democrats forcefully
  installed a new city government, and the coup was followed by a massacre. North Carolina
  moved quickly to disenfranchise Black voters. The museum's account gives the aftermath a
  single flat sentence: it would take over sixty years and the struggle for Civil Rights
  for freedom and equality for all to come into focus once again.

  Look back at the ceiling.

  The plaster George Price put up is still there. It outlasted his seat in the legislature
  by more than a century.
