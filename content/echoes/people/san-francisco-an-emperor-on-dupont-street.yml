teaser: "The city's only emperor printed his own money, and the banks took it."
script: |
  You are on Grant Avenue. In eighteen eighty, it had another name. Dupont Street.

  Picture a man walking along it in a blue army uniform, with brass buttons and gold braid, and a plumed beaver hat. Everybody knew him. He called himself Norton the First, Emperor of North America and Protector of Mexico.

  He was an Englishman who had lost a fortune. For two decades after that, he went from one part of the city to another, seeing to it that policemen were on duty and sidewalks were clear. He inspected every building going up. The newspapers solemnly printed his proclamations.

  When he needed money, he issued bonds for fifty cents. Banks, restaurants and stores honoured them.

  In January, eighteen eighty, he was walking along Dupont Street when he fell to the pavement. People helped him to his feet and leaned him against a building to rest.

  He died there, without a struggle.

  More than thirty thousand people came to his funeral. Not bad, for an emperor with no empire.
detail: >-
  The Silver State (Unionville, Nevada), 10 January 1880, via Chronicling America: Emperor Norton died suddenly the day before, walking along Dupont Street, fell to the pavement, was helped up and placed against a building, and died without a struggle. The 1940 Federal Writers' Project guide to San Francisco gives the blue army uniform, brass buttons, gold braid and plumed beaver hat, "Norton I, Emperor of North America and Protector of Mexico", the mildly insane Englishman after heavy financial reverses, two decades of seeing that policemen were on duty and sidewalks unobstructed, inspecting buildings under construction, newspapers solemnly publishing his proclamations, 50 cent bonds honoured by banks, restaurants and stores, and a funeral in 1880 attended by more than 30,000. The same guide glosses Dupont Street as Grant Avenue. Two independent sources.
