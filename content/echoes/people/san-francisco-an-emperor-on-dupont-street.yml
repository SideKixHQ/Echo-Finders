# Listening spot: The public sidewalk at the Chinatown Gate, Grant Avenue and Bush Street. Grant Avenue was Dupont Street in 1880.
# Position: The Grant Avenue and Bush Street corner at the Chinatown Gate, from general map knowledge (high confidence for the corner). The 1880 report says only that Norton fell "walking along Dupont street", so the script places him on the street, not at this corner.
