teaser: "He recorded a tape, to be played only if he was killed."
script: |
  Look at the shopfront at five seventy five Castro Street. In the nineteen seventies it was a camera shop. Castro Camera. It belonged to Harvey Milk.

  Now look down. A monument outside the shop covers some of his ashes. In a city that bans burials, it is one of the exceptions.

  It was his campaign headquarters, all four times he ran for office. From nineteen seventy five, he lived in the apartment upstairs.

  On the fourth try, he won. He became the first openly gay man ever voted into office in the United States, as a San Francisco supervisor.

  He knew what that might cost. Not long before he was killed, he recorded a kind of political will on a cassette tape. It begins:

  This is to be played only in the event of my death by assassination.

  On the twenty seventh of November, nineteen seventy eight, he and Mayor George Moscone were shot and killed. He had been on the board for eleven months.

  On the tape, he talks about a phone call from a frightened teenager in Altoona, Pennsylvania, who had read about him in the news.

  You got to give them hope, he says.

  Look at the shop window again. That is where he started. And where part of him still is.
detail: >-
  NBC News (2023) gives Castro Camera as the shop Milk owned from 1972 until his murder in 1978, his headquarters in four runs for office, the apartment above from 1975, and the 2000 city landmark designation. NPR (2008) gives the first openly gay man ever voted into office in the United States, the cassette tape and its opening words, the announcement by Dianne Feinstein on 27 November 1978 that Moscone and Milk had been shot and killed, eleven months on the board, and the Altoona caller and "You got to give them hope"; NPR adds that Milk's friends think the Altoona caller may have been a rhetorical device. NBC News (2018) dates his election to one year before his death. CBS San Francisco gives 575 Castro Street, and the monument outside the former Castro Camera covering some of Milk's ashes, an exception to the city's ban on burials. The convicted killer, Dan White, is not named; he is dead and the echo is about Milk. "On the fourth try" follows from four runs and the win; a reviewer may want that checked.
