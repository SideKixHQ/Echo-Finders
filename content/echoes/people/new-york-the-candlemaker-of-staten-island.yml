teaser: "Italy's liberator once made candles for a living, right here on Staten Island."
script: |
  Look at the little frame cottage in front of you. Plain. Small. Easy to walk past.

  For two years, a man Italians remember as their liberator lived inside it. Making candles.

  His name was Giuseppe Garibaldi. There is a statue of him across the harbor, in Washington Square in Manhattan.

  But from eighteen fifty one to eighteen fifty three, he was here. Far from home. Living in the house of a friend, Antonio Meucci. And he supported himself the plainest way he could. He made candles.

  The liberator of Italy, in a cottage on Staten Island, making candles to pay his way.

  Then he left.

  Meucci stayed. In nineteen thirty nine, his grave was on the lawn in front of the house, marked by a bust.

  Look at the cottage again.

  A hero, between chapters.

