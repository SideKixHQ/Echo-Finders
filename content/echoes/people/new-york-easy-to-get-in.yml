teaser: "She acted perfectly sane inside. That was the problem."
script: |
  Look up at the tower in front of you, the one with eight sides and a dome. It is all that is left of a building nobody wanted to be sent to.

  This island was called Blackwell's Island then. The tower was the way in to the city's lunatic asylum.

  In September, eighteen eighty seven, a young reporter came here on purpose. She worked for Joseph Pulitzer's paper, the World. She wrote under the name Nellie Bly. To get in, she pretended to have lost her memory, and gave her name as Nellie Brown. It worked.

  Once she was inside, she stopped pretending.

  She talked and acted as she always did. And here is what she wrote. The more sanely I talked and acted, the crazier I was thought to be.

  She met women who were as sane as she was. Many could not speak English well enough to tell anyone so. She saw ice cold baths, filthy rooms, and spoiled food.

  She spent ten days inside. Her reports became a book, and a grand jury came to the island to see for itself. The city found a million dollars more a year for the care of people like the women she left behind.

  She had one line for this place, and it is still the best one.

  It is easy to get in. But once there, it is impossible to get out.

