teaser: "The little tower on that roof was a lookout. In 1893 its keeper had one very long day."
script: |
  Across the road, among the beach cottages, look for a house with a small tower on its roof. That tower was a lookout.

  This was the Oak Island Life Saving Station, built in 1889. Around 1938 it was sold, and moved across the road to be a beach cottage. It is a private home, so look from here.

  From the tower, one man kept watch while a second man patrolled the beach.

  In August 1893, a hurricane came ashore at Charleston. The regular crew of surfmen did not report for duty until the first of September. So the keeper, Dunbar Davis, made his rescues with volunteers.

  That day, they rescued five schooners.

  The coastal historian David Stick called it the long day of Dunbar Davis.

  Davis kept this station from 1891 to 1915. The tower he watched from is still up there, on a summer house.
