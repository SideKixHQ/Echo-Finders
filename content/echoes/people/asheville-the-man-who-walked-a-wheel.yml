tags: [asheville, george-masa, great-smoky-mountains, appalachian-trail, photography]
teaser: "A hotel valet borrowed a camera, then measured the Smoky Mountains with half a bicycle."
script: |
  Somewhere near here, George Masa kept his photography studio.

  He was born in Osaka, Japan, as Masahara Iizuka. Nobody is even sure what year. He arrived in Asheville in 1915, and went to work at the Grove Park Inn, in the laundry and as a valet. He borrowed a camera, and started photographing the guests.

  Then the mountains took over. In the mid-1920s he joined the movement to create the Great Smoky Mountains National Park. He photographed the trails, mapped them, and measured them. He measured them with an odometer he designed himself, made from the front end of a bicycle.

  Picture it. A man pushing half a bicycle through the Smokies, counting the turns.

  He helped route and mark the Appalachian Trail too. His friend Horace Kephart wrote that he did it on his own hook, without pay, out of sheer loyalty to the park idea. He deserves a monument, Kephart said.

  George Masa died penniless in 1933. In 1961 a landmark in the Smokies was named for him. Masa Knob.
