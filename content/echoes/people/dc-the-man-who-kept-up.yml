teaser: "The President's walks went straight through the creek. One diplomat never fell behind."
script: |
  Find the long granite bench, looking down over the road and the creek. It is the only memorial of its kind in this whole park. It is for a Frenchman.

  Why him?

  In the nineteen hundreds, President Theodore Roosevelt came to this valley for what he called point to point walks. You picked a spot, and walked straight to it. You did not turn aside for anything. Not even the creek.

  He wrote about it later. On several occasions, he said, we swam Rock Creek in the early spring, when the ice was floating thick upon it. They timed it so they got back to Washington after dark, so nobody would see the state they were in.

  Few people could keep up with him. One who could was Jules Jusserand, the French ambassador. A scholar, with a doctorate in history. He went on the walks, and he kept up. He died in nineteen thirty two.

  Years later, friends raised money for this bench in his memory. Another President Roosevelt, Franklin, dedicated it in nineteen thirty six.

  So sit down on it, if you like.

  He never got to.
