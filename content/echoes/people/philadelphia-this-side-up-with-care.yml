teaser: "Someone knocked on the lid of the crate. A voice answered."
script: |
  Look along Fifth Street. Somewhere on this street, in eighteen forty nine, stood the office of the Pennsylvania Anti Slavery Society. Early one morning, an express wagon pulled up outside it, with a wooden crate on the back.

  The crate was three feet long and two feet wide. It was marked, this side up with care. It had come from Richmond, Virginia. And there was a man inside.

  His name was Henry Brown. He was enslaved in Richmond, and he had himself nailed into that box, with a bladder of water and a few biscuits. He breathed through three small holes. He was carried on his end, head downwards, though the box said this side up. On a steamboat he was left on his head for what felt like an hour and a half. His eyes, he said, were almost swollen out of their sockets. Near Washington, he heard two men guess the box was the mail. Yes, he thought. A male, indeed.

  Inside the office, the door was locked. A man rapped quietly on the lid and called out, all right? And from inside came the answer. All right, sir.

  They cut the hoops and lifted the lid. He rose up in the box, held out his hand, and said, how do you do, gentlemen?

  From that day, he was Henry Box Brown.

  Look down Fifth Street again. Twenty six hours from Richmond.

  All right, sir.
