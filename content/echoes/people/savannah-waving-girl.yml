teaser: "Sailors had a story about why she waved. She did not confirm it."
script: |
  Look at the statue, waving at the river.

  Her name was Florence Martus. She was born in eighteen sixty eight on Cockspur Island, at the mouth of this river, the daughter of a sergeant at Fort Pulaski. As a small child she waved her handkerchief at the passing ships, and the sailors waved back.

  A few years later she went to live with her brother George, a lightkeeper, in a cottage on Elba Island, between here and the sea. And she kept waving. A cloth by day. A lantern by night. Every ship in. Every ship out.

  The ships answered. Steamers gave three blasts of the whistle. Sailing ships dipped their flags. A reporter wrote that a letter addressed only to the Waving Girl would probably reach her from anywhere in the world.

  The sailors had a story about why. A sweetheart lost at sea, they said, and she waved so that she would be the first to greet him when he came home.

  She never confirmed it. In nineteen twenty three she told a reporter that the sailors were all her sweethearts.

  In nineteen thirty one her brother retired, and she came ashore with him. She had been waving for forty four years.

  She died in nineteen forty three. Here, she is still at it.
