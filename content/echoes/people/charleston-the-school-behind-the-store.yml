teaser: "A grocery store with fuel pumps, a gym, and a classroom that changed the vote."
script: |
  Look at the long, low building by the road. It had fuel pumps out front once, and a grocery store inside. It also had a classroom that changed the South.

  It starts with a dog. In nineteen forty eight, a man on this island, Sammy Grant, was attacked by a white man's dog. He defended himself, and the man shot him. A magistrate dismissed the case.

  Esau Jenkins would not leave it there. He and Joe Williams raised money from the islanders, appealed, and won. The dog's owner was convicted. Then they started a club to keep helping. They called it the Progressive Club.

  Jenkins saw the next problem. Many adults on the island could not read, so they could not register to vote. He needed a teacher.

  Septima Clark was a teacher from Johns Island who had been fired by the state for belonging to the NAACP. Together with Bernice Robinson, they began a citizenship school here, in nineteen fifty seven, in an old schoolhouse the club had bought.

  It worked. Citizenship schools spread to Edisto, to St. Helena, and beyond. Doctor Martin Luther King Junior came to this island twice.

  Look at the building again. Hurricane Hugo tore its roof in nineteen eighty nine.

  The lesson it taught is still standing.
detail: >-
  From the National Park Service listing of the Progressive Club (African American Civil Rights Network, 2021): the Sammy Grant case of 1948, the appeal and conviction, Jenkins's meeting with Highlander in 1954, Septima Clark's dismissal for NAACP membership, the citizenship school of 1957 in the former Mount Zion Elementary School, the present building of 1962 to 1963 with its grocery store and fuel pumps, the spread to Edisto and St. Helena, Dr. King's two visits, and the Hugo damage of 1989.
