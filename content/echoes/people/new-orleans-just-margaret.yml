teaser: "One word on the base. No last name."
script: |
  Look at the statue. A woman sitting in a chair, her hand on the shoulder of a child.

  Now look at the base. One word. Margaret. No last name.

  Her name was Margaret Haughery, and she came from Ireland, and she could not read.

  This city knew her driving a milk wagon through the streets, winter and summer, in a large black bonnet. Later she ran a bakery, famous all over the city for its bread. She never owned a silk dress or a pair of kid gloves. The money went to orphans.

  When she died, there was not an institution for the poor in New Orleans that was not an heir to her money. She was Catholic, but Protestant and Jew, Black and white, all had a share.

  In the summer of eighteen eighty four, the city unveiled this statue in front of thousands of people. The cord was pulled by eight people, each one from an orphanage. Nine hundred and twenty six orphans, from ten institutions, were there to watch.

  Look at the name again.

  Margaret was all anyone here ever called her.
detail: >-
  Margaret Haughery died in 1882; the statue by Alexander Doyle was unveiled in July 1884. The National Park Service calls it the first statue erected in honor of a woman in the United States; a Savannah paper the same year counted it among three statues to women raised that year, so this echo does not claim it was the first.
