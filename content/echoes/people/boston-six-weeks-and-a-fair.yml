detail: >-
  The National Park Service article on the Bunker Hill Monument Fair gives the 1825 cornerstone, the failed subscription drives since 1825, Hale's campaign for women to give $1 and the newspaper criticism, the Ladies' Fund of only $2,937.90 by 1840, the sewing circle of Seaman's Aid Society members, the appeal to women's networks for crafts, art and kitchen specialties, "Six weeks later", the fair on the second floor of the Faneuil Hall Market (today Quincy Market) from 10 to 15 September 1840, the temporary stairway from the street, 35,600 visitors, nearly 40 percent of Boston's 1840 population, $33,067 against a $30,000 goal, and the top stone laid on 23 July 1842. The NPS article on building the monument gives the two stoppages for lack of money, the 85 feet reached by November 1835, 135 feet short of the 220 foot goal, and the proposal to cut it to about 160 feet. The NPS page on Hale says the sewing circle was "led by Sarah Josepha Hale". All three are NPS, so this is single-source by publisher. Hale also wrote Mary Had a Little Lamb (NPS Hale page); it is left out to keep one idea, and would make a good kids echo. "Fifteen years" counts from the 1825 cornerstone to the 1840 fair.
