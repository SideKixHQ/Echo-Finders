teaser: "The men had fifteen years to pay for the monument. The women took six weeks."
script: |
  Look up into the dome of Quincy Market. In September eighteen forty, the floor up there was a fair. It finished the Bunker Hill Monument.

  The monument's cornerstone was laid in eighteen twenty five. Then the money ran out. Then it ran out again. By eighteen thirty nine it stood on its hill in Charlestown at eighty five feet, not much more than a third of its planned height. Its backers were talking about making it shorter.

  Men had been raising money for it for years, and falling short. A magazine editor, Sarah Josepha Hale, had asked women to give a dollar each. Newspapers attacked her for it.

  So in the summer of eighteen forty, a sewing circle Hale led tried something else. A women's fair. They wrote to women's groups across New England and down the coast, asking for crafts, art and things from their kitchens. Six weeks later, the fair opened up there.

  Visitors climbed a temporary staircase from the street. In five days, about thirty five thousand people came. Nearly forty percent of Boston. The goal was thirty thousand dollars. They made more than thirty three thousand.

  The top stone went on the monument less than two years later.

  The men had fifteen years. The women took six weeks.
