teaser: "Her house stood where this fort stands. A stranger told her it would be worth it."
script: |
  Look at the grassy wall of this fort, and the old guns on top of it. Before there was a fort here, there was a house. It belonged to a free Black woman named Elizabeth Thomas.

  In September eighteen sixty one, Union troops took her land. To build this fort, they destroyed her home, her barn, her orchard and her garden.

  She told the story for the rest of her life. As her house came down, she was holding her six month old baby, and crying under a sycamore tree. A tall, slender man dressed in black came up to her. He said, it is hard, but you shall reap a great reward. She believed the man was President Lincoln. Nobody can prove that. It is her account, and she told it for more than fifty years.

  Three years later, Lincoln really did stand on this wall, under Confederate fire.

  And Elizabeth Thomas stayed. After the war she still owned parts of the fort, and bought more land around it. She spent years asking the government to pay for what it had taken.

  In nineteen sixteen, it finally did. One thousand, eight hundred and thirty five dollars.

  She died the following year.
detail: >-
  The Park Service treats the Lincoln encounter as Thomas's own account ("The man offering comfort was believed to be President Lincoln"), and the script says so. One Park Service page calls the 1916 award of $1,835 "an unconfirmed account"; the other states it plainly. A reviewer may want a second source for the award before approval.
