teaser: "She was born in this house and lived in it for a hundred and one years."
script: |
  Look at the plain house with the steep pointed roof. The taller part is the original, built in 1675 for a butcher named Thomas Ives.

  It still has its original peaked roof and its original brick chimney.

  The Park Service calls it a witness house to the witch trials of 1692.

  But it is named for Sarah Narbonne. Her grandfather bought it in 1780.

  Sarah was born in it, and lived in it for her entire life. That life stretched nearly the length of the nineteenth century.

  She died in 1895, at the age of a hundred and one. Her unmarried daughter Mary lived on here until 1905.

  The house has not been restored to any single moment. It is kept as a study house, to show how it changed.

  Nearly three hundred years of people living in it, and two hundred of those years were one family.
