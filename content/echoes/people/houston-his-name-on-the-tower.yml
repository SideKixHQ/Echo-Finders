# Listening spot: the corner of Travis Street and Rusk, outside the Niels Esperson Building, 808 Travis Street, built by Mellie Esperson as a memorial to her husband and opened in 1927 (Handbook of Texas; Houston Chronicle, 1950 article republished 2017). The Mellie Esperson Building adjoins it on Walker.
# Position: Overture places at 808 Travis St cluster at 29.75876 to 29.75906, -95.36481 to -95.36545; spot 29.75885, -95.36500 (high confidence for the building). About 250 m from the Capitol echo.
