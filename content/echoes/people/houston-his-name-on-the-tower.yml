teaser: "It was built for a man who never saw it. His widow worked in it for twenty years."
script: |
  Look up, all the way up, at the top of the tower on this corner. A ring of columns, gold leaf, a little temple in the sky.

  It was built for a man who never saw it.

  Niels Esperson came from Denmark. He and his wife, Mellie, moved to Houston in nineteen oh three. He made his fortune in the Humble oilfield and in real estate. He owned this corner, and he meant to build on it.

  In the early nineteen twenties he died, and left her a fortune.

  He had left no plans for the building. So Mellie went to Europe herself, for ideas on stone and materials, and hired the architect John Eberson to design what she meant as a memorial to her husband. Thirty two storeys, Italian Renaissance. When it opened in nineteen twenty seven, it was the tallest building in Texas. She gave it his name.

  Then she went to work in it. From a suite on the twenty fifth floor, for some twenty years, she ran her oil business, her rice farms and her real estate. She kept at it after she lost her sight.

  Fourteen years after his tower, she built a second one, joined to it, on Walker. Nineteen storeys. The first skyscraper in Houston built with central air conditioning.

  That one carries her name.

  Look up at the gold again.

  His name is on the tower. Hers is on the one beside it, holding on.

