teaser: "Look for two letters twisted together in the iron balconies."
script: |
  Look up at the long red brick building along this side of the square, at the cast iron railings on its balconies. Somewhere in the pattern, two letters are twisted together. An A and a P.

  They belong to a woman who was supposed to be dead.

  Micaela Almonester was born in this city, the daughter of the rich Spaniard who paid for the cathedral. She married into a noble French family, the Pontalbas, and went to live in France.

  The marriage went badly. There were lawsuits. In the end she won her independence from her husband and his family.

  Then, one October morning in eighteen thirty-four, at the family château, she was found on the floor of her rooms, shot several times. Her father-in-law, the old baron, was found dead in his armchair with a pistol in his hand.

  She lived. She carried the bullets in her body for the rest of her life.

  Twelve years later she put a plan to the city. She would tear down her father's old buildings on both sides of this square, and put up something grander, if the council would play its part. The council backed out. She built them anyway. They were finished around eighteen fifty.

  The A is for Almonester. The P is for Pontalba.

  She kept both.
