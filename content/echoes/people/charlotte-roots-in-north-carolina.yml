teaser: "This park is named for an artist who left Charlotte at four, and kept painting it for the rest of his life."
script: |
  This park carries the name of an artist who left Charlotte when he was four years old.

  Romare Bearden was born in Charlotte in 1911. His family moved north, and settled in Harlem.

  He grew up, went to university in New York, and took a job as a caseworker for the city's social services. He kept that job until 1969.

  All the while he was painting.

  By the early 1960s he had found his way of working. Collage. Newspaper and magazine clippings, fabric, pencil and paint, cut and fitted together into faces made from many faces.

  And many of those pictures were drawn from what he remembered of North Carolina.

  He said it plainly. Most artists take some place, and like a flower, they sink roots. My roots are in North Carolina.

  In 1987 he was awarded the National Medal of Arts.

  Four years in Charlotte. A lifetime of pictures.
