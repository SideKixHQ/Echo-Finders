teaser: "On the Opry's first network night, the host called its biggest star a mascot."
script: |
  In July 1939, the Grand Ole Opry moved into this hall, the War Memorial Auditorium. For the first time, it charged admission. Twenty-five cents.

  That October, it went out on a radio network for the first time, to twenty-six stations across the South and Southwest.

  One of the stars that night was DeFord Bailey, the only Black musician in the cast.

  He stood less than five feet tall. On the air, the host introduced him as our little mascot.

  He was nothing of the kind. By all accounts he was one of the most popular performers on the show.

  On the harmonica, he could make a freight train pick up speed. He could make a pack of hounds chase a fox, and the hunters call after them.

  That night he played four numbers. Nobody else on the bill played as many.

  The same host had nicknamed him the Harmonica Wizard. He was later elected to the Country Music Hall of Fame.

  The microphone said mascot. The audience said otherwise.
