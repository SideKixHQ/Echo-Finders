teaser: "Some of the first guardians of Yosemite and Sequoia are buried on this slope."
script: |
  Look along the rows of white headstones on this slope. More than four hundred of the men buried at the Presidio were Buffalo Soldiers.

  In 1866, Congress created six segregated regiments of Black soldiers in the regular Army, soon consolidated into four. They became known as the Buffalo Soldiers. The nickname probably started on the Western frontier with the Cheyenne, and it was meant as high praise.

  Soldiers of the 24th Infantry and the 9th Cavalry were garrisoned here at the Presidio.

  Before there was a National Park Service, the Army protected the first national parks. Soldiers from the Presidio spent their summers in Yosemite and Sequoia. They blazed trails, built roads, made maps, put out fires, and kept poachers and loggers at bay.

  Buffalo Soldiers did that work in the Sierra in 1899, 1903 and 1904.

  So when you think of the first park rangers in the Sierra Nevada, some of them are here, on this hill.
