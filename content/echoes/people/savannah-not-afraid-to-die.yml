tags: [savannah, savannah-core, oglethorpe-square, colonial, religion, moravians, john-wesley, pacifism]
teaser: "In the middle of a storm at sea, they kept singing."
script: |
  Find the monument in this square to the Moravians, the colonists who lived in Savannah from seventeen thirty five to seventeen forty.

  Five years. Then they were gone. They were the colonists who would not fight.

  A young clergyman named John Wesley crossed the Atlantic with some of them, in the winter of seventeen thirty six. In the middle of the voyage a great storm broke over the ship. The English passengers screamed. The Moravians, in the middle of a psalm, went on singing.

  Afterwards Wesley asked one of them whether he had been afraid. He wrote down the answer.

  I thank God, no.

  But were not your women and children afraid?

  No. Our women and children are not afraid to die.

  In Georgia they cleared land and built homes, and taught at a school for Indian children near Tomochichi's village. But Georgia was a border colony, facing the Spanish. When the Moravians refused, for their faith, to bear arms, they were no longer welcome. They left for Pennsylvania and North Carolina.

  Look at the monument again.

  The colony wanted settlers who were not afraid. It sent away the ones who were not afraid to die.
detail: >-
  The 1937 guide gives the monument's inscription ("In memory of the Moravian colonists in Savannah, 1735-1740"), their work, the Indian school near Tomochichi's village, the refusal to bear arms "against the Spaniards, because of religious scruples", and their departure to North Carolina and Pennsylvania. The storm and the exchange are from Wesley's journal for the voyage. Wesley calls the Moravians "the Germans" in this entry.
