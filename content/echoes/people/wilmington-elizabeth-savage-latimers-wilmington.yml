script: |
  Elizabeth Savage was born into a Wilmington family and married Zebulon Latimer at St.
  James in 1848. The house built four years later became their family residence.

  Her local background complicates the idea of the house as simply the achievement of a
  merchant who arrived from elsewhere. Family relationships tied it to a city that already
  had its own networks and histories.

  Stand outside the home and consider what is left unnamed when a household is introduced
  only by its male owner. A marriage and a family are not incidental to a residence's
  meaning.

  Elizabeth's story supplies a different connection between the building and Wilmington.
  The house represented shared family life, shaped by her place in the community as well
  as her husband's commercial career.
