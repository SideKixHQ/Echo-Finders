script: |
  Rabbi Samuel Mendelsohn presided when Wilmington's Temple of Israel was dedicated in
  1876. His tenure continued until 1922, spanning forty-six years.

  The congregation's history connects that first sermon with Jewish liberty. The new
  synagogue supplied a permanent local setting for worship and community life.

  Listen from the public sidewalk. A long tenure means more than a ceremonial opening:
  it includes repeated services, teaching, changes in families, and the ordinary
  responsibilities of sustaining a congregation.

  Mendelsohn's name helps make the building's history personal. The synagogue was not
  simply constructed; it was used and cared for by a community over time. His decades of
  leadership link its early years with the city that developed around this corner into the
  twentieth century.
