teaser: "The fort you can see was held together by people who had no choice."
script: |
  Look out to Fort Sumter, low on the water. In the summer of eighteen sixty four, it was being shelled day and night. And somebody had to keep putting it back together.

  That somebody was enslaved.

  Jacob Stroyer was born into slavery near Columbia. He was thirteen when he was sent to the harbour to carry water and messages for the men building the forts. He wrote later that it was easier than the plantation.

  Then, in eighteen sixty four, he and more than three hundred other enslaved men were rowed out to Fort Sumter, to repair it under fire. One young man from his own plantation was killed by a shell before he even got inside.

  The shells, Stroyer wrote, rained alternately upon Fort Sumter every five minutes. Records list more than twenty enslaved people who died there. Stroyer remembered an overseer who drove the men back to work with a piece of iron in his hand.

  In July, a mortar shell came down on Stroyer's shelter, and wounded him in the head. He never went back.

  He was freed the next year. He went to school, moved north, and became a minister in Salem, Massachusetts. In eighteen seventy nine he wrote it all down.

  Look at the fort again. Its walls are partly his.
detail: >-
  From the National Park Service page on Jacob Stroyer: born into slavery on the Singleton plantation near Columbia in 1849, sent to Sullivan's Island and Fort Sumter, his description of boys of thirteen carrying water and messages, Sullivan's Island as easier than the plantation, over three hundred enslaved men taken to Fort Sumter by rowboat from Johns Island in 1864, the death of a young man from his plantation, his phrase about shells every five minutes, more than 20 enslaved deaths on the official casualty lists, the overseer Deburgh, his head wound in July 1864, freedom in 1865, schooling, and his ministry in Salem. His memoir, My Life in the South, was published in 1879. "Aged about fifteen" in the summary follows from his birth year.
