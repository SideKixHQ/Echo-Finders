script: |
  Henry Taylor was a carpenter and builder who worked on the Bellamy project. His career
  continued after emancipation and included other Wilmington buildings and community
  activity.

  The museum identifies him among the Black craftspeople whose skill made the mansion
  possible. The owner's surname on the building can otherwise make the builders disappear
  from its story.

  Look at the exterior from the sidewalk. Plans only become walls, floors, and finished
  details when people know how to execute them.

  Taylor's work reminds us to connect an impressive residence with the expertise it
  required. His name belongs in the account of this place, alongside its architect and
  owners. A building can preserve craftsmanship for generations while concealing the
  craftsperson. Historical research makes the person visible again.
