script: |
  Guy Nixon was an enslaved member of the Bellamy household. The museum discusses a family
  recollection of his work pumping water from the cistern to a tank high in the house.

  That practical task supported the comfort of people who controlled his labor. It should
  not be turned into a nostalgic picture of a happy household helper.

  Look upward from the public sidewalk. Water needed to move against gravity before it
  could serve the rooms above. The building's conveniences relied on repeated human
  effort.

  Nixon's story makes a system personal. A tank and a pump can sound like technical
  details; naming the person required to operate them changes the account. The mansion's
  daily life depended on work, and that work took place within slavery's restrictions on
  freedom.
