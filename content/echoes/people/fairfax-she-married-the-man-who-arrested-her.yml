tags: [fairfax, civil-war, espionage, mosby]
teaser: "Accused of helping capture a Union general, she married the officer who locked her up."
script: |
  In the Civil War this town was called Fairfax Court House.

  Antonia Ford was born here in 1838. Her father was a prominent local merchant, and a committed secessionist.

  She was widely reported to be a Confederate spy. It was alleged that she gathered information on troop numbers from Union officers staying around town, and passed it on.

  In 1863 Confederate rangers under John Mosby captured a Union general, Edwin Stoughton, here at Fairfax Courthouse.

  Antonia Ford was arrested and charged with helping them. No evidence was found to support her accusers.

  The officer who arrested her was the Union provost marshal in Fairfax, Major Joseph Willard.

  While she was held in prison in Washington, he worked to get her released.

  She is said to have made a lace cap and collar while she was in prison. The Library of Congress keeps them.

  She took the oath of allegiance and was let go. In March 1864 she married Major Willard.

  The accused spy married the man who had arrested her.
