script: |
  In 2007, Wilmington renamed this bridge for Harry Forden, a community activist who
  worked to revive North Fourth Street after the Atlantic Coast Line's departure.

  The bridge itself is older. The new name added a person's work to an existing piece of
  infrastructure.

  Listen at a safe public approach rather than entering railroad property below. From
  here, the connection is visible: a crossing links streets, while a community advocate
  works to reconnect a neighborhood with opportunity.

  A commemorative name can become so familiar that its meaning disappears into directions.
  This stop restores the person behind it. Forden's public work concerned the area's
  future, not merely its old buildings. The city attached that effort to a structure
  people could continue to encounter in everyday life.
