teaser: "A president was born here. Then somebody knocked the house down."
script: |
  Look at the brownstone in front of you, with its steps and its tall windows. It looks like it has stood here since before the Civil War.

  It has not. It is about a hundred years old. And it is a copy.

  A boy was born in a house on this spot. Theodore Roosevelt. He was sickly. He fought asthma for years. And he loved books and nature, and learning, more than almost anything.

  His family moved uptown in eighteen seventy two. They sold the house. It became a shop, and changed hands again and again.

  Roosevelt grew up and became the twenty sixth President of the United States.

  And in nineteen sixteen, while he was still alive, the house he was born in was torn down. A commercial building went up in its place.

  He died three years later, at sixty.

  So his sisters and his widow did something remarkable. They bought the lot. And they built the house again, as it had been, a replica of his childhood home. It opened in nineteen twenty three.

  Look at those steps again.

  He never climbed these ones. They were built for him to be remembered by.

