teaser: "She had lived on this coast for ten years before she found out who else used the beach."
script: |
  Look at the sand between the dunes and the water. Sea turtles often nest on Wrightsville Beach,
  and for years Nancy Fahey had no idea.

  She had lived on the North Carolina coast for more than ten years when she learned about the
  Wrightsville Beach Sea Turtle Project, then recently founded. She could not wait to get involved. She began volunteering in 1995. By the end of her
  first summer, she was hooked.

  Since 2004 she has led the project as its president and volunteer coordinator. Every day from May
  through August, its volunteers walk the length of the beach, looking for signs of nesting. Turtles
  nest at night, so the volunteers look for tracks at dawn.

  A nest found that way is roped off, and watched every day until it hatches.
