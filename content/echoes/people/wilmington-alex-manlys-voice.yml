teaser: "Alex Manly edited the Daily Record, Wilmington's Black-owned newspaper."
script: |
  Alex Manly edited the Daily Record, Wilmington's Black-owned newspaper. In 1898, the
  white supremacy campaign seized on an editorial he wrote and used it to inflame racial
  tensions.

  He had already fled the city when a mob broke into the newspaper's office and fire
  consumed its top floor during the coup. His departure
  was a response to danger, not an admission that the attackers' claims were true.

  This marker honors him near downtown's historic streets. The newspaper's office, in Free
  Love Hall, stood elsewhere in the city.

  Pause by his name. A newspaper editor works to make words public; a campaign of
  intimidation works to make that public voice disappear. Manly's story connects both
  acts. The paper's office was destroyed, but historical records preserve his identity and
  the political attack directed against him. The marker returns a name to the city's
  visible memory.
