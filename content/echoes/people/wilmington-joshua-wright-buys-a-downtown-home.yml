script: |
  Joshua Grainger Wright purchased this house in 1799. His family supplied the second
  surname by which the museum is known today.

  Wright became a judge, and the house entered a new household's history. Its earlier
  connection with John Burgwin remained in the building even as ownership changed.

  Stand at the corner and listen to the two names together: Burgwin and Wright. A compound
  name can compress decades into something that sounds like a single identity.

  The purchase was a turning point rather than a minor footnote. A new owner meant new
  family routines and later adaptations, while the old jail remains stayed underneath.
  Wright's arrival shows how a landmark accumulates its identity. The building survived
  one owner by becoming meaningful to another.
