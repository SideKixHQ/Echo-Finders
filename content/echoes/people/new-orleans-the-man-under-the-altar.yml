teaser: "Look up at the three spires. They are younger than they look."
script: |
  Look up at the three spires on the front of the cathedral.

  They are younger than they look. The front you are facing was remodelled around eighteen fifty, when steeples were raised on the old towers and the portico was added.

  The church before that was paid for by one man.

  In seventeen eighty-eight, fire took the old parish church along with most of the town. Don Andrés Almonester y Roxas, a Spaniard who had grown very rich in this colony, offered to build a new one at his own expense.

  He asked for something in return. Masses for his soul, said for ever.

  A guidebook from eighteen forty-five says the bargain was being kept. Every Saturday evening, it says, at sunset, the bell tolled for the founder.

  He died in seventeen ninety-eight and was buried in front of the altar. A writer in the eighteen nineties described his name, his coat of arms and his motto, cut into the stone over him.

  The building has been remade around him since. The steeples are new. The portico is new.

  He is still inside, under the floor, at the front.

  And by his own arrangement, someone is meant to be praying for him.
