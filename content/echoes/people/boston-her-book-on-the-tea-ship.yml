script: |
  Find Phillis Wheatley in the Boston Women's Memorial. The city put her here in two thousand three.

  She arrived in Boston in seventeen sixty one, a child, on a ship from West Africa. John and Susanna Wheatley bought her. They taught her to read and write. By about fourteen, she had a poem in a newspaper.

  Then came the doubters. Critics refused to believe that an enslaved Black woman could write poetry that good.

  So in seventeen seventy two, she had to defend her own poems, in front of a panel of prominent Boston men. John Hancock was one of them. So was the governor, Thomas Hutchinson.

  She convinced them. They signed a statement saying so.

  Even then, no printer in the colonies would publish her book. It came out in London, in seventeen seventy three. The first book of poetry by an African American.

  And when copies were shipped home to Boston that winter, some of them were in the cargo of a ship carrying tea. The ship the patriots boarded in disguise.

  First she had to prove she wrote her book. Then she had to get it off a tea ship.
