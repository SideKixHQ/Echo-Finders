detail: >-
  The National Park Service page on Phillis Wheatley gives her purchase by John and Susanna Wheatley on arrival in 1761, the Wheatleys teaching her to read and write, the critics who refused to believe an enslaved Black woman could write such poetry, her defence before a panel of prominent Boston citizens in 1772 and their attestation, the failure to publish in the colonies, and the London book of 1773 as the first book of poetry by an enslaved Black woman. The Library of Congress (2018) independently gives the first volume of poetry by an African American, her first published poem at about 14, and John Hancock and Governor Thomas Hutchinson among her examiners; it places the examination after her return from London, while the park service puts it in 1772, before; the script follows the park service. The Boston Globe (2026) gives her arrival on a ship from Africa and the 2003 statue on the Commonwealth Avenue Mall. WBUR (2023) is the only fetched source for her book among the cargo of a Tea Party ship; it states it as fact in introducing a play about her efforts to get the copies off the ship. A reviewer should look hardest at that line; "that winter" rests on the Tea Party date, December 1773. The ship is not named.
