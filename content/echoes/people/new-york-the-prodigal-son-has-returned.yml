teaser: "He said you never leave home. You take it with you. Then he bought it a house."
script: |
  Look at number one thirty seven West Seventy First Street. A small apartment building among the brownstones, with a plain modern front.

  A writer bought it, in nineteen sixty five. Not for himself. For his family.

  His name was James Baldwin. He was born in Harlem, in nineteen twenty four, and grew up in wrenching poverty. As a boy, he looked after his younger brothers and sisters. He walked them over the Harlem River into the Bronx, to buy cheap bread from the factory.

  In nineteen forty eight, he left New York for Paris. Years later, he said the first thing he learned in Paris was that you don't ever leave home. You take your home with you.

  By the nineteen sixties he was one of the most important writers in America. He was on the cover of Time magazine. He stood with the civil rights movement, and pressed the Attorney General to treat it as a moral issue.

  And he bought this building so his family could be together. His mother lived here. His two sisters, and their children. He kept an apartment at the back of the first floor.

  He was away a great deal. But whenever he came home, his niece remembered, his mother would smile widely and say, Well, the prodigal son has returned!

  Toni Morrison lived here for a while. Maya Angelou came. Miles Davis came.

  Look at the front door.

  He took his home with him. Then he bought it a house.

