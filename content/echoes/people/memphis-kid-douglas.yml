teaser: "A runaway girl with a guitar played for tips in this park. She became Memphis Minnie."
script: |
  Before this was Handy Park, it was Church's Park. Musicians came here to play for tips.

  One of them was a girl from northern Mississippi who had been given a guitar for her birthday, and who ran away from home to play it here. She called herself Kid Douglas.

  Her real name was Lizzie Douglas. Later she took the name Memphis Minnie.

  The jug bands played this park too, the Memphis Jug Band among them. They came for the tips, and to learn new songs from the other bands.

  In the late thirties, a man from the Delta who called himself Howlin' Wolf would come up to Memphis and play here for tips.

  Minnie went on to record fifty sides before the Depression shut the studios down. She wore bracelets made of silver dollars.

  The National Park Service calls her the greatest female country blues singer.

  All of it started on this patch of ground, for whatever people dropped in the hat.
