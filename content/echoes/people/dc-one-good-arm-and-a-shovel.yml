claims:
  - says: "He was born on an island in Maine."
    source: 1
    quote: "Walter Shaw was born on the island of Vinalhaven, Maine on July 20, 1838."
  - says: "In the Civil War he was drafted, and in May eighteen sixty four, at Spotsylvania, a bullet struck his right arm. Part of it was amputated."
    source: 1
    quote: "His unit was fighting at Spotsylvania Court House on May 12, 1864, when Walter was hit with a Minnie ball in his lower right arm which resulted in partial amputation of that arm."
  - says: "In a Washington hospital, he taught himself to write with his left hand."
    source: 1
    quote: "He was sent to Columbian Hospital in Washington DC to recover and had to learn to write with his left arm."
  - says: "His neat left handed writing got him a job as a clerk at the Treasury."
    source: 1
    quote: "Walter’s neat, self-taught writing with his left hand helped get him a job as a clerk and copy writer with the US Treasury Department in DC."
  - says: "Around eighteen eighty eight, he started what he called playing in the water. He planted twelve white water lilies, brought from Maine, in an old ice pond."
    source: 1
    quote: "Walter began “playing in the water” as he phrased it around 1888. He planted 12 hardy American white water lilies from Maine in an old ice pond on the property."
  - says: "They grew so fast they crowded it out. So, with his one good arm and a shovel, he dug another pond."
    source: 1
    quote: "The lilies grew so rapidly that they crowded the little pond, so he used his one good arm and a shovel to excavate additional ponds."
  - says: "Soon he had more flowers than he could give away. He started selling them. By nineteen oh two, the hobby paid better than the Treasury, and he quit."
    source: 1
    quote: "He found that his hobby became more profitable than his job at the US Treasury, so in 1902 he became a full-time aquatic gardener."
  - says: "He named one of his lilies after his wife, and one after his daughter."
    source: 1
    quote: "He cultivated a rosy-pink lily “Luciana” in honor of his wife and a deep rose-colored lily “Helen Fowler” for his daughter."
