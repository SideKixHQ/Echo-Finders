teaser: "Every pond around you was dug by a man with one working arm."
script: |
  Look around at the ponds, one after another, full of water lilies. Every one of them had to be dug.

  The man who started it was Walter Shaw. He was born on an island in Maine. In the Civil War he was drafted, and in May eighteen sixty four, at Spotsylvania, a bullet struck his right arm. Part of it was amputated. In a Washington hospital, he taught himself to write with his left hand.

  His neat left handed writing got him a job as a clerk at the Treasury. He and his wife bought land out here, east of the Anacostia.

  Around eighteen eighty eight, he started what he called playing in the water. He planted twelve white water lilies, brought from Maine, in an old ice pond. They grew so fast they crowded it out. So, with his one good arm and a shovel, he dug another pond. And another. Mornings and evenings, around his job.

  Soon he had more flowers than he could give away. He started selling them. By nineteen oh two, the hobby paid better than the Treasury, and he quit.

  He named one of his lilies after his wife, and one after his daughter.

  Look at the ponds again.

  He dug them one arm at a time.
detail: >-
  All from the Park Service's biography of Walter Shaw. "Played in the water" is Shaw's own phrase as the Park Service quotes it. The lilies were named Luciana, for his wife, and Helen Fowler, for his daughter.
