teaser: "A gravestone that accuses someone without saying his name."
script: |
  Somewhere near this walk is a gravestone with a very long inscription. Find it, and read the middle of it.

  It is a eulogy. It is also an accusation.

  The young man under it was James Wilde, an army paymaster, in his twenty second year. On the sixteenth of January, eighteen fifteen, across the river in South Carolina, he fought a duel with a fellow officer, Captain Roswell Johnson. They fired four times. On the fourth, Wilde was shot through the heart.

  His family wrote the stone. It says he fell in a duel by the hand of a man who, a short time ago, would have been friendless but for him.

  They did not name the man on the stone.

  A century later the novelist William Dean Howells stood here and read it. The words, he wrote, must have been meant for the eye of the man who fired, and they wrung his heart.

  James had a brother, the poet Richard Henry Wilde. Gamble wrote that the duel was woven into the writing of his brother's poem, My life is like a summer rose.

  Read the line on the stone again.

  Friendless but for him. Two hundred years on, the stone is still saying it.
detail: >-
  Gamble (1923) gives the stone's full inscription, its place in the cemetery, the burial book entry (aged 23 in the book, "22d year" on the stone; died January 16, 1815; "shot through the heart at the fourth discharge by his antagonist, Capt. R. P. Johnson"; the duel on the north side of the river in South Carolina), and Howells's words from Harper's Magazine, February 1919. Gamble says the duel is "inseparably interwoven with the writing of Wilde's beautiful poem"; the script attributes that to Gamble and uses his title.
