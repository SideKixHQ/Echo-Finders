teaser: "He wrote a famous epitaph for himself. It is not on the stone."
script: |
  Look through the iron bars at the corner of Fifth and Arch. In the corner of the burial ground nearest you, Benjamin Franklin and his wife Deborah lie under a plain marble slab.

  When Franklin was twenty-two, a young printer, he wrote his own epitaph. It is a joke about his trade.

  The body of B. Franklin, printer, like the cover of an old book, its contents torn out, and stript of its lettering and gilding, lies here, food for worms. But the work shall not be wholly lost. For it will, as he believed, appear once more, in a new and more perfect edition, corrected and amended by the author.

  He liked it enough to copy it out for friends for the rest of his life.

  It is not on the stone.

  At eighty-two, adding to his will, he asked for something else. A marble stone, six feet long and four feet wide, plain, with only a small moulding round the edge. Two names, Benjamin and Deborah Franklin. And a year.

  For the year he wrote one, seven, eight, and then a dash.

  He knew the century and the decade. Somebody else had to finish the line.
