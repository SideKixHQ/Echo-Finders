script: |
  Cornelius Harnett helped lead revolutionary political organization in the Cape Fear
  region. The Wilmington Council of Safety met at the old courthouse on this corner.

  That work involved more than opposing Britain. A new political system required people to
  discuss how authority would operate after the old one was challenged.

  The courthouse is gone, but the site gives Harnett's role a local setting. This is an
  associated meeting place, not a claim that his entire career unfolded at one
  intersection.

  Stand beside the marker and consider the difference between declaring a principle and
  arranging a government. Both require action. Harnett's public life connected those
  demands, helping the region move from resistance toward new institutions. The corner
  preserves the setting of that practical political work.
