tags: [philadelphia, philadelphia-core, society-hill, absalom-jones, richard-allen, yellow-fever, 1793, black-history, st-thomas]
teaser: "The newspapers said they could not catch it. That was not true."
script: |
  Look along this side of Fifth Street, just below Walnut. Here once stood St. Thomas' African Church. Its first minister was a man named Absalom Jones.

  In the summer before, seventeen ninety three, yellow fever tore through Philadelphia. In early September, an appeal ran in the newspapers. It asked the city's Black people to come forward and help the sick. It said, more or less, that people of their colour could not catch the fever.

  That was not true. Jones and his friend Richard Allen went anyway.

  The first house they went into was in a little alley. A man was dying. His wife lay dead in the house. Two small children were there, and nobody else. That day they visited more than twenty families. Then they went to the mayor, and asked how they could be most useful.

  For weeks they found nurses for the sick, and carried away the dead. Allen's own brothers worked with them. They buried several hundred poor people and strangers, they wrote, and never received or asked anything for it.

  When it was over, a printer named Mathew Carey published an account of the fever. It sold well enough to run to a third edition. In it, he singled out the Black nurses, as if they had cheated the dying.

  So Jones and Allen wrote a book of their own, and put their initials on it, to set down the facts as they really were.

  Look along the street again. Their words, in seventeen ninety four.

  We sought not fee nor reward.
