teaser: "Two friends, two names on one small fountain, and one ship."
script: |
  Find the small marble fountain in the trees at the edge of the Ellipse. Walk around it. On one side, a figure with a sword and a shield. On the other, a figure in flowing drapery.

  Now read the words around the rim. Two names. Francis Davis Millet. Archibald Butt. This monument has been erected by their friends.

  Archie Butt was a soldier. He was military aide to President Theodore Roosevelt, and then to President Taft. In nineteen twelve, the two Presidents he had served became rivals, and he found it hard to stay impartial. So he took leave, and went to Europe, to join his close friend, Frank Millet, a painter.

  In Rome, Butt carried a personal message from Taft to the Pope. Then the two friends boarded a ship to come home. It was the Titanic.

  Neither of them came back. At least one account says they were last seen helping women into the lifeboats.

  Taft spoke at Butt's memorial service. He said it was as if he had lost a younger brother. And Taft headed the committee of friends that paid for this fountain.

  Look at the figures again. In nineteen thirteen, the Evening Star said the one with the sword was Chivalry, for Butt and the women and children on the ship. The other was Art, for Millet.

  They left together, and they did not come home.

  Their friends put them side by side, a few hundred yards from Butt's old office.
detail: >-
  The Park Service describes the reliefs as "a military figure with sword and shield" for Butt and "the artist with palette and brush" for Millet; the Evening Star of 22 October 1913 describes them as female figures of Chivalry and Art. The script gives the 1913 reading, attributed, and describes the figures by what they hold. The lifeboats are hedged as the Park Service hedges them ("at least one account"). "A few hundred yards from Butt's old office": the Star puts the fountain "almost directly south of the President's office building". Taft's words are paraphrased; the Park Service quotes him saying Butt's loss was "as if he had been a younger brother."
