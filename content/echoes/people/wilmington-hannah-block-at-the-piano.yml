script: |
  Hannah Block entertained wartime service members by singing and playing piano. The
  building that carries her name preserves that connection, including a piano identified
  with her performances.

  The center was rededicated in her honor in 2006. A volunteer's contribution became part
  of the place's public identity.

  If you can visit the open museum area, look at the instrument without touching it. Its
  significance comes from use: someone sat here to offer music and company during a
  difficult period.

  Block's story brings a large wartime account down to a human scale. An evening's
  entertainment required a person willing to provide it. The name over the door remembers
  that practical generosity, while the preserved instrument gives it a concrete form you
  can see.
