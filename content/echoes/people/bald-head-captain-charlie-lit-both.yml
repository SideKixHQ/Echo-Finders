script: |
  Three cottages stand together here on the dunes. They are known as Captain Charlie's, after the lighthouse keeper who lived in one of them.

  In 1903 a new steel lighthouse went up nearby. Charlie Swan was its first head keeper, and he had the honor of lighting the lamp for the first time.

  He kept it for thirty years, until he retired in 1933. He and his two assistants lived in these three houses, and they were the only people living on the island. When the wooden rails of the supply tram rotted, Captain Charlie bought a horse and cart.

  In 1958 the Coast Guard put up a new lighthouse across the river on Oak Island, and took his old tower down.

  On the fifteenth of May, 1958, the man who threw the switch to light the new one was the former keeper of the old one. Captain Charlie.

  He lit the first lamp here. And he switched on the light that replaced it.
