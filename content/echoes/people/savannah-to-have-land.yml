teaser: "They asked him what freedom needed. He said, land."
script: |
  Look up at the second floor of the Green Meldrim House. In the winter of eighteen sixty five, it was General Sherman's headquarters. And in a high ceilinged room on a corner of that floor, he and the Secretary of War met with a group of Savannah's Black ministers and church leaders.

  The ministers chose one man to speak for all of them. Garrison Frazier. A Baptist minister, sixty seven years old, and well over six feet tall. Eight years before, he had bought his own freedom and his wife's, for a thousand dollars in gold and silver.

  The general and the secretary asked him questions, and his answers were written down word for word. They asked him what slavery was. Slavery, he said, is receiving by irresistible power the work of another man, and not by his consent.

  They asked how his people could best take care of themselves. The way we can best take care of ourselves, he said, is to have land, and turn it and till it by our own labor. We want to be placed on land until we are able to buy it and make it our own.

  Four days later, Sherman signed Field Order Fifteen. Land for the freed people, up to forty acres for each family. It did not last. After Lincoln was killed, President Andrew Johnson reversed the order, and gave the land back to its Confederate owners.

  Look up at the corner windows again.

  They asked him what freedom needed. He said, land.
detail: >-
  The minutes of 12 January 1865, certified by Assistant Adjutant General E. D. Townsend, were printed widely; the Rutland Weekly Herald copy is used here. Its scan reads "irresistible" as "-ttiittible" and "consent" as "content"; the script corrects these two scanning errors, which a reviewer should confirm against the page image. Which corner room it was is not identified.
