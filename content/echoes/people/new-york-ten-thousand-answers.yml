tags: [new-york, harlem, library, black-history, langston-hughes, schomburg]
teaser: "A teacher told him there was no such thing as his history. He spent his life collecting the answer."
script: |
  Look at the library on this corner. Inside, just past the front desk, a map of rivers is set into the floor, in brass.

  Some of a poet is buried under it.

  Start with a boy in Puerto Rico, named Arturo Schomburg. The story the library tells goes like this. In school, he asked his teacher when they would learn the history of people who looked like him. The teacher said there was no such thing. That people who looked like him had never done anything worthwhile.

  At seventeen, he came to New York. And he started collecting. Books. Letters. Pictures. Anything that told the story his teacher said did not exist. By the nineteen twenties, the story goes, there were books on the staircase of his home.

  He called them his vindicating evidences. Ten thousand of them.

  In nineteen twenty six, the library bought his collection. Today the center holds more than eleven million items. In its visitor log you can still see the names of the writers who came to use it. Zora Neale Hurston. Langston Hughes.

  And when Langston Hughes died, some of his ashes were laid in the floor of this building. Under that brass map of rivers.

  It is named for his first famous poem. He wrote it at eighteen, watching the sun go down over the Mississippi from a train.

  A teacher once told a boy there was no such history.

  My soul has grown deep like the rivers.

