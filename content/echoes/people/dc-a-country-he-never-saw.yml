teaser: "Face the north door of the red castle."
script: |
  Face the north door of the red castle.

  Inside, close to this entrance, there is a small crypt with a sarcophagus in it. The man
  in it paid for all of this.

  His name was James Smithson. He was an English scientist, born outside marriage to a
  duke, and never given a title. When he died, he left his entire fortune to the United
  States, to found an institution in Washington under his name.

  He had never been here. He never visited the country in his life.

  He died in Genoa in 1829 and was buried on a hill there, in a small British cemetery.
  By the turn of the century a stone quarry was eating the hill away.

  So in 1904 one of the Smithsonian's regents, Alexander Graham Bell, went to Genoa at his
  own expense and brought the body back across the Atlantic.

  A Washington paper put it neatly a few years later. That voyage was the first time
  Smithson ever had personal contact with these shores.

  He gave everything to a country he had never seen.

  He got here seventy-five years after he died.
