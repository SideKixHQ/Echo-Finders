tags: [charleston, charleston-core, south-of-broad, revolution, women, king-street]
teaser: "He regretted that he never met her family. That was the point."
script: |
  Look across King Street at number twenty seven, the big brick house behind the iron fence. Two tiers of stone columns on the porch.

  The man who built it hardly lived in it. Miles Brewton, his wife and their children were lost at sea in seventeen seventy five. The house went to his sister, Rebecca Motte.

  Five years later, the British took Charleston, and their commanders took this house for headquarters. They did not throw her out. They asked her to stay, and to sit at the head of her own table, and they called themselves her guests. The requests of a conqueror, a Charleston historian wrote, are commands.

  So she played the hostess, and they complimented her housekeeping. What the officers did not know about was upstairs. She kept her three daughters locked in the garret. Their mauma, the woman who cared for them, stood guard, and smuggled them sweets in her apron.

  When Mrs. Motte was finally allowed to leave for her plantation, the British commander, Lord Rawdon, thanked her for her hospitality. His only regret, he said, was that he had never been allowed to meet her family.

  Look up at the roofline. The garret is up there.

  He never met them. That was the point.
detail: >-
  HABS (1930s) records the loss at sea of Miles Brewton and his family in 1775, the passing of the house to his sisters Mrs. Pinckney and Mrs. Motte, and its use as British headquarters under Clinton and Rawdon. The garret story is Ravenel's (1906). The house is a private residence.
