teaser: "She asked her architects for a style that might not exist. Then the bayou came up the lawn."
script: |
  Look at the house. Pink stucco, black iron balconies. Below it, the land drops away through the trees to Buffalo Bayou, which loops right around this place. That loop is why it is called Bayou Bend.

  The woman who built it asked for a style that she was not sure existed.

  Her name was Ima Hogg. Her father, Jim Hogg, was the first governor of Texas born in Texas. Before he died, he told his children not to sell the family plantation, because he believed there was oil under it. In nineteen eighteen they drilled. He was right.

  In the nineteen twenties, Ima and her brothers laid out a new neighborhood along this bayou, River Oaks. For her own house, she told the architects what she wanted. Southern colonial, she asked for, with a Latin flavor, if there is such a thing.

  She moved in on the fifth of November, nineteen twenty eight.

  On the thirty first of May, nineteen twenty nine, the bayou flooded. The new garden and the lawn below the house were wrecked, and trees the family loved were lost.

  So she spent the next year replanting. Hundreds of trees, shrubs and flowers. Old roses. A white garden in the woods.

  Then, in nineteen fifty seven, she gave the whole place away, to the Museum of Fine Arts, so anyone could walk through it.

  Look down toward the water, through the trees she planted after the flood.

  It turned out there was such a thing.

