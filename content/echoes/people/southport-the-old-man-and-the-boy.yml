teaser: "A bestselling author spent his boyhood on this block, and wrote the book people still read about it."
script: |
  Look along the west side of Lord Street on this block for a two-story house with bay windows and a pair of porches.

  A river pilot named E H Adkins had it built in 1890. His grandson was Robert Ruark.

  Ruark grew up in Wilmington, but as a boy he spent much of his time here, at his grandfather's house on Lord Street.

  He became a popular journalist and author. Many of his books were about Africa.

  But the one people kept coming back to was about this town. In 1957 he published The Old Man and the Boy, an account of his boyhood years around Southport. It was a bestseller.

  The scholar Richard Walser listed it as one of five North Carolina books likely still to be read in a hundred years.

  Ruark died in 1965. The boy in the book is still walking around this town.
