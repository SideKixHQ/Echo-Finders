teaser: "His name is not on his headstone. One sentence is."
script: |
  Find the dark headstone piled with small stones, with pink triangles on its face. Read it. You will not find a name.

  It says, A Gay Vietnam Veteran.

  He was Leonard Matlovich. He served three tours in Vietnam with the Air Force, and came home with a bronze medal and a Purple Heart. In nineteen seventy five, he set out to challenge the military's ban on gay service members, on purpose, with his own spotless record. His face went on the cover of Time magazine, above the words, I Am a Homosexual.

  The Air Force discharged him. He fought it for years, and in the end took a settlement rather than his job back.

  He died in nineteen eighty eight. He was forty four.

  He chose this cemetery, close to his home, instead of Arlington. And he chose a plot near the grave of J. Edgar Hoover, the director of the FBI. Since then, dozens of people have chosen to be buried near him.

  Now read the line underneath.

  When I was in the military, they gave me a medal for killing two men.

  And a discharge for loving one.
detail: >-
  Sources differ on his discharge: NPR says he was first given a general discharge and had it changed to honorable; the script says only that the Air Force discharged him. The script follows NPR in calling his decoration "a bronze medal".
