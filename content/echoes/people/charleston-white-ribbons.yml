teaser: "He made the city's iron gates. He did not much like them painted black."
script: |
  Find the small wooden house on Blake Street, number thirty and a half. It has eight hundred and forty square feet. A blacksmith lived in it for half a century, with his forge out back.

  Philip Simmons was born on Daniel Island, in a Gullah speaking community, in nineteen twelve. At thirteen he went to work for an old wheelwright named Peter Simmons, no relation, who had been born in slavery.

  He learned to shoe horses, mend wagons and make tools. Then the trucks came, the horses went, and the work went with them.

  So he tried making gates. He found, he said, that he could mash out a leaf the same as a horseshoe.

  Over fifty years he made more than two hundred gates, fences, railings and balconies for this city. On East Bay Street, one of his gates holds a pair of rattlesnakes.

  He wasted nothing. Inside the house is a bed he made from scrap iron he found in the street. A friend said he never bought an umbrella. He picked up broken ones, and put them back together.

  He died in two thousand nine, at ninety seven. And there was one thing about his work that few people knew. He was not keen on it being painted black. Most of it was.

  So the mayor asked Charleston to tie white ribbons on its iron gates and railings.

  Look at the house again.

  For once, the iron wore white.
detail: >-
  The South Carolina Encyclopedia entry (John Michael Vlach) gives his birth on Daniel Island in a Gullah speaking community in 1912, his apprenticeship at thirteen to the wheelwright Peter Simmons, born in slavery and no relation, the work as a "general blacksmith", the trucks replacing horses and wagons, his words about mashing out a leaf the same as a horseshoe, more than two hundred commissions between 1938 and 1990, and the rattlesnake gates for the Gadsden House on East Bay Street. The Post and Courier (2010) gives the house at 30 1/2 Blake Street, its 840 square feet, his purchase of it in 1959, the forge, the scrap iron bed and the umbrellas (the friend is Rossie Coulter of the Philip Simmons Foundation). The Post and Courier (2009) gives his death at 97, his dislike of his work painted black, and Mayor Joe Riley's invitation to tie white ribbons on iron gates and railings. "Half a century" covers 1959 to about 2008, when illness moved him to assisted living. Two independent sources for the life; the ribbons and the umbrella rest on the Post and Courier.
