script: |
  Robert Robinson Taylor was born in Wilmington and became MIT's first known Black
  graduate, completing his degree in 1892.

  His father, Henry Taylor, worked on the Bellamy construction as an enslaved carpenter.
  This house therefore offers a connection to the family trade; it is not a building the
  son designed.

  Robert went on to design buildings for the Tuskegee Institute campus. Education
  expanded the possibilities of work that already had a strong family foundation.

  From the sidewalk, look at the evidence of building skill around you. Then consider the
  distance between learning a trade locally and becoming the first Black graduate of a
  distant institution. His achievement was individual, but his hometown background helps
  prevent us from imagining that his talent began just when a college recognized it.
