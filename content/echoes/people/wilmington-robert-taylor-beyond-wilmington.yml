script: |
  Robert Robinson Taylor was born in Wilmington and became MIT's first known Black
  graduate, completing his degree in 1892.

  His father, Henry Taylor, was a skilled builder associated with the Bellamy
  construction. This house therefore offers a connection to the family trade, not a claim
  that Robert designed it.

  Robert's architectural career developed at Tuskegee and beyond. Education expanded the
  possibilities of work that already had a strong family foundation.

  From the sidewalk, look at the evidence of building skill around you. Then consider the
  distance between learning a trade locally and gaining access to an institution that had
  scarcely admitted Black students. Taylor's achievement was individual, but his
  Wilmington background helps prevent us from imagining that his talent began only when a
  college recognized it.
