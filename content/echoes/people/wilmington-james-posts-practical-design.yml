script: |
  James F. Post designed the Bellamy mansion with assistant architect Rufus Bunnell. Their
  work had to turn a wealthy client's ambitions into a building that could function in
  Wilmington's climate.

  The museum points to deliberate choices involving daylight and ventilation. Architecture
  here was a practical arrangement as well as a display of status.

  From the sidewalk, trace the building upward. Different parts serve different purposes,
  even when the whole facade looks like one confident gesture.

  Post's name gives the design a human author. The house did not simply emerge from a
  fashionable style; people made choices about proportions, rooms, and use. Those choices
  still shape what you can see. The builders' labor then transformed the design into the
  surviving structure before you.
