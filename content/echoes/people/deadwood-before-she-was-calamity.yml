teaser: "Long before Deadwood, she was a name on a census form."
script: |
  Somewhere on this hill is the grave of Wild Bill Hickok.

  A photograph in the Library of Congress shows a woman standing beside it. Calamity Jane.

  If you have watched the television series about this town, you know her as a character.

  The National Archives points out that she, and the others in that series, were real people, and turn up in federal records.

  There is a document with Seth Bullock's signature as marshal. There is an indictment against a man named Swearingen.

  And there is Calamity Jane, years before any of it, in the 1860 census. Under the name Martha Canary.

  Before she was a legend, she was a line in a census.
