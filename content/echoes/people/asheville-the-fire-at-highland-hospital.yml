teaser: "The Jazz Age's most famous wife spent her last years at a hospital just south of here."
script: |
  About a quarter mile south of here stood Highland Hospital. The site is an office park and a shopping plaza now.

  Zelda Sayre married F. Scott Fitzgerald in 1919. He called her America's first flapper. In their day they were celebrities of the first order.

  In 1936, while staying at the Grove Park Inn, Zelda Fitzgerald entered Highland Hospital, an exclusive psychiatric clinic in the Montford neighborhood. She suffered from schizophrenia. The treatments included electroshock and insulin, but also a great deal of physical activity.

  She swam and played tennis. She painted, and for a time, she thrived.

  Scott died in 1940. After that, Zelda came back to Highland three more times, for long stays.

  On the tenth of March, 1948, a fire started in the kitchen and swept up through the dumbwaiter to all four floors. Of the twenty patients living there, nine died. Zelda Fitzgerald was one of them.

  They are buried together in Maryland. On top of their grave are lines from The Great Gatsby.

  So we beat on, boats against the current, borne back ceaselessly into the past.
