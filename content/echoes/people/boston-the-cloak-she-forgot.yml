teaser: "She went to say goodbye to her father on a warm day, and left her fur cloak behind."
script: |
  Look around Louisburg Square, at the tall brick houses facing the little fenced garden.

  In the autumn of eighteen eighty five, Louisa May Alcott, the author of Little Women, took a large furnished house on this square for her family. Sunny, she wrote in her journal. Trees in front, good air, and friends near by.

  Her father, Bronson, was old and failing, and she nursed him here. But she was ill herself. In December eighteen eighty six, worn out, she went to a doctor's home in Roxbury to rest. She never lived here again.

  Early in March eighteen eighty eight, her father was dying. She drove in to see him, and knew it was the last time. It was a warm day, almost like spring. When she got back into the carriage, she forgot to put on her fur cloak.

  The next morning she woke with a terrible pain in her head.

  Her father died on the fourth of March. When his friends came to pay their respects, they were met at the door with the news. Louisa Alcott is dead.

  She never knew that he had gone first.

  Her funeral was held in his rooms, here on the square.
detail: >-
  Ednah D. Cheney's Louisa May Alcott: Her Life, Letters, and Journals (1889, Internet Archive) gives the decision in autumn 1885 to take a furnished house in Louisburg Square, Alcott's journal entry for September ("a large house, furnished ... sunny, trees in front, good air, and friends near by"), her winter there in the care of her father, her move to Dr. Lawrence's home at Dunreath Place, Roxbury, in December 1886 for "the remainder of her life", the last drive to see her father, the warm spring like day and the forgotten fur cloak, the pain in her head the next morning, her death at 3.30 p.m. on 6 March 1888 not knowing her father had died, the friends who came for her father met at the threshold with "Louisa Alcott is dead", and her funeral "in her father's rooms at Louisburg Square". The National Park Service page on Bronson Alcott independently gives his death in Boston on 4 March 1888. "She never lived here again" restates Cheney's "for the remainder of her life"; she still drove in to visit. The script does not say the cloak caused her illness; Cheney implies it. The house number (10) is widely given but not in either source, so the script does not use it.
