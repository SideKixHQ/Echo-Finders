teaser: "The land was sold. One small grave was not."
script: |
  Look for a small stone urn behind an iron railing, on the slope just below the drive. Read the words on it. Erected to the memory of an amiable child.

  It is a grave. And it is older than the park, older than the drive, older than almost anything you can see from here.

  In seventeen ninety seven, this hillside was a country estate, high above the Hudson. A little boy named St. Claire Pollock lived here. He was five years old.

  On the fifteenth of July that year, he fell from the rocks below the house, and died.

  His family buried him here, on the slope above the river.

  Some years later, his uncle, George Pollock, sold the land. He asked for one thing in return. That this grave be left alone, forever.

  The city grew right up to the railing. The estate became a park. A road came through, and then a tomb for a president, a few steps away.

  And still, nobody has moved him.

