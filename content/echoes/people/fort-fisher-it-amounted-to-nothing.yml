teaser: "The new commander inspected the fort before dusk on his first day. He was not impressed."
script: |
  Picture this place in July 1862, before most of what you can see was here.

  That month the fort got its final commander, Colonel William Lamb. Before dusk on the day he
  arrived, he had thoroughly inspected the works. He found only seventeen guns of respectable
  calibre. As a defence against a Federal fleet, he wrote, the works amounted to nothing.

  So he decided to build something else. A work of such magnitude, in his words, that it could
  withstand the heaviest fire of any guns in the American navy.

  He spent the next two and a half years doing it. Most of the mounds you are looking at are
  his answer to his own first afternoon here.
