teaser: "He had not heard that song since he was a kid."
script: |
  Look along this block of South Rampart Street, to number four twenty seven.

  In twenty twenty one, Hurricane Ida brought down the old building there. It had been the shop and home of a Jewish family named Karnofsky. And for one boy from this part of town, it had been something like a second home. His name was Louis Armstrong.

  The Karnofskys hired him when he was seven. By day he rode their junk wagon, tooting a small tin horn. In the evenings he delivered coal. In between, he ate with the family. When he spotted a cornet in a pawnshop window, the Karnofskys lent him the money to buy it.

  In nineteen sixty nine, Louis Armstrong was sick in a hospital bed, and he heard his doctor hum a tune. It was the song Mrs. Karnofsky used to sing as she rocked her son to sleep. He picked up a pen and started writing about them.

  He wrote, when I reached the age of eleven, I began to realize that it was the Jewish family who instilled in me singing from the heart.

  Look at number four twenty seven again.

  He had not heard that song since he was a kid. He knew it straight away.
detail: >-
  The National Park Service dates the Karnofsky store at 427 South Rampart from 1913; the family's earlier home was on Girod Street, and Armstrong may have eaten with them at either or both. The store was listed on the National Register of Historic Places. The building collapsed in Hurricane Ida in August 2021; what stands there now may differ.
