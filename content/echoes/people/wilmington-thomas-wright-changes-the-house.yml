script: |
  Thomas Henry Wright inherited this house as a boy and later trained as a physician. In
  1845, he enlarged the property.

  The museum's family timeline also connects him with banking and railroad leadership. He
  was among the first directors of the Wilmington and Weldon Railroad and, from 1847,
  president of the Bank of Cape Fear.

  Look at the house from the public corner. Its hyphenated name joins families, but even a
  single family's occupancy included substantial change. Thomas did not receive a finished
  museum; he received a working residence that could be adapted.

  The expansion gives his life a physical consequence here. The rooms belonged to
  different decisions made at different times. His story helps explain why the building
  cannot be read as one moment in 1770. Later occupants continued to shape the place they
  inherited.
