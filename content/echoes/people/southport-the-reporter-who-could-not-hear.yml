teaser: "This town's newspaper was built by a reporter who could not hear a word of his interviews."
script: |
  Look along Moore Street for the newspaper office, and the small white frame building next door. The small one is where the paper used to be made.

  The paper is the State Port Pilot. Its founder, W B Keziah, was completely deaf.

  In 1928 he was a reporter in Whiteville, more than sixty miles inland, when he decided to start his own paper on the coast.

  At first it was printed in Whiteville and trucked into Southport every day.

  He could not keep up the payments, and he lost his paper. The new owners hired him back as a reporter.

  Then the new editor was sent overseas with the Navy in the Second World War, and Keziah was made editor again.

  He did his interviews in sign language, and with a paper tablet he carried with him everywhere. His column was called Our Roving Reporter.

  Along the way, he taught a good many people around here a bit of sign language.

  The paper still comes out every Wednesday. It was built by a man who never heard a word anyone told him, and wrote down all of it.
