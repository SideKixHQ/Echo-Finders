script: |
  William Benjamin Gould was an enslaved plasterer hired out for work at the Bellamy site.
  The museum records that a later renovation revealed plasterwork bearing his initials.

  In 1862, Gould escaped down the Cape Fear River and entered Union naval service. He kept
  a diary, leaving a record in his own words beyond the evidence of his skilled labor.

  This is his documented worksite, not the location of every stage of his escape or
  service.

  If the identified plaster is available on your authorized tour, notice how small a
  signature can be beside a large house. Initials connect a finished surface to a
  particular person. Gould's later life changes the meaning again: the craftsperson was
  also someone who acted to claim freedom and preserve his experience.
