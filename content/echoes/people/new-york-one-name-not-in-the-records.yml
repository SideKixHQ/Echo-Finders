teaser: "On opening day, one speaker stopped to say the name nobody had written down."
script: |
  Look up at the stone tower above you, and the cables running down from it.

  On the day this bridge opened, the man in charge of building it had never seen it up close.

  The first chief engineer, John Roebling, was hurt while surveying the site, and died. His son, Washington Roebling, took over. He went down into the caissons, the chambers under the river where the towers' foundations were dug. And he caught the disease that came up out of them. For years after that, he could not leave his house. He watched the work through a telescope.

  So his wife, Emily, carried his ideas to the bridge. She was the one who talked to the engineers and the contractors. In the end, the contractors came to her, and her alone.

  On the opening day, the twenty fourth of May, eighteen eighty three, one of the speakers stopped to say her name.

  One name, he said, which may find no place in the official records, cannot be passed over here in silence.

  He called this bridge a lasting monument to the devotion of a woman, and to her capacity for the higher education she had been shut out of for too long.

  Her family says that when it opened, she was the first to cross. In a carriage, with a rooster, for victory.

  Look up at the tower again.

  He saw it from a distance. She was the one who crossed.

