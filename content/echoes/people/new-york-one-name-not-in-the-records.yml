# Reviewer note: the rooster crossing is family tradition (Kristian Roebling to CBS: "It's believed with a rooster in hand"), so the script attributes it to her family. Hewitt's tribute and Kingsley's line about Washington Roebling are from the 1883 official ceremonies volume.
