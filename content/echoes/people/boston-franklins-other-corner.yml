teaser: "Look across the street at Old South. He was baptized in there."
script: |
  Stand on Milk Street and look across at the Old South Meeting House, the big brick church
  with the tall steeple.

  Benjamin Franklin was baptized in there, as a baby, in seventeen oh six. And the story
  Boston has told for a very long time is that he was born right about where you are
  standing, in a small wooden house that belonged to his father, a candle maker.

  It was a plain house. Clapboard on the front, rough shingles on the sides, about twenty
  feet wide on the street. It stood for over a century, and it burned down in eighteen
  eleven. A newspaper office was later built on the site.

  Tidy enough. Except for one detail.

  In eighteen seventy three, the Boston historian Samuel Adams Drake pointed out that a
  corner of Hanover Street, across town, also claimed the honour. And the witness for that
  other corner, by his account, was Franklin himself, who was said to have told a reliable
  person he was born there.

  Other evidence points back here. Drake weighed the two and threw up his hands. A plague on
  both the houses, he wrote.

  What is certain is that the boy grew up at the Hanover Street house, making tallow candles
  for his father. What is likely is that he was born on Milk Street.

  So look at the church across the road. Whichever corner he was born on, he was carried
  over there to be baptized.
