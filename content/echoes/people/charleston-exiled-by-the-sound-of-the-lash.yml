teaser: "Two daughters of this house spoke against everything it stood on. Neither came home."
script: |
  Look at the big wooden house at three twenty one East Bay Street. Two sisters grew up in it, and neither of them ever came back.

  Their father was Judge John Grimké, a wealthy planter who held people in slavery. He raised eleven children here.

  Sarah was the elder. As a young woman she taught Sunday school to Black Charlestonians at St. Philip's, and asked why they could not be taught to read the Bible for themselves.

  She left for the North. In eighteen twenty nine, her sister Angelina, thirteen years younger, followed her.

  In the North they became the first women to work as agents for the antislavery movement. When a Charleston mob broke into the post office in eighteen thirty five and burned antislavery papers, Angelina wrote that ending slavery was a cause worth dying for. After that, they were no longer welcome in South Carolina.

  In eighteen thirty eight, Angelina became the first American woman to speak to a legislative body. She stood before a committee of the Massachusetts legislature, and said this.

  I stand before you as a southerner, exiled from the land of my birth by the sound of the lash, and the piteous cry of the slave.

  Look at the house again.

  She had grown up behind those windows.
detail: >-
  The South Carolina Encyclopedia entry on the sisters (Kelly Obernuefemann) gives their father, the jurist and planter John Faucheraud Grimké, Sarah's Sunday school teaching and her question about reading the Bible, Angelina leaving for Philadelphia in November 1829 as Sarah had done before, their work as the first female antislavery agents, the 1835 post office raid and Angelina's letter calling emancipation a cause worth dying for, their exile, and Angelina's address to a committee of the Massachusetts legislature in February 1838, with her words. The Post and Courier gives 321 East Bay Street as the sisters' childhood home (2015), Angelina thirteen years younger than Sarah (2015), and, in a 2022 column by David Rogers, the judge as a wealthy planter and slaveholder who raised eleven children there, and "Neither sister ever returned to Charleston." Two independent sources for the key facts. The house is now known as the Blake-Grimké House.
