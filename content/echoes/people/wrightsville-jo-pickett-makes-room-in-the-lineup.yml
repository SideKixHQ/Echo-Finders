teaser: "A champion who taught herself, and the women's contest she brought back."
script: |
  Look at the surf breaks near Crystal Pier. Jo Pickett calls this her favorite surf spot.

  She is a former U.S. national short board champion, and she taught herself to surf. Here she
  started Crystal South Surf Camp, which has offered surf instruction since 1996.

  This beach is also home to the Wahine Classic, an all-female surf contest she runs, for everyone
  from Teenie Wahines to seniors. It grew out of the East Coast Wahine Championships, founded in 1997
  as the first all-female surf event on the East Coast. After it shut down in 2011, Pickett and her
  friends relaunched it in 2013.

  Ask why she still teaches, and she goes back to her own first wave. That's the moment, she says.
  And that's why I still want to teach.
