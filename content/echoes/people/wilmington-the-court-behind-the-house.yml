id: wilmington-the-court-behind-the-house
title: "The Court Behind the House"
summary: "A Wilmington doctor laid a tennis court in his own back garden. Althea Gibson learned on it."
place: "Dr. Hubert Eaton House, 1406 Orange Street, Wilmington, North Carolina"
at: { lat: 34.23431, lng: -77.93059 }
triggerRadiusKm: 0.04
category: people
format: feature
durationS: 145
visibility: at-hand
certainty: documented
minAge: 0
quality: 0.8
tags: [wilmington]
teaser: "Work out what a private court was for."
script: |
  There is a tennis court behind this house.

  Not a club court. Not a park court. A doctor's back garden, with a full court laid in
  it.

  Work out what that is for.

  Start with the rule, because the rule is the whole story. A Black player in America
  could not join the United States Lawn Tennis Association. So in nineteen sixteen Black
  players built their own: the American Tennis Association, set up to encourage and
  support competitive tennis among African Americans, who were not permitted to join the
  white association. The state's own account calls it the first professional sports
  league for African Americans in the country.

  A separate league is not a door opening. It is a door staying shut, and people building
  another house.

  Now the man.

  Hubert Eaton practised medicine here. The city's landmark register calls him a prominent
  Black doctor in Wilmington and a leader in the civil rights movement, in the city and in
  the nation. It also calls him a passionate and accomplished tennis player.

  That is what fits on a plaque. Here is what it cost.

  A public court can turn you away. A club can decline your application. A tournament can
  lose your entry form. There is a court in this city that none of that can happen on, and
  it is the court a man pays for himself and lays in his own back garden.

  So he did. And then he taught on it.

  The register is specific about one of the people he taught at his home and on that
  court. The state goes further and says she lived with him for a time.

  Her name was Althea Gibson.

  She went on, in the city's own flat phrasing, to become an international, award winning
  tennis icon. The state's account says Eaton is given much credit for her development.

  Look at the house.

  It is a house. That is the whole point of it. There is no stadium and no statue. A
  doctor who could not change the rule built around it instead, in his own yard, at his
  own expense, and handed the result to somebody else.
