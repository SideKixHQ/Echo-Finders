teaser: "A man who spent his life speaking kept a room with no windows."
script: |
  Find the little stone hut behind the big house. One room. A chimney. No windows.

  The man who owned this hill was Frederick Douglass. He had spent his life speaking to crowds. Friends and visitors came up this hill to see him. And out here, he kept a room of his own.

  He called it the Growlery. A place to growl. The word comes from Charles Dickens, from the novel Bleak House, and Douglass probably borrowed it from there.

  Inside there was a desk, a stool and a couch, and a fireplace for winter. After breakfast and a morning walk, he would leave everyone behind and come out here, to read and write and think.

  In eighteen eighty nine he let a reporter look inside. The reporter found a cosy fire burning, and the desk literally filled with books and paper.

  The hut you see is a rebuilding, made by the Park Service from the old materials, on the same spot.

  A British visitor once walked these woods with him. They sat down on a fallen tree. And he turned to her and said, let us be silent awhile, and listen to nature.

  So, for a moment, do.
detail: >-
  The Park Service's Growlery page says Douglass "probably" took the name from Dickens; the script keeps that hedge. The 1889 reporter's words ("literally filled with books and paper") are quoted on the same page. The Catherine Impey quotation comes from her 1892 diary as cited by the Park Service.
