script: |
  Rufus Bunnell assisted with the Bellamy design and kept a diary. The museum's
  published excerpts include an 1859 Independence Day described through heat and a
  thunderstorm.

  Such an entry brings a working person into a history often told through architectural
  labels. He experienced Wilmington as weather, time, and daily activity while the house
  was taking shape.

  This is the construction project associated with his work. We do not need to invent
  his private thoughts or place every diary line on this sidewalk.

  Look at the mansion and remember that its finished appearance came after many
  unfinished days. A diary preserves the scale of those days. Bunnell's records let the
  building's design history meet the ordinary conditions in which an architect actually
  lived and worked.
