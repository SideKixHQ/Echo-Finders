teaser: "Watch a swan boat come round the pond. Look at the back of it."
script: |
  Watch a swan boat come round the pond. Look at the back of it. That is where the driver
  sits, pedalling as if on a bicycle, and paddle wheels push the whole thing along.

  The boats began running here in eighteen seventy-seven. They were designed by a man named
  Robert Paget.

  Sixteen years later, newspapers across the country ran a small item about who was really
  in charge. The owner and manager of the Boston swan boats, they reported, was a woman.
  Mrs. Paget.

  She did not stand at the landing calling for fares. She left that to a man. But she came
  down to the landing often, studied the business, and made a very comfortable living from
  it. By then she had been running it for fourteen years.

  In nineteen thirty-eight, the owner of the fleet was still a Paget, John Paget. When
  Shirley Temple came to town, she was made an honorary admiral of the swan boat navy, and
  he promised her an admiral's hat.

  As for the man at the landing, one story from those years gives his whole sales pitch.
  Grown folks, ten cents. Children, five. Babies thrown in.
