teaser: "Everyone remembers the answer. She asked the question."
script: |
  Look at the tall brick house, with the wide doorway and the iron rail beside its steps. George Washington came here to dinner, and to tea, again and again.

  You probably know the most famous line from that summer of the convention. A republic, if you can keep it. But who asked the question?

  When the convention closed, in seventeen eighty seven, one of the delegates, James McHenry, wrote down a little story among his notes. A lady asked Doctor Franklin, well Doctor, what have we got? A republic or a monarchy? A republic, replied the Doctor, if you can keep it.

  And at the bottom, McHenry added a note. The lady here alluded to was Mrs. Powel of Philadelphia.

  Her name was Elizabeth Powel, and this was her house. Her husband Samuel was the last mayor of Philadelphia under the king, and the first after him. And she, the guidebooks say, did as much as he did to make this house famous.

  Nobody wrote down where she asked it. Perhaps it was in this house. Perhaps somewhere else. But the question was hers.

  Look at the door again. Everyone remembers the answer.

  She asked the question.
detail: >-
  McHenry's anecdote is the only record of the exchange; it gives no place or date, and later printings of the story differ. The house is a museum of the Philadelphia Society for the Preservation of Landmarks.
