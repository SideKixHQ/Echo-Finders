teaser: "He came to set up the Inquisition. The governor had other plans."
script: |
  Look through the railings into the garden behind the cathedral.

  Around seventeen eighty-nine, a Spanish Capuchin friar named Antonio de Sedella called on the governor of this colony, Esteban Miró. He showed him a commission. He had been sent to set up the Holy Office of the Inquisition in New Orleans.

  His preparations were complete, he said. Some night soon, he would send for soldiers to help him make the arrests.

  The governor was polite. Then he made preparations of his own.

  The next night there was a heavy knocking at the friar's door. He opened it to an officer and a file of grenadiers. He thanked them for coming so promptly, and told them he did not need them yet.

  He was told he was under arrest. The next day he was on a ship for Cádiz.

  Miró wrote to Madrid that the very word Inquisition, spoken in New Orleans, could drive people out of the colony.

  And then the friar came back.

  He came back as Père Antoine, the parish priest of this cathedral, for nearly fifty years. A guidebook from eighteen forty-five says he was supposed to have married or buried nearly half the people of the place. When a church official tried to suspend him, his congregation left the cathedral and ran to his door.

  He lived in a little cabin in the alley back here. He is buried at the foot of the altar.

  New Orleans threw out the inquisitor. Then it kept the priest for half a century.
