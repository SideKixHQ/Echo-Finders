teaser: "On Saint Valentine's Day, a novelist sat in this house and wrote a letter home."
script: |
  Stand across from the house with the stuccoed front and the iron railings round its balconies. A cotton merchant named Andrew Low built it in the eighteen forties.

  On Saint Valentine's Day, one year in the eighteen fifties, a famous English novelist sat in this house and wrote a letter home.

  He was William Makepeace Thackeray, and he was crossing America giving lectures.

  He was tired of hotels. Tired of the crowds drinking at the bar, and the tearing northern bustle. Here, he wrote, he had the most comfortable quarters he had found anywhere in the United States.

  He liked the town as well. Wide streets, trees, a few cows and carriages toiling through the sandy road.

  And he was honest about the people who came to hear him. A snug little audience of three or four hundred, he wrote, far too lazy to laugh or applaud.

  The last time he stayed, Low had been a widower. Now there was a pretty new wife, and a baby daughter crowing in the nursery next door.

  A great writer, in a fine house, describing his audience as too lazy to clap.

  He was having a wonderful time.
