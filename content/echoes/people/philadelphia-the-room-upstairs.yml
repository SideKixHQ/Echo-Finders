teaser: "The smallest unit of the National Park System, and a will written upstairs."
script: |
  Look at the corner house here, at Third and Pine, and then up at its second floor.

  The whole site covers two hundredths of an acre. The National Park Service calls it the smallest unit in the national park system.

  Late in seventeen ninety-seven, a Polish general took a cramped room up there, in Mrs. Relf's boarding house. His name was Thaddeus Kosciuszko. More than twenty years earlier he had come to America and designed fortifications for the Revolution, at Saratoga and at West Point. Then he went home to fight for Poland, was wounded, captured and imprisoned in Russia, and came back to Philadelphia a hero, still recovering.

  People climbed the stairs to see him. A Virginia congressman who pushed Congress to pay what it owed him. Chief Little Turtle of the Miami, who gave him a pipe tomahawk. And the Vice President, Thomas Jefferson, who became a close friend.

  Up in that room, with Jefferson's legal help, Kosciuszko worked out his will. He asked that after his death his estate be used to free as many enslaved people as possible.

  In May seventeen ninety-eight he slipped out of the country in the small hours, on a ship from New Castle, Delaware. He told one person he was going. Jefferson.

  He gave Thomas Jefferson two things to keep. The secret of his leaving. And the will.
