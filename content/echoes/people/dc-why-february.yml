teaser: "Every February starts in this row house."
script: |
  Find the narrow brick row house at fifteen thirty eight, Ninth Street. Every February, the whole country marks something that was dreamed up in there.

  The man who bought it, in nineteen twenty two, was Carter G. Woodson. His parents had been enslaved. As a young man he dug coal in West Virginia, and he did not start high school until he was twenty. He finished in two years. In nineteen twelve, he earned a doctorate from Harvard. Only the second Black American ever to do it.

  And then he noticed what was missing. The schools taught almost nothing about Black Americans at all. So he set out to write them back in, from this house. For a while, a young poet named Langston Hughes worked for him here. Hughes remembered his job. To open the office in the mornings, wrap and mail books, and bank the furnace at night when Doctor Woodson was away.

  In nineteen twenty six, Woodson started something called Negro History Week. He chose the second week of February, because it held two birthdays. Abraham Lincoln's, and Frederick Douglass's. It was a week.

  He died in this house in nineteen fifty, in his bedroom on the third floor. Look up at the top windows. Later, the house stood empty and fell apart. In twenty eleven, an earthquake pulled its front wall loose. The Park Service put it back together.

  He asked the country for one week.

  It gave him a month, twenty six years after he died.
