teaser: "Turned away by a Philadelphia music school. Then seventy five thousand people."
script: |
  Look along this little street, at the row houses. One of them, number seven six two, was bought in nineteen twenty four by a woman named Anna Anderson. Part of the money came from her daughter's singing.

  Her daughter was Marian Anderson. A contralto. And a music school here in Philadelphia had turned her away, because she was Black.

  So she went to Europe, where there was less prejudice and more chance to learn. She sang there for years. When she came home, she was famous. She sang at the White House. And through all of it, the house on this street stayed her home, and her office.

  In nineteen thirty nine, her manager tried to book her into Constitution Hall in Washington. It belonged to the Daughters of the American Revolution. They said no. Every date he asked for was refused, even though those dates were open to white performers.

  The First Lady, Eleanor Roosevelt, resigned from the Daughters in protest.

  And so, on Easter Sunday, the ninth of April, nineteen thirty nine, Marian Anderson sang outdoors instead. On the steps of the Lincoln Memorial. More than seventy five thousand people came. Millions more listened on the radio.

  Look at the house again. Small, plain, one of a row.

  Seventy five thousand people. And then, home to Martin Street.
