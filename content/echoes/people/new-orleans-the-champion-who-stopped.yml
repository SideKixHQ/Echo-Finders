teaser: "Look at the iron railing on the balcony across Royal Street."
script: |
  Look at the iron railing on the balcony of the building across Royal Street. A writer in nineteen nineteen pointed out a monogram twined into that ironwork. It belonged to the Louisiana Bank, which put up this building in eighteen sixteen.

  But the man people came here to think about was not a banker.

  Paul Morphy was born in New Orleans in eighteen thirty-seven, the son of a judge. When he was about ten, his father explained to him how the chess pieces move. Within two years the boy was beating the best players in the city. Before he turned thirteen, a famous Hungarian master passing through New Orleans played him three games. The boy won two, and drew the other.

  He went on to Paris and London, and came home the greatest chess player in the world. The city gave him a set of chessmen in gold and silver.

  And then he stopped.

  In his later years, a newspaper reported, he never played. Now and then friends would coax him to sit down at a board, and in the middle of the game he would suddenly sweep the pieces away, stand up and leave. When the master Steinitz came to New Orleans, people tried several times to bring the two of them together. Morphy would not do it.

  He died in this house in July eighteen eighty-four. He was forty-seven.

  The same report added one more thing. While Steinitz was playing in New Orleans, Morphy followed his games closely in the newspapers.

  And he criticised the moves.
