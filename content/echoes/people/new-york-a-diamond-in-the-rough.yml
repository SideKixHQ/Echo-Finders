teaser: "She called herself a warrior poet. She wrote it here, a ferry ride from Manhattan."
script: |
  Look at the house with the wide wooden porch, and the sunburst carved over the steps.

  In July, nineteen seventy two, a poet and her partner bought it, for thirty seven thousand, seven hundred and fifty dollars. The poet's name was Audre Lorde.

  She had grown up in Harlem, so nearsighted that she was considered legally blind. Now she wanted space, and trees, for her children. This house was a ferry ride from Manhattan, and it had both. She fell in love with it. She called it a diamond in the rough.

  She set up her study on the second floor. Here she could have a garden, and look out over the water.

  She called herself a black, lesbian, mother, warrior, poet. And in this house she wrote some of her most famous books.

  In nineteen seventy eight, she was diagnosed with breast cancer. She was horrified, and afraid. And she wrote about it. The Cancer Journals came out two years later. It argued for a woman's right to make her own decisions about her health. And it won a book of the year award.

  The city's report says the family also met racism here, many times.

  She lived here fifteen years. In nineteen ninety one, New York made her the state's poet laureate.

  Look up at the second floor.

  She was afraid, and she wrote it down anyway.

