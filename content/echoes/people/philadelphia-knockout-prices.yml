script: |
  Look at the old brick building on this side of Broad Street, across from the train station. Look over the main door. When a reporter came by in twenty thirteen, a pair of boxing gloves was still etched up there, and faded grey letters still said, Joe Frazier's Gym.

  For forty two years, this was his gym. Joe Frazier. A heavyweight from Philadelphia, hard working, the opposite of his great rival, Muhammad Ali.

  In nineteen seventy one, the two of them met in what was billed as the Fight of the Century. Frazier got ready for it here. He won. It was the first time Ali had ever lost.

  People on this block remember him. A man from the neighbourhood said Frazier would invite them in, to watch the street tough fighters this city turned out like soft pretzels. He might have been heavyweight champion of the world, the man said, but he never forgot about us.

  Frazier closed the gym in twenty ten, already ill. He died the next year. The building became a discount furniture store.

  The store's manager still felt the champion around. The spirit is still here, he said. And he pointed to the sign in the window.

  Knockout prices.
