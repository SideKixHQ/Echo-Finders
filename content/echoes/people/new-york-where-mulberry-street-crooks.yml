teaser: "The street here bends like an elbow. A writer once called it the foul core of New York's slums."
script: |
  Look at the way Mulberry Street bends here, beside the park. It crooks like an elbow. People play cards at the tables. Children run across the courts.

  Before this park, this was the Bend.

  A writer and reformer named Jacob Riis walked these alleys in the eighteen eighties. And in eighteen ninety, he put the Bend in a book called How the Other Half Lives.

  Where Mulberry Street crooks like an elbow, he wrote, is the Bend, foul core of New York's slums.

  He said cows had once walked home along this path. Now, he wrote, the only bells you heard announced the rag picker's cart.

  He counted. On this block, in eighteen eighty eight, nearly one hundred and forty in every thousand children under five died. For the whole city, counting every age, the rate was about twenty six. In one house, there were five baby funerals in a single year.

  And the city did something about it. In eighteen ninety two, the Bend was torn down. In its place they made this park.

  Look at the children running across it.

  This is the city answering a book.

