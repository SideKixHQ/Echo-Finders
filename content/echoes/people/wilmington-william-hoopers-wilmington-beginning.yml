    quote: "In 1764, after finishing his education, Hooper moved to Wilmington and opened a law office."
  - says: "Twelve years later, he signed the Declaration of Independence."
    source: 1
    quote: "In May 1776, Hooper joined John Penn and Hewes at the Third Continental Congress. With Hewes, Hooper served on the Marine Committee, and although absent when the Declaration of Independence was voted on, signed his name to the document on August 2."
  - says: "he represented New Hanover County in the Assembly"
    source: 1
    quote: "He returned to the Assembly in December 1773 as New Hanover County’s representative along with John Ashe."
  - says: "before the Continental Congress became his larger stage."
    source: 1
    quote: "At the First Provincial Congress in North Carolina in August 1774, Hooper was elected as one of the colony’s first three delegates to the Continental Congress along with Richard Caswell and Joseph Hewes."
