script: |
  William Hooper arrived in Wilmington in 1764 and opened a law office. Twelve years
  later, he signed the Declaration of Independence.

  That national achievement can obscure the local beginning: a young lawyer building a
  career in a port town. Wilmington supplied professional relationships and a political
  setting before the Continental Congress became his larger stage.

  You are at a marker honoring that connection, not standing inside a verified surviving
  office.

  Look along Third Street and think about how a public life begins. The later signature
  gives Hooper a place in national memory, but the earlier years consisted of work and
  decisions whose consequences were still unknown. The marker brings the two scales
  together: a person's Wilmington chapter and the document that would define his
  reputation.
