teaser: "You are standing at a bus drop-off. Underneath it is a back yard."
script: |
  Stand on Fifth Street beside the National Constitution Center, where the buses pull in to drop people off.

  Under this drop-off is the site of a small rented house. From seventeen ninety, a free Black coachman named James Oronoco Dexter lived in it with nine other people.

  Dexter had been enslaved. On this block he was one of at least six free Black heads of household. In seventeen ninety-two he hosted the first meeting, in his own house, to arrange the building of a church. It became the African Episcopal Church of Saint Thomas, and its congregation is still active.

  When the Constitution Center was being built, the Park Service at first decided not to dig here. The drop-off would sit on top, and whatever was underneath would be left alone. People in the community disagreed. They wanted to know what was down there. So the archaeologists dug.

  In the old back yard they found a barrel sunk in the ground and filled with sweepings, with nearly four thousand household objects in it. Pieces of a teapot made by English potters. A Chinese porcelain saucer. Bones from good cuts of meat, and from pig's feet.

  A coachman to a wealthy family was well paid. The archaeologists think the imported china let Dexter set a proper table for the people planning that church.

  Most of what survives from the founding years is paper. What survived of James Dexter's house was the good china, swept up in the yard.
