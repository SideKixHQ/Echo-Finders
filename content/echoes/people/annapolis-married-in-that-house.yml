teaser: "The man who wrote the national anthem got married across the street."
script: |
  Look at the big brick house on Maryland Avenue. It was built by Samuel Chase, who signed the Declaration of Independence.

  A young man who went to school here in Annapolis, at St. John's College, was married in that house. His name was Francis Scott Key.

  In September 1814 he was a young lawyer, held under guard on a ship in Baltimore harbor by the British navy.

  Through the night he watched the British bomb Fort McHenry with rockets.

  At dawn he found the American flag still flying over the fort, tattered but intact.

  He wrote the words to The Star-Spangled Banner. Congress made it the national anthem in 1931.

  The anthem was written by a man who got married in that house.
