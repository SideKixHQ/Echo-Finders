script: |
  Ellen Bellamy lived into 1946 and left a memoir of her childhood, published as Back
  with the Tide. Her recollections became a source for understanding this household.

  A memoir gives us a person's perspective, not an impartial view of everyone who shared
  the setting. Her position within the family shaped what she noticed and how she
  described it.

  Stand before the mansion and consider the reach of a single life. A house built before
  the Civil War could still be remembered by a resident in the twentieth century.

  Ellen's memories help connect those eras, but the museum's wider story also requires
  records of enslaved workers, craftspeople, and others. Her voice is valuable when
  heard as a voice among the people whose lives belonged to this place.
