certaintyNote: >-
  Latrobe's death while finishing the waterworks begun by his son is told by his son John H. B. Latrobe (1876). The 1885 Historical Sketch Book places the steam pump at Decatur and Ursulines but gives a contract date of 1813 and says the pump was soon at work, which does not fit Latrobe's own family's account of an unfinished works in 1820. The script follows the family account and says whose words they are.
