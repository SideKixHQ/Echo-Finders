tags: [new-orleans, new-orleans-core, french-market, latrobe, yellow-fever, riverfront]
teaser: "In two weeks, water would have been flowing through the streets."
script: |
  Stand at this corner, where Ursulines meets Decatur, and look toward the river.

  A steam pump once stood here, on what was then the levee. It was meant to push river water through pipes, out into the streets of the city.

  The man behind it was Benjamin Latrobe, who had helped design the Capitol in Washington. He sent his eldest son, Henry, down here to build it. Henry died here before it was done.

  So Latrobe came himself, to finish his son's work. In eighteen twenty he brought his family to live here. His health was good. He thought, at last, the hard years were over.

  The engine was finished. In two weeks, water would have been flowing through the streets.

  On the very day he was laying the pipe that joined the engine to the river, he fell ill.

  His other son wrote it down years later, in one sentence. The fatal disease of the climate had seized him, and in a few hours he was laid beside his son.

  Look toward the river again.

  Two weeks from water.
detail: >-
  Benjamin Henry Latrobe died in New Orleans in 1820, soon after moving his family there, and was buried beside his son Henry, who had died while building the same works. The account quoted is by another son, John H. B. Latrobe, in his 1876 introduction to his father's journal; it calls the illness the fatal disease of the climate. Latrobe also appears in this library's Congo Square and Hermann-Grima House echoes, and his daughter Lydia in the steamboat echo on the riverfront.
