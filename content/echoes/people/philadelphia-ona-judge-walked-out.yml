teaser: "Find the name Ona Judge."
script: |
  You are standing on the site of the President's House. The building itself was demolished long ago, but its real foundations are still here to see, found by archaeologists in two thousand seven.

  George Washington lived here from seventeen ninety to seventeen ninety-seven. His household was about thirty people. Nine of them, at one time or another, were enslaved Africans brought up from Mount Vernon. Their names are memorialized here.

  Find the name Ona Judge.

  She was Martha Washington's personal maid, and a skilled seamstress. Pennsylvania law said that an enslaved person held in the state for six months could claim freedom. So the Washingtons kept sending the people they enslaved back to Virginia before the six months ran out.

  In seventeen ninety-six, Ona Judge walked out of this house and did not come back.

  She reached Portsmouth, New Hampshire, where someone recognised her. Washington, still president, wrote to the customs collector there and asked him to seize her and send her back. The collector talked with her, and declined.

  Two years later Washington's nephew went north to try again. Over dinner he mentioned the plan to the governor of New Hampshire. The governor sent her a warning, and she got away again, with her child.

  Washington died in seventeen ninety-nine. Ona Judge lived free in New Hampshire until eighteen forty-eight.

  She outlived the man who was looking for her by almost fifty years.
