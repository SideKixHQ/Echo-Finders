teaser: "Look up past the dome, to the bronze figure on the very top."
script: |
  Look up past the dome, to the bronze figure standing on the very top.

  She is called Freedom. She is nineteen and a half feet tall, and she weighs about fifteen
  thousand pounds.

  Before she was bronze, she was plaster. The sculptor, Thomas Crawford, made the full-size
  model in his studio in Rome, and died before it left. It crossed the Atlantic in six
  crates. Here, an Italian craftsman put the pieces together so cleverly that nobody could
  see the joints.

  Then it had to come apart again, to be cast. By one account, the craftsman refused to
  separate it unless he was paid a great deal more. Only he knew where the bolts were
  hidden.

  The casting had gone to Clark Mills, whose foundry stood out on the Bladensburg road.
  Mills owned a man named Philip Reid.

  Reid rigged a pulley to an iron eye in the statue's head. He strained the rope gently,
  until the seams showed themselves one by one. Then he found the bolts, scraped away the
  plaster, and took them out. The model came apart, ready for the foundry.

  In December 1863 the last section, her head and shoulders, was raised up there to a
  salute of thirty-five guns.

  The statue is called Freedom. The man who freed her from the plaster was not free.
