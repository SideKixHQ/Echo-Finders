script: |
  Among the old houses in this park is a two storey house in the Greek Revival style. It belonged to a man who had been born enslaved, and it took him years to finish.

  He would not borrow a cent to build it.

  His name was Jack Yates. He was born in Virginia in eighteen twenty eight. As a boy, he learned to read alongside his master's son.

  In eighteen sixty three, his wife and children were sold to a plantation in Texas. His master freed him so he could go with them, and in Matagorda County he lived as a slave again, until emancipation came in eighteen sixty five.

  The family came to Houston. Yates hauled goods with a dray. The next year he became the minister of Antioch Baptist Church.

  He had a saying. Do well whatever is to be done, then be ready to do whatever else may follow.

  Debt, he taught, would put freed people under another kind of bondage. So when his church was built, nothing was borrowed. The members traded their labor for food.

  And when he built his own house, in Freedmen's Town, with his brother and his brother in law, he bought materials only when he could pay. A room when there was money. Then another.

  He died at home in eighteen ninety seven. His last words were, the angels in glory welcome me home.

  A century later, his granddaughter sold the house, for one dollar, so it could be saved. It was moved here.

  Look at it again. Not one board of it was borrowed.

