script: |
  Elisabeth Chant made a studio in the old Hart Wine House on Cottage Lane. There she
  taught and influenced artists who helped shape Wilmington's visual-arts community.

  Among her students were Claude Howell and Henry Jay MacMillan. The important thing at
  this stop is the local relationship: a teacher, a working space, and people learning to
  see and make art.

  Stay on the public lane. The studio's history does not grant access to today's private
  property.

  The small setting helps explain the scale of cultural beginnings. A teacher did not need
  an institution with a monumental facade to have a lasting effect. Chant's studio made
  room for practice and exchange. Later artistic careers carried that influence beyond the
  lane where some of their learning began.
