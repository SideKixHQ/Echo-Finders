script: |
  Claude Howell helped advocate for a stronger visual-arts life in Wilmington. In 1962, he
  supported the movement that established St. John's Art Gallery here.

  The Cameron Art Museum's history records his call for the community to encounter
  important art from the past and present. He wanted local audiences to have wider
  opportunities to look and learn.

  We do not need to reproduce his letter to understand the action behind it. Advocacy
  helped turn a hope into an institution.

  Look at the earlier museum complex from Orange Street. Howell's role connected making
  art with building an audience for it. A city's cultural life depends on both. The
  gallery gave that argument rooms and a public address, allowing an artistic ambition to
  become something visitors could actually enter.
