teaser: "Before there were houses, there were holes in the hill."
script: |
  Look down toward the river. Long ago, before the highway and the buildings, there was a high, dry bank here, with pine trees, above the water.

  When the first settlers came with William Penn, in sixteen eighty two, there were no houses waiting for them. So what did they do? They dug.

  They dug holes into the bank, about three feet deep. They built up the walls with chunks of grass and earth. They made roofs from branches and bark and river rushes. They made chimneys out of stones and pebbles, stuck together with clay. And they moved in. Whole families, living in caves.

  Down by this end of Vine Street, a family called Key dug their cave. And in it, a baby boy was born. His name was John Key. People called him the first born of Philadelphia. To mark it, William Penn gave the baby his very own piece of land on Race Street.

  The grown ups in charge did not love the caves. They ordered every family living in a cave to come and see them. Not one family came. Later, the court ordered the empty caves in Front Street pulled down, and the holes filled in.

  So the next time you see a hole in the ground, think about it.

  It might be somebody's first home.
