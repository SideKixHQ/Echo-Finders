teaser: "Two marble lions, and a message the city keeps needing."
script: |
  Look at the two marble lions guarding the steps of this library. They have names.

  One is called Patience. The other is called Fortitude. Fortitude means the kind of courage that keeps going when things are hard.

  So why would anyone name a lion Patience?

  The lions were carved for this library when it opened, by a sculptor named Edward Clark Potter.

  Then came the Great Depression, and hard times for New Yorkers. The mayor, Fiorello La Guardia, gave the lions their names. Patience and fortitude. That was what he wanted everyone in the city to hold on to.

  And the lions have kept doing that job ever since. Every December they wear wreaths. When the Mets played the Yankees in the World Series, they wore baseball caps. And in twenty twenty, in the pandemic, they wore face masks three feet long. The head of the library said it again. We must have patience and fortitude.

  Can you guess which lion is which?

  Two lions. Two words. For whenever the city needs them.

