teaser: "Stand in a corner and whisper. Someone forty feet away will hear you."
script: |
  Look up at the low, curved ceiling over your head, covered in pale tiles. Find the corners, where the arches come down to the floor.

  Here is something to try. Stand in one corner, with your face close to the wall. Ask a friend to stand in the corner across from you, on the diagonal. Now whisper.

  They can hear you. Through all these people walking past. From about forty feet away.

  Your whisper climbs up the curve of the ceiling, and comes down on the other side.

  The man who built ceilings like this was Rafael Guastavino. He came to New York from Spain in eighteen eighty one. He made his arches out of thin tiles, layer on layer, and they are all over America now.

  But here is the funny part. Nobody knows for sure whether he meant this ceiling to carry whispers at all.

  So go on. Try it again.

  Some of the best secrets in New York were made by accident.

