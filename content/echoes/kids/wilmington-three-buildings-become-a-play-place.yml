teaser: "The Children's Museum did not move into one brand-new building."
script: |
  The Children's Museum did not move into one brand-new building. In 2004, it bought a
  group of three old buildings downtown.

  They included a Masonic lodge, a Greek Orthodox church, and the Cowan house. The
  buildings had already helped people meet, worship, and live before they became part of a
  place for learning through play.

  Look at the complex with your grown-up. Can you notice differences between its parts?
  You do not have to know every building word to see that they were not all built
  together.

  This is a true story of finding a new use for old places. The museum kept important
  parts of downtown standing and brought children inside for a different purpose. A
  building can start out doing a job and later do something new.
