teaser: "He came to New York to see his own statue. But he had a secret."
script: |
  Look at the bronze dog standing on the rock. See how shiny he is, where people have patted him.

  His name is Balto. He was a real sled dog. In December, nineteen twenty five, Balto himself was photographed with his brand new statue.

  Why would a dog from Alaska get a statue in New York?

  In the winter of nineteen twenty five, children in the town of Nome, Alaska, were getting sick with diphtheria. The medicine that could save them was far away. The sea was frozen, so no ship could get there, and no plane could either.

  So teams of sled dogs carried the medicine, passing it from team to team, through blinding blizzards and freezing cold. On the second of February, a team with Balto in the lead ran into Nome with it. The whole journey was six hundred and seventy four miles.

  Balto became famous. Here is the secret.

  Balto's team ran about fifty five miles. Another dog, called Togo, led his team for two hundred and sixty one miles, over the longest and most dangerous part. Togo was twelve years old.

  So when you say hello to Balto, say thank you to Togo too.

  Balto got the statue. Togo got the hardest miles.

