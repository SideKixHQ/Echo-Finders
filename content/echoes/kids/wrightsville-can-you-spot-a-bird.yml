teaser: "A bird detective challenge where you never move your feet."
script: |
  Here is a beach challenge. Keep your feet still, beside your grownup, outside
  every rope and sign.

  Look at the sand, then the sky. Can you see a bird standing, flying, or carrying a fish?

  Some birds lay their eggs right on this beach. They scratch a little hollow in the sand, called a
  scrape. A scrape only counts as a nest once it has eggs in it.

  Nests are very hard to see. So an empty looking patch might be somebody's nursery.

  The best bird detectives don't go looking for nests. They stay back and watch. If a bird
  calls loudly at you, step back together.
