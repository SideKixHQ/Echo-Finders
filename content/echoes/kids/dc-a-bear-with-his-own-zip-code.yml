teaser: "Somewhere in this zoo lived a bear who got more letters than you ever will."
script: |
  Look through the gates of the zoo. Somewhere in there, for twenty six years, lived a bear who got so many letters that he was given his very own zip code.

  Who sends letters to a bear?

  It started with a fire. In the spring of nineteen fifty, a forest was burning in the Capitan Mountains of New Mexico. Firefighters found a tiny black bear cub who had survived it. His paws and legs were badly burned. So they called him Hotfoot Teddy.

  He got better. Then he was flown all the way here, to the National Zoo in Washington, and given a new name. Smokey.

  You might know that name. Smokey Bear was already a cartoon, telling everyone to be careful with fire. Now there was a real Smokey too. And people wrote to him. Lots and lots of letters.

  He grew up big. About four hundred pounds. When he died, he was taken home, and buried in Capitan, New Mexico, near where he was found.

  So, as you walk in, remember the little cub with the burned paws.

  Not bad for a bear who started out as Hotfoot Teddy.
