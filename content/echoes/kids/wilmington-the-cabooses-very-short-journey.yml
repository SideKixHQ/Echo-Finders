script: |
  In 2007, the museum had to move its red caboose to a new home. The distance was short,
  but the caboose could not simply roll there along a ready-made track.

  Workers lifted its body onto one truck and carried its wheels on another. They placed
  ties and rails at the new site, and the job continued into darkness.

  Look at the caboose from the permitted display area. A thing designed to travel can
  still be difficult to move!

  The team had to solve the problem one part at a time. Wheels, body, trucks, and rails
  all needed the right place in the plan. The caboose's short trip became a real adventure
  in cooperation, helping the museum keep a big piece of railroad history for visitors
  like you.
