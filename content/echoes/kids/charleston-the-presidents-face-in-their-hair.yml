teaser: "Imagine walking into a ball and seeing your own face everywhere."
script: |
  Look up Church Street for the Heyward Washington House, a few doors from this corner. In seventeen ninety one, the city rented that house for one very important guest, and filled it with furniture.

  The guest was President George Washington. He went to breakfasts, and dinners, and balls, and wrote them all down in his diary. At one concert, he counted four hundred ladies. He wrote that he had never seen anything like it.

  And at the ball, the ladies had his face in their hair. White ribbons, painted with his picture, and the words, God bless our President. Imagine walking into a room and seeing your own face looking back at you, from all over the dance floor.

  Look at the house again. By nineteen oh six, it had become a bakery. Then, in nineteen thirty, it opened as the city's very first house museum.

  For a while, you could buy bread where the President slept.
detail: >-
  Ravenel (1906) quotes Washington's journal for the concert of 400 ladies and describes the painted bandeaux worn at the concert and ball given at the City Hall, and records that the house was then a bakery. The Charleston Museum acquired the house in 1929 and opened it in 1930.
