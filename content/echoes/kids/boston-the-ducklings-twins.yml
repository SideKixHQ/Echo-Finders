detail: >-
  WBUR (31 March 2017) gives the nine bronze ducks and the eight ducklings' names, McCloskey's 1941 book, Nancy Schön's 1987 sculpture, the 1991 Moscow copy given by Barbara Bush to Raisa Gorbachev, their 1990 visit to the sculpture with a group of children after the Wellesley commencement, "The story goes that Gorbachev admired the ducklings", McCloskey's condition that it be "for children and it's not political", the plaque giving it to the children of the Soviet Union, and the Moscow park (Novodevichy). WBUR (27 November 2017) gives Schön's promise not to make copies, the one exception for Moscow, and her saying no to requests. NPR (2016) gives the crate of ducks McCloskey brought back to his studio apartment in New York to draw from, and his daughter's line that Mrs. Mallard's head is "so shiny". The two WBUR pieces are one publisher; NPR is independent for the book. "Not been friends" softens WBUR's "decades-long divisions" for children. Kids voice per casting.
