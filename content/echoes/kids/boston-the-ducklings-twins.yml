teaser: "These ducklings have twins. They live in Moscow."
script: |
  Find Mrs. Mallard and her ducklings, marching in a line. Can you count them? There are eight. Jack, Kack, Lack, Mack, Nack, Ouack, Pack and Quack.

  They come from a book called Make Way for Ducklings, by Robert McCloskey, from nineteen forty one. To draw the ducks, he bought a whole crate of real ones, and took them home to his apartment.

  This sculpture was made by an artist named Nancy Schön, in nineteen eighty seven. And she made Mr. McCloskey a promise. No copies. Lots of people asked her for ducks of their own. She said no.

  Except once.

  In nineteen ninety, the wife of the American president, Barbara Bush, brought a special guest here with a group of children. Raisa Gorbachev, the wife of the leader of the Soviet Union. For a very long time, those two countries had not been friends.

  The story goes that Mrs. Gorbachev loved the ducklings.

  So in nineteen ninety one, a second family of bronze ducks was made, and set up in a park in Moscow, as a present to the children there. Mr. McCloskey said yes, as long as it was for children.

  Pat Mrs. Mallard on the head. Her head is shiny from all the patting. Far away in Moscow, her twin is getting patted too.
