teaser: "How do you turn a cable car around? Watch."
script: |
  Find the round turntable at the end of the cable car tracks. Now wait for a cable car to arrive, and watch.

  The car has to face the other way to go back up the hill. So the workers push it around on the turntable, by hand!

  How does a cable car climb these hills? Under the street, a steel cable is always moving. The car holds on to it with a grip, and the cable pulls it along.

  A San Francisco man, Andrew Hallidie, came up with the idea, because the hills here were too steep for horses.

  The very first cable car ran on Clay Street, in eighteen seventy three. It was meant to hold fourteen people. On its first public trip, lots more people climbed in, and on top. It made it up the hill anyway.

  Up on Mason Street, there is a cable car museum where you can see the giant wheels that pull the cables under the streets.

  So, which way is this one going?
detail: >-
  NBC News (Associated Press, 2008): the Powell and Market turnaround, where workers manually swivel the cars around, and the Cable Car Museum at 1201 Mason Street with the underground pulleys that operate the cables. The 1940 Federal Writers' Project guide: Andrew S. Hallidie, a local manufacturer, invented the cable car for hills too steep for horses; the first line on Clay Street; the trial trip of 2 August 1873 in a car intended to hold only 14 that was overloaded and made the grade; the moving cable and the grip. "The giant wheels" glosses the museum's pulleys for children.
