teaser: "A castle of sand, built for real cannonballs."
script: |
  Have you ever built a sandcastle? This whole fort was a giant one, built for real.

  Most old forts were made of brick. But when a cannonball hits brick, the brick can crack and
  break. Sand is different. It soaks up the shock, like catching a ball in a pillow.

  So the builders piled sand into huge mounds, each one about as tall as a three-story house.
  They made it the biggest fort of its kind in the whole South.

  Here is the surprising part. The cannons never knocked most of it down. The ocean did, wave
  after wave. Only about a tenth of the fort is left. Can you find the mounds that survived?
