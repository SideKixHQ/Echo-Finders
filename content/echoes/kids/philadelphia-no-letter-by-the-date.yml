teaser: "Check your pocket for a penny."
script: |
  Have you got a coin in your pocket? A penny is best. Take it out, and look near the date.

  Is there a little letter there? A P, or a D? Or nothing at all?

  Hold on to that. We will come back to it.

  Long ago, right after the Revolution, America had a problem. Almost all the coins people used came from other countries. So in seventeen ninety two, Congress decided America would make its own money. Dollars, and cents. And the place to make them would be Philadelphia, because Philadelphia was the capital.

  The very first mint stood on this block. It was the first public building put up by an act of Congress. There were no big machines. The coins were made by the strength of men, and horses. It was slow, hard work. They made copper cents, silver dimes and quarters, and gold coins too.

  Philadelphia has made coins ever since. The mint moved three times, to bigger and bigger buildings. Today's mint can make more than a million coins in a single day.

  Now look at your penny again. If there is a P, or no letter at all, it was most likely made by the Philadelphia mint.

  That coin in your hand may have started its life in this city.
