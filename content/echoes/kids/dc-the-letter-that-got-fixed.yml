tags: [washington, dc-core, national-mall, lincoln-memorial, kids, spelling]
teaser: "Somewhere in this wall of words, there is a spelling mistake."
script: |
  Find the big speech carved on the wall here, on Lincoln's left. It is his second speech as President, cut into the stone. Here is a game. Somewhere in all those words, someone made a spelling mistake.

  Look for the word future. It is in a line that says, with high hope for the future. Found it? Now look very closely at the first letter.

  About a hundred years ago, when these words were being carved, the carver made a mistake. He cut an E, where he meant to cut an F. So the word said euture. And you cannot rub out stone.

  So they filled in part of the E, to turn it back into an F. A park ranger says it was sort of puttied in. People with very sharp eyes say they can still spot the patch. Can you?

  The whole speech is about mending a country after a war. Lincoln said, let us strive on to finish the work we are in, to bind up the nation's wounds.

  Even a mistake in stone can be mended.

  Even the future got fixed.
