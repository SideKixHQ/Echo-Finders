teaser: "What would you call a bagel, if you had never seen one?"
script: |
  Look up and down Orchard Street. Shops, cafes, people walking. Now fill the street with carts. Cart after cart, for blocks, above and below Delancey Street.

  That was the Orchard Street pushcart market. People sold fruit and vegetables from the carts, and bread, and tools, and work clothes.

  And food you could eat right there, hot.

  In nineteen thirty nine, a guidebook to New York tried to describe it. It had to explain every word.

  Hot knishes, it said. Mashed potatoes, or buckwheat, wrapped in dough and baked.

  Hot arbes. Boiled chick peas.

  And one more thing. A doughnut shaped roll.

  Can you guess?

  It was a bagel.

  The guide also worried that the carts might not last. The city wanted to move every market indoors.

  The carts are gone now. The bagels are everywhere.

