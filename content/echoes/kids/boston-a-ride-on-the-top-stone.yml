teaser: "Somebody rode the very top stone all the way up. On purpose."
script: |
  Look up, all the way to the very top of the tall stone tower. Right at the tip is a stone shaped like a pyramid. It is called the capstone, and it weighs about three tons.

  How do you get a stone that heavy all the way up there?

  The builders had a steam engine and a clever lifting machine. It pulled the capstone up from the ground, a bit like reeling a fish out of the sea with a fishing rod.

  And one of the workmen volunteered to ride on top of it. All the way up, to the top of the monument, two hundred and twenty one feet in the air. Someone at the time called it that frightful height between heaven and earth.

  When the capstone was in place, cannons fired twenty six times. One for every state in the country back then.

  The whole tower is made of about three thousand granite blocks. Lots of them weigh five tons each, more than the capstone.

  Look up at the top again. Would you have ridden it?
detail: >-
  Everything comes from the National Park Service article Building the Bunker Hill Monument: the capstone, a pyramid shaped granite block of about three tons, lifted by a hoist powered by the steam engine "similar to lifting a fish from the sea with a rod and reel", the workman who volunteered to ride atop it as it rose "that frightful height between heaven and earth" (the article quotes a period account), the 26 gun salute, one for every state, the finished height of 221 feet in July 1842, about 3,000 blocks, and large blocks averaging five tons. Single source. The volunteer's name is not given. Kids voice per casting.
