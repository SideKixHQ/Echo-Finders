teaser: "Can you hear a rooster? You probably can."
script: |
  Look around. Can you see a chicken? Can you hear a rooster?

  In Key West, whole chicken families cross the road together. They are everywhere.

  Long ago, lots of families here kept chickens at home. From the early nineteen hundreds until around World War Two.

  Then it got easy to buy eggs and chicken at the supermarket. So people let their chickens loose.

  And on a small island, two miles by four, with no wild animals to hunt them, the chickens did very well.

  In nineteen ninety eight, a big hurricane blew them all over the island. They have been multiplying ever since.

  The city once had a chicken catcher. He quit.

  So now it is the chickens' world. We are just living in it.
detail: >-
  From CBS News (Cristian Benavides, 27 July 2024), quoting Corey Malcolm, lead historian of the Florida Keys History Center: chicken raising from the early 1900s to around the Second World War, with Cuban cockfighting traditions behind it; supermarkets made home flocks unnecessary and birds were let loose on a two by four mile island with no natural predators; Florida banned cockfighting in 1986 and roosters were set free; Hurricane Georges (spelled "George" in the article) scattered them in 1998; a city employed chicken catcher quit in the 2000s after a backlash. Cockfighting is left out of a children's script. The closing line is the article's own.
