teaser: "Look high up. There is a little sign that meant: save this house."
script: |
  Look high up on this house, in the pointed gable above the second floor windows. There used to be a little metal badge up there. It is called a fire mark.

  Long ago, when a house caught fire, the firefighters looked up for a badge like this. It told them the house was insured, and which company had insured it.

  And that company had promised a reward to whoever put the fire out.

  So the badge said: save this one, and you will get paid.
detail: >-
  The 1941 Federal Writers' Project guide, Charleston point of interest 45, describes the fire mark at 7 State Street, fastened in the gabled pediment above the second story, one of few remaining from hundreds first used in the early eighteenth century after a London custom, showing that the building was insured and by which company, and guaranteeing a reward to any brigade or individuals who put out a fire. The script says "used to be" because the mark has not been checked on site since then.
