teaser: "Bats cannot swim. So the people of Houston fished them out."
script: |
  Look up at the bridge. Bats live underneath it. Lots of them. Something like two hundred and fifty thousand.

  Here is a question. Can a bat swim?

  In August twenty seventeen, a huge storm called Hurricane Harvey flooded Houston. The bayou under this bridge rose higher and higher, right up toward the bats.

  People walking over the bridge could hear them squeaking. Some bats were trying to swim away. Once a bat is wet, it is very hard for it to fly.

  So people helped. They had no special nets at first. They used what they had. Umbrellas. Tennis rackets. Broken tree branches. They leaned over the side and held them out, and the bats grabbed on.

  Then more helpers came, with gloves and nets and boxes, and carried the bats to dry land. A rescue team came to look after them until they were well enough to go home.

  And one more thing. If you ever find a bat, do not touch it. Tell a grown up.

  Look up at the bridge again. At sunset, the bats fly out.

  Some of them got a ride on a tennis racket.

