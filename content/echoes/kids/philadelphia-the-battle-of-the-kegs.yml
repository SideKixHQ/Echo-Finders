script: |
  Look out at the river. In the winter of seventeen seventy eight, the British army was living in Philadelphia, and their big warships were anchored out there on the Delaware, in a long line.

  Up the river in New Jersey, the Americans had an idea. They took some wooden kegs, like little barrels, and filled them with gunpowder. They fitted each one with a spring trigger, so it would go off if it bumped into something hard. Then they let the kegs float down the river toward the ships.

  It did not quite work. But when the British sailors spotted the kegs bobbing along, they got very nervous. Every barrel might be a bomb!

  So they started shooting at them. And shooting. And shooting. They fired at every floating keg they could see, until every single one had its top knocked in.

  The whole city laughed. A Philadelphia writer named Francis Hopkinson wrote a funny song about it, and called it The Battle of the Kegs. People said it was the best joke of the whole war.

  Look at the water again. A whole navy, with its cannons blazing.

  And not one of those barrels ever fired back.
