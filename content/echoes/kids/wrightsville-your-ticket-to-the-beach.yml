teaser: "Long ago, the ride to the beach was a trolley."
script: |
  Pretend you're holding a ticket to the beach. Stay beside your grownup, well back from the curb,
  and look along the street.

  Long ago, families rode a trolley car all the way here from Wilmington. The line was nine miles
  long, with twenty stops along the way.

  Imagine climbing off with towels, lunches and maybe a very large hat. What would you bring?

  The trolley ran for nearly forty years. Its very last trip was in April of 1940. After that, the
  rails were taken up.

  If your ride home was the trolley, you watched the clock. Miss the car home, and
  it was a very long walk!
