teaser: "A cemetery with a picket fence, and not one person buried in it."
script: |
  Look for the little white picket fence under the big road bridge. Behind it is a cemetery. But it is not for people. It is for pets!

  Lots of army families used to live here at the Presidio. When their dogs and cats died, this is where they buried them. Hundreds of them.

  Look at the gravestones. Lots of them look just like the ones in a soldiers' cemetery. Some say where the pet was born: China, England, Australia, Germany. Some give the owner's rank, like major, colonel or even general.

  One just says: A GI pet. He did his time.

  There are even graves for unknown pets, just like in a real military cemetery.

  Nobody knows for sure how it all began. People tell stories that it was once a graveyard for cavalry horses, or for guard dogs. Nobody has proved it.

  So which gravestone is your favourite?
detail: >-
  All from the National Park Service page on the Presidio Pet Cemetery: the white picket fence, hundreds of animals owned by families stationed at the Presidio, markers that mimic military cemetery markers, birthplaces including China, England, Australia and Germany, owners' ranks including majors, colonels and generals, the epitaph "A GI pet. He did his time.", markers to "unknowns", no official records of its origin, and the legends of cavalry horses or guard dogs. The page notes the cemetery was closed during construction of the viaduct that towers over it; a reviewer should confirm access now. "Dogs and cats" is a child-friendly gloss of "loyal animals".
