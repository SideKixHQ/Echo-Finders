teaser: "The maker hid his name where nobody would look."
script: |
  Look at the fence on this corner. Look closely. Those are not plain iron bars. They are cornstalks, made of iron.

  Here is a puzzle. Who made it? For a long time, you could walk past this fence every day and never find out.

  The house was built just before the Civil War for Colonel Robert Short. People called him the Blue Grass Colonel, because he came from Kentucky.

  By nineteen fifty, the fence was falling apart. So the owner did something clever. He took part of the fence away from the Prytania Street side, and used the pieces to mend the front. Where the missing fence had been, he built a brick wall.

  And when the workers uncovered the bottoms of the posts, there it was. A name. Wood and Miltenberger, who sold iron for a famous foundry in Philadelphia.

  Now walk a few steps along the Prytania Street side, and look for the brick wall. That is where the borrowed pieces came from. There is only one other fence like this in the city, on Royal Street, in the French Quarter.

  This corn grew in Philadelphia.
detail: >-
  The Historic American Buildings Survey record (1965) dates the house from 1859 to 1866 and names the architect as Henry Howard. The foundry name was found when the fence posts were exposed during repairs after 1950. The house is a private residence; the fence is seen from the public sidewalk.
