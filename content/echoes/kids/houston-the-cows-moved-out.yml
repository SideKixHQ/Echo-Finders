teaser: "Before the astronauts came, the neighbors here said moo."
script: |
  Look around at the big flat land out here, by Clear Lake. Rockets, spacecraft, astronauts.

  Now imagine cows. Lots of cows.

  Not very long ago, this was a ranch. Texas cattle grazed right across it. There were rice fields nearby, and oil derricks, ducks, a few alligators, and lots of mosquitoes.

  Then, in nineteen sixty one, the country decided to go to the Moon. And it needed a place to plan the trip.

  An oil company had given a big piece of ranch land to Rice University. Rice offered it to the space program. A thousand acres.

  On the nineteenth of September, nineteen sixty one, it was announced. This would be the command center for landing people on the Moon.

  So the cows were herded out, to make room for spacecraft, astronauts and engineers. Thousands of people and their families moved in.

  Eight years later, people walked on the Moon, and talked to Houston the whole way.

  Look out at the open grass. Can you picture the cows?

  They were here first.

