script: |
  Paul Hill made a dog for Bijou Park, but this dog does not need food, water, or a nap.
  It is a sculpture called Straining to Be.

  The tourism authority describes its materials as Corten steel and found objects. Things
  made for other purposes became part of an animal's shape.

  Stand back and look at the outline. What makes you recognize a dog before you examine
  every detail? Then look for the parts the artist used to suggest that shape.

  The real story is a person's choice to turn material into something viewers can
  recognize. No imaginary dog adventure is needed. The sculpture gives an ordinary park a
  playful surprise, and it gives you a challenge: discover how an artist made a familiar
  creature from things that were never alive.
