teaser: "Somewhere near this trail, a plant might be waiting for its lunch."
script: |
  Here is a challenge. Somewhere near this trail, there might be a plant that eats bugs.
  Can you spot it?

  It is called a Venus flytrap, and it is tiny, often no bigger than a quarter. Look low, near
  the ground, where the land is open, sunny and sandy.

  Each trap is a leaf that works like a little green bear trap, with tiny hairs inside. When a
  bug brushes those hairs more than once, snap! The trap shuts in less than a second. Then the
  plant slowly digests its dinner, and later the trap opens again.

  Wild flytraps grow in only a small area around Wilmington. That makes this one of the only
  places on Earth where you can see them. Look all you like, but never dig them up. They belong
  here.
