teaser: "Bells for waking, bells for lunch, and fishing in the water ditch."
script: |
  Look around this big square inside the mission walls. Families lived here, in their own quarters. Three hundred and fifty people once lived in eighty-four little two-room apartments.

  Their day was planned from start to finish, and bells told everyone what to do. The church bells rang three times a day.

  After the sunrise church service, breakfast was corn porridge called atole, and dried meat called charque.

  Then the men and boys went to work in the fields. The women and girls cooked, swept the dirt floors, and got wool ready for spinning. They even went fishing in the irrigation ditch outside the walls.

  At noon the bells rang again. Lunch was the biggest meal. Maybe a bowl of goat stew, with fresh tortillas. After lunch came a long rest, called a siesta.

  And in the evening there was singing, games, dancing and stories.

  Then at sunrise, the bells started the whole day over again.
