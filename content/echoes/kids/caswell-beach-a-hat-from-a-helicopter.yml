teaser: "How do you put the top on a lighthouse? You fly it there."
script: |
  Look all the way up to the very top of the lighthouse. See the little room with windows, where the light lives? A helicopter put it there.

  Two Marine Corps helicopters lifted that top piece and held it up in the air over the tower. The wind was strong, so they had to wiggle it around. Then they lowered it into place, and a builder fastened it down.

  Inside, there is something different too. Most old lighthouses have a twisty spiral staircase. This one has ladders, like on a ship. One hundred and thirty-four steps, all the way up.

  And the lights up top get so hot that workers have to wear protective clothing in the light room.

  A helicopter for a hat, and ladders for stairs. This lighthouse does things its own way.
