teaser: "A theater called the Bijou once stood on Front Street. Can you find what it left behind?"
script: |
  Long ago, a theater called the Bijou stood on Front Street. The building is gone now,
  but this little park still carries its name.

  People who study old buildings wrote down a six-sided tile panel set in the sidewalk
  here. It marked the theater's front door.

  Stand on the open path and imagine people lining up for a show. They could not guess
  their theater would someday become a park.

  Now look around for a dog on a leash. It is not a real dog. It is made of steel and
  found objects. Artist Paul Hill made it, and it is called Straining to Be.

  A small piece of tile can help a big story survive. The theater disappeared, but the
  park keeps its name right on Front Street.
