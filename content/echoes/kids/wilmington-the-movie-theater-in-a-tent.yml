script: |
  Would you go to the movies inside a tent? Wilmington's Bijou began that way in 1906,
  with folding chairs for its audience.

  Later, a permanent theater took its place. The theater itself is gone now, but this park
  remembers it, including preserved tiles from the old building.

  Stand on the open path and imagine choosing a chair before a show. The people coming
  here were discovering a new kind of entertainment, not visiting an old landmark.

  Now you can visit the place where they gathered. Look for the name Bijou among the
  preserved features, without touching them. A small piece of lettering can help a big
  story survive. The screen disappeared, but the park keeps a reminder of Wilmington's
  early moviegoing days right on Front Street.
