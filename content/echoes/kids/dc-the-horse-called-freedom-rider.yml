teaser: "This carousel used to be somewhere else, and not every child could ride it."
script: |
  Look at the painted horses going round and round. Bright colours, music, children waving. It looks like it has always been here.

  But it has not. This carousel used to stand in an amusement park outside Baltimore, called Gwynn Oak. And for years, only white children were allowed to ride it.

  People thought that was wrong. Black and white grown ups protested at the park, again and again, for years. Some were arrested.

  At last, the park opened to everyone. The day it happened was the twenty eighth of August, nineteen sixty three. On the very same day, here in Washington, Dr. Martin Luther King gave his I Have a Dream speech.

  And at Gwynn Oak, the first Black child to ride this carousel climbed on. Her name was Sharon Langley. She was eleven months old.

  Many years later, she wrote a children's book about it. And in twenty twenty six, when the carousel opened again here after being fixed up, Sharon rode it again. Her horse has a name. Freedom Rider.

  So pick a horse. Hold on tight.

  Every child gets a turn now.
detail: >-
  Told for children. Sharon Langley is living and public in this story (she co-wrote a children's book about it and spoke to NPR at the 2026 reopening). The protests and arrests at Gwynn Oak are from NPR's report and its 1963 photograph caption.
