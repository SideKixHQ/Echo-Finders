teaser: "When the engine broke down, the story goes, they put up sails."
script: |
  Look up Elysian Fields Avenue, away from the river. It runs wide and straight, as far as you can see.

  Here is why. A railroad used to run right up the middle of it.

  It was called the Pontchartrain Railroad, and it was one of the first railroads in all of America. It ran four and a half miles, from the river out to a little town on Lake Pontchartrain called Milneburg.

  The men in charge had hardly ever seen a railroad. They could not decide whether the rails should be made of iron or of cedar wood. And in eighteen thirty one, when the very first train ran, it was pulled by horses!

  Then a man named Thomas Shields shipped a little steam engine down the river from Cincinnati to try it out. It was not strong enough. Poor Shields had spent all his money on it, and he could not even pay his hotel bill. So the railroad's boss, Captain John Grant, bought it for a thousand dollars, and used it to turn a grindstone in the workshop.

  The iron rails had a bad habit. Sometimes a strip of iron would spring loose and poke right up through the floor of a car. People called them snake heads.

  And there is a story, just a story, that when the little engine broke down, the crew would put up sails, and sail the train home.

  Look up the avenue again. Picture a little train out there in the middle, with its sails flapping in the breeze.

  Next stop, the lake.
detail: >-
  The 1938 New Orleans City Guide dates the first train to 1831; the 1885 Historical Sketch Book says the line opened in 1830 and calls it the first railroad for general transportation completed in the United States. The sails are reported only as hearsay. The line later became part of the Louisville and Nashville railroad, and its long time nickname was Smoky Mary.
