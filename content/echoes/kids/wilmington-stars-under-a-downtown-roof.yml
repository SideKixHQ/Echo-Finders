script: |
  Wilmington's new downtown museum opened in August 2026 with a sixty-seat planetarium.
  Inside, a presentation can help visitors explore the sky while sitting under a roof.

  The images are a way of learning, not actual stars brought indoors. Real stars are much
  farther away than any building in the city.

  If you are attending an authorized program, settle into your seat and let the
  presentation guide your eyes. What becomes easier to notice when the view is arranged
  for learning?

  The planetarium joins science with storytelling. It can help turn distant things into
  questions you can investigate. When you leave, the real sky is still outside, and the
  downtown streets are still around you. A visit can make that familiar walk feel
  connected with a much larger world.
