teaser: "Look at the top of the gateposts. What fruit is that?"
script: |
  Look up at the very top of the tall gateposts. Sitting up there are two white stone fruits. What do they look like? Pineapples?

  Everyone thinks so. But an old guidebook to South Carolina says they are not.

  They are pine cones. The fruit of an Italian pine tree, carved in white marble and brought from Italy. In Italy, it said, they stand for peace, good will, and a warm welcome.

  So when you see them, the house is saying hello.
detail: >-
  The 1941 Federal Writers' Project guide describes the wood and iron gates of 14 Legare Street, their cypress and iron scrollwork, and the white marble ornaments from Italy that resemble pineapples but are believed to represent the edible fruit of an Italian pine tree, Yuletide symbols of peace, good will and hospitality. The guide says "believed", so the script attributes it to the guidebook.
