teaser: "Way up on the tower, someone from a galaxy far, far away is looking down."
script: |
  Look way up the tall stone tower, at the northwest corner of the cathedral. Up near the top, among all the carved stone creatures, there is one you might know. A shiny helmet. A mask.

  It is Darth Vader.

  He has lots of neighbours up there. A dragon, a wild boar, a turtle, Medusa with her snaky hair. About twelve hundred creatures live on this roof.

  Most people call them all gargoyles. But here is a secret. A real gargoyle has a job. It is a drain pipe. Rain runs through it and spits out of its mouth, away from the walls. The word gargoyle even comes from an old French word, for gargle.

  Can Darth Vader spit water? No. So he is not a gargoyle. A creature that looks scary but cannot spit is called a grotesque.

  In twenty eleven, an earthquake shook this cathedral, and carved stone fell from the central tower. So many people called to ask about Darth Vader that the head stonemason had to tell them. Do not worry. Darth is just fine.

  Look up and find him again.

  Can you make your best Darth Vader breathing?
detail: >-
  Told for children. The CBS piece and NPR's 2007 centennial report both place Vader high on the cathedral, NPR on the northwest tower. The script does not say who designed him, because no reachable source did.
