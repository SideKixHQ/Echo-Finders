teaser: "Horses used to live in here. Then the Girl Scouts moved in."
script: |
  Find the two storey building on this corner of Charlton and Drayton. Look at its doors. It was not built for people.

  It was built for horses and carriages.

  It belonged to the big house next door, the home of a woman named Juliette Low. In March, nineteen twelve, in the drawing room of that house, she started the very first troop of Girl Scouts.

  The girls needed somewhere to meet. And Juliette Low had a carriage house.

  When she died, she left it to the Girl Scouts. By the nineteen thirties it was their headquarters in Savannah, a clubhouse where the carriages used to be.

  Look at the building again.

  The Girl Scouts' clubhouse started out as a garage for horses.
detail: >-
  The 1937 guide: "In March 1912 Mrs. Low, in the drawing room of this house, founded the first troop of Girl Scouts" (the Low House, 329 Abercorn), and "SAVANNAH HEADQUARTERS OF THE GIRL SCOUTS OF AMERICA, 330 Drayton St., on the NE. corner of Charlton and Drayton Sts., is a two-story building which was formerly the carriage house of the Low residence. This was bequeathed by Mrs. Low to the Girl Scouts, and has since been used as their local headquarters." "The girls needed somewhere to meet" is the narrator's bridge, not a claim.
