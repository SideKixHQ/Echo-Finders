teaser: "A telegram you could never fold."
script: |
  Imagine this. Cannons booming. Whistles blowing. Bells ringing. Thousands of people cheering.

  It all happened here, in January nineteen twelve, on the morning the first passenger train arrived in Key West.

  Before that, this island was cut off from the mainland. Then Henry Flagler built a railroad that leaped from island to island, all the way to Key West.

  When the trains came in, children sang songs, and threw flowers in front of the parade.

  And the railroad workers gave Mister Flagler a present. A telegram. But not on paper. It was made of gold, exactly the size of a telegraph form, and a sixteenth of an inch thick. It came in a box of solid gold.

  Imagine getting a letter you could never fold.
detail: >-
  From the New York Sun of 23 January 1912 (Key West dispatch of the 22nd): cannon, whistles and bells, thousands cheering, the island city bound to the mainland by Flagler's oversea railroad, the first passenger train arriving that morning, children singing patriotic songs and throwing flowers in the path of the parade, and the gold telegram, the exact size of a telegraph blank and a sixteenth of an inch thick. The OCR gives a number of children that cannot be read ("tine thousand"), so the script gives none. The Daytona Daily News of 23 January 1912 independently describes the testimonial from the Florida East Coast railroad's employees as engraved on a plate of gold in a casket of solid 18 karat gold. "Leaped from island to island" is from the HALS record of the Overseas Highway, which carried trains until 1935. Where the trains stopped (Trumbo Point) is in the header only.
