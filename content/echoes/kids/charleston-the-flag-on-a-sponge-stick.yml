teaser: "The flag fell down. Somebody had to go and get it."
script: |
  Find the flagpole and look up at the flag. Now imagine it falling down, right in the middle of a battle.

  That is what happened here, in seventeen seventy six. British ships were firing at the fort, and one shot broke the flagstaff. Down came the flag, over the wall, onto the sand outside.

  On the ships, the sailors cheered. They thought the fort had given up.

  But a soldier named Sergeant William Jasper did not think so. He jumped down from the wall, with cannonballs flying, and grabbed the flag.

  He had no flagpole. So he used what he had. A sponge rod, the long stick the gunners used to clean out their cannon. He tied the flag to it, climbed back up, and stuck it on the wall where everybody could see it.

  The flag was up again. And the fort did not give up.

  Afterwards, the leader of South Carolina gave Jasper his own sword. He offered to make him an officer too. Jasper said no thank you.

  Look up at the flag again. Nobody needed a proper pole.

  Just a sergeant, and a stick.
detail: >-
  Ravenel (1906) says Jasper leapt down from the wall, tore the flag from the broken staff and fastened it to a sponge rod. The National Park Service says President John Rutledge gave him his own sword and offered him a commission, which he declined.
