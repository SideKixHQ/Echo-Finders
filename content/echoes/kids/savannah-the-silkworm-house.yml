teaser: "A house full of worms, and then a President on the dance floor."
script: |
  Look across Reynolds Square, to the buildings on its east side. Long ago, a plain wooden building stood over there, and upstairs it was full of silkworm cocoons.

  Georgia was supposed to be a silk colony. Around the town grew acres and acres of mulberry trees, because mulberry leaves are what silkworms eat. There was even a law about it. To be elected, a man had to have one hundred mulberry trees planted and fenced on his land. Later, someone in his family had to know how to reel silk, too.

  Early on, the colonists sent their silk to England. Queen Caroline had it woven into a dress, and wore it at court. A queen, in a dress made by Savannah worms.

  In seventeen fifty one, the colony built the Filature right here, a building just for silk. One year, more than a thousand pounds of raw silk came through its doors. The next year it burned down, with more than seven thousand pounds of cocoons inside.

  They built it again. But the silk never really worked. So the silk house became something else. A dance hall. When George Washington came to Savannah, they held a ball for him in the Filature, and he was introduced to ninety six ladies.

  Look at the east side of the square again.

  It was built for silkworms. It ended up full of dancers.
detail: >-
  Wilson (1889) places the Filature on the east side of Reynolds Square, where Cassell's Row later stood, describes the 1751 building and the 1758 fire, and prints the account of the 1791 ball for Washington. The 1937 Federal Writers' Project guide gives the 1735 silk for Queen Caroline's dress. Why silkworms need mulberry leaves is general knowledge, not from these sources.
