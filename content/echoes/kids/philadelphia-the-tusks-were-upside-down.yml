teaser: "A monster nobody had ever seen, put together like a puzzle."
script: |
  Look at the small brick building here, beside Independence Square. A long time ago, there was a monster inside it. A skeleton eleven feet tall at the shoulder.

  Its bones came out of a muddy pit on a farm in New York, in eighteen oh one. A painter called Charles Willson Peale went to dig them up, with pumps, and ropes, and pulleys. Back here, his team had a giant puzzle. Put together an animal that nobody had ever seen alive. People called it the great American incognitum. That means the unknown.

  One of the best puzzle solvers was Moses Williams, an enslaved man who was also a talented artist. Peale said Williams tried the pieces in the most unlikely positions, and did more good that way than anyone. Where bones were missing, they carved new ones out of wood.

  But they made one big mistake. They put the tusks in upside down, curling downward, like a walrus. They thought the animal ate meat, and they wanted it to look fierce. On Christmas Eve, eighteen oh one, the monster was ready. To tell the city, Moses Williams rode through the streets on a white horse, in a feathered headdress, with a trumpeter beside him.

  So where is the monster now? Not here. It was shipped across the ocean, and it stands in a museum in Darmstadt, in Germany, to this day.

  If you ever go and see it, check the tusks.
