teaser: "Nine ships, one pirate, and a very strange demand."
script: |
  Look out at the harbour, toward the sea. Now imagine nine ships out there, near the sandbar, and every one of them captured by the same pirate.

  His name was Blackbeard. In seventeen eighteen, he sat outside this harbour, and no ship dared to sail out. Then his men rowed a boat right up to the town, with a message. It was a very strange message.

  Blackbeard did not ask the town for gold. He asked for medicine. A whole chest of it. And if the town said no, he said, the prisoners would lose their heads.

  One of those prisoners was a little boy named William Wragg, on a ship bound for England with his father. While the grown ups in town argued, the pirates' boat got stuck on the way back, and the medicine was late. Blackbeard grew impatient, and the prisoners were terrified.

  At last, the chest arrived. Blackbeard took everything the prisoners had, even most of their clothes, and sent them ashore almost naked. But he let them go.

  Look at the harbour again. Out there, a little boy and his father got to come home.

  Even pirates get sick.
detail: >-
  Ravenel (1906) gives the demand as medicines on pain of the heads of Samuel Wragg, his little son and other prisoners; Johnson's General History (1724) names the demand as a chest of medicines, valued at between 300 and 400 pounds, and says the prisoners and ships were released; Ravenel says they were sent on shore almost naked.
