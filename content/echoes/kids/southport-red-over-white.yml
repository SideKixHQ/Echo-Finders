teaser: "Before phones, how did anyone tell a sailor a storm was coming?"
script: |
  Here is a puzzle from the days before phones. Imagine you are a sailor out on that river, and a big storm is on its way. How could anybody on land warn you?

  They used a tall tower, right here by the water, and they used flags.

  When a strong wind called a gale was coming, two red flags went up.

  But at night, you cannot see a flag. So the tower had lights too. Each tower had three of them, two red and one white.

  A red light over a white light meant the same as the two red flags. Gale coming. Head for safety.

  A lady named Jessie Taylor raised the flags here for more than sixty years.

  So if you were a sailor, you kept one eye on this corner. Red over white meant it was time to go home.
