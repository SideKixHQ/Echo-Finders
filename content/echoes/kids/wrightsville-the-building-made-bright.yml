teaser: "A building so bright that ships could steer by it."
script: |
  Stay beside your grownup on the sidewalk and look around. Near here, long ago, stood a building
  that glowed.

  It was called Lumina, and it opened in 1905. More than a thousand light bulbs lit it up. It was so
  bright that ships could find their way by it, and people nicknamed it The Palace of Light.

  People went bowling downstairs and danced in a ballroom upstairs. They even watched movies on a
  big screen out over the waves!

  Lumina was taken down in 1973. Now close your eyes and switch it back on. How many lights can you
  count?
