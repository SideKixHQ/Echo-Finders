teaser: "Count its sides. Most lighthouses are round."
script: |
  Look up at the lighthouse and count its sides. One, two, three. Most lighthouses are round. This one is a triangle.

  It was built that way on purpose. A triangle of steel and aluminium can stand up to winds of a hundred and twenty five miles an hour. In nineteen eighty nine, a huge hurricane called Hugo hit this coast. The lighthouse stayed standing.

  And here is a secret. It has an elevator inside. A lift, to carry people up. After that, there is still a ladder to climb at the top.

  When it was new, the lighthouse was painted red orange and white. The people who lived on the island did not like it. They complained. So it was painted black and white instead.

  It flashes twice every thirty seconds, so ships can tell it from every other light on the coast.

  Look up again. It was the last big lighthouse ever built in the whole United States.

  The last one got a lift.
detail: >-
  All facts are from the National Park Service page on the Charleston Light: dedicated 15 June 1962, triangular steel and aluminium alloy, rated for 125 mile an hour winds, survived Hurricane Hugo in 1989, a service elevator and a 35 foot ladder to the lantern room, repainted from red orange and white after residents complained, two flashes each 30 seconds, and the last major lighthouse built in the United States.
