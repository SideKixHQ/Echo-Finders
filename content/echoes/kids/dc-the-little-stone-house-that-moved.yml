teaser: "This little stone house walked all the way here from the Capitol. Sort of."
script: |
  Find the little stone house on the corner. It is not much bigger than a garden shed. Who do you think lived in it?

  Nobody lived in it. It was a gatehouse, a guard post. About two hundred years ago, it stood by the gates of the United States Capitol, up the hill at the other end of the Mall. Guards kept watch from little houses like this one.

  In eighteen seventy four, it was taken away from the Capitol. Years later, somebody took this one apart, stone by stone, and put it back together, right here. There is a twin, just like it, two blocks along at Seventeenth Street.

  Now, a puzzle. Walk around to the side that faces the river. Look for marks on the stone.

  Those marks show how high the water came, when floods poured over this part of the city. Higher than your head? Higher than a grown up's?

  This little house has been a guard post, and a pile of stones, and a measuring stick for floods.

  Not bad for a shed.
detail: >-
  The Park Service says the gatehouse was built about 1828, stood at the Capitol until 1874, and was reconstructed here with its twin in 1889, and that "on the southeast side are markers indicating the high-water marks during floods". The script asks children to look, without saying how high the marks are, because the source does not say. "Up the hill" and "two blocks along" are the narrator's description of the Mall and the twin at 17th Street.
