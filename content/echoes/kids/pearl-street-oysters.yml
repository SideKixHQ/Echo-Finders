teaser: Why is it called Pearl Street?
script: |
  You are standing on a street named after a rubbish heap.

  Look at the name. Pearl Street. The Dutch called it Paerlstraat, and it was named after a shell midden. That is a giant pile of oyster shells that people had thrown away. Later, the street itself was paved with oyster shells.

  Oysters have lived in the water around this island for about ten thousand years. The Lenape people, who lived here first, ate so many that they left huge piles of shells all over the area.

  When New York grew, oysters were cheap, so everybody ate them. Not just in restaurants. Oyster carts lined the streets, the way you might buy a hot dog now.

  By 1880 the city was farming about seven hundred million oysters.

  And there is something else. The Dutch were disappointed with these oysters at first, because they do not make pearls. So, despite its name, Pearl Street was never about pearls.

