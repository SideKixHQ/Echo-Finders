teaser: "His prison photo makes him look guilty."
script: |
  Look up at this enormous stone wall. It looks like a castle. But it was a prison. And on the twelfth of August, nineteen twenty four, a new prisoner came through the gate.

  He was a black Labrador. His name was Pep.

  For years, people told a story about Pep. They said he had done something terrible. He had killed a cat. And not just any cat. The cat belonged to the wife of the Governor of Pennsylvania! So the governor sentenced Pep to life in prison, with no chance of getting out.

  And there is something odd in the prison's records. Pep is in there. And the prisoner number next to his, C 2559, is skipped in the book where new prisoners were written down. Did Pep get a number, like everyone else?

  In his prison photo, Pep has his head down and his ears back. He looks a little bit guilty.

  But then a man who used to work at the prison went looking. He found old letters, from nineteen twenty four. The governor had read that another state had given its prison a dog. He wanted to do the same. And the warden wrote back that a dog would be a good addition.

  So Pep was not a cat murderer at all. He was a present.

  Look at the wall again. All kinds of prisoners came through that gate.

  Only one of them was a good boy.
