teaser: "Nobody anywhere had ever seen a dinosaur standing up."
script: |
  Look at the big museum in front of you. Its name is the Academy of Natural Sciences. And it is famous for one thing above all. Dinosaurs.

  Long ago, in eighteen fifty eight, some enormous bones were dug up on a farm in Haddonfield, New Jersey, just across the river. They belonged to a dinosaur with a very long name. Hadrosaurus foulkii. It was the first nearly complete dinosaur skeleton ever found, anywhere in the world.

  The bones came to the Academy. And in eighteen sixty eight, the Academy did something nobody had ever done. It put the dinosaur's skeleton together and stood it up, so people could see how big it really was.

  It was the first mounted dinosaur skeleton anyone had ever seen. There were lines outside the door, going all the way around the block. So many people came, the museum had to start charging money to get in.

  For more than a hundred and fifty years after that, children came to this museum to stand under dinosaurs. This October, after nearly two hundred years, the museum closed its doors. Lots of people are trying to save it.

  Look at the doors. The very first dinosaur anyone ever saw standing up was shown by this museum.

  Maybe one day, the lines will come back.
