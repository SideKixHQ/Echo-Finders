teaser: "Imagine walking through the park and finding a giant copper arm, holding a torch, with no lady attached."
script: |
  Look around this park. Trees, paths, dogs, a burger stand. Now imagine walking through here, a long time ago, and finding a giant arm.

  Just an arm, made of copper, holding up a torch. And no body.

  This really happened.

  The arm belonged to the Statue of Liberty. The artist who made her, Bartholdi, worked in France, and he built her in pieces. The hand with the torch was finished first. So they sent it across the ocean, all by itself.

  First it went to a big fair in Philadelphia. Then it came here, to Madison Square. And it stayed. From eighteen seventy six, all the way to eighteen eighty two.

  Why so long? Money. France was paying for the statue. Americans had to pay for the giant stone base she stands on. While the arm stood here, Americans were raising that money, slowly.

  In eighteen eighty five, the rest of her finally sailed across the ocean, in pieces, on a French navy ship.

  Today she stands out in the harbor, holding that same torch up high.

  Once upon a time, it stood right here in the park.

