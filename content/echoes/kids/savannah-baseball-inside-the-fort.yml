teaser: "A fort with walls taller than a house, a moat with alligators, and a ball game in the middle."
script: |
  Stand on the grass in the middle of the fort. Turn all the way around. Brick walls on every side, and arched rooms all along the bottom.

  This grass has a name. It is called the parade ground. And soldiers played ball on it.

  To get in here, you crossed the moat. It is eight feet deep, deeper than a grown up is tall. It was dug by enslaved workers when the fort was built, and the fort took eighteen years to finish. Rangers say you might see an alligator in it, so give it plenty of room.

  In here, soldiers lined up for inspections and practised with their weapons. The arched rooms were for cannons, and for sleeping.

  And when the drilling was done, and the days were long, the soldiers played baseball, right on this grass, inside the walls.

  In the nineteen thirties a visitor saw a giant fig tree growing here, nearly as tall as the walls.

  Look around at the walls again. Then look at the grass.

  The strongest fort on the river, and inside it, a ball game.
detail: >-
  The junior ranger handbook gives the moat's depth, who dug it, the eighteen years, the parade ground's use, the casemates, the alligators and the baseball. The fig tree is from the 1937 guide; whether a fig still grows on the parade ground should be checked before review. The handbook does not say which soldiers played baseball or when; the script does not say either.
