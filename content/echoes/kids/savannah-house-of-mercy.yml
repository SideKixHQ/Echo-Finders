script: |
  Look around this place, at the chapel and the old trees. Children have lived here for nearly three hundred years.

  And twice, it was almost wiped out.

  In seventeen forty, a famous preacher named George Whitefield started a home here for children who had no parents. He called it Bethesda. It means House of Mercy.

  When Whitefield died, he left the home to his friend in England, Lady Huntingdon. Soon after, lightning struck, and all the buildings burned. She paid to build them again.

  Years later, in eighteen oh five, fire and a hurricane destroyed it a second time.

  But the children's home did not give up. People brought it back again. By the nineteen thirties, a Savannah guidebook called it the oldest orphanage still running in America. Its chapel today is named for Whitefield.

  Look at the chapel again.

  Lightning, fire and a hurricane. And it is still a house of mercy.
detail: >-
  The 1937 guide: founded in 1740 by Whitefield; "Bethesda, meaning 'House of Mercy'"; willed to Selina, Countess of Huntingdon; "the buildings were completely destroyed by lightning"; rebuilt from her means; "In 1805 the school was again destroyed by fire and hurricane"; "the oldest existing orphanage in America". Wilson (1889) independently gives the lightning and Lady Huntingdon's rebuilding. HABS (Whitefield Chapel) gives the 1740 founding with James Habersham and the chapel, built 1916 to 1925 in Whitefield's memory. The guide also records that the property was sold off after 1805 and the boys cared for by the Union Society; "people brought it back again" compresses that, and the reopening should be dated from a source before review.
