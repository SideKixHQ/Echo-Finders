teaser: "The whole zoo started with one big, shaggy animal called Earl."
script: |
  Somewhere past these trees is the Houston Zoo. Hundreds and hundreds of animals.

  It started with just one.

  In nineteen twenty, the United States government had too many bison in its national parks. So it gave some away. One of them came to Houston.

  The city put him in a little park downtown, and gave him a name. Earl.

  Earl needed company. The city bought him a girl bison from a herd in west Texas, but sadly she did not live long. So his next friend was a deer, given by a fishing club.

  Then more animals came. Strange pets. Gifts. A lion, bought from a circus.

  On the first of December, nineteen twenty four, the zoo officially opened. By the next year it had moved here, to Hermann Park, with more than four hundred animals, three hundred birds and a hundred reptiles.

  And their dinner? Everything from meat to dried flies.

  So when you walk past the animals today, say thank you to the very first one.

  Thank you, Earl.

