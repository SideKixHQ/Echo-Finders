script: |
  The museum's big model layout takes you into the early 1950s, when steam locomotives and
  diesel trains shared the railroad world.

  Its builders used coastal North Carolina history to create towns, tracks, industries,
  and moving trains. Parts of Wilmington are represented in miniature.

  Find a safe place beside the layout and look closely. A model is not the actual town
  shrunk by magic. People chose what to include and built the pieces to help tell a story.

  Try following a train with your eyes. Where does it go, and what does it pass? Then
  look at the tiny buildings around it. The train needs the town, and the town needs
  connections. This small world helps you notice relationships that can be harder to see
  when you are standing inside the real city.
