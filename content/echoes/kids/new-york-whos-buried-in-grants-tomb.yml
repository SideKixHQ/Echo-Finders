teaser: "A riddle with a trick answer. Want to hear it?"
script: |
  Look up at the giant stone building in front of you, with the round roof and the big columns. Find the words carved above the door. Let us have peace.

  Here is a riddle grown ups love. Who is buried in Grant's Tomb?

  Easy, you say. Grant. Ulysses S. Grant, the general who won the Civil War, and then became President.

  Wrong. Well, sort of.

  Go inside, under the dome, and look over the railing into the room below. You will see two huge stone boxes. One is General Grant. The other is his wife, Julia.

  Buried means put under the ground. And they are not under the ground. They are resting in the room, above it.

  So who is buried in Grant's Tomb? Nobody.

  Here is the other surprise. About ninety thousand people sent money to build this. It is the biggest tomb of its kind in North America. And when it opened, more than a million people came to the party.

  Now you know the trick.

  Go and try it on somebody.

