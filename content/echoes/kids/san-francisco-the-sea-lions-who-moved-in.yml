teaser: "Nobody invited them. They came anyway, and stayed."
script: |
  Listen. Can you hear barking? Look down at the floating docks beside the pier. Those big brown heaps are sea lions!

  These docks were built for boats. Then, in nineteen ninety, a few dozen sea lions climbed on. Nobody invited them.

  More and more came. The harbourmaster, who looks after the docks, remembers when there were fourteen hundred of them. A seething mass, she said, of sea lion noise, and smell.

  But people loved them. Millions have come to watch. The city even gave them a holiday: Sea Lion Day, on the sixteenth of January.

  In spring, they feast on anchovies and herring, to get ready for the mating season. Then many of them head south, to islands off Southern California.

  Mostly, though, they just lie in the sun. One visitor said: I want some entertainment from them, and they've got nothing.

  Watch for a minute. Which one is the laziest?
detail: >-
  CBS News (2004): Pier 39 home to some 1,500 sea lions, up from the few dozen that moved in in 1990. CBS News (2020): thirty years since sea lions invaded the boat docks of Pier 39, harbormaster Sheila Chandor and her 1,400 animals, "millions" of visitors, Sea Lion Day on 16 January, and the tourist's line about entertainment. NPR (2024): anchovies and herring, fuelling up for the mating season, the Channel Islands. CBS 2004 and 2020 are one publisher; NPR is independent. Other accounts date the first arrivals to late 1989, after the Loma Prieta earthquake; the CBS figure of 1990 is used.
