script: |
  The museum lists a Liberty Bell salvaged from the Brunswick River Reserve Fleet among
  its displays.

  It is not the famous cracked bell from history books. The similar name belongs to a
  different object with a different story.

  Stand where you can see the display with your grown-up. Read the label before making
  guesses. That is a great trick for exploring a museum: let the object surprise
  you, then use the information nearby to learn what it really is.

  This bell connects the museum with ships once gathered in the river fleet. An object can
  leave its old setting and still help us remember it. Here, something associated with
  the water has come indoors, where you can stop, look closely, and ask how it reached
  this new home.
