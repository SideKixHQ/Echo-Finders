teaser: "Imagine a lighthouse built out of trees."
script: |
  Look up at the lighthouse. Now imagine it made of wood.

  The very first tower on this island was not brick. It was pine.

  When Savannah was brand new, General Oglethorpe had a problem. From out at sea, this whole coast looked the same, mile after mile of low land and trees. A sailor could not tell where the river was.

  So he ordered a tower. Ninety feet high. Twenty five feet wide at the bottom and ten feet wide at the top, built of the best pine, standing on posts of cedar. He wrote that it would be of good service to all shipping, because the land of all the coast is so alike that a distinguishing mark is of great consequence.

  A distinguishing mark. A thing that looks different, so you know where you are.

  The wooden tower did not last. Over the years it fell into ruin, and new towers took its place.

  Look up again.

  The first job of a lighthouse here was not to shine. It was just to stand out.
detail: >-
  Wilson (1889) quotes Oglethorpe's specification and his reason, dates the beacon to 1733 "under Oglethorpe's direction", and says it fell into ruin and was replaced by a lighthouse built by the federal government. The NPS Tybee page says Oglethorpe ordered a lighthouse in 1736; the script gives no year. Neither source says whether the first tower carried a light; the landing says only that its first job was to stand out, which is Oglethorpe's stated purpose.
