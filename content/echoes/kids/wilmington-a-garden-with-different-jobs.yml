script: |
  These gardens have different parts with different jobs. The museum identifies an
  orchard, a kitchen garden, a rose garden, and an area recalling the historical use of
  medicinal herbs.

  People planted useful things as well as beautiful things. A garden could help supply a
  household, while another part offered a pleasant place to look and walk.

  Stay on the paths with your grown-up. Do not pick or taste anything; a historical garden
  is a place to explore with your eyes.

  Try spotting the difference between a plant grown for its shape and an area arranged for
  a practical purpose. The present gardens were designed to help visitors think about an
  earlier period. Their story shows that outdoor space, like a house, can contain several
  kinds of work.
