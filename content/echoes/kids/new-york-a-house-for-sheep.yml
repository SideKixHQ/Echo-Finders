teaser: "Guess who lived in this restaurant before the people came."
script: |
  Look at the building in front of you, with its windows full of lights. People come here for fancy dinners. Birthdays. Weddings.

  But it was not built for people.

  It was built for sheep.

  Back in eighteen seventy, Central Park had its own flock. A kind called Southdown sheep. And they needed somewhere to sleep at night.

  So the park built them a house. Right here.

  Imagine it. Every evening, a whole flock of sheep trotting in from the grass, past the trees, into this building. The middle of New York City, and the sound of baa.

  And then, in nineteen thirty four, the house for sheep became a restaurant.

  Not far away is a big, wide lawn. It is called the Sheep Meadow.

  Now you know why.

