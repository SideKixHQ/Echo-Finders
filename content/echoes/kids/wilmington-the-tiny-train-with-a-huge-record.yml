script: |
  In April 2011, model railroaders made a very small kind of train do something very big
  inside this convention center.

  They connected thirty-one model locomotives and 1,563 cars. The train stretched more
  than nine hundred feet and completed the run needed for a Guinness world record.

  The event is over; there is no promise that the record train is waiting inside today.
  But this is the building where it happened.

  Look at its size from the public sidewalk. One tiny car would be easy to hold.
  Connecting more than fifteen hundred of them created a problem of teamwork, space, and
  careful movement. The achievement was not just owning lots of pieces. It was making all
  those pieces work together as one astonishing train.
