script: |
  Imagine needing to call home without a phone in your pocket. This museum has a restored
  wartime-era telephone booth with a vintage phone inside.

  The booth gives you a small space where one person could stand or sit and make a call. A
  public telephone was something you went to, rather than something that followed you
  everywhere.

  Look at the phone with your grown-up. It may have parts that seem unfamiliar because the
  way people placed calls has changed.

  The object belongs in a building that welcomed people far from home during the Second
  World War. We cannot say who used this particular phone for every conversation. We can
  understand why a call mattered: a familiar voice could connect someone here with people
  waiting somewhere else.
