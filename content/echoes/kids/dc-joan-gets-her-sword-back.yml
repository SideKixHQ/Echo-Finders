teaser: "Look at her raised hand. For a while, it was empty."
script: |
  Here is a girl on a horse. Look at her raised hand, up high. What is she holding?

  That is Joan of Arc. Hundreds of years ago, as a teenager, she led soldiers into battle in France. And this statue of her is special. In the whole of Washington, there are lots of statues of people riding horses. Only one of them is a woman. This one.

  She came here as a present, from the women of France to the women of America. Her sword was always up in the air, ready to go.

  Then, in September twenty sixteen, somebody stole it.

  For a while, Joan rode into battle with an empty fist.

  So people got to work. A brand new sword was made, and fixed into her hand. In March twenty eighteen, she was ready for battle again.

  Look up at the sword now. Count to three, and raise your own arm, just like hers.

  Now you are both ready.
