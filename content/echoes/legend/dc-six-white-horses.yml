detail: >-
  Told as legend. Spellings differ: the Park Service writes Burnes and Marchia, the 1919 feature Burns and Marcia; the script uses Burns and Marcia. The 1919 feature dates the mansion to 1826 and the Park Service to 1816, so the script gives no year for it. The six horses are from the Evening Star of 1 November 1936, which calls their owner "old John"; the Library of Congress's retelling identifies the bier as John Van Ness's.
