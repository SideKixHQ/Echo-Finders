certaintyNote: >-
  A legend, labelled as one in the script. The house, the family, its decay, its demolition and the surviving stables are history (National Park Service nomination; a 1919 newspaper feature). The candle-carrying ghost of Marcia Van Ness and the six headless horses are folklore as two newspapers told it in 1919 and 1936, and as the Library of Congress retells it. Nothing supernatural is claimed.
