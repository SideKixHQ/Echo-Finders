tags: [washington, foggy-bottom, van-ness, ghosts, latrobe, pan-american-union, lost-washington]
teaser: "A stable with no house. Some say the horses still come back to it."
script: |
  Stand on the corner of Eighteenth and C Streets, and find the small, plain building behind the railings. It is older than anything else on this block. It is a stable.

  A stable needs a house. Look around for it. There is no house.

  There was. A farmer named David Burns once owned much of the land downtown Washington is built on. His daughter, Marcia, married a congressman from New York, John Van Ness. On this block they built a mansion, designed by Benjamin Latrobe. It was long regarded as one of the finest homes in the country.

  Marcia died there. Later in the century the house stood empty, and fell into decay. A newspaper said it was given over to the bat, the owl, and the spider. And, as one might guess, it was said to be haunted.

  This is a legend. Nobody has ever proved a word of it.

  People said Marcia walked the ruin at night, carrying a candle. And they told a stranger story. When John Van Ness died, his funeral bier was drawn by six white horses. Every year after, on the anniversary of his death, the story went, you could hear those horses galloping round the old mansion. White sides heaving. Great tails flying. And no heads. They had buried their heads in the dust, with their master.

  In nineteen oh seven the mansion was pulled down, to make way for the white marble building on this block. Only the stables are still standing.

  So the house is gone, and the lady with the candle went with it.

  The horses kept their stable.
