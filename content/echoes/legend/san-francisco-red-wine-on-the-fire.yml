certaintyNote: >-
  The 1940 Federal Writers' Project guide states as fact that Italians saved Telegraph Hill with wine-soaked blankets; the historian Philip Fradkin, on NPR in 2006, calls it stories of the old-timers. Nobody has shown how much wine was used or whether it made the difference, so the script tells it as a legend.
