teaser: "When the water ran out, the story goes, they used the wine."
script: |
  Look at the little cottages along these steps. In April, nineteen oh six, after the earthquake, the city burned for almost four days.

  These cottages did not. The fire stopped a few hundred feet from where you are.

  Back then, the hill was working class. Irish and Italian immigrants. And this is where the legend begins.

  Many of the Italian families made their own wine, and kept the barrels in their basements. When the fire crept up the hill, the story goes, they rolled the barrels out of their cellars, formed a bucket brigade, and fought the flames with blankets soaked in red wine.

  A guidebook written in nineteen forty tells it as plain fact. A historian, a century later, called it one of the stories the old timers told. Nobody can prove it either way.

  Whatever saved them, the cottages are still here.
detail: >-
  NPR's 2006 Morning Edition piece on the 1906 earthquake: fire for almost four days, Aaron Peskin on the Filbert Steps saying the fire stopped a few hundred feet away, the working class Irish and Italian neighbourhood whose simple cottages were among the few spared, and Philip Fradkin on buckets of saved water, barrels of wine fermenting in basements and "stories of the old-timers". The 1940 Federal Writers' Project guide: the Italians rolled barrels of red wine from their cellars and, forming a bucket brigade, protected their houses with blankets soaked in the wine. Told as a legend because the two sources differ on how sure it is.
