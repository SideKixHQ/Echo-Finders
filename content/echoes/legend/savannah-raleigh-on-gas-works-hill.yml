certaintyNote: >-
  A local tradition printed in the 1910 Illustrated guide to Savannah as "tradition tells us". The National Park Service's account of the 1584 voyage puts it on the Outer Banks, with Raleigh's charter requiring him to stay in England. The script says aloud that it is a legend.
