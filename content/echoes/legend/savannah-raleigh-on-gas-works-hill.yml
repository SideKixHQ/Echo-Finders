tags: [savannah, savannah-core, colonial, legend]
teaser: "Savannah once said its story began here, with Sir Walter Raleigh."
script: |
  You are at the eastern end of the bluff. Hold on to that, because a legend once started the whole story of this city right here.

  In nineteen ten, a Savannah guidebook opened its timeline of the city not with Oglethorpe, but with Sir Walter Raleigh. In fifteen eighty four, it said, tradition tells us, Raleigh landed here, and held a conference with an Indian chief, near what was known as Gas Works Hill.

  The gas-house stood at the eastern end of this bluff, where a Revolutionary fort called Fort Wayne had been.

  It is a legend, and hard to keep. The National Park Service tells the year differently. Raleigh's charter came on condition that he stayed in England. In April fifteen eighty four he sent an expedition instead, and it arrived on the Outer Banks of what is now North Carolina.

  So nobody can say who, if anyone, stood on this hill in fifteen eighty four. But for a while, the city liked its story to start a century and a half before Oglethorpe.
