teaser: "Washington slept here. The legend says the others never did."
script: |
  Look up the slope at the white house with the tall columns. It is the only house in Manhattan older than the Revolution.

  In the autumn of seventeen seventy six, after the disaster on Long Island, George Washington pulled his army back to these heights. And he made this house his headquarters.

  Then the Americans were gone, and the British moved in. For seven years, while they held New York, it was theirs. A general and his officers. And at times, the Hessians.

  In eighteen ten, the house was bought by a rich French merchant, Stephen Jumel.

  And this is where the legend starts.

  The story goes that the Jumels got the house two thousand dollars cheaper. Because everybody knew it was haunted. By Hessian soldiers, still walking the rooms.

  There is no record of that. It is a rumor, and it is two hundred years old.

  Stephen died. The next year, his widow, Eliza, married Aaron Burr, the former Vice President. She lived on in this house until eighteen sixty five.

  And people say she never left either. That she walks the house she bought with her first husband, and cannot find peace.

  Look at the windows on the upper floor.

  Washington slept here. The others, the story goes, are still awake.

