certaintyNote: >-
  Washington's headquarters, the British and Hessian occupation, the Jumels and Burr are in the Landmarks Preservation Commission's designation reports (1967 and 1975). The ghosts, and the story that the Jumels got $2,000 off the price because the house was haunted, are told by the NYC Municipal Archives (2017) as rumor. The archive repeats a further rumor that Eliza Jumel killed her first husband; the script leaves it out as unsupported and unkind. The script says the price story has no record.
