teaser: "It was not built here. Something, they say, came with it."
script: |
  Look at the house at five hundred and seven Saint Julian Street, its windows and its door.

  It was not built here. It was moved.

  A Savannah restoration expert had it brought to this lot and set about bringing it back to life. That is the part that is on record. What follows is a legend, as it was reported.

  As the work began, the workers said they heard odd noises in the house. Some of them said there was someone in there with them. A man, they said, when no man was there.

  Then, while they were working the site, they found a crypt. It was half full of water. They covered it over, and went on.

  The house was finished. In two thousand eleven it was on the market for more than two million dollars. Nobody has proved that anyone but its owners lives in it.

  Look at the windows again.

  A house can be moved across a city. The story is whether it came alone.
detail: >-
