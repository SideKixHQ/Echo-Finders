teaser: "Some of these slate stones, people will tell you, carry British musket marks."
script: |
  Look at the slate headstones on this hill. Some of them, people will tell you, are pitted
  by British musket balls.

  The story goes that redcoats used them for target practice while the army held Boston.

  One stone gets named more than any other. It belongs to a merchant, Captain Daniel Malcom,
  who died in seventeen sixty-nine.

  Listen to what was carved on it. A true son of Liberty. A friend to the public. An enemy to
  oppression. And one of the foremost in opposing the Revenue Acts on America.

  Malcom meant it. One night in seventeen sixty-eight, with friends carrying clubs, he
  brought sixty casks of wine ashore from a ship down the harbour, without paying the King's
  duty.

  So when the soldiers came, the story says, his stone was the one they chose.

  Is it true? Nobody has proved it. A history of Boston's burial grounds from eighteen
  ninety-two put it carefully. Several stones here are said to bear the marks, and Malcom's
  would seem the most likely. The park service today says only that some historians suggest
  it.

  But nobody needed the soldiers to fire.

  The stone had already said exactly what it thought of them.
