teaser: "The old guides said the square had a spirit of its own."
script: |
  Look through the gateway, toward the open square inside the park. Congo Square.

  On Sundays, enslaved people gathered there to dance and drum. That part is history. But by the time the old guidebooks were written, the square had another story laid over it. Treat that as legend.

  A city guide of nineteen-oh-four said that around this square cling wild superstitions, echoes of weird music, and visions of ghostly figures dancing. It said the Voudous believed the square was a charmed spot, which their serpent spirit, the Grand Zombi, had chosen for his favorite haunt.

  Long after the dancing stopped, the guide went on, someone would still now and then leave an offering in the middle of the square at the midnight hour. A roasted bird stuck all over with needles and pins, with coins laid round the dish.

  The city tried to rename the place. For a while the city directory called it Beauregard Square. A newspaper story of eighteen ninety-eight said it did not do much good. Black New Orleanians, it said, still called it Congo Square.

  None of the guides names anyone who saw a ghost here. The spirit is a legend. The name stuck.
