certaintyNote: >-
  The cat murder and the life sentence are a legend: newspapers of the 1920s told it, and the prison museum tells it as folklore. Cornelia Pinchot told The New York Times that Pep never killed her cat, and letters of 1924 between Governor Pinchot and the warden show the dog was donated to the prison. Pep's admission, his inmate number and his mugshot are on record. The script says plainly which is which.
