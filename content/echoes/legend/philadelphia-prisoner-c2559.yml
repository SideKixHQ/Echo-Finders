teaser: "He has a prisoner number, a mug shot, and a guilty look."
script: |
  Look at the big gate of the prison, and picture a black Labrador being led through it. His name was Pep. And the story goes that he was a murderer.

  Here is the legend. Pep belonged to the governor of Pennsylvania, Gifford Pinchot. One day, the story goes, Pep killed the cat that belonged to the governor's wife. So the governor sentenced him to life, without parole. He arrived in August, nineteen twenty four, and got a prisoner number. C two five five nine. He even had a mug shot, with his number round his neck. In the photographs, his head is down and his ears are back. He looks a little guilty. The newspapers loved it.

  But that is the legend. Here is what is on record. The governor's wife, Cornelia Pinchot, told a newspaper that Pep had never killed her cat. The family bred Labradors, and Pep was a present for the prisoners, to cheer them up. Years later, a researcher named Dick Fulmer found the letters. The governor had read that the governor of Maine gave a dog to his state's prison, and wanted to do the same. The warden wrote back that a dog would be a good addition to their community. So Pep was not a prisoner. He was a guest. He wandered the halls as he pleased, and the prisoners and the guards loved him.

  Look at the gate again. Prisoner C two five five nine.

  Good dog.
