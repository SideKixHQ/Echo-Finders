script: |
  Look at the upstairs windows.

  One of the Whaley House’s oldest ghost stories begins with footsteps.

  Before the house was built, James Robinson, known as Yankee Jim, was convicted of grand
  larceny and hanged on this property in 1852.

  Thomas and Anna Whaley built their home here in 1857.

  According to the house’s published account, family members reported heavy footsteps
  upstairs and on the staircase.

  Thomas Whaley believed the sounds belonged to Robinson.

  That is the legend’s explanation. It is not proof of a haunting.

  But notice the strange overlap.

  A family built a home on land where a public execution had taken place. The story later
  placed the dead man inside their everyday surroundings.

  No distant cemetery. No ruined castle.

  Just someone walking above the rooms where people lived.

  Look at the windows again.

  The unsettling part of this legend is how little it needs: a quiet room downstairs, and
  footsteps where nobody should be.
