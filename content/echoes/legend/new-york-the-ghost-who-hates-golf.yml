certaintyNote: >-
  A ghost story, not history. The Federal Writers' Project guide of 1939 reports only that "Old Staten Islanders believe" the ghost of David La Tourette roams the building, vexed at the profanation of his home. Nothing proves it. That the clubhouse was the La Tourette family home and dates from 1830 is reported as fact in the same guide. The script says out loud that it is a legend.
