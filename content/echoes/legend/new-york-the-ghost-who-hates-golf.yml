teaser: "His home became a golf clubhouse. He is said to be taking it badly."
script: |
  Look at the big old house with the wide verandas, sitting on the hill above the golf course.

  It was a family home once. Now it is the clubhouse. And somebody, they say, has never got over it.

  This is a ghost story. Nobody has proved it.

  The house dates from about eighteen thirty. It belonged to the La Tourette family. The land around it became a city park, and the park became a golf course, and the house became its clubhouse.

  Back in the nineteen thirties, old Staten Islanders had a belief about this house. David La Tourette had never left. His troubled ghost, they said, was vexed at what had happened to his home. And now and then, he roams through the rooms.

  Listen for a moment. Somewhere out on the course, a club hits a ball.

  Somewhere in there, perhaps, a man is still very annoyed about it.

