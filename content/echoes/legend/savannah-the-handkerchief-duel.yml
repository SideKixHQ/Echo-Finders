teaser: "Twelve paces was not fair to a man who could not see. So he offered a table."
script: |
  Look at the old brick front of this building on Bay Street. For years it was the City Hotel, the best hotel in town, with a bar where the planters drank the best liquor in Savannah.

  More than one duel was hatched behind these walls.

  This one may never have happened. An old history of Savannah's duels tells it as a tale, and calls it perhaps apocryphal. No names survive.

  As the tale goes, a bully in the bar picked a quarrel with a man who had very poor eyesight. The short-sighted man answered back, and was challenged. He accepted at once, and named his terms.

  I am entitled, he said, to be placed on an equal footing with you as regards ability to see. At twenty paces I could not see you. So here is a table. I will sit on one side, you on the other. You will hold one end of a handkerchief, I the other. At the signal, we raise our pistols and fire.

  That is not a duel, said the bully, that is murder.

  With my eyesight, came the calm reply, it would be murder for me to meet you any other way. I am ready. Are you?

  Friends stepped in. The bully apologised.

  Look at the old walls again.

  The best answer to a bully, if the tale is true, was a handkerchief and a table.
detail: >-
  Gamble (1923), chapter on the 1850s and 1860s: the City Hotel "on the Bay near Whitaker, for many years Savannah's leading hotel", its bar, "More than one duel that ended without bloodshed, as well as one in which a man was winged, was hatched behind the brick walls", and the handkerchief tale with its dialogue, which the script tightens; the wording "At twenty paces I could not see you" condenses "At ten or twenty paces I would be at a serious and unfair disadvantage". The 1937 guide: "The story goes that on many a misty morning coffee and pistols for two were ordered behind these hospitable old walls."
