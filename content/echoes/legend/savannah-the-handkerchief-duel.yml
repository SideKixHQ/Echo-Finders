# Drafted by Claude Code (2026-11-10) for the second Savannah batch, following the six beats of docs/writing-echoes.md (echo-format-v2). A legend, told as one, in the male narrator.
# Listening spot: the south sidewalk of Bay Street just west of Bull, outside the old City Hotel building (the 1937 guide gives 23 West Bay; Gamble, "on the Bay near Whitaker"). Now a brewery and restaurant; the echo needs no entry.
# Position: Bay at Whitaker and Bay at Bull from the street segments in the app's Savannah street file, set on the south side between them (medium confidence for the door). About 37 m from the Oglethorpe bench echo (savannah-yamacraw-bluff) on the north side of Bay; different side of the street, different subject.
