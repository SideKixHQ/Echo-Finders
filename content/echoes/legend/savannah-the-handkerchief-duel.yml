certaintyNote: >-
  Gamble (1923) calls this "another ante-bellum story, and perhaps apocryphal" and tells it "as the tale goes". No names, no date, no record. That duels began in quarrels at the City Hotel, and that one man was shot dead there, is documented by Gamble from the newspapers; the handkerchief duel is not.
