teaser: "Look at the old brick walls of the Octagon from the Eighteenth Street side."
script: |
  Look at the old brick walls of the Octagon from the Eighteenth Street side.

  In April eighteen ninety-seven, a Washington newspaper said this had long been the most
  noted of the haunted houses in the city.

  This is a legend. Nothing in it has ever been proven. It is only what people said.

  And people said a great deal. Doors and windows that opened when they were shut, and shut
  when they were opened. A woman's shriek. The clank of sabres. Heavy footsteps. Groans and
  cries from the passage by the back stairs. And an officer who died in an upper room,
  whose blood, the story went, could still be heard dripping from the mantelpiece.

  At the time, the house stood neglected. A caretaker lived in it, rent free and unpaid,
  with his son. They slept in the room where Dolley Madison had once held her receptions.

  The reporter asked him about the ghosts. He laughed.

  If there are any ghosts here, he said, I have never heard or seen them. The only ghosts
  that haunt this house exist in people's imagination.

  Everyone else told stories about this house. He slept in it.
