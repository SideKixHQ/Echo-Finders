teaser: "A bolt from the sky, and a spring where it struck."
script: |
  This little river town has a strange name. Thunderbolt.

  It comes with a legend, and the legend is very old. Treat it as a legend, because that is all anyone has ever had.

  A thunderbolt fell here, the story goes, and where it struck, a spring came gushing out of the ground.

  When Savannah's historians wrote it down in eighteen sixty nine, they credited it to Oglethorpe's own account of Carolina and Georgia. And they quoted the best line. A spring arose in that place, which still smells of the bolt.

  A Savannah guidebook of eighteen ninety was more careful. Whether the tradition be founded on fact or not, it wrote, it is nevertheless believed to be true. Old inhabitants pointed out the Thunderbolt spring with faith and pride.

  Nobody has ever proven a bolt made a spring. But the name stuck.
