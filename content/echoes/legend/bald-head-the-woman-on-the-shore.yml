teaser: "Aaron Burr's daughter sailed in 1812 and vanished. A story here says she never left this beach."
script: |
  This is a legend. Nobody has proven any of it, and you should hear it that way.

  In the last days of 1812, Theodosia Burr Alston, the daughter of Aaron Burr, boarded a small vessel called the Patriot to sail to her father in New York. The ship left Georgetown, South Carolina, and was never seen again.

  That much is history. What happened to her is still a mystery.

  One story known to many people around here says the Patriot ran aground on the shoals off this island, out past the point. Pirates raided the ship, the story goes, and killed everyone aboard except Theodosia, who was taken for ransom.

  And her spirit, people say, still walks this shore, searching for a way to escape. Some tellers add three headless pirates, chasing behind her.

  There is no record of a wreck here. But if you walk this beach at dusk, you are walking where the legend puts her.
