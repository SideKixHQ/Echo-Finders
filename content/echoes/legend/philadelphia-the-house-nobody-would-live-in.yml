certaintyNote: >-
  Recorded as town talk by John F. Watson in his Annals (1842), in a chapter he titled Superstitions and Popular Credulity. Watson gives no date beyond "about ninety-five years ago", gives the owner only as "Mr. B.", and nothing in the record confirms a murder here. The script says it is a legend and that Watson himself kept the names back.
