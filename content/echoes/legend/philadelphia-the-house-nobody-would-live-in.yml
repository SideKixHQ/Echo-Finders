teaser: "The lawyer took it as his fee. Then nobody would live in it."
script: |
  Stand on this corner, Fifth and Walnut, and look at the buildings here. This is a legend, written down by an old collector of Philadelphia tales, John Watson. He called the chapter Superstitions and Popular Credulity.

  On this corner, he wrote, there once stood a house that everybody in town called the haunted house.

  A man he names only as Mr. B. was said to have killed his wife inside it. Then, the story goes, he gave the house away, to the colony's attorney general, a lawyer named Hamilton, to plead for his acquittal in court.

  If so, the lawyer had his fee. And then the house stood empty, for years. Nobody would live with what was inside.

  Watson heard other tales, too. Old people remembered the whole town talking about a black coach, driven through the streets at midnight by an evil spirit. Inside it, they said, sat a rich man who had died not long before, a man who had been unkind to someone who depended on him.

  Watson knew the names. He would not print them. But there were plenty of people, he wrote, quite persuaded they saw it.

  Look around this corner again. Nothing is left of that house. Not even the name of the man who lived in it.

  Only the initial.
