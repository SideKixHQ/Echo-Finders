script: |
  Look across Tower Green toward the Chapel of St Peter ad Vincula.

  Anne Boleyn was executed within the Tower in 1536. She was buried in that chapel.

  Those are historical events.

  One of the Tower’s enduring legends says she returns.

  In the version published by Historic Royal Palaces, her ghost moves through the grounds,
  leading a silent procession toward the chapel.

  Nobody has established that such a procession is supernatural.

  But the story’s route is meaningful.

  It connects the place where a queen’s life ended with the place where her body was
  buried.

  No journey out of the fortress.

  Only a return through it.

  Pause and look between the green and the chapel.

  The legend imagines movement where history imposed an ending.

  Anne’s death is documented. Her supposed return belongs to the stories people tell about
  this place.

  Standing here, you can see how close those two settings are.
