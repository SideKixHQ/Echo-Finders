certaintyNote: >-
  Ravenel (1906) reports that "it is said that he perfected his great invention, the telegraph, in a house in Chalmers Street." No house is named, and the 1941 state guide places Morse in Charleston from 1818 as a painter, before he invented the telegraph. The claim is a local tradition, not a documented fact.
