teaser: "Dot, dot, dash, on the cobbles of Chalmers Street. Or not."
script: |
  Look down at the cobbles of Chalmers Street, and along the old houses on either side. Charleston used to say that one of these houses holds a secret.

  This is a legend. It is said that Samuel Morse perfected his great invention, the telegraph, in a house on Chalmers Street.

  Morse really was here. He came to Charleston in eighteen eighteen. But not as an inventor. He was a painter.

  He had studied abroad, and he looked down on portraits. But portraits paid, so he painted them, and Charleston sat for him. When a history of the city was written in nineteen oh six, it described him as then known only as an artist.

  One of his Charleston portraits is of President James Monroe. Morse himself thought it was among his best. It hangs in City Hall, a few steps from here.

  The telegraph came later.

  Look at the houses again. The story never said which one.

  Which is what a legend does best.
detail: >-
  Ravenel (1906) records the Chalmers Street tradition with "it is said", and describes Morse in Charleston as "then known only as an artist", painting many portraits. The 1941 Federal Writers' Project guide says Morse won fame as an artist before he invented the telegraph, joined Charleston's artists in 1818, scorned portraits but was compelled to paint them for a living, and preferred his portrait of James Monroe, which hangs in City Hall.
