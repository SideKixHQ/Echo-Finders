certaintyNote: >-
  A ghost story, not history. Its only source is a 2017 Boston Globe report quoting a worker inside the closed Astrodome, who said the people who hired his crew told them about a man in a brown suit on an upper deck. Nobody quoted had seen him. The script says out loud that it is a legend and that no one has seen him.
