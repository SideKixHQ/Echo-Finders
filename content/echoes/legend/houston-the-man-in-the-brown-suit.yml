teaser: "Nobody on the crew ever saw him. They were told to look for him anyway."
script: |
  Look at the great curve of the Astrodome. It has been closed to the public for years. Inside, it is dark.

  This is a legend. Nobody has proved a word of it.

  In February twenty seventeen, Houston hosted the Super Bowl next door, and a small crew from New York was brought in to work on the empty floor of the old dome. The AstroTurf lay rolled up in cylinders. Old peanut shells were still on the floor.

  The people who hired them gave the crew a warning.

  There's a man in a brown suit who you'll see sometimes, they said. Up there, on the upper deck, where the light peeks through. The dome, they told them, is haunted by that man.

  One of the crew told a reporter that at six o'clock it gets a little creepy. The sunlight goes, the lights go out, and only the small lights stay on.

  He felt a cold breeze once, and wondered what it was. But neither he nor anyone else on the crew ever saw the man in the brown suit.

  What they did see, the week before, was a raccoon, or maybe a possum, walking right up the ramp.

  Look up at the roof line, where the light gets in.

  If he is there, he has the whole place to himself.

