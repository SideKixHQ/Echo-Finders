certaintyNote: >-
  A published tradition. Captain Flint is a fictional character; Treasure Island places his death at Savannah but names no house. The upstairs-room tradition and the ghost are reported in 1951 as "tradition" and "said to"; the 1753 inn claim comes from a Library of Congress photo caption based on the photographer's notes. The script says plainly that none of it is proven.
