tags: [savannah, savannah-core, pirates, literature, ghosts]
teaser: "Stevenson gave Captain Flint a death in Savannah, but no address."
script: |
  This low old building calls itself the Pirates' House. Before you go in, it is worth knowing which parts of that are history, and which are a very good story.

  Start with the book. In Treasure Island, published in eighteen eighty three, Robert Louis Stevenson gives his pirate captain, Flint, a death but no grave. Billy Bones says Flint handed him the map at Savannah, when he lay dying. Long John Silver puts it more bluntly. Flint died of rum at Savannah.

  That is all Stevenson says. He never names a house.

  The house came later. In February nineteen fifty one, the food editor of a Sunday magazine in the Washington Evening Star wrote about the newly restored tavern here. Tradition has it, the article said, that the man Stevenson based Flint on died in an upstairs bedroom of the old inn. And Flint's ghost is said to haunt the area on moonless nights.

  The story has grown since. A Library of Congress photograph of the house, captioned from the photographer's notes, says it opened in seventeen fifty three as an inn for seafarers, and soon became a meeting place for pirates and sailors back from ports around the world.

  None of that is proven. Not the inn's pirates, not the real man behind Flint, and certainly not the ghost.

  But Stevenson did send Flint to Savannah to die. Savannah has been happy to find him a room.
