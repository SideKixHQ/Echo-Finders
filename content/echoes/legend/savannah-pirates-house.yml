certaintyNote: >-
  A published tradition. Captain Flint is a fictional character; Treasure Island places his death
  at Savannah but names no house. The upstairs-room tradition and the ghost are reported in 1951 as
  "tradition" and "said to"; the 1753 inn claim is the house's own account. The script says
  plainly that none of it is proven.
