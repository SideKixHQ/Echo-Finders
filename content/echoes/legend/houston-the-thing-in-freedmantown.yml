certaintyNote: >-
  A ghost scare, not a proven event. The account is the Houston Evening Journal's, from September 1884, quoted in the WPA's Houston guide of 1942; the paper itself mocked the neighborhood and floated a political explanation. Nothing in the record says what, if anything, was seen. The script says out loud that it is a legend.
