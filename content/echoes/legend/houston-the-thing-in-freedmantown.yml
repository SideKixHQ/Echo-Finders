teaser: "A skeleton in a dress, a club formed to shoot it, and a soldier company holding the bridge."
script: |
  Look along these streets. In the eighteen eighties, this was Freedmantown, built by people who had been freed from slavery.

  This is a legend. Nobody ever proved there was anything here at all.

  On the twenty third of September, eighteen eighty four, the Evening Journal reported that Freedmantown was in a ferment. Something had been seen at night. The paper called it the Thing. It looked, the paper said, like a skeleton dressed in a mother hubbard, a long loose house dress, with the bones shining through.

  The next day, the paper said the Thing had come again.

  It was an election autumn, and the paper wrote that someone had told a newspaper in Saint Louis the whole ghost was a political trick, to scare voters.

  Then the shooting started.

  The paper reported that several hundred shots were fired by something called the Anti Ghost Club. A deputy named Glass posted his men around the gullies and the alleys. A militia company held the bridge.

  And the paper's last word on it was this.

  The Thing remains a mystery.

  Look down the street, after dark.

  It has never been explained. It has also never been caught.

