teaser: "I will if I can, he said, and walked on."
script: |
  Stand at this corner, where Atlantic Street meets Meeting Street. A house once stood here, and it is gone. What is left is a story. It is a legend, and nobody can prove it.

  A Charleston historian, writing in nineteen-oh-six, called it the only well-authenticated ghost story known in Charles Town.

  During the Revolution, while the British held the town, they sentenced an American officer, Colonel Isaac Hayne, to hang. The house on this corner belonged to Mrs. Peronneau, his wife's sister. She had knelt with his children before the British commander and begged for his life. It did no good.

  On the day of the execution, the story goes, he passed along Atlantic Street on his way to the gallows. She stood at the north window and cried out to him. Return, return to us.

  He answered, I will if I can. And he walked on.

  Ever after, the story says, anyone at that north window after dark would hear a ghostly voice in the street below. Then steps on the stair, and in the hall. As of a man returning. Never going down. Always up.

  The house came down more than a century ago. The street he walked is still here.
