certaintyNote: >-
  The Lydia Darragh account first appeared in print in the American Quarterly Review in 1827, fifty years after the event. Thompson Westcott (1877) found that the British marched on 3 December 1777, not the 4th, that Washington's camp already expected the move from 28 November, and that his own officers' letters put the warning days before hers. He calls the account doubtful. The script tells it as a legend and gives his objections.
