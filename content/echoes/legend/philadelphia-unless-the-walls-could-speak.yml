tags: [philadelphia, society-hill, revolution, military, british-occupation, lydia-darragh, spy, legend, quakers]
teaser: "She took off her shoes, and put her ear to the keyhole."
script: |
  Look across Second Street, just below the corner of Spruce. This is a legend, and a good one. Whether it happened is another matter.

  In the winter of seventeen seventy seven, the British held Philadelphia. Over there, the story goes, stood the house of the British commander. And on this side, in an old house with a balcony, lived a Quaker woman named Lydia Darragh.

  One night, a British officer asked to use her back room for a meeting. He told her to send the family to bed early. So she did. Then she took off her shoes, put her ear to the keyhole, and heard an order read out. The whole army would march out and attack General Washington at Whitemarsh.

  The next morning, she said she needed flour from the mill at Frankford. She got a pass through the British lines, left her bag at the mill, and kept walking. She met an American officer she knew, and told him everything.

  When the British got to Whitemarsh, the Americans were waiting. Back in Philadelphia, the officer called her upstairs and locked the door. I am entirely at a loss, he said, to imagine who gave General Washington information. Unless the walls of the house could speak.

  Here is the trouble. Nobody printed this until fifty years later. One careful historian checked the dates, and found that Washington's camp knew the British were coming days before Lydia's walk. By his reckoning, her secret was stale.

  So maybe she walked to Frankford for nothing.

  Or maybe the walls really did speak.
