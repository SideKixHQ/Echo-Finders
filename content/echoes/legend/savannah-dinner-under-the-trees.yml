certaintyNote: >-
  A plantation legend repeated by Savannah guidebooks of 1881, 1890 and 1910, none of which gives a
  date, a host's name for that night, or a first-hand witness. Later ghost stories grew from it; those
  are not in the sources and are left out. The script says aloud that it is a legend.
