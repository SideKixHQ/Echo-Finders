teaser: "The roof was on fire. The host did not stop dinner."
script: |
  Before this was a cemetery, it was a country estate. And it has a story that every old Savannah guidebook liked to tell.

  Treat it as a legend. None of those guidebooks names a guest, or quotes anyone who was there.

  The first house, the story goes, stood on the high ground over the river, facing a garden that ran down in terraces to the water.

  One evening, in the middle of a dinner party, the roof caught fire.

  Nothing could save the house. So the host had the dinner carried out under the trees, and there it was finished, while the house burned to the ground.

  A guide for strangers told it in eighteen eighty one. Another guidebook told it in eighteen ninety. Another in nineteen ten. Each time, the dinner was finished.

  Nobody can show you the burned house now. But the story still sets the table out here, under the oaks.
