script: |
  Look at the big house on the corner across the street. It was built in 1859, and by the 1880s it was a resort hotel. In summer it was known for its weekend music and dances.

  What follows is a legend. Nobody has proven any of the strange part.

  The story goes that in 1882, a young musician from Italy named Antonio Caseletta came to this coast looking for work, and got a job playing the harp in the hotel band. One telling makes him nineteen.

  One night he went sailing with the other musicians. He fell overboard and drowned.

  He was buried a few blocks from here, in the Old Smithville Burying Ground.

  According to the legend, the band played that night without him, and left his chair and his harp empty. When they began, the sound of a harp joined in. There was nobody at it.

  Some people say they can still hear it, in the halls of the hotel.

  Most ghost stories want something. This ghost just wants to finish the set.
