script: |
  Look toward the churchyard. Wilmington storytellers attach a particularly unsettling
  legend to Samuel Jocelyn Junior: a dead man supposedly appeared to a friend and asked to
  be taken out of his grave.

  In the tale, the friend initially dismissed the encounter. Further appearances finally
  persuaded him to investigate. The ending suggested that Jocelyn had been buried alive.

  That is the ghost story, not a verified account of a premature burial. Its power comes
  from an ordinary human fear: needing help when nobody believes you can still ask for it.

  From this public sidewalk, the churchyard gives the tale its setting. You do not need to
  enter, search for a particular grave, or treat a sound as evidence. Listen to the city
  continuing around you. The legend asks you to imagine one voice trying to reach it.
