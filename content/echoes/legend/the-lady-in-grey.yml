teaser: "Look at the windows of the main house."
script: |
  Look at the windows of the main house.

  A longtime Bellamy volunteer described a story about a woman in grey, supposedly seen
  wandering its rooms.

  The museum includes that account in its discussion of hauntings.

  It also asks a revealing question: why do people so strongly want old houses to be
  haunted?

  The woman has not been established as a supernatural presence. The museum does not
  identify her as a proven spirit of a particular resident.

  Instead, the story became attached to the house.

  Look at the windows again.

  From outside, you can see just part of each room. Reflections and shadows change what
  appears behind the glass.

  An old house contains lives you cannot meet and rooms you cannot fully read from the
  street.

  The lady in grey gives that uncertainty a human shape.

  But the building’s documented history deserves attention too.

  The legend is one story people tell about Bellamy.

  It is not the whole story of the people who lived and worked here.
