teaser: "Rangers here end the tour with one story. It is not in the records."
script: |
  You are inside Fort Warren, the granite fort on Georges Island. In summer, the rangers here
  often finish their tour with one story. The Lady in Black.

  It is a legend. Nobody has ever proved a word of it.

  The story goes like this. During the Civil War, this fort held Confederate prisoners. One of
  them was Captain Andrew Lanier. His young wife came north from Georgia to free him. She put
  on a man's clothes, took a pistol, and came out to the fort in the dark, in a small boat
  loaded with picks and shovels.

  She crawled through a grating to his cell. They began to dig a tunnel. A guard heard the
  clink of a pick.

  Caught, she drew her pistol and fired at the commander. The shot killed her own husband.
  She went to the gallows in a black dress found in the fort's stores.

  Since then, the story says, a lady in black walks these walls. A sentry who swore she tried
  to throttle him was suspected of drinking, and put in irons.

  The fullest telling came from the harbour historian Edward Rowe Snow. In nineteen forty-six
  he told reporters he would hide here on Halloween night and wait for her, armed with a
  broomstick.

  Keep an eye on the dark arches. If she comes, you will be the first to prove it.
