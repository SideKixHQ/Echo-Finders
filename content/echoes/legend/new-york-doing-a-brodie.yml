certaintyNote: >-
  A legend, not established fact. The Federal Writers' Project guide of 1939 files Steve Brodie's leap of July 1886 among the bridge's "apocrypha" and "distinctive legends": some men claimed to have seen it, while old barkeepers "put their tongues in their cheeks". That "do a Brodie" became slang, and that a fake Brodie jumped nightly at the 1939 World's Fair, are reported in the same guide. The script says out loud that nobody can prove the jump.
minAge: 0
quality: 0.8
tags: [new-york, brooklyn-bridge, city-hall, legend, slang, stunt]
teaser: "He said he jumped. Half of New York believed him. The other half bought him a drink anyway."
script: |
  Look up the ramp at the bridge, the stone towers and the long curving cables. Now picture a man standing up there, in July, eighteen eighty six, looking down at the East River.

  His name was Steve Brodie. And he said he jumped.

  This is a legend. Nobody has ever proved it.

  Here is how the story goes. Brodie dropped from the bridge into the river. A rowing boat was waiting below. It pulled him out, alive. And crowds of admirers cheered as he climbed up onto the dock.

  For years afterwards, there were men in New York who swore they had seen it. The leap. The little boat bobbing in the water. The cheering.

  And there were others. Mention Brodie's name to an old time barkeeper, said the city guide in nineteen thirty nine, and he would put his tongue in his cheek.

  Did he really jump? Nobody knows.

  But it did not matter. His name became a word. To do a Brodie meant to take a high dive. On the stock market. In love. In the boxing ring.

  And at the World's Fair in nineteen thirty nine, a man playing Steve Brodie leaped off a hundred foot copy of this bridge.

  Six times a night.

