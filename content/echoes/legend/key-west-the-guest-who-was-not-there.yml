teaser: "This house is named for a famous visitor. The deed books say he almost certainly never stayed in it."
script: |
  This is a legend. It has never been proven. It is also a story about what happens when someone checks the paperwork.

  The house in front of you is known as the Audubon House. Local legend holds that John James Audubon, the great painter of birds, visited this house in 1832, when he came to the Florida Keys to paint.

  It is a lovely story. A federal survey of historic buildings went to the deed books to look for it.

  The house was built by Captain John Geiger, one of the best known pilots and wrecking masters of old Key West. Probably in the 1850s. And Geiger did not get this property until 1844.

  Long after Audubon had come and gone. So it is highly unlikely, the survey concluded, that Audubon stayed in Geiger's house.

  But in 1831 there was another house on this lot. A one-story frame dwelling, occupied by a doctor named Strobel. And Audubon does mention Doctor Strobel in his account of Key West.

  It is possible that Audubon stayed there.

  So the legend could have the right place, and just the wrong house.
