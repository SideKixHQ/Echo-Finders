certaintyNote: >-
  The Historic American Buildings Survey (1967) records the story that the house was built by the government for officers of Commodore Porter's Anti-Pirate Squadron as "one legend", and sets against it an 1829 advertisement by Richard Cussans as a carpenter and joiner and his ownership of land on Whitehead Street. The script tells it as a legend and gives the evidence; the Watlington facts are documented.
