# Drafted by Claude Code (2026-11-12) for the second Key West batch, following docs/writing-echoes.md.
# Listening spot: The Duval Street sidewalk in front of 322 Duval Street (the Oldest House; HABS FL-192 calls it the Captain Francis Watlington House). Stay on the sidewalk.
# Position: The 300 block of Duval Street runs from Caroline Street (24.55806, -81.80447) to Eaton Street (24.55690, -81.80361) in the app's Key West street file; 322 is placed about a fifth of the way from Caroline (medium confidence). Wikidata has no point for the house.
# Legend handling: the HABS record itself calls the naval quarters story "one legend" and gives the evidence against it, so the script says it is a legend and tells both.
