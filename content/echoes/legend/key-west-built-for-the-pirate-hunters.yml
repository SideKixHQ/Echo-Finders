teaser: "The pirate hunters may never have slept here. A wrecker did."
script: |
  Look up at the three dormer windows in the roof of the house at three twenty two Duval Street. They are not the same size.

  People have long called this the oldest house in Key West. And there is a legend about who built it.

  The story goes that the United States government put it up, as quarters for the naval officers of Commodore David Porter's Anti-Pirate Squadron.

  It is a good story. But in eighteen twenty nine, a man named Richard Cussans placed an advertisement in the Key West Advertiser. He was a carpenter and joiner. The county records show he owned land on Whitehead Street.

  And the house is said to have been moved here from Whitehead Street, by Cussans, in eighteen thirty two.

  Later it became the home of Captain Francis Watlington. He was a fine pilot. He commanded merchant ships, and wrecking vessels as well.

  So the pirate hunters may never have slept here. But a wrecker did.
detail: >-
  From the Historic American Buildings Survey record (HABS FL-192, 1966 and 1967): "traditionally called the oldest house in Key West", said to have been built as early as 1825 and moved by Richard Cussans from Whitehead Street in 1832; the legend of the Anti-Pirate Squadron quarters; Cussans's 1829 advertisement in the Key West Advertiser as a carpenter and joiner, and his Whitehead Street property; the dormers, now unequal in size; Captain Watlington as a pilot in command of merchant ships and wrecking vessels. The record does not say outright that Cussans built the house; the script says only what the advertisement and the deeds show and lets the listener draw the line.
