script: |
  Look out across the channel, toward the marsh and the mainland. Beyond what you can see from
  this park is a small island with a big name: Money Island.

  What follows is a legend, and it has never been proven. The story says that in 1699, Captain
  William Kidd stood supervising while workmen buried two iron chests full of gold and silver on the
  island.

  Locals have spent hundreds of years searching for those chests. None have ever been found.

  So the island kept its name, and nothing else. It works like a treasure map made of a single word, passed from
  neighbor to neighbor, promising more than anyone ever dug up.
