teaser: "Houston's oldest bar comes with a ghost for every floor. Mind the one on the stairs."
script: |
  Find the two storey brick building at eight thirteen Congress. Inside is a bar called La Carafe.

  It is one of the oldest buildings in Houston still standing where it was built. And by the telling of the people who work in it, it is not empty when it should be.

  This is a legend. Take it as one.

  An Irish baker named John Kennedy came to Houston in eighteen forty two. Around eighteen sixty he had this building put up, for a steam bakery. It stayed in his family until nineteen seventy.

  Now it is called the oldest bar in Houston.

  Its regulars have given it a whole cast of ghosts. John Kennedy himself, they say, shot and killed outside this door. A bartender called Carl. A boy who plays upstairs. And a woman on the stairs, who pushes beautiful women down them.

  The state historical marker for this building gives Kennedy's years, eighteen nineteen to eighteen seventy eight. It says nothing about how he died.

  A manager once told a reporter what he had seen. Doors open by themselves. You think you see people walk by. There are noises. Things fly off the walls.

  Look at the door, and the stairs behind it.

  If you go up, hold the rail.

