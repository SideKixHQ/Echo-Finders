teaser: "Look up at the tower and tell me it does not look like a fire hose."
script: |
  Find the statue in this square: three volunteer firemen at work. One of them is carrying a frightened young girl to safety.

  Now look up the hill, at the white tower on top. The same woman paid for both. Her name was Lillie Hitchcock Coit.

  When she was a small girl, new to San Francisco, she watched two of her friends die in a fire. She was rescued herself by a volunteer from Knickerbocker Engine Company Number Five. He chopped a hole in the roof, let himself down on a rope, and climbed out with her on his back.

  She never forgot it. The engine company made her an honorary member, with a helmet of her own. Ever after, she signed her name: Lillie Hitchcock Coit, five.

  When she died, in nineteen twenty nine, she left a third of her estate to the city, to add to its beauty. It paid for the statue, and the tower.

  And so the legend. That the tower was built to look like a fire hose.

  It is a wonderful story. The official record of the tower says, flatly, that it was not designed to resemble a fire hose.

  Look at it anyway.
detail: >-
  From the National Register additional documentation for Coit Memorial Tower: Lillie Hitchcock Coit's arrival in 1851 at seven, watching two friends burn to death, her rescue by John Boynton of Knickerbocker Engine Company Number 5 through a hole in the roof, honorary membership and a helmet in October 1863, signing "Lillie Hitchcock Coit 5", her death in 1929 and the bequest of a third of her estate "for the purpose of adding to the beauty of the city", which paid for both the tower and the Patigian statue in Washington Square showing three volunteer firemen, one carrying a young girl. The same document says the tower "was not designed to resemble a fire hose". The legend's existence rests on that denial; no fetched source records who first told it. Male narrator, as for every legend.
