certaintyNote: >-
  The fire hose story is popular lore with no source behind it, and the National Register documentation for Coit Tower says plainly that the tower was not designed to resemble a fire hose. The account of Lillie Coit's childhood rescue comes from the same documentation, which cites a 1967 biography; it is told here as she is remembered, and is not independently confirmed.
