teaser: "Something was lying on the bed beside him. It had a man's face."
script: |
  Stand on the east side of the square, by the old theater.

  This is a ghost story, and it is a legend. Nobody has ever proven a word of it.

  In August eighteen eighty eight, the Savannah Morning News printed a letter signed only with initials. The writer said he had rented a room in an old hotel in this city. Its end window looked down into a square. Across the street stood a grand old church. To the east of the square was the theater.

  He never named the square. A city guidebook of nineteen ten called this one Theater Square.

  Night after night, he wrote, something woke him just before the church clock struck three. A hand feeling under his pillow. The bed lifting under him. Then a voice, a man in great agony, crying out, Oh my God.

  And lying on the bed beside him was a creature about four feet long. A brassy yellow lion, with the face of a man of thirty or so. Short dark hair. A close beard. A contemptuous curl to the lip.

  He prayed. It backed slowly off the foot of the bed and was gone.

  His friends tied it to a sad tragedy in the old house years before. Others said trickery, or his own mind. He left the next day.

  It is just a story in an old newspaper. But he signed off saying he knew what he saw.
