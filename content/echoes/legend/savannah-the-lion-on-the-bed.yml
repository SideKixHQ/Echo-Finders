certaintyNote: >-
  A ghost story published as a reader's letter in the Savannah Morning News, 10 August 1888, signed
  only F. H. T. Nothing in it can be checked: the writer names neither the hotel nor the square, and
  the tie to this square rests only on his mention of a theater to the east. The script says aloud
  that it is a legend.
