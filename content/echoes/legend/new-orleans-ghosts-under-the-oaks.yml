teaser: "Every quarrel in old New Orleans, it was said, ended up under these trees."
script: |
  Look at the old live oaks around you, hung with moss.

  In the early eighteen-hundreds this grove was the dueling ground of the Creole gentlemen of New Orleans. They met here in the early morning, with pistol, saber, even shotgun.

  A city guide of nineteen-oh-four listed what they fought about. A slight at a ball. A quarrel with a rival lover. Politics. The last opera. Whether a famous singer could reach a certain note. Legal points. Scientific questions. All of it, the guide said, came to a direct issue under these oaks.

  So the oaks collected ghosts. What a troop of ghostly stories come up under the oaks, the guide wrote. Grace King, a few years earlier, put it another way. What a trooping of ghosts there would be under these old trees, she wrote, if everyone who had fought here could come back in spirit.

  Treat that as a legend. Nobody has shown that any duellist walks here. What is real is a line the guide found cut on old tombs in the St. Louis cemeteries. Died on the field of honor.

  Stand under the branches in the early morning, and the story is easy to believe. That is all it ever needed.
