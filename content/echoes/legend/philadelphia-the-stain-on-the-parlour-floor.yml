teaser: "Germantown has been showing the stain for two hundred years."
script: |
  Look at the old stone house with the long front, set right on the avenue. This is a legend, and it has been told in Germantown for a very long time. Inside, they say, on the floor of the west parlour, there is a stain. Blood, from a British general.

  Here is what is on record. In late September of seventeen seventy seven, the British army took over Germantown. A general named James Agnew moved into this house. The person left in charge of it was a servant named Justina. As a child, she had walked seventy miles to find this family, after her father died.

  On the fourth of October, Agnew heard the American attack begin. He hurried out. In the garden, Justina was working with her hoe. He told her to get into the cellar. She would not, and kept on hoeing.

  Later that morning, Agnew was shot from his horse, in the street.

  The legend says he was carried back here, and died on the parlour floor. A man from the village claimed for years that he had fired the shot himself, from behind a wall.

  But Agnew's own servant wrote to his widow. He said the general died in a different house, within fifteen minutes, and that afterward he had the body brought back to his former quarters.

  Justina stayed with this family for the rest of her life. They kept her old hoe for years, in memory of that morning.

  Look at the house again. The blood on that floor may well be real.

  It is the deathbed that is the story.
