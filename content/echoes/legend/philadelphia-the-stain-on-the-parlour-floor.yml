certaintyNote: >-
  The bloodstain is a Germantown tradition, recorded by Thompson Westcott in 1877 ("stains are still shown on the floor"). What is on record: General James Agnew lodged here in the week before the Battle of Germantown and was killed in the battle on 4 October 1777. His servant's letter to Agnew's widow says he died in another house and his body was then brought back here, which would put the blood on the floor but not his death in the room. The local claim of a villager named Boyer to have shot him is contradicted by the same letter. The script says all of this is tradition.
