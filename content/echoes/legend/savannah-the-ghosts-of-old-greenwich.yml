certaintyNote: >-
  The ghosts are from a poem, "On Old Greenwich", by Mrs. Ann Elizabeth Bowen, printed in extracts by Adelaide Wilson in 1889. Wilson presents them as childhood tales the poet remembered, not as sightings. That Greenwich was the Bowen family's plantation, and that wounded officers were brought there after the siege of 1779, is Wilson's account and is documented elsewhere in the library.
