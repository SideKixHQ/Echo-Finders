teaser: "A woman in white, looking for buried gold. A little man looking for his hedge."
script: |
  Look along the river edge here, under the oaks. This was Greenwich, an old plantation.

  A Savannah woman wrote down who was said to haunt it.

  Her name was Ann Elizabeth Bowen. In a poem, printed in a Savannah history in eighteen eighty nine, she wrote down the ghosts she remembered from the tales of her childhood. This is a legend, told in verse, and nothing more.

  First, a lady, pale and fair, in robes of ghostly white. Death, the poem says, sealed her lips before she could tell where she had hidden an orphan's money. So she lingers by the hearth where the gold lies buried, and sighs.

  Then a little old man in a gold-laced hat and satin knee breeches. He had sent home to England for roses and myrtles, and loved his box hedge more than his bride. Now the hedge is stolen, and he stamps about with his stick, muttering, and wishing every thief the gout.

  And last, the poem says, a sentinel, pacing night after night, guarding a hero's grave.

  Look along the river again.

  A pale lady, a cross little gardener, and a soldier who will not go off duty.
detail: >-
  Wilson (1889), chapter on the Revolution: the Bowen family at Greenwich, Pulaski brought there wounded, and extracts from "On Old Greenwich (now Greenwich Park)" by Mrs. Ann Elizabeth Bowen. The ghost descriptions paraphrase the verse closely. The 1937 guide places Greenwich beyond Bonaventure, "2 m." from Thunderbolt, and calls it Samuel Bowen's plantation during the Revolution.
