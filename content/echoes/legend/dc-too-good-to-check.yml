teaser: "Four words, shouted at a President. Everyone knows them. Nobody knows who said them."
script: |
  Find the stone marker on the grassy wall of the fort. It marks where President Lincoln stood, on the twelfth of July, eighteen sixty four.

  The Confederate army was at the edge of Washington. Lincoln came out to watch. He climbed up on this parapet, a very tall man in a tall hat, in full view. Sharpshooters were firing from half a mile away. A man standing near him was hit.

  That is history. He was only the second sitting President ever to come under enemy fire.

  Now the legend. Somebody, the story goes, shouted at the President. Get down, you fool.

  The usual version says it was a lieutenant, Oliver Wendell Holmes, who later sat on the Supreme Court for decades. It is a wonderful story. The Park Service calls it unconfirmed. Historians doubt it. One Washington guide put it best. We tour guides, he said, call that kind of story too good to check.

  Stand by the marker, and look out where the sharpshooters were.

  Maybe somebody shouted. Either way, the President was soon taken away, under heavy guard.
