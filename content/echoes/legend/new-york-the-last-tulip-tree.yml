teaser: "A rock stands in for a tree, which stood in for a meeting nobody wrote down."
script: |
  Find the big boulder with the plaque on it, on the grass near the edge of the woods. Then look up, and imagine a tree so wide that a family could stand inside its shadow.

  It stood here. Now there is only the rock.

  This park holds the wildest acres left in Manhattan. And this tree came with a legend.

  Before the city, there was a village in this valley. The people who lived here called it Shorakapkok. Their tools and weapons have been found in this valley.

  Here is the legend. When Henry Hudson sailed up the river, he came ashore and met the people of this village. Right where this tree would grow. And afterwards, the story goes, they planted the tree to remember the meeting.

  No record says it happened. No one can say it did not.

  By nineteen thirty nine, all that was left of the tree was a gaunt stump. Today, even the stump is gone.

  So the boulder holds its place.

  Which makes it a stone standing in for a tree, standing in for a meeting nobody wrote down.

