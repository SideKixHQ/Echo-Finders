certaintyNote: >-
  A legend, not history. The Federal Writers' Project guide of 1939 reports that the stump of a huge tulip tree here marked, "according to legend", the site of a meeting between Henry Hudson and the Indians, and that the tree "is said to have been" planted to commemorate it. No record of such a meeting at this spot exists. The Algonquin settlement and the finds in the park's eastern valley are reported as fact in the same guide. The script says out loud that the meeting is a legend.
