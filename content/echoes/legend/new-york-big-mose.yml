certaintyNote: >-
  A tall tale, not history. Big Mose was a stage character and a figure of Bowery folklore; the Federal Writers' Project guide of 1939 calls him "the legendary Big Mose" and records the feats told of him. The National Theatre at 104 Bowery and the actor Frank Chanfrau are documented in the same guide. The script says out loud that Mose is a legend.
