tags: [new-york, bowery, folklore, tall-tale, theater, nineteenth-century]
teaser: "He could lift a streetcar like a tray. Or so the Bowery said."
script: |
  Look up and down the Bowery. Wide, loud, and very old. Now make room on the sidewalk, because somebody very big is coming.

  This is a legend. Nobody this big ever lived. But for a while, the whole Bowery talked as if he did.

  His name was Mose. Big Mose. The story says he stood eight feet tall, with hands as big as hams. He kept a butcher's cleaver in his belt. In summer, he hung a keg of beer there too.

  When he was bored, he would lift a horse drawn streetcar off its track and carry it on one hand, the way a waiter carries a tray. The horses dangled from their harness. And Mose laughed.

  On a hot day, they said, he stood in the East River and blew the ships back out to sea.

  Here is where he came to life. On this block stood the National Theatre. An actor named Frank Chanfrau played Mose on its stage, in play after play, with his brother beside him.

  The crowds who came out of that theater walked straight back onto the Bowery.

  And for years, the Bowery told his tales as if it had seen him.

