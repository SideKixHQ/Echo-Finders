script: |
  The elegant house above you was built in 1770 over remains of Wilmington's earlier jail.
  That combination has drawn more than architectural curiosity.

  The Ghost Guild records a paranormal investigation here in March 2018, including a
  bedroom recording session described as an attempt to capture electronic voice phenomena.
  Such recordings are interpreted by enthusiasts as possible voices, but they do not
  establish that spirits exist.

  There is a documented investigation and an interpretation. Those are different things.
  The haunting is a legend, and it has not been proven.

  From the sidewalk, consider how much expectation changes listening. In a new building, a
  creak might pass unnoticed. The same creak above old cells can become the beginning of
  a story. The house's real history supplies the weight; the haunting remains an
  unanswered claim. You can enjoy that uncertainty without pretending it has been solved.
