script: |
  Find the grave of a little girl named Gracie, and the stone figure of her. Look at her face.

  People say that her face is not always cold.

  She died in eighteen eighty nine. She was six years old. She has been here, among the oaks, ever since.

  And this is what is told about her. It is a legend, and nothing more. In the cold of winter, they say, when the moon is full, Gracie's cheeks are warm.

  Nobody has proved it. The cemetery closes at five in the afternoon, so on a full moon night there is no one here to try. Which may be how she likes it.

  Look at her face again.

  Some legends are about fear. This one is about a child nobody wanted to be cold.
