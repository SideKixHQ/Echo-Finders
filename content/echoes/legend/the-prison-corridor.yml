teaser: "Stand still for a moment."
script: |
  Stand still for a moment.

  Look along the corridor, then toward the cells.

  Eastern State’s ghost stories tell of shadowy figures darting from cell to cell.

  The site’s own audio tour asks the question straight out. Is this place haunted? Who
  knows? Some visitors say they have sensed something here.

  That is all it is: a story people tell. Nobody has proved a ghost, and the site does
  not allow paranormal investigations.

  Now listen to the space around you.

  A prison changes the meaning of ordinary sounds. A footstep might suggest an approaching
  guard. A door might suggest confinement. Silence might suggest someone listening.

  You do not need to imagine a particular dead prisoner.

  What is certain is that real suffering happened behind these walls, for more than a
  hundred and forty years.

  The haunting stories add another question: can a place seem occupied after the people
  who lived inside it are gone?

  Look down the corridor again.

  You might see nothing unusual.

  The feeling of waiting for something is part of this story.
