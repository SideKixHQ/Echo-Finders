script: |
  Stand still for a moment.

  Look along the corridor, then toward the cells.

  Eastern State’s ghost reputation includes stories of shadowy movement and something
  appearing in an otherwise empty prison.

  The historic site has discussed paranormal television investigations, including
  controversial footage filmed in Cellblock Twelve.

  Controversial matters.

  A recording that people argue about is not proof of a ghost.

  Now listen to the space around you.

  A prison changes the meaning of ordinary sounds. A footstep may suggest an approaching
  guard. A door may suggest confinement. Silence may suggest someone listening.

  You do not need to imagine a particular dead prisoner.

  The real people confined here already give these walls a difficult history.

  The haunting stories add another question: can a place seem occupied after the people
  who lived inside it are gone?

  Look down the corridor again.

  You may see nothing unusual.

  The feeling of waiting for something is part of this story.
