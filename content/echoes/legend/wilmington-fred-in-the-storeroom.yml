teaser: "He looked ready to help, then he was not there."
script: |
  This old shopping complex has the right ingredients for a ghost story: connected
  buildings, stairs, and passages where somebody can disappear from view.

  A published account of Wilmington ghost stories tells of Fred, a tall, dark-haired
  apparition associated with Paddy's Hollow. In that version, a manager encountered him in
  a storage room. He seemed ready to offer help, then vanished.

  The encounter is a reported legend, not a verified event. We cannot establish that the
  manager saw a ghost, or identify an actual dead person behind the name.

  What makes the story memorable is its almost ordinary beginning. A person appears in a
  workplace and behaves like someone who belongs there. The ending alone breaks the
  pattern. From the public entrance, imagine the moment between recognizing a stranger and
  realizing there is nobody left to recognize.
