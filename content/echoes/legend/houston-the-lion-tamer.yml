# Drafted by Claude Code (2026-11-11) for Houston, Hermann Park and the Houston Zoo: legend over documented history. Second pass.
# Listening spot: by the lion enclosure inside the Houston Zoo, 6200 Hermann Park Drive. Hans Nagel, the zoo's first keeper and a lion tamer, was shot in Hermann Park in November 1941 (United Press, 1941; Houston Chronicle, 2017). The legend puts his ghost near the zoo's commissary, which no source locates; the lions are chosen because he tamed them. Heard inside the zoo, which charges admission.
# Position: Overture place "Lion Enclosure", 6200 Hermann Park Dr, 29.71288, -95.39159 (medium confidence for the enclosure). About 370 m from the kids' echo about Earl the bison at the zoo's edge.
