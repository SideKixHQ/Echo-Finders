  Nagel's career, injuries and death are history: the Houston Chronicle (2017, drawing on the zoo's own account) and a United Press report printed in the McAllen Daily Press on 18 November 1941. The ghost is legend: the Chronicle reports staff accounts of shadows, a whisper and a figure in a doorway near the commissary, and nobody has proved them. The killing is told from the watchman's own account as the UP reported it, and the grand jury's finding is stated. The script says which part is legend.
