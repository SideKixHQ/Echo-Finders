teaser: "No animal in this zoo ever finished off its first keeper. A man did."
script: |
  Find the lions.

  The first man to work lions in this zoo was a German named Hans Nagel. And the zoo, the legend goes, has never quite let him leave.

  This is a legend. Here is the part that is not.

  The city hired Nagel in nineteen twenty two, to run the zoo and to be its face. He put on lion taming shows every week. He rode a zebra, to win a bet. He once drove a bear all the way from Port Arthur, in the back seat of his car.

  The animals fought back. An alligator bite put him in hospital for three weeks. An elephant stepped on him. A leopard opened him up. A lion called Caesar, four hundred and fifty pounds, would have killed him if his assistants had not got to him first.

  He carried a pistol at his side, always.

  In November, nineteen forty one, a park watchman came on Nagel by a side road in the park. By the watchman's account, Nagel had been hiding behind a bush, watching young people in a parked car. The two men argued over whose job it was to police the park. The watchman said Nagel reached for his pistol. The watchman fired six times.

  Hans Nagel was forty nine. A grand jury cleared the watchman, on grounds of self defense.

  Since then, staff have reported strange shadows by the zoo's commissary, said to be near where he died. A voice late at night, no louder than a whisper. A man standing in a doorway, and then not.

  Look at the lions.

  No animal here ever managed it.

