teaser: "Nobody knows how the Great Chicago Fire started. Everybody knows about the cow."
script: |
  On the night of the eighth of October, 1871, a fire started in a barn not far from where you are standing.

  A neighbor on this street was washing dishes when she saw a bright reflection on her window panes. She ran into the street, and saw the O'Learys' barn and two others on fire.

  That much comes from what witnesses told the inquiry afterwards. Here is the part that comes from somewhere else.

  The story goes that the O'Learys' cow kicked over an oil lamp, and set the straw alight. It was a widely circulated rumor, and it has never stopped being told.

  It is a legend. Nobody has ever proved it. No one knows for certain how the fire started.

  What came next is not a legend. Three hundred Chicagoans were dead. Ninety thousand people were left homeless. Four square miles, including the whole business district, were leveled.

  A whole city burned, and the one character everybody remembers is a cow.
