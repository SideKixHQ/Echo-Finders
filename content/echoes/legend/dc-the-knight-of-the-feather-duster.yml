teaser: "The most famous ghost in America may owe everything to a man with a duster."
script: |
  Look across the lawn at the White House, at the windows of the upper floor. Somewhere up there, people say, Abraham Lincoln still walks.

  He is the most famous ghost in the most famous house in America. So where did the story come from?

  Possibly, from a man with a feather duster.

  Jerry Smith came to work here in the time of President Grant. He stayed for about thirty five years. Footman, butler, cook, doorman, and official duster. Reporters called him the Knight of the Feather Duster.

  On a slow news day, they knew where to find him. Jerry had a fund of ghost stories. He believed this house was haunted by the spirits of all the departed Presidents, and that the devil lived in the attic. He had to pass through that attic to raise the flag, and he was afraid of it.

  The noises up there turned out to be rats. The devil was a tale to keep Grant's daughter Nellie and her friends from playing in the attic.

  But Jerry said he had seen the ghosts of Lincoln, Grant and McKinley. They tried to speak to him, he said. All they could manage was a buzzing sound.

  This is a legend. Nobody has ever proved a word of it. But it outlived him. In the years after, a First Lady and a Queen of the Netherlands both said they had seen Lincoln too.

  Look up at the windows again.

  If Lincoln is up there, he may owe it to the man with the duster.
detail: >-
  Told as legend. The Association says the Lincoln legend "may have emanated" from Smith's stories; the script keeps that hedge. The Washington Times obituary (26 July 1904) says he first came to the White House in 1873 and that he feared the old attic, which he "stoutly affirmed was inhabited by the ghosts of departed statesmen". The Association says Grace Coolidge and Queen Wilhelmina "claimed" to have seen Lincoln; the script does not name them.
