certaintyNote: >-
  A legend, labelled as one in the script. Jerry Smith, his work and his stories are history (White House Historical Association; Washington Times obituary, 1904). That the Lincoln ghost story began with him is the Association's suggestion and is told as "possibly". The sightings are claims, and the script says so.
