script: |
  Look across the grass toward the river. Somewhere near here stood a huge elm, wider than it was tall. Its longest branch reached a hundred and fifty feet toward the water.

  Philadelphians will tell you that under that tree, William Penn sat down with the Lenape and made a treaty of friendship. A promise, an old writer said, pledged without an oath, and never broken.

  It is a legend. Even the man who collected it, John Watson, admitted it rested on tradition, not on any record. When everybody knew it, he said, nobody thought to write it down.

  But they believed it. Benjamin West, who played under this tree as a schoolboy, painted the famous picture of the treaty. And then he left the tree out.

  In the Revolution, British soldiers were cutting every tree they could find for firewood. A British commander, John Graves Simcoe, heard what this one was. He put a guard of soldiers around it, to keep off the axe.

  It survived the war. Then, on a Saturday night in March, eighteen ten, a wind that nobody thought was very strong wrenched it out of the ground. On Sunday, hundreds of people came to see it lying there. They counted its rings. Two hundred and eighty three.

  People carried off pieces. One became an armchair for Doctor Benjamin Rush.

  Look toward the river again. Nobody can prove a treaty was signed here.

  But an army once stood guard over a tree, just in case.
