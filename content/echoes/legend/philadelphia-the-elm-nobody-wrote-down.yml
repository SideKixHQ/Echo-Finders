certaintyNote: >-
  That Penn held a treaty with the Lenape under the great elm at Shackamaxon is tradition. John F. Watson, who collected it in 1842 and believed it, wrote that it "depends more upon the general tenor of tradition, than upon any direct facts." The tree itself is documented: it stood here, a British commander set a guard on it, and it blew down on 3 March 1810. The script says the treaty under the tree is a legend.
