script: |
  Pause somewhere the hotel allows visitors to stand.

  Listen.

  The Stanley’s ghost folklore includes children laughing in supposedly deserted hallways
  and piano music coming from an empty ballroom.

  Those stories appear in Colorado’s official tourism account.

  They are reported experiences, not proof that the dead are making music.

  The hotel is also associated with Stephen King, whose stay helped inspire The Shining.

  But the fictional hotel in that novel is not a documentary account of this building.

  Keep the two stories separate.

  Now consider the sound at the center of the legend.

  Music normally means somebody is nearby: a player at a piano, a guest rehearsing, a
  recording in another room.

  The story becomes unsettling when that expected person is missing.

  You hear the notes.

  You look for the musician.

  The room appears empty.

  At the Stanley, that gap between a sound and its visible source has become part of the
  hotel’s identity.

  The music is reported.

  The musician remains a matter of belief.
