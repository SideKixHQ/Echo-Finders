script: |
  This waterfront once belonged as much to sailors and taverns as to strolling visitors.
  One of its surviving legends concerns a formidable woman known as Gallus Meg.

  Local ghost-tour tradition associates her with the old Blue Post tavern and says her
  presence lingered after death. The historic tavern in this tale should not be confused
  with another business that now uses the Blue Post name.

  Meg's reputation belongs to folklore. The reported haunting is not proof that a spirit
  occupies a building, and the more lurid versions should not be mistaken for a documented
  criminal biography.

  Stand by the public street and let the river supply the atmosphere. A working port
  brings strangers together, then sends them away. Meg's story reverses that pattern: one
  waterfront character, storytellers suggest, never quite left.
