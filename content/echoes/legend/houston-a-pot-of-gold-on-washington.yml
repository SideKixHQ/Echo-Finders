teaser: "Everyone hunted for buried treasure in the marshes. It turned up under a gas station."
script: |
  Stand on this corner, where Houston Avenue meets Washington Avenue. Ordinary pavement. Traffic.

  Most of what you are about to hear is legend, and nobody has proved it. Except for one thing that happened here.

  For generations, the country around Houston was full of treasure tales. The pirate Jean Lafitte had sailed these waters, and people believed his men had hidden chests of coins. Others said there was Spanish gold, and Mexican gold.

  One story said the gold of General Santa Anna himself lay buried somewhere in the salt marshes along the San Bernard River. That story sent many people out digging. None of them found it.

  One lake was drained and dug out twice, looking for gold.

  Along the shore of San Jacinto Bay, where pirate ships once anchored, great holes were left in the ground by treasure hunters.

  And then, in nineteen twenty nine, workmen were putting up a filling station, at this corner.

  They dug up a pot of gold. It was estimated at two thousand dollars.

  The record does not say who buried it, or when. The find brought all the old stories back.

  Look down at the pavement.

  For once, the ground paid out.

