teaser: "A round stone tower on arches, and an argument that has run since at least 1851."
script: |
  Look at the round stone tower standing on its arches. People have been arguing about who built it for a very long time.

  The old story says Vikings. The tower has traditionally been linked with Viking explorers.

  That is legend, and it is not proven.

  By 1851 there was already a book about it, called The controversy touching the old stone mill.

  In 1911 another asked the question in its title. Did the Norsemen erect the Newport Round Tower?

  The building survey gives the likelier answer. It probably dates from the colonial period, and was the stone windmill built by Governor Benedict Arnold.

  Its wooden top was gone by 1740. Later it was used to store gunpowder, and then hay.

  Stand under the arches and pick your story. The likelier story has a governor's name attached to it.
