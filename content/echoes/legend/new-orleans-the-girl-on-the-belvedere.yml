teaser: "Look up at the little lookout on the roof."
script: |
  Look up at the top of the big house on the corner. The little lookout on the roof is called a belvedere.

  This is the house New Orleans has called haunted for more than a century. What follows is a legend. Nobody has ever proved a ghost here.

  The true part is bad enough. In April eighteen thirty-four, a fire broke out in the house that stood here, and the people who ran in found seven enslaved people in chains. The woman who held them, Madame Lalaurie, escaped to France.

  The ghost came later. City guides of nineteen hundred and nineteen-oh-four tell it the same way. A little girl, chased by her mistress with a whip, ran up and up the winding stairs to the belvedere, and leapt from the roof into the courtyard. On dark and stormy nights, they said, she is seen walking round and round up there, and her sobs are heard above the storm.

  They said no tenant could stay. Servants would not stay either, and the house to rent sign kept going back up on the balcony. One later owner turned it into a bar called the Haunted Saloon.

  Not everyone believed it. Henry Castellanos, writing in eighteen ninety-five, said the house had been rebuilt after the crowd wrecked it, and the belvedere was added then. He had talked to people who lived here. Nothing haunted them, he wrote, except memories.

  So the girl is said to walk on a lookout that was built after her story ends.

  The ghost is a legend. The cruelty that made people tell it is not.
