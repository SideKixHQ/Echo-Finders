certaintyNote: >-
  The ghost is told by the Picayune guides of 1900 and 1904 as something "said", with no witness
  named; Castellanos (1895), who spoke with tenants, denied any haunting, and a 1902 guide called the
  stories doubtful. The 1834 discovery of the chained captives is documented and is told in
  new-orleans-the-fire-in-the-kitchen; this echo keeps to the legend and says aloud it is unproven.
