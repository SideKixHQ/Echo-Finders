teaser: "A locked door, a dinner party, and a window."
script: |
  Look at the big house on this corner, where Tradd Street meets Orange. For a long time, Charleston pointed to it as the house Francis Marion fell from. Which house it really was is a legend, and nobody can prove it.

  The fall itself is in the histories. As a British army closed in on the town for the siege, Marion was at a dinner party. The custom then, one history says, was for the host to turn the key on his guests until they had done due honour to his Madeira and port.

  Marion was a small, spare man of sober habits, and he did not want to stay. So he tried to let himself down from a window. He misjudged the distance. One account says he broke his leg. Another says he badly dislocated his ankle.

  Either way, he was sent out of town to his home in St. John's to mend. So when Charles Town surrendered, he was not in it. He was one of three Continental officers who were not handed over. Tarleton would later call him the Swamp Fox.

  The historian who told the story in nineteen-oh-six added a doubt. Marion's fellow general, William Moultrie, remembered it as the house next to one on Friend Street, at the other end of this block.

  So this might not be the window. But somewhere along this block, a man climbed out of a dinner party and fell into history.
