certaintyNote: >-
  The murders, the skeletons in the cellar and the words on the gallows are legend, as printed in the 1941 state guide. The execution itself, on 18 February 1820 for highway robbery, is reported in Charleston news reprinted by the Alexandria Gazette and the New Hampshire Gazette. The National Park Service page says the Fishers were convicted of robbery and murder; the 1820 reports name only highway robbery.
