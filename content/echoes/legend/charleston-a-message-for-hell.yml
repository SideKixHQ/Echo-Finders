teaser: "The legend kept a curse. The paper kept something else."
script: |
  Look along Magazine Street to the Old Jail. The story told about one woman who was held in there is among the darkest in Charleston. It is a legend, and it goes like this.

  Lavinia Fisher and her husband John kept a tavern on the road out of town, the Six Mile House. Travellers who stopped there were robbed, or were never seen again. Skeletons, the story says, were found in the cellar. And on the gallows, she screamed at the crowd. If you have a message you want to send to hell, give it to me. I'll carry it.

  That is the legend. Here is what the Charleston paper printed the next day.

  John and Lavinia Fisher were executed yesterday, at two o'clock, for highway robbery. Highway robbery. That morning, John wrote a last letter from the jail, still saying he was innocent. At the gallows, he asked the crowd to forgive him for any wrong he had done them. Lavinia, the paper said, was unwilling to die.

  A little past two o'clock, the husband and wife embraced each other on the platform, for the last time. He was twenty nine. She was twenty eight. The crowd, the paper said, was immense.

  Look at the jail again. They waited in there, through the winter of eighteen twenty.

  The legend kept a curse. The paper kept an embrace.
detail: >-
  The Charleston report of 19 February 1820, reprinted in the New Hampshire Gazette (14 March) and the Alexandria Gazette (26 February), gives the crime as highway robbery and prints John Fisher's last letter, dated Charleston Gaol, 18 February 1820. The Six Mile House story, the skeletons and the gallows speech are as printed in the 1941 Federal Writers' Project guide, which says they were convicted of murder. Neither 1820 report contains the gallows speech.
