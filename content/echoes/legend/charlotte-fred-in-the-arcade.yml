teaser: "People who work in this old arcade say they hear footsteps when nobody else is here."
script: |
  Step in under the skylights.

  This arcade was built in 1914 for an industrialist named Edward Dilworth Latta. He wanted something like the covered arcades of London and Paris.

  People have been cutting through it ever since, on the quickest way between South Tryon and South Church Streets.

  What follows is a ghost story. It is told by the people who work here, and nobody can prove it.

  Employees and tenants say they have heard footsteps in the building at times when they were sure they were alone.

  They have given the walker a name. They call him Fred. And they believe, or hope, that he keeps the building safe.

  A local paranormal group says it heard a voice in one of the shops here. It said, she won't listen to me.

  And one tenant says that late one night she promised out loud to take care of the place. The glass of water on her desk cracked.

  Footsteps in an arcade are not strange. This one has been full of them for more than a century. It is only the footsteps with nobody attached that get a name.
