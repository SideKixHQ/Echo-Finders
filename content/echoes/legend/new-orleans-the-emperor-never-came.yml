teaser: "Look across at the old house on the corner, with the iron balconies."
script: |
  Look across at the three-storey house on the corner of Chartres and Saint Louis, with iron balconies on both street fronts and an old tile roof.

  It is called the Napoleon House. The story is that it was meant for Napoleon himself.

  In his last years, Napoleon was held prisoner on the island of Saint Helena. In New Orleans there were Frenchmen who still adored him. One of them was Nicholas Girod, a former mayor of the city, whose family built this house.

  The story goes that Girod and his friends paid for a fast ship called the Seraphine, signed on one of Jean Lafitte's old gunners as mate, and planned to sail to the island, take the emperor off by night, and bring him here.

  Then word came that Napoleon had died, in May eighteen twenty-one. The ship never sailed.

  Is it true? A city guide of nineteen-oh-four said there was every reason to believe it. A federal survey in nineteen fifty-five called it a popular legend.

  It is not even clear which house it is. That same guide gave the name Napoleon House to a different mansion altogether, near Canal Street, and expected it to be torn down that year. And the survey of nineteen fifty-five found two houses on this short stretch of Chartres Street, both going by the name.

  The emperor never came to New Orleans.

  But the city had more than one house ready for him.
