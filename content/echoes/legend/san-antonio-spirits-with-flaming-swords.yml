teaser: "An old Alamo ghost story says the dead would not let the walls come down."
script: |
  Look at the old stone walls of the Alamo, and ask yourself why they are still here.

  After the battle of San Jacinto in 1836, the Mexican general Andrade set out to destroy the Alamo.

  What follows is a legend. It is a folk tale, and nobody has ever proved a word of the ghostly part.

  The story goes that his men were met everywhere by spirits with flaming swords, who barred their way. Every time new men were sent to tear down the walls, they were overcome by fright. Threats and punishment could not make them go back.

  The spirits let them take away the guns. But the moment the walls were threatened, there was the flaming sword, in a ghostly hand.

  Adina De Zavala, who fought to save the Alamo, wrote the tale down in 1917. She added one fact you can check. The Alamo buildings were not destroyed, and not much injured by Andrade.

  The folk tale has a simple explanation for that. The soldiers were more afraid of the spirits than of their officers.
