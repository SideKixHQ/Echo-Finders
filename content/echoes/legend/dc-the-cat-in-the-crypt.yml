certaintyNote: >-
  A legend. Nothing in it is proven, and the script says so. The account of the Demon Cat comes from Jim Berard, a House committee spokesman who collected Capitol ghost tales, as reported by CBS News; NPR reported interns showing tour groups the floor marks as cat prints, and the Capitol's own staff treating the tale as a story. No guard's shot or death is documented.
