teaser: "Look down at the floor. Some people say those marks were made by a cat."
script: |
  Look at the floor in this small round room, ringed with columns. Tour guides like to point at a set of marks pressed into it. Cat prints, they say.

  This is a legend. Nobody has ever proved a word of it. But it is the most famous ghost in the Capitol, and it is a cat.

  The story goes back to the early days of the building, when cats were let loose down here to keep the rats down. One of them, they say, never left.

  It is called the Demon Cat. It is said to appear when the country is in trouble. It starts out as an ordinary cat. Then it grows. Bigger, and bigger, to an enormous size. And then, suddenly, it is gone.

  The legend says one guard fired his gun at it. Another, they say, was so frightened his heart gave out.

  None of that is in any record. When a reporter followed the student interns who give tours here, one told his group about the ghost cat, and the Senate's head curator, standing beside them, started laughing.

  Look at the marks on the floor again.

  Whatever made them is still not saying.
detail: >-
  Told as legend, with no claim that anything happened. Berard's tales were published in his history "The Capitol Inside & Out", as described by CBS. NBC's 2007 piece on pet ghosts names the Demon Cat as the one unfriendly feline ghost in the country, quoting a ghost-tour writer.
