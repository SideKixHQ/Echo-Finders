teaser: "Look up at the convent roof, and the small windows set into it."
script: |
  Look up at the convent roof, and the small windows set into it.

  The nuns who lived here belong to one of the oldest stories in New Orleans. In the early years of the colony, France sent young women across the ocean to marry its colonists. Each one came with a small chest of clothes. The French called them the filles à la cassette. In English, the casket girls.

  That much the old writers agree on. Almost nothing else.

  George Washington Cable, in eighteen eighty-four, has about sixty of them landing in the winter of seventeen twenty-seven, under the eye of the nuns, with a trunk for each girl, the gift of the king. He says those sixty were only the first company, and more came in later years. Grace King, eleven years later, has sixty girls too. She says they were the last.

  A city guide from nineteen-oh-four tells it differently again. Twenty girls, years earlier, each chosen by the Bishop of Quebec, each given a little chest as proof of her good character.

  Cable admitted the record was slender. The Creoles, he wrote, were never careful about checking their traditions.

  So the story kept growing. In recent years some tellers have added something none of the old writers ever mentioned. That the little chests carried vampires into the city, and that they are still up there, under this roof.

  There is no record of that. None. It is a legend built on top of a legend.

  The women were real. Their chests were real. And as far as anyone ever wrote down at the time, what was in them was clothes.
