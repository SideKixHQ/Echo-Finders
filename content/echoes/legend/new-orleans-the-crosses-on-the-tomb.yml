certaintyNote: >-
  Marie Laveau's death, burial in this cemetery and nursing work are from her 1881
  obituary. The voodoo-queen story, the serpent in the box and the idea that marking her
  tomb brings luck or a wish are folklore; the script says so out loud. No supernatural
  claim is made.
