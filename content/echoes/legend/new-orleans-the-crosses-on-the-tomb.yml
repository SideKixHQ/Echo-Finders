teaser: "Her obituary never used the word."
script: |
  Look through the gate. Somewhere in there is the tomb of Marie Laveau.

  Start with what the record says. When she died, in June of eighteen eighty-one, a New Orleans obituary was reprinted as far away as Omaha. It said she was buried at five in the evening in her family tomb in this cemetery, followed by a large crowd, the most prominent and the most humble.

  It called her a nurse. In yellow fever and cholera epidemics, it said, she was always called on, and always went. She sat with condemned prisoners in their last hours.

  The closest it came to anything else was one line. The ignorant, it said, credited her cures to unnatural means.

  It never used the word voodoo.

  Within a couple of decades, the guidebooks had a different woman. A voodoo queen, keeping a sacred serpent in a carved box in her bedroom. They give no source for any of it.

  The legend outgrew the nurse. In nineteen thirty-seven, a wire story reported that the bricks of her crumbling tomb were scratched with crosses, left by people who traced one, said a prayer, and slipped away. People still come hoping for luck. That is a custom built on a legend, not a fact.

  The gate is as close as this story needs to bring you. Please do not add a mark of your own.

  The nurse is in the record. The queen is in the scratches.
detail: |
  An 1898 New York Sun piece, reprinted in Savannah, follows two visitors led to the tomb
  by a local woman who tells them that anything you get in a cemetery will bring you luck.
