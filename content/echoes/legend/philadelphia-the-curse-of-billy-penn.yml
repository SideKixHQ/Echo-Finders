certaintyNote: >-
  The curse is a legend, told by fans and tour guides; nothing caused anything. What is on record: a long-observed gentleman's agreement on building height, One Liberty Place passing Penn's hat in 1987, the title drought, the figurine placed on the Comcast Center in 2007 by ironworkers including Dan Ginion, and the Phillies' 2008 World Series. The script says it is a legend.
