tags: [philadelphia, philadelphia-core, city-hall, william-penn, sports, legend, skyline]
teaser: "Nobody built above his hat for nearly a century."
script: |
  Look up at William Penn on top of City Hall. Then look west, at the glass towers that stand higher than his hat. This is a legend. Plenty of people here believe it anyway.

  For nearly a century, there was a gentleman's agreement. Nothing in Philadelphia would rise above Penn's hat. Then, in nineteen eighty seven, a tower called One Liberty Place went past him. And the city's teams stopped winning.

  Year after year, no championships. Some people blamed bad managers and bad draft picks. Others blamed Billy Penn. Fans dressed the statue in team jerseys. It did not help.

  In two thousand seven, a new tower was going up, taller than all the rest. Two ironworkers, Dan Ginion and John Joyce, were given a job. Fix a little William Penn to the highest beam. It was a tiny gift shop copy. The next year, the Phillies won the World Series.

  When an even taller tower went up, in twenty seventeen, the builders raced to get another little Penn on top. Nobody was taking any chances.

  Look up at him again. Dan Ginion, the ironworker, put it best.

  If there was a curse, it's not there anymore.
