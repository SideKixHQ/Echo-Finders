teaser: "The fuzzy guitar on one of the first great rock records may have come from a fall off a car roof."
script: |
  Three years before Elvis walked in, this same little studio made a record that pushed the blues toward rock and roll.

  In March 1951, a band drove sixty-one miles up from Clarksdale, Mississippi, to record here. Ike Turner was on piano. Jackie Brenston sang.

  The song was Rocket 88. And the guitar on it sounds wrong. Loud, and fuzzy, by accident.

  What follows is a legend. Nobody can prove it, and the people who were there did not agree.

  The story is that on the drive up Highway 61, the guitar amplifier fell off the roof of the car, and the fall wrecked its speaker. They plugged it in anyway.

  Ike Turner remembered it differently. He said it was the bass on top of the car that blew off. It was raining, he said, and they had a lot of trouble that day.

  They did not even expect to record. They were paid twenty dollars apiece.

  The same year, Bill Haley covered the song. That was three years before he made Rock Around the Clock.

  Maybe it was an amplifier. Maybe it was a bass. Either way, the legend says rock and roll began with something broken on the side of a highway.
