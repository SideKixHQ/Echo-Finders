script: |
  This story begins with a visitor’s claim.

  In the 1990s, Japanese psychic Aiko Gibo visited Mary King’s Close.

  According to the attraction’s account, she said she sensed a young girl in a room off
  Allan’s Close.

  The girl, she claimed, was called Annie and was distressed because she had lost her
  doll.

  Gibo brought a replacement.

  Visitors later began leaving toys of their own.

  Here is the important distinction: the attraction says its researchers have not found a
  historical record identifying a child named Annie as the girl in this story.

  The ghost is a legend, and its identity is unverified.

  The visitors’ response is real.

  People heard about a lonely child and wanted to offer comfort.

  Look around the room.

  Some ghost stories are built around a threat approaching from the dark.

  This story is built around something missing.

  A child without her family.

  A doll that could be replaced.

  A small act of kindness offered to someone nobody could prove was there.
