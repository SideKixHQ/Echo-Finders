teaser: "A former President collapsed in this room. Some say he is still trying to finish."
script: |
  Stand in this half round hall full of statues, under the great curved ceiling. Before it was Statuary Hall, it was the chamber of the House of Representatives.

  One of its members was a former President. After he left the White House, John Quincy Adams got himself elected to the House, and took a seat in this room.

  In eighteen forty eight, he was on his feet in this chamber, speaking against the war with Mexico. And he collapsed. A stroke. They carried him to a room just off the floor. He died there two days later. That much is history.

  What comes next is a legend. There is no proof of any of it.

  Capitol workers have told of hearing footsteps in here, when the hall is empty. Some say it is Adams. Some say they have heard an old man's voice, still trying to finish his speech.

  Stand still for a moment, and listen.

  If you hear footsteps behind you, nobody has ever proved whose they are.
detail: >-
  The collapse, the speech against the Mexican War and his death two days later are from the CBS News report; a reviewer should add a public record (the House's own history office was unreachable).
