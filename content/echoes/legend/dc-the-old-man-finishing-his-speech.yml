teaser: "A former President collapsed in this room. Some say he is still trying to finish."
script: |
  Stand in this half round hall full of statues, under the great curved ceiling. Before it was Statuary Hall, it was the chamber of the House of Representatives.

  One of its members was a former President. After he left the White House, John Quincy Adams got himself elected to the House, and took a seat in this room.

  In eighteen forty eight, during a debate in this chamber, he collapsed at his desk. A stroke. They carried him to a room just off the floor. He died there two days later. That much is history.

  What comes next is a legend. There is no proof of any of it.

  Capitol workers have told of hearing footsteps in here, when the hall is empty. Some say it is Adams. Some say they have heard an old man's voice, still trying to finish his speech. Others say it shouts one word. No.

  Stand still for a moment, and listen.

  If you hear footsteps behind you, nobody has ever proved whose they are.
detail: >-
  Second pass (2026-11-11): sources disagree on the moment of collapse. CBS says he was giving a speech against the Mexican War; the Architect of the Capitol says he had just voted "no" on a resolution and collapsed at his desk. The script now says only that he collapsed at his desk during a debate. The AOC places his death in the Speaker's Lobby and a 1919 newspaper feature in "one of the rooms adjoining the chamber". The shouted "no" is the AOC's version of the legend; the footsteps that seem to follow you are the 1919 feature's.
