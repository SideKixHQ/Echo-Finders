teaser: "Look along the avenue. Is it spelling something?"
script: |
  Look along the avenue of live oaks, and then across to the others.

  There is a legend about these trees. Treat it as just that. Every book that tells it calls it tradition.

  The land was first settled by a colonel named John Mulryne. In seventeen sixty one his daughter Mary married Josiah Tattnall, and the estate came to the Tattnalls.

  The avenues, the story goes, were planted around the time of that wedding. And they were planted in the shape of two letters. M, for Mulryne. T, for Tattnall.

  In eighteen ninety nine a Savannah book went further. Even at this late date, it said, you could trace the outline of the letters in the shape of the aisles between the trees.

  Nobody has ever produced the plan. So walk the avenues, and see whether you can find them.
