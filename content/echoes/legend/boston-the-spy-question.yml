teaser: "Look at the very top of Faneuil Hall. That is not a rooster."
script: |
  Look up at Faneuil Hall, at the little tower on the end nearest the harbour, and then at
  the very tip of it. That gold shape catching the light is not an arrow, and it is not a
  rooster.

  It is a grasshopper.

  It is about four feet long, hammered out of copper and covered in gold, and it has been up
  there since seventeen forty two. A craftsman named Shem Drowne made it, probably copying
  the grasshopper on the Royal Exchange in London.

  It has been knocked off by an earthquake. It has come down in a fire. In the nineteen
  seventies it was stolen, and after a week of searching it turned up hidden inside the
  tower it fell from.

  And there is a story about it that nobody has ever proved.

  The story goes that during the War of Eighteen Twelve, with Boston nervous about British
  spies, a stranger could be stopped and asked one question. What is on top of Faneuil Hall?

  Any Bostonian would know. A spy would have to guess.

  The National Park Service tells that one as a legend, and a legend is what it is.

  But stand here for a minute and watch the people walking past. Count how many of them look
  up.

  Then decide whether the question would still work.
