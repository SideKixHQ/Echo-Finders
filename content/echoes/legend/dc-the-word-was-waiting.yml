teaser: "Look through the doors of the Willard, into the lobby."
script: |
  Look through the doors of the Willard, into the lobby.

  There is a story about that room. The story goes that President Ulysses Grant coined a
  word here. Lobbyist. As in, someone who waits in a hotel lobby to ask a powerful man for
  something. Even the Library of Congress has passed it on, with the word reportedly.

  It is a good story. It is a legend, and the word is older.

  In July eighteen forty-nine, a newspaper in Portsmouth, New Hampshire, complained about a
  score of indefatigable lobbyists who kept up an untiring attack on lawmakers. Three years
  later, a Washington paper printed a speech warning that English lobbyists should be
  spurned from your halls.

  In the summer of eighteen forty-nine, Ulysses Grant was a young army officer who had been
  married for a year.

  Even the lobby is younger than the story. The Willard of Grant's day was replaced at the
  turn of the century, by the building in front of you.

  Grant did not invent the word. It was already here, waiting for him, like everyone else in
  the lobby.
