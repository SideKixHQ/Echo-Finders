script: |
  Somewhere in this town, in Nuttall and Mann's Saloon Number Ten, Wild Bill Hickok sat down to play cards for the last time.

  It was the second of August, 1876. He was shot and killed at the poker table by a drunken stranger.

  An old photograph of his monument names the killer as Jack McCall.

  Here is where the legend comes in.

  In 1938 a man in Nebraska told an interviewer from a government writers' project what he remembered of Wild Bill.

  He said he had watched him at target practice many times.

  And he said Wild Bill died because it was the first time he was ever known to turn his back to the door.

  That is legend, told by an old man long afterwards. It is not proven.

  He had a complaint about the movies too. On screen they gave Wild Bill a cross draw.

  In reality, he said, Hickok drew his gun straight up.

  Everybody remembers the door. Nobody can prove it.
