teaser: "She lived her whole life in one house. Some people think she is still at home."
script: |
  Find the brick house at number twenty nine East Fourth Street.

  Look at it closely. This is not a copy of an old house. It is the old house, inside and out.

  In eighteen thirty five, a merchant named Seabury Tredwell bought it. Five years later, his daughter Gertrude was born here.

  She grew up here. She grew old here. And in nineteen thirty three, she died here. More than ninety years, in one house. The city's archivists say she was born, and died, in the same upstairs bedroom.

  After she died, the house was bought and kept exactly as it was, as a museum. And soon, people began to say they had seen her.

  An old woman, most of the time. Sometimes a young one. Keeping watch over the family home.

  The New York Times, the archivists say, once called it Manhattan's most haunted house. There is no proof of any of it. It is a ghost story, and it is told by the people who look after this house.

  When the city made it a landmark in nineteen sixty five, it said the house had stood for a hundred and thirty years in its original state.

  Look up at the windows.

  She never moved out. Some people think she still hasn't.

