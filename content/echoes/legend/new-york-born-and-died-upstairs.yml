certaintyNote: >-
  The house, the Tredwells and Gertrude's birth and death in the house are documented in the Landmarks Preservation Commission's 1965 designation report. The sightings are told by the NYC Municipal Archives (2017) as "it is said", and the archive attributes the "most haunted house" label to the New York Times. The script says plainly that nothing proves the haunting.
