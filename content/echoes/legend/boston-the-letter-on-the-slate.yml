teaser: "One of these stones, the story goes, gave Hawthorne his idea. Nobody can say which."
script: |
  You are in the burying ground beside King's Chapel. John Winthrop, the colony's first
  governor, lies here.

  There is a story about this ground, and the park service tells it too. One of these
  gravestones, it says, inspired Nathaniel Hawthorne to write The Scarlet Letter.

  Treat that as a legend. No stone has ever been shown to be the one.

  But Hawthorne did put this ground in his book. He lodged his troubled minister in a house
  that stood where King's Chapel was later built, with the graveyard on one side.

  And at the very end, he buried Hester Prynne here. In his words, a new grave was dug in
  that burial ground beside which King's Chapel has since been built, near an old and sunken
  one. One slate stone served for both, carved with a shield.

  The novel closes on that shield. On a field, sable, the letter A, gules.

  Black field. Red letter.

  Look along the old slate stones. If one of them gave Hawthorne the idea, it has never said
  which.
