certaintyNote: >-
  A popular tradition. The National Park Service states that a gravestone here inspired The Scarlet Letter, but names no stone and cites nothing; no source we could reach records Hawthorne saying so. What is documented is the novel's own text, which sets its ending in this burying ground. The script says out loud the stone story is a legend and unproven.
