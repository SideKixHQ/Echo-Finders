teaser: "A stranger built a staircase here that nobody else could, then left without his pay. That is the legend."
script: |
  This is a legend, and you should hear it that way.

  Inside this chapel, with its pointed Gothic arches, is a spiral staircase twenty feet high. When the chapel was finished, around 1878, there was no way at all to get up to the choir loft.

  According to tradition, a carpenter appeared. Nobody knew his name. He built the staircase, and then he vanished, without ever being paid.

  The staircase has no central column. It is held up by a curved stringer, and pinned together with wooden pegs instead of nails. People called it miraculous. The Sisters of Loretto, whose chapel it was, insisted the builder was Saint Joseph himself.

  That is the legend, and it has never been proven. The evidence points somewhere more ordinary. Recent research suggests a French master carpenter, Francois-Jean Rochas.

  Still, a stranger who builds a staircase nobody else could build, and leaves without his wages, is a very good story. You can see why the sisters preferred theirs.
