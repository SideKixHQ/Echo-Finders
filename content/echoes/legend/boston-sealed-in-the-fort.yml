teaser: "The soldiers told a story about a man sealed into the walls. One private wrote it down, years later."
script: |
  Walk along the granite walls of Fort Independence. In eighteen twenty seven, a private was posted here under a false name. Edgar A. Perry. He had lied about his age as well.

  He was really Edgar Allan Poe. Eighteen, broke, and five months from sailing south with his battery.

  This is a legend, and here is how it goes.

  The soldiers at the fort told a story from ten years before. On Christmas Day, eighteen seventeen, two lieutenants quarrelled over a game of cards. They fought a duel. The less popular one killed the other.

  The dead man's friends wanted revenge. So, the story goes, they got the killer drunk, led him into a chamber, and sealed him inside. And left him there to die.

  Nearly twenty years later, Poe published his own version of the tale, set in Italy. The Cask of Amontillado.

  Was any of it true? The man said to have been walled up, Gustavus Drane, was real. He did not die that way.

  The walls in front of you were rebuilt after Poe left. The story was not. He took it with him.
pronunciations:
