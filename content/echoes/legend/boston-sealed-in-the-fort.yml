certaintyNote: >-
  The walling up is a legend. The National Park Service tells it as "the story" Poe heard at the fort and says it is "believed to have inspired" The Cask of Amontillado. WBUR (2024) names the duellists as Gustavus Drane and Robert F. Massie and says Drane "was a real person" but "didn't actually meet his end this way". CBS Boston calls the tale "not entirely true". Poe's service at the fort under an assumed name is documented by the park service. Its two pages disagree on the year he enlisted (1826 on the Castle Island page, 26 May 1827 on the Poe page); the script follows the Poe page.
