# Listening spot: The path around the granite walls of Fort Independence, Castle Island, South Boston. State park, open year round; the fort's interior opens only on scheduled days.
# Position: About 80 m south west of the Overture "Fort Independence" point, on the walking loop outside the walls (medium confidence).
