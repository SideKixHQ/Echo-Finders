detail: >-
  The National Park Service page on Castle Island gives Poe enlisting as "Edgar A. Perry", his five months on the island, the 1817 duel over a Christmas Day card game, the less popular lieutenant killing the other, the friends sealing the killer in a vault, the 1846 story it is believed to have inspired, and the rebuilding of the fort from 1833. The park service page on Poe gives his enlistment on 26 May 1827 under an assumed name, his lie about his age (he claimed 22 and was 18), Battery H at Fort Independence, its orders south on 31 October 1827, and that he was unable to support himself. WBUR (2024) gives Drane and Massie, the drink and the chamber, the story set in Italy, and that Drane did not die this way. CBS Boston gives the five months and "not entirely true". Male narrator per casting for legend.
