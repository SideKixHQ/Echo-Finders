teaser: "You feel someone sit down beside you. The seat stays empty."
script: |
  Look at the old opera house on the corner of Broad and Locust. It was built to look like La Scala, in Milan. It opened in eighteen fifty seven, with an opera by Verdi, Il Trovatore. It has been an opera house ever since. No opera house in the country has been one for longer.

  It has seen a lot. In eighteen seventy two, Ulysses Grant was nominated in its hall for his second term as president. In eighteen eighty six, President Grover Cleveland threw an extravagant party here for his new bride.

  Now, this next part is a legend.

  The story goes that up in the high balconies, people have seen a man dressed in black. Nobody knows who he is.

  And there is something else. Women sitting up there, next to an empty seat, have felt somebody sit down beside them. Some say they have been pinched. Some say their hair has been pulled.

  Nobody can prove any of it. But a theatre is a place full of people sitting in the dark, close together, not looking at each other.

  Next time you are up in the balcony, and the lights go down, look at the empty seat beside you.

  Then look again.
