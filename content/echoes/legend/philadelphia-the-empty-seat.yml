  The haunting is lore, reported in a CBS Philadelphia guide to haunted places: a "man in black" in the upper balconies, and women who feel someone sit down in the empty seat beside them. What is documented: the Academy opened in 1857 with Verdi's Il Trovatore, was designed after La Scala, and is the oldest opera house in the country still used for its first purpose. The script says the ghost is a legend.
