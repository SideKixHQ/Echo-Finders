teaser: "A light in a window. A man who thought it was a signal."
script: |
  Look at the old stone house near the water. It was built in the sixteen eighties, when this was a manor in the country.

  In September, seventeen seventy six, Benjamin Franklin and John Adams came here, to talk peace with the British admiral, Lord Howe. It came to nothing. The Americans would not give up their independence.

  The man who owned this house was Colonel Christopher Billopp. He was the leader of the Tories on Staten Island. Loyal to the king.

  Now, the legend. There is no record of any of this. People have simply told it, for a very long time.

  During the war, the story goes, Billopp was kidnapped by Patriot soldiers. Two months later, he came home. And he was certain that someone in his own house had helped them. A servant girl. He believed she had signalled the soldiers, with a lantern in the window.

  Then one night, he saw her light a lantern, and set it in the window.

  And the story says he went mad, and pushed her down the stairs. And she died.

  For years, neighbors have said they hear it. A man shouting. A woman screaming. And something falling, down the stairs.

  Look at the windows that face the water.

  Nobody knows her name.

