certaintyNote: >-
  The house, its date, the 1776 peace conference and Colonel Billopp as the island's Tory leader are in the Landmarks Preservation Commission's 1967 designation report. The kidnapping, the lantern, the death on the stairs and the sounds neighbors report are told by the NYC Municipal Archives (2017) as "it is said". No record of the servant's death is cited anywhere we could reach, and the script says so.
