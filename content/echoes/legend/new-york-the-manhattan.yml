certaintyNote: >-
  An origin legend, not established fact. The Federal Writers' Project guide of 1939 says only that the Manhattan cocktail "is said to have originated" at the Manhattan Club, then on this corner. It gives no date or evidence. The script says out loud that the story is unproven.
