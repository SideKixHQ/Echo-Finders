teaser: "A famous cocktail, a famous club, and a story nobody can prove."
script: |
  Look at the corner across the avenue from the park. In nineteen thirty nine, a gentlemen's club stood here, the Manhattan Club, once the headquarters of the city's Democratic leaders.

  And the city guide passed on a story about it. The Manhattan cocktail, it said, is said to have originated there.

  Said to have.

  This is a legend. The guide gave no date, and no proof.

  But somewhere, someone mixed the first one, and gave it the name of this island.

  Raise a glass to the corner, if you like.

  It might even be the right one.

