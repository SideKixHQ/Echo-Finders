certaintyNote: >-
  The death, the trial, the defence lawyers and the verdict are documented: the Law Library of Congress (2026, drawing on William Coleman's 1800 trial report) and the NYC Municipal Archives (2017) agree on them. The haunting is told by the Municipal Archives as "it is said", and the script says out loud that it cannot be proved. The archive's post gives her name as Juliana Elmore Sands; the Library of Congress and the trial report call her Gulielma "Elma" Sands, which the script uses.
