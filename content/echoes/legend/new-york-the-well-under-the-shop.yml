teaser: "Hamilton and Burr were on the same side once. This is where it started."
script: |
  Look at the building at number one twenty nine Spring Street. A shop, with clothes in the windows.

  Somewhere below it, in the basement, there is a well.

  Go back to the winter of seventeen ninety nine. This was not a street. It was open ground at the edge of the city, called Lispenard's Meadow.

  On the twenty second of December, a young woman named Elma Sands left her family's boarding house. She told her cousin she was going to marry one of the boarders that night. His name was Levi Weeks.

  Eleven days later, her body was pulled from the bottom of a well, in this meadow.

  Weeks was charged with her murder. His brother hired the most famous lawyers in New York to defend him. Aaron Burr. And Alexander Hamilton.

  Burr told the jury she had not been murdered at all.

  The jury took five minutes. Not guilty. Weeks left the city, and no one else was ever charged.

  So the case never closed. And the story goes that she never left. For more than two hundred years, people have said Elma Sands still haunts this building, looking for justice. Nobody can prove it. That is why it is a legend.

  The well is real. When the city's archivists wrote about it, it was still down there, in the back of the shop, guarded by two mannequins.

  Look at the door.

  Hamilton and Burr were on the same side, once.

