teaser: "If you were poor and went into Bellevue, people said, you might meet the black bottle."
script: |
  Look at the hospital in front of you. Bellevue. Its story goes back to seventeen thirty six, and the city's guide called it the oldest general hospital on the continent.

  For a long time, the poor of this city were afraid of it. And they had a name for what they feared.

  The Black Bottle.

  This is a rumor. Nobody ever proved it. Here is what people said.

  If you were poor, and you ended up in Bellevue, and you were trouble, the hospital kept a black bottle. A dose from it, and you would not be trouble any more.

  It was not true. By nineteen thirty nine, the city's guidebook was calling it a superstition, and nearly gone.

  But the fear did not come from nowhere. In the cholera summer of eighteen thirty two, the guide said, very few who entered Bellevue came out alive. There were times when the nurses were women prisoners, untrained, sent in from the jails. And a hospital that took in the poorest people in the city had, the guide said, a high death rate.

  So a story grew to hold the fear.

  Look at the doors.

  The bottle was never real. The thing it stood for was.

