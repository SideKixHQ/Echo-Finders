certaintyNote: >-
  A rumor told among the poor, not history. The Federal Writers' Project guide of 1939 calls the "Black Bottle", said to be used to do away with troublesome patients, one of the "once popular superstitions" about Bellevue. Nothing supports it. The same guide reports as fact that very few cholera patients who entered Bellevue in 1832 recovered, and that untrained female prisoners once served as nurses there. The script says out loud that the bottle is a rumor.
