tags: [new-york, west-village, legend, graveyard, france, dauphin, playground]
teaser: "Kids play ball where a king was said to be buried. One word on a stone started it."
script: |
  Look across the fence at the playground and the ball field. Swings. Benches. Somebody's lost glove.

  Before the eighteen nineties, this was a graveyard. And people here will tell you that a king is still under it.

  This is a legend. Nobody has proved a word of it.

  It starts in France. The Dauphin was the title of the heir to the French throne. One of them was lost in the French Revolution, as a boy.

  And then he kept being found. For years, men turned up claiming to be him. New York's own guidebook, in nineteen thirty nine, called him the oft found lost Dauphin of France.

  And here is the New York version. Somewhere in this old graveyard, the story goes, they buried him. Over him, they put a stone with just one word on it.

  Leroy.

  Say it slowly. Le roi. The king.

  The graves are gone now. So listen to the shouting from the ball field.

  It might be the noisiest royal tomb in the world.

