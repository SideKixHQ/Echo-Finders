certaintyNote: >-
  A legend, not history. The Federal Writers' Project guide of 1939 reports only that "it is claimed" the lost Dauphin of France was buried in the graveyard here, under a stone reading Leroy. No record proves it, and the guide itself calls him "the oft-found lost Dauphin". That the playground was converted from a graveyard in the 1890s is documented in the same guide. The script says out loud that it is a legend.
minAge: 0
