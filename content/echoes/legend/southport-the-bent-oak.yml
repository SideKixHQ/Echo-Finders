teaser: "An old oak here grows in the shape of an upside down U. There is a story about who bent it."
script: |
  Look for the old live oak in this little park. It grows in the shape of an upside down U.

  It is called the Indian Trail Tree, and it is estimated to be about eight hundred years old.

  What follows is a legend. Nobody can prove it, and it might not be true.

  The story is that when the tree was a sapling, Native people bent it over, and it took root in the ground again.

  Bent like that, it marked their trail down to the fishing spots.

  A local gallery owner told Our State magazine it is a neat place to go and think about how old this little area really is.

  Whatever bent it, the tree kept the shape. Eight hundred years is a long time to hold a pose somebody else gave you.
