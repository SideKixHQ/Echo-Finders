tags: [houston, first-ward, jefferson-davis-hospital, elder-street-lofts, cemetery, ghosts, legend]
teaser: "The basement of this hospital is above the ground. The ground was already taken."
script: |
  Look at the old brick hospital on its rise, with the columns at its front door. Now look at the bottom floor.

  It is not below ground. The basement was built above it.

  Because the ground was already full.

  The building is history. The ghosts are legend. Here is the history first.

  From eighteen forty, this hill was the Houston City Cemetery. It took the dead until the eighteen eighties. Confederate soldiers lie here, and victims of yellow fever. Thousands of graves.

  In nineteen twenty four, the city and the county built a charity hospital on top of it. There was no widespread removal of the graves. So the builders went up, instead of down.

  At the request of Confederate veterans and their families, it was named for Jefferson Davis, for the men in the ground beneath it.

  It was a hospital for only thirteen years. Then a psychiatric hospital. A juvenile detention ward. A food stamp office. A records store. Then nothing. For years it stood empty and fenced off, rotting in plain view of the freeway.

  That is when the talk began. Soldiers in the wards, people say. Doctors, nurses and patients. Nobody has proved any of it.

  In two thousand five, the old hospital became homes for artists. A spokeswoman said the ghosts had been replaced by muses.

  Look at the bottom floor again.

  The basement is above ground. The cemetery is not.

