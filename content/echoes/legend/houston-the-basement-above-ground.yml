certaintyNote: >-
  The cemetery, the graves left in place, the raised basement and the hospital's history are documented by the Texas Historical Commission marker and the Handbook of Texas, and the Houston Chronicle (2013) reports thousands of graves on the site. The haunting is legend: the Chronicle reports the building's reputation and the claim that soldiers, doctors, nurses and patients walk it, and nobody has proved it. The script says which part is which.
