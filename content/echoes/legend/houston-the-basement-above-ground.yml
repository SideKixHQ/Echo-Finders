# Drafted by Claude Code (2026-11-11) for Houston, First Ward: legend over documented history. Second pass.
# Listening spot: the public sidewalk on Elder Street outside the old Jefferson Davis Hospital, now the Elder Street Artist Lofts, 1101 Elder Street, built in 1924 over the 1840 Houston City Cemetery (Texas Historical Commission marker, Atlas 5507015523; Handbook of Texas). It is now homes: the echo is heard from the street.
