teaser: "A wall to keep the girls in. Or one girl, anyway."
script: |
  Look at the iron gates. In the middle, two spears meet at the centre of a broadsword, and make a cross. Now look at the high brick wall the gates are set in.

  This is a legend, and it is about that wall.

  Behind it, long ago, there was a famous school for girls. Its mistress was Madame Talvande. She had escaped the massacres in Saint Domingue, and in Charleston she kept a school.

  And one of her pupils, the story goes, eloped.

  So up went the wall.

  A Charleston history of nineteen seventeen told the tale, and could not resist a joke. It seems strange, it said, that she thought brick and mortar could keep apart ardent young Carolinians. Nevertheless, it said, tradition tells of only one elopement.

  So maybe the wall worked.

  Look through the gates at the garden, and the path behind them. The wall still keeps most of it hidden.

  Exactly as it was meant to.
detail: >-
  Smith and Smith (1917) describe the wall and gate around the ground of a famous girls' school kept by Madame Talvande, who escaped the massacre in Saint Domingue, and the elopement that tradition says led to the wall. The 1941 Federal Writers' Project guide dates the Sword Gates to 1815 to 1820 and describes the spears meeting at a broadsword to form a cross.
