certaintyNote: >-
  The elopement is tradition. Smith and Smith (1917) say an elopement "is believed to have led to the building of the wall" and that "tradition tells of but one elopement"; no name or date is given there. The school of Madame Talvande, a refugee from the massacres in Saint Domingue, and the gates' date and design are documented in the 1917 and 1941 sources.
