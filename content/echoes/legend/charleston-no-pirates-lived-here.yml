teaser: "The pirates are real. The pirate house is not."
script: |
  Look at the little stucco house with the red tile roof and the curving eaves. It has a name on the tourist maps. The Pirate House.

  This is a legend, and here is how it goes. In the early seventeen hundreds, when pirates raided the Carolina coast, this was where they met. Their headquarters, right on Church Street.

  The pirates were real. In seventeen eighteen, many of them were captured off this coast, tried in Charleston and hanged.

  But the state's own guidebook, in nineteen forty one, looked at this house and said plainly that the pirate story was apparently a modern myth, entirely unconfirmed by historical research.

  What it believed instead is quieter. The house was probably built by French Huguenots, the Protestant refugees whose church still stands around the corner. One writer said it looked like a French village. Stucco walls, tinted and chipped, red tile roof and all.

  And some of what makes it look so old is not old at all. The doorways, the roof and the dormers were remodelled in the nineteen twenties.

  Look at the roof again.

  The pirates were real. Their house was not.
detail: >-
  The 1941 Federal Writers' Project guide, Charleston point of interest 40: the Pirate House at 145 Church Street, an antique shop and tea room, Julian Street's description, the 1920s remodelling, the belief that Huguenots built it, and its judgement that the pirate story is a modern myth. The 1718 pirate trials and hangings are from Smith and Smith (1917), who mention the pirates captured by Governor Johnson and Colonel Rhett in 1718 and 1719. The listener is pointed to the French Huguenot Church nearby, which has its own echo.
