certaintyNote: >-
  That Miller died in a duel is tradition, which Gamble (1923) calls "so often merely the mother of 'historical' lies", though he thinks the silence of the newspapers supports it. The facts from the city burial book (age, birthplace, trade, the head wound on July 13, 1831) and the chipped inscription are documented by Gamble; who fired, and why, is unknown.
