teaser: "The stone told you who killed him. Then somebody took a chisel to it."
script: |
  Look for a heavy granite slab lying flat on the ground. Read the inscription, and look for the place where the letters stop making sense.

  Somebody has chipped a name out of it.

  The man under the slab was Odrey Miller. The city's old burial book says he was thirty three, born in Kentucky, a horse trader, who lived on State Street. On the thirteenth of July, eighteen thirty one, he was wounded in the head. Three doctors tried to save him. He was buried the next day.

  His stone once named the man who killed him, cut deep. And then someone, perhaps connected with that man, came with a chisel and took the name off.

  Not one newspaper in town mentioned his death. Tradition says that is the clue. A murder would have been reported. A duel, a matter of honour, was not.

  So the legend goes like this. A quarrel over a horse, or a race. A meeting at dawn. A hospital, a grave, all in a few hours. Nobody can prove a word of it.

  Look at the chipped place again.

  Whoever erased the name made sure nobody would ever forget there was one.
detail: >-
  Gamble (1923), "Who Slew Odrey Miller? A Mystery of Savannah's Old Cemetery": the slab, its place, the chipped name, the burial book, the three doctors (Daniell, Arnold and Richardson), the newspapers' silence, and his speculation about horses and racing. "Perhaps connected with that man" condenses Gamble's "removed by some one connected with him". The script calls the duel a legend and the horse quarrel a guess, as Gamble does.
