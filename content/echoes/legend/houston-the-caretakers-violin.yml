tags: [houston, downtown, julia-ideson-building, library, ghosts, legend]
teaser: "Some nights, after closing, people say the old library plays the violin."
script: |
  Look up at the old library, built in the Spanish Renaissance style, and find the top row of windows. Three floors up.

  Some nights, people say, there is music up there after closing. A violin. And the click of a dog's claws on the tile.

  This is a legend. Nobody has proved a note of it.

  The building went up in the nineteen twenties as Houston's central library. Its librarian, Julia Ideson, ran the library for more than forty years. The building carries her name now.

  But the man in this echo lived in the basement. Jacob Frank Cramer. An elderly man, the caretaker. He walked the night rounds with his German shepherd, Petey, at his heels.

  In the evenings, the story goes, he climbed to the third floor, with Petey beside him, and played his violin.

  In November, nineteen thirty six, the librarians found him dead.

  And then the reports began. A violin, somewhere in the building, late at night. Sheets of music found scattered. The tick of a dog's nails, crossing a floor where no dog was.

  Look at the top windows again.

  Julia Ideson got her name on the building.

  The caretaker kept the night shift.

