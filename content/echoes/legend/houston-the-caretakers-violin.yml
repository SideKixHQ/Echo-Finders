certaintyNote: >-
  A ghost story, not history. The caretaker, his dog, his evening violin and his death in November 1936 are as the Houston Chronicle reported them in 2015 and 2017; the music, the scattered sheets and the clicking claws heard since are the legend, and nobody has proved them. The building and the librarian come from the Handbook of Texas. The script says out loud that it is a legend.
