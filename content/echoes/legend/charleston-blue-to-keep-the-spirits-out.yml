certaintyNote: >-
  This is folklore, recorded as belief. The 1941 Federal Writers' Project guide reports that along this road doors and shutters were often painted blue to keep away spirits, and that travellers recalled "ha'nts" and the "plat-eye"; elsewhere in the same guide, the plat-eye is described from Lowcountry belief as a fiery eye or an animal that pursues anyone who steals from a grave. None of it is presented as fact. Whether blue paint is still common here today is not in this source; the script does not claim it.
