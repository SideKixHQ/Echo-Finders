teaser: "Why paint a door blue? So nothing that is not alive can come through it."
script: |
  If you see a door or a window shutter painted blue along this old road, look at it twice. In the Lowcountry, that blue has a job.

  This is folklore, and it has been told here for a very long time.

  In nineteen forty one, the writers of the state guide drove this road into Charleston. They wrote that doors and window shutters were often painted blue to keep away spirits.

  Spirits of what kind? They named two. The ha'nts, the restless dead. And the plat eye.

  Further down the coast, the same guide described the plat eye. It might be a fiery eye, it said, or some sort of animal. And it never vanishes until vengeance is achieved. Its business was with anyone who stole from a grave.

  And at night, the guide said, in the swamps beside this road, a traveller remembers the ha'nts and the plat eye, as he sees the jack o' lantern lights, and hears bull alligators bellow.

  Nobody can prove a spirit stays outside a blue door.

  But nobody painted it blue by accident.
detail: >-
  The 1941 Federal Writers' Project guide, Tour 1b on US 17 from Georgetown to Charleston, records the eeriness of the swamps at night, the "ha'nts" and "plat-eye", jack-o'-lanterns and bull alligators, and doors and shutters painted blue to keep away spirits. Its St. Helena Island tour describes the plat-eye as "a fiery eye or some sort of animal that never vanishes until vengeance is achieved", pursuing anyone who steals the possessions left on a grave. The guide's wording about the people who held these beliefs is of its time and is not repeated.
