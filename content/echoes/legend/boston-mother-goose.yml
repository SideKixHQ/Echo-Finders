teaser: "Some visitors come here for Hancock and Revere. Some come for Mother Goose."
script: |
  You are in the Granary Burying Ground. John Hancock and Paul Revere are buried here. But one
  name draws a different kind of visitor. They are looking for Mother Goose.

  What follows is a legend, and a disputed one.

  The family story goes like this. In sixteen ninety-two, a widower named Isaac Goose married
  Elizabeth Foster. Her daughter, also Elizabeth, married a Boston printer, Thomas Fleet. And
  Fleet, the story says, printed the rhymes she sang to her grandchildren, and named the
  collection for her.

  Even the grave is a puzzle. A Boston paper reported that the stone people call Mother
  Goose's belongs to Isaac's first wife, Mary, who died in sixteen ninety. Elizabeth was
  buried here too, but her stone is not standing.

  And one Boston antiquary, William Whitmore, went further. He argued that Mother Goose was
  not Elizabeth at all, and that the name did not even start in Boston.

  So she may not be here. People still come looking.
