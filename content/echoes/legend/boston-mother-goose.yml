certaintyNote: >-
  A Boston tradition, not established fact. A Boston Transcript item reprinted in 1920 gives the family
  tradition and says the stone shown is Mary Goose's; a 1908 guidebook reports the antiquary William H.
  Whitmore's argument that Mother Goose was not a Boston woman at all. The script says out loud it is a
  legend and disputed.
