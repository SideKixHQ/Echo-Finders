teaser: "One night a year, the old guides said, this water had visitors."
script: |
  Look along the water of Bayou St. John.

  The old guidebooks said that on one night of the year this bayou had visitors. What follows is legend. The guides wrote it from rumor and old memory, and none of them names anyone who was there.

  The night was St. John's Eve, in June, the great festival of the Voudous. Once the police kept too close a watch on Congo Square, a guide of nineteen-oh-four said, they came out here instead, to the banks of the bayou where the water met the swamp. They put up their altars, it said, and danced the Dance of the Serpent around a boiling pot.

  The guide of nineteen hundred tells the same story but sends Marie Laveau and her followers to the shore of Lake Pontchartrain.

  Henry Castellanos, writing in eighteen ninety-five, said the yearly feast near the bayou, with reporters and the police invited, was only a device to fool the unwary. Her real meetings, he wrote, were held somewhere else, out on the lakeshore.

  Decades later, a wire story was still calling St. John's Eve the greatest of all days for voodoo.

  So the legend keeps moving. The water stays where it is.
