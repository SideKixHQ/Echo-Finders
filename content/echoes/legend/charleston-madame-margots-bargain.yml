teaser: "Somewhere behind this block was a lane named for two lilac trees."
script: |
  You are standing beside a city block bounded by King, George, St. Philip and Calhoun streets. Somewhere in the middle of it, a Charleston writer said, there once ran a narrow passage called Lilac Lane. This is a legend, and nobody can prove it.

  The writer was John Bennett. He told the story of a milliner he called Madame Margot. That was not her real name. He changed it on purpose.

  She was born here, he wrote, to refugees from San Domingo. Her shop was on the fashionable west side of King Street, a little above the Bend. Her cottage was in Lilac Lane, named for two Indian lilac trees at the George Street entrance.

  She became rich. Very rich. Plantations in the country, houses in town. And the town explained it the old way. People said she had made a bargain with the Devil.

  Bennett insisted the story was a genuine folk legend, not his invention. But he also wrote what he believed was underneath it. She had made her money by wise purchases of real estate. Popular superstition, he said, did the rest.

  By his time, the lane was already gone. Trees, passage, cottage and gardens, he wrote, all have disappeared together.
