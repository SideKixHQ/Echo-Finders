certaintyNote: >-
  The marriage of the officer John Teasdale to a daughter of the Verree family, and his house at the head of East Battery built about 1779, are given by Ravenel (1906) as recorded. The slippers, the rosettes and the dialogue are family legend; Ravenel marks them with "the legend says". The secret chamber behind the tiles is Ravenel's report of a discovery shortly before 1906. Which present building is the Teasdale house is not confirmed.
