teaser: "She fought the occupation with her shoes."
script: |
  Stand where East Bay Street turns into East Battery, and look along the old sea wall. Under your feet, somewhere, are the foundations of a bastion from the town's old walls.

  During the British occupation of Charleston, there was only one marriage recorded between an officer of the King and a rebel lady. This is its legend.

  He was John Teasdale, an officer quartered on a Huguenot family with rebellious principles. The daughter of the house was pretty and clever. He fell in love. She teased him.

  Her little slippers, the legend says, were always trimmed with rosettes of blue and buff. The colours of the American army. Always in full view of the red coated lover.

  He hated them. He begged her to pull off those ugly bows. So she stuck her feet out further. But always, the legend says, in a ladylike way, not showing more of the ankle than was proper.

  He could not tear himself away. By great perseverance, he won her.

  He stayed, and built a house here, at the head of East Battery, on the old bastion. Long after, someone lifted the tiles of a fireplace in it, and found a secret chamber. It was empty.

  He became a prosperous Charleston merchant.

  She kept her colours. He kept her.
detail: >-
  Ravenel (1906), Deliverance chapter: the single recorded marriage between an officer and a rebel lady, John Teasdale quartered on the Verrees, the rosettes of blue and buff with "the legend says", his words "pull off those ugly bows", "by great perseverance won her", the house built about 1779 at the head of East Battery on the Granville bastion, the secret chamber found behind the chimney tiles, and his career as a merchant. That blue and buff were the American colours is general knowledge, not stated by Ravenel.
