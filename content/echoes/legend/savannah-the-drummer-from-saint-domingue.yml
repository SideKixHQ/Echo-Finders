certaintyNote: >-
  The San Domingo ship is a legend recorded by the Black writers of the Federal Writers' Project in 1937. That a twelve year old Henri Christophe drummed at Savannah is widely told and is given here as the story told. The Chasseurs-Volontaires' part in the 1779 attack is documented.
