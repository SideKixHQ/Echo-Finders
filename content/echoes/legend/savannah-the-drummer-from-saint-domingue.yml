tags: [savannah, savannah-core, franklin-square, revolution, haiti, siege-of-savannah]
teaser: "The legend had a ship of Black soldiers. The record has five hundred."
script: |
  Find the bronze soldiers of the Haitian Monument, here in Franklin Square. There is an old story in Savannah, written down in the nineteen thirties by the Black writers of a federal project. A ship of Black men from San Domingo, it said, came up this river and conquered the Spanish on the coast, long before Oglethorpe. It is a legend.

  But men from Saint Domingue did come up this river. In seventeen seventy nine, the Americans set out to take Savannah back from the British, with French and Haitian allies. More than five hundred free Black men from Saint Domingue, the island we now call Haiti, joined the fight. They were one of the few Black regiments to fight on the American side in the whole Revolution. The attack failed. It was one of the bloodiest battles of the war.

  And there is a story told about one of them. Among the soldiers, it is said, was a twelve year old drummer named Henri Christophe. Years later, he made himself king of Haiti. Whether the boy was really here is part of the legend.

  Look at the bronze figures again.

  The legend had one ship of Black soldiers coming up this river. The record has five hundred.
detail: >-
  The Library of Congress catalog record for Carol M. Highsmith's photograph identifies the monument and the Chasseurs-Volontaires de Saint-Domingue. The figure of 500 is the Boston Globe's; other accounts give larger numbers. Christophe's presence at Savannah is commonly told and not settled.
