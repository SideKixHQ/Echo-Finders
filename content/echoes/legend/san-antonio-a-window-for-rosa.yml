teaser: "The most famous window in Spanish Texas comes with a love story nobody can prove."
script: |
  Look for the carved stone window on this church, framed in swirling stone. It is called the Rose Window.

  It is known as the finest example of Spanish Colonial ornament in the United States. Nobody knows for certain who carved it, or what it means.

  So a story grew to fill the gap. This is a legend, and it has never been proved.

  The folklore says it was carved by Pedro Huizar, a carpenter and surveyor from Spain, as a monument to his sweetheart, Rosa. Rosa set out from Spain to join him, and on the way, she was lost at sea. Pedro finished the window anyway, as a declaration of love that would not end.

  There is a less romantic idea. The window may be named for Saint Rose of Lima, the first saint of the New World.

  Either way, people stand here and look at it the same way. As if somebody made it for someone.
