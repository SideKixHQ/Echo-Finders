script: |
  Look up at the lighthouse.

  Before the tower was completed, this was a construction site where children sometimes played.

  In July 1873, children rode a cart used to carry building supplies down to the water.

  The board that should have stopped it at the end of the rail was not in place, and the cart flipped into the water.

  Three girls drowned, including two daughters of construction superintendent Hezekiah Pittee. A younger sister, Carrie, survived.

  The museum documents that tragedy.

  The ghost stories came afterward.

  Its published accounts describe reports of footsteps upstairs with nobody there, and a little girl appearing beside a bed in the keepers' house.

  Some people connect those stories to the children who died.

  That connection is belief, not an established fact. It is a legend, and the museum itself says it cannot explain what is reported.

  Pause beneath the tower.

  A lighthouse is built to guide people away from danger.

  Here, a childhood accident became part of the place's remembered history, then part of its folklore.

  The deaths were real.

  The stories of children still moving through the property remain unverified.

  Both deserve to be told with care.

