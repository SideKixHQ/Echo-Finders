script: |
  Look up at the lighthouse.

  Before the tower was completed, this was a construction site where children sometimes
  played.

  In July 1873, children rode a cart used to transport building materials.

  The cart overturned into the water.

  Three girls drowned, including two daughters of construction superintendent Hezekiah
  Pittee. A younger sister survived.

  The museum documents that tragedy.

  The ghost stories came afterward.

  Its published accounts describe reports of unexplained footsteps and a little girl
  appearing in the keeper’s house.

  Some people connect those stories to the children who died.

  That connection is belief, not an established fact.

  Pause beneath the tower.

  A lighthouse is built to guide people away from danger.

  Here, a childhood accident became part of the place’s remembered history, then part of
  its folklore.

  The deaths were real.

  The stories of children still moving through the property remain unverified.

  Both deserve to be told with care.
