teaser: "A stranger came to Harrisburg with a treasure map in his head. He said he had guarded Santa Anna."
script: |
  Look toward Buffalo Bayou. This was Harrisburg, a port town that was here ten years before Houston.

  Part of what you are about to hear is history. Part of it is a legend, and nobody has ever proved it.

  First, the history. On the night of the fifteenth of April, eighteen thirty six, General Santa Anna entered Harrisburg, lit by the glare of burning houses. He was hunting the government of Texas. It had left that noon for Galveston. He found only three men, working in a printing shop.

  In a rage, he ordered the whole town burned. The newspaper, when it printed again, said its office was consumed in the fire.

  Now the legend.

  In April, eighteen ninety nine, a Mexican man came to Harrisburg. He said he had been one of Santa Anna's bodyguards in the war. And he said he knew where treasure was buried. Two caches. One, he said, was in the bank of Buffalo Bayou, near Sam Allen's house, here in Harrisburg.

  He offered to share it with anyone who would pay for the digging. It created, as one account put it, something of a stir.

  Nothing in the record says he was who he claimed. Nothing says anyone found anything.

  Look at the bayou bank.

  If it is there, it has waited a long time.

