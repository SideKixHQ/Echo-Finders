certaintyNote: >-
  A treasure tale, not history. The WPA's Houston guide of 1942 reports that in April 1899 a man claiming to have been one of Santa Anna's bodyguards offered to share two buried caches, one in the bank of Buffalo Bayou near Sam Allen's house in Harrisburg. Nothing in the record says he was who he claimed, or that anything was found. The burning of Harrisburg in 1836 is history, from the same guide quoting Santa Anna. The script says out loud which part is legend.
