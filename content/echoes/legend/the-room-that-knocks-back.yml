script: |
  You are aboard a ship where movement and unfamiliar sounds can have ordinary
  explanations.

  That makes the story of stateroom B340 especially difficult to separate from its
  surroundings.

  The Queen Mary’s operator publishes reports of nighttime knocks, bathroom lights
  switching on, faucets running, and doors opening or closing unexpectedly.

  The room has become part of the ship’s ghost folklore. It is a legend.

  Those reports are not independently established evidence of spirits.

  Still, imagine the situation they describe.

  You are inside a small cabin. You hear a knock.

  You open the door.

  Nobody is there.

  You close it and return to bed.

  Then you hear another sound.

  A ship is full of compartments you cannot see into, pipes behind walls, and passages
  beyond doors.

  B340’s legend lives in that uncertainty.

  You know you heard something.

  The harder question is whether the explanation is somewhere nearby, hidden by the ship
  itself.
