certaintyNote: >-
  A popular origin story, not established fact. The Federal Writers' Project guide of 1939 says only that the phrase "twenty-three skidoo" "is supposed to have originated" at this corner, where police shooed loungers away. That the corner was traditionally called the windiest in the city is reported in the same guide. The script says out loud that the origin is a legend.
