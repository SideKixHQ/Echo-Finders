teaser: "The wind on this corner lifted skirts. The police had a word for the men who came to watch."
script: |
  Stand right at the sharp point of the building, where the two avenues split around it like water around the bow of a ship. Feel the wind.

  New Yorkers long said this was the windiest corner in the city. And the wind here may have left something behind in the way Americans talk.

  This is a legend. Here is how it goes.

  When this building was new, skirts reached the ground. A gust off this corner could lift one, just for a moment. So men came to stand here and wait for a gust, hoping for a glimpse of an ankle.

  The police were not amused. They walked up to the loungers on the Twenty Third Street side, and moved them along.

  Twenty three. Skidoo.

  It became a saying. Twenty three skidoo. Get lost. Move it.

  Is it true? Nobody can prove it. The city guide that wrote it down in nineteen thirty nine would only say it was supposed to have started here.

  But stand here a minute in the wind.

  It does make you want to move along.

