script: |
  This corridor has a famous ghost story.

  According to the legend, Catherine Howard runs through it, crying out as she tries to
  reach Henry VIII and plead for mercy.

  Catherine was Henry’s fifth wife. She was executed in 1542.

  For generations, people have connected her story with this gallery.

  But the palace’s own historians point out a problem.

  Her original apartments no longer exist. Even if she had attempted the escape described
  in the legend, her route would not have passed through this corridor.

  So you are standing in the setting of a ghost story, not a verified escape scene.

  Look along the gallery.

  That correction does not erase Catherine’s death. It shows how a real tragedy can
  acquire a location, a sound, and a repeated action over time.

  The legend gives her one endless attempt to reach the king.

  History does not confirm that she ever ran here.
