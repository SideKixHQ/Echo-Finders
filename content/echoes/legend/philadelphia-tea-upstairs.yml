teaser: "She locked the front door, and opened the side one."
script: |
  Look down this narrow alley, Drury Street, at the old tavern halfway along it. It has been pouring drinks since eighteen sixty. When it opened, it was called the Bell in Hand. Today it carries the name of the couple who first ran it. Ma and Pa McGillin.

  Then came Prohibition, and beer became a crime. Every bar was supposed to shut.

  Here is how the tavern tells it. Ma McGillin locked the front door. Then she opened the side door, and served tea. Upstairs.

  It survived. In fact, it kept going for a hundred years without closing. Until March of twenty twenty, when the pandemic finally locked the front door again. The first time, they said, since Prohibition. And this time, no tea.

  Now, this next part is a legend. The people who work here will tell you the place is haunted. Pots flying in the kitchen. Lights that flicker. Things that move by themselves. One manager said, we just hope it's never knives. Ghost hunters say they caught a lady in white, reflected in a mirror.

  And who would she be? Plenty of people say it is Catherine McGillin. Ma.

  Nobody can prove a word of it. But if you had kept a bar open through Prohibition, would you leave?

  Look at the side of the building.

  Maybe she is still pouring the tea.
