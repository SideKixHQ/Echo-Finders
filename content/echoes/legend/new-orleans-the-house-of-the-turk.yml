certaintyNote: >-
  The murders are a legend. The story was published by Helen Pitkin Schertz in Legends of Louisiana (1922) and set in 1792; the Historic American Buildings Survey (1958) found the lot was bought in 1836 and the house built afterwards, called the story amusing but incredible, and noted that the house took the name House of the Turk because of the story. No supernatural claim is made.
