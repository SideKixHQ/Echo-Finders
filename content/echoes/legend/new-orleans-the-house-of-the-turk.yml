teaser: "A party, a ship that slipped away, and a house that did not exist yet."
script: |
  Look at the tall house on this corner, with the iron balconies and the high basement. People call it the House of the Turk. And the story they tell about it ends in murder.

  The story goes like this. A brother of the Sultan of Turkey sailed into New Orleans with jewels, and with young women taken from the Sultan's harem. He was given this house to live in, and one night he gave a great party. In the morning, the doors were broken in. He was dead, and so was everyone with him. And the ship that had brought him was gone from the river. The crew, people said, had sailed off to be pirates.

  The story was written down in nineteen twenty two, in a book called Legends of Louisiana, by a New Orleans writer named Helen Pitkin Schertz. She set it in seventeen ninety two.

  In nineteen fifty eight, a researcher named Georgia Drennan went through the property records for the Historic American Buildings Survey. The lot was bought in eighteen thirty six, and the house was built after that. That is forty four years after the murders were supposed to have happened inside it. She called the story amusing, but incredible. And she noticed something else. It was because of that book that people started calling this the House of the Turk.

  Look at the house again.

  The Turk arrived in nineteen twenty two. In a book.
detail: >-
  The house was built for Joseph Coulon Gardette under a contract of 1 September 1836, and sold in 1839 to Jean Baptiste Lepretre, whose name it carries. The Historic American Buildings Survey record calls it, so far as was known, the first house in New Orleans built with a basement. It has long been divided into apartments; please look from the street.
