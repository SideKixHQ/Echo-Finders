teaser: "Some passers-by, the old guides said, heard singing behind this wall."
script: |
  Look along the wall of the old cemetery.

  The old guides called this the mother cemetery of the city. And they said that at night, people passing through could hear singing in there.

  Take it as a legend. It is a story the guidebooks repeated, not something anyone proved.

  The singer, they said, was a priest. Father Dagobert, a French Capuchin who became superior of the city's Capuchins in colonial days. He christened, married and buried the town for half a century. Grace King, writing in eighteen ninety-five, said he had been praised in so many poems and stories that there was nothing new left to say.

  A city guide of nineteen-oh-four called him the singing Père. Old traditions say, it went on, that even now at night, passing through St. Louis Cemetery, you can hear his sweet voice chanting the Te Deum, or singing the lullabies Creole mothers sang to their children. The people are not afraid of his ghost, it said. They stop to listen.

  An earlier guide added a second ghost. A fiddler called Tintin Calendro, playing among these tombs. But that guide admitted he had walked straight out of a storyteller's imagination.

  So if you hear music here after dark, the legend has a name ready for it. Whether anyone is singing is another matter.
