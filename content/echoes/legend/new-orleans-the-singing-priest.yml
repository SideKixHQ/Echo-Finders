certaintyNote: >-
  Father Dagobert is a documented colonial Capuchin superior. The singing ghost is an "old
  tradition" reported by the 1904 Picayune guide, which says only "St. Louis Cemetery" and names no
  witness. The 1900 guide's fiddling ghost, Tintin Calendro, is admitted there to come from fiction.
  The script says aloud that both are legend.
