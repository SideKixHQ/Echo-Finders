  The hauntings are the house's own lore, as told to CBS Philadelphia by the caretaker who lives there and in a CBS Philadelphia guide to haunted places. The guide says the sightings go back to the 1960s and that the woman in the gown is only speculated to be Peggy Shippen. What is documented: Samuel Powel's house, saved from demolition in 1931 by the Philadelphia Society for the Preservation of Landmarks, and the room taken to the Metropolitan Museum of Art in 1918. The script says the ghosts are a legend.
