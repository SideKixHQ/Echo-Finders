teaser: "One of its rooms is in New York. Some say its guests stayed."
script: |
  Look at the tall brick house, here on Third Street. Its owner, Samuel Powel, was the last mayor of Philadelphia under the British, and the first mayor after the Revolution.

  Last century, this house was nearly pulled down, to make room for a parking lot. A society of Philadelphians, founded in nineteen thirty one, saved it.

  But not all of it. Back in nineteen eighteen, one of its rooms had been taken out and carried off to New York. It is in the Metropolitan Museum of Art.

  Now, this next part is a legend.

  People have been telling ghost stories about this house since the nineteen sixties. They say soldiers of the Continental Army have been seen on the main staircase. General Lafayette among them.

  And in the drawing room, they say, a young woman, in a purple and cream gown. Some people think they know who she is. Peggy Shippen. The wife of Benedict Arnold. They say she wore a gown just like it to the last party she went to in this house.

  The caretaker, who lives in the house, told a reporter it is supposedly the most haunted house in Philadelphia. She has felt cold spots. Her husband, down in the basement, has heard footsteps on the floor above, when he knew she was nowhere near. Visitors tell her, very matter of fact, you know you're not alone here.

  Nobody can prove any of it.

  Look up at the windows. One room went to New York.

  The guests, the story goes, stayed.
