teaser: "Reporters, watch your step on these stairs. There is a story about why."
script: |
  If you are in the House wing, look down at the steps as you climb.

  This is a legend. Hold on to that.

  The history first. In eighteen ninety, a newspaper correspondent named Charles Kincaid had an argument with William Taulbee, a congressman from Kentucky. Here in the House wing, Kincaid shot him. Taulbee died.

  Now the legend. Some people say that the dark spots on one of the staircases here are Taulbee's blood. And they say Taulbee has never forgiven the press. When a reporter takes these stairs, the story goes, something catches their foot.

  There is no record of anyone being tripped by a ghost. Stone stairs in an old building trip people all by themselves.

  So if you happen to be a reporter.

  Hold the rail.
