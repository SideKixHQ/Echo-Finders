detail: >-
  Told as legend. CBS describes the place as "a House hallway" with "the stairway"; it does not say which staircase, and the script does not either. Second pass (2026-11-11): the Architect of the Capitol, the Evening Star's year in review for 1890 and the Alexandria Gazette (1891) now back the shooting, the death and the acquittal. Taulbee had left Congress by 1890 (the AOC calls him "the former member", the Star "ex-Congressman"), so the script now says former congressman. The AOC says he was shot "on the stairs" and died 11 days later; the Star's year review misprints the date as the 2d of February.
