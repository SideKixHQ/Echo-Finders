certaintyNote: >-
  A legend. The 1890 shooting is history, reported by CBS News (Associated Press) from Capitol ghost-tale collections; the stains and the tripping are folklore, and the script says so. Nothing supernatural is claimed. The acquittal is from the Alexandria Gazette of 9 April 1891; Taulbee's death eleven days later is from the Architect of the Capitol.
