teaser: "A keeper's daughter bet her brothers she could swim to Southport."
script: |
  Look across the river to Southport. That is a long way to swim.

  This is lore, not record. Nobody has proven it.

  Captain Charlie Swan kept the Cape Fear Lighthouse, at the far end of this island, and his children grew up here. There were deer to chase, and alligators to be chased by.

  The story goes that one of Captain Charlie's daughters bet her brothers she could swim from the island all the way to Southport. They did not believe her.

  She had spent a lot of time with her father. She had studied the tides and currents of the Cape Fear River. And she knew that if she swam at low tide, the sandbars would be out of the water, and she could use them.

  In the story, she made it. Her brothers had to pay up.

  Please do not try it. Just look at the water for a moment, the way she would have. She read the river first.
