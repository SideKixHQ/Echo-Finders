teaser: "It was three things at once. Look at the base."
script: |
  Find the tall, many-sided brick chimney rising over the old railroad shops.

  It was built in eighteen fifty five for the Central of Georgia Railroad. A hundred and twenty three feet high, standing on a hundred and twenty piles.

  It was three things at once.

  First, a chimney. Through flues under the yard it pulled the smoke from every forge and boiler in the shops.

  Second, a water tank. Round its waist sits a ring of cast iron panels, made here in Savannah. Behind them was a tank of forty thousand gallons, for filling the locomotives.

  Third, look at the base. Between the brick buttresses there are little arched cells. Those were the workers' privies.

  When the government surveyed the shops, it said the combination of smokestack and privy appeared to be unique.

  The day it was finished, the railroad's superintendent and the master bricklayer climbed to the top before the scaffolding came down, and drank a bottle of champagne up there.

  The bosses toasted it from the top. Everyone else used it from the bottom.
