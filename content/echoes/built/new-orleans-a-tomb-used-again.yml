teaser: "The wall is not just a wall."
script: |
  Look at the wall around this cemetery, and how thick it is.

  In the old St. Louis cemeteries, the wall was never just a fence. It was built as tombs, stacked in tiers. Visitors a century ago were told these vaults were called ovens, after the oldest tombs here, which were brick and shaped like ovens.

  Why build up instead of down? A guidebook of nineteen hundred and two put it plainly. The soil is low and wet. Dig very deep, and you strike water.

  But that is only half the answer. The other half is what happens inside.

  A family tomb usually held two vaults, with a space for bones beneath. When a vault was needed again, the law first made the family wait. A year or two, the guidebooks said. Then the slab came off, the old wooden coffin was broken up and burned, and what remained was moved down into the space below. The vault was ready again.

  In these cemeteries, one guide wrote, generation after generation mingle their dust in the same crypt.

  Each tomb behind that wall is not one person. It is a family, folded down into one small house.
detail: |
  The 1904 Picayune guide says St. Louis No. 1 was by then closed to new tombs and opened
  only to heirs. Not every guide agreed that the ground was too wet everywhere: an 1845
  guide notes that at the Firemen's cemetery out on the Metairie ridge, graves could be
  sunk six feet without reaching water.
