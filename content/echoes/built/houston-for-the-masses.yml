teaser: "The mayor wanted it Spanish style. The architect said one sentence, and won."
script: |
  Look across the water at City Hall. Pale stone, straight lines, carved panels running up its face.

  The mayor did not want it to look like this.

  For fifteen years, Houston argued about a new city hall. One plan was a copy of the Capitol in Washington, with a dome. Another was a twenty storey skyscraper. Then the Depression stopped everything.

  In nineteen thirty seven, federal money came through, and the council picked a new architect, Joseph Finger. He had come to America from Austria at eighteen. He brought the council a plan described as ultra modernistic.

  Mayor Fonville objected, loudly. The buildings around this square were Spanish style, he argued, and the new one should match.

  Finger answered. We're building for the masses, he said, and not the classes.

  The council took his plan, without a single change.

  Look closer. Above the first floor, the panels show crops from around Houston. Higher up, its industries. Near the top, the work of city government. On the roof line, carved bobcat heads. And on the aluminum doors, the faces of lawgivers, from Moses and Caesar to Thomas Jefferson.

  Behind the cornerstone, sealed in a box, they left a Bible, the city charter, three newspapers, and an essay with a title like a letter.

  To the Houston democracy of the future.

