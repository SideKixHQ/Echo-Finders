teaser: "It looks untouched. It was made to."
script: |
  Look down the alley. Brick houses, two and three storeys, shoulder to shoulder. Shutters, stone paving, little steps. It looks like the seventeen hundreds, untouched.

  It is not untouched.

  The alley opened in seventeen oh six, as a cart path down to the river. Artisans lived here, and worked in their front rooms. One house, number one twelve, was home to a carver, a boat builder, a baker and a joiner over the years. A widow named Esther Meyer, at number one nineteen, rented rooms to sailors.

  Then came the factories. At least four of them crowded around these houses. Families from Ireland, Italy and Russia moved in to work in them. People on the alley built tenements in the back yards and rented them out, one room to a floor. By eighteen eighty, more than three hundred people lived in these houses and the buildings behind them.

  By the nineteen thirties, the alley was called a slum. Houses were condemned.

  So the people who lived here set out to save it. They held house tours, and a summer festival in colonial costume. They raised money to buy and restore the houses. They pulled down the tenements. They put the telephone wires under new stone paving.

  Look down the alley again. No wires. No tenements. No factories.

  It looks untouched. It was made to.
