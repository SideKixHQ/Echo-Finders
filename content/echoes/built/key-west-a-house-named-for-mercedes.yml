teaser: "A cigar fortune built this house. Then it became a hospital, and then it moved."
script: |
  Look at this big wooden house from the sidewalk. It is private, so stay out here. Its veranda wraps all four sides of an inner courtyard. That courtyard is a Cuban idea.

  The house was built around 1890. Its owner was Eduardo Gato, a Cuban immigrant who made a fortune in the cigar business. It has been said he brought Cuban carpenters over to build it.

  But it was not built here. Gato put it on the part of his land that faced the waterfront.

  In 1911, he let a group of Cuban residents of Key West turn it into a hospital, for the poor of all nations. It was named Mercedes, in honor of his wife.

  In 1919 the waterfront land was sold to the City of Key West, to become a park. The house was moved here, to another piece of Gato property, and the hospital went on.

  It ran until just before the Second World War, and closed for lack of money.

  A cigar fortune, a hospital for anyone who needed it, and a house that changed streets. All of it still standing here on Virginia Street.
