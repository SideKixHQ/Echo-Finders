teaser: "Look above the main door. There is a baby in a helmet."
script: |
  Stand in front of the columns on Third Street and look above the main door.

  There is a carved marble panel there, and it is busier than it first appears. A baby wearing a helmet leans against a globe. One foot rests on a beehive. Beside him a horn of plenty spills out, not fruit, but coins. Behind him are tall ledgers, sailing ships and an American flag.

  The baby is America. This was the Bank of the United States, and it opened in this building in seventeen ninety-seven. The whole front was designed to tell you what it was for. Even the keystone over the door is the head of Mercury, the Roman god of commerce.

  Now look at the globe again. One word is carved on it clearly. Africa.

  The Park Service reads that word as the riches of that continent, human and mineral.

  The panel is a celebration of a young country's money. It names one of the places the money came from.
