teaser: "This little street runs straight through a palace that was never finished."
script: |
  Look along this narrow street, Sansom Street, between Seventh and Eighth. It runs straight through the middle of a palace.

  You cannot see it, because it was never finished. In seventeen ninety one, the whole block from here to Walnut Street belonged to Robert Morris. He was the man they called the purse of the Revolution. He signed the Declaration. When the country's credit was worthless, he borrowed on his own.

  And on this block, he set out to build a house like nothing else in America. His architect was a French officer named Pierre L'Enfant, the same man who laid out the streets of Washington. By one old account, it went down two and sometimes three stories underground, with arches and vaults. Above ground, it rose in red brick and pale blue marble. People came to stare. They called it Morris's Folly.

  Here is the twist. It was not the house that ruined him. It was land. Millions of acres, bought on borrowed money, all across the country. The buyers never came. His notes piled up like autumn leaves. By seventeen ninety seven, afraid of prison for debt, he fled his own home across the street.

  The sheriff sold this whole block. One of the buyers, William Sansom, cut two streets through it. He named the small one after Morris.

  The big one, the one you are standing on, he named after himself.
