teaser: "Look at how you get in. Not from the pavement. From a bridge."
script: |
  Look at how you get into the Cotton Exchange. Not from the pavement. From a bridge, with iron railings, across a gap.

  The building opened for business at noon on a Monday in September eighteen eighty seven, when Savannah ranked first among the cotton ports of the Atlantic coast. From Bay Street it looks like three storeys. From River Street, round the back, it is six.

  What it stands on is the interesting part.

  This was the Drayton Street slip, the way down from the bluff to the river. In March eighteen eighty six the Morning News watched workmen pulling up the stones of that slip. Part of it was filled in and walled off. By August, iron pillars and girders were in place to carry the building, and the old iron footbridge across the slip had been taken down, to be put up again somewhere else.

  So the Cotton Exchange is standing on iron legs, over the old way down to the water.
