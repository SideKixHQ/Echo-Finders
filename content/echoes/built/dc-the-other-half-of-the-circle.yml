tags: [washington, dc-core, penn-quarter, preservation, federal-triangle]
teaser: "Stand on Twelfth Street and look at the two buildings facing each other."
script: |
  Stand on Twelfth Street and look at the two buildings facing each other.

  On one side, a federal building sweeps round in a great half circle. On the other stands
  the Old Post Office, and its tower.

  The curve was supposed to be a whole circle, modelled on the Place Vendome in Paris. When
  the federal buildings here went up, around 1930, a matching curve was meant to be built
  across the street, on the site of the Old Post Office. The tower was in the way.

  The planners simply expected the old building to be demolished. Some walls of the new
  building next to it were faced in plain red brick instead of limestone, because nobody
  thought they would be seen for long.

  The Great Depression saved it the first time. As late as the 1960s, a study still called
  for razing everything except the three hundred and fifteen foot clock tower.

  This time a preservation campaign called Don't Tear It Down stepped in. The building
  became a landmark, and the plan to finish the circle was stopped.

  On the Old Post Office side, only a short stretch of the curve was ever built.

  So the circle across the street still stops halfway.
