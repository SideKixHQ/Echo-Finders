teaser: "Stand on Twelfth Street and look at the two buildings facing each other."
script: |
  Stand on Twelfth Street and look at the two buildings facing each other.

  On one side, a federal building sweeps round in a great half circle. On the other stands
  the Old Post Office, and its tower.

  The curve was supposed to be a whole circle. When the federal buildings here went up in
  the early 1930s, a matching curve was meant to be built across the street, on the site of
  the Old Post Office. The tower was in the way.

  The old building had fallen out of fashion, and locals thought it unappealing. It faced
  demolition in 1934, and was spared only because the Depression had swallowed the money.

  In 1970 Congress approved tearing it down again. By the mid seventies there were fires and
  piles of trash inside, and metal sheets over the glass roof of the atrium.

  Then Nancy Hanks, who chaired the National Endowment for the Arts, testified. Old
  buildings, she told Congress, are like old friends. People picketed. The building was
  saved, and in 1973 it went on the National Register of Historic Places.

  For forty-two years, park rangers took visitors to the top of the tower. That ended on the
  first of October 2025, while the building's owners decide what happens next.

  Either way, the circle across the street still stops halfway.
