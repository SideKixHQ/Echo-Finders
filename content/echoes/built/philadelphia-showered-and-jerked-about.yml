teaser: "Charles Dickens was impressed by Philadelphia's water."
script: |
  Look at the little white temples along the river, with their columns, below the hill. They look like they belong in ancient Greece. They were built to pump water.

  The city's first water system pumped from a building where City Hall stands now, and it was hopeless. The reservoirs held half an hour's supply. So in eighteen fifteen they started again, out here, under the hill called Faire Mount.

  In eighteen forty two, Charles Dickens came to Philadelphia, and saw it. He was delighted. Philadelphia, he wrote, is most bountifully provided with fresh water, which is showered and jerked about, and turned on, and poured off everywhere. He saw the river held back by the dam, and forced by its own power up into great tanks on the hill. From there, it ran to the top stories of the houses, for next to nothing. And the works were laid out as a public garden, he said, no less ornamental than useful.

  But the water was not clean. Typhoid kept breaking out, until the city filtered its water, early in the nineteen hundreds. The old works by the river were abandoned.

  And then, in nineteen eleven, the mayor had an idea. Fill them with fish. The old waterworks became an aquarium. More than forty thousand people came in its first full year. A guidebook of nineteen thirty seven described balloon fish floating belly up, and crabs trying to climb out of their tanks.

  Look at the temples again. They were built to send water out.

  For a while, they kept it in.
