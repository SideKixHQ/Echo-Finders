teaser: "Look closely at these walls. There are seashells in the concrete."
script: |
  Stand on King Street and look at the walls of the old Hotel Ponce de Leon, now Flagler College. Look closely at the gray surface. There are bits of shell in it.

  A few blocks away, the Spanish built their fort from blocks of shell rock. This building used the same coquina, crushed and poured.

  It is one of the earliest buildings anywhere of poured concrete. The builders mixed crushed coquina shell with cement, six parts to one. They made the mix on the spot. Then they rammed it down into wooden forms, three inches at a time.

  The whole great hotel, towers and all, three inches at a time.

  It was the first commission for a young architecture firm, Carrère and Hastings.

  The shell, a government survey noted, gives the walls a pleasing texture. It is also a reminder of where they came from. A grand winter hotel, built the way a child builds a sandcastle. Pack it into the mould, a little at a time.
