script: |
  Look at the little white buildings along the river, with their columns. They look like temples. They were built to pump water.

  In eighteen eleven, a young engineer named Frederick Graff began building here, at the foot of the hill. The plan was simple. Pump the river water up to reservoirs on top of the hill. Then let gravity carry it down through pipes into the city.

  Graff made the engine house look like a gentleman's country villa. Then, in eighteen nineteen, he threw a dam across the river at an angle, so the river itself could turn the water wheels. When it was finished, it was the longest dam in North America.

  He put two little temples on the roof of the mill house. People came out from the city just to stand up there, over the roar of the water, and look at the river. That was the start of Fairmount Park.

  But the river got dirty. Factories upstream poured into it. In eighteen ninety, the city had cholera and typhoid. In nineteen oh nine, the pumps stopped for good.

  Two years later, the mill houses became the city aquarium. The forebay, the channel that once fed the water wheels, held sea lions.

  Then, in nineteen twenty three, they filled the forebay in. The little footbridge that crossed it was buried, just as it was.

  Look along the terrace. Somewhere beside these temples, they buried a bridge.
