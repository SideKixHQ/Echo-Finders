teaser: "Jerome sat on a fortune in copper and had no water. Look above the road for what fixed that."
script: |
  If you are on Highway 89 Alternate, about two miles southwest of Jerome, watch the hillside above the road. You may spot an old steel pipe, riveted together, that crosses a gulch on a flume.

  Jerome sat over one of the richest deposits of copper ore in the Southwest. What it did not have was water.

  At first, it was most likely hauled up by water wagon. Then, around 1900, the United Verde company built what was probably the first real water works in town. It tapped springs in the mountains above. By 1915, the farthest of them was seven miles away.

  The pipe was riveted steel, made in the company's own shops. It carried the water to a row of wooden tanks on the side of the mountain. From there, gravity did the rest. Down to the mines, and down to the kitchens.

  Very little of that first system is left. The wooden tanks were replaced with steel ones long ago. But a little of the old pipe is still out here, above the road.
