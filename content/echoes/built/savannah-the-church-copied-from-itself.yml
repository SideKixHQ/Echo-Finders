teaser: "This church is about seventy years younger than it looks."
script: |
  Look up at the white steeple on the corner of Bull Street and Oglethorpe Avenue.

  The Independent Presbyterian Church was dedicated in eighteen nineteen. Fifty years later, a history of the city called it one of the most elegant and spacious houses of worship in the country.

  On the evening of the sixth of April, eighteen eighty-nine, a clerk in a dry goods store on Broughton Street stepped into a shop window to light the gas. A gust of wind blew the flame against something light and flammable.

  By morning more than fifty buildings were gone. The Savannah Morning News described what was left of this church. Skeleton walls.

  What you are looking at went up in eighteen ninety. It was rebuilt from measured drawings of the church that burned. A copy of itself, built to its own measurements.

  The congregation had reasons to be faithful to the old design. By one account in the federal survey, a legacy left to the church required that its high pulpit never be changed.

  So the church in front of you is about seventy years younger than it looks.

  The original stood for seventy years. The copy has now stood for well over a century.
