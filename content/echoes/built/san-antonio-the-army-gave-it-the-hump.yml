tags: [san-antonio, alamo, architecture, military, world-heritage]
teaser: "The most famous outline in Texas was added by an army quartermaster."
script: |
  Look at the top of the church front. That curved top is its familiar shaped gable, the outline people picture. The defenders in 1836 never saw it.

  After the battle, the Alamo was badly damaged. When Texas joined the United States, the U.S. Army moved in and used it as a quartermaster depot.

  On the first of January, 1850, the Army leased the buildings, for a hundred and fifty dollars a month, to use as storehouses.

  And it was apparently in 1849 that the church was rebuilt with its familiar shaped gable. The design is credited to John Fries, a local builder, working under the Army's quartermaster in San Antonio.

  So the most famous silhouette in Texas was added by an army supply office, to tidy up a warehouse.
