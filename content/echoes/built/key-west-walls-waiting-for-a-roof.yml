# Drafted by Claude Code (2026-11-12) for the second Key West batch, following docs/writing-echoes.md.
# Listening spot: Front Street near Whitehead Street, by the Navy coal depot and storehouse (HABS FL-190), known as Building 1 and later used by the Coast Guard. Stay on the public street; parts of the waterfront here are Coast Guard property.
# Position: Front Street and Whitehead Street in the app's Key West street file (24.55881, -81.80664), toward Wikidata Q7863130 (U.S. Coast Guard Headquarters, Key West Station, 24.558611, -81.8075); the HABS UTM reference (17 418280 2716110) converts to 24.55677, -81.80694 with the survey's usual southward offset (medium confidence). About 100 m from the Old Post Office and Customshouse, which has no echo.
