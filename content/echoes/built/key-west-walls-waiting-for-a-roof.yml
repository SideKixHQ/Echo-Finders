teaser: "The walls were ready in 1856. The money was not."
script: |
  Look at the old brick building here by Front Street. It is the oldest brick building on Key West, and the first permanent Navy building on the island.

  In eighteen fifty two, Congress set up a depot for naval supplies here. By eighteen fifty six, the walls were built, ready to receive the roof.

  Then the money ran out.

  For years it stood unfinished. What finished it was a war. When the Civil War came, Key West became the headquarters of the East Gulf Blockade Squadron, and the building was completed.

  The Navy called it Number One Building. Later, the lighthouse service made it its headquarters, and then the Coast Guard.

  The oldest brick building on the island began as four walls, waiting for a roof.
detail: >-
  From the Historic American Buildings Survey record (HABS FL-190): the oldest brick building and the first permanent navy building on Key West; a depot for naval supplies established by an Act of Congress of 21 July 1852 on ground used by the Anti-Pirate Squadron from 1823 to 1826; walls ready for the roof by 1856, then unfinished for lack of appropriations until the outbreak of the Civil War, when Key West became headquarters of the East Gulf Blockade Squadron; known as Number 1 Building and the Naval Administration Building until 1932; then headquarters of the 7th Lighthouse District, and of the Coast Guard station after the Lighthouse Service joined the Coast Guard in 1939. "Four walls" is the script's image for walls without a roof. Present use was not checked.
