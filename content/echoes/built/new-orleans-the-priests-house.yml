tags: [new-orleans, new-orleans-core, jackson-square, french-quarter, spanish-colonial, architecture]
teaser: "It was built to be the priests' house. No priest ever lived in it."
script: |
  Look at the building to the right of the cathedral. It is a near twin of the Cabildo on the other side. Arches below, arches above.

  It was built to be the priests' house. The name says so. The Presbytère.

  No priest ever lived in it.

  The rich Spaniard who paid for the cathedral started this building in the seventeen nineties, and got it as far as the first row of arches. Then, in seventeen ninety-eight, he died.

  And it stopped. For years it was just the ground floor, roofed over with boards and rented out.

  The church wardens finally finished it in eighteen thirteen. By then New Orleans belonged to the United States. They let it to shopkeepers, and then to the courts, because the rent was useful. The parish priest went on living in a small frame house round the back.

  In the nineteen thirties, workmen stripped the stucco off the walls, and found the pause written in the brickwork. At the sills of the upper windows, the bricks and the mortar change completely.

  Look at those upper window sills now. The join is covered again, but that line is about fifteen years of nothing.

  The priests' house became a courthouse, and later a museum. It has been a lot of things.

  It was never a home.
