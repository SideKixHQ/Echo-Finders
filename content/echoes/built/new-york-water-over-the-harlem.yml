teaser: "The oldest great bridge in New York was built for water. People were an afterthought."
script: |
  Look out along the bridge, across the Harlem River to the Bronx. Then look back at the tall stone tower behind you, like a watchtower from a castle.

  This is High Bridge, the oldest of New York's great bridges. And it was not built for you.

  It was built for water.

  It was built as part of the Croton Aqueduct, which carried water to Manhattan. The water had to cross the Harlem River. High Bridge carried it over, on a long march of stone arches, finished in eighteen forty eight.

  On top, there was a walkway. And one of the people who came to walk it was Edgar Allan Poe. He lived across the river in Fordham then, and he came here often.

  The water tower stands guard at this end.

  In the nineteen twenties, the stone arches standing in the river were taken out and replaced with a single steel span, because they blocked the boats. A few of the old arches survive at the ends.

  Walk out on it, if it is open.

  In nineteen thirty nine, twenty four million gallons of water a day still crossed it, under the feet of the people walking over.

