teaser: "Look at the house at number nineteen. Everything around it is younger."
script: |
  Look at the house at number nineteen, North Square. Everything else you can see from here
  is younger than it.

  It went up around sixteen eighty. That makes it the oldest building in downtown Boston.

  Paul Revere bought it in seventeen seventy. He was a silversmith, a veteran and a father of
  five. On the night of the eighteenth of April, seventeen seventy-five, he set out from this
  square to warn Samuel Adams and John Hancock.

  The Reveres owned the house for thirty years and lived in it for about twenty. In eighteen
  hundred, he sold it.

  What came next is why it is still here.

  It became a boarding house for sailors. Then a tenement, with shops on the ground floor. At
  one point it was a cigar factory. At another, a bank. Nobody was preserving it. It was just
  a building people kept finding a use for.

  By the early nineteen hundreds it faced demolition. A great-grandson of Paul Revere bought
  it, and in April nineteen oh eight it opened as a museum.

  Twenty years of Reveres. A century of sailors, shopkeepers and cigar makers.

  The house only remembers the twenty.
