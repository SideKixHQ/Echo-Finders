script: |
  The historic St. John's Lodge building dates to 1804. Its later uses included an art
  museum, and it now belongs to the Children's Museum complex.

  This stop concerns the surviving building rather than the original purpose of every room
  inside today's museum.

  Look at the old structure from Orange Street. Its long life illustrates how an
  institution's needs can change while useful architecture remains.

  A lodge, an art gallery, and a children's learning space bring very different activities
  to an address. The connection is the building that could accommodate new possibilities.
  Preservation here did not mean freezing its use forever. It meant retaining a
  substantial piece of downtown while finding reasons for later generations to cross its
  threshold.
