script: |
  The church complex expanded in 1910 with the Memorial Hall Annex, donated by William H.
  Sprunt in memory of his parents and the earlier congregation's founders.

  The annex served functions that the main sanctuary alone could not contain. Its history
  reminds you that a community's building needs extend beyond one ceremonial room.

  Look from the public sidewalk and keep to authorized visitor areas. A less dramatic
  building can still be central to how a place works.

  The addition makes growth tangible. People who gathered in the church also needed rooms
  for teaching, meetings, and other activities. The annex supplied that supporting space.
  Its continued presence helps you read the complex as a working community setting, not
  simply a striking facade preserved for photographs.
