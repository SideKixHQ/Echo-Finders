teaser: "Ask where it came from. The guidebooks never quite agreed."
script: |
  Walk up to the edge of the basin and look at the fountain. The tiers, the figures, the water falling from one level to the next.

  Now ask where it came from. Savannah's own guidebooks never quite agreed.

  In eighteen ninety, one said it was designed from a prize model shown at an exhibition in London, and that it was similar to the grand fountain in the Place de la Concorde, in Paris.

  In eighteen ninety nine, another went further. An exact reproduction, it said, of the one in Paris.

  By nineteen ten, a third guide had it modelled on Paris. Close, but no longer exact.

  What is certain is plainer. Before the fountain, the middle of this park was marked by a small wooden bridge. The fountain went in around eighteen fifty eight, and local photographers were soon selling pictures of it. After the war, a photographer who had followed Sherman's army put it in his book of the campaign.

  The fountain has not changed much since. The story keeps improving.
