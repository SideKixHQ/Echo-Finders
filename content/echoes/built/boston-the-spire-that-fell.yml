teaser: "Look up at the white spire. It is younger than it looks."
script: |
  Look up at the white spire on top of the tower.

  It is younger than it looks.

  The first spire went up in the seventeen hundreds. It was described as the most elegant in
  the town. Early in the eighteen hundreds, a gale blew it down.

  Its replacement was built from a model by Charles Bulfinch, the architect of the State
  House. That one stood for about a hundred and fifty years.

  Then, on the thirty-first of August, nineteen fifty-four, Hurricane Carol reached Boston.
  The wind worked at the spire for more than an hour. It swayed, cracked, and went over.

  An amateur photographer visiting from New York happened to catch it as it fell.

  Within days, people were offering money to put it back. One Lions Club voted to send
  ten dollars.

  In October nineteen fifty-five, a new spire was dedicated here. At the ceremony it was
  described as a duplicate of the spire the lanterns hung from in seventeen seventy-five.

  So when you look up, you are seeing the night of the lanterns, more or less. You are just
  seeing it in a copy about seventy years old.
