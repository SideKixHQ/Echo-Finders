teaser: "Look at the corners. Those blocks are not stone."
script: |
  Look at the pink house on the corner, and at its corners especially. Big squared blocks run up the edges, like the stones of a castle.

  They are not stone. The whole house is brick, wearing a skin.

  It was built around seventeen seventy one, for a member of the Habersham family. The brick was covered with stucco and tooled to look like cut stone. The corner blocks are stucco too. The stucco came out pinkish.

  In eighteen twelve the house changed jobs. A wing was added, fancy lintels went over the windows, and it became the Planters Bank. Federal surveyors in the nineteen thirties called it the first state bank in Georgia. It stayed a bank until eighteen sixty five.

  The woman running a tearoom inside in the nineteen thirties told the surveyors one more thing. When Sherman took the city, she said, one of his generals made his headquarters here.

  Today it is a restaurant, and there is a tavern down in the cellar.

  Look at the corners again.

  A bank that pretended to be stone. Savannah has trusted it ever since.
detail: >-
  HABS (1934 to 1936) gives "approximately 1771", James Habersham as builder, the 1812 wing and lintels, the Planters Bank as "first State Bank in Ga" until 1865, the stucco tooled to look like stone and the quoins, and the tearoom proprietress's account of "Gen. York's headquarters when Sherman came", which the script attributes to her. The 1937 guide says it was built for James Habersham, Jr.; HABS says "Hon. James Habersham"; the script says only "a member of the Habersham family". The Boston Globe (2025) places Planters Tavern in the cellar of the Olde Pink House.
