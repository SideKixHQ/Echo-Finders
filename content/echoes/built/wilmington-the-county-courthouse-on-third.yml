script: |
  This is the late-nineteenth-century county courthouse at Third and Princess, built in
  1892 to 1893.

  It is not the earlier courthouse once located at Market and Third. Keeping those places
  separate prevents two very different periods from collapsing into one story.

  Look from the public sidewalk. The building's prominent scale and detailed exterior make
  government visible in the streetscape. A courthouse is designed to gather public
  business under an identifiable roof.

  Its landmark role continues even when visitors come mainly to look at the architecture.
  The exact address matters: history happened in particular buildings, and similar names
  can lead you to the wrong one. This stop anchors the later county institution, while the
  Market Street marker recalls the vanished colonial courthouse a block away.
