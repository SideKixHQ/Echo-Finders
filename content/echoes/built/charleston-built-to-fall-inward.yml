teaser: "A squat brick building with a steep tiled roof. Every powder store has to answer one question."
script: |
  The squat brick building with the steep tiled roof is the Powder Magazine. It went up in
  seventeen thirteen, and it is the oldest public building in South Carolina.

  Look at how solid it is. The walls are thirty-two inches thick, and when it was built they
  had no windows at all.

  Charles Town was a small walled settlement then, at the southern edge of England's claims,
  and it expected attack, from the Spanish, the French, and pirates. The town's gunpowder
  was kept here.

  It was condemned in seventeen seventy, then filled with powder again when the Revolution
  came. One old guide to the city says that during the British siege of seventeen eighty a
  shell landed close by, and after that it was given up as a magazine.

  Which brings you to the question every powder store has to answer. What happens if it goes
  off?

  Here, the answer was in the roof. According to the Park Service, the timbers inside were
  built so that if there were ever an explosion in the building, it would collapse in on
  itself.

  Not outward, into the town. Inward.

  Later it was a printing house, and then a livery stable. Since nineteen-oh-two it has
  belonged to the Colonial Dames, and today it is a museum.

  More than three hundred years on, it is still a building designed, if the worst came, to
  bury its own disaster.
