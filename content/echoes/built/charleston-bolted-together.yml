teaser: "Look along the house fronts for iron on the outside of the walls."
script: |
  Look along the house fronts on this street for iron on the outside of the walls. A plate,
  or the end of a bolt, up between the floors. Not every house has one. Many old buildings
  in this city do, and a lot of them were put there because of one night.

  At about ten o'clock on the thirty-first of August, eighteen eighty-six, an earthquake
  hit Charleston. It came with no warning and a roar like nothing anyone had heard. Walls
  and chimneys came down into the streets. Overturned lamps started fires. It was said at
  the time that more people were killed or hurt in those few seconds than the shelling of
  the whole Civil War siege had managed.

  In the months that followed, much of the town was not so much rebuilt as bolted back
  together. Iron bolts and iron plates went into the cracked walls.

  The test came on St. Patrick's Day, eighteen eighty-seven. At ten past nine in the
  morning there was another violent shock, with the same underground roar. The buildings
  seemed to be thrust forward and pulled back.

  A report from Charleston that day said that most of the buildings in town had been made
  earthquake-proof by iron bolts and plates, and that without them there would have been
  serious damage. Unrepaired cracks widened. Windows rattled. Plaster fell.

  The St. Patrick's Day celebrations went ahead as planned. Somebody had done the
  ironmongery.
