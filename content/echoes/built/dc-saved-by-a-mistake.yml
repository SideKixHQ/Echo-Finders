teaser: "Two men called John Suter, and a house nobody dared knock down."
script: |
  Look at the little stone house on M Street, squeezed in among the shops. It is the oldest building in Washington still standing on its first foundation. And it survived because of a mistake.

  It went up in seventeen sixty five, when this was a tobacco port in the colony of Maryland. Christopher Layman, who bought the lot, died that year, and his widow Rachael kept on building.

  Down by the river, a few blocks away, stood a tavern called the Fountain Inn, run by a man named John Suter. In seventeen ninety one, George Washington and the planner Pierre L'Enfant stayed there, while they worked out the new capital city. John Suter had a son, also called John. And the son rented the front room of this house, and made clocks in it.

  Two Johns. Two buildings. As the years went by, people mixed them up. The real tavern grew dirty and run down. And signs went up on this house, calling it George Washington's headquarters. Nobody wanted to knock down the place where Washington had worked.

  In nineteen fifty three, the government bought it, because local people believed it mattered. Then a Park Service historian named Cornelius Heine went through the records, and found the story was a myth. Archaeologists dug under the floor. It had never even been a tavern.

  Look at the house again. Inside, there is a tall clock made by John Suter Junior, which may have been built in that front room.

  Washington never worked here.

  That is why it is still standing.
