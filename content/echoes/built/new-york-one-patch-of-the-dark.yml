visibility: at-hand
certainty: documented
minAge: 0
quality: 0.75
tags: [new-york, midtown, grand-central, preservation, jacqueline-kennedy-onassis]
teaser: "Find the one dark patch in the stars. That is what the whole sky used to look like."
script: |
  Look up at the ceiling. The green sky. The gold stars.

  Now look for the dark patch, high up, near the western windows. Everything else up there is clean. That one patch is not.

  At one time, this whole night sky was black. Decades of cigarette and cigar smoke. In the nineteen nineties, workers spent a year cleaning the tar off it, by hand. And they left that patch, on purpose, to show how dirty it had been.

  But there very nearly was no ceiling to clean.

  In nineteen sixty four, the old Penn Station, across town, was torn down. Grand Central was in trouble too. Its owners wanted to build a tower, fifty five stories high, on top of it.

  In nineteen seventy five, a woman who had once lived in the White House led the fight against that plan. Jacqueline Kennedy Onassis.

  It went all the way to the United States Supreme Court. Three years later, the court upheld the city's landmark law. The tower was never built.

  Look at the dark patch again.

  They kept one piece of the dark, so you would know.

