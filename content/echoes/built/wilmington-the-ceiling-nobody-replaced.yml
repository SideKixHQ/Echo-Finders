id: wilmington-the-ceiling-nobody-replaced
title: "The Ceiling Nobody Replaced"
summary: "The stamped tin ceiling in the ground-floor showroom is the original one."
place: "Former Efird's and Einstein Brothers store, 272 North Front Street, Wilmington, North Carolina"
at: { lat: 34.23873, lng: -77.94904 }
triggerRadiusKm: 0.04
category: built
format: look-below
durationS: 25
visibility: at-hand
certainty: documented
minAge: 0
quality: 0.75
tags: [wilmington, downtown]
teaser: "Look up before you look at the shelves."
script: |
  Look up, through the window of whatever is trading on the ground floor.

  This went up in nineteen oh six, five storeys of blond brick. The city's landmark register
  says that ceiling is the original one, stamped tin, still up there on the first storey.

  Nobody preserved it. It simply outlasted every tenant who might have torn it out.
