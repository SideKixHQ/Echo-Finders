teaser: "Look all the way up the tower. There is a man standing on top."
script: |
  Look straight up the tower in front of you, past the clock, to the very top. There is a man standing up there.

  He is William Penn, the founder of Pennsylvania and the planner of this city. From down here he looks about life size. He is thirty-seven feet tall, and he weighs more than fifty-three thousand pounds of bronze.

  The last piece to go up was his head. It was set on his shoulders on the twenty-eighth of November, eighteen ninety-four, and the statue was complete.

  The tower under him rises five hundred and forty-eight feet. Until nineteen oh nine it was the highest occupied building in the United States.

  In the autumn of nineteen eighty-one, historians wrote this building up for the federal survey of American architecture. They put down one plain sentence. No other building in the city exceeds its height.

  Now turn around, and look at the skyline to the west.

  Count the towers standing higher than Penn's hat.

  Every one of them is younger than that sentence.
