teaser: "The man who drew the Washington Monument also drew this."
script: |
  Look west from Emma Street at the plain masonry building with porches on the front and the back. When it was last surveyed, it had been made into apartments.

  It began as a hospital for sailors, built in eighteen forty five. And it was designed by Robert Mills, the architect of the Washington Monument.

  He designed eight of these marine hospitals. This one was built for the heat. Windows everywhere, and two storey verandas at the front and the rear, for as much air and light as possible.

  And in the basement, two cisterns, each eighteen feet long. In Key West, a hospital kept its own water.

  Doctors here were pioneers against yellow fever. They helped bring in the quarantine laws that Florida, and then the United States, adopted.

  In Washington, Mills built up. Here, he built for the breeze.
detail: >-
  From the Historic American Buildings Survey record (HABS FL-194): one of eight Marine Hospitals designed by Robert Mills, whose Washington work included the Washington Monument; built 1844 to 1845 on land sold by John Simonton; two and a half storeys of stone and brick with two storey verandas front and rear; two 18 foot cisterns in the basement; Dr. Robert Murray and Dr. J. W. Porter among the pioneers in treating yellow fever and in the quarantine laws later adopted by Florida and the United States; closed as a Marine Hospital in 1943 and later remodelled for multi family housing. The survey's own wording on the date is OCR damaged; the 1845 date is from the record's structure dates. Access inside the Truman Annex was not checked.
