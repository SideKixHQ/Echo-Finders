# Listening spot: Emma Street between Southard and Fleming Streets, inside the Truman Annex, looking west at the old Marine Hospital. The building is private housing; the Truman Annex streets are walkable by day, but check access on site.
# Position: Midpoint of Emma Street between Southard (24.55270, -81.80535) and Fleming (24.55392, -81.80621) in the app's Key West street file. The HABS FL-194 UTM reference (17 418280 2715600) converts to 24.55216, -81.80692; the survey's Key West references sit about 140 m south of the matching Wikidata points, so the building is taken to be about 90 m west of this spot (medium-low confidence).
