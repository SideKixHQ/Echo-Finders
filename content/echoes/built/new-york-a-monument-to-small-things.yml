teaser: "The tallest building on earth, and not a dollar of it borrowed."
script: |
  Look across Broadway at the tall, pale tower, all the way up to its pointed crown.

  For seventeen years, it was the tallest building in the world. And it was paid for by shops where nothing cost more than a dime.

  The man who built it was Frank Woolworth. He started with one small store in eighteen seventy nine, selling only things that cost five or ten cents.

  The stores kept multiplying. And when it came time to put up the tallest building on earth, he did not borrow. He paid for it himself. Thirteen and a half million dollars, in cash. Not a mortgage. Not a dollar of debt.

  On the night of the twenty fourth of April, nineteen thirteen, President Woodrow Wilson pressed a tiny button in the White House.

  And here, all at once, eighty thousand lights came on, all over this tower.

  The people who wrote about it called it a cathedral of commerce. And a monument to small things.

  Look up at the top again. Seven hundred and ninety two feet.

  Five and ten cents at a time.

