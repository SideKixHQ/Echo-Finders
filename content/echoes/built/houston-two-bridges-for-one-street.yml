tags: [houston, the-heights, heights-boulevard, white-oak-bayou, bridges, streetcars]
teaser: "One street, two bridges, and a railing that reaches across to hold them together."
script: |
  Look at the bridges where Heights Boulevard crosses the bayou. Not one bridge. Two, side by side, with rows of little urn shapes along their railings.

  Most streets make do with one.

  In eighteen ninety one, the Omaha and South Texas Land Company began to lay out more than seventeen hundred acres north of Houston. It was seventy five feet above sea level, the highest ground around. So they called it the Heights.

  The man sent to plan it was the company's treasurer, Daniel Denton Cooley. He gave it a boulevard with a wide grassy strip down the middle, and a streetcar track on each side. It was the first divided boulevard in the Houston area.

  And when it came to the bayou, he would not narrow it. His grandson remembered him insisting on two bridges, to do justice to Heights Boulevard.

  So in eighteen ninety three, two wooden bridges went up here, sixty feet apart, built of more than sixty five thousand feet of lumber.

  In nineteen twenty two, the city replaced them with these, two concrete bridges, each two hundred and forty feet long.

  Look at the inside railings. They wrap around, from one bridge to the other, and join them. It is the only railing like it left in Houston.

  Two bridges, holding hands.

