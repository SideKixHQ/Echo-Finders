teaser: "Look above the windows. A whole army is marching around this building."
script: |
  Look up above the ground floor windows of this huge building. A band of sculpture runs along it. Look closer. Soldiers. A whole army, marching.

  Follow it to the corner. It does not stop. The parade goes all the way around the building.

  This was the Pension Building. After the Civil War, Congress kept widening the pensions it paid to Union veterans, to the wounded, and to widows and orphans. Somebody had to process all of it. This building was where they did.

  Its designer was Montgomery Meigs, the Army's Quartermaster General, the engineer behind the Capitol's dome. He meant the whole building as a memorial to the Union soldiers, sailors and marines. So he wrapped it in a procession of them, sculpted by Caspar Buberl. People compared it to the frieze on the Parthenon.

  He called this his greatest work.

  Inside, today, is a museum of building. But everyone who worked here, sorting the claims of veterans and widows, came to work under a parade of the men they were paying.

  Look up once more.

  They are still marching.
