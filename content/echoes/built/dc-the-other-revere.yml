teaser: "Look up at the tower of St. John's Church."
script: |
  Look up at the tower of St. John's Church, across H Street from the park.

  Behind the louvres, there is a bell. It has hung there since eighteen twenty-two.

  This is the church people call the Church of the Presidents. Benjamin Latrobe designed
  it, James Madison was given a pew, and every president from Madison to Lincoln came here
  to worship.

  The bell carries a maker's mark. It reads, Revere, Boston, eighteen twenty-two.

  Not Paul Revere. By then the family foundry had passed to his son, Joseph, and this is
  his bell.

  A federal survey of the church says what it is for. It rings the hours of worship. And it is
  sounded on occasions of national interest.

  The father is remembered for one night of raising the alarm. The son made something that
  has been doing it here for two hundred years.
