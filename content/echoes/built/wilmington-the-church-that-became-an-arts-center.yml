teaser: "Construction of St. Andrew's Presbyterian Church began here in 1888."
script: |
  Construction of St. Andrew's Presbyterian Church began here in 1888. The congregation
  dedicated the building in 1889.

  Its later history included other congregations, serious deterioration, and preservation
  efforts. The surviving structure became the Brooklyn Arts Center.

  From the public corner, notice that a changed purpose did not require the old building
  to disappear. Its prominent form remains part of the neighborhood while its interior
  serves new gatherings.

  The building's survival is the turning point. A former church could have become only a
  historical photograph. Instead, restoration made another use possible. Today's arts
  setting carries an architectural inheritance from the congregation that first raised it.
  When people gather here now, they add a chapter rather than beginning on a blank site.
