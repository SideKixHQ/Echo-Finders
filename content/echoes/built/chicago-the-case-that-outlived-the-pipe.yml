teaser: "The city's favourite survivor of the Great Fire was built to hide a pipe."
script: |
  Look at the pale stone tower with the battlements and the pointed top. It looks like a castle. It was built to hide a pipe.

  The Chicago Water Tower was built in 1869. Inside it stood a vertical iron standpipe, three feet across and one hundred and thirty-eight feet tall, connected to the main pumps of the Chicago Water Works across Michigan Avenue.

  The column of water in the pipe evened out surges in pressure whenever the city's demand for water suddenly changed.

  The stone is buff limestone from Joliet, Illinois, from a bed that has long since been quarried out. Look at the corners of the tower. Each block was cut back by chisel to make that rounded edge, for no reason except the light and shadow.

  Then came the Great Chicago Fire of 1871. The tower survived it, and became the recognized symbol of the city.

  In 1911, the standpipe and the pumps were taken out.

  So the most famous survivor of the fire is a beautiful stone case, with nothing inside. The wrapping is the part that lasted.
