script: |
  St. Thomas Preservation Hall describes its building as a former Catholic church
  constructed in 1847. Today it is used as an event venue.

  The change illustrates a practical route to preservation: keep an old structure useful
  while allowing its role to evolve.

  The original worship setting and the present venue are different chapters. Neither
  requires us to pretend that every surface or furnishing stayed unchanged.

  Listen from Dock Street unless you have permission to enter. A building's public history
  does not make a private event open to everyone.

  From outside, the survival is clear. The old structure remains part of downtown instead
  of becoming an empty lot. A new purpose supplies the reason to maintain it, while the
  name and building keep its earlier identity in view.
