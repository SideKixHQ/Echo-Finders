teaser: "Count the older ones on one finger."
script: |
  Look at the building. Its cornerstone was laid in eighteen seventy-one.

  In the whole state, exactly one Black Masonic lodge is older than it. In Wilmington, none
  is.

  Stay on the pavement if someone is using the door. It is still a working lodge, not a
  monument.
