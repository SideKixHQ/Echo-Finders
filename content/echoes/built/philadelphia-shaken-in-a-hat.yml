teaser: "Two names on two scraps of paper. The first one picked up won."
script: |
  Look at the little brick church, with its square tower, sitting low among the old graves. It was built here, and not somewhere else, because of a hat.

  Swedes had settled along these rivers long before William Penn came. By the sixteen nineties, they had outgrown their first church, an old log blockhouse built against attack. They wanted a real one. But where?

  The Swedes on the far side of the Schuylkill wanted it near them. The Swedes along the Delaware wanted it here, at a place called Wicaco. They argued for a long time, and neither side would give way.

  So they agreed to let God decide. There were hymns, and prayers. Then two words were written on two scraps of paper. Wicaco. And Passyunk. The papers were folded, shaken in a hat, and tipped out onto the ground. The first one picked up said Wicaco.

  And that was the end of the argument. They sang a hymn of praise, and everyone signed their names.

  The church went up in brick, and in July seventeen hundred it was dedicated. They called it Gloria Dei. Glory to God. Two years later, the walls already looked shaky, so they added the brick porches on the sides, to hold them up.

  Look at those porches. They went up to save walls that people thought were about to fall.

  The walls are still standing.
