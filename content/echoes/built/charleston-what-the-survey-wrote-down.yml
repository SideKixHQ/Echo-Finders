teaser: "Six windows that were never windows."
script: |
  Look at the long plain wing that runs back from the house along Elizabeth Street. Up at the second floor there are six blank panels with pointed tops. Windows that were never windows.

  This is the back of a planter's town house. Governor William Aiken lived here. What makes the place rare is not the front. It is everything behind it.

  When federal surveyors came in the late nineteen fifties and early sixties, they found the working yard still standing. A stable with six stalls. A carriage room. A harness room. A hay loft. And in the garden, two small brick cow houses. One was nearly gone. The other had an earth floor and room for two animals.

  They measured the floorboards. They noted a wrought iron lock on one door, stamped with its maker's name.

  Upstairs at the far end of the wing were two small rooms with fireplaces. The surveyors wrote that they appear to have been used for living purposes.

  They wrote down the hinges and the locks. They did not write down who lived in those rooms.
