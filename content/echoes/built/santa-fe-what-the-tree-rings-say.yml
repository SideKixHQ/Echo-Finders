teaser: "It is called the Oldest House. Its timbers have their own opinion."
script: |
  Look at the low adobe house across the street from the chapel of San Miguel. It is known as the Oldest House.

  Its western part has thick adobe walls, dirt floors, low ceilings, and a corner fireplace. None of the later decoration was ever added to it.

  So how old is it really? Its wood can answer that. Tree-ring samples taken from the house show its timbers were cut sometime between 1740 and 1767.

  That is old. But maybe not quite as old as the name suggests.

  The chapel across the street tells a similar story. It was first built around 1620, partly destroyed in the Pueblo Revolt of 1680, and rebuilt on the same site in 1710. It still has its original adobe walls. And inside is an altar screen from 1798, the oldest wooden altar screen in New Mexico.

  In this neighborhood, nobody asks whether something is old. They ask how old, exactly.
