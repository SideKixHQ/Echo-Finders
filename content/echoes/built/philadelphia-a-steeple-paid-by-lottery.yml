teaser: "Look up at the steeple. It was paid for by gamblers."
script: |
  Look up at the steeple of Christ Church.

  It went up in the seventeen fifties, and from then on it could be picked out from all over the colonial city. A Philadelphia guidebook from nineteen twenty calls it the highest point in town at the time.

  Steeples are expensive. A congregation usually builds one slowly, out of collections and bequests and patience.

  This one was paid for with a lottery.

  Tickets were sold to the public, and the money went into the tower and the spire. The tickets themselves came off the press in Benjamin Franklin's printing office. The same guidebook says Franklin sat on the committee that built the spire.

  So when you look up at the landmark of colonial Philadelphia, you are looking at a great many losing tickets.
