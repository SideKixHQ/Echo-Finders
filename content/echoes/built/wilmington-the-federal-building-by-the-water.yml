script: |
  The Federal Judicial Center dates this Wilmington courthouse building to 1919. It was
  named for Alton Lennon in 1972.

  Its waterfront position gives it an unusually visible place in the downtown landscape.
  Federal authority occupies the same streetscape as the riverfront's shops, visitors, and
  historic commercial buildings.

  Listen from the public sidewalk. Do not assume that a courthouse interior is a
  sightseeing area; any entry must follow current security and visitor rules.

  The building's two dates tell different stories. One belongs to construction and
  institutional use, the other to later commemoration. Names can change what a city
  remembers about a structure without changing its physical age. Here, the architecture
  and the public name carry separate layers of Wilmington's civic memory.
