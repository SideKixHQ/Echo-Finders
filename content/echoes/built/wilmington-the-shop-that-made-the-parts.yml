script: |
  Wilmington Iron Works made components for the machinery that kept the port city
  functioning. The city's history lists products ranging from fences to parts for
  locomotives and steamboats.

  This building began as a warehouse and was later reconstructed in brick. In 2025,
  Wilmington designated the former machine shop a local historic landmark.

  Listen from the public sidewalk. A waterfront economy needs more than ships and cargo.
  Equipment wears out; parts must be produced, repaired, and fitted.

  The shop's importance lies in that supporting work. Its products could leave the
  building and become nearly invisible inside larger machines. The surviving structure
  restores a place to that labor, reminding you that the city depended on skilled
  manufacturing behind the more dramatic scenes of transportation.
