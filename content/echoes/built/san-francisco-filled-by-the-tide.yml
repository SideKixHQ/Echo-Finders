teaser: "Seven swimming pools once stood on these rocks, and the ocean filled them."
script: |
  The concrete basins below you are the remains of Sutro Baths.

  Adolph Sutro developed the baths in 1894. A classic Greek portal opened to a massive glass enclosure, with seven swimming pools at different temperatures. There were slides, trapezes, springboards and a high dive.

  The Baths could hold ten thousand people at one time. They had twenty thousand bathing suits and forty thousand towels for rent.

  And the water came straight from the sea in front of you. At high tide, the Pacific could fill all one point seven million gallons in just one hour.

  The Baths were not a business success for long. The owners turned them into an ice-skating rink. In 1964 developers bought the site to put up high-rise apartments, and began knocking the building down. In 1966, a fire destroyed what was left.

  The apartments were never built. The glass is gone. The ocean still comes in.
