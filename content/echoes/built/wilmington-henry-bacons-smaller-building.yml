script: |
  The MacRae house was built in 1901 and designed by Henry Bacon, the architect later
  associated with the Lincoln Memorial in Washington.

  St. James acquired the house in 1955, and it serves parish offices. Its local history
  therefore combines domestic design with a later institutional role.

  Stand on the public sidewalk. The Washington connection is about the architect, not a
  claim that this house was a model for the memorial.

  A famous commission can overshadow an architect's smaller work. This stop restores the
  smaller scale: rooms intended for daily life rather than a national monument. Bacon's
  career reached both kinds of building. Downtown Wilmington retains a place where his
  design work met an ordinary urban household and, later, the needs of a parish.
