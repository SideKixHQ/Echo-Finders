script: |
  This five-story commercial building dates to 1906, with a later addition. Wilmington's
  landmark description notes the light and open space that served wholesale and retail
  trade.

  The building was designed to show goods, not merely store them. Its scale makes the
  ambition visible from the street.

  Stand clear of entrances and look upward. A downtown shop could occupy a substantial
  architectural presence, combining business needs with a recognizable public face.

  Names and tenants changed, but the structure continued offering space for commerce. The
  landmark's story connects the customer on the pavement with the larger world of
  suppliers and merchants inside. A display window is the meeting point: goods become
  visible, and a passing person becomes a possible buyer.
