teaser: "Everyone will tell you this stone was ballast. Here is what the record says."
script: |
  Look down at the cobbles under your feet, and at the rough stone in the old walls along River Street.

  You will hear, probably more than once today, that this stone crossed the ocean as ballast. Ships that came over light carried rock low in the hold to keep them steady, dumped it here, and loaded cotton for the voyage out.

  Here is what the record actually supports.

  Ships really did arrive that way. On the second of November eighteen eighty nine, the Savannah Morning News listed a Norwegian bark up from Buenos Aires, in ballast. Another came from Brazil, in ballast. That was an ordinary day.

  Ballast really was dumped on this waterfront. A city guide from eighteen eighty one boasted that when a railway's wharves downriver were filled in, the four quarters of the habitable globe had contributed, by way of ballast from foreign ships. When the old eastern wharves were recorded in two thousand seven, just before they were demolished, the ballast that filled them was still there.

  And when federal surveyors photographed a stone warehouse on River Street in the nineteen thirties, they wrote that its rubble stone was said to have been brought over as ballast.

  Said to have been. Even then it was the story, not the receipt.

  So nobody can show you which stone came from where. But the ships came in heavy with rock, and the rock had to go somewhere.
