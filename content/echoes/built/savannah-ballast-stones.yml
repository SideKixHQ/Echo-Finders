certainty: contested
certaintyNote: >-
  That ships arriving in ballast came up this river, and that foreign ballast was used as waterfront fill, is documented. That the stones in River Street's walls and paving are that ballast is a tradition recorded as "said to have been" since the 1930s; no source ties any particular stone to a ship. The script says so.
minAge: 0
quality: 0.75
tags: [savannah, savannah-core, riverfront, shipping, cotton]
teaser: "Everyone will tell you this stone was ballast. Here is what the record says."
script: |
  Look down at the cobbles under your feet, and at the rough stone in the old walls along River Street.

  You will hear, probably more than once today, that this stone crossed the ocean as ballast. Ships that came over light carried rock low in the hold to keep them steady, dumped it here, and loaded cotton for the voyage out.

  Here is what the record actually supports.

  Ships really did arrive that way. On the second of November eighteen eighty nine, the Savannah Morning News listed a Norwegian bark up from Buenos Aires, in ballast. A British steamship came in from Teneriffe, in ballast. That was an ordinary day.

  Ballast really was dumped on this waterfront. A city guide of the early eighteen eighties boasted that when a railway's wharves downriver were filled in, the four quarters of the habitable globe had contributed, by way of ballast from foreign ships. When the old eastern wharves were recorded in two thousand seven, ahead of their demolition, the ballast that filled them was still there.

  And when federal surveyors photographed a stone warehouse on River Street in the nineteen thirties, they wrote that its rubble stone was said to have been brought over as ballast.

  Said to have been. Even then it was the story, not the receipt.

  So nobody can show you which stone came from where. But the ships came in heavy with rock, and the rock had to go somewhere.
