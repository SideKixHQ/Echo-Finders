certaintyNote: >-
  That ships arriving in ballast came up this river, and that foreign ballast was used as
  waterfront fill, is documented. That the stones in River Street's walls and paving are that
  ballast is a tradition recorded as "said to have been" since the 1930s; no source ties any
  particular stone to a ship. The script says so.
