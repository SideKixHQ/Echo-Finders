teaser: "The house moved twice. Its cellar never left."
script: |
  Find the little stone house on the corner of Seventeenth Street and Constitution Avenue. Now look at the paving in front of it. There are two outlines there. The house has stood in both of them.

  And one whole floor of it is still under the road.

  It was built in the eighteen thirties, for the man who worked the lock on a canal. Where Constitution Avenue runs now, there was water. Canal boats came down hundreds of miles of canal, pulled by mules, and their journey ended here. History remembers two lockkeepers by name. John Hilton, and then Thomas Sampson. The lockkeeper collected the tolls, and kept the records of what came into the city. The whole family helped work the lock.

  Then the railroads came, and the canal failed. It turned into an open sewer, and was filled in. The house stayed. It became a public toilet, a police station, a holding cell, and a tool shed. When Seventeenth Street came through, the house was in the way. So in nineteen fifteen, they moved it, and left the bottom floor behind. Later it sat boarded up for more than forty years. In twenty seventeen, they jacked it up onto dollies, and rolled it back from the street.

  Look down at the outlines again. The house moved twice.

  Its cellar never left.
detail: >-
  Sources differ on dates: the Park Service gives 1837 (or 'finished in 1833') for the house and 1915 for the first move; NPR gives 1916. The script says the eighteen thirties and nineteen fifteen.
