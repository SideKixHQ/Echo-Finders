tags: [charleston, charleston-core, fireproof-building, robert-mills, architecture, washington-square]
teaser: "Look for the wood. There isn't any."
script: |
  Look at the windows of this plain, grey building. The shutters are not wood. They are iron. So are the window frames. Look for anything at all that could burn.

  There is nothing. That was the whole point.

  In a city that kept burning, this was built to keep the public records safe. No flammable material was used anywhere in it. It was solid masonry, with an oval hall inside, and a stone staircase that seems to hang in the air.

  It is believed to be the oldest fireproof building in the United States.

  Its architect was born in Charleston. Robert Mills, the first American born architect trained for the job. He drew for Thomas Jefferson at Monticello. And later, he designed the Washington Monument.

  The building was put to the test in eighteen eighty six, when the great earthquake struck. It came through unharmed, except for its outside stairs.

  Look at the iron shutters again.

  Iron, stone and brick. All of it, to keep paper safe.
detail: >-
  The National Park Service page gives the date of 1827 (the 1941 state guide says 1826), the original name Charleston District Record Building, the absence of flammable materials, the iron sashes and shutters, the cantilevered stone stair, survival of the 1886 earthquake except the exterior stairs, and Mills's training, his work for Jefferson and his design of the Washington Monument. "Oldest building of fireproof construction" is the NPS wording, given as a belief.
