teaser: "Turn your back on the harbour and look at the roofline of number twenty-one."
script: |
  Turn your back on the harbour and look across the street at number twenty-one. A big,
  three-storey house with deep piazzas down the south side. Now look at the very top of the
  front, at the low wall that hides the roof. There is a coat of arms up there.

  When the federal building survey wrote this house up, it called that an unusual feature.
  As far as anyone knew, it was the only house in the city with one.

  The arms are not the builder's.

  The house was standing by eighteen twenty-nine. It was built by Charles Edmondston, and
  it looks straight out over the harbour.

  In eighteen thirty-eight it was sold. Not by Edmondston, but by the assignees handling
  his firm's affairs. The price was fifteen thousand five hundred dollars.

  The buyer was Charles Alston. He redecorated the whole house in the Greek Revival style,
  added a third tier to the piazzas, and put his family's arms on the parapet, on the
  front that faces the water.

  The survey ended up filing the house under three names. Edmondston, Alston, and a later
  family's. Only one of them is written on the roof.
