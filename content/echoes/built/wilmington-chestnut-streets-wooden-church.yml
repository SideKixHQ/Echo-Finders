script: |
  Wilmington identifies this 1858 church as an important example of Carpenter Gothic
  architecture with Italianate influences.

  The city's account also connects it with one of Wilmington's early Black congregations.
  Its significance therefore belongs to both architectural form and community life.

  Listen from the public sidewalk. Gothic ideas did not require stone walls and enormous
  cathedrals to become recognizable. Builders could interpret them in a smaller wooden
  structure suited to a different setting.

  The result asks you to look beyond size when deciding what counts as a landmark. A
  modest building can carry a substantial history. Here, a continuing religious community
  and a distinctive design give the structure meaning together. Its value lies in that
  relationship, not merely in its age.
