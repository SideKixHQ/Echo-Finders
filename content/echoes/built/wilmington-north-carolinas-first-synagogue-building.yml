teaser: "Dedicated in 1876, Wilmington's Temple of Israel is recognized as North Carolina's first Jewish house of worship."
script: |
  Dedicated in 1876, Wilmington's Temple of Israel is recognized as North Carolina's first
  Jewish house of worship.

  The congregation describes its building as Moorish Revival, a style used by synagogues
  in Europe and the United States during that period.

  The corner therefore carries two stories together: a community establishing a permanent
  worship space and a design expressing that presence publicly.

  Remain on the sidewalk unless the congregation has authorized a visit. Its historical
  significance does not change its role as an active religious site.

  Look at how the building addresses Market Street. It belongs to Wilmington's streetscape
  while retaining a distinctive identity. The milestone is not simply that construction
  finished. A Jewish congregation secured a place where its life could continue across
  generations in the city.
