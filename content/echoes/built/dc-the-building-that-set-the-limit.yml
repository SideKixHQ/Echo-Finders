teaser: "Why is Washington so low? Look up. Part of the answer is this building."
script: |
  Tip your head back and look up at this tall brick building on a residential street. It is called the Cairo.

  When it was finished, in eighteen ninety four, it was the city's first residential skyscraper. One hundred and sixty four feet. The tallest private building in Washington.

  Its architect was Thomas Franklin Schneider. And the reaction to what he built is still shaping the city you are walking through.

  Height limits followed. By nineteen ten, Congress had passed a law tying the height of every building in Washington to the width of the street in front of it. Wide avenues, taller buildings. Narrow streets, shorter ones. And a cap of about eleven stories in commercial areas.

  People like to say there is a rule that nothing can be taller than the Capitol, or the Washington Monument. A planner at the National Capital Planning Commission calls that a myth. The real rule is the street.

  Look back up at the Cairo.

  Washington stayed low. This is the building that made it write the rule down.
