detail: >-
  The Library of Congress gives 164 feet on one record and 165 on its Historic American Buildings Survey record, which says its height "led to the imposition of height restrictions in 1910". The script says only that height limits followed; earlier District limits (1894, 1899) are reported elsewhere but not in the fetched sources.
