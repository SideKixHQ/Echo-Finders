teaser: "At its very end, the Golden Gate Bridge steps over a building."
script: |
  Look up, above the brick fort, at the underside of the bridge. There is a steel arch up there. It does not cross any water. It steps over the fort.

  Fort Point was built between 1853 and 1861 to guard the entrance to San Francisco Bay. Its guns never fired a shot in anger.

  In the late 1930s, the plans for the Golden Gate Bridge also involved plans for the demolition of Fort Point.

  Before construction began, Chief Engineer Joseph Strauss toured the empty fort. He changed his mind, and he changed his design.

  While the old fort has no military value now, he wrote, it remains nevertheless a fine example of the mason's art.

  So he designed a steel arch to span the old fort, and the bridge went over the top of it.

  Most bridges are built over water. Down at this end, the bridge was built over a fort, on purpose.
