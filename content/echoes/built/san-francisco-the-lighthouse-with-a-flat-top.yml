teaser: "Out in the waves is a striped lighthouse with its top missing."
script: |
  Look out at the water toward the Golden Gate. Among the waves there is a red and white striped tower on a rock, with a flat top.

  That is the Mile Rocks light. There are two rocks out there that appear and disappear with the swell of the waves.

  The lighthouse was built after the wreck of the steamship City of Rio de Janeiro in 1901, the worst shipwreck in San Francisco's history.

  In 1904 a three-tiered lighthouse went up on the larger rock. At the time, it was hailed as one of America's greatest engineering feats.

  For over sixty years it was kept by four men, living in cramped quarters for days at a time. Isolated from the city, while it sat in plain view.

  In 1966, the Coast Guard automated the light. Its top two tiers were taken away and replaced with a helipad.

  So the flat top is the clue. That is where the rest of the lighthouse used to be.
