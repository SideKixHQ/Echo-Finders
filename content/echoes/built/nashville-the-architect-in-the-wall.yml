teaser: "The man who designed this capitol never saw it finished. He is inside it."
script: |
  Stand on the north side of the capitol and look at the lower portico. The man who designed this building is inside that wall.

  His name was William Strickland, an architect from Philadelphia.

  The digging began on the first of January, 1845. The walls are Tennessee limestone, quarried within half a mile of here. Some of the blocks are eight feet wide and fourteen feet long.

  Instead of a Roman dome, Strickland gave it a tower, after ancient Greek models.

  He did not see it finished. He died in April 1854, and his funeral was held inside, in the Hall of Representatives.

  Then his body was placed in a recess in the walls of the north portico. It is still there.

  His son finished the job. The last stone of the tower went up in July 1855.

  Most architects sign their buildings. Strickland is buried in his.
