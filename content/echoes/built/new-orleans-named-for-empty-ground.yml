teaser: "The best address in Creole New Orleans is a military word."
script: |
  Look down Esplanade Avenue, toward the river. The trees, the wide middle, the old houses on both sides.

  A guidebook of nineteen hundred and four said this avenue was to the Creoles what St. Charles Avenue was to the Americans. Their grand residence street.

  The name is older than the houses, and it is a soldier's word.

  Right here, where Rampart now crosses Esplanade, the Spanish governor Carondelet put up a fort in seventeen ninety-six. Fort St. Ferdinand. It was part of a ring of defenses around the town.

  An esplanade is the open, cleared ground that lies outside a line of fortifications like that. Flat, bare and empty. That is what this was.

  The fort was taken down early in the eighteen-hundreds, and the town spread out across the cleared ground.

  So the finest address in Creole New Orleans is named for the space that was meant to stay empty.
detail: |
  The 1913 Picayune guide calls Esplanade the principal residence street of the French
  Quarter and says Fort St. Ferdinand was dismantled in the early part of the nineteenth
  century; the Rampart Street defenses did not wholly disappear until 1820.
