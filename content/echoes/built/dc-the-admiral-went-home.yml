tags: [washington, dupont-circle, samuel-du-pont, daniel-chester-french, fountain, civil-war]
teaser: "The circle is named for a man whose statue used to stand here. Where did he go?"
script: |
  Look at the fountain in the middle of the circle. A wide marble bowl, held up by three figures. The Sea. The Wind. The Stars.

  This is Dupont Circle. So where is Dupont?

  For more than thirty years, he stood right here. A bronze statue of Admiral Samuel Du Pont, a Union naval officer, standing with a pair of binoculars. When it was unveiled, in December eighteen eighty four, it was draped in an American flag, the houses all around were hung with bunting, and the crowd cheered. The circle was renamed for him that year.

  But his own family were not happy with it. The Park Service does not know why. It says only that they felt the statue had become an embarrassment.

  So in nineteen seventeen, they asked Congress to let them take him home. Congress agreed. The admiral went back to Wilmington, Delaware, where he still stands.

  In his place, the family put up this fountain. It was designed by the same two men who made the Lincoln Memorial, Henry Bacon and Daniel Chester French.

  Look at the three figures holding up the bowl.

  None of them is the admiral.
detail: >-
  The Park Service gives no reason for the family's embarrassment ("For whatever reason, the family felt the statue in its Washington location had become an embarrassment"); the script does not guess.
