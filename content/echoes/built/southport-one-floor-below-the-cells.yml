tags: [southport, jail, museum, brunswick-county]
teaser: "The county jail had prisoners upstairs and a family living downstairs."
script: |
  Look at the two-story brick building on this corner. It was the county jail from 1904 until 1971.

  It cost a little less than seven thousand dollars, after several earlier wooden jails were destroyed by hurricanes and fires.

  The cells were upstairs. Each had four bunks, a commode and a wash basin.

  Downstairs, in two tiny rooms, lived the jailer, with his family.

  It could hold eleven prisoners, but it usually held two or three, in for short stays and minor offenses.

  Through every summer it was a jail, it never had working air conditioning.

  Today it is a museum. You can step into the original cells and read the graffiti the prisoners left on the walls.

  For the jailer's children, home was one floor below the cells.
