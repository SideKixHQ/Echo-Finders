teaser: "The richest man on the hill against the one neighbour who would not sell."
script: |
  Stand on Sacramento Street, beside the cathedral, and look along its wall. Before the cathedral, there was a mansion on this block. It belonged to Charles Crocker.

  In eighteen seventy seven, Crocker set out to own the whole block. One man would not sell. A Mr. Yung, whose house stood on a strip of land twenty five feet wide, here on Sacramento Street.

  So Crocker had Yung's house hemmed in by a fence. A fence that shut out the sunlight.

  It became a sight. Gripmen stopped their cable cars at the spot so passengers could look. Cab drivers brought tourists to stare. Souvenir hunters pulled pickets off it to take home. People called it the spite fence.

  Neither man gave in. The Crocker family got the land only after both of them had died.

  The mansion stood until nineteen oh six. Crocker's heirs gave the land to the church.

  The cathedral stands on the block Mr. Yung would not sell.
detail: >-
  From the 1940 Federal Writers' Project guide to San Francisco, Grace Cathedral entry: the property deeded to the diocese by Crocker's heirs, his mansion standing until 1906, his attempt in 1877 to acquire the whole block, Yung's home on a 25 foot strip on Sacramento Street, the fence that shut out the sunlight, gripmen stopping their cable cars, hackmen bringing tourists, souvenir seekers removing pickets from the "spite" fence, and the Crocker family obtaining the property only after the death of the principals. The guide gives only "a Mr. Yung"; his full name is not in the source. "Both of them" reads "the principals" as Crocker and Yung.
