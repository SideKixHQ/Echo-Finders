teaser: "A deep porch built for summer breezes, and the neighbor that moved away."
script: |
  Look at the cottage from the sidewalk; it is a private home. The James Cottage was built in
  1900 for Dr. W.D. James of Hamlet.

  It is a summer cottage design: one story, a triple gable roof and a deep porch. The hip roof along
  the street was the servants' quarters.

  On this beach, the porch was where summer happened. Meals were often eaten outdoors on the porch,
  to catch the cool summer breezes.

  Across the street, at 124 South Lumina Avenue, stood the Myers Cottage. In 1995 it was moved away
  to house the Wrightsville Beach Museum. Its neighbor across the road stayed put.
