teaser: "The mother church of country music was built by a steamboat man who owned a saloon."
script: |
  Look at this old brick hall with its tall arched windows. It was built for preaching, by a man who owned a saloon.

  Thomas Ryman ran a line of steamboats on the Cumberland River, and a large saloon here in Nashville.

  In 1885 he fell under the preaching of a revivalist named Sam Jones, and he was converted.

  After that he set out to build the city a great hall for preaching, open to every denomination.

  Work started in 1889. It was dedicated in 1892 as the Union Gospel Tabernacle, and Ryman carried much of the hundred thousand dollar debt himself.

  When he died, in 1904, four thousand people came here for his memorial. Sam Jones preached it, and proposed the building take his name.

  For years it was the largest auditorium in the South. Soon it was used less for revivals than for conventions, concerts and stage shows.

  Then the Grand Ole Opry moved in, and stayed until 1974. People came to call it the church of country music.

  So the saloon keeper did get his church. It just ended up full on a Saturday night.
