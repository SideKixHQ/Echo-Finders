teaser: "Some of these lighthouse prisms spent decades as paperweights."
script: |
  Inside this cottage beside Old Baldy is a replica of a great lighthouse lens. The real one is still being collected, one piece at a time.

  It crowned the Cape Fear Lighthouse, a steel tower that stood on this island for more than half a century. Then in 1958 the Oak Island Lighthouse was built, and the Cape Fear tower was demolished.

  The contractor had the sense to save the lens. It ended up in a Wilmington antiques shop, and the hundreds of glass prisms were sold off, one by one.

  They scattered. Some became paperweights. Others were found beneath a bed. One person used a big bull's eye panel as a coffee table, until the sun came through it and burned a hole in the carpet.

  The Old Baldy Foundation is putting the lens back together, and asking people to bring the pieces home. It still needs about two thirds of them.

  If someone you know has a heavy wedge of old glass on a desk, it might be part of a lighthouse.
