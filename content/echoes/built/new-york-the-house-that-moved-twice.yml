teaser: "Two hundred tons of house, thirty eight feet up in the air."
script: |
  Look at the yellow and white house in front of you, with its porches and tall windows.

  It is not where it was built. It has moved twice.

  Alexander Hamilton built it in eighteen oh two, as a country home on his estate up here. It was the only home he ever owned. Lower Manhattan was two hours away by carriage. He named it The Grange, after his family's old home in Scotland.

  He lived in it for two years. On the eleventh of July, eighteen oh four, he was fatally wounded in a duel with Aaron Burr.

  Then the city grew up the island toward his house. In eighteen eighty nine, a new street was coming through. So the house was lifted off its foundation and drawn by horses to a new spot, squeezed between a church and an apartment building.

  In two thousand eight, the Park Service moved it again. But a stone porch on the church was in the way. So the movers jacked the whole house, nearly two hundred tons, thirty eight feet into the air. And rolled it out over the top.

  On the seventh of June, hundreds of people watched it roll down the street, turn the corner, and come here.

  Look at the trees around it. Thirteen sweet gums, for the thirteen original states, like the grove on the first site.

  This little piece of park was part of Hamilton's own estate.

  The house came home.

