script: |
  This bridge was built in 1911 to replace a deteriorating wooden crossing above railroad
  tracks. Wilmington recognizes it as the city's surviving steel truss bridge from that
  era.

  The truss makes structural work visible: connected members help carry loads across an
  opening. The form is not simply decorative.

  Look from a safe public approach, following any closure signs. Do not go beneath it onto
  railway property for a better view.

  A bridge solves a local problem, but it also records what lay in the way. Here, streets
  had to cross the railroad infrastructure that helped define the neighborhood. The steel
  span kept those two systems connected. Its survival lets you see a practical response to
  a city built around trains as well as streets.
