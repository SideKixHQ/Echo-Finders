teaser: "A one-lane iron truss bridge from 1910 carries Sixth Street over Wilmington's railroad cut."
script: |
  This one-lane truss bridge carries Sixth Street over a railroad cut. A National Register
  survey of downtown Wilmington dates it to 1910 and describes an iron automobile bridge,
  145 feet long, set on concrete abutments.

  The truss makes structural work visible: connected members help carry loads across an
  opening. The form is not simply decorative.

  Look from a safe public approach, following any closure signs. Do not go beneath it onto
  railway property for a better view.

  A bridge solves a local problem, but it also records what lay in the way. Here, streets
  had to cross the railroad infrastructure that helped define the neighborhood. The span
  let street and rail pass each other without meeting. Its survival lets you see a
  practical response to a city built around trains as well as streets.
