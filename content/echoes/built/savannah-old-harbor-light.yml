teaser: "It is a lighthouse. Or it was."
script: |
  Look at the tall iron post at this end of the park, with the light at the top.

  That is a lighthouse. Or it was.

  The United States government put it up in eighteen fifty eight, a cast iron standard on a granite foundation, here on the Bay, as a beacon for mariners finding their way up the Savannah River.

  Notice where it stands. Not on a headland. Not out on the water. Up on the bluff, at the end of a city street, on what was then the Bay Street green. In nineteen hundred the city's park commission asked for money to improve that green, and suggested a name for it. Emmet Park.

  When federal surveyors came to record the light in the nineteen thirties, they noted two things about it.

  It had not been used for many years.

  And it was well maintained.

  Somebody was looking after a light that nobody needed.
