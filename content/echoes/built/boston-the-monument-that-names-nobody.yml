teaser: "Forty feet of stone in honour of a discovery. Look for the discoverer's name."
script: |
  Find the tall stone monument, the oldest in the Public Garden. It went up in eighteen sixty eight, about forty feet of it, to celebrate ether. Twenty two years earlier, at Massachusetts General Hospital, ether had been used in public to put a patient under for surgery.

  Read the inscription. It praises the discovery for the relief of human suffering.

  Now look for a name.

  There isn't one.

  By then, three men had claimed the discovery. William Morton, the dentist who gave the ether that day. Charles Jackson, a doctor. And Horace Wells, a Connecticut dentist, who had tried laughing gas in the same operating theatre, and failed.

  Their claims were never sorted out. The fight ravaged all of their lives.

  In Hartford, Connecticut, there is a statue of Horace Wells. Its inscription calls him the discoverer of anaesthesia.

  Boston decided not to decide.

  Forty feet of stone, and not one name on it.
detail: >-
  The Boston Globe (2014) gives the Ether Monument commemorating the discovery, Wells as a Connecticut dentist who tried nitrous oxide until a disastrous demonstration in the same amphitheater, Morton's later demonstration, Wells and Dr. Charles Jackson making claims "that were never sorted out", the aftermath that "ravaged all of their lives", the Hartford statue inscribed "Horace Wells, discoverer of anesthesia", and that the Boston monument's inscription "praises the discovery for its relief of human suffering, but mentions no names at all". The Globe (2024) gives 1868 as the date, the oldest monument in the Public Garden, about 40 feet tall, and the 1846 demonstration. One flag: the 2024 piece also says the monument "honors the Boston dentist" credited with the first public use; the 2014 piece and the script follow the inscription, which names no one. Both are Globe articles, so this is single-source by publisher. "Boston decided not to decide" is the script's reading, not a sourced claim. The position needs checking on site.
