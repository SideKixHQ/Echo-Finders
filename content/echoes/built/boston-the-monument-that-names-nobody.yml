# Listening spot: The path beside the Ether Monument in the Boston Public Garden, on the Arlington Street side of the garden, north of the lagoon.
# Position: Placed from memory of the garden's layout, near Arlington and Marlborough streets; the monument is not in the Overture data the app's map uses (low confidence: check on site before approval). About 120 m from the swan boats echo and 110 m from the ducklings.
