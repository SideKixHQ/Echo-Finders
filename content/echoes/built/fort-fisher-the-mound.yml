teaser: "The tallest thing on this beach was built with a steam engine and a scaffold."
script: |
  At the far end of the fort's sea face stood its landmark, a battery forty-three feet high,
  known as the Mound.

  It was built in the spring of 1863, and not by shovel alone. A steam engine on an inclined
  railway hauled sand to the top of a scaffold, and hundreds of men dumped it from there until
  the mound took shape.

  Because it could be seen from so far out, it became a lighthouse of sorts. Signal lights on
  the Mound talked to incoming blockade runners.

  When Jefferson Davis visited in 1863, he rode up to the top. The guns of the sea face fired a
  twenty-one gun presidential salute.

  The ships it guided in were smuggling the war's supplies. The light was for them.
