teaser: "Look up the hill at the gold dome. It was not always gold."
script: |
  Look up the hill at the dome of the State House. It was not always gold.

  In November eighteen-oh-two, a New Hampshire newspaper reported that the superb dome of
  the new State House had just been coppered. The sheets, it said, were made in
  Massachusetts by Colonel Revere and son.

  That is Paul Revere. After the war he went into industry, and opened a copper mill. The paper added, with some pride, that it was the only sheet copper works
  in America.

  So for about seventy years the dome was the colour of copper. It was gilded in the
  eighteen-seventies, and Boston argued about whether the gold was worth the money. A
  newspaper later made a point of it. Real gold leaf, not gilt paint.

  Then in nineteen forty-two, with the country at war, the dome was to be painted a dull
  grey, as an air raid precaution.

  Revere is remembered for one night on a horse. Look up. This was his day job.
