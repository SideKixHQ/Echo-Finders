teaser: "The oldest part of this wharf was built at low tide, on the mud."
script: |
  Look down at the edge of this wharf. The stone is not where it started.

  Richard Derby and his son Elias Hasket Derby began building it in 1762.

  As their trade grew, they kept making it longer. By 1806 it reached two thousand and forty-five feet into Salem Harbor.

  At one time nearly twenty buildings stood on it, among them the counting house that ran Elias Hasket Derby's trading empire.

  In 1992 an archaeological dig showed how it was made.

  The 1762 section was built by laying timbers on the mud flats at low tide, then filling between the timber walls with dirt and stones.

  The granite blocks came later, in the nineteenth century.

  Under the stone, a merchant's ambition, packed into the mud by hand between the tides.
