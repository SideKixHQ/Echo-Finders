teaser: "The plainest front on the street hides a way out under the floor."
script: |
  From the street this synagogue has a severe, plain face.

  Inside, in the floor of the raised reading desk, there is a trap door. The building survey records that it leads to an escape hatch and a tunnel to Barney Street.

  Nobody walking past would know. The plainest front on the street keeps a way out under its floor.
