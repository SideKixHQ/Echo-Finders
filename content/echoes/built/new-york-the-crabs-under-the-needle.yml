teaser: "Look at the corners. It is standing on crabs."
script: |
  Look at the bottom corners of the obelisk, where the stone meets its base. In each corner there is a bronze crab, holding it up.

  Crabs. Under a stone that was carved three and a half thousand years ago. Why crabs?

  In eighteen eighty, a United States Navy officer named Henry Gorringe took this obelisk down in Alexandria, in Egypt, to bring it to New York. When his men dug around its base, they found what it had been standing on.

  Bronze crabs, put there by the Romans. Plunderers had carried two of them off long before. The two that were left had lost nearly every leg and claw, broken off for the value of the metal.

  On the one claw that remained, there was writing. Greek on one side, Latin on the other.

  It was the only record of the day the Romans moved this obelisk to Alexandria. It named the emperor Augustus, and the architect, Pontius.

  And it settled something. Everybody called this Cleopatra's Needle. The claw did not mention her. The stone is older than Cleopatra by more than a thousand years.

  The crabs you can see now are copies, cast at the Brooklyn Navy Yard from plaster casts of the Roman ones. Look closely at their claws. They are inscribed too, in English. One says this obelisk was erected in New York City on the twenty second of January, eighteen eighty one.

  Two thousand years apart, two crews left the same kind of note, in the same strange place.

