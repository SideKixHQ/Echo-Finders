teaser: "Look up at the monument, about a third of the way."
script: |
  Look up at the monument, about a third of the way.

  There is a line. Below it the marble is one shade, and above it, another. Right at the
  line there is a narrow band of something browner.

  Nobody designed that.

  The first stones went up in 1848, paid for by a private society that never had enough
  money. By 1854 the society was bankrupt, and the work stopped at one hundred and
  fifty-six feet.

  Then it stayed that way. Through the Civil War and for more than twenty years, the
  monument to the father of the country stood half built on the Mall.

  When the government finally took it over, the old quarry near Baltimore was no longer
  available. The builders tried stone from Massachusetts. They had trouble with its color,
  laid a few courses of it anyway, and then switched to a third quarry for everything above.

  The stones never matched exactly, and the weather has been pulling them apart in color
  ever since.

  When it was finished, this was the tallest building in the world. And you can still see
  exactly where it ran out of money.
