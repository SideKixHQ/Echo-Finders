teaser: "Find the house numbered ninety-nine and look at its iron balcony."
script: |
  Find the house numbered ninety-nine on this row, and look at its iron balcony. There are
  two letters worked into the ironwork. A C and a P.

  The letters have nothing to do with this house.

  The house went up around seventeen forty. It was built by Othniel Beale, a wharf owner
  who had come down from Marblehead in Massachusetts, and his wharf was right across the
  street. He built three dwellings in a row, kept the biggest for his family and let the other two. The ground floor was for trade, split by an arched passage through to the
  yards at the back.

  By the nineteen thirties this neighbourhood had slid into dilapidation.

  This was the first house on the row to be rescued. Judge Lionel Legge and his wife are credited with that, along with Susan Pringle Frost, an estate agent who had spent years saving old Charleston houses. They restored the early windows. They replaced the shop fronts with
  cargo doors. And the iron balcony was salvaged from a house on Elizabeth Street that has since been demolished. The C. F. Prigge house.

  They are credited with the revival of the whole block. It is called Rainbow Row
  now.

  The row was saved one house at a time. The first one wears a stranger's initials.
