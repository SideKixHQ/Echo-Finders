script: |
  Saint Mary's church is known for elaborate brickwork by Rafael Guastavino and his son.
  The National Register dates the church to 1912, when it gave Wilmington a distinctive
  new religious building.

  The construction method is central to its identity. Careful geometry and skilled
  masonry could create substantial forms.

  This remains a place of worship. Begin on the public sidewalk and go inside when
  visitor access is permitted.

  Look at the building as both a community's religious home and the result of specialist
  craft. Its architectural impact depends on many smaller pieces working together.
  A large interior space can feel almost effortless to a visitor; the method behind it
  required knowledge and precision. The landmark makes that marriage of design, material,
  and labor part of downtown's visible history.
