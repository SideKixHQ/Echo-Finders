script: |
  Saint Mary's church is associated with the Guastavino family's brick-and-tile vaulting
  work. Its dedication in 1912 gave Wilmington a distinctive new religious building.

  The construction method is central to its identity. Thin layers of tile and careful
  geometry could create substantial vaulted forms.

  This remains a place of worship. Begin on the public sidewalk and enter only when
  visitor access is permitted.

  Look at the building as both a community's religious home and the result of specialist
  craft. Its architectural impact depends on thousands of smaller pieces working together.
  A large interior space can feel almost effortless to a visitor; the method behind it
  required knowledge and precision. The landmark makes that marriage of design, material,
  and labor part of downtown's visible history.
