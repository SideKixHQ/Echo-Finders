teaser: "Look at the stripes. None of them is paint."
script: |
  Look at the stripes on the lighthouse. Grey at the bottom, white in the middle, black at the top. None of it is paint.

  The colors are cast into the concrete. The bottom forty feet is the natural grey of the cement. The middle fifty feet was poured with white cement mixed with white quartz. The top was mixed with a black coloring agent.

  In 1957 the Coast Guard asked for bids on two designs. One was a steel frame. The other was a concrete silo tower. Nobody bid on the steel one.

  The builders used a system developed in Sweden. Steel forms were jacked slowly up the tower while concrete was poured into them.

  The pour began on a Monday morning and did not stop. A mixing plant on the site ran round the clock for six days. The forms climbed from eight inches to a foot an hour.

  By the following Monday, the walls stood one hundred and forty-eight feet high.

  The last lighthouse built in North Carolina went up in a week, and it wears its colors all the way through.
