teaser: "Look at the stone. Nobody quarried it."
script: |
  Look at the walls of King's Chapel. Dark, rough blocks of stone.

  Nobody quarried them. There were no quarries yet. The stone was gathered off the surface
  of the ground in Braintree, south of here, and the builders had little skill at dressing
  it. That is why it looks the way it does.

  Now picture this corner in the summer of seventeen forty nine.

  There is already a church here. A wooden one, old and decaying. The governor lays the
  cornerstone for a new stone chapel, gives the workmen money to drink his health, and then
  walks inside the old wooden church for a service.

  Because the plan was not to pull the old church down first.

  The plan was to build the new one around it.

  So for nearly four years the congregation kept worshipping in a wooden church while stone
  walls went up on every side of them. Only when the old building was too far gone did they
  move out, and borrow somebody else's.

  By the summer of seventeen fifty four the stone chapel was in use. The pulpit was carried
  over from the old church into the new one.

  Most buildings replace the one before them. This one swallowed it.
