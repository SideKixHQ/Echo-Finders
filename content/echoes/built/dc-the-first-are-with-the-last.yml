teaser: "Stand where the two walls meet, and look into the black stone."
script: |
  Stand where the two walls meet, and look into the black stone.

  You will see yourself, standing among the names.

  The design was entry number one thousand and twenty-six, in a blind competition with
  more than fourteen hundred entries. It began as a student project. Maya Lin was studying
  architecture at Yale when she proposed it, in 1981.

  No figures. No sculpture. Two long walls of polished black granite, angled so that one
  lines up with the Washington Monument and the other with the Lincoln Memorial.

  Now look at the top of the panel at the very center, on the east side. The names begin
  there, with the earliest dead, and they run in the order people died, east along the
  wall to its far end. Then they pick up again at the far west end, and run back toward
  you.

  So the last names on the wall finish right here, beside the first.

  The Park Service puts it plainly. The first are with the last.

  And in the stone, in the middle of all of them, is you.
