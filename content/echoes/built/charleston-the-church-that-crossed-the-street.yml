teaser: "This church is not where it was built. It is not even on the same side of the road."
script: |
  Look at this white church with its tall columns. It was not built here. It was not even built on this side of the street.

  It went up between seventeen ninety seven and eighteen o seven, at the corner of Pitt and Calhoun, then the far edge of town. It was a plain white meeting house, after a design by Francis Asbury, the first Methodist bishop in the United States.

  It was founded and paid for by Black and white Charlestonians together. Free Black people and enslaved people were both members.

  Then, in eighteen thirty four, the congregation split over a single question. Should Black members be made to sit in the galleries? By eighteen forty, the Black members had left to form their own congregation.

  In eighteen fifty two, the old church was moved to the back of its lot, for the Black congregation, and a new church went up on the corner for the white one.

  In eighteen eighty, it was given to the Black congregation, and moved again. Right across Calhoun Street, to where it stands now. The columns came later.

  Look at it again. Its congregation today includes descendants of that eighteen eighty congregation.

  The building moved twice. They stayed.
detail: >-
  From the National Park Service Travel Charleston page: built 1797 to 1807 at Pitt and Calhoun to a design by Francis Asbury, founded and paid for by Black and white citizens, the 1834 schism over gallery seating, the Black members' secession by 1840, the moves of 1852 and 1880, the later portico with four fluted Corinthian columns, and descendants of the 1880 congregation among its members today. The NPS calls it the third oldest church building surviving in Charleston.
