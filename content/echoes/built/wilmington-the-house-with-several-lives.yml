script: |
  This Grace Street house dates to about 1818. The Historic Wilmington Foundation lists
  it as the Lazarus-Hill-Divine House, with three dates attached: about 1818, 1854, and
  1885.

  Those dates are more revealing than the idea of a single, perfectly preserved moment.
  Each marks a chapter in the life of a building that stayed in use as the city changed
  around it.

  Stay on the public sidewalk. Its historical significance does not make a present
  interior automatically open to visitors.

  Look at the facade and ask what architecture can tell you by itself. A house's shape
  can suggest a single period, yet records point to later chapters you could not guess
  from a passing glance. The landmark survives as a physical meeting point for those
  different chapters, even when their occupants and furnishings have long since moved
  on.
