script: |
  This Grace Street house was built in 1818. Wilmington's landmark description records
  later uses that included a military academy, a convent, and an emergency hospital.

  That sequence is more revealing than the idea of one perfectly preserved household. The
  same building had to meet different needs as the city changed around it.

  Stay on the public sidewalk. Its historical significance does not make a present
  interior automatically open to visitors.

  Look at the facade and ask what architecture can tell you by itself. A house's shape may
  suggest domestic life, yet records reveal institutional uses you could not guess from a
  passing glance. The landmark survives as a physical meeting point for those different
  chapters, even when their occupants and furnishings have long since moved on.
