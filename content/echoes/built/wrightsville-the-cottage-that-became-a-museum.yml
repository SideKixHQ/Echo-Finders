teaser: "It was moved here from near the ocean. Inside, a model shows it back where it started."
script: |
  Look at the cottage in front of you. It was built as a summer home, and it did not start out on
  this street.

  Myers Cottage once stood at 124 South Lumina Avenue. It stayed in the family until 1954, and in
  1995 it was donated and moved here to house the Wrightsville Beach Museum.

  Inside, the rooms show how a typical summer cottage was lived in: a bedroom, a bathroom and a
  kitchen, with furnishings of the time. The icebox was kept out on the porch, and the trolley
  brought ice from Wilmington to keep it cold.

  The centerpiece is a twelve foot model of the beach around 1910. Look closely and you will find
  this cottage in it, back in its original location.
