teaser: "This little stone bridge was built for water, and the water still uses it."
script: |
  Look at the low stone bridge with two arches over the creek. It is not for people. It is for water.

  The people of the missions began digging irrigation ditches, called acequias, even before the mission walls or the stone churches were built. A dam turned water out of the San Antonio River, and gravity carried it to the fields.

  When the ditch for Mission Espada ran into this creek, the builders needed a way across. Before the aqueduct, they would have used hollowed-out logs. Then, between 1740 and 1745, they built this.

  Water flowed across the top in a channel, and rejoined the earthen ditch on the other side, on its way south to the mission and the farm fields.

  It has come through major floods for more than two hundred and seventy-five years. It is the oldest Spanish aqueduct in the United States.

  And it still works. Look along the top. Water can still be seen flowing over it, on its way to Mission Espada.
