script: |
  Giblem Lodge's cornerstone was laid in 1871, and it survives as a place of Black community
  organization in Wilmington. The Historic Wilmington Foundation describes it as a
  community hub and meeting hall. Wilmington's City Council has given it local landmark status.

  A lodge building can be easy to overlook beside more famous mansions. Yet institutions
  like this helped people assemble, maintain networks, and exercise independence.

  Stay on the public sidewalk. You can recognize that history without entering an active
  organization's space.

  The important architectural fact is survival in place. A building associated with
  collective activity remains here to counter the idea that Wilmington's past belonged
  solely to prominent individual owners. This landmark preserves evidence of people
  organizing for each other. Its walls held a community, and its continued presence gives
  that community's history a downtown address.
