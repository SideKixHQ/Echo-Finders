teaser: "Follow one of the iron bridges to its door."
script: |
  Stand at the railing and look down. Between Bay Street and the row of old buildings on the river side there is a gap, and narrow iron bridges cross it.

  Follow one of those bridges to its door. You are walking into the top floor of the building.

  This was the row of the cotton factors, the brokers of the cotton trade. One of these buildings, at the two hundred block of East Bay, went up in eighteen twenty three. When federal surveyors recorded it, they described entrances on the fourth floor, a cantilevered walk, and more bridges reaching the floors below.

  The offices were up here, level with the street and the merchants. The warehouse floors stacked down the face of the bluff toward the river.

  A stone store on the west side of Bay Street, built around eighteen sixteen, works the same way. Three storeys from Bay Street. Four from the river. Every floor but the attic opens onto a different level of the town.

  So none of these buildings has one ground floor. There is the floor at the water, and the floor at the street, and an iron bridge in between.
