# Drafted by Claude Code (2026-11-12) for San Francisco (second pass), following docs/writing-echoes.md (format v2).
# Listening spot: The public sidewalk at the corner of Grant Avenue and California Street, Chinatown, looking at the pagoda-roofed corner buildings.
# Position: The Grant and California intersection from general map knowledge (high confidence for the corner). NPR names the Sing Chong Bazaar and Look Tin Eli but gives no address; the Sing Chong building is generally placed on this corner, which a reviewer should confirm before approval. The script therefore points at the roofs, not at one named door.
