teaser: "Those curled roofs were an argument, and they won it."
script: |
  Look up at the rooftops on this corner. The pagoda towers, the curled eaves, the dragons. They look very old, and very Chinese.

  They are neither, quite.

  In nineteen oh six, the earthquake and fire destroyed Chinatown, along with much of the city. Even before the quake, the local newspapers had argued for moving the Chinese out. Now city leaders presented a plan to move Chinatown to the mud flats on the southern edge of town.

  The Chinese consul general refused. The Empress, he said, was not happy about it. The consulate would be rebuilt in the heart of Chinatown, where it was.

  Then a businessman named Look Tin Eli had an idea. He persuaded the other merchants to hire American architects, and to make their buildings look like China, to attract tourists.

  So the architects drew American style buildings, and put pagodas on top.

  The tourists came. Chinatown stayed.

  Look up at the roofs again. They are how it stayed.
detail: >-
  From NPR's 2006 report on rebuilding Chinatown, with the historian Judy Yung: the newspapers editorialising before 1906 for moving the Chinese, the relocation plan for the mud flats on the southern outskirts, the consul general's words about the Empress and rebuilding the consulate in the heart of Chinatown, Look Tin Eli persuading merchants to hire American architects to make buildings look like China to attract tourists, and American style buildings topped with pagodas, curled eaves and dragon motifs. "The tourists came. Chinatown stayed." is a summary of the outcome the report describes; Chinatown was rebuilt where it stood. The Sing Chong Bazaar, Look Tin Eli's own building, is named in NPR's captions but not located; it is not named in the script for that reason.
