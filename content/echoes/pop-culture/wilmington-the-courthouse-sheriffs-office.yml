teaser: "Sleepy Hollow's Sheriff's Department, and the show's most famous building."
script: |
  Look at the old courthouse. In Sleepy Hollow, this was the Sleepy Hollow Sheriff's
  Department, the show's most iconic location. Its outside appears all through the series.

  It has played other parts. For Dawson's Creek, its interior was the Capeside train station.

  A building made for real trials became the headquarters of a fictional fight against the
  supernatural.
