script: |
  Look through the trees toward the water. In season six of One Tree Hill, this park was
  transformed into the set of Lucas and Peyton's outdoor wedding.

  Another production came here for something tender. In the Hallmark film
  Christmas in Conway, a husband rallies a town to give his dying wife one last Christmas, and
  Greenfield Park was in that story too.

  Stories about promises, filmed in a public park anyone can walk into. Wilmington lends its
  ordinary places to the moments people remember.
