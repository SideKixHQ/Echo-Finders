teaser: "It was built as a set. Then somebody bought it, contents and all."
script: |
  Look at the sign: Hell's Kitchen. It was not built to be a bar. It was built to be filmed.

  For Dawson's Creek, this was a temporary set. When the show wrapped, the bar was sold with its
  contents to a local restaurateur, who turned it into a real bar with the same name.

  Then the fiction came back for it. One Tree Hill filmed its Swinging Donkey Bar scenes here, and
  The Summer I Turned Pretty turned it into a lounge.

  A set that was meant to be taken down became a place with regulars, and the shows kept finding it.
