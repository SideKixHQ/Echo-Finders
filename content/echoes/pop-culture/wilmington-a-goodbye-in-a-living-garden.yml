teaser: "The last goodbye of Dawson's Creek was filmed in a garden."
script: |
  Look for the Ability Garden. In the final episode of Dawson's Creek, this is where Jen said her
  goodbye.

  Of all the places the series could have chosen for its saddest scene, it chose a garden: a
  place that is always in the middle of something growing, ending and coming back.

  During the course of the series, 128 episodes over six seasons were filmed in Wilmington and our
  Island Beaches. The show's hardest farewell was filmed among the plants.
