teaser: "Fewer than twenty fans were waiting for the greatest actress in Italy."
script: |
  You are on Duncan Street. In the nineteen fifties, Tennessee Williams had a house on this street. It is a private home, so enjoy it from the sidewalk.

  In the autumn of nineteen fifty four, Hollywood came to Key West to film his play, The Rose Tattoo.

  The star was Anna Magnani, Italy's most celebrated actress. She flew from Hollywood to Miami, and came down the Overseas Highway. Fewer than twenty fans were waiting when she pulled up at her hotel, in a canary yellow convertible. She signed one autograph. The next day, the hotel said, she slept until noon.

  A few days later Williams drove down from Miami too, with his secretary, Frank Merlo. The Key West Citizen called him a regular winter visitor, and photographed him at his Duncan Street home.

  Behind the camera was James Wong Howe, who had won his share of Academy Awards. The lighting here, he said, was sharp and crisp. And the Key West settings? They could not be duplicated anywhere.

  So for a few weeks, the town played itself.
detail: >-
  From the Key West Citizen: 28 October 1954 (Magnani's arrival via the Overseas Highway after flying from Hollywood to Miami, fewer than a score of fans, the canary yellow convertible at the Casa Marina, one autograph, asleep until noon), 2 November 1954 (Williams, "a regular winter visitor", arriving to be present for the filming, photographed at his Duncan Street home, accompanied by his secretary Frank Merlo; James Wong Howe on the light and the settings) and 9 April 1952 (Williams's home at 1431 Duncan Street). "Italy's most celebrated actress" paraphrases the paper's "hailed as Italy's foremost actress". "For a few weeks" is from the filming being reported as starting in early November; the end date was not checked. The papers call Merlo his secretary; the Library of Congress's Headlines and Heroes blog (2022) describes their fifteen year relationship, which the script does not go into.
