teaser: "One wedding happened here. Two others were supposed to."
script: |
  Look at the church doors. On television, they opened on a wedding.

  Brooke and Julian were married here. But this church also held two weddings that never
  happened: Lucas and Lindsey were supposed to marry here, and so were Keith and Jules.

  A writer who needs a wedding can choose whether it goes ahead. A real church, with a congregation
  of its own, played both endings.

  Between 2003 and 2012, 288 episodes spanning nine seasons were filmed in the Wilmington area.
  Some of its turning points came at this door.
