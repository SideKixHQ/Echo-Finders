teaser: "Everyone knows the line. It was said to a room in this building."
script: |
  You are outside Building Thirty, Mission Control. Somewhere inside is the room that heard a sentence people still quote, half a century later.

  It was a calm sentence about a disaster.

  In April nineteen seventy, Apollo Thirteen was three days out, on its way to the Moon. An electrical short set off an explosion in an oxygen tank.

  Fred Haise began, Okay, Houston.

  Then the commander, Jim Lovell. I believe we've had a problem here.

  From this building, the capsule communicator asked him to say again.

  Houston, we've had a problem.

  Stand by, thirteen, came the answer. We're looking at it.

  For days, the flight controllers in here worked out how to bring three men home in a crippled spacecraft. Gene Kranz was the flight director. Throughout the entire course of Apollo Thirteen, he said, there was never any doubt that we'd get the crew back.

  They got them back.

  And the words they spoke into this room live on.

  And the first word of it was the name of this city.

