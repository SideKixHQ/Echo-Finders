teaser: "One Tree Hill sent Peyton to art school. It sent her here."
script: |
  Look up at the columns of the Bellamy Mansion. It is a museum of history and the design arts,
  and that is exactly why a television show borrowed it.

  In a 2006 episode of One Tree Hill, Peyton and Jake had a scene here, and the mansion was called
  the Savannah College of Art and Design. A museum of design played a school of design.

  It was not done with fiction. Years later, its kitchen appeared in Sleepy Hollow, in an episode
  called Sin Eater. A house built before the Civil War keeps being cast as somewhere else.
