script: |
  Look at the restaurant. In The Summer I Turned Pretty, Conrad and Jeremiah meet their dad here
  for a meal.

  A restaurant scene is a writer's favorite pressure: nobody can leave before the food arrives, and
  everybody has to be polite in public. Whatever the brothers left unsaid, they left it at a table here.

  The restaurant is known for its seasonal American cooking. On screen, it served a family
  something harder to swallow.
