teaser: "In Tammy, this bar was in Kentucky."
script: |
  Look at the door of Blue Post Billiards. You have to be over twenty-one to go in, but the
  movies have been coming here for years.

  In the film Tammy, it played a barbecue joint in Louisville, Kentucky, where Melissa McCarthy's
  Tammy and her grandmother, played by Susan Sarandon, try to pick up men. A local bluegrass band,
  Big Al Hall and Possum Creek, played in the scene.

  One Tree Hill sent Lucas and Brooke here on their first tattoo date, and Sleepy Hollow used the
  alley outside. This pool hall keeps being cast as somewhere else.
