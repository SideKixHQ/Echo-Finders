teaser: "I hesitate to put on this show, the executive said."
script: |
  Look at the building at the corner of Forty Sixth and Market. In the nineteen fifties, there was a television studio in it, full of Philadelphia teenagers, dancing.

  The show was called Bandstand. It was a local afternoon dance party on WFIL. Kids danced, singers mimed their latest records, and between songs the host asked the kids in the studio what they thought of the music.

  In nineteen fifty six, a young man named Dick Clark took over as host. He admitted later that at first he had only a foggy notion of what the kids and the music were all about. He caught on fast.

  Clark pushed the network, ABC, to take the show national. One executive was not convinced. I hesitate to put on this show, he said, because it's just kids dancing.

  On the fifth of August, nineteen fifty seven, they put it on anyway. American Bandstand, from West Philadelphia, beamed to a hundred and five stations and some forty million mostly teenage viewers. Chuck Berry even put it in a song. They'll be rocking on Bandstand, in Philadelphia, P.A.

  In nineteen sixty four the show moved to Los Angeles. This building stayed. In nineteen eighty six, the old studio went on the National Register of Historic Places.

  Look at it once more.

  Just kids dancing.
