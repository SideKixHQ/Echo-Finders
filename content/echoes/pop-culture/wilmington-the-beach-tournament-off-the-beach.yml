teaser: "Cousins Beach played volleyball miles from the sea."
script: |
  Look at the sand courts. On screen, the season one volleyball tournament in The Summer I
  Turned Pretty looked like the beach.

  It was not filmed on the beach. It was filmed here, at a local hangout in Midtown with sand
  courts of its own.

  That is the trick of a location: the sand is real, the sea is implied. Wilmington is often
  nicknamed Wilmywood, and this is the kind of craft that earned it. Cousins Beach is partly a
  backyard in Midtown.
