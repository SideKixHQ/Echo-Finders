teaser: "A horror film crowned its beauty queen on this stage."
script: |
  Look at the old theatre across the street. It was built in 1918, and it is still in use.

  In the 1997 slasher film I Know What You Did Last Summer, this is where the town beauty pageant was held.

  On its stage, Sarah Michelle Gellar's character was crowned Croaker Queen.

  Much of the film was shot in Southport, taking advantage of the town's waterfront.

  The theatre has been on the big screen in other films too, among them Crimes of the Heart and The Secret Life of Bees.

  A croaker is a fish. In this town, for one night, it was a crown.
