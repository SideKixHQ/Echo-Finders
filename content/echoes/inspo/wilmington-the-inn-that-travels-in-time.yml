teaser: "A 1940s party, a headless horseman, and guests who never knew."
script: |
  Look at the Graystone from the sidewalk. Guests stay here, so this story is for the sidewalk.

  It is one of Wilmington's most popular places to film. In The Longest Ride, the main characters
  danced at a 1940s party set here. In Sleepy Hollow, its grand dining room was where the Headless
  Horseman took the heads of four Masons, and horses were filmed outside.

  A real house is stuck in its own century. On film, the Graystone has been a 1940s
  ballroom and a haunted present day.
