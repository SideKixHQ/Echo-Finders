teaser: "A story that began as a book came back to a bookshop."
script: |
  Look at the bookshop window. In The Summer I Turned Pretty, this shop played the Whale of a
  Tale Bookshop.

  There is a neat loop in that. The series began as a novel, and when it needed a bookshop in its
  fictional beach town, it found a real independent one here.

  Inside, you can buy a copy of The Summer I Turned Pretty. The book became a show, the show
  borrowed a bookshop, and the bookshop now sells the book.
