teaser: "North Carolina surfing starts with a letter asking for help."
script: |
  Look past the houses toward the beach. Surfing in this state began with a letter.

  In August 1909, Collier's Weekly ran an article urging readers to try surfing. Wrightsville Beach
  native Burke Haywood Bridgers read it and wrote to the author with questions about surfboards.

  His letter was published in April 1910. During the past summer, he wrote, we tried the sport to a
  very considerable extent, but without great results. The best rides were by small boys under 100
  pounds. Their boards were cut from juniper, a cedar boat builders favor.

  No one can claim a first in East Coast surfing. But the surfing on this beach in the early 1900s is
  the earliest documented in North Carolina. It began with a man admitting what he did not know.
