teaser: "The front of Tree Hill High is a college building. Walk round the back for the gym."
script: |
  Look at the front entrance. On television, this was Tree Hill High School.

  The Joe and Barbara Schwartz Center belongs to Cape Fear Community College. Its front was the
  outside of the high school, and round the back is where exterior scenes of the gym were filmed.

  It had another part to play. Dawson's Creek used it too, as a film festival lobby.

  A real college, playing a fictional high school, for a show about growing up. For a generation
  of viewers, this doorway was where every school day began.
