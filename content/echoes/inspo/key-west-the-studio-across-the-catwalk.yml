teaser: "The wall around this house is made of old Key West streets. Behind it, Hemingway wrote."
script: |
  Look at the wall around this property. It is made of old paving brick, taken from the streets of the city.

  The house inside was the first one Ernest Hemingway ever owned. He kept it until the day he died.

  Behind the main house is a smaller building. The Hemingways built a wrought iron catwalk from the upstairs porch across to it, and the room up there became his studio. A spiral stairway led down to the patio.

  It was in this house, a government survey of historic buildings says, that Hemingway wrote many of his best selling novels, and a number of his short stories.

  Around 1938 the property got something else nobody on the island had. A swimming pool, the first one on Key West.

  Later the writer moved to Cuba. He would not sell. He refused every offer for the rest of his life.

  So the wall stayed up, built from the streets he walked to get home.
