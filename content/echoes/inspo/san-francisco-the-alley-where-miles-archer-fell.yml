script: |
  Look into the short, narrow alley off Bush Street. Its name is Burritt.

  In The Maltese Falcon, this is where Miles Archer dies. He was the partner of a private detective named Sam Spade, and in the alley, he is shot by a woman he should not have trusted.

  Dashiell Hammett, who wrote it, knew these streets. His stories are full of real San Francisco streets and landmarks. In The Maltese Falcon, he even names his own apartment building, on Post Street, a few blocks from here.

  In nineteen forty one, John Huston made the book into a film, starring Humphrey Bogart. One critic calls it the best film ever made with San Francisco as its backdrop.

  Miles Archer never existed. People come to see where he died anyway. One guide brings walking tours here, recites the scene from memory, and at the climax pulls a rubber dart gun from his coat and shoots one of his guests.
detail: >-
  CBS San Francisco's walking tours piece: Don Herron's Dashiell Hammett tour, Burritt Alley as where Miles Archer, Spade's partner in The Maltese Falcon, "was plugged by a femme fatale", and the rubber dart gun. CBS San Francisco on Hammett's papers: his stories peppered with allusions to San Francisco streets and landmarks, including a scene in The Maltese Falcon citing his own apartment building at 891 Post Street. CBS San Francisco's "Best Movies Set in San Francisco": John Huston's 1941 film with Bogart, called the best movie filmed with a San Francisco backdrop, and Spade's office near the Stockton Street tunnel. One publisher. A bronze plaque in the alley marks the spot; no fetched source describes it, so the script does not mention it.
