teaser: "Some nights nobody came. They played to the empty room anyway."
script: |
  Find number thirty one Cornelia Street. A small brick building, with a shopfront on the ground floor.

  On a Friday night in December, nineteen fifty eight, a man named Joe Cino opened a coffee shop in there. About thirty people came. They were all his friends.

  His espresso machine had no gaskets. When the pressure built, the coffee gushed out all over the place. So he borrowed coffee pots from all over the neighborhood, set them up under the counter, and pretended the coffee was coming from the machine.

  He never meant it to be a theater. Fully staged plays, he said, were the one thing he never thought of.

  But the plays came. Short ones, about half an hour each. New writers, most of them gay men, at a time when showing gay lives on a New York stage was against the law. A show cost you nothing but a dollar spent at the cafe.

  Some nights, nobody came at all. The actors performed for the empty room. Cino said, I feel the room is grateful. Something happens to the walls.

  Before every show, he stepped out to introduce it. And he always ended the same way. It's magic time.

  Sam Shepard started here. So did John Guare, and Lanford Wilson.

  The cafe closed in nineteen sixty eight, the year after Joe Cino died. The city calls it the birthplace of Off Off Broadway, and New York's first gay theater.

  Look at the walls of the building.

  Something happened to them.

