script: |
  Look at the house on the corner of Steiner and Broadway. You may know it. In nineteen ninety three, it was the family home in the film Mrs. Doubtfire.

  In the film, Sally Field's character lives here with her children. Her ex husband, played by Robin Williams, will do anything to stay close to them. So he comes back in disguise, as the perfect elderly British nanny.

  In twenty fourteen, Robin Williams died. As soon as the news broke, people began to come to this corner. Hundreds of them. They left notes and flowers, for a man who had never lived here.

  For a while, the house was a shrine.

  The doctor who owned it then kept the tributes up. He told a reporter he had seen much of the film, but had never sat down and watched it from start to finish.
detail: >-
  CBS San Francisco (KPIX, 2014): fans paying respects at the home on Broadway and Steiner where the film was set, hundreds dropping off notes and flowers since news broke, the owner (a plastic surgeon) keeping the tributes up and saying he had seen much of the film but never watched it from start to finish. CBS News (2016, the same publisher, so this counts as one source): the 1993 film, Sally Field's character living with her children in the home, the ex-husband in disguise as the perfect elderly British nanny, the home briefly an impromptu shrine after Williams's death in 2014. The owner is not named in the script. Robin Williams's death was a suicide; the script does not say so, which suits a general audience.
