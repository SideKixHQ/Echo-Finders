teaser: "The first episode and the last both came back to this corner."
script: |
  Look at the corner storefront. Today it is a pizza place.

  In the pilot episode of One Tree Hill, this building stood in as Karen's Cafe. Nine seasons
  later, in the show's final season, it came back as Tree Hill Cafe.

  Most locations in a long series come and go. This building bookended the whole story.

  Between 2003 and 2012, 288 episodes spanning nine seasons were filmed in the Wilmington area.
  The beginning and the end of all of them met at this corner.
