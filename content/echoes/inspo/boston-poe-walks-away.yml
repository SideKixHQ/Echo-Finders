detail: >-
  The Boston Globe (5 October 2014) gives the unveiling at Boylston and Charles streets near Boston Common, Poe as the city's "sour native son", the statue facing away from the Frog Pond "to represent his disdain for Bostonians" as he walks toward his birthplace on Carver Street, and the briefcase with a larger than life raven and a human heart. WBUR (4 October 2014) gives his birth in Boston in 1809, the coffin like wooden box and Paul Lewis's words, The Tell Tale Heart first published in Boston, and his insults to local writers including Longfellow; WBUR (April 2014) adds that the city's writers "reciprocated in earnest" and the sculptor's name. CBS Boston (AP) gives "more than 160 years after his death". Inspo kind is before-fame and evidence area: Poe was born nearby, on Carver Street, not at this corner.
