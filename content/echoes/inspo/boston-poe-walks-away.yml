teaser: "Boston gave him a statue at last. He is walking away from it."
script: |
  Find the bronze man striding along the corner, like a commuter rushing to catch the train. Edgar Allan Poe, born in Boston in eighteen o nine.

  He did not much care for the place. As a critic, he insulted a whole row of the city's writers, Longfellow among them. They returned the favour.

  So it took Boston more than a hundred and sixty years after his death to put up a statue. It was unveiled here in twenty fourteen.

  Look which way he is walking. The sculptor, Stefanie Rocknak, turned his back on the Frog Pond, on the Common, to show his disdain for Bostonians. He is striding toward his birthplace, on Carver Street.

  Now look at the briefcase. It is overflowing. A raven, larger than life. And a human heart. The Tell Tale Heart was first published here in Boston.

  Before the unveiling, the statue stood in the ground for more than a week, hidden in a wooden box. The man who led the campaign said that made perfect sense. Poe was emerging from a coffin.

  Boston took its time to welcome him home. He still will not look at it.
