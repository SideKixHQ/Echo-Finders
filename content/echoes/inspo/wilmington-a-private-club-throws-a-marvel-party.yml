script: |
  Look at the Cape Fear Club from the sidewalk. It is a private club, and you will not need to go
  in to hear this.

  Iron Man 3 shot a New Year's Eve party here. It was the final solo movie of Tony Stark, played by
  Robert Downey Jr., and it was set at Christmastime.

  The same film used the North Carolina Port of Wilmington for its Iron Legion scene. A superhero
  story counted down to midnight in a quiet building on Chestnut Street.
