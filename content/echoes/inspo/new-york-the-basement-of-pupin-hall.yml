teaser: "Why is it called the Manhattan Project? Partly because of buildings like this one."
script: |
  Look at the tall brick physics building at the edge of the campus. Ordinary classrooms. Ordinary labs.

  Now think about what is under it. The basement.

  In nineteen thirty nine, down there, scientists watched an atom split. It was the first time anyone had seen nuclear fission on American soil.

  The people working in these buildings had names that would end up in every history book. Enrico Fermi. Leo Szilard. I I Rabi.

  In the basement of another building across the campus, Fermi and his colleagues stacked uranium and graphite into a pile. It never quite came alive. But it led to the one in Chicago that did, the world's first nuclear reactor, in December, nineteen forty two.

  By nineteen forty three, a chemist named Harold Urey had more than seven hundred people here, working out how to separate uranium.

  And the whole effort, the army's secret project to build the bomb, had its first headquarters downtown, at two seventy Broadway. A general named Leslie Groves worried that its first name, the Laboratory for the Development of Substitute Materials, would attract attention. So he gave it a duller one, after the island.

  The Manhattan Engineer District.

  Everyone else calls it the Manhattan Project.

  It started in this city, in basements like this one.

