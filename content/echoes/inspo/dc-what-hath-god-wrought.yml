teaser: "The first telegraph message left from this room. A young girl picked the words."
script: |
  Look up at the vaulted ceiling of this room. Before the Supreme Court had its own building, this was its chamber. And on the twenty fourth of May, eighteen forty four, it held something new. A wire.

  Samuel Morse was an artist, who had spent some twelve years teaching himself enough science to make a machine send words down a wire. Now a line ran from here to a railroad depot in Baltimore. Waiting at the other end was his assistant, Alfred Vail.

  Morse needed a first message. He let a young girl choose it. Annie Ellsworth, the daughter of his friend, the commissioner of patents. She picked a line from the Bible.

  What hath God wrought.

  Morse tapped it out from this room, as dots and dashes on a paper tape. In Baltimore, Vail received it, and sent it straight back. It worked.

  Morse gave the tape to Annie. Seventy eight years later, her daughter gave it to the Library of Congress, across the street.

  A few months after that day, Morse wrote to Vail with a warning about this new power. Be especially careful, he said, not to give a partisan character to any information you may transmit.

  He sent that from Washington too.
detail: >-
  Evidence is `exact`: the Library of Congress says the message was sent "from the Supreme Court chamber in the United States Capitol". The script does not say the room's furnishings are original.
