teaser: "In 1927 a janitor and part-time detective sang on a radio station at the top of this building."
script: |
  Look up at the top floor of the Flat Iron Building. In 1927, that was where a brand new radio station, WWNC, had its studio and its transmitter.

  By March that year, a former railroad man named Jimmie Rodgers had moved to Asheville. He worked as a janitor, a cab driver, and a city detective. He was already sick. He had been diagnosed with tuberculosis three years before.

  On the eighteenth of April, 1927, he started singing on WWNC. He and a friend played live every week.

  It did not go brilliantly to begin with. At one show, in Hendersonville, the only person who came was a housekeeper.

  That August he recorded his first two songs, at Bristol, on the line between Tennessee and Virginia. The Carter Family made their first recordings the same week. People call those sessions the Big Bang of Country Music.

  Jimmie Rodgers became the Singing Brakeman, the Blue Yodeler, the Father of Country Music.

  But before all that, he was a janitor singing into a microphone, somewhere up on that top floor.
