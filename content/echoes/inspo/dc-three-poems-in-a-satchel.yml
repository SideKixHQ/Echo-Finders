script: |
  Look along this block. In the nineteen twenties, this was the Wardman hotel.

  In nineteen twenty five, one of its busboys was a young man from the Midwest, carrying plates in the dining room. He had already had a poem published, in a magazine of the NAACP. But nobody here knew that.

  That year, a famous poet came to stay. Vachel Lindsay, known across America for performing his poems out loud, to big crowds.

  The busboy saw his chance. He dashed off three poems, and slipped them into the guest's bag.

  Lindsay read them. And he was taken with them. He read them out himself, with all his showman's energy. Word got round. The busboy won a scholarship to Lincoln University in Pennsylvania. Within five years he had his degree, and two books of poetry.

  His name was Langston Hughes.

  He became one of the great voices of the Harlem Renaissance.

  It started on this block. With three poems, and a busboy who would not wait.
