teaser: "A Cracker Jack bracelet, and a bench fans still come looking for."
script: |
  Look along the Riverwalk, near the foot of Dock Street and the old J.W. Brooks building.

  Somewhere along here is the bench fans call the Naley Bench. It is where Nathan gave Haley a
  bracelet out of a box of Cracker Jack.

  A wide river, and a very small gift. That is why people remember it.

  Fans still come to recreate the scene. The ice cream shop nearby sells replica bracelets, and
  you can buy the Cracker Jack yourself. A prize from a snack box became a souvenir.
