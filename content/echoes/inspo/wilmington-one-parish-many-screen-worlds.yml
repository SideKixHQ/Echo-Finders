teaser: "A church that has been on screen for twenty years."
script: |
  Look at the old church and its grounds. They have been on screen since One Tree Hill began.

  St. James lists the productions itself. One Tree Hill filmed here, and its school served as
  Jamie's preschool. Sleepy Hollow filmed here. Words on Bathroom Walls filmed on the front lawn,
  and in two of the parish halls. Idlewild came in 2006, and The Supremes at Earl's All-You-Can-Eat
  in 2022.

  Those stories all needed somewhere that felt like it had been here a long time. This parish
  had.
