script: |
  Look at the white church with the squat bell tower on its roof. It was built between 1888 and 1890, by local carpenters, and inside it is polished Carolina pine.

  In the film A Walk to Remember, Jamie's father was the reverend at this church.

  It has turned up in several other films and television shows since.

  On screen, it belonged to a fictional preacher. Off screen, it has been this town's church for well over a century.
