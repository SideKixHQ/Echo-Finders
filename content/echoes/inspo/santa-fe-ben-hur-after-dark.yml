teaser: "Governors ruled from this adobe for three centuries. One of them spent his nights finishing a novel."
script: |
  Look at the long, low adobe building on the north side of the plaza, with the covered porch. The Palace of the Governors.

  Since 1610 it has housed the offices and living quarters of governors. Spanish colonial, Mexican, and American. It came through the Pueblo Revolt of 1680, the Spanish reconquest, the arrival of the American army in 1846, and the invasion of Confederate troops from Texas in 1862.

  But the most famous thing ever made here was not a law. It was a novel.

  From 1878 to 1880, the territorial governor was Lew Wallace. By day he governed the territory. At night, in his living quarters in this building, he finished his second novel.

  It was called Ben-Hur.

  It made him rich and famous. Of all the governors who lived here, the world remembers the man who stayed up late, writing.
