teaser: "A writer got a government job here, lost it, and turned the anger into a famous book."
script: |
  Look up at the eagle on the roof. It is a fibreglass copy. The wooden original, put up in 1826, is on display inside.

  In 1846 a writer who could not support his family on his books was given a job in this building. He became Surveyor of the port.

  His name was Nathaniel Hawthorne. His friends in the Democratic Party had got him the job.

  Then in 1848 the Whigs came in, and he lost it, after a painful and prolonged fight to keep it.

  He turned the pain, the anger and the betrayal into his first great novel, The Scarlet Letter.

  In the introduction he describes this Custom House, and pretends to find the story among the papers of a previous surveyor.

  The book begins in this building, with a man pretending to find it.
