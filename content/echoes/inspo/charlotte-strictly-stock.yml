teaser: "NASCAR's first big race was run near this road in 1949, and the winner lost it to his springs."
script: |
  About two hundred yards from this road was a dirt track, three quarters of a mile around.

  On the nineteenth of June, 1949, NASCAR held the first race of what became its top series here.

  It was called Strictly Stock. The cars had to be late model, full size, American sedans, the kind the fans drove, with very few changes allowed.

  Thirty-three drivers started. More than thirteen thousand people came to watch.

  On lap one hundred and seven, Lee Petty took a turn too fast and rolled his Buick.

  On lap one hundred and fifty-one, Glenn Dunnaway took the lead in his Ford, and he finished first.

  Then the officials looked underneath. The rear springs had been altered.

  He was disqualified, and Jim Roper, who came second, was declared the winner. The springs, it turned out, had been changed in a way that was common on cars used to haul moonshine.

  The car's owner sued. NASCAR won, and with it, the power to enforce its own rules.

  So the first race was won, and then lost, on a set of moonshine springs.
