teaser: "Green Onions came out of a failed jingle session, on a Sunday, in an old movie theater on this street."
script: |
  Look up at the marquee. In 1960 a small record label moved into a former movie theater at this address, 926 East McLemore.

  It was called Satellite then. Soon it was renamed Stax.

  The owner, Jim Stewart, still worked at a bank. His sister, Estelle Axton, ran a record shop in the old concession stand, so she could hear what the kids were buying.

  In the summer of 1962, four musicians were called in to back a singer on a commercial jingle. It was a Sunday, so the bank was closed.

  The session fell apart. So they started jamming on a slow blues, and Stewart recorded it without telling them.

  He wanted to release it. But a single needs a B side.

  Booker T. Jones had a little riff he had been playing on the piano at his mother's house. He tried it on the Hammond organ instead.

  They worked out the arrangement, and cut it in two or three takes.

  It was the first time those four had ever played together in that line up. They called it Green Onions.

  A B side, from a jam, after a jingle session failed, on the day the bank was shut.
