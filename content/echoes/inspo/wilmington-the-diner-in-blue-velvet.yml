teaser: "Arlene's Diner served coffee in Blue Velvet. It still serves food."
script: |
  Look at the restaurant on the corner. In David Lynch's Blue Velvet, this was Arlene's Diner.

  Blue Velvet came out in 1986 and used Wilmington all over: the police station, a high school,
  Market and Front streets, and this diner. Today it is Savorez, serving Latin American inspired
  food.

  The film was strange and unsettling, and it became a cult classic that still brings fans from
  all over the world to Wilmington. Some of them come to this corner, for a meal where a diner
  scene was once made.
