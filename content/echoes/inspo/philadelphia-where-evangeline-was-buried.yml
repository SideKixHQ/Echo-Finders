teaser: "People would show you where the lovers were buried. They were never alive."
script: |
  Look along the south side of Walnut Street, between Third and Fourth. For generations, the Quakers kept an almshouse on this block, a home for the old and the poor, with a garden behind it.

  In eighteen forty seven, Henry Wadsworth Longfellow published a long poem called Evangeline. A young woman is torn from the man she loves, Gabriel, when their people are driven out of Acadia. She searches for him for years. And at the end she comes to Philadelphia, the city of Penn. A fever strikes. She nurses the sick in the almshouse, home of the homeless. And there, among the dying, she finds Gabriel.

  Readers fell in love with it. And Philadelphians decided they knew exactly which almshouse it was. This one.

  A local historian, Thompson Westcott, was not so sure. Longfellow may have remembered visiting the Quaker almshouse years before, he wrote. But it was a home for the old, not a hospital. A dying stranger would have been taken somewhere else.

  It did not matter. Before long, there were people ready to show visitors exactly where, in this garden, Gabriel and Evangeline were buried.

  Look at the block again. The almshouse came down. The poem stayed.

  And somewhere back there, two people who never lived have a grave.
