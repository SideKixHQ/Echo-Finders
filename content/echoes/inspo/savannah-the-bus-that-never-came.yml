teaser: "Look for the bus stop. You will not find one."
script: |
  Look along the north edge of Chippewa Square, where Hull Street runs past the oaks. Look for the bus stop.

  There is not one. There never was.

  But on film, a man waits for a bus on this edge of the square. He sat on a bench with a box of chocolates and told his whole life to whoever sat down beside him. A stranger, then another stranger. He was waiting for a bus to take him to Jenny's house.

  The film was Forrest Gump. The bus stop was only ever there for the camera.

  And the bench is not here either. NBC News reported that the one from the film is kept at the Savannah History Museum.

  People still come to this square and look for it. A Boston travel writer called it the Forrest Gump Square.

  Look along the edge again, at the empty space under the trees.

  He was only ever waiting here in the film. The people looking for him are real.
detail: >-
  NBC News (2009) says "the spot in Chippewa Square on Hull Street never had a real bus stop, and the bench used in the movie is in the Savannah History Museum". The Boston Globe (2023) calls it "Chippewa Square (also known as the Forrest Gump Square". Place evidence is `site`: the sources put the scene in the square, on its Hull Street side, not at a measured spot, so the script says "this edge of the square" and never claims a precise spot. Whether the bench is still on view should be checked before review.
