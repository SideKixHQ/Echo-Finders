script: |
  Look at the plain brick house. In Poe's day it stood open on the corner, with a lawn out front toward Seventh Street. It was bright and airy. That was the point.

  Edgar Allan Poe lived in five houses in Philadelphia. This is the only one left. He moved his family here because his young wife, Virginia, had just been told she had tuberculosis. They hoped the light and the air would heal her lungs.

  It was a small household. Edgar. Virginia. Her mother, Maria, whom everyone called Muddy. And a cat named Catterina.

  Muddy did everything. The cooking, the cleaning, the nursing. One neighbour remembered her whitewashing the fence. Another neighbour claimed Poe left the house only a dozen times. Money was so short that he filed for bankruptcy. He owned almost no furniture.

  Inside, by the kitchen door, someone carved a word into the plaster. Death. Nobody knows who.

  While he lived in this house, Poe published a story about a man, his cat, and a wall in a cellar. The Black Cat. And in the cellar of this house, there is a false chimney. The park rangers ask the question for you. Could that be where the story's tomb came from?

  Look at the house again. A sick wife. A tired mother. Not enough money.

  And a cat named Catterina.
