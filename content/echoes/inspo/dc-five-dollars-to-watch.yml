teaser: "Ninety stone steps, and two of the most famous falls in film."
script: |
  Look up these steps, climbing away from the traffic of M Street. Ninety of them. Runners use them now, and tourists.

  In nineteen seventy three, they became a piece of horror film history. The Exorcist. The film used them for two deaths.

  In the story, a character falls from a bedroom window above, and down these stairs. In real life, the house is about forty feet away. So the film crew built a false front onto it, to make the fall look right.

  The man who wrote the story knew this neighbourhood. William Peter Blatty grew up poor, and won a scholarship to Georgetown University. As a student there, he heard about a case from nineteen forty nine, a fourteen year old boy in Maryland who was said to be possessed. He turned it into a novel.

  When the stunt was filmed here, Georgetown students made the most of it. They charged people five dollars to watch.

  Now look up to the top, where the falls began.

  It is a long way down. Climb it slowly.
