teaser: "Fake grass got its name from this building, because the real grass gave up."
script: |
  Look up at the Astrodome. A roof six hundred and forty two feet across, with no columns holding it up in the middle.

  Under it, plastic grass got its name.

  The man behind it was Roy Hofheinz, a former county judge and mayor. Houston summers had heat, humidity and mosquitoes. Nobody wanted to play baseball in that, or watch it. So he dreamed of a stadium with a roof and air conditioning. It had never been done.

  It opened in nineteen sixty five, the first fully air conditioned, domed stadium. Hofheinz called it the Eighth Wonder of the World.

  The roof had plastic skylights, and the plan was real grass. But out in the field, the players had trouble with the glare.

  So the skylights were painted over.

  Under the dome, the grass dried out.

  In nineteen sixty six, it was pulled up, and replaced with a new artificial grass. It came to be named after the building that needed it.

  AstroTurf.

  Look at the dome again. Plastic grass all over the world still carries a little of its name.

  The grass gave up first.

