teaser: "A private in the artillery, a beetle made of gold, and a treasure map."
script: |
  Look at the thick, low scrub between the houses and the beach. In a tale everyone once read, this end of the island hid a hut, a madman, and a map to buried treasure.

  The writer had been a soldier here. In eighteen twenty seven, a young man enlisted in the army under an assumed name, and lied about his age. He said he was twenty two. He was eighteen.

  His battery was sent to Fort Moultrie, at the other end of this island. He arrived in November, and stayed for more than a year. He was promoted to artificer, a soldier with a trade.

  The soldier was Edgar Allan Poe.

  Fifteen years later, in eighteen forty three, he published The Gold Bug. And he put it here.

  This island is a very singular one, he wrote. It is covered with a dense undergrowth of the sweet myrtle. And his hero builds a hut not far from the eastern, or more remote, end of the island.

  The houses came later. Look at the scrub again.

  The private remembered every bush.
detail: >-
  The National Park Service gives Poe's enlistment under an assumed name on 26 May 1827, the battery's orders to Fort Moultrie on 31 October 1827, arrival on 18 November, promotion to artificer, and departure on 11 December 1828; it names The Gold Bug (1843) as his most popular tale inspired by Sullivan's Island. The quotations are from the tale. Poe's assumed name is not given in these sources, so it is not used.
