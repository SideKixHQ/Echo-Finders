teaser: "In Safe Haven, the bar on this point was Ivan's Fish Shack. It used to be a real fish house."
script: |
  Look for the bar on the point, where the Intracoastal Waterway meets the Cape Fear River.

  In the film Safe Haven, this was Ivan's Fish Shack.

  Before it was a bar, it was a fish house.

  Safe Haven starred Julianne Hough and Josh Duhamel, and the town saw an immense increase in tourism around its release.

  The bar has had other parts too, in Weekend at Bernie's, I Know What You Did Last Summer and The Three Lives of Karen.

  It is known as the best place to watch the sunset in Southport. When the phones come out, the manager says, it is usually for the sunset, or for the dolphins going by.

  A fish house that played a fish shack. Typecast, and happy about it.
