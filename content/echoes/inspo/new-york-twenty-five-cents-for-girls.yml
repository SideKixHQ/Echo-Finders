teaser: "She needed money for school clothes. So she rented the rec room, and her brother brought his records."
script: |
  Look up at this apartment building. Eighteen floors, tall and plain, over the expressway. Nobody would look at it twice.

  The rec room on its ground floor has low ceilings, a small kitchen, a few closets. No plaque. Nothing to tell you a kind of music started in it.

  In the summer of nineteen seventy three, a teenager named Cindy Campbell wanted new clothes for the school year. So she rented that room and threw a party. Twenty five cents to get in for girls. Fifty cents for boys.

  Her brother Clive played the records. He was eighteen. Everybody called him Kool Herc.

  He had come from Jamaica as a boy, and he had grown up on the big sound systems there. And he had noticed something on the dance floor. The dancers waited for one short stretch of a record. The break. Just the drums. That was when they went wild.

  So he got two copies of the same record, on two turntables. He played the break on one. Then the break on the other. Then back again. Round and round.

  He called it the merry go round.

  That was the eleventh of August. A party in a rec room, to pay for school clothes.

  Fifty years later, the city threw block parties in all five boroughs to celebrate it.

  The room is still in there. It still looks the same.

