teaser: "He was already famous. He was also too poor to feed his family."
script: |
  Look at the little white cottage in the park, with its porch and its small windows. All around it, the apartment buildings of the Grand Concourse tower over it.

  In eighteen forty six, there were no towers. This was the country. And a famous poet came here because he could not afford anything else.

  His name was Edgar Allan Poe. The Raven had come out the year before, and everybody knew it. But fame paid him almost nothing.

  He brought his wife, Virginia, here in the spring, hoping the country air would help her. She was dying of tuberculosis. Her mother, Maria Clemm, came too. She went out selling Poe's manuscripts that nobody wanted. Some days, she searched the fields for wild greens, so the three of them could eat.

  Nothing could be done for Virginia. She died on the thirtieth of January, eighteen forty seven. She was twenty six. In nineteen thirty nine, the bed she died in was still inside.

  In this cottage, afterwards, Poe wrote the poem the guidebooks call her requiem.

  Annabel Lee.

  A love that would not let go, a girl in a kingdom by the sea, and a grief that nothing could end.

  He left in the summer of eighteen forty nine. By October, he was dead in Baltimore.

  Look at the porch again.

  The house is small. What was written in it is not.

