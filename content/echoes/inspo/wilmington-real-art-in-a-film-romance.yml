teaser: "The Longest Ride's museum date, under a room of cardboard monkeys."
script: |
  Look at the museum. For a Nicholas Sparks film, it played itself: a place to fall for
  somebody in front of art.

  The Longest Ride shot its museum scene here over three days. Britt Robertson, Scott Eastwood and
  Gloria Reuben mingled under an exhibit by James Grashow made of dozens of cardboard monkeys.

  The romance was invented. The art was real, and it was already here. Film crews borrow museums
  for the same reason people go on dates in them: something interesting to look at while you decide
  how you feel.
