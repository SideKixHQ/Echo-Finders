teaser: "She was loved so hard they had to take her away."
script: |
  Look through the gate, down the long avenues of oaks and stone. Somewhere in here, for more than fifty years, stood a small statue of a girl. She was a birdbath. To one reporter she looked like the scales of justice.

  She is not in here any more. She was loved too much.

  In the nineteen nineties a publisher needed a cover for a book about Savannah. They asked a local photographer, Jack Leigh. He had come to this cemetery all his life, with his family. He had never once seen her. He got the keys and let himself in, and found her among the graves.

  He said later that the eeriness was exactly what he wanted.

  His photograph went on the cover of Midnight in the Garden of Good and Evil. At least two million people bought the book. Then came the film, and the visitors, and the Bird Girl, as everyone now called her, was being loved to death.

  So she was taken out of the cemetery, to protect her, and put in one of the Telfair museums in town. She is still there.

  Look down the avenue again.

  She stood here unnoticed for half a century. Then she was famous, and she had to go.
detail: >-
  The Library of Congress record for Carol M. Highsmith's photograph says the statue "had stood in the graveyard for more than 50 years" and was moved to a Telfair museum after the film. NPR (2007, from CBS Sunday Morning, 1997) has Leigh's account of never having seen her, letting himself in with keys, and the eeriness; the "two million" is NPR's figure for books sold. CBS News: "so overrun with visitors she was being loved to death". NBC News (2009): moved "to protect it from vandalism". The book was published in 1994 (LOC record).
