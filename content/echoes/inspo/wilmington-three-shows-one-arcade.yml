teaser: "Tree Hill, Capeside and Cousins all came here to play."
script: |
  Look at the arcade and the mini golf. Fictional towns keep coming here to play.

  Dawson's Creek filmed scenes in the arcade and the Big Splash Cafe and Pizzeria. So did One Tree
  Hill, along with the miniature golf course. Years later, The Summer I Turned Pretty filmed its
  arcade and go-kart scenes here.

  On screen they were different towns. Off screen, their teenagers all had the same favorite
  afternoon out.
