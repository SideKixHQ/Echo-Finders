script: |
  Find the two storey house on West Ashley Avenue, with the historical marker in front of it. The writer DuBose Heyward and his wife, Dorothy, spent their summers here.

  In nineteen thirty four, George Gershwin came down by train with his cousin, the painter Henry Botkin. They drove out to Folly Beach, where Heyward had rented a cottage for him on West Arctic Avenue.

  Gershwin had come to write an opera, from Heyward's novel Porgy.

  The house in front of you is where the two men worked on it together. Inside, it still has a writer's booth that the Heywards and Gershwin used.

  Porgy was not entirely invented. Heyward had kept a clipping from the Charleston paper about a real man, Samuel Smalls, who was familiar to King Street with his goat and cart.

  The opera they wrote was Porgy and Bess. It was set in Charleston.

  Charleston did not see it performed until nineteen seventy.

  Look at the house again.

  It was written a few miles from the city. The city waited thirty five years to hear it.
detail: >-
  The Post and Courier gives the house at 712 West Ashley Avenue where DuBose and Dorothy Heyward spent their summers, the September 2026 marker in front of it, its account that Heyward and Gershwin collaborated there in 1934, the writer's booth still inside, and Samuel Smalls and the 1924 clipping Heyward kept (report of 25 September 2026). A separate Post and Courier item (2020) gives Gershwin's arrival by train with his cousin Henry Botkin and the cottage Heyward had rented for him at 708 West Arctic Avenue. The South Carolina Encyclopedia entry on Heyward independently gives Heyward's large part in writing Porgy and Bess, its debut six years after Mamba's Daughters (1929), that is 1935, and that it was not performed in Charleston until June 1970. The place facts rest on one publisher, so factCheck stays single-source: a reviewer should look for a second source that puts the collaboration in the West Ashley Avenue house rather than Gershwin's cottage on West Arctic Avenue. "Thirty five years" counts from the 1935 debut to 1970. The Catfish Row echo on Church Street covers the play and Cabbage Row; this one covers where the opera was written.
