teaser: "A revolution organised in the rooms where people rolled cigars."
script: |
  Stand on Duval Street, and picture this island in eighteen ninety two.

  That summer, in Chicago, a man named Socorro told a reporter how a revolution was being organised. Until recently, he had been secretary of the council of Cuban club presidents here, in Key West.

  Key West, he said, was so well organised that every Cuban here belonged to one club or more. And every cigar factory was a club.

  Even the women had formed clubs.

  The clubs spread the word, bought arms, and enlisted men, ready to move at a moment's notice.

  At their head, he said, was José Martí. As a schoolboy, the paper said, Martí took the blame alone for an essay he and a friend had written for Cuban independence, and was put to work in irons in the streets of Havana.

  Martí, he said, would not waste lives. He was waiting for the word.

  Three years later, Martí was killed on the field of battle in Cuba.

  But picture it. A revolution organised not in barracks, but in the rooms where people rolled cigars.
detail: >-
  From the Pittsburg Dispatch of 28 July 1892 (a Chicago interview with K. G. Socorro, until recently secretary of the Council of Presidents of Cuban clubs at Key West): every Cuban in Key West in one or more clubs and every cigar factory a club; women's clubs in Key West; the clubs' objects (propaganda, arms, enlistment, readiness); Martí at the head of the revolutionary party, unwilling to make a useless sacrifice of life, waiting for the word; and the paper's account of Martí's arrest as a boy over an essay for independence, the chain gang and the streets of Havana. The paper gives his age then as 12; other accounts put the arrest later, so the script says "as a schoolboy" and attributes it to the paper. Martí's death on the field of battle is from the New-York Tribune of 3 November 1895. Nothing in either source names a building in Key West; San Carlos is only the listening spot.
