# Drafted by Claude Code (2026-11-11) for Houston, south of the University of Houston: inspo (creation). Second pass.
# Listening spot: outside SugarHill Recording Studios, 5626 Brock Street, founded by Bill Quinn in 1941 and called Gold Star Studios from 1950 (Handbook of Texas; Houston Chronicle, 2015). The studio is a working business behind a fence: heard from the street.
# Place evidence is "building": the Chronicle puts the gold star in the floor of Studio B, in this building, and names Hopkins, the Big Bopper, Freddy Fender and Beyonce as having recorded there. The Handbook does not say whether every Gold Star session it lists happened at this address, so the script names the studio, not the room, for those.
# Position: Overture place "Sugar Hill Recording Studios", 5626 Brock St, 29.70797, -95.32496 (high confidence for the building). About 1.1 km from the Orange Show echo.
