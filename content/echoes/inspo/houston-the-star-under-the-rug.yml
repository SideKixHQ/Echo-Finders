teaser: "The Big Bopper recorded behind this fence. So did Destiny's Child."
script: |
  Look past the chain link fence, at the low buildings behind it. Five of them, fused together over the years into one.

  It looks like nothing much. It is said to be the oldest recording studio in the country still running.

  In nineteen forty one, a man named Bill Quinn opened a recording studio in Houston. By nineteen fifty he called it Gold Star.

  Lightnin' Hopkins cut dozens of songs for him. George Jones recorded Why Baby Why. J. P. Richardson, the Big Bopper, had a huge hit with Chantilly Lace. And in nineteen fifty nine, a young Willie Nelson made some of his earliest recordings at Gold Star, among them the first version of Night Life.

  Then came Clifton Chenier, the king of zydeco. The Sir Douglas Quintet, with She's About a Mover. The Thirteenth Floor Elevators. In the seventies the studio was renamed SugarHill, and Freddy Fender recorded Wasted Days and Wasted Nights.

  Later still, Destiny's Child.

  Inside this building, in Studio B, a large gold star is set into the linoleum floor. Lightnin' Hopkins, the Big Bopper, Freddy Fender and Beyonce all recorded there.

  Most days, a rug covers it.

  Look at the fence again.

  The star is still on the floor. They just keep it under a rug.

