teaser: "Young Belly and Conrad, and Dawson's Creek before them."
script: |
  Look at the old brick buildings of the Cotton Exchange, now full of local shops.

  In season three of The Summer I Turned Pretty, this was the backdrop for young Belly and Conrad:
  a memory, filmed in real brick. Long before that, Dawson's Creek filmed in the courtyard and the
  parking lot here.

  Teenage television keeps coming back to this courtyard. When a story needs to look back at
  childhood, it helps to film somewhere that already feels old.
