script: |
  Look at the fountain where Fifth Avenue meets Market Street.

  In Sleepy Hollow, this is where Ichabod and Abbie meet the lost boy, in an episode called John
  Doe. The same corner has served other productions too: We're the Millers filmed at the building
  across the street.

  Cars pass this fountain every day. On screen, it was the backdrop for a supernatural mystery,
  which is a lot to ask of a fountain in traffic.
