teaser: "Fourteen high schools threw him out."
script: |
  Look up the steps, to the columns at the top. Seventy two steps. Count them, if you are climbing.

  They were built in nineteen twenty three, for an art museum. For fifty years they were just steps.

  Then came a young man named Sylvester Stallone. He had lived in Philadelphia as a teenager. Fourteen different high schools had expelled him. In the winter of nineteen seventy five, with his acting going nowhere, he wrote a film about a boxer from Philadelphia whom everyone expected to lose. Rocky.

  It was made cheaply, and shot in Philadelphia in twenty eight days. And it won Best Picture.

  Twice in the film, Rocky comes to these steps. The first time, on his first day of training, he jogs up them slowly, beaten. The second time, at the end of his training, he runs all the way to the top, and turns, and looks out over the whole city.

  After that, everyone wanted to do it.

  In nineteen eighty, Stallone had a bronze statue of Rocky made for a sequel. Then he gave it to the city, and it was set up in front of the museum. Critics said it was not worthy of an art museum. It was moved away for years. In two thousand and six, it came back for good, to the foot of the steps, just to the north. Look for it.

  The museum was built for art.

  The steps belong to Rocky.
