script: |
  Look along the river, from the Convention Center toward the Isabel Holmes Bridge.

  For Iron Man 3, actors could be seen hanging from cables and flying overhead, filming a stunt
  between the Convention Center and the bridge.

  People walking here that day saw the trick before the effect: real people on real wires above a
  real river. The finished film became the top grossing film of 2013, and part of it was made in
  the air above this stretch of the Cape Fear.
