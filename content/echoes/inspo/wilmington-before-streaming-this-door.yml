teaser: "Pacey's after-school job was behind this storefront."
script: |
  Look at the storefront at 212 North Front Street. In Dawson's Creek, this was Screen Play
  Video, where Pacey worked after school.

  A video store in a show about a boy who wanted to make films. The shelves were the point: rows
  of other people's stories, waiting to be rented for the weekend.

  During the course of the series, 128 episodes over six seasons were filmed in Wilmington and our
  Island Beaches. It catapulted the careers of James Van Der Beek, Katie Holmes, Joshua Jackson and
  Michelle Williams. Some of that began behind a counter in this storefront.
