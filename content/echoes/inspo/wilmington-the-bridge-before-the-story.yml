teaser: "A boy, a basketball and this bridge. Four seasons began here."
script: |
  Look at the steel trusses over the street. Fans call this the One Tree Hill Bridge.

  It is a one-lane metal truss bridge, and for the first four seasons it opened the show: Chad
  Michael Murray in a gray hoodie, bouncing a basketball across it.

  That was the first thing viewers saw of a town called Tree Hill. The town was
  fictional. The bridge was real, and it is in front of you.

  Between 2003 and 2012, 288 episodes spanning nine seasons were filmed in the Wilmington area.
  Each of them depended on real places standing in for imaginary ones.
