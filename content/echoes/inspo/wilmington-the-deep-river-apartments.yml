teaser: "Blue Velvet's Deep River Apartments. Look from across the street."
script: |
  Look across at the brownstone on the corner, from this side of the street. People live
  here, so this story is for the sidewalk.

  In Blue Velvet, it was the Deep River Apartments, home of the singer Dorothy Vallens. The
  outside of the building carries much of the film's mood, and its fire escapes appear in key
  scenes near the end.

  It is one of Wilmington's few brownstones, which is part of why it photographs like a city
  somewhere else. Fans of the film still come here from all over the world.
