teaser: "The show's nightclub is still here, and you can still go in."
script: |
  Look at the building in front of you. On screen, it was TRIC.

  TRIC was the nightclub at the heart of One Tree Hill, and this is where it was filmed. The show
  ended, and the building did not go back to being anonymous.

  Today it runs TRIC Tours. Visitors walk through at their own pace and take photos with replica
  props from the characters' rooms and the record label.

  Between 2003 and 2012, 288 episodes spanning nine seasons were filmed in the Wilmington area. Here,
  the set outlived the show and became a place people travel to.
