teaser: "The lights inside this studio are red, blue, green and white, because Elvis did not like the old ones."
script: |
  Inside this plain concrete-block building, the lights over the studio floor hang from the ceiling in groups of four. Each group has a red bulb, a blue, a green and a white.

  They are there because Elvis Presley did not like fluorescent light.

  This is RCA Studio B. It was built in 1957, the first studio in Nashville that belonged to a major label.

  About thirty-five thousand recording sessions happened in here. More than a thousand hit records came out.

  Elvis's first session here ran overnight, in June 1958, while he was on leave from the army.

  His last was exactly thirteen years later. In between, he made more than two hundred and thirty recordings in this building, among them It's Now or Never and Are You Lonesome Tonight.

  The Everly Brothers cut All I Have to Do Is Dream and Cathy's Clown here too.

  A thousand hits, sung under colored bulbs, because one singer wanted the room to feel right.
