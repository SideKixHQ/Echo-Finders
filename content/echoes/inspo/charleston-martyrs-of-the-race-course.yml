script: |
  Look out across the park. Before it was a park, it was a race course, where the planters of Charleston came to watch their horses run.

  In the last year of the war, it became a prison camp for Union soldiers. Two hundred and fifty seven of them died here, of disease and exposure. They were buried in unmarked graves behind the judges' stand.

  When the war ended, Black Charlestonians came to the race course. Two dozen men dug the graves again, properly. They built a fence around them. And over the gate, they wrote: Martyrs of the Race Course.

  On the first of May, eighteen sixty five, they held a funeral.

  It began at nine in the morning. Two thousand eight hundred Black children marched in first, singing John Brown's Body, and scattered flowers on the graves as they passed.

  A reporter from the New York Tribune called it a procession of friends and mourners, as South Carolina and the United States never saw before.

  They called it Decoration Day. Many now believe it was the first Memorial Day. Other towns have been credited with that, including Waterloo, in New York, a year later.

  The soldiers are not here any more. Their graves were moved to the national cemetery at Beaufort in the eighteen eighties.

  Look across the park again.

  The first people to decorate those graves had been enslaved.
detail: >-
  The South Carolina Encyclopedia entry on emancipation (published by the University of South Carolina) gives the race course used as a prison for Union soldiers in the last year of the war, 257 dead of disease and exposure buried in unmarked graves, the black churchmen who fenced and marked the burial site under an arch reading "Martyrs of the Race Course", the ceremony of 1 May 1865 led by about 2,800 children scattering flowers, the songs, the New York Tribune reporter's words, and the view that this was what many believe to be America's first Decoration Day. The Post and Courier (Brian Hicks, 2009, edited 2019) gives the race course where planters gathered, the graves behind the judges' stand, the two dozen men and the fence, the 9 a.m. start, the children singing "John Brown's Body", the name Decoration Day, Blight's research, Waterloo's credit, and the removal of the graves to Beaufort National Cemetery in the 1880s. Two independent sources for every key fact; the claim to be first is contested and the script says so.
