certaintyNote: >-
  Whether this was the first Memorial Day is argued. The South Carolina Encyclopedia says many believe it was America's first Decoration Day; the Post and Courier quotes the historian David Blight calling it "in effect, the first Memorial Day", and notes that Waterloo, New York, has been credited as the first. The script says both.
