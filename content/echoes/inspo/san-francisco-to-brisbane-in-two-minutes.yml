teaser: "No music. Just tyres, engines, and these hills."
script: |
  Look down the hill. Steep, isn't it? In nineteen sixty eight, Steve McQueen came down slopes like these in a green Ford Mustang, for the film Bullitt.

  It was Hollywood's first major car chase shot not on a studio lot, but out on real streets, at real speeds. The director closed off sixty square blocks of the city.

  McQueen was a racing driver, and he did some of the driving himself. According to one biography, the Mustang and the black Dodge Charger chasing it hit a hundred and fifteen miles an hour on the city's hilly streets.

  There is no music in the chase. Only tyres squealing, and engines.

  One local critic points out that the film cheats. In under two minutes, McQueen gets from Russian Hill to Brisbane, south of the city.

  In traffic, that drive takes forty.
detail: >-
  CBS News (2018): Hollywood's first major car chase shot on the streets at real speeds, Peter Yates closing off 60 square blocks, McQueen an accomplished race car driver. CNN via CBS San Francisco (2020): the green 1968 Mustang GT and the black Dodge Charger R/T, McQueen doing some of the driving, up to 115 miles an hour on hilly streets according to Marc Eliot's biography, and no music, only squealing tyres and roaring engines. CBS San Francisco's "Best Movies Set in San Francisco": McQueen careening down Russian Hill's precipitous inclines and ending up in Brisbane in less than two minutes, a ride that takes 40 minutes. All three are carried by CBS, so this counts as one publisher; the 115 miles an hour figure is attributed in the script. The Mustang's later history (bought for 3,500 dollars in 1974, sold for 3.7 million) is in the sources and left out to keep one idea.
