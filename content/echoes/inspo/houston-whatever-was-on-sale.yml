teaser: "Listen for the wind chime that never stops. It is made of beer can tops."
script: |
  Look at this house. The walls shine. Strings of metal hang from the roof and twitch in the wind.

  It is covered, every bit of it, in beer cans. More than fifty thousand of them.

  In nineteen sixty eight, all John Milkovisch wanted was a covered patio, somewhere to drink his beer at the end of the day. He worked as an upholsterer for the railroad. And for years he had been saving his empty cans.

  While I was building the patio, he said later, I was drinking the beer. I knew I was going to do something with them aluminum cans, but I didn't know what.

  He found out. He flattened them and put them on the house. Then he made fences out of them, and long garlands of can tops to hang from the roof. He kept going for close to twenty years.

  It was a six pack a day, the house's restorer says, him and his wife and friends and anybody passing by.

  And his favorite brand? Whatever was on sale.

  He died in nineteen eighty eight. An arts group restored the house, and opened it to visitors.

  Stand still for a moment and listen. Those strands of can tops dance when the wind blows. The restorer calls it a wind chime that never stops.

  It started with a patio.

