teaser: "Dawson's Creek ended where the river bends."
script: |
  Look at the riverfront restaurant at the southern end of the Riverwalk. In the last episode of
  Dawson's Creek, this was the Icehouse, Pacey's restaurant.

  It was not the first Icehouse. The original stood a couple of blocks north, at 115 South Water
  Street. When the series needed its ending, it found a new waterfront to finish on.

  During the course of the series, 128 episodes over six seasons were filmed in Wilmington and our
  Island Beaches. The story of Capeside closed here, beside a real river.
