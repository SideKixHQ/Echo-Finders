teaser: "Patsy Cline sang Crazy in a war-style metal hut tuned with curtains and burlap."
script: |
  Somewhere behind this front is a metal Quonset hut, the curved-roof kind the military used all through the Second World War. A little of its roof still shows from the back.

  In 1955 two brothers, Owen and Harold Bradley, bought a house here and turned it into a recording studio. That move is now credited as the birth of Music Row.

  They needed more room, so they bought a Quonset hut kit and put it up out back.

  Neither man had been trained in acoustics. They did it by ear. Big curtains in the corners to trap the bass. Green burlap up near the ceiling, to keep out the sound of rain on the metal roof.

  Their engineer found one spot near the control room that was best for a singer. Tile thirteen.

  On the twenty-first of August, 1961, the band recorded a song here from a Willie Nelson demo. It was called Crazy.

  The singer was Patsy Cline. Only a few months before, she had been thrown through a windshield in a car crash.

  When she started on the vocal, she stopped herself. She could not sing it up to her own standard.

  A few days later she came back, and sang it in one take.

  One take, in a metal hut, with burlap keeping out the rain.
