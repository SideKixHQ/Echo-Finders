teaser: "One gun, thirty six shots, and a poem that outlived it."
script: |
  Look south across the water, toward the low marsh on the far side of the harbour. In eighteen sixty three, the Union army built a battery out there, on a point in the marsh between James Island and Morris Island.

  On it they mounted one big gun. The soldiers called it the Swamp Angel.

  General Gillmore sent a note. Evacuate Morris Island and Fort Sumter, it said, or I shall open fire on the city of Charleston, from batteries already established within easy and effective range of the heart of the city.

  The note was unsigned. It went to the wrong place. And at half past one in the morning, the gun opened fire on the city behind you.

  People stayed in their lit houses, and the streets emptied. One family carried a dying boy out of East Battery in an ambulance, lit by the bursting shells.

  The gun itself did not last. It burst on its thirty sixth shot.

  But the gun found a poet. In eighteen sixty six, Herman Melville published a poem called The Swamp Angel. By night there is fear in the City, he wrote. And he imagined Charleston calling on its own saint, Michael, in his steeple. Vainly she calls upon Michael, for Michael has fled from his tower.

  The gun lasted thirty six shots.

  The poem never burst.
detail: >-
  Ravenel (1906) gives the gun's position in the marsh between Morris and James islands, Gillmore's unsigned note and its wording, its delivery to Battery Wagner rather than to Beauregard, the opening of fire at half after one, the family on East Battery and the dying boy, and the gun bursting at the thirty-sixth shot; her account is written from the Confederate side. The National Park Service page on Gillmore confirms his use of rifled artillery from Morris Island to bombard Charleston and Beauregard's protest. Melville's poem The Swamp Angel is in Battle-Pieces and Aspects of the War (1866); it pictures the gun as a coal-black avenger, an image the script does not repeat. The month is not stated in these sources, so the script gives only the year; a reviewer should confirm it.
