teaser: "Every evening on the picket line, they sang the same song."
script: |
  Look across the street at the long brick factory, five storeys high, with rows of arched windows. It was built as a cotton mill in the eighteen eighties. From nineteen twelve it made cigars, and the city called it the Cigar Factory.

  Inside, the work was divided by race. Black women stripped the stems from the tobacco. White women rolled the cigars.

  In October nineteen forty five, the workers went on strike. Most of them were Black women. They picketed outside this factory for five months, through the winter, until March.

  And at the end of every day on the picket line, they sang.

  It was a hymn from the Black churches. Where the hymn said I, they sang we. We will overcome.

  One account remembers a worker named Lucille Simmons leading it, slowly, every evening.

  The song left Charleston with the strikers. Somewhere on its way, the words were changed again, to We Shall Overcome. It became an anthem of the civil rights movement.

  Look back at the factory.

  It began as the way they ended a day on the picket line.
detail: >-
  The National Register nomination (1980) gives the five storey brick mill built about 1882, its rows of segmental headed windows, and its use by the American Cigar Company from 1912 as the Cigar Factory. The Post and Courier's report on the factory's designation as a National Historic Landmark (December 2024) gives the division of work by race and sex, the strike from October 1945 to March 1946 by workers who were mostly Black women, the singing of "We Will Overcome" to close each day of picketing, and the hymn's later change to "We Shall Overcome". The South Carolina Encyclopedia entry on organised labour independently gives the six month strike, Black women as its prime force, and their singing of the song on the line. Lucille Simmons leading it slowly is from a Post and Courier column (2020) quoting the historian Peter Lau, a single source, so the script says "one account". The column also traces the song through the Highlander Folk School to Pete Seeger; the script leaves that out.
