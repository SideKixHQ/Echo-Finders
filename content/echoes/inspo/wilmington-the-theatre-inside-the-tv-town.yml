teaser: "Two fictional towns borrowed this building: one its steps, one its stage."
script: |
  Look at the front steps and the columns of Thalian Hall.

  Fictional towns keep borrowing this building. For Dawson's Creek, its interior became the Rialto
  Theatre in Capeside. For One Tree Hill, the front steps and Corinthian columns frequently stood
  in as the steps of Tree Hill's town hall.

  A real theatre became the civic heart of places that never existed. The building did not have to change at all. The cameras just
  pointed at it and gave it a new name.
