script: |
  Beside the old mission church on Dolores Street is a small cemetery. There is a grave in it that people come a long way to find. The woman in it never existed.

  In the nineteen fifty eight film Vertigo, James Stewart plays Scotty, a police detective turned private eye. An old college friend asks him to follow his wife, Madeleine, played by Kim Novak.

  He follows her through San Francisco. And Madeleine seems obsessed, perhaps possessed, by a figure from the city's past. A woman named Carlotta Valdes.

  In the film, Carlotta Valdes is buried in this cemetery, at Mission Dolores.

  She was invented. But the film made this city mysterious for a lot of people, and they still come looking for her.

  A reporter who came here met a visitor from Vancouver. He said he had wanted to make sure he stopped here.
detail: >-
  From NPR's 2011 On Location piece on Vertigo: the 1958 film, Stewart as Scotty, the police detective turned private detective asked by an old college friend to follow his wife Madeline (Kim Novak), her apparent obsession or possession by Carlotta Valdes, "a figure from San Francisco's history", and the cemetery at Mission Dolores "where the fictional Carlotta Valdes was buried in the film", with the visitor from Vancouver. NPR spells the character Madeline and Scotty; the film's credits use Madeleine, which the script follows.
