teaser: "Look at the roof. Bell's greatest invention, by his own account, went out from up there."
script: |
  Look up at the top of this old school building. In June eighteen eighty, Alexander Graham Bell was up there, with a mirror.

  He had already invented the telephone, four years before. This was something stranger. A telephone with no wire.

  Bell and his young assistant, Charles Sumner Tainter, called it the photophone. You spoke into it, towards a thin mirror. Your voice made the mirror shiver. Sunlight bounced off the mirror, and carried those tiny shivers away across the rooftops. At the other end, a crystal of selenium caught the light, and turned it back into a voice.

  On the third of June, eighteen eighty, from the top of the Franklin School, it worked. The first wireless telephone message in history, carried on a beam of sunlight.

  Bell called it the greatest invention he had ever made. Greater, he said, than the telephone.

  For years, hardly anyone saw why. A cloud could cut it off. Until much later, there was no good way to carry light safely over a distance.

  Then came fibre optics. Today, the Library of Congress calls the photophone their ancestor.

  So look up at the roof again. A good part of the internet travels the way Bell's voice did.

  On light.
