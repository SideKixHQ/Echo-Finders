teaser: "Dawson's Creek went to high school at UNCW."
script: |
  Look at Alderman Hall. Fans of Dawson's Creek know it as Capeside High.

  The University of North Carolina Wilmington doubled as the Capeside High School campus, and
  Alderman Hall is one of the most recognizable buildings in the show.

  Real students have walked these paths toward real degrees, while fictional teenagers walked them
  toward fictional exams. During the course of the series, 128 episodes over six seasons were filmed
  in Wilmington and our Island Beaches. For a while, this campus ran on lectures and on fiction at the same time.
