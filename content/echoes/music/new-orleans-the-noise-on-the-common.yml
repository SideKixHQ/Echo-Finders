teaser: "He thought it was horses on a wooden floor."
script: |
  Look out across this open square.

  One Sunday afternoon, soon after he reached the city in eighteen nineteen, an architect named Benjamin Latrobe set out from the old town for a walk along a canal. He went up St. Peter Street, toward the common ground at the back of the city, and he heard something he could not place.

  He thought it was a horse mill. Horses, tramping on a wooden floor.

  It was people. Five or six hundred of them, he reckoned, gathered in an open space at the edge of the common. People would come to call that space Congo Square.

  They stood in circles, and inside each circle was a ring of dancers, the largest not ten feet across.

  He wrote down what he saw. An old man sitting astride a drum, beating it with the edge of his hand, with incredible quickness. A stringed instrument with a gourd for a body and a small carved figure of a seated man at the top of its neck, played by a man who looked eighty or ninety years old. Women answering the music in two notes. A man singing in a language that was not French.

  He was told they met here every Sunday afternoon. He did not like what he heard, and his journal says so in ugly terms.

  Then he walked on, about a mile along the canal. He came back after sunset, near the same spot.

  They were still playing.
detail: |
  Latrobe's journals were published in 1905 as The Journal of Latrobe; the passage falls
  between his entries of 9 January and 8 March 1819. The National Park Service notes that
  enslaved people gathered on Sundays at a market outside the city's rampart by the
  mid-eighteenth century, and that the dancing in Congo Square ended before the Civil War.
