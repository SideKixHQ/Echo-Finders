tags: [charlotte, uptown, radio, music, country-music]
teaser: "North Carolina's first commercial radio station filled the air with hillbilly music, paid for by a laxative."
script: |
  Charlotte had the first commercial radio station in North Carolina, and the second in the South.

  It began in March 1921 as a hobby, an amateur station set up in a man's kitchen.

  Within a year it had a license, and the call letters W B T. In 1924 it moved to a building near this corner, and its studios stayed around here until 1955.

  In 1933 its signal went up to fifty thousand watts, enough to blanket the East Coast.

  And what it sent out, through the thirties and forties, was country music. People then called it hillbilly.

  The best known show was paid for by a laxative company from Texas, the makers of Crazy Water Crystals.

  It was Charlotte's answer to the Grand Ole Opry in Nashville.

  The record companies came too. For a while Charlotte was a recording center.

  In July 1949 the station's owners put the first television station in North Carolina on the air.

  Country music for half the coast, brought to you by a laxative. Somebody had to pay for it.
