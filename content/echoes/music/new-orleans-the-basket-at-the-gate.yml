teaser: "Sandra sat by the gate with a wicker basket."
script: |
  Look at the old building here on St. Peter Street, the one that is famous for music but not much to look at. Inside, there is no stage and no air conditioning. People sit on hard benches, or on the floor.

  In nineteen sixty one, what happened in that room could get you hauled into court.

  That year, Allan and Sandra Jaffe came to New Orleans on their honeymoon. They were in their twenties, and they loved jazz. They turned an art gallery here into a place to hear the old New Orleans players. Every night, Sandra sat by the gate with a little wicker basket, collecting the dollar bills.

  Their son Ben says this was the only place in New Orleans where Black and white people were gathering openly, and where the bands were mixed. In Louisiana, that was illegal. A law passed in nineteen fifty six outlawed integrated entertainment. Allan broke it whenever he sat in with the band on tuba.

  Sandra remembered night court, and a judge banging his gavel at them. We don't mix cream with our coffee in this here town.

  They kept the gate open. After the Civil Rights Act of nineteen sixty four, the crowds came. The musicians still play close enough that you may have to duck a trombone slide.

  Look at the gate.

  Their son runs the Hall now. He plays the tuba.
detail: >-
  Allan Jaffe died in 1987; Sandra Jaffe kept the Hall and the touring band going. Some accounts credit an earlier society for traditional jazz with starting the music in this building before the Jaffes took it over in 1961.
