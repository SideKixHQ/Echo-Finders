teaser: "This boardwalk claims a dance. The claim is worth hearing, carefully."
script: |
  Listen for beach music. If any town can claim this dance, it might be this town.

  The shag is danced to beach music, a laid-back kind of rhythm and blues with strong ties to
  the Carolina coast. Local history buffs claim it is likely to have begun right here, on the
  Carolina Beach Boardwalk.

  Likely is doing real work in that sentence. Dances do not keep birth certificates.

  But the music never left. The Carolina Beach Music Festival has run here for more than thirty
  years, and its organizers believe it is the longest-running beach music festival still held
  on the actual beach.

  Watch the feet. Whether or not it started here, it has never stopped here.
