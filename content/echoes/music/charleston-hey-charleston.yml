tags: [charleston, charleston-core, music, jazz, african-american-history]
teaser: "A boy dancing in front of a band of orphans."
script: |
  Look at the porch railings on this building. They were designed to look like the tracery around a Gothic stained glass window. It was built in the eighteen thirties as a hospital for sailors.

  From eighteen ninety five, it was home to something louder. The Jenkins Orphanage.

  The Reverend Daniel Jenkins had been born enslaved, and orphaned young. In eighteen ninety one he took in four boys he found sheltering in an abandoned building. Soon the orphanage housed hundreds of boys. To pay for them, he did something unusual. He gathered up instruments, hired two local musicians as teachers, and sent the boys out as a brass band.

  It worked. The band played the streets of Charleston, then New York and London. It marched in the inaugural parades of two presidents.

  And it played the tunes of the Gullah people of the Sea Islands, with a small boy out front, dancing the steps. In Harlem, the pianist Willie the Lion Smith remembered, people would shout to that boy. Hey Charleston, do your Geechie dance.

  The jazz pianist James P Johnson listened to the band and wrote eight tunes he called charlestons. One of them became The Charleston, and it went around the world.

  By many accounts, the craze started here. With orphans, earning their keep.
