teaser: "The Eighth Wonder of the World needed votes. One man set the price."
script: |
  Look at the Astrodome, the first stadium in the world built to be air conditioned. Before it could be built, somebody had to vote for it.

  And the men who wanted it could not win without Black voters.

  It was nineteen sixty one. Roy Hofheinz and Bob Smith wanted a major league baseball team for Houston, and a stadium with a roof. For that, Harris County voters had to approve a public bond issue.

  They needed the support of Black Houstonians. So they went to Quentin Mease. He was a veteran of the Air Force in the Second World War, and one of the most respected Black leaders in the city.

  In Houston, it was only the year before that lunch counters had been integrated.

  Mease and the other Black leaders listened. And they agreed to campaign for the bond on one condition.

  The new stadium had to be open to everyone, together.

  Hofheinz and Smith agreed. The bond issue, forty two million dollars, was passed.

  Look up at the dome again. The Eighth Wonder of the World.

  It had a condition written into it before a single beam went up.

