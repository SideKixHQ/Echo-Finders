teaser: "A brewery on this bluff dug its cellars half a mile deep."
script: |
  Up on the bluffs near here, by Shepard Road and Drake Street, stood a brewery.

  Frederick and William Banholzer made it one of the more successful breweries in Saint Paul by the 1880s.

  They dug caves that went half a mile deep, with many chambers.

  Within a year after William died in 1897, the business closed.

  The beer is long gone. Half a mile of cellar was dug for it.
