teaser: "One of these old stone buildings was an icehouse, on an island where nobody could make ice."
script: |
  Find the two old stone buildings at the corner of Wall Street and Tift Alley. The northern one is the oldest commercial building in the city. It was built as a ship chandlery. The southern one was an icehouse.

  An icehouse, in the tropics.

  Until 1890, nobody made ice in Key West. It came from the North, in ships built specially to carry it, and it was stored here.

  The Tift company was advertising ice for sale by 1855. It was not a luxury. Ice was a vitally important commodity in the tropics, for the relief of fever victims.

  And behind the buildings, big cisterns collected the rain, to supply ships calling at the port.

  Ice from the north, and water from the sky. On a hot island surrounded by salt water, those were things worth selling.
