teaser: "The first one had no cheese, and Harry never got to eat it."
script: |
  Look at the stand on this corner, with its name in lights, and the rival stand across the street. This is where people say the cheesesteak began.

  In nineteen thirty, two brothers, Pat and Harry Olivieri, opened a hot dog stand near here, by the Italian Market. They sold hot dogs, mostly to cab drivers. They both had other jobs. Pat made sleds in the daytime. Harry worked at the Navy Yard. And every day, they ate hot dogs.

  One day, tired of hot dogs, Pat sent Harry to a store for some beef. Harry sliced it, grilled it with onions, and piled it on a roll. They were about to eat, when a cab driver pulled up, smelled the meat and onions, and wanted one. So Harry sold the cabbie his own sandwich. The brothers always counted that as the moment it all began. By most accounts, that was in nineteen thirty three.

  Notice what was missing. There was no cheese. Cheese came later. The orange kind arrived in the nineteen sixties. Geno's opened across the street in nineteen sixty six. Its owner today says of Pat, he invented it. We just perfected it.

  The first one had no cheese.

  And Harry never got to eat it.
detail: >-
  The date is told both ways: Pat's says 1930; the Associated Press put the stand in 1930 and the first sandwich three years later. Who first added cheese is disputed between Pat's and later rivals.
