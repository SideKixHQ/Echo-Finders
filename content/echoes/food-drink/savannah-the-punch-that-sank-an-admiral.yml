# Drafted by Claude Code (2026-11-11) for the second Savannah pass, following the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: East Broughton Street between Drayton and Abercorn, outside the Marshall House hotel (123 East Broughton), which A. B. Luce kept in the 1860s and whom a punch maker in 1900 credited with the first Chatham Artillery punch.
# Position: Broughton at Drayton and Broughton at Abercorn from the street segments in the app's Savannah street file, a point a little east of the block's middle (medium confidence for the door; the block is certain from the address). No other echo within 150 m.
# The Dewey episode happened on a trip down the river, not in this building; the script says so. What ties the place to the drink is Luce, and that rests on one anonymous informant, which the script says aloud.
