teaser: "He won a battle at sea. Savannah's punch was another matter."
script: |
  Find the Marshall House on this block of Broughton Street. It opened in eighteen fifty one, a splendid new hotel of ninety rooms, its first advertisement said.

  In the spring of nineteen hundred, a war hero came to Savannah and was knocked flat. Not by an enemy. By a drink.

  He was Admiral George Dewey, the victor of Manila Bay. On a trip down the river, the Morning News reported, he was put out of action by salad and punch. Chatham Artillery punch, the drink of the city's old militia battery.

  The man who had mixed it was indignant. Strong? he asked the paper. Why, certainly not. A lady might drink four or five and never feel it. But he asked not to be named. He had family in Savannah, he said, who would be shocked to know he had anything to do with such a drink.

  Then he gave its history. It was first made, he said, by a member of the battery called A. B. Luce, who kept the Marshall House. A quart of whisky, a quart of rum, a quart of brandy, a gallon of light wine. Then champagne, as much as you liked, and lemons, and fruit.

  Days later, Dewey announced he would run for President. Papers across Georgia had their fun. Dewey's first mistake, one wrote, was tackling artillery punch. His second was running for President.

  Look at the hotel again. In eighteen sixty nine a visiting editor stayed here, and called Luce the prince of hotel keepers.

  He had won a battle at sea. The papers agreed he had lost one on the Savannah River.
detail: >-
  Savannah Morning News, 1 April 1900, "Punch Has Lost Potency": an unnamed maker of "the concoction that was served on the trip down the river when Admiral Dewey was placed hors du combat by indulgence in salad and punch"; "Why, certainly not. A lady might have drunk four or five of it and never felt the effect" (OCR damaged; the script tells it as reported speech); "I have folks in Savannah who would raise their hands in holy astonishment did they know that I had anything to do with such a wicked drink"; first made "in the late forties" on a trip to Nashville by "A. B. Luce, a member of the battery ... the proprietor of the Marshall House in those days"; the recipe of whisky, Santa Cruz rum, brandy, a gallon of light wine, champagne "ad libitum", lemons and fruit. The late 1840s date predates the hotel's 1851 opening, so the script gives no date for the first punch; Luce is named as proprietor in The Southern Sun, 16 December 1869 ("Col. A. B. Luce, Proprietor of the Marshal House"). Daily Morning News, 1 October 1851: "MARSHALL HOUSE FOR RENT. The above splendid new Hotel on Broughton street, comprising 90 rooms". The Savannah Tribune, 30 November 2016: "the Marshall House at 123 E. Broughton Street". Thomasville Daily Times-Enterprise, 6 April 1900: "Dewey's first mistake was tackling artillery punch; his second mistake is in announcing himself a candidate for the presidency." That the 1851 building is the one standing now is from the hotel's continuity of name and address and a 2015 travel piece ("This 1851 hotel"); a reviewer may want the National Register record before approval. Age set to 16 because the echo is about drink.
