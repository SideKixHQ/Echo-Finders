tags: [charlotte, elizabeth, food, vegetable-sandwich]
teaser: "For half a century, a Charlotte party meant one small, crustless sandwich, invented on this street."
script: |
  Somewhere on this street, in 1941, a caterer's kitchen invented a sandwich that Charlotte would eat at parties for nearly half a century.

  To old Charlotte it was simply the vegetable sandwich. Not any sandwich with vegetables in it. This one.

  Finely minced raw vegetables, bound with mayonnaise, on white bread. No crusts. No garlic.

  The caterer was Eva Pressly, and the idea came from her sister and partner, Dot Thompson. She chopped the vegetables fine and drained them twice.

  You went to the house on Crescent Avenue to pick them up. They came packed in a white shirt box.

  Word traveled. People as far away as New York and California called to ask about them.

  When the sisters sold the business in 1975, the recipe went with it, and it stayed a secret. Later cooks rebuilt it from memory, and added gelatin to hold it together.

  By the nineties, the city's taste had moved on, and the sandwich faded away.

  Plain, cold, and neat. For fifty years, it was what a Charlotte party tasted like.
