teaser: "A president upstairs, and the man Charleston remembers in the kitchen."
script: |
  Look across Broad Street at number one hundred and sixteen. A president slept in that house. But the person Charleston remembers from it was working in the kitchen.

  In November, nineteen oh nine, President Taft came to Charleston. Crowds cheered him from the station all the way to that door, the home of the mayor, Robert Goodwyn Rhett.

  The Rhetts had a butler named William Deas. Mrs. Rhett's own cookbook called him one of the great cooks of the world. His soup was made with she crabs. The crab man in the street charged ten cents a dozen extra for the ones with eggs. The eggs were picked out and stirred in with the meat, and that is what made it different.

  When that cookbook was being written, they sat William down first, and a stenographer took down every word he said. The book prints the menu from the president's visit, too. The first course was crab soup. Just crab soup.

  Years later, the chef José Andrés put she crab soup on his menu in Washington, and gave the credit to one man. Not the president. William Deas.

  Look at the door again.

  The president had crab soup. The rest of us got William's.
detail: >-
  The popular story that she crab soup was invented for President Taft is not supported by the sources used here: the 1930 cookbook prints the menu of Taft's visit with plain "Crab Soup", and credits the she crab soup to William Deas. Taft spent the night of 5 November 1909 at Mayor Rhett's house; the mayor's address was 116 Broad Street in 1908.
