teaser: "City Hall stands in the middle of an old open-air market, on purpose or not."
script: |
  Look at City Hall, sitting in the middle of this plaza. Before it was built, this was open ground.

  Military Plaza was laid out by the Spanish in 1722, as a parade ground and a market square.

  For years it was a market in the open air, with the Chili Queens, and the rowdy cowboys, cattlemen and gamblers.

  Then, from 1888 to 1891, the city put its new City Hall right in the middle. That put an end to the open-air market, and to the Chili Queens.

  The building you see stands right where the Chili Queens used to be.
