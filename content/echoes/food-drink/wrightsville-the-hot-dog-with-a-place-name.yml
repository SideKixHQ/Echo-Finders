teaser: "A hot dog stand named for a ride that had already stopped running."
script: |
  Look at the little shop at 94 South Lumina Avenue. The name on its sign points at something
  you can no longer see.

  Trolly Stop opened in 1976 under another name, Station 1. It was called that because it stood at
  the first stop of the trolley line that connected downtown Wilmington to the south end of the
  beach.

  By then the line had been gone for a long time. Its last journey took place in late April of 1940.

  So the stand was named for a stop where no trolley had pulled up in a generation. The cars
  stopped running. The stop kept its name.
