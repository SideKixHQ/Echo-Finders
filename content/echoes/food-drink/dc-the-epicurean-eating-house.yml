detail: >-
  The basement, the corner and the advertisement are from Jefferson Morley's book Snow-Storm in August, as excerpted by NPR; "one of the first true restaurants" and "no black man... had ever dared to speak so freely and publicly" are Morley's judgements, attributed in the script to historians. The riot is from the Park Service's article on abolitionism in the capital. Snow's later life is not told here because it is not in the fetched sources.
