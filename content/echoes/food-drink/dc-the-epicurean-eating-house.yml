teaser: "Down a flight of steps on this corner, Washington learned what a restaurant was."
script: |
  Stand on this corner of Pennsylvania Avenue and Sixth Street. In the early eighteen thirties, a new three story brick building stood here. Out front, a stairway went down from the sidewalk to a basement door.

  Behind that door was a new kind of dining room for Washington. Snow's Epicurean Eating House.

  Its owner was Beverly Snow, a free Black cook from Lynchburg, Virginia. A basement was about the last place anyone expected respectable people to eat. He filled it anyway.

  Historians count it as one of the first true restaurants in the city, maybe the first. Customers sat at their own tables, ate when they liked, and chose from a menu. And Snow advertised it in the newspapers himself, with jokes. His champagne, he wrote, though it may offend the purse, can never affect the head.

  No Black man in Washington had ever spoken to the white public like that.

  In August eighteen thirty five, a white mob came for him. They wrecked his eating house, on the pretext that he had insulted a white woman. Then the rioters went on to burn and loot the city's free Black neighbourhood, its schools and its churches.

  Look down at the pavement where the basement steps were.

  This was where it started.
