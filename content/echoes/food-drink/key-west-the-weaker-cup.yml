teaser: "Which is stronger? The roaster said the answer was not the one you think."
script: |
  You are on Greene Street. In nineteen forty seven, at number five twelve, the Star Coffee Mills was roasting coffee.

  Visitors kept asking the same question. Cuban coffee or American coffee. Which is stronger?

  That January, the roaster, J. T. Sanchez, answered it for the Key West Citizen, turning over a batch of Cuban coffee as he talked.

  American coffee, he said. American is stronger.

  His reason was the oven. Cuban coffee, he said, roasts for twenty to twenty five minutes. American coffee, for a little over fifteen. Roast it longer, he said, and nearly all the caffeine burns out.

  He was roasting fourteen to sixteen hundred pounds of Cuban coffee a day.

  So, the next time a tiny cup of Cuban coffee makes your heart race, remember. The man who roasted it said that was the weak one.
detail: >-
  From the Key West Citizen, 3 January 1947, page 1 ("Cuban Coffee Not So Strong As American, Roaster Says"): J. T. Sanchez of the Star Coffee Mills, 512 Greene Street, on roasting times (20 to 25 minutes against a little over 15) and caffeine burning out of the longer roast, and his output of 1,400 to 1,600 pounds of Cuban coffee a day. The caffeine claim is his, and the script attributes it to him; how much caffeine a darker roast loses is more modest than "nearly all", and a reviewer may want the script to say so. The final line is attributed to him for that reason.
