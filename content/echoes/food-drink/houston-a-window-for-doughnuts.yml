teaser: "The man who gave Houston Hermann Park stood in line on this street, at a little window, for a doughnut."
script: |
  Stand on Preston, by Market Square, and picture a small window at the front of a bakery. Open all night.

  In the late eighteen nineties, some of the most important men in Houston lined up at it.

  It was Stude's Bakery and Coffee Saloon, at eight ten Preston Avenue. It never closed. And at that little window, men queued up for doughnuts, or sweet rolls, to eat with their coffee.

  One of them was George Hermann. He was the man who would give Houston the land for Hermann Park. He stood in line like everybody else.

  Night life in Houston then had plenty of choice. A hotel dining hall served ten course dinners for fifty cents, with suckling pig and larded quail.

  And near the courthouse was Colby's Cafe. Out front was a display of venison, ducks, geese, snipe and turtles. Inside, it served turtle soup and frog's legs, and it kept a tank of live bullfrogs.

  In watermelon season, the story goes, the floor got so slick with melon juice that the waiters skated from table to table.

  Look along the street. The bakery is long gone, and so is the frog tank.

  But picture the line at that window, all night long, for a doughnut.

