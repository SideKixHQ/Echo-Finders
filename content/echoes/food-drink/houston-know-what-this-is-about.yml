teaser: "A watermelon salad, a great-grandmother's name, and one request before you eat."
script: |
  Look at this old house, built in nineteen twenty three. It is a restaurant now, and it carries a woman's name. Lucille.

  She never cooked here. She is the chef's great-grandmother.

  Her name was Lucille Smith. She was a home economist and a teacher. She created a hot roll mix that was sold in grocery stores. She cooked for Dr. Martin Luther King Junior and for Eleanor Roosevelt. And when she sent Christmas fruitcakes to soldiers in Vietnam, President Lyndon Johnson wrote to thank her.

  Her great-grandsons, Chris and Ben Williams, opened this restaurant. It was Ben's idea to name it after Great Grandma. Chris said that was perfect, because it gave them a story.

  Since the day they opened, they have served a watermelon salad, with strawberry and jalapeño dressing. It is red on purpose. Red is the color most people link with Juneteenth, the day enslaved Texans learned they were free. It stands for the blood that was shed.

  Chris has said he is not comfortable calling Juneteenth a celebration. To him, it is a day of acknowledgement.

  So he asks one thing of anyone sitting down to eat that day.

  Know what this is really about.

