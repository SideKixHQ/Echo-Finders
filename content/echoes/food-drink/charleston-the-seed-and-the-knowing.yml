teaser: "Look at the bend in the street. It used to be water."
script: |
  Look along Water Street, at the way it bends. It bends because it used to be a creek.

  Charleston has a story about where its fortune came from, and it begins in a garden on the bank of that creek. The story goes that a ship from Madagascar called here on its way to England, and a man named Landgrave Smith got a bag of seed rice from it. He shared the seed with his friends, and they planted it to see what would grow. His patch was here, in his garden by the creek.

  Within about twenty five years, rice grew along every settled river in the province. In seventeen twenty four, more than seventeen thousand barrels were shipped away.

  But even the old historians had doubts about the bag of seed. Rice had been planted here before. And one of the men who got seed, a doctor named Woodward, did not know for years how to clean it.

  Seed is the easy part.

  The people who knew how to grow rice, and harvest it, and husk it, came from West Africa, enslaved. Men and women from what was called the Rice Coast were prized by the planters, because they knew how. They brought a round, coiled basket for shaking the husks off the grain. That knowledge made Charleston one of the richest cities in the world.

  Look at the bend in the street again. Under it is the creek where the seed went in.

  The seed came with a story. The knowing came in chains.
detail: >-
  McCrady (1897) reports Hewatt's story of seed rice from a Madagascar brigantine in 1698, distributed by Landgrave Thomas Smith to Stephen Bull, Joseph Woodward and others; he notes a barrel of rice in a 1671 bill of lading and a 1691 reward for a rice husking machine. Ravenel (1906) places Smith's experimental patch in his garden on the creek that is now Water Street. Some of the 1897 and 1906 language about enslaved Africans is the racism of its day and is not repeated.
