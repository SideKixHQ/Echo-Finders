teaser: "They never got to eat their own lunch."
script: |
  Look at the three streets meeting here, at an odd angle, and the steak shop on the corner. It never closes. Day and night, people argue on this corner about which sandwich is better.

  And yet the sandwich started as a lunch nobody got to eat.

  In nineteen thirty, two brothers, Pat and Harry Olivieri, ran a hot dog stand in South Philadelphia. One day, they were sick of eating their own hot dogs for lunch. So they grilled some sliced beef with onions instead.

  Before either of them could take a bite, a cab driver came past. He offered five cents for it. And he told them it was better than their hot dogs.

  Ten years later, the brothers opened Pat's King of Steaks, on this corner. For years, though, there was no cheese. Many of their neighbours were Jewish, and kept kosher, and did not eat meat and cheese together.

  Then, in nineteen fifty two, Kraft brought out Cheez Whiz. Pat had an idea. He took the lid off the giant can, and set the whole can on the grill to heat. Cheese for anyone who wanted it, and a clean grill for anyone who did not.

  Look at the window. Whiz, provolone, or American. Wit, or widout.

  All of it, because a cab driver was hungry.
