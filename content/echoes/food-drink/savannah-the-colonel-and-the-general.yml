teaser: "You will be sitting with strangers. That is the point."
script: |
  Look along this block of Jones Street for a line of people waiting at a door. At mealtimes, you cannot miss it.

  They are waiting to sit down with strangers.

  This was a boarding house. Today it is Mrs. Wilkes' Dining Room, and it still runs like one. Breakfast and lunch only. Big tables, and you sit wherever there is a chair, next to whoever is already there. Then the dishes come, ten or a dozen of them, passed hand to hand along the table, family style.

  The fried chicken is the reason for the line. In two thousand one, when Mrs. Wilkes was ninety four, CBS asked her about it. She said,

  If the Colonel made it as good as mine, he'd be a general.

  The recipes went into a cookbook. One edition was sold only here, at the door.

  Look at the line again.

  Half of them will leave knowing the name of somebody they did not come with.
detail: >-
