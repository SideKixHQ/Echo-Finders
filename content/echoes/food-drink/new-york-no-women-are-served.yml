teaser: "Two kinds of beer. Sawdust on the floor. And for a hundred years, a rule."
script: |
  Look at the floor. Sawdust. Look up, over the bar. Old wishbones, hanging on a string, gathering dust for longer than anyone can tell you.

  Now order. You can have light ale, or dark ale. That is the whole menu of beers.

  This bar has been here since eighteen fifty four. And for most of that time, there was one more thing about it that did not change.

  In nineteen thirty nine, a government guidebook to New York put it in five words. No women are served at McSorley's.

  It was a men's bar. Women could not drink here. For decades, that was simply how it was.

  Then, in the nineteen seventies, a city ordinance forced the bar to let women in. Marcia Kramer, who became a well known television reporter in this city, was one of the first women through the door. Her picture, in an old newspaper clipping, has hung in the window.

  Look around the room now.

  Half the people in here would not have been allowed to hear this.

