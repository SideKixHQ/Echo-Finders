teaser: "Before there was a roof here, there was the open levee and whatever people had to sell."
script: |
  Walk in under the long roof of the market and look along the line of columns.

  Before there was any roof here, there was the open levee, just downriver of the old parade ground. People laid out what they had to sell on the ground. Vegetables, fruit, game, skins, herbs, baskets. Hunters and trappers. Black vendors. Native traders. In the Spanish years a butcher's shed went up, and the market grew along the river from there.

  One thing kept arriving, long after the sheds went up.

  At the start of the twentieth century, Choctaw women still came here twice a week from their settlement at Bayou Lacombe, across Lake Pontchartrain. They crossed the lake by steamer, walked from the lakeshore to this market, and sat with bundles of herbs, baskets, and one thing above all.

  Dried sassafras leaves, pounded into a powder. Filé.

  It was a Native food first. Creole cooks took it up to thicken their gumbo, and kept it. A guidebook from nineteen oh four says the Choctaw sellers here always found a ready sale.

  So if your gumbo in this city comes with filé, that powder is a Native food, and for a long time, Choctaw women sold it right here.
