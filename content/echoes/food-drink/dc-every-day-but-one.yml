teaser: "A soup so traditional the Senate has served it every day for more than a century. Almost."
script: |
  Look at the menu on the counter here. Somewhere on it, you should find a plain looking soup. Senate bean soup.

  It is about the simplest thing the government makes. Navy beans, ham hocks, onions, butter and water. A little salt and pepper.

  And it has been on the Senate menu since around nineteen oh four.

  Nobody agrees who started it. There are two stories, and they split down party lines. One says a Democratic senator from Idaho demanded bean soup every day. The other says it was a Republican from Minnesota, a year later.

  Either way, the Senate kept serving it. Every single day. With one exception. During the Second World War, there was rationing, and one day the Senate ran out of beans.

  That was it. One day, in more than a hundred years.

  A reporter once stood in a Senate cafeteria for twenty minutes, asking the diners if they ate it. Nobody did. One said it is for tourists.

  Which, today, is you.

  Order a bowl. You are keeping a tradition alive.
detail: >-
  All from NPR's 2014 report with the Senate's associate historian, Betty Koed. The count of "every day but one" was given in 2014; the script says "in more than a hundred years" without updating it. The senators are not named because their stories are traditions, not records.
