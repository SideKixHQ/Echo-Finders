teaser: "A wall of little glass doors, and a nickel for each."
script: |
  Look along Chestnut Street, here near the corner of Eighth. Picture a wall of tiny glass doors, rows and rows of them, each with a plate of food behind it. A sandwich. A chicken pot pie.

  You put a nickel in the slot. You turned a little knob. The door sprang open, and lunch was yours. No waiter. No menu. No tip.

  It was called an Automat. Two men, Joe Horn and Frank Hardart, had seen the idea in Germany, and they opened their first one here, in nineteen hundred and two.

  It caught on. At their peak, they had nearly two hundred restaurants, here and in New York, feeding hundreds of thousands of people a day. And the thing people loved most was the coffee. It cost one nickel. And if a pot had been sitting for twenty minutes, they threw it out and made a fresh one.

  Then, after the Second World War, costs went up. In nineteen fifty, the company doubled the price of coffee. From five cents to ten.

  People stopped coming. One New York newspaper called it a black day for coffee drinkers. The last Automat closed in nineteen ninety one.

  Look along the street again. One nickel, one door, one cup.

  Then two nickels, and it was over.
