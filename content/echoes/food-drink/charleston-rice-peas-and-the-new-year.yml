teaser: "Rice, peas and bacon. The most Charleston plate there is."
script: |
  Look above the door of this hall, at the carved Irish harp. Inside, on the first day of every year, the members sat down to a plate of something very plain.

  Rice. Black eyed peas. A little bacon. Hoppin' John.

  The Hibernian Society was founded in eighteen o one by eight Irishmen who had just arrived in South Carolina. This hall was built for them in eighteen forty. It even has a stone in it from the Giant's Causeway in Ireland.

  In eighteen sixty, this building was full of cots. The national Democratic convention met in Charleston, and the delegates who backed Stephen Douglas made it their headquarters. The party could not agree on slavery. It split, and Abraham Lincoln won that November.

  But the dinner that lasted was the quiet one. In nineteen forty one, the state guide listed the society's New Year's Day dinner, and the dish at the centre of it. Rice and peas and bacon, it said, as dear to Charlestonians as porridge to the Scot.

  Look up at the harp again.

  Irish founders. A Lowcountry plate. Every New Year.
detail: >-
  The 1941 Federal Writers' Project guide records the Hibernian Society's founding on 17 March 1801 by eight Irishmen, its New Year's Day dinner with Hop-in-John as a traditional dish, and the porridge comparison; it also lists hop-in-John among Low Country rice dishes. The National Park Service page gives the 1840 hall, the Douglas headquarters with hundreds of cots in 1860, the split of the Democratic party, the harp and the Giant's Causeway stone. Whether the dinner continues today is not in these sources, so the script ties it to 1941.
