teaser: "Imagine needing pizza explained to you."
script: |
  Look along Mott Street. Restaurants, bakeries, signs in red, white and green. Now try to imagine a New Yorker who had never heard of pizza.

  In nineteen thirty nine, the city's official guidebook assumed you were one.

  It sent its readers to the pushcarts on this street, between Canal and Broome. The last of a market that once filled the four streets west of the Bowery. The carts sold ripe and green olives, artichokes, goats' cheeses, and sweet fennel.

  And something the guide had to stop and explain.

  Ready to eat pizza, it said. An unsweetened pastry, filled with tomatoes and cheese, meat, or fish.

  An unsweetened pastry.

  Somewhere on this block, a slice is coming out of an oven right now.

  Nobody here needs it explained any more.

