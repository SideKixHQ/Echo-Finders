teaser: "There is a parking garage under your feet. It used to be the other way round."
script: |
  Look around Ellis Square. For more than fifty years, there was no square here at all. There was a parking garage.

  Before the garage, this was the City Market, where farmers sold their crops straight to the people. A city guide in the nineteen thirties remembered how it felt to come here as a child. The horse car did not just bring you to the market. It went right inside, so you could almost shop from the window.

  A woman named Pink sat beside her stall, shelling butterbeans into a big flat basket. She always had a Morning, Honey, and a wide smile for her favourites. There were benne seed and coconut patties, and paper thin wafers, cooked in old irons with long handles. Silver fish beside pink shrimp, and chickens and ducks and turkeys, squawking.

  Then, in nineteen fifty four, the market came down, for parking. The loss was what made Savannah start fighting for its old buildings. Half a century later, the city knocked the garage down, and gave the square back. The cars are still here. They are underneath you.

  Stand still for a moment.

  Somewhere under your feet is a parking space where Pink used to say, Morning, Honey.
detail: >-
  The 1937 guide describes the City Market as still in use and remembers the horse car and the woman called Pink, in the language of its day. Where exactly her stall stood is not recorded; the closing line places it in the square, not at a spot.
