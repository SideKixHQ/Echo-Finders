teaser: "Crack one open. It probably did not come from China."
script: |
  Stand at the gate of the Japanese Tea Garden. Somewhere in here, the story goes, the fortune cookie began.

  Not in China. A reporter who wrote a whole book about Chinese food in America found out at thirteen that fortune cookies were not Chinese. People think of them as Chinese, she says, but they are fundamentally American.

  This garden began as a Japanese village, built for a world's fair in this park in eighteen ninety four. When the fair was over, the park hired a Japanese gardener named Makoto Hagiwara to run it.

  He and his family devoted themselves to it. They even brought over plants from his ancestral home in Osaka.

  Several sources credit Hagiwara with introducing the fortune cookie, around the turn of the century. Others trace the idea back to Japan. Nobody has settled it.

  His family looked after this garden from eighteen ninety four until nineteen forty two.

  Next time you crack one open, think of this gate.
detail: >-
  The National Register nomination for the de Sabla Teahouse and Garden (San Mateo) gives the Japanese village at the 1894 California Midwinter Fair in Golden Gate Park, small portions of which survive as the Japanese Tea Garden, Makoto Hagiwara (spelled Makota) hired after the fair by John McLaren and the park commissioners to run the concession, and the family's dedication to the garden from 1894 to 1942, including plants from his ancestral home in Osaka. CBS San Francisco credits Hagiwara with introducing the fortune cookie in the late 1890s to early 1900s, citing "multiple sources". NPR (2008) carries Jennifer 8. Lee's account of learning at 13 that fortune cookies were not Chinese, and her line that they are fundamentally American; an NPR blog the same year reports a New York Times article tracing the cookie to Japan. The script does not say why the family's tenure ended in 1942; the reason (the wartime removal of Japanese Americans) is widely known but is not stated in the fetched sources, and a reviewer may want a source before saying it aloud. "A world's fair" stands for the California Midwinter International Exposition; a reviewer may prefer "a fair".
