certaintyNote: >-
  Who made the first fortune cookie is disputed. CBS San Francisco says "multiple sources" credit Makoto Hagiwara of this garden, in the late 1890s to early 1900s. NPR reports a New York Times account that traces the cookie to Japan, and the reporter Jennifer 8. Lee on fortune cookies being American rather than Chinese. Other claimants, including a Los Angeles baker, are not in the fetched sources and are not named. The script says the question is open.
