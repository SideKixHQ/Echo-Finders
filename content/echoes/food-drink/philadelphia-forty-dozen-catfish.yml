teaser: "Two shillings for a hundred catfish."
script: |
  Look at the river here, by the bridge. This was the Falls of Schuylkill. The Lenape name for the river meant the noisy stream, because of its falls and ripples. And it was full of catfish.

  An old fisherman named Godfrey Shrunk told the writer John Watson that with a dip net, here by the Falls, he could catch three thousand catfish in a single night. He sold them for two shillings a hundred.

  Before the Revolution, a club of Welshmen built a clubhouse on a high rock on this bank. They called it Fort St. David's. They went to war, they said, on the Schuylkill's blue catfish. Shrunk caught fish for them, and the club would cook forty dozen catfish at a time. In seventeen seventy four, John Adams rode out here with friends to see it.

  Then came the war. Hessian soldiers carried off the clubhouse walls to build their huts. It was never used again.

  The catfish kept on. Taverns grew up along the river road, and families drove out from the city to eat catfish and drink coffee by the water. One, Mendenhall's, was famous for it.

  But the river was changing, with dams and works across it. The great fishing at the Falls, Watson wrote, was ruined.

  Look at the water again. Even the creek that runs in just upstream got its name from them. Wissahickon.

  Catfish creek.
