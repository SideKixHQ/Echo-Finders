teaser: "Three dozen limes, by air, for one birthday."
script: |
  Hold a slice of Key lime pie in your hand, if you have it. Listen to this while you eat it.

  In August nineteen forty nine, the Key West Citizen ran a small item on its front page. An order had come in that morning for three dozen Key limes, to be sent by air express to Cincinnati, Ohio.

  The woman who ordered them had visited Key West, and fallen in love with the lime pie. Now she wanted to bake one for her mother's seventy second birthday.

  The paper said Key lime pie might some day replace the birthday cake.

  Six years later, a letter came to the paper from Oklahoma City. A couple had been introduced to Key lime pie on holiday here. Back home, she wrote, they could not find it in a restaurant, or even a recipe close to it. Could the paper send one, as it is baked in Key West? She had enclosed a stamped envelope.

  The columnist passed the plea on, to a chef, or to any housewife who turned out a really good one.

  Some recipes travel in cookbooks. This one travelled by air mail, and by pleading letter.
detail: >-
  From the Key West Citizen: 18 August 1949, page 1 ("Lime Pie Will Replace Birthday Cake": three dozen Key limes air expressed to a former visitor in Cincinnati for her mother's 72nd birthday pie) and 14 September 1955, page 3 (a column printing a letter from Oklahoma City asking for the recipe "as it is baked in Key West", with a self addressed stamped envelope, and the columnist's appeal to a chef or "any housewife"). The private people named in the papers are not named in the script. Neither article says where the pie came from or how it was made; the echo is about how far its reputation travelled, not its origin, which is disputed.
