teaser: "Porgy in the summertime, and whiting in the spring."
script: |
  Stand still on King Street a moment, and listen. In nineteen ten, a Charleston writer named Harriette Leiding set out to write down the songs this city's streets were full of. The cries of the people selling fish and shrimp and vegetables, from door to door.

  One voice, she wrote, outshone all the others.

  His name was Joe Cole. He did a thriving business on lower King Street, under a sign that read Joe Cole and Wife. He walked with a limp, and he used his walking stick like a conductor's baton. And he sang out his fish.

  Old Joe Cole, good old soul. Porgy in the summertime, and whiting in the spring. Don't be late, I'm waiting at the gate. Don't be mad, here's your shad.

  When she asked him to sing it into her megaphone, so she could set it down properly, a crowd gathered round. Joe sent them all away. She had asked him to sing for her book, he told them, and nobody else. And sure enough, she wrote him down.

  Up the street came Little John, singing his peas for Hoppin' John, and his cabbage, and his yellow turnips. Even the chimney sweeps sang, from the tops of the chimneys. Thirty years later, a state guide was still hearing the shrimp man in the morning. Ro ro swimp, come and get your ro ro swimp.

  Listen to King Street now.

  In a book at the Library of Congress, Joe Cole is still waiting at the gate.
detail: >-
  Leiding's 1910 book renders the vendors' speech in dialect spelling and uses the demeaning language of its time, including slurs in the passage about Joe Cole; the script quotes only his cry and paraphrases the rest. The surviving copy, digitised by the Internet Archive, is the Library of Congress copy. The 1941 state guide records the shrimp cry "Ro-ro swimp".
