certaintyNote: >-
  Peychaud's pharmacy, his bitters and the Sazerac's official status are documented. The story that cocktail comes from coquetier is a tradition the 1938 city guide itself reports as hearsay, and the cocktail historian Ted Haigh disputes the idea that Peychaud made the first cocktail. The script says both out loud.
