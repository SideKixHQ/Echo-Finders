tags: [new-orleans, new-orleans-core, french-quarter, royal-street, cocktails, sazerac]
teaser: "Say coquetier three times, fast."
script: |
  Look at the old building here on Royal Street, number four thirty seven. There is a story that the word cocktail was born in it.

  It was a drugstore. The apothecary was Antoine Peychaud, who had come from Santo Domingo. He made bitters from a secret recipe. At night he mixed them with brandy and served them to gentlemen.

  The story goes that he served it in an egg cup. In French, an egg cup is a coquetier. And when English speakers tried to say coquetier, the story says, it came out cocktail.

  It is a lovely story. Ted Haigh, a curator at the Museum of the American Cocktail, had one objection. Peychaud would have been three years old when the first one was made.

  The bitters, though, are real, and still carry his name. When Louisiana's legislature made the Sazerac the official cocktail of New Orleans, it was Peychaud's bitters that made it a Sazerac.

  Look at the doorway again.

  The word was older than he was. The bitters were his.
detail: >-
  The 1938 New Orleans City Guide places Peychaud's drugstore at 437 Royal Street and attributes the coquetier story to Stanley Arthur's Old New Orleans. Accounts of when Peychaud arrived and when he opened his pharmacy differ.
