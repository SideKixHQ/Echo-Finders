teaser: "Every Fourth of July, they tell you the contest began in 1916. One of the men who started it says they made it up."
script: |
  Look at the long counter, the signs, the crowd. It has been selling hot dogs on this corner for more than a hundred years.

  And for decades, it has been telling a story that is not true.

  First, the true part. In nineteen sixteen, a Polish immigrant named Nathan Handwerker opened a hot dog stand here, with three hundred dollars borrowed from two friends. His family says he arrived with no English, and just enough money to get through Ellis Island.

  He sold his hot dogs for five cents. When the Depression came, his family says, you could feed a family of four here for under fifty cents. The sidewalk was lined with people pushing in to the counter.

  Now the other part. Every Fourth of July, the famous eating contest here is told as a tradition that began in nineteen sixteen. Immigrants on this boardwalk, the story goes, eating hot dogs to prove who was the most American.

  It never happened.

  The contest began in nineteen seventy two. Publicity men made up the old story to get Nathan's into the newspapers. One of them later admitted it. In Coney Island pitchman style, he said, we made it up.

  In the early years, a former company president said, they would wait for a couple of big guys to walk by, and ask if they wanted to be in a contest.

  So order a hot dog. That part is real.

  The legend is just the mustard.

