teaser: "Fifty-six years before Plymouth, there was a thanksgiving dinner here. It was probably stew."
script: |
  Look for the great cross by the water. It marks the place where the Spanish came ashore and founded St. Augustine, on the eighth of September, 1565.

  The first thing they did was hold a Mass of thanksgiving. Then came dinner. Pedro Menéndez laid out a meal, and invited the people who already lived here, the Seloy.

  So what was on the table?

  Nobody wrote down the menu. But from what the five Spanish ships were carrying, historians can make a good guess. Cocido. A stew of salted pork and garbanzo beans, with plenty of garlic. Hard sea biscuits. Red wine.

  If the Seloy brought food of their own, there may have been turkey, venison, gopher tortoise, mullet, corn, beans and squash.

  That was fifty-six years before the Pilgrims sat down at Plymouth.

  It never became the national holiday. The British won the continent, and their harvest festival won the calendar.

  But in the first permanent European settlement in North America, the first thanksgiving dinner was probably pork and chickpea stew.
