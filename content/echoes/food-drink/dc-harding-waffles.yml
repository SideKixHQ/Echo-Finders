teaser: "Where the water wheel turns, people once sat on a porch and ordered waffles."
script: |
  Look at the water wheel on the side of this stone mill. For most of the eighteen hundreds, it ground corn, wheat and rye for the farms around here.

  Then in eighteen ninety seven, the main shaft broke. The government decided the mill was not worth fixing. And the old mill found a new trade.

  In nineteen oh five, a porch was built out where the water wheel had been, and the mill became a tea house. A road crossed the creek just here, and the park was new.

  The French ambassador walked here from town. His wife drove out to meet him.

  In nineteen twenty, the concession went to a woman named Hattie Sewell. The Park Service records her as a woman of colour, and says her business was a success. Neighbours of the park complained anyway, and so did the trustees of the old Peirce estate. Her contract was not renewed.

  The Girl Scouts took over. Their speciality was Harding waffles, named for the new President.

  The tea house closed in the nineteen thirties, and the wheel came back.

  Listen for the water. Hattie Sewell made this place pay.

  Nobody let her keep it.
detail: >-
  All from the Park Service's history of the mill, except the ambassador's walk, which the Park Service quotes from a 1915 newspaper on its Jusserand page. The script does not guess at the grounds of the complaints against Hattie L. Sewell; the Park Service says only that "park neighbors and Peirce-Shoemaker estate trustees complained". The mill was restored and grinding again by 1936.
