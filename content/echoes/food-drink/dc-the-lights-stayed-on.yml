teaser: "Apart from Thanksgiving and Christmas, it has opened every day since 1958."
script: |
  Look at the narrow storefront of Ben's Chili Bowl. Apart from Thanksgiving and Christmas, it has opened every single day since nineteen fifty eight. Even the week this street was on fire.

  Ben Ali came here from Trinidad to become a doctor. Virginia worked at a bank at Eleventh and U. He kept coming in. On his third visit, three days in a row, he wrote her a little note. Please call me. They married in nineteen fifty eight, the same year they opened this place, in an old silent movie house. Duke Ellington and Sarah Vaughan came in after their shows.

  On the fourth of April, nineteen sixty eight, someone ran in to say that Martin Luther King had been shot. Virginia remembered it. The tears were everywhere. Everybody's crying. Then the sadness turned to anger, and the uprising began.

  For four days, the blocks around here burned. The city put on a curfew. But the activist Stokely Carmichael asked for the Chili Bowl to stay open past it, and keep feeding people. The city said yes. So the police came in to eat. And the firemen. And the activists. Everybody felt safe in here.

  Many businesses on this street never reopened after those four days. Ben's never closed.

  Look at the lights in the window.

  They stayed on.
detail: >-
  CBS News reported in 2026 that the original restaurant was closing temporarily for renovation; check on the ground whether it has reopened before relying on the opening line about every day.
