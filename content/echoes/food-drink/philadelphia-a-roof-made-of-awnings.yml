teaser: "Nobody built a roof. The shops built one together."
script: |
  Look up, along Ninth Street, at the awnings. Some plain, some in bold stripes and colours. One after another, shop after shop, they make a roof over the sidewalk. Nobody built that roof. It grew.

  At the end of the eighteen hundreds, Italian families began arriving in South Philadelphia in large numbers. The row houses on this street had been home to Irish, German and Jewish families. The newcomers made them shops. The store went downstairs. The family, and the boarders, went up.

  In nineteen fifteen, the street's businessmen made a deal with the state of Pennsylvania. They would keep Ninth Street clean. They would light it, pave it, and pay for police. In return, they could sell from the curb. Pushcarts, wagons and stands, all along the gutter.

  It was a market built for hard times. During the First World War, people were afraid of food running short and prices running high. This street was the answer. Fresh food, cheap, and close.

  By the nineteen forties, everyone called it the Italian Market. Then the families moved out to the suburbs, and new people moved in. In nineteen eighty three, the first Korean owned shop opened on Ninth Street. Then came Vietnamese, Chinese and Mexican families.

  Look at the awnings again. Each one was hung by a different family, in a different year.

  The roof is still being built.
