teaser: "Five million orders. Not one recipe given away."
script: |
  Look at the long front of Antoine's, here on St. Louis Street. A young French immigrant named Antoine Alciatore opened it in eighteen forty, and his family still runs it.

  There is a dish in there that restaurants all over the world have tried to copy. The kitchen here says none of them get it right.

  Oysters Rockefeller. Oysters in the shell, under a rich, buttery sauce full of greens. It was created here, in the late eighteen hundreds. The sauce was so rich that they named it for the richest man in America, Rockefeller.

  The head chef, Michael Regua, put it plainly. We don't give the recipe away. There are only three cooks here who know how to do it.

  The restaurant reckons it has served around five million orders. So every recipe for Oysters Rockefeller you have ever seen is somebody's guess. One newspaper, printing its own version, admitted there is much dispute about the details of the original.

  Look at the doors. Somewhere behind them are the three cooks.

  Five million orders. Not one recipe.
detail: >-
  Antoine's was founded in 1840 by Antoine Alciatore. The National Register and other accounts date the creation of Oysters Rockefeller to 1899, during the time of his son Jules; the sources quoted here say the late 1800s.
