script: |
  Look at the building on Navigation Boulevard. Before it was a famous restaurant, it was a tortilla factory. And it was failing.

  The restaurant was a last resort.

  Ninfa Rodriguez grew up in the Rio Grande Valley. She married Tommy Laurenzo, a Rhode Island man of Italian descent, and in nineteen forty nine they started a company in this building. Tortillas, and pizza dough. Her heritage, and his.

  In nineteen sixty nine, Tommy died suddenly. She was a widow with five children, and the business was losing money.

  The banks in Houston turned her down for a loan. She borrowed from a friend in Mexico instead. In the summer of nineteen seventy three, she turned the front of the factory into a little restaurant. Ten tables. Her daughter waited on them the first day.

  On the menu was beef, char grilled and folded into soft flour tortillas. Tacos al carbon. The world would come to call them fajitas.

  When we opened this restaurant, her daughter said, it was out of desperation. We were in survival mode.

  Within a few years there were a dozen Ninfa's, and more. Movie stars came, and a future president. Then the chain grew too fast, and the family lost it.

  Look at the front of the building again.

  She didn't invent it, her daughter said. But nobody had it on the menu until the restaurant.

