teaser: "She came back to your table, again and again, with extra food."
script: |
  Look at the name over this restaurant. Sylvia's.

  Sylvia Woods opened it on the first of August, nineteen sixty two, with her husband, Herbert. They were both from South Carolina. They had known each other since they were children.

  Fried chicken. Collard greens. Cornbread. Ribs. The cooking of the South, on Lenox Avenue.

  It became more than a restaurant. One minister called it a meeting place for Black America. Politicians kept coming, especially when they were running for something.

  But mostly, people remember her, at the tables. A congressman said everyone she met was the most important guest in her dining room. She kept coming back to your table, smiling, bringing extra food.

  A neighbor remembered how she would scold the customers. You eat too fast, she'd say. You got to slow down.

  In July, two thousand twelve, the mayor was due to celebrate her legacy. She died that same day. She was eighty six.

  Her granddaughter said the restaurant was where Sylvia could show her hospitality. And there was a saying that went with it.

  Look in through the window.

  If you come alone, you're never going to dine alone.

