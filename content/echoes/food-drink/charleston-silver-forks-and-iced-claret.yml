tags: [charleston, charleston-core, broad-street, food, inns, free-people-of-colour, eliza-lee]
teaser: "The finest table in town, kept by free Black innkeepers."
script: |
  Look along Broad Street, at the old fronts of the buildings. Before Charleston had a single hotel, a visitor with money looked for an inn. And the best two in town were kept by free Black families.

  The first was Jones's. A traveller named Hamilton called it the best inn of the place. Silver forks, he wrote. Clean tablecloths and all the luxuries of the table. And iced claret, good enough to turn a philosopher into a gourmet.

  The second was Eliza Lee's, here on Broad Street, in the house later called the Mansion House.

  The men ran the front of the house. But it was their wives who were the excellent cooks. The kitchens belonged to the women.

  And there is a harder fact in the same account. The attentive servants who waited at those tables were enslaved, and the innkeepers themselves owned them.

  Look along the street again. Free people, in a slave city, keeping the best table in town.

  It was never simple.
detail: >-
  Ravenel (1906), Social Topics chapter: inns admirably kept by free coloured people; Jones's described by the traveller Hamilton as the best inn of the place, with silver forks, clean tablecloths, all the luxuries of the table and iced claret "to convert Diogenes into a gourmet"; Eliza Lee's, later the Mansion House on Broad Street; both wives excellent cooks; and their well-managed servants "owned by themselves". Ravenel's account carries the prejudices of 1906, which the script does not repeat. Where Jones's stood is not given in this source, so the script places only Eliza Lee's on Broad Street.
