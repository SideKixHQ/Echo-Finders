teaser: "One restaurant on this basin has run on the honor system for more than thirty years."
script: |
  Somewhere along this basin is a restaurant that runs on trust.

  Grab whatever you like, the owner tells his guests, with a wave at a self serve cooler of cold drinks. Pay when you're done.

  It is not a gimmick. The place is Provision Company, Pro Co to the locals, and it opened in 1993 in a weathered waterfront building that had once been a wholesale fish house.

  The founder had come here from the British Virgin Islands in the early nineties. The honor system grew out of a simple belief. If you give people the chance to be honest, they will be honest.

  The thing to order, since the first day, has been Thee Special, with steamed shrimp, a crab cake and corn. The covered deck looks out over the Old Yacht Basin.

  More than thirty years on, people are still settling up on their way out.
