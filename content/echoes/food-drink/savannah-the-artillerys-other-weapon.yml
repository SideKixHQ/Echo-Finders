teaser: "Two of its weapons came from Yorktown. The third came by the glass."
script: |
  Find the two small brass cannon called the Washington Guns. They belong to the Chatham Artillery, and the company has always said George Washington gave them, soon after his visit to Savannah. By the company's account, they had been British guns, surrendered by Lord Cornwallis at Yorktown. When the Confederates left Savannah, the company buried them under its armory, and dug them up again afterwards.

  But the Chatham Artillery is famous for another weapon. You drink it.

  In November, nineteen oh nine, President Taft was on his way to Savannah, and the newspapers warned him. He would be urged to have a bout with the famous Chatham Artillery Punch. It took a week to brew. Presidents, statesmen, governors and naval officers had all attacked it, the paper said, and all of them had been beaten. Admiral Dewey had chased a salad with it, and blamed his troubles on the salad.

  The recipe was a secret. There was always one man in the Chatham Artillery who carried it in his head. That year, the keeper of the secret was a lieutenant named Papy.

  Three years later, the governor of Georgia came back from a Savannah banquet and complained that the punch had not been served. He suspected, he said, that it had been put on the shelf with the other high explosives. Savannah took it as a slander.

  Look at the guns again.

  Two of its weapons came from Yorktown. The third came by the glass.
detail: >-
  The 1898 Age-Herald gives the company's account of the guns (it misprints the year of Washington's visit as 1771); the 1885 Savannah Morning News also says they were presented by Washington; the 1937 guide calls it tradition. The 1909 report names the keeper of the recipe as Lieut. Mariana (probably Mariano) Papy. Where the guns are displayed today is not confirmed by these sources.
