teaser: "A grocer's name that locals found easier to say."
script: |
  Look at the grocery at 32 North Lumina Avenue. Its name is older than the building.

  Roberts traces its roots to Roberts Grocery in Wrightsville Beach in 1919. One magazine calls the
  origin story near-mythical, and it goes like this. On his doctor's advice, a Lebanese immigrant
  named Charles S. Robier moved here from New York City and opened a grocery. Because locals
  couldn't pronounce his last name, he called it Roberts.

  After damage from Hurricane Hazel in 1954, the store moved to a smaller location across the street.

  Its chicken salad later became a staple of supermarket deli coolers across the state. The name that
  traveled with it was the easy version a grocer picked for his neighbors.
