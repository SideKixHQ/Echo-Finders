teaser: "The name on the front belongs to a man who did not build it."
script: |
  Face the building on the corner, with the portico and a man's name on the front. W. B. Hodgson Hall.

  William Hodgson did not build it. His widow Margaret and her sister Mary Telfair built it in his memory, in eighteen seventy six, for the Georgia Historical Society.

  The Society had been collecting since eighteen thirty nine. Books, papers, anything touching the history of Georgia. By eighteen ninety it had about twenty thousand volumes.

  A guidebook of the time admitted the outside was plain. It was built for the convenience of a library. The inside was the part worth seeing.

  Then, in eighteen ninety three, the Society lent its books and this building to the city, so that Savannah could have a public library. The Society kept on collecting.

  A husband's name on the front. His widow's money in the walls. And for a while, the books inside belonged to everyone.
