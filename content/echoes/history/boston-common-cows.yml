teaser: "Look at the grass around you. For about two hundred years, this was a pasture."
script: |
  Look at the grass around you. For about two hundred years, this was a pasture.

  The town bought the land in sixteen thirty-four, and families grazed their cattle here.
  There were rules about it. Each family could only put so many cows on the Common, so the
  grass would not run out.

  On hot days the cows sheltered under a huge old elm. The ground around it was swampy then.

  In the winter of seventeen seventy-five, the Common was taken over by something else.
  British soldiers dug artillery positions into it, and a garrison of about seventeen
  hundred men camped here.

  In March they sailed away.

  The cows stayed. They kept grazing this ground for another fifty-four years, until the
  city banned them in eighteen thirty. The pasture fences came down six years after that.

  The British army held the Common for one winter. The cows held it for two centuries.
