teaser: "He arrived the way a lot of cargo did. By shipwreck."
script: |
  Find the brick warehouse at the corner of Wall Street and Exchange Street. It was one of the earliest brick buildings on the island.

  Wall Street is named for the man who founded the company, William Wall.

  He was an Englishman. And in eighteen twenty four he came to Key West for a very Key West reason. He was shipwrecked.

  He stayed. And he made his fortune dealing in salvaged goods.

  He pioneered cigar making here too, owned an early printing office, and held shares in the local salt company. He was the first man on the island to make a substantial fortune.

  He left before the Civil War, and died in New York in eighteen sixty six. This warehouse went up after him, in eighteen seventy nine. And it carried on the trade. It stored cargoes auctioned off by order of the federal admiralty court.

  A shipwreck brought him here. Other people's shipwrecks made him rich.
detail: >-
  From the Historic American Buildings Survey record of the Wall and Company Warehouse (HABS FL-175): one of the earliest brick buildings on the island, built 1879 with work in 1886; Wall Street named for the company's founder, William H. Wall, an Englishman who came to Key West in 1824 after being shipwrecked and made a fortune dealing in salvaged goods; his cigar making, printing office, salt company shares and real estate; the first to make a substantial fortune; left before the Civil War, died in New York in 1866; the building used as a storehouse for cargoes auctioned by order of the federal admiralty. "Court" is added to "federal admiralty" for the ear. "Other people's shipwrecks" is the inference that salvaged goods came from wrecked ships.
