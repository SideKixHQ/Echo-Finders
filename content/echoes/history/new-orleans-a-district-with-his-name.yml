teaser: "The name outlasted almost every building."
script: |
  Look across Basin Street, away from the French Quarter.

  For twenty years, the blocks over there were a legal red-light district. It operated openly from eighteen ninety-seven.

  The newspapers called it Storyville, and explained the name. The district had been set up by an ordinance, and the man behind the ordinance was named Story.

  Music was a sideline here, but a real one. Bands worked the dance halls and cabarets. Pete Lala's. The hundred and one Ranch. The Tuxedo Dance Hall. The Big Twenty-Five. A young pianist named Jelly Roll Morton started out playing in this neighborhood.

  Jazz was not born here, whatever the legend says. The National Park Service is firm about that. But Storyville put the new music in front of people who might never have heard it otherwise.

  It ended at midnight on the twelfth of November, nineteen seventeen. Everything closed at the stroke of twelve, at the request of the Navy Department. One wire report said more than a third of the district's two thousand women had already left the city.

  In the nineteen-forties nearly every building over there was torn down for public housing.

  The name has outlasted almost all of them.
detail: |
  The National Park Service says only six original Storyville structures and remnants
  survive, among them Frank Early's Saloon. The Tango Belt, another early jazz district,
  lay just across Basin and North Rampart streets in the French Quarter.
