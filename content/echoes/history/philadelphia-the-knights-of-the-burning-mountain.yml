teaser: "Knights on horseback, ladies in turbans, and a war going badly."
script: |
  Look at this square block, between Washington Avenue and Federal Street. In May of seventeen seventy eight, there were knights on horseback here.

  The British army held Philadelphia. And they were losing the war. Their general, Sir William Howe, was going home. So his officers threw him a party.

  It was called the Mischianza. They rowed down the river in a parade of boats, with bands playing. They marched up here to a country house called Walnut Grove, through two triumphal arches. Then came a tournament. Two teams of knights, in silk. The Knights of the Blended Rose. And the Knights of the Burning Mountain, whose motto was, I burn for ever. Each knight fought for a young Philadelphia lady, dressed in a Turkish gown and a turban. One of the knights was a captain named John Andre.

  They broke their lances. They fired pistols at each other, and missed. They feasted, and danced until four in the morning.

  But at about ten that night, an American captain named Allen McLane crept up to the British lines north of the city, and set them on fire. Guns boomed across Philadelphia. The ladies asked what it was. Their knights told them, it was all part of the party.

  One of the ladies on the list was Peggy Shippen. The next spring, she married Benedict Arnold. Two years later, Andre was caught with papers in his boot, for Arnold's plot to hand West Point to the British. He was hanged as a spy.

  Look across this block again. A tournament, while the lines burned.

  I burn for ever.
