teaser: "Look at the meeting house. Somebody had to pay for it, and somebody had to build it."
script: |
  You are in Smith Court. Look at the meeting house. It opened in eighteen-oh-six, and it is
  the oldest Black church building still standing in the United States.

  Look at it as a building first. Somebody had to pay for it, and somebody had to build it.

  The African Baptist Church was founded the year before, with twenty-four members. Fifteen
  of them were women. To give it a home, a man named Cato Gardner, born in Africa, went out
  and raised fifteen hundred dollars himself. Black craftsmen did most of the work.

  Then the building did its job. It was a church, and a school met on the first floor.
  Frederick Douglass spoke here. So did Maria Stewart. In eighteen thirty-two, William Lloyd
  Garrison founded the New England Anti-Slavery Society inside.

  People called it the Black Faneuil Hall.

  It was meant as a compliment. But Faneuil Hall was the gift of one rich merchant, a man who
  bought and sold enslaved people. This hall was paid for and built by the people who sat in
  it.
