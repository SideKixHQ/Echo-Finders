teaser: "Three in the morning, a borrowed straw hat, and the signal for Fort Sumter."
script: |
  Look out at the water. The boats to Fort Sumter leave from this wharf, and the harbour runs from here down to the open sea.

  At three in the morning on the thirteenth of May, eighteen sixty two, a Confederate steamer called the Planter began to move away from a Charleston wharf. Her three white officers were ashore for the night. That was against standing orders, and it happened often.

  The men left aboard were enslaved. One of them was a pilot in his early twenties named Robert Smalls.

  They fired the boilers and steamed up the Cooper River to another wharf, where their wives and children were waiting aboard another boat. Sixteen people in all. Then they turned for the sea.

  Smalls put on the captain's coat and straw hat. He knew the signals. He was the pilot. At about a quarter past four the Planter came up to Fort Sumter, with Fort Moultrie across the channel. Smalls gave the signal. The fort let them pass.

  It was not over. As they reached the Union fleet, a warship took them for an attacker and readied its guns. The crew ran a bedsheet up the mast.

  The wharves they left from are gone, and nobody can point to the exact spot now. The water they crossed is in front of you.

  Robert Smalls went on to serve five terms in Congress. That night, all of it hung on a sheet.
