teaser: "Stand on Constitution Avenue at Sixth Street and look at the gallery in front of you."
script: |
  Stand on Constitution Avenue at Sixth Street and look at the gallery in front of you.

  A railroad station stood here once, the Baltimore and Potomac depot. This avenue was
  called B Street then.

  At about half past nine on the morning of the second of July, 1881, President James
  Garfield came here to catch a train north. He was walking through the ladies' waiting
  room, arm in arm with his Secretary of State, when a man named Charles Guiteau shot him
  twice.

  The doctors probed for one of the bullets and could not find it. The country waited on
  every bulletin from his doctors. He lived for eighty days. Poor medical treatment led to
  his death on the nineteenth of September.

  He was a faithful diarist. The entry for the first of July, the day before the shooting,
  was the last he ever wrote.

  The station is gone. In 1939, as this gallery was going up, a Washington columnist noted
  that part of the enormous building would cover the site, and that very few visitors
  would ever remember.

  Somewhere under the building in front of you, there was a waiting room.
