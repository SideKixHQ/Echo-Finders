teaser: "Look across at the house on the corner."
script: |
  Look across at the big house on the corner of Royal Street.

  On the morning of the tenth of April, eighteen thirty-four, flames broke out of it. The fire had started in the kitchen.

  It was started on purpose. A woman held captive in this house told the mayor afterwards that she had set it herself. It was, she said, the only way left to end what she and the others were suffering. The English writer Harriet Martineau, who heard the story in this city a few years later, says it was the cook, kept chained within a few yards of the kitchen fire.

  Neighbours and firemen ran in. They forced open doors that had always been kept locked, and behind them they found seven people in chains, starved, covered in wounds. The editor of the city newspaper, the Bee, was there. He wrote that he saw where the collars and manacles had cut into their flesh.

  They were carried through the streets to the mayor's office, and their irons were struck off. At least two thousand people came to see them that day.

  The woman who held them, Madame Lalaurie, never answered for it. She left in her carriage, reached the lake, and escaped by boat to Mobile and then to France. A crowd tore her house apart.

  Neither of the old accounts gives the name of the woman who lit that fire.

  What was being done in this house came out because she set it on fire.
