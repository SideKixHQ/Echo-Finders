teaser: "Look down at the landing, just below the top flight of steps."
script: |
  Look down at the landing, just below the top flight of steps.

  One stone here is engraved. It marks where Martin Luther King Junior stood on the
  twenty-eighth of August, 1963.

  It was late afternoon. More than a quarter of a million people were out there. Many of
  them had come a long way by bus and by train, and they had already sat through a long
  list of speakers.

  King had a prepared text. A promissory note. A bad check, come back marked insufficient
  funds.

  He was near the end of it, telling people to go home and keep up the fight, when a voice
  called out from just off to the side. It was his friend, the gospel singer Mahalia
  Jackson.

  Tell them about the dream, Martin.

  What came next was not on the page. He improvised it.

  Stand on the landing and look out the way he did, down the length of the water toward
  the Washington Monument.

  The part of that speech everyone can still recite is the part he had not planned to say.
