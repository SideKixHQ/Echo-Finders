teaser: "Look for the rust in the brick. A general promised this wall would hold."
script: |
  Look at the southeast wall of the fort, across the moat. The brick is not one colour. There are patches, newer brick set into old. In the nineteen thirties, a guidebook writer saw rusty cannon balls still bedded in those patches.

  A wall seven and a half feet thick should not look like that.

  In November eighteen sixty one, a Confederate general came out to this fort. His name was Robert E. Lee. Thirty years earlier, as a young engineer fresh from West Point, he had worked on this island. He looked across the water to Tybee and told the commander,

  Colonel, they will make it pretty warm for you here with shells, but they cannot breach your walls at that distance.

  At that range, he was right. No gun in the world could do it.

  Then Union soldiers dragged new rifled cannon across Tybee at night, whispering, hiding the batteries under brush before dawn. On the tenth of April, eighteen sixty two, they opened fire. By noon the next day, this corner was open, and the shells were reaching for the powder magazine. After thirty hours, the fort surrendered.

  Every brick fort like it, anywhere, was finished that afternoon.

  Look at the patches again.

  That is what the future looked like when it arrived.
detail: >-
  The NPS Tybee page and the HABS report both give thirty hours. Lee's words are quoted on the NPS rifled cannon page without a date; the NPS Tybee page dates Lee's order to withdraw from Tybee to December 1861, and the HABS report says he revisited the fort in that period. The 1937 guide describes cannon balls embedded in the patched walls; whether any are still visible today should be checked on site before the script says more than "in the nineteen thirties".
