teaser: "Two of Charlotte's biggest gold mines were dug near this corner, on the same vein."
script: |
  Somewhere under this part of town runs a vein of gold, two to six feet thick.

  Two of the biggest gold mines in Charlotte were dug near this corner. They were called Rudisill and Saint Catherine.

  They sat about twenty-five hundred feet apart, at opposite ends of the same vein.

  Saint Catherine went down four hundred and sixty feet. Rudisill went down three hundred and fifty.

  The first gold in Charlotte had been struck in 1825, by Samuel McComb, near what is now Morehead and Graham Streets.

  In 1830, foreign investors leased these two mines, a count among them, and brought in steam engines and stamp mills.

  Their money helped persuade the federal government to build a branch mint in Charlotte.

  The tunnels did not go away when the mining stopped. At one point mines honeycombed this whole area, some running under what is now the football stadium and the bank's tower uptown.

  Rudisill was still being worked again in the 1930s.

  The banks came later. The gold was down there first.
