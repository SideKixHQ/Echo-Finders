teaser: "For decades this congregation only met in summer. Then the war changed the island."
script: |
  Look at the church on the corner of West Fayetteville Street and North Lumina Avenue.

  Little Chapel began in 1907 as a summer mission at the Lumina, a joint venture of two downtown
  Wilmington churches, First Presbyterian and St. James Episcopal. For its first few decades, it
  welcomed preachers for the summer season only.

  Then the war came. Wrightsville Beach grew from two hundred and fifty-two residents in 1941 to
  fifteen hundred in 1945, and after the war it became more of a year-round community.

  A summer church now needed a winter. In 1952 the congregation opened its sanctuary here, on this
  corner.
