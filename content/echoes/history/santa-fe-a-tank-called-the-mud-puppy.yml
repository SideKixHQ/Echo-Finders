teaser: "The old trail hotel on this corner was knocked down by a small tank, one war bond at a time."
script: |
  Look at La Fonda, on the corner of the plaza. There has been an inn of some kind on this corner for a very long time, possibly since the 1600s.

  In the days of the Santa Fe Trail, the traders came off the plains and in here. To rest, and to gamble on billiards and on monte, the favorite local card game. Fights could turn ugly. Gun violence was common.

  By 1851 it was the Exchange Hotel, the most noted hostelry between Denver and the City of Mexico. Billy the Kid, Kit Carson and Buffalo Bill Cody all came through. So did two future presidents, Hayes and Grant.

  Then in 1880 the railroad arrived. Newer hotels followed, and the old Exchange could not keep up.

  Its end, in 1919, was unusual. It was a First World War victory bond rally. For every hundred dollar bond bought, a small tank called the Mud Puppy knocked down another piece of the old adobe walls.

  When the rally was over, the Exchange was little more than a pile of rubble.

  The hotel you are looking at was finished on the same corner in 1922. It is still the only hotel on the plaza.
