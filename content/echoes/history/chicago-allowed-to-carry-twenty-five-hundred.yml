teaser: "The Eastland never left the river. It rolled over at its dock."
script: |
  Look at the river here, by the Clark Street bridge. It is narrow, and it is calm. This is where more than eight hundred people died, and the ship never left the dock.

  In July 1915, the steamer Eastland was loading employees of the Western Electric Company and their families, heading for a company picnic in Michigan City, Indiana.

  A little after seven thirty in the morning, just as she moved away from her pier at Clark Street, the Eastland toppled over. She capsized at her dock in the Chicago River. Women and children by the hundreds were caught below decks.

  That same day, a seamen's union official showed a Chicago paper his copy of the ship's record. It allowed her one hundred and forty-three passengers, all year round. In the excursion season, six hundred and fifty-three, if she kept within five miles of land. And two thousand, if she stayed in water not deep enough to submerge her.

  That morning, a federal inspector said, she was allowed to carry twenty-five hundred.

  Why more in summer? Because, the inspector explained, in the warm time of the year, people with life preservers on will stay in the water a long time. Sometimes two or three days.

  She never got farther than this.
