teaser: "Upstairs in this building is a room of old books in a slightly strange order."
script: |
  Look at the building behind the fountain. Upstairs, on the second floor, is a room of old
  books arranged in a slightly strange order.

  In 1814 the British burned the Capitol, and with it the library of Congress. About three
  thousand books.

  Thomas Jefferson, at Monticello, owned the largest private collection of books in the
  country. He offered to sell it, at whatever price Congress chose.

  There were sharp debates. Some members complained that too many of the books were in
  foreign languages, or about subjects that had nothing to do with Congress. Jefferson had
  already answered that. There was, he wrote, no subject to which a member of Congress may
  not have occasion to refer.

  Congress bought them. Six thousand four hundred and eighty-seven volumes, for twenty-three
  thousand nine hundred and fifty dollars.

  The price was not worked out by title, or by rarity. It was based on measurements of the
  size of the books.

  On Christmas Eve 1851, another fire in the Capitol destroyed nearly two thirds of them.
  The room upstairs is the library rebuilt the way Jefferson arranged it, around some two
  thousand survivors.

  The largest library in the world grew out of one man's bookshelves, priced by size.
