teaser: "Inside an iron fence in the cemetery, a sailor holds an oar and looks into the distance."
script: |
  Find the iron fence near the Margaret Street entrance. In the middle stands a sailor, gazing into the distance and holding an oar.

  On the fifteenth of February, 1898, the battleship Maine blew up in Havana Harbor. It was the most dramatic of the incidents that led to the Spanish American War.

  Inside this fence are tombs of the victims. Union veterans and the citizens of Key West put up the memorial that same year.

  Look at the gates. Capstans. Anchors. Crossed sabres. An eagle on a shield. Even the cement walks are inlaid with anchors and stars, painted blue.

  And the sailor in the middle, still gazing into the distance, as if waiting for a ship.
