teaser: "In 1899 the state's newspaper editors met here. One of them had a complaint."
script: |
  In July 1899, the newspaper editors of North Carolina held their convention right here.

  By most accounts they had a fine time. The accommodations, one admitted, were not what they
  expected. The place was crowded to overflowing. They loved the surf anyway.

  But one editor went home with a grievance. A dance had been held in the association's honor,
  and he objected. He believed very few editors in the state cared a thrip for dancing.

  His real worry was the ministers among them. They did not believe in dancing, he wrote, and
  should be spared the humiliation of seeing their names printed beside the words music,
  dancing and refreshments.

  Nobody recorded whether the ministers danced.
