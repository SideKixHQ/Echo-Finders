tags: [jerome, fire, 1898, mining, old-west]
teaser: "In 1898 fire swept up this gulch so fast that even the stone buildings went down like cardboard."
script: |
  Look down along the gulch this part of town sits in. In 1898, the business district filled it. Wooden buildings and stone ones, packed in close.

  On the morning of the eleventh of September, at about twenty past seven, a fire started. One paper said nobody knew how. The wire reports said it was a gasoline stove, in a cabin. A good breeze from the north did the rest.

  The fire raced through the narrow gulch and the ravines leading into it. The stone buildings, one report said, melted before the flames as rapidly as pasteboard.

  By the end, not a single business house remained. More than a hundred and fifty homes were gone, and the stores, and the saloons. The only building to escape was the Methodist church.

  How many died? Nobody could agree. One Arizona paper said three. The wire said eleven bodies had been found, and a score or more were missing. The real number was lost in the smoke.

  What saved the town's future was a strip of open ground, between the burned district and the great works of the United Verde company. The company's plant survived. The town would be built again around it.
