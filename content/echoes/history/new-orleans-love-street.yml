tags: [new-orleans, new-orleans-core, marigny, street-names, creole]
teaser: "This stretch of Rampart was called Love Street."
script: |
  Look at the street sign. It says Rampart.

  Back on the old town side of Esplanade, that name makes sense. The city's defenses ran along that line. But this stretch was laid out many years after the city was founded, when the owner of a plantation here cut his land into streets and lots. He named this street himself.

  He called it Rue d'Amour. Love Street.

  His name was Bernard de Marigny, and he named the whole neighborhood like a poet. Poet Street. Good Children Street. Piety. Desire. And Craps.

  Craps is where the stories split. Grace King, writing about the old Creole families in nineteen twenty-one, said he named it after a game he was addicted to. A guidebook from nineteen hundred and four says the street got the name because boys played the game there. Neither gives a source. Take your pick.

  Marigny meant to build a Creole city that would outshine the American one. It never came. One story says a sale of the whole faubourg fell apart in a notary's office, because his wife did not come to sign.

  Later the city tidied up its map. Love Street became part of Rampart. Good Children became St. Claude. Moreau became Chartres.

  The pretty names, King wrote, are all that survive of his scheme. Even some of those were taken off the signs.
detail: |
  The 1900 and 1904 Picayune guides
  credit the naming of Love Street to "Mandeville de Marigny"; Bernard de Marigny de
  Mandeville is the same man. The 1904 guide notes that older residents still called this
  stretch Love Street after the city council made it part of Rampart.
