certaintyNote: >-
  The street names and their later renaming are documented in the 1900 and 1904
  Picayune guides and Grace King's Creole Families of New Orleans (1921). Why one street
  was called Craps is disputed: King says Marigny named it for a game he was addicted to,
  the 1904 guide says boys playing the game there gave the street its name, and neither
  cites a source. The failed sale of the faubourg is King's retelling of an American
  narrator's account, and the script hedges it.
