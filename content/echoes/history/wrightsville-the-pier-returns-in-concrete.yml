teaser: "Two hurricanes took the wooden pier. What came back was built for two hundred mile an hour winds."
script: |
  Look at the pier's concrete pilings.

  This pier began in the 1930s as the Atlantic View Pier. In 1939 it was sold to Johnnie Mercer, who
  renamed it after himself. He was not the famous songwriter.

  It was wooden, and the storms kept coming. It was rebuilt after Hurricane Hazel in 1954. In 1996,
  Hurricanes Bertha and Fran devastated it.

  Work on a concrete pier began in 1999, and it reopened in 2001, the first concrete pier on the North
  Carolina coast. It reaches twelve hundred feet over the Atlantic, built to withstand winds of up to
  two hundred miles an hour.

  On the right side before the T, one piling has its date etched into the concrete, and how many feet
  it goes down into the sand.
