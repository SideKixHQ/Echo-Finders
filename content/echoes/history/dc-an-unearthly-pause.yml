script: |
  Stand at this busy corner, and look at the building on the southwest side. In January nineteen twenty two, this was the Knickerbocker, a movie theater.

  That week brought the heaviest snowstorm Washington has ever recorded. Twenty eight inches. And on the Saturday night, the twenty eighth, people still came out through the snow to see a picture.

  Around nine o'clock, there was a break between reels. The orchestra was playing. People were filing in and out of their seats.

  Then, the next morning's Evening Star reported, came a hiss.

  The flat roof, loaded with snow, split down the middle. It fell onto the balcony, and the balcony fell onto the people below. And then, the paper said, a stillness. An unearthly pause. Then the screaming.

  Soldiers, marines, police and firemen dug all night in the snow. Nearly a hundred people died.

  Look at the corner again. There is no theater now.

  The record snowfall still stands.
detail: >-
  Told without injuries. The Evening Star of 29 January 1922 reported the hiss, the roof parting "in the middle under the weight of many inches of snow", and "A stillness, an unearthly pause". The script says nearly a hundred, as the National Weather Service does; the final count usually given is ninety eight, and early reports were lower. National Weather Service lists the storm, at twenty eight inches, as Washington's biggest official snowstorm. Later Evening Star reports cover the investigations into the roof trusses; the script does not assign blame.
