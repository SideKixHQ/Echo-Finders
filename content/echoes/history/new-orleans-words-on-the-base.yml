teaser: "Find the line cut into the granite base. It was not there on the day the statue was unveiled."
script: |
  Walk to the statue's granite base and find the line cut into it. The Union must and shall be preserved.

  Now look up at the man on the horse. Andrew Jackson, who defended this city against the British in eighteen fifteen.

  The statue was unveiled here on the ninth of February, eighteen fifty-six. The square was packed with soldiers, families and children. People crowded the balconies of the red brick buildings on either side. When the sculptor, Clark Mills, pulled the white cover away, a salute of a hundred guns went off.

  The words on the base were not there that day.

  Six years later, Louisiana had left the Union, and a Union fleet came up the river and took New Orleans. The general sent to govern the city was Benjamin Butler. Much of the city came to hate him.

  Butler had that sentence cut deep into the granite under Jackson's horse. His admiring biographer said it was the motto the base had been meant to carry all along.

  So the city's own hero, in the middle of the city's own square, was made to say the one thing the city least wanted to hear, in the voice of the army that had taken it.

  Nobody ever chiselled it off.
