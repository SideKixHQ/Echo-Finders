teaser: "On the Fourth of July, 1888, the crowd lined this street to watch a race."
script: |
  Look along this street and picture both sides of it packed with people.

  On the Fourth of July, 1888, Deadwood held a hub and hub race.

  Two small teams of runners pulled a hose and wagon down the main street as fast as they could.

  Both teams were Chinese. The photographer's caption says they were the only two Chinese hose teams in the United States.

  The winners posed afterwards, twelve men in uniform.

  The caption calls them the champion Chinese Hose Team of America.

  The pictures were made by John Grabill.

  On the Fourth of July in Deadwood, the champions of America were Chinese.
