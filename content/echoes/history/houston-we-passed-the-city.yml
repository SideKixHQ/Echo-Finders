teaser: "The first boatload of people looking for Houston rowed right past it."
script: |
  Look down at the water from the top of this bank. Just upstream, a smaller bayou, White Oak, runs into this one.

  The first people who came looking for Houston went straight past it.

  In the summer of eighteen thirty six, two brothers, Augustus and John Allen, bought the land beside these two bayous. They named it the town of Houston, and their advertisements called it the great commercial emporium of Texas. John Allen told the Texas Congress it was one of the most healthy places in the lower country. The bayou, he promised, is navigable at all times.

  At the end of that year, a young merchant named Francis Lubbock sailed for Houston on a steamer called the Laura, with his groceries below deck.

  No steamboat had ever come this far. Fallen trees blocked the bayou. The passengers went ashore, made winches out of tree trunks, and hauled the snags out of the way. Twelve miles of bayou took them three days.

  Near the end, Lubbock and a few others got tired of the steamer and rowed ahead in a small boat to find the city.

  So little evidence could we see of a landing, he wrote, that we passed by the site and run into White Oak Bayou.

  They backed down, and found a road laid off from the water's edge. On shore were stakes and footprints.

  This, about the first of January, eighteen thirty seven, was Houston.

  Look at the bank again. Stakes, footprints, and an advertisement.

  It was enough.

