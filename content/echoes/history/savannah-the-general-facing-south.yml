teaser: "Look up at the man in bronze, then look at which way he is facing."
script: |
  Stand on the south side of the square and look up at the man in bronze.

  He is young. Full uniform, a hand resting on his sword hilt. When the statue was unveiled in November nineteen ten, the newspapers made a point of it. Most old prints showed James Oglethorpe as an old man. The sculptor, Daniel Chester French, gave the city a soldier instead.

  Now look at which way he is facing.

  When the figure was hoisted onto its pedestal, a few weeks before the unveiling, the Atlanta paper noted one detail. The figure faces south.

  South, in Oglethorpe's day, was the problem. The land below Savannah was claimed by both Britain and Spain, and Georgia was meant, in part, as a military buffer against Spanish Florida. Oglethorpe built a fort town on St. Simons Island. In seventeen forty he besieged St. Augustine for thirty-eight days, and failed. Two years later he turned back a Spanish invasion of Georgia.

  The papers of nineteen ten did not say whether that was the point of the pose.

  He sailed for England in seventeen forty-three and never came back. He is buried at Cranham, on the edge of London.

  He is still watching the southern road.
