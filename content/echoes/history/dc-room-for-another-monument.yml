teaser: "There is room in Lincoln park for another monument, Douglass wrote."
script: |
  Look at the bronze Lincoln at this end of the park, one hand held out over a kneeling man. Now turn, and look all the way down the park. At the far end, another statue is looking straight back at this one. That is not an accident.

  The morning after Lincoln was killed, a woman named Charlotte Scott gave five dollars toward a monument to him. She had been enslaved in Virginia. It was the first money she had ever earned as a free woman. Black Americans gave the rest, many of them as newly free as she was. But they did not choose the design. A committee of white abolitionists did.

  In April, eighteen seventy six, Frederick Douglass stood here to dedicate it, before the President, the Cabinet and the justices of the Supreme Court. Five days later, he wrote to a newspaper. The man in the statue, he wrote, though rising, is still on his knees. What I want to see before I die is a monument representing the negro, not couchant on his knees like a four footed animal, but erect on his feet like a man. There is room in Lincoln park for another monument.

  He did not live to see it.

  In nineteen seventy four, the National Council of Negro Women put up the statue at the far end, of their founder, Mary McLeod Bethune, the daughter of enslaved parents. She was the first African American, and the first American woman, to be given a statue on public land in this city. And the old statue was turned around, to face her.

  Look down the park at her.

  She is on her feet.
