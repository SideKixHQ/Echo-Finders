teaser: "Look at the two street signs on this corner."
script: |
  Look at the street signs on this corner. Bourbon. And Dumaine.

  On this street of all streets, people tend to assume the name has something to do with what is in their glass.

  It doesn't.

  When French engineers laid out this town in the seventeen-twenties, they drew a grid of streets and gave them names from the very top of French society. George Washington Cable, writing in eighteen eighty-four, listed who was being honoured. The dukes of Orleans, Chartres, Maine and Bourbon. The princes of Conti and Condé. The Count of Toulouse.

  So the grid around you is a kind of family tree of the French court. Orleans Street. Chartres Street. Conti. Toulouse. And Bourbon, for the Duke of Bourbon.

  Now look at the other sign again. Dumaine. Say it slowly. Du Maine. On the old French plans of the city, it is written Rue du Maine. The street of the Duke of Maine.

  A city guide from nineteen-oh-four put it simply. All through the old French Quarter, it said, the street names suggest the city's royal descent.

  The duke is still up there on the sign.

  Everything else on Bourbon Street came later.
