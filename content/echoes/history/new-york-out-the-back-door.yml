teaser: "The mob broke in at the front just as the children went out at the back."
script: |
  Look along this block of Fifth Avenue, from Forty Third Street to Forty Fourth. Shop fronts. Office windows. People hurrying past.

  In the summer of eighteen sixty three, this whole block was an orphanage. Four stories high, with room for five hundred children. It was the Colored Orphan Asylum. A home for Black children.

  On the afternoon of the thirteenth of July, a mob of about three thousand people attacked it. The city was rioting against the draft for the Civil War. And the mob had decided that Black people were to blame for the war. Even orphans.

  Inside were more than two hundred children, from babies to twelve year olds.

  The superintendent, William Davis, fastened the doors. While the mob broke them in, the staff gathered the children, carried some in their arms, and led them out at the back.

  Just as the mob came in at the front.

  The rioters took everything, even the children's dresses and trinkets. Then they set the building on fire. The fire chief tried to talk them down, and was knocked to the ground twice. In an hour and a half, only a little of the walls was left.

  That evening, Davis led two hundred and sixteen children into a police station. Not one of them was over twelve. Except the clothes they wore, nothing had been saved for them.

  Look along the block again.

  The building burned. The children walked out.

