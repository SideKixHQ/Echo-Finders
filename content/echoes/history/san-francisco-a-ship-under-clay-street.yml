teaser: "There is a ship under this corner. She never sank."
script: |
  Stand at the corner of Clay and Sansome, and look down at the pavement. There is a ship under it.

  Her name was the Niantic. In July, eighteen forty nine, she sailed into the cove that was here, packed with men on their way to the gold fields.

  Most of her crew deserted too. The captain let the last five men go, and with no crew, the Niantic was stuck.

  So she was hauled ashore and put to use. A store. A warehouse. A hotel.

  The town filled in the water around her with mud, sand and debris. By eighteen fifty, the Niantic was more than three blocks from the sea.

  In eighteen fifty one, a great fire burned her down to the waterline. What was left made good foundations, and the buildings put up on top of her carried her name.

  In nineteen seventy eight, builders dug here and uncovered a large part of the ship. Her stern and rudder went to the Maritime Museum.

  The rest of her is still down there.

  Nobody moved the ship. They moved the sea.
detail: >-
  All from the National Park Service page on the Niantic (San Francisco Maritime National Historical Park): arrival in Yerba Buena Cove on 5 July 1849 with gold seekers, the crew deserting and the last five men discharged on 11 July, the ship hauled ashore as building material, warehouse and hotel, the water lots filled with mud, sand and debris, more than three blocks from the sea by 1850, burned to the waterline in the fire of May 1851, the Niantic Hotel, Block and Building on the site, the 1978 excavation, the stern and rudder in the Maritime Museum, and the remains beneath the corner of Clay and Sansome. The last line is a turn, not a claim: the shoreline moved as the cove was filled.
