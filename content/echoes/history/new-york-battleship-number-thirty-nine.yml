teaser: "He was there when they started building her. He was president when she went down."
script: |
  Look through the gates, into the Navy Yard. Long sheds, cranes, the river beyond. Somewhere behind those walls, in nineteen fourteen, they started building a battleship. She did not have a name yet. On the plans she was just Battleship Number Thirty Nine.

  There is a photograph from that year. A young man is striding through the yard, inspecting the work. He is the Assistant Secretary of the Navy.

  His name is Franklin Roosevelt.

  They laid her keel here in March, nineteen fourteen. She was finished in June, nineteen fifteen. And she was given a name.

  Arizona.

  Twenty seven years went by. The young man from the photograph became President of the United States.

  And on a quiet Sunday morning in December, nineteen forty one, at Pearl Harbor, a heavy armor piercing shell, dropped from the air, went through the Arizona's deck and into her ammunition. She sank in less than nine minutes, with one thousand one hundred and seventy seven of her crew.

  The President called it a date which will live in infamy.

  She is still on the bottom of Pearl Harbor. Oil still rises from her, a drop at a time.

  It started here, with a keel, and a young man walking past it.

