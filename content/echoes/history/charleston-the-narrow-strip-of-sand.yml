# Drafted by Claude Code (2026-11-10) for the second Charleston batch, following docs/writing-echoes.md (format v2).
# Listening spot: The end of East Ashley Avenue at the entrance to the Lighthouse Inlet Heritage Preserve, Folly Beach, facing northeast toward Morris Island.
# Position: East Ashley Avenue's end at the preserve, from general knowledge (low to medium confidence; moved onto land after the land check put the first guess in the sea). Fort Wagner stood at the far, northern end of Morris Island and is now largely lost to the sea; it cannot be visited.
