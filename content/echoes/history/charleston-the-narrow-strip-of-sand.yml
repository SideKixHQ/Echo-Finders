teaser: "Six hundred and fifty men, one flag, and a strip of sand with no cover at all."
script: |
  Look northeast, across the inlet, to Morris Island. Far up at its northern end, there was once a fort. Fort Wagner. The sea has taken most of it now.

  In July eighteen sixty three, the way to it was a strip of sand so narrow that only one regiment could attack at a time. There was no cover at all.

  On the eighteenth of July, the regiment chosen to lead was the fifty fourth Massachusetts. An all Black volunteer regiment. They had been in their first fight only two days before.

  They moved forward under shell and solid shot, until they were about three hundred yards from the walls. Then the fort opened fire. One of them wrote afterwards, it went into our ranks, over our ranks, and through our ranks.

  They climbed the wall anyway, and fought hand to hand. They could not hold it. Of the six hundred and fifty men of the regiment there, more than two hundred and seventy were killed, wounded, captured or missing.

  When the colour bearer fell, a soldier named William Carney took the flag. He was wounded, and he kept it safe until the end.

  Look across at the island. The fort lost. The regiment did not.

  By the end of the war, more than a hundred and eighty thousand Black men had enlisted.
detail: >-
  The National Park Service articles give the narrow approach, the 18 July assault led by the 54th, its first combat two days earlier, the description quoted from the Salem Register of 3 August 1863, more than 270 casualties among the 650 men of the 54th who took part, Carney's Medal of Honor for saving the flag, and the figure of more than 180,000 African Americans enlisted. The script paraphrases the soldier's words and keeps his phrase "into our ranks, over our ranks, and through our ranks" exact.
