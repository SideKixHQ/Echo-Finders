teaser: "Look at the arched windows along this wall. Part of it is older than the fire."
script: |
  You are standing beside the side wall of the Cabildo. Look at the row of arched windows along the ground floor.

  Keep them in mind.

  On Good Friday in seventeen eighty-eight, candles were burning in the private chapel of the colony's military treasurer, a block up Chartres Street from here, near St. Louis Street. The story is that one fell against the lace on the altar.

  The fire went from house to house.

  A correspondent for a European newspaper reported something else. He said the priests would not allow the alarm to be rung, because on Good Friday every bell must be silent.

  By the end, eight hundred and fifty-six houses were gone. The church. The town hall. The guardhouse that stood right here.

  A few years later, another fire took much of what had been rebuilt.

  So here is the thing about the French Quarter. Much of the old city you walk through was built after those fires, while Spain ruled it. A New Orleans writer in the eighteen nineties put it plainly. An ill-built French town went into the ashes. A stately Spanish city came out.

  Now look again at the wall beside you. When the Cabildo went up on this spot, the builders worked what was left of the burned guardhouse walls into it. In the nineteen sixties, restorers found its remains inside these walls, and put the windows along this side back to their original plan.

  The town hall is Spanish. Part of the wall it stands on is older than the fire.
