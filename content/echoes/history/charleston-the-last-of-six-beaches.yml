tags: [charleston, james-island, sol-legare, mosquito-beach, segregation, civil-rights, gullah]
teaser: "No sand to speak of. And for years, the only place to go."
script: |
  Look along this little strip of buildings, out over the marsh. It does not look much like a beach. But for years, this was one of the only beaches a Black family near Charleston could go to.

  By nineteen sixty, there were six of them in Charleston County. Six so called black beaches, while the rest of the coast filled up with visitors who could go anywhere.

  The families of Sol Legare Island owned their own land here. They lived on seafood and on the vegetables they grew and sold. On the island, they ran their own lives. The moment they left it, their rights shrank.

  So they built a place to gather, with businesses of their own. Workers came here at the end of the day. Under segregation, it became something more. A beacon for the whole coastal community.

  The other five beaches are gone. Storms took some. Neglect and development took the rest.

  In twenty nineteen, this strip went on the National Register of Historic Places.

  Look along it again.

  Of six, this is the one that stayed.
detail: >-
  From the National Park Service listing of the Mosquito Beach Historic District (National Register, 2019, reference 100004409): Sol Legare families' land ownership and economy of seafood and truck farming, the six black beaches in Charleston County in 1960, and Mosquito Beach as the last surviving example. The full nomination could not be opened from this session (npgallery.nps.gov is not reachable here).
