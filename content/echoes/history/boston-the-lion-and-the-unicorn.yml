teaser: "Look up at the two corners of the roof."
script: |
  Find the end of the old brick State House with the balcony on it. Now look up, past the
  balcony, to the two corners of the roof.

  A lion on one side. A unicorn on the other. The badge of the British king.

  On the eighteenth of July, seventeen seventy six, a crowd filled the street below you to
  hear a document read aloud from that balcony. It was the Declaration of Independence, and
  Boston was hearing it for the first time.

  Six years earlier, soldiers had fired into a crowd on this same spot. This time the guns
  went off in celebration.

  Then the crowd turned to the roof.

  The lion and the unicorn came down. They were carried a little way down the street,
  heaped up with every other royal emblem that could be found in town, and burned in a
  bonfire outside a tavern.

  For about a hundred years, those corners stayed bare. Then the building was restored, and
  new figures went back up.

  So the pair you are looking at never heard the Declaration. The ones that did are ash.

  Boston burned the king's animals to make a point. A century later, it put them back to
  make another.
