teaser: "Some of the carving on this church is not stone. But the real story here is about water."
script: |
  The stuccoed church on this corner, with the pointed windows, is the French Huguenot
  Church. Look closely at the decoration. Some of what looks like carved stone is iron.

  But the story here is about time, and water.

  The Huguenots were French Protestants who flocked to Carolina in the sixteen-eighties. Many of the families who worshipped here lived on plantations outside the town. So on Sundays they came to service by boat.

  A boat on these rivers moves when the tide lets it. Leave at the wrong hour and you row
  against it the whole way.

  The French took their complaints to the Lords Proprietors, the men who ran the colony, and in sixteen ninety-three an answer came back. It came with a list of protections. Their land would not be taken from their children because they were aliens. Their marriages would be recognised. And they were not to be
  made to begin their worship at an hour inconvenient to the tide.

  The Park Service says services here were timed to the tides, for the families arriving by
  boat from the plantations.

  The church that stood here in seventeen ninety-six was blown up on purpose, to stop a fire
  spreading through the neighbourhood. This one went up in the eighteen-forties. Today the congregation is French Calvinist, the only congregation of its kind in the country.

  The river is a few streets east of you, still rising and falling twice a day. Somewhere in
  a colonial record there is a promise that Sunday would wait for it.
