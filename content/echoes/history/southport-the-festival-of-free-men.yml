teaser: "This town has thrown a Fourth of July party since the 1790s. One year the fireworks went off all at once."
script: |
  Picture this street lined with people on the Fourth of July. This town has been throwing that party for more than two hundred years.

  It began in the 1790s, and back then it was called the Festival of Free Men. Ships in the harbor fired their cannons at daybreak, and on through the day, toasting the young nation.

  By 1795 the old fort by the river had been patched up enough for the town to meet there, for its first documented Fourth of July.

  During the Civil War, the party shrank to a thirteen gun salute.

  By 1925 there was a greased pole with a purse on top, swimming contests and a greased pig run. In 1964 a parade arrived, and thousands came downtown to watch it.

  In the 1970s somebody organized a shrimp boat race. The boats were slow and kept blowing their engines, and the race was dropped after three years.

  The worst night was in 1973. The fireworks were on a barge in the river, and they all went off at once. Volunteers jumped overboard, some of them unable to swim. Everyone survived.

  Since then, the fireworks have stayed in the sky.
