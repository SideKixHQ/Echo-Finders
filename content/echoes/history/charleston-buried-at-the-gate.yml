teaser: "A Seminole leader, buried far from Florida, at the door of the fort that held him."
script: |
  Find the grave just outside the gate of the fort. The name on it does not belong to South Carolina. It belongs to Florida.

  Osceola was a Seminole warrior. In the eighteen thirties the United States Army was trying to force his people out of Florida and west of the Mississippi. He fought back, and the army could not beat him in the field.

  So in October eighteen thirty seven, near St. Augustine, he was seized while he was negotiating under a white flag of truce. People across the country were angry at how it was done.

  He was already sick. Osceola and two hundred and thirty seven of his people were shipped here, to Fort Moultrie, as prisoners.

  That winter the painter George Catlin came to the fort, and painted him in his full Seminole dress. Ostrich plumes. A turban. A gorget at his throat.

  He died on the evening of the thirtieth of January, eighteen thirty eight, with his two wives and his children around him.

  Look at the grave again, and at the walls and the guns around it. He lies at the gate of the fort that held him.

  His name means black drink singer.
detail: >-
  The National Park Service gives the capture under a flag of truce in October 1837, the transfer of Osceola and 237 of his people from Fort Marion to Fort Moultrie, Catlin's portrait, and his death on 30 January 1838. The meaning of his name, black drink singer, refers to a purification drink brewed from yaupon holly, per the same page.
