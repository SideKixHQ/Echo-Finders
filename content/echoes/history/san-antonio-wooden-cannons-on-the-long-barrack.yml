teaser: "The building of the Alamo's last stand spent decades as a store dressed up as a castle."
script: |
  Look at the long stone building beside the church. This is the Long Barrack, the oldest building at the Alamo. It was first a two-story convent for the mission's priests.

  In 1836 it was the site of the defenders' final stand against Santa Anna's army. After a thirteen-day siege, Mexican troops killed all of the roughly one hundred and eighty-nine defenders.

  Forty-one years later, in 1877, the convent was sold to a San Antonio merchant, Honore Grenet, for nineteen thousand dollars.

  He built a wooden two-story gallery across the front, and gave it a medieval look. A crenellated top. Three octagonal wooden towers. Gun ports, and wooden cannons.

  After he died, a wholesale grocery firm bought it and used the old convent as a storehouse.

  It was not until 1912 that the governor had the wooden front stripped away.

  The place where the Alamo's defenders made their last stand spent decades pretending to be a castle, guarded by cannons made of wood.
