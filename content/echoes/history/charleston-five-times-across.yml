teaser: "Look up at the white steeple of St. Michael's. The bells up there have been around."
script: |
  Look up at the white steeple of St. Michael's. The bells hang up there. If they are
  ringing, listen.

  A Charleston historian, writing in nineteen-oh-six, counted how many times those bells
  had crossed the Atlantic. She made it five.

  The first crossing was the obvious one. They were made in England, and imported in
  seventeen sixty-four.

  The second came at the end of the Revolution. In seventeen eighty-two the British army
  was getting ready to leave Charleston, and an artillery officer claimed the bells as his
  own, a perquisite of his rank. He had them taken down. The church appealed, and an order
  came from New York to give them back. Too late. They were already on a ship to England.

  The third crossing was a business deal. A merchant who had once lived in Charleston bought
  them in England, as a speculation, and shipped them back to sell to the church. When they
  arrived, people ran down to the wharf, hauled them to the church themselves, and swung
  them back up into the steeple. Then the merchant died suddenly, his estate went bankrupt,
  and nobody ever asked for payment.

  The fourth and fifth came with the Civil War. The bells were sent inland to Columbia for
  safekeeping, and in eighteen sixty-five Columbia burned. They broke in the fire. The
  pieces were gathered up and sent back to the same English foundry that had made them.
  The foundry still had the original moulds. The bells were recast, and came home.

  By that historian's account, they ring today with the same tone they rang for the
  birthday of King George.
