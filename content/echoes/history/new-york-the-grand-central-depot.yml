teaser: "A minister held a slave auction in church. Every bid set someone free."
script: |
  Look at this plain brick church on a quiet Brooklyn street. No spire. No grand front. You could walk straight past it.

  An early historian of the church gave it a name you would not expect. The Grand Central Depot of the Underground Railroad.

  In eighteen forty seven, the people who gathered here called a minister named Henry Ward Beecher. Harriet Beecher Stowe, who would write Uncle Tom's Cabin, sat in this congregation in its early years.

  The church gave money to the committee that brought people escaping slavery north, and some of them were delivered here. A guide who leads tours of the church says Beecher hid people in its basement.

  And sometimes, the congregation did something stranger. They bought people their freedom.

  When they did, Beecher would sometimes stage a mock slave auction. He made his congregation watch a human being offered for sale, in a church in Brooklyn.

  He wanted them to feel the horror of it.

  And then they paid. And the person they had bid for walked out free.

  Look at the church again.

  Inside it, people bid on a human being, so that nobody could ever own them again.

