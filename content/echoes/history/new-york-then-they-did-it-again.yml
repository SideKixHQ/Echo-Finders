teaser: "They charged the house, fell back over their own wounded, and charged again."
script: |
  Look at the old stone farmhouse in front of you, with its thick walls and small windows. On the twenty seventh of August, seventeen seventy six, the house that stood here was full of British soldiers, firing from the windows.

  And a few hundred Americans were about to run straight at it.

  That morning, the British had marched around behind the American army in Brooklyn. Men were being surrounded. The only way out was across a marsh about eighty yards wide, called Gowanus Creek, under fire, to the lines on Brooklyn Heights.

  Someone had to hold the British back while they crossed.

  A general called Lord Stirling stayed behind with about four hundred men, most of them from Maryland, some from Delaware. Two thousand British and Hessian soldiers closed in around them. Then Stirling and his men did something nobody expected. They charged the stone house, with bayonets.

  The survivors remembered musket balls coming at them in almost solid sheets of lead. They fell back, over their own dead and wounded. They formed up again. They charged a second time.

  Then they did it a third time.

  The fighting here lasted almost an hour. Long enough. Much of the army got across the marsh.

  Two hundred and fifty six of those men died around this house. Only a few dozen made it back.

  Look at the windows again.

  They ran at them three times, so that other men could run the other way.

