tags: [san-francisco, lands-end, world-war-ii, military, navy, guadalcanal]
teaser: "The holes in this steel were made in one night, on the other side of the Pacific."
script: |
  Walk around this steel structure and look for two large holes punched clean through it.

  This is part of the bridge of the cruiser San Francisco. The command center of the ship.

  In 1942, during the Battle of Guadalcanal, she took forty-five hits and twenty-five fires.

  It was a gun battle at night, with the two fleets mixed up together. Veterans described it as a bar-room brawl.

  These two openings are hits the Navy numbered eight and nine. Five-inch shells, thought to be from a Japanese destroyer, maybe from a single volley.

  The holes themselves were not the worst of it. It was the fragments that flew inward when the shells burst.

  The admiral of the task force, Daniel Callaghan, was up here with his staff. So was the ship's captain, Cassin Young, who had been in command for a week, maybe two. Neither of them survived.

  Their names are on the plaque for those who did not come home. The steel next to it is still the shape that night left it.
