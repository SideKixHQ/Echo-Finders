teaser: "In 1939 the people who cracked the city's pecans marched on this building, and won."
script: |
  Look at the doors of City Hall. In 1939, around twelve thousand pecan shellers marched here, to demand higher wages and better working conditions.

  They were led by Emma Tenayuca. The protest and strike won them higher wages, and recognition of their union.

  It also pushed many of the pecan companies to buy machines. And many of the people who marched here lost their jobs to them.

  A victory at this building, and a harder lesson after it.
