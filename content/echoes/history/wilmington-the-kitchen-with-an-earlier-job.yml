script: |
  A kitchen can look like a modest supporting building. Here, it carries part of the
  property's first life.

  The museum identifies the detached kitchen as the former jailer's quarters. When the
  site became a residence, the small structure gained a new domestic role.

  That reuse matters. Wilmington's early buildings were working resources, not untouched
  monuments. Owners adapted what already existed, and the resulting place kept traces of
  several purposes.

  If you are on an authorized tour, let the scale of the kitchen pull your attention away
  from the grander house. Food preparation required heat, repeated tasks, and labor that a
  polished dining room could conceal. The building connects those ordinary demands with an
  even earlier responsibility: watching over the people confined on this corner.
