tags: [washington, dc-core, lafayette-square, white-house, protest, concepcion-picciotto]
teaser: "The rule was that somebody had to be in it, every minute."
script: |
  Stand here, at the edge of the park, facing the White House across the avenue. For more than forty years, there was a small shelter on this side, covered in hand painted signs against nuclear weapons. Live by the bomb, one of them said. Die by the bomb.

  And there was a rule. To stay, it had to be occupied. Every minute. Day and night.

  A man named William Thomas started it, in nineteen eighty one. That August, a small woman from Spain named Concepcion Picciotto joined him. People called her Connie. She wore a helmet and a headscarf. From here, she watched presidents come and go. People called her the president's closest neighbour. She said she was here to stop the world from being destroyed. Fellow activists called her a heroine. Plenty of people walking past did not.

  One night in September, two thousand thirteen, the volunteer on the overnight shift walked away, at about one in the morning. By a quarter to two, the Park Police were taking it all down. Connie was seventy seven. I was never going to give up, she said. I can't. By that afternoon, it was back.

  She died in January, two thousand sixteen, at a shelter for homeless women. Volunteers kept the vigil going. In September, two thousand twenty five, after President Donald Trump ordered it removed, the Park Police took it down again.

  Look at this spot. Somebody had to be here, every minute.

  For most of those minutes, it was her.
detail: >-
  Whether anything of the vigil stands here now needs checking on the ground; it was removed in September 2025 and NBC/AP did not report its return. The script states the removal and the President's order neutrally, as reported.
