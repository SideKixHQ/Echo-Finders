teaser: "The firemen came with their engines. They did not aim them at the hall."
script: |
  Look along this side of Sixth Street, just below Race. In the spring of eighteen thirty eight, the most splendid hall in the city stood here. Lit with gas. Galleries on three sides. And over the stage, in large gold letters, three words. Virtue, Liberty, and Independence.

  It was built by people who wanted to end slavery. It lasted three days.

  It opened on the fourteenth of May. On the third night, a woman from South Carolina named Angelina Grimke stood up to speak. Slavery had been all around her as a girl. I have seen it, she said. I have seen it. Outside, a crowd was gathering. Stones hit the windows. She kept going. What is a mob, she asked. What would the breaking of every window be?

  The next evening, the managers handed the keys to the mayor. He told the crowd there would be no meeting that night. They gave three cheers for the mayor. Then they forced the doors, piled up books and window blinds on the stage, and set them alight. They turned the gas pipes toward the flames.

  The fire companies came with their engines. They sprayed the houses next door. Not one drop went on the hall.

  The next morning at eight, the abolitionists met beside the ruins, and carried on.

  Look up at the empty air over Sixth Street. For a moment, in the firelight, those gold words shone clearly.

  Then they were gone.
