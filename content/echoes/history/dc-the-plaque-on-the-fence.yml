teaser: "Find the small bronze plaque on the fence in front of Blair House."
script: |
  Find the small bronze plaque on the fence in front of Blair House.

  In the autumn of nineteen fifty, the White House was being rebuilt, and President Truman
  was living here, across the street. On the afternoon of the first of November, he was
  resting upstairs.

  Two Puerto Rican nationalists came to this house armed. One of them later admitted they
  had expected to shoot their way in. The White House police on duty shot back.

  Three officers were hit. One of them, Private Leslie Coffelt, forty years old, was shot
  twice. As he lay dying beside his post, he fired, and killed one of the attackers. The
  other was wounded and taken. The attempt on the President failed.

  The plaque was dedicated in May nineteen fifty-two, and Truman came to unveil it. He said
  it commemorated an event about which he did not like to think.

  Six years later, he walked past here with a writer from the Evening Star. He stopped and
  read the plaque. Then he pointed.

  He was in a little sentry house, Truman said, that stood right there.
