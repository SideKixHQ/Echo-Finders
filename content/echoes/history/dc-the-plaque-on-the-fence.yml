teaser: "Find the small bronze plaque on the fence in front of Blair House."
script: |
  Find the small bronze plaque on the fence in front of Blair House.

  In the autumn of nineteen fifty, the White House was being rebuilt, and President Truman
  was living here, across the street. On the afternoon of the first of November, he was
  resting upstairs.

  Two Puerto Rican nationalists came to this house armed. One of them was later quoted as
  admitting they had expected to shoot their way in. The White House police on duty shot
  back.

  Private Leslie Coffelt was forty years old. As he lay dying beside his post from two
  bullet wounds, he fired, and killed one of the attackers. Two other officers were hit,
  and recovered. The other attacker was wounded and taken. They never got through the door.

  The plaque was dedicated in May nineteen fifty-two, by Truman himself. He said it
  commemorated an event about which he did not like to think.

  Six years later, he walked past here with a writer from the Evening Star. He stopped and
  read the plaque. Then he pointed.

  He was in a little sentry house, Truman said, that stood right there.
