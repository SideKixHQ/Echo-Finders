teaser: "The town's work yards stand where engineers tried to freeze the ocean into drinking water."
script: |
  Look at the municipal buildings around you. They stand where the federal government once
  tried to turn seawater into drinking water.

  The Office of Saline Water ran its Wrightsville Beach Test Facility here. The station concentrated
  on the freezing process of desalination.

  The idea is simple. Freeze salt water, and the ice crystals come out fresher than the brine around
  them. The hard part was the crystals. A later federal report says the ones grown here were tiny,
  about one tenth the size engineers wanted, and washing the salt off them was too expensive.

  The plant closed in 1984, when funding for research ended, and the town took over the complex.

  The town's trucks now park where engineers once tried to freeze the ocean into something you could drink.
