teaser: "Look at who is in the water. In 1962, the law decided that."
script: |
  Look at the people in the water, and on the sand, all the way down the beach.

  Within living memory, most of them would not have been allowed here.

  Until nineteen sixty three, this was a beach that only white people could use. Black families from Savannah could look at the ocean on the drive out. They could not come down to this sand and walk into it.

  It did not open by itself. In the nineteen sixties, a Black teenager from Savannah named Robert Robinson helped desegregate a beach near the city. NPR reported it in a single line, years later, and did not say which beach. This was the beach Savannah drove to.

  Robinson grew up to be a civil rights attorney, and an alderman on Savannah's city council, one of the city's rising stars. In December nineteen eighty nine, a bomb mailed to his law office killed him. The man who sent it was convicted.

  Look at the water again, and at everyone in it.

  Somebody's courage made this ordinary.
detail: >-
  The Associated Press report carried by NBC News and CBS News (2024) says Tybee was "a Southern beach that only white people could use until 1963"; the two pages are one wire story and count as one source. NPR (2018) says Robinson "had helped desegregate a beach near Savannah as a teenager in the 1960s" and later became a city alderman, and that a bomb killed him "at his office in Savannah". NPR does not name the beach as Tybee; the script attributes the claim to NPR and says "a beach near Savannah". The conviction is Walter Leroy Moody's, federal, 1991 (CBS News, 2018). "This was the beach Savannah drove to" is the narrator's framing, not a claim that Robinson waded in here.
