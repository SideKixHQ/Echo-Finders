teaser: "The oldest thing on the square is easy to walk past."
script: |
  On the King Street side of this square, behind an iron fence, is a fragment of old wall. It is easy to walk past. It is the oldest thing on the square.

  In seventeen fifty nine, this was the northern edge of Charleston, and the road into town came through here. To guard it, the colony built a horn work, a great fortification designed by a German engineer named Emmanuel Hesse. It covered five acres. It mounted eighteen cannon. A wide moat ran along its north side. Parts of it were built of tabby, the old coastal building material you can see in that fragment.

  In seventeen eighty, a British army laid siege to Charleston, and the horn work was the city's main defence.

  It was not enough. Charleston surrendered, and it was the largest American surrender until the Civil War.

  Four years later, the horn work was taken down. Somebody kept this piece, and put a fence around it.
