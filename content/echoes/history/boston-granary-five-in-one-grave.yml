teaser: "Look for a stone that faces Tremont Street. It belongs to five men."
script: |
  Look for a stone that faces Tremont Street. It belongs to five men.

  On the fifth of March, seventeen seventy, British soldiers fired into a crowd on King
  Street. Three days later, Boston buried the dead.

  Witnesses said around ten thousand people followed the funeral. That was most of the town.

  The procession ended here. Samuel Gray, Samuel Maverick, James Caldwell and Crispus
  Attucks went into the same plot. A week later a fifth man, Patrick Carr, was laid in with
  them.

  Two of them, Attucks and Caldwell, were sailors with no family and no home in Boston.
  Before the funeral, their bodies lay in state at Faneuil Hall.

  Nobody in Boston was their family. That week, the whole town was.
