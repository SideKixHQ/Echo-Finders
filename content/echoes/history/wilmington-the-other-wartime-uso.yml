teaser: "The wartime welcome offered here had a boundary."
script: |
  The wartime welcome offered here had a boundary. Wilmington's USO facilities were
  segregated.

  The museum's history records a separate club on Nixon Street for African American
  service members. Today's museum includes a tribute to the Ninth and Nixon USO,
  preserving a story that this building alone cannot fully represent.

  You are at the interpretive site, not at that other club's original address. The
  distinction matters. A visitor who hears about this downtown center alone could
  mistake a single part of the wartime experience for everyone's experience.

  If the exhibit is open, pause before the tribute. Both clubs served people in uniform,
  but they were kept apart by race. Remembering the welcome requires remembering who was
  directed to a different door.
