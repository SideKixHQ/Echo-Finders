script: |
  The wartime welcome offered here had a boundary. Wilmington's USO facilities were
  segregated.

  The city's history records a separate club on Nixon Street for African American service
  members. Today's museum includes a tribute to the Ninth and Nixon USO, preserving a
  story that this building alone cannot fully represent.

  You are at the interpretive site, not at that other club's original address. The
  distinction matters. A visitor who hears only about this downtown center could mistake
  one part of the wartime experience for everyone's experience.

  If the exhibit is open, pause before the tribute. Both clubs served people preparing for
  military duty, but their separation reflected the racial restrictions of civilian
  America. Remembering the welcome requires remembering who was directed to a different
  door.
