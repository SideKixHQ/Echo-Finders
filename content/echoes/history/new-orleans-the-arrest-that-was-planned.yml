tags: [new-orleans, new-orleans-core, marigny, plessy, civil-rights, railroad]
teaser: "Everyone knew it was going to happen."
script: |
  Look along the railroad tracks.

  On the seventh of June, eighteen ninety-two, a shoemaker named Homer Plessy bought a first-class ticket on the East Louisiana Railroad, for Covington. He took a seat in the car for white passengers.

  Under a Louisiana law two years old, that seat was not his. The law said railroads must keep separate cars by race, and under that law Plessy was Black. His own petition later told the court that it could not be seen in him.

  The conductor told him to move. He refused. He was arrested and taken to the parish jail.

  None of it was an accident. A committee of citizens had organized to test the law in court, and Plessy volunteered. The railroad was in on the plan. The detective who arrested him had been hired ahead of time. The arrest is remembered here, by these tracks.

  The case went all the way to the Supreme Court. In eighteen ninety-six it lost, seven votes to one. The ruling made separate but equal the law of the land, and it stood for almost sixty years.

  The one dissenting justice wrote that the Constitution is color-blind.

  More than a century later, a descendant of the judge who first ruled against Plessy and a member of the Plessy family came to this story together. They were photographed standing on the tracks where he was arrested.

  A Plessy and a Ferguson, side by side.
detail: |
  The Comité des Citoyens formed in 1891. Plessy's trial judge was John Howard Ferguson of
  the Orleans Parish Criminal Court. The Supreme Court heard the case on 13 April 1896 and
  decided it on 18 May; Brown v. Board of Education overturned it in 1954. One National
  Park Service page gives the date of the arrest as 8 June; the Supreme Court record and the
  Jean Lafitte park page give 7 June.
