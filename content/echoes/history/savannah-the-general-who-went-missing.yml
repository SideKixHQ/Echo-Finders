teaser: "The monument went up first. The general arrived seventy-three years later."
script: |
  Look at the tall monument in the middle of Johnson Square.

  When it went up in eighteen twenty-nine, it was paid for partly by a state lottery, and it was meant to honour two Revolutionary generals at once. Nathanael Greene, and Casimir Pulaski. A city history forty years later described it as plain, without an inscription.

  Greene had died near Savannah in seventeen eighty-six, after what may have been sunstroke. He was buried in the old burying ground on what was then South Broad Street, with the artillery firing minute guns.

  And then Savannah lost him.

  For more than a century nobody could say for certain where his body was. The stories grew. That he had been spirited away at night. That he had been sunk in a creek. That he had been carried off to Cumberland Island.

  In March nineteen-oh-one, a committee sent by the Rhode Island Society of the Cincinnati opened a family vault in that old cemetery. Inside was a coffin plate. On it, the name Greene, and the date seventeen eighty-six. Beside him lay a second body, believed to be his son, George Washington Greene, who had drowned in the river as a young man.

  None of the stories was true. He had been exactly where he was put.

  In November nineteen-oh-two, father and son were buried again. Here, beneath the monument.

  For seventy-three years, it had been his memorial with nobody under it. It just took a while for him to arrive.
