teaser: "The map said rows. The ground said otherwise."
script: |
  Look past the house, toward the trees where the trail goes. Out there, the maps of this farm drew the homes of the enslaved people in neat, straight rows.

  The ground tells a different story.

  This was Snee Farm, a plantation of Charles Pinckney. More than twenty five clauses in the Constitution of the United States came from him. In seventeen ninety, the census listed him as owning a hundred and eleven people. About forty of them lived here. By eighteen ten, he held fifty eight people on this farm alone.

  Archaeologists have dug where they lived. They found handmade pottery called colonoware. Pipe fragments. Marbles. A brass thimble. A brass finger ring with a heart on it. A toy cannon, played with by a child.

  And they found the houses. Not in rows at all. In loose clusters, built in many ways, some of them in the African style of posts and woven walls.

  The archaeologists think the clusters may have been families, choosing where to live beside each other, against the order their enslavers drew.

  Look out at the trees again. People lived out there for more than seventy years.

  The rows were only on paper.
detail: >-
  From the National Park Service article on the enslaved community of Snee Farm: the census figures for 1790 and 1810, the colonoware and small finds, the clustered rather than linear arrangement of dwellings, and the archaeologists' suggestion that clusters represented family units, which the script hedges as a suggestion. The finds summary rests on Keel and Koval (2014), cited by the NPS. "The ground tells a different story" uses "story" in its ordinary sense, not as app copy.
