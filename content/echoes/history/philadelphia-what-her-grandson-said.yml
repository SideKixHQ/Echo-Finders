tags: [philadelphia, philadelphia-core, old-city, flag, betsy-ross, myth-and-memory]
teaser: "Everyone knows the scene in this house. Nobody wrote it down for ninety-three years."
script: |
  This small house on Arch Street is famous for one scene. George Washington and two gentlemen of Congress call on a young widow, an upholsterer named Betsy Ross. They show her a rough sketch of a flag. She suggests changes. She sews the first Stars and Stripes.

  Here is what is on record. Betsy Ross was real. Her first husband died in seventeen seventy-six, and she carried on his trade. For about fifty years she was an expert needlewoman and flag-maker. During the war she made state colours for ships and gun batteries. After her, one of her daughters kept the flag business going.

  Here is what is not. The visit appears in no record of Congress, no letter, no diary and no newspaper of the time. Washington wrote a great deal, and never mentioned it.

  The story was first told in public in eighteen seventy, ninety-three years after the flag was adopted. Her grandson, William Canby, read it to the Historical Society of Pennsylvania. It was, he said, what the family had heard her say.

  For most people, the evidence is a picture. Washington seated in her parlour, the new flag across her lap.

  That picture was printed in eighteen ninety-three. Prints of it went to people who joined a club raising money to save this house.
