tags: [philadelphia, philadelphia-core, old-city, flag, betsy-ross, myth-and-memory]
teaser: "Everyone knows the scene in this house. Nobody wrote it down for ninety-three years."
script: |
  Look at this small house on Arch Street, and picture the most famous scene ever set inside it.

  George Washington and two gentlemen of Congress call on a young widow, an upholsterer named Betsy Ross. They show her a sketch of a flag. She suggests changes. She sews the first Stars and Stripes.

  It is a lovely story. Here is what is on record.

  Betsy Ross was real. Her first husband died in January, seventeen seventy six, and she carried on his trade. For fifty years she was an expert needlewoman and flag maker. During the war she made state colours for ships and gun batteries.

  Now here is what is not.

  The visit is in no record of Congress, and in no newspaper of the time. Washington wrote a great many letters and kept detailed diaries. He never mentioned it.

  The story was first told in public in eighteen seventy, ninety three years after the flag was adopted, by her grandson, William Canby. It was, he said, what the family had heard her say.

  So where does the picture in your head come from?

  From a print. Washington seated in her parlour, Betsy with the flag across her lap. It was made in eighteen ninety three, as a souvenir for people who joined a club raising money to save this house.

  The most famous moment in this house was a thank you gift.

  For helping to save the house.

