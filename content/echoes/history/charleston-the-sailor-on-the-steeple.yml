teaser: "Look up Church Street at the steeple of St. Philip's. It is not the steeple this story is about."
script: |
  Look up Church Street at the steeple of St. Philip's. The church sits right out in the
  roadway, the way parish churches did in England, and the street has to bend around it.

  This is not the steeple this story is about.

  In seventeen ninety-six a great fire swept through this part of town. It destroyed the French church on the corner behind you. And it reached the older St. Philip's, which stood
  on this same spot, and set its steeple alight.

  An enslaved Black man, a sailor by one account, climbed up the outside of the tower and
  tore off the burning shingles.

  It worked. The church was saved.

  For this, the old accounts agree, he was given his freedom. One adds a sum of money, and a
  fishing boat, completely fitted out with nets.

  Then the story got away from him. A popular poem moved it to the other great church in
  town, and called it How He Saved St. Michael's. By the start of the nineteen hundreds it was a favourite piece for recitation contests. A book about Charleston from those years set the record straight, and then added four words of its own. Thus is history made.

  The church he saved burned anyway, in eighteen thirty-five, and the one in front of you was
  built to replace it. Its steeple came a decade later.

  The histories that tell this story record his reward in detail. The money. The boat. The
  nets. They do not record his name.
