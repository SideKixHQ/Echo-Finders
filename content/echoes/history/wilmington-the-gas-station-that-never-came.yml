script: |
  In 1930, this house faced a future that could have removed it from Wilmington entirely.

  Businessman Samuel Pryor considered taking the building apart and moving it to
  Connecticut. A gas station was proposed for the cleared site. The Colonial Dames
  campaigned to preserve the house, and Pryor changed course, contributing money and
  supporting the effort.

  The museum's timeline records that reversal. What you see is the result of people
  treating an old building as a shared historical resource rather than simply a valuable
  downtown lot.

  Stand at the corner and picture the gap its removal would have made. No imagined
  demolition is needed to appreciate the stakes. The threatened future was real, and so
  was the intervention. The house stayed where its history could still be encountered.
