teaser: "Saving a building is just the beginning."
script: |
  Saving a building is just the beginning. Someone must decide what people will learn
  inside it.

  The Colonial Dames acquired the Burgwin-Wright House in 1937. Its museum history
  describes decades of restoration and interpretation, including school visits and work
  on the grounds.

  A residence built for private life gradually became a public encounter with colonial
  Wilmington. Rooms, objects, jail remains, and gardens could be examined together
  instead of disappearing into separate collections.

  Look at the entrance. The change from home to museum altered who could cross that
  threshold and why. Visitors now arrive to ask questions that the original owners did
  not intend the building to answer: about trade, confinement, domestic labor, and whose
  lives are easiest to recover. Preservation makes those questions possible;
  interpretation keeps them open.
