script: |
  A railroad museum has an unusual moving problem: some of its most important objects are
  built to travel, but cannot simply be driven down a city street.

  The museum's account of its 2007 relocation records the work of moving the collection to
  its present Nutt Street setting. A new location had to accommodate artifacts and
  full-size railroad equipment together.

  This building now gives the collection a downtown home beside the city's railroad
  history. The move was itself another chapter in preservation, not the end of the
  process.

  Look at the scale of the outdoor equipment from the permitted visitor area. Each large
  object represents a decision to carry difficult evidence forward. Keeping history
  sometimes means arranging a journey for things that have already finished their working
  journeys.
