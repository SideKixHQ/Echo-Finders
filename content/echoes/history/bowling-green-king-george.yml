teaser: "Look at the tops of the posts."
script: |
  This is the oldest public park in the city. Look at the iron fence around it.

  Look at the tops of the posts. They used to have small golden crowns on them.

  On the ninth of July 1776, the Declaration of Independence was read aloud to Washington's troops on the Commons, a few streets north of here. That night a rowdy crowd of soldiers and civilians marched down Broadway to this green, where an equestrian statue of King George the Third had stood for only six years, and pulled it down.

  The statue was carted off to Connecticut and melted down, two tons of metal turned into more than forty two thousand musket balls for Washington's army. And the crowd cut the crowns off the fence.

  Two hundred and fifty years later the fence is still standing and you can still see where the crowns were, which is a fairly direct way of making a point.

