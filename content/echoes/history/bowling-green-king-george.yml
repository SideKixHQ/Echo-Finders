teaser: The fence is original. Look at the tops of the posts.
script: |
  This is the oldest public park in the city, and the fence around it has been here since
  1771.

  Look at the tops of the posts. They used to have small crowns on them.

  On the ninth of July 1776, the Declaration of Independence was read aloud to Washington's
  troops a few streets north of here. The crowd came down to this green afterwards, where a
  gilded lead statue of King George the Third sat on horseback, and pulled it down.

  The lead went to Connecticut and came back as musket balls. Somebody, at some point, took
  a saw to the crowns on the fence.

  Two hundred and fifty years later the fence is still standing and the crowns are still
  missing, which is a fairly direct way of making a point.
