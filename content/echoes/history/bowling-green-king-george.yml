  title: The crown came off the fence
  durationS: 40
  script: |
    Look at the iron fence around this park, at the tops of the posts. They used to have small golden crowns on them.

    In 1776 a crowd pulled down a statue of the king that stood here, and it was melted into musket balls. The crowd also cut the crowns off this fence.

    The fence is still standing. The crowns are still gone.

