id: savannah-a-house-for-a-president
title: "A House for a President"
summary: "Built in time to host President Monroe in 1819, this house became the first public school for Black students here in 1878."
place: "Scarbrough House, Martin Luther King Jr. Boulevard at Congress Street, Savannah, Georgia"
at: { lat: 32.08108, lng: -81.09692 }
triggerRadiusKm: 0.04
category: history
format: short
durationS: 83
visibility: at-hand
certainty: documented
minAge: 0
quality: 0.85
tags: [savannah, savannah-core, yamacraw, william-jay, schools, african-american-history, steamship-savannah]
teaser: "Built for a president. Lost to bankruptcy. Then, for eighty four years, a school."
script: |
  Look at the big stuccoed house on the corner, with the squat columns and the round arched windows. It looks like it was built to impress someone.

  It was. And then it spent eighty four years full of children.

  In the spring of eighteen nineteen, a merchant named William Scarbrough was getting it ready for a guest. Scarbrough was behind the Savannah, the first steamship to cross the Atlantic, and the President of the United States, James Monroe, was coming to see her. On the sixth of May, Scarbrough wrote,

  Our house is quite in readiness for him. It is most tastefully and elegantly decorated and furnished.

  The President stayed here. The ship sailed. And within a year, Scarbrough had lost this house to bankruptcy.

  It passed from owner to owner. After a fire in eighteen sixty five, the family living here abandoned it. It became a boys' orphanage. Then, in eighteen seventy eight, a new owner gave it to the Board of Education, as the first public school for Black students in the area.

  It was the West Broad Street School for eighty four years, until nineteen sixty two.

  Look at the round arched windows again.

  A house built to impress a president did its longest work for the children of Yamacraw.
detail: >-
  The HABS addendum gives the 1818 to 1819 construction, Scarbrough's letter of May 6, 1819, the bankruptcy in 1820, the abandonment after the fire of 1865, the boys' orphanage, the 1878 conveyance by "Georgia W. J. Derenne" to the Board of Education "for use as the first public school for black students in the area", the 84 years and the closing in 1962. The 1934 HABS sheet says Monroe was tendered the house for his visit in 1819. The 1937 guide spells the name Scarborough; the later HABS addendum spells it Scarbrough, which the museum uses.
