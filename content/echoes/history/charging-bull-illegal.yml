teaser: Nobody gave permission for this.
script: |
  Nobody commissioned this.

  In December 1989, two years after the crash, a sculptor called Arturo Di Modica drove a
  lorry to Wall Street in the middle of the night and left three and a half tonnes of bronze
  outside the Stock Exchange. He had paid for it himself. It was, legally speaking,
  fly-tipping.

  The city removed it within hours. The public objected loudly enough that it was put back a
  few days later, here, a couple of streets from where he left it — on a temporary permit
  that has now lasted more than thirty years.
