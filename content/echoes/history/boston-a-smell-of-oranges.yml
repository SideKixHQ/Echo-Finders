detail: >-
  All three sources are The Boston Globe, so this is single-source by publisher. The Globe (2014, on the play Ether Dome) gives the first demonstration at Massachusetts General Hospital on 16 October 1846, the surgical amphitheater atop the Bulfinch Building, Morton's name Letheon "after the mythological river of forgetting", that it was "really sulfuric ether with oil of orange added to disguise its odor", the patient "having a tumor removed from his neck", Morton's demand that Warren sign a license and his plan to patent it, and the renaming of the amphitheater "The Ether Dome". The Globe (2012, on the Russell Museum) gives the sponge soaked in ether, the skepticism, the patient feeling no pain and Warren's "Gentlemen, this is no humbug!"; it calls the tumour a jaw tumour, the 2014 piece a neck tumour, so the script says only "a tumour". The Globe (2024) gives more than 8,000 surgeries in front of spectators and Morton as a Boston dentist. The patient is often named as Gilbert Abbott; no fetched source names him, so the script does not. Rival claims to the discovery are in the Ether Monument echo.
