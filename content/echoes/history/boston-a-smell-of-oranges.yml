teaser: "The gas had a secret ingredient. It was there so nobody could tell what it was."
script: |
  Look up at the granite building with the small dome on top. Under that dome is an old operating theatre. More than eight thousand operations were done in it in front of spectators.

  On the sixteenth of October, eighteen forty six, one of them changed medicine.

  A Boston dentist, William Morton, stood beside a patient who was about to have a tumour cut out. The doctors in the seats were sceptical. Morton had the man breathe from a sponge.

  Morton called his gas Letheon, after the river of forgetting in the old myths. It was really ether, with oil of orange added to disguise the smell.

  The operation went ahead. The patient felt no pain. And the chief surgeon, John Collins Warren, turned to the room and said: Gentlemen, this is no humbug.

  Morton had a reason for the orange. He planned to patent his gas, and he made Warren sign a licence to use it.

  The room was renamed for what happened in it. The Ether Dome.

  The discovery was the ether. The orange was there so nobody would know.
pronunciations:
