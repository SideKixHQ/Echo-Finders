teaser: "They marched with colours flying and two drums beating."
script: |
  Look past the highway, toward the river. Before dawn on a Sunday in September, seventeen thirty nine, a rebellion began just north of this road.

  The man at its head was named Jemmy. He was from Angola.

  The rebels met at the river. They broke into a store by the bridge, took guns and powder, and killed the two men guarding it. Then they turned south, toward Spanish Florida, where they hoped to be free.

  Witnesses said they marched like a disciplined company. They called out Liberty, and marched on with colours displayed, and two drums beating.

  People joined them as they went. By the afternoon there were as many as a hundred.

  They had covered ten miles. In an open field near the Edisto River, they stopped. They rested, and tried to draw more people to them.

  That is where the planters and the militia found them.

  The rebels fought with courage, even in the eyes of their enemies. But the militia had the guns. Some of the rebels were shot. Some were beheaded, and their heads were set on posts. Others escaped, and were hunted down for months. One of the leaders was not caught for three years.

  The next year, the colony passed a law to tighten its grip on every enslaved person in it.

  Look back toward the river.

  They got ten miles.
detail: >-
  The South Carolina Encyclopedia entry (Mark M. Smith) gives the date and the Sunday start, the store at Stono Bridge, the guns and powder and the two men killed, the march toward St. Augustine and freedom in Spanish Florida, the growth to as many as one hundred, the ten miles covered by late afternoon, the halt in an open field near the Edisto to rest and draw others, the militia's attack, the rebels' courage "even in the eyes of their enemies", the killings and heads on posts, the pursuit, the leader not taken until 1742, and the 1740 Negro Act. The National Register nomination (1974) gives the starting point about 200 yards north of US 17, the leader Jemmy, an Angolan, the guards killed at Hutchinson's warehouse, and two contemporary phrases: that they marched "like a disciplined company", and that "they called out Liberty, (and) marched on with colours displayed, and two drums beating". The encyclopedia reports the cry of Liberty only as something some sources suggest; the script attributes the march to witnesses, as the nomination does. The two sources give different early numbers (about fifty one in the nomination, sixty rising to a hundred in the encyclopedia); the script gives only the top figure. "Before dawn" rests on the encyclopedia's "early on Sunday" and the tavern reached "before sunup".
