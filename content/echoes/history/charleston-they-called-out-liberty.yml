# Drafted by Claude Code (2026-11-11) for the second Charleston pass, following docs/writing-echoes.md (format v2).
# Listening spot: The roadside of US 17 (Savannah Highway) at Rantowles, by the Stono River rebellion site. The National Register nomination puts the starting point about 200 yards north of the highway, on the west bank of the Wallace River; that ground is private, so the listener stays at the road.
# Position: The "The Stono Rebellion" historic site point in the Overture data, 20 m from the highway; the nomination's centre point is 32°47'14" N, which matches (high confidence). About 20 km from the peninsula.
