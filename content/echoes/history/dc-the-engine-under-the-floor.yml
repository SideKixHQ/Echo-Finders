script: |
  Walk through to the great concourse behind the main hall, and look at the floor.

  On the morning of the fifteenth of January 1953, the Pennsylvania Railroad's Federal
  Express was running in from Boston, full of visitors for the presidential inauguration.

  By the railroad's account, as the train came into the Washington yards, the engineer found
  that his brakes had failed completely. He sounded the horn in short blasts. A dispatcher in
  a signal tower saw the train race past and sent a warning ahead.

  Station staff had less than two minutes to clear the concourse.

  The train ran off the end of the track at an estimated fifty miles an hour, crossed the
  platform and smashed through the barrier. The locomotive broke through this floor and
  dropped into the basement. Clocks stopped by the impact read eight thirty-six.

  Forty-three people were hurt.

  The inauguration was days away, so the engine stayed where it was. Crews built a wooden
  floor over the hole and surfaced it with quick-drying asphalt. According to a station
  attendant, they even spread sooty dust over it, so it would match the rest.

  That week, thousands of visitors walked across this concourse with no idea that a giant
  locomotive was lying on its side beneath their feet.
