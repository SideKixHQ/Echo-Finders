teaser: "Look at the brickwork. It is younger than it looks."
script: |
  This is City Tavern, on the corner of Second and Walnut. Look at the brickwork. It is younger than it looks.

  The tavern the founders knew was built in seventeen seventy-three and torn down in eighteen fifty-four. The Park Service built this one in nineteen seventy-five, as a copy.

  The original was still new in the late summer of seventeen seventy-four, when delegates to the first Continental Congress began arriving in town, colony by colony.

  They did not wait for anything official. On the first of September, John Adams wrote in his diary, all the gentlemen of the Congress who had arrived met at the new City Tavern and spent the evening together. Twenty-five had come. Virginia, North Carolina, Maryland and New York City were still on the road.

  Four days later they met here again, at ten in the morning, and walked up the street to choose a room.

  So before the Continental Congress had a president, a secretary or a place to sit, it had a tavern. This corner.
