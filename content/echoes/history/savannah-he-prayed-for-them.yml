# Drafted by Claude Code (2026-11-10) for the second Savannah batch, following the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: the sidewalk of West Bryan Street outside First Bryan Baptist Church, on the south side of Bryan Street between Martin Luther King Jr. Boulevard and Fahm Street, in old Yamacraw.
# Position: Bryan Street at MLK and at Fahm from the street segments in the app's Savannah street file, and the church's point in the same file (medium confidence for the door). About 150 m from the First African Baptist echo on Franklin Square, which is a different church and a different subject.
# Contested ground, said in the detail: First Bryan Baptist and First African Baptist both descend from Andrew Bryan's congregation and both claim its founding. This echo is about Bryan himself and the lot he bought; it takes no side.
