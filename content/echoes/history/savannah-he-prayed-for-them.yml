teaser: "Someone listening at his window heard him praying, and it was for them."
script: |
  Look at the church on this block of Bryan Street, and at the lot it stands on.

  The man who bought this lot was once whipped until his blood ran down to the ground.

  His name was Andrew Bryan. He was enslaved, and he was a preacher. In seventeen eighty eight he was ordained pastor of a church of Black Baptists, meeting in a barn outside the city.

  The patrols did not like it. Members were whipped for not carrying passes. Then, around seventeen ninety, about fifty of them were arrested. Andrew and his brother Sampson were whipped worst of all. A church history from eighteen eighty eight says Andrew told the men whipping him that he rejoiced not only to be whipped, but would freely suffer death for the cause of Jesus Christ.

  Afterwards, the story goes, a man went to spy on him, and listened at his window. He heard Bryan praying, earnestly, for the men who had whipped him.

  In seventeen ninety three Bryan bought this lot for thirty pounds. He built a high board fence around it, and kept his meeting house at the back, as quiet as he could make it.

  Look at the church again.

  He built it to be hard to see. It has been seen ever since.
detail: >-
  Simms, The First Colored Baptist Church in North America (1888), gives the whipping, Bryan's words as reported speech, the eavesdropper (a story Simms says he heard often from Rev. A. Marshall), the arrest of "some fifty others" about 1789 or 1790, the purchase of "Lot No. 7, Middle Oglethorpe Ward ... on south side of Bryan St." for thirty pounds by deeds dated September 4, 1793, and the high board fence. Wilson (1889) gives the 1788 ordination by Abraham Marshall and a 1797 deed for Lot Seven in Yamacraw to the trustees of the First African Baptist Church; the dates differ and the script follows Simms. The Boston Globe (2025) reports a Savannah guide's account that Bryan was "publicly whipped and imprisoned for preaching". The two churches' shared and disputed history is not told here; it is the subject of savannah-first-african-baptist and deserves its own contested echo.
