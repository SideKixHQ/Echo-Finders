tags: [charleston, civil-rights, labor, hospital-strike, 1969, mary-moultrie, musc]
teaser: "Thirty cents below the minimum wage, and a hospital president who would not budge."
script: |
  Find the historical marker on Ashley Avenue, just north of the hospital's horseshoe drive. It is the city's main memorial to what happened here in nineteen sixty nine.

  That year, Black workers at the Medical College Hospital were paid a dollar thirty an hour. It was thirty cents below the minimum wage. Most of them were women.

  One of them was Mary Moultrie. She was a licensed nurse, but the hospital did not fully recognise her qualifications. She began meeting other workers quietly, in churches. In March, twelve of them were fired.

  On the twentieth of March, they walked out.

  The hospital's president said he would not turn a twenty five million dollar complex over to a bunch of people who don't have a grammar school education.

  We were all black, predominately women, and many of us were heads of households, Moultrie remembered. The majority of us were out there for the cause.

  Coretta Scott King came, and marched down this avenue with them. The governor sent the National Guard into the streets with fixed bayonets, and put the city under a curfew.

  After more than three months, the hospital gave way. The fired workers were taken back, and pay went up to the federal minimum. The union was never recognised.

  Look at the marker again. When it went up, in twenty thirteen, someone had to pull the cover off.

  It was Mary Moultrie.
detail: >-
  The South Carolina Encyclopedia entry on the strike (George W. Hopkins) gives the pay of $1.30 an hour, 30 cents below the minimum wage, the mostly female workforce, Moultrie's role, the meetings in churches, the twelve fired workers, the strike beginning on 20 March, the hospital president's words, the National Guard with fixed bayonets, the curfew, and the settlement: the fired workers rehired and pay raised to the federal level, without recognition of the union. The Post and Courier's reports (Moultrie's obituary, 2015, and its 2019 guide to the strike's sites) give her as a licensed nurse whose credentials were not fully recognised, her own words, Coretta Scott King marching down Ashley Avenue, the strike lasting more than three months, and the 2013 marker on Ashley Avenue just north of the horseshoe, unveiled by Moultrie. The encyclopedia calls Moultrie a nurse's aide and gives the strike against the Medical College Hospital as one hundred days; the Post and Courier calls her a licensed nurse and the whole strike 113 days. The script follows the Post and Courier on her title and says only "more than three months". The president is named in the sources but not in the script.
