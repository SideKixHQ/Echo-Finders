teaser: "In 1963, the Lower Cape Fear Historical Society acquired the Latimer house."
script: |
  In 1963, the Lower Cape Fear Historical Society acquired the Latimer house. A family
  residence became a place where the region's history could be studied and shared.

  The society had been at work since 1956. Purchasing this house gave its work a physical
  anchor downtown, with rooms, collections, and an address people could visit.

  Pause at the entrance. Museums often seem inevitable once their signs are in place. This
  museum required a choice: keep a nineteenth-century house available and give it a
  public purpose.

  The transition did not freeze its meaning. Each visitor can notice different evidence,
  from household objects to traces of the people who worked here. The house's new role
  made those encounters possible. Its preservation connects personal memories with a
  community's responsibility to examine its past.
