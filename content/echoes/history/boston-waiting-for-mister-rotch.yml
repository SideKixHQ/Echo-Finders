teaser: "Nearly five thousand people waited in there for one man."
script: |
  This is the Old South Meeting House. On the morning of the sixteenth of December,
  seventeen seventy three, nearly five thousand people crowded in. About a third of the town.

  Three ships full of tea were tied up at a wharf nearby. By law, the tea had to be landed
  and the tax paid by the next day. The crowd wanted the ships sent home instead.

  Only the governor could let them go. And the governor was not in town. He was at his
  country house in Milton, ten miles away.

  So the owner of one of the ships, Francis Rotch, was sent to ask him. In December. Twenty
  miles there and back, in freezing rain.

  And everyone waited.

  They waited through the morning. They broke off and came back at three. By four it was
  getting dark, and Rotch had still not returned. Thousands of people in this building, in
  the dusk, waiting on one man on a cold road.

  When he finally came in, the answer was no.

  By the traditional account, Samuel Adams stood and said, this meeting can do nothing more
  to save the country. A war whoop went up at the doors. Men with soot on their faces were
  already in the street, heading for the wharf.

  By the end of the night, three hundred and forty two chests of tea were in the harbour.

  It began as a meeting that ran out of options. Look at the doors. That is the way they
  went.
