teaser: "Look into the oldest graveyard in Charleston. Then look at the name of the street you are standing on."
script: |
  Look into the graveyard around the Circular Congregational Church. It is the oldest burial
  ground in Charleston, and one of its monuments has stood here since the sixteen hundreds.

  Now think about the name of the street you are standing on.

  Meeting Street is named for a building that is not here. In the first years of the town,
  its dissenters, English Congregationalists, Scots and Irish Presbyterians and French
  Huguenots, put up a plain meeting house on this spot. It was painted white. People called
  it the White Meeting House, and the road in front of it took the name.

  Since then, this site has been through almost everything Charleston could throw at it.
  During the Revolution the meeting house was turned into a granary, and horses grazed
  among these graves. In eighteen-oh-six a new church went up here, round, designed by the
  Charleston-born architect Robert Mills. It gave the congregation its name. It burned in
  the great fire of eighteen sixty-one, stood as a ruin for twenty-five years, and the
  earthquake of eighteen eighty-six finished it off.

  The church in front of you was built after that, around eighteen ninety-two, and it was
  built partly from the old bricks.

  Every church before this one has gone. The street is still named for the first of them.
  And the graves have outlasted all of them.
