teaser: "Look at the side of the ship. A cannonball once bounced off it."
script: |
  Look at the side of the ship in front of you.

  In August eighteen twelve, about seven hundred and fifty miles east of Boston, she met the
  British frigate Guerriere.

  The Royal Navy was the most powerful in the world. The American navy had fewer than two
  dozen ships. The British captain said he would take this one in thirty minutes.

  Her captain, Isaac Hull, held his fire as they closed. He waited until the two ships were
  side by side. Then he fired the whole broadside.

  The Guerriere was wrecked. And at some point in the fight, a British cannonball hit this
  hull and bounced off. One of the crew shouted that her sides were made of iron.

  They were not. They were live oak, a wood so dense it can weigh seventy-five pounds to the
  cubic foot. It grew on the swampy islands off Georgia. The first timber cutters sent from New
  England fell sick within days, and enslaved men were brought in to build the roads to get it out.

  She has been rebuilt again and again since. But below the waterline, a good part of her
  original wood is still there.

  The nickname stuck. She has been Old Ironsides for more than two hundred years.

  She has never been iron.
