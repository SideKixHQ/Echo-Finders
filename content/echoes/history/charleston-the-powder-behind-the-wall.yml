teaser: "Look at the building at the foot of Broad Street. Think about what is under it."
script: |
  Look at the Exchange, the big building at the foot of Broad Street. Then think about what is underneath it.

  In the spring of seventeen eighty, a British army had Charleston under siege. One day a shell burst within ten feet of the town's powder magazine.

  The defenders did not wait for the next one.

  That night, they carried ten thousand pounds of gunpowder out of the magazine and down into the vaults of this building. Then they bricked it in.

  In May, the city fell.

  The British used this building as barracks. And the cellar became their prison. The Provost. One damp, dark room where the lowest criminals were locked up with anyone at all who had been complained about. Men and women together.

  It was the terror of the town.

  And it was right next to the powder.

  The American commander, William Moultrie, wrote it down afterwards. Although the Provost was next to it, the British never discovered it, and we found it there when we retook the town.

  The British held Charleston for more than two years.

  All that time, they had been guarding it for him.

