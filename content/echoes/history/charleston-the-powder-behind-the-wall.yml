teaser: "Look at the building at the foot of Broad Street. Think about what is under it."
script: |
  The building at the foot of Broad Street is the Exchange. When it was finished, in seventeen seventy-one, it fronted the harbour. Everything between it and the water now is filled land.

  Think about what is underneath it.

  In the spring of seventeen eighty a British army laid siege to Charleston. During the siege, after a shell burst close to the powder magazine on Cumberland Street, the defenders moved ten thousand pounds of gunpowder out of it, by night, and carried it down into the vaults of this building. Then they
  bricked it in.

  The city surrendered in May. The British took vast stores of powder when it fell. They
  held Charleston for more than two years. They used the Exchange as barracks, and the
  cellar became their military prison, the Provost. In one damp, dark room they kept the lowest criminals together with anyone, however respectable, against whom a complaint was brought, men and women alike.

  William Moultrie, one of the American commanders, wrote about it afterwards. The Provost,
  he said, was right next to the powder. The British never found it. When the Americans
  came back into the town, it was still there.

  For more than two years, the British had been guarding it for them.
