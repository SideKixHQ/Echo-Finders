teaser: "Look at the building at the foot of Broad Street. Think about what is under it."
script: |
  The building at the foot of Broad Street is the Exchange. When it was finished, in
  seventeen seventy-one, the harbour came right up to it. Everything between it and the
  water now is filled land.

  Think about what is underneath it.

  In the spring of seventeen eighty a British army laid siege to Charleston. During the
  siege the defenders moved ten thousand pounds of gunpowder out of the town's main
  magazine, by night, and carried it down into the vaults of this building. Then they
  bricked it in.

  The city surrendered in May. The British took vast stores of powder when it fell. They
  held Charleston for more than two years. They used the Exchange as barracks, and the
  cellar became their military prison, the Provost. In one damp, dark room they kept
  criminals and suspected rebels together, men and women, some held on the thinnest of
  charges.

  William Moultrie, one of the American commanders, wrote about it afterwards. The Provost,
  he said, was right next to the powder. The British never found it. When the Americans
  came back into the town, it was still there.

  For more than two years, the British had been guarding it for them.
