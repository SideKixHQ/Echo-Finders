tags: [philadelphia, philadelphia-core, independence-mall, declaration-house, jefferson, declaration-of-independence, slavery]
teaser: "A straw hat. A monkey. Shoes for Bob."
script: |
  Look at the brick house on this corner of Seventh and Market. It is not old. The house that stood here was demolished, and this one was built in nineteen seventy-five to stand in for it.

  In the summer of seventeen seventy-six this corner was out near the edge of town. Thomas Jefferson rented rooms here from a young bricklayer named Graff.

  Nearly fifty years later a Philadelphia doctor wrote to ask him exactly where he had written the Declaration of Independence. Jefferson answered from Monticello. A new brick house, three stories high, he wrote. I rented the second floor, a parlor and bedroom, ready furnished. In that parlor I wrote habitually, and in it wrote that paper particularly.

  He also kept an account book that summer, and it survives. Thirty-five shillings a week for lodging. Dinners at Smith's. A straw hat. One shilling for seeing a monkey.

  And shoes for Bob. Stockings for Bob.

  Jefferson did not come alone. With him was Robert Hemings, fourteen years old, whom he enslaved. The account book never says who Bob was.

  The rooms are a reconstruction. The shoes for Bob are in Jefferson's own handwriting.
