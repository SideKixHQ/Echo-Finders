teaser: "Look at the schoolhouse at the corner of Smith Court. A boy once said goodbye to it."
script: |
  Look at the schoolhouse at the corner of Smith Court. It opened in eighteen thirty-five as
  a public school for Black children, and it became the default school for most of the
  Black children in the city.

  Part of the money came from a white businessman, Abiel Smith, who left it for the
  education of Black children. The school was still worse than the white schools, and the
  families here kept saying so.

  In eighteen forty-nine, many of them took their children out. Classes moved back into the
  meeting house next door. A father, Benjamin Roberts, sued so his daughter Sarah could go to
  the school nearest her home. He lost.

  So they went to the state. William Cooper Nell, who had been a pupil in the old African
  School himself, led the petitions. In eighteen fifty-five, Massachusetts outlawed
  segregated public schools.

  Nell lived on this court. On the first day of school that year, he watched a young
  student walk past this building, and heard what the boy said to it.

  Goodbye forever, colored school. Tomorrow we are like the other Boston boys.
