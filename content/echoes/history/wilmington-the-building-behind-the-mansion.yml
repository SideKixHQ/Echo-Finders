teaser: "The mansion commands attention."
script: |
  The mansion commands attention. The separate brick building behind it changes what that
  attention means.

  The enslaved quarters were finished first, in 1859, to house some of the enslaved
  workers building the mansion. Later, three enslaved women, a cook, a laundress and a
  nanny, lived here with five girls. The museum opened the restored building to visitors
  in 2014.

  This is a surviving structure, not a theatrical reconstruction of an imagined plantation
  scene. It helps visitors examine how the household organized space, work, and control.

  If you are on the authorized grounds, turn your view between the quarters and the main
  house. Their relationship is the story. The mansion advertised family wealth; the
  quarters supported that wealth through coerced labor. Restoring both makes it harder to
  admire the mansion while overlooking the people whose work kept it functioning.
