teaser: "Two battles were fought here. The ocean did more damage than either."
script: |
  Look at the mounds beside the trail. They are made of earth and sand, and that was the
  whole idea.

  Older forts were brick and mortar. Fort Fisher was made mostly of earth and sand, which was
  far better at swallowing the shock of a heavy shell. The builders made it the largest
  earthwork fort in the South, with a mile of sea defense along this shore.

  Two major battles were fought here, and the second one took it.

  But the enemy that did the most damage never fired a shot. Approximately ten percent of
  Fort Fisher still stands. Much of the rest was eroded by the ocean.

  It just kept coming back, with every tide.
