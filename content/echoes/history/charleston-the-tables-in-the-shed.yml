teaser: "A high arch, eight-sided pillars and an iron gate. A handsome front, for what happened behind it."
script: |
  Look at the front of number six Chalmers Street. A high arch. Eight-sided pillars. A large
  iron gate.

  It is a handsome front, for what happened behind it.

  This is the only building known to survive in South Carolina that was used as a slave
  auction gallery. For a long time, Charleston sold enslaved men, women and children in the
  open, on the north side of the Exchange building. In eighteen fifty-six the city banned
  those public sales.

  The trade did not stop. It moved indoors and off the main streets, into sales rooms and
  yards along Chalmers, State and Queen streets.

  This was one of them, known as Ryan's Mart. Behind the front stood a four-storey building
  with a barracoon, a jail where people were held until they were sold. There was a kitchen.
  There was a morgue.

  The shed you are looking at went up in eighteen fifty-nine. Inside, the people being sold
  stood on tables three feet high and ten feet long. The tables were set lengthwise, so that
  buyers could walk along beside them and look.

  Someone thought carefully about what the buyers needed to see.

  Sales were held here for only a few years, until the Civil War brought slavery to an end.
  Historians estimate that nearly half of all the Africans brought to America in slavery
  arrived through Charleston.

  In nineteen thirty-eight a woman named Miriam Wilson bought this building and made it a
  museum of African American history. A room built for buyers became a room for remembering
  the people who were sold.
