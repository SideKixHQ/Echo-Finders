teaser: "Neutral between what?"
script: |
  Look at the strip down the middle of Canal Street, where the streetcar tracks run.

  Anywhere else it would be a median. In New Orleans it is the neutral ground.

  Start with the street's name. Canal Street really did have a canal, of a sort. A narrow, crooked stream once ran here, and the Spanish used it as a moat in front of the city wall. When Americans began settling upriver, they filled their lots with earth dug from its banks, and it grew into a straight, deep ditch. Iron posts and chains along the edge kept people from falling in. As far as anyone knows, nothing ever sailed on it.

  By eighteen thirty-eight the ditch had been filled in as far as Claiborne Street, and the car tracks were laid on the ground it left behind. The guidebooks called that ground the neutral ground.

  They also called Canal Street the line between the French and American sections of the city. The French and Creole town downriver. The American town upriver. A guidebook of nineteen hundred and four said this street divided New Orleans into two phases of life, two styles of architecture, two forms of civilization.

  The old guidebooks never stop to explain the word neutral. Maybe it did not need explaining.

  Stand here, in the middle of that line, and decide for yourself.
detail: |
  By 1900 the guidebooks used "neutral ground" for the middle of North Rampart, St. Charles
  Avenue and Elysian Fields as well. The statue of Henry Clay stood on the Canal Street
  neutral ground at this intersection until shortly before 1904, when it was moved to
  Lafayette Square.
