teaser: "Look down for a circle of cobblestones."
script: |
  Look down. Under the balcony of the Old State House there is a circle of cobblestones set
  into the street.

  It marks a cold March night in seventeen seventy. A light snow on the ground. A lone
  British sentry outside the Custom House, and some local boys giving him a hard time.

  It grew. Labourers, sailors, men with sticks and clubs. A captain and a small squad came to
  rescue the sentry, and the crowd closed in around them.

  A soldier was struck. He got up, aimed and fired. The others fired too.

  Five people died. By the next morning the town was calling it a massacre.

  And then came the question that decided everything. Who said fire?

  If the captain gave the order, he was guilty and his men had only obeyed. If nobody did,
  the soldiers had chosen to shoot on their own.

  Lawyer after lawyer refused to defend them. John Adams said yes.

  At the trial the witnesses contradicted each other, even about what the captain had been
  wearing. But several swore he had been standing in front of his own men when they fired.
  One of them, a free Black man named Newton Prince, said he heard no order at all.

  Nobody stands in front of muskets he has just told to fire. The captain was acquitted. So
  were six of his soldiers. Two were convicted of manslaughter and branded on the thumb.

  Years later, Adams said this night laid the foundation of American independence. He spent
  that autumn defending the men who fired.
