teaser: "The highest ground in the city. Somebody used to live on it."
script: |
  Look for the small marker on this hilltop. It says, Point Reno. Elevation four hundred and nine feet. This is the highest natural ground in Washington.

  It is a quiet park now. Ball fields. Grass. Water towers.

  It used to be a neighbourhood.

  The Union Army took this hill for a fort in the Civil War. Afterwards the land was cut into lots, and sold. Black families began to rent and buy here. They called the place Reno, or just, on the fort. By the early nineteen hundreds it had churches, a school, a baseball team called the Fort Renos.

  Then the white neighbourhoods around it wanted Reno gone, and turned into parkland and schools for white children. Officials and real estate men agreed.

  In nineteen twenty seven, at a hearing in Congress, a Reno man named Samuel Hebron stood up to the grandson of President Grant. He said they ought not come on the fort and run us people off, who are trying to build respectable homes. He called it unjust, and un-American.

  He bought his neighbours a few more years. Then the houses came down.

  Their school, opened in nineteen oh three, still stands nearby.

  Every year, into the nineteen eighties, the people of Reno came back here, to meet on the hill.
pronunciations:
  - written: Hebron
    say: HEE-brun
detail: >-
  Hebron's words are given in the Park Service article as reported speech ("did not think they ought to come on the fort and run us people off who are trying to build respectable homes, and I feel that it is unjust and un-American"); the script keeps them as his. The Jesse Lee Reno School, opened in 1903, is described by the Park Service as "still standing".
