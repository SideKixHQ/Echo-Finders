teaser: "In 1837 twenty Seminole prisoners got out of this fort. Nobody agrees how."
script: |
  Look at the southwest corner of the fort. In the autumn of 1837, the rooms on this side held prisoners.

  They were Seminole leaders, warriors and their families. They had come to a parley under a white flag of truce, and been surrounded and taken. Over two hundred and thirty of them were brought here. Among them was the war leader Osceola, already very ill.

  Another was Coacoochee, called Wild Cat.

  On the night of the twenty-ninth of November, Wild Cat led an escape. Army records say the prisoners climbed out of a window in a room in the southwest corner. Twenty of them got away.

  Wild Cat told it differently. He said he climbed out of a window, but only he and one other man escaped. Some historians doubt anyone could get through windows that size.

  No one truly knows what happened that night.

  What is known is what came after. Wild Cat went back to the war, and led many victories. Most members of the Seminole Tribe of Florida today trace their heritage to those twenty prisoners.

  The war ended without a treaty. The Seminoles still call themselves the Unconquered People.
