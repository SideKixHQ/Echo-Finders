teaser: Upstairs, in the Long Room.
script: |
  On the fourth of December 1783, in the Long Room upstairs in this building, George Washington said goodbye to the officers of the Continental Army.

  The last British soldiers had left the city nine days earlier. The war was over, and he was going home to Mount Vernon.

  The best known account comes from one of the officers there, Benjamin Tallmadge. He wrote that Washington's emotions were too strong to be concealed. He filled a glass of wine, said a few sentences, and then asked each man to come and take him by the hand. General Knox was nearest. Washington, in tears, could not speak, and the two men embraced in silence. Tallmadge said he had never before witnessed such a scene of sorrow and weeping.

  Six years later Washington was back in this city, on Wall Street, taking the oath as the first president.

