teaser: Upstairs, in the Long Room.
script: |
  On the fourth of December 1783, in an upstairs room of this building, George Washington
  said goodbye to the officers he had fought beside for eight years.

  The British had sailed out of the harbour nine days earlier. The war was over, and he was
  going home to Virginia, believing he was finished with public life.

  By the accounts that survive, he could not finish what he meant to say. He raised a glass,
  managed a few sentences, and then asked each man to come and take his hand. Grown soldiers
  wept. He walked out without trusting himself to speak again.

  Six years later he was back in this city, taking an oath three streets from here.
