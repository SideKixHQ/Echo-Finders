teaser: "The most famous line about this synagogue was the congregation's before it was the president's."
script: |
  Look at how the synagogue sits on its lot. It is not square to the street.

  It is set at an angle, so that the ark inside, on the east wall, can face Jerusalem.

  In August 1790 the new president came to Newport. The congregation that worshipped here sent George Washington a letter of welcome. It was written by their warden, Moses Seixas.

  In it he praised a government which to bigotry gives no sanction, to persecution no assistance.

  Washington wrote back. His reply said that the Government of the United States gives to bigotry no sanction, to persecution no assistance.

  The Library of Congress calls the pair of letters his clearest statement of belief in religious freedom.

  Listen to both lines again. The president took the congregation's words, turned them round, and handed them back as a promise.

  The most famous line about this building was the congregation's own, before it was the president's.
