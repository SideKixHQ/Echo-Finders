teaser: "The President hit a tree stump, and took off his coat."
script: |
  Look down into the canal, at the still water between its stone walls. This ditch was meant to reach all the way to the Ohio River. It never got there.

  On the fourth of July, eighteen twenty eight, President John Quincy Adams went up the river to dig the first spadeful. Perhaps two thousand people were watching. He pushed in the spade, and it hit the stump of a tree. He tried three or four times. Nothing. So the President of the United States threw off his coat, and dug again, and the crowd roared. He wrote in his diary that the coat struck the crowd more than all the flowers of rhetoric in his speech. When they asked him for a toast, he gave one word. Perseverance.

  But on that very same day, in Baltimore, work began on a railroad.

  The canal took twenty two years to reach Cumberland, in the mountains of Maryland, and it stopped there. Families lived on the boats, and children drove the mules along the towpath. But bit by bit, the coal went to the railroad. After a flood in eighteen eighty nine, the railroad bought up most of the canal's debts. After another, in nineteen twenty four, the boats stopped for good. And in nineteen thirty eight, the railroad sold the whole canal to the government, for two million dollars.

  Look at the water again. Perseverance, he said.

  The water is still here.
detail: >-
  Adams broke ground at Little Falls, Maryland, a few miles upstream, not at this spot; the canal runs from here in Georgetown to Cumberland, Maryland, 184.5 miles.
