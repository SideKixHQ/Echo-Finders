teaser: "A French army landed here, and then it waited for nearly a year."
script: |
  Look around this square. The Colony House at the top of it is among the places that remember a French army.

  In July 1780 French forces under the comte de Rochambeau arrived in Newport, to support the American cause.

  Then they waited. For nearly a year, French troops were camped in and around Newport, working out strategy with George Washington and the Continental Army.

  In June 1781 Rochambeau's army began its march out of Rhode Island to join the Americans.

  The campaign that march began ended in victory at Yorktown.

  The road to Yorktown started with a long wait in this town.
