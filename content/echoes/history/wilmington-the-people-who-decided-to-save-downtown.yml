script: |
  Historic Wilmington Foundation began in 1966, when preservation advocates organized to
  protect the city's historic places.

  Downtown survival was not automatic. Buildings could be neglected, demolished, or
  treated as obstacles to a different kind of development. The foundation made
  preservation an ongoing community effort.

  This Orange Street address is its present headquarters, an associated site rather than
  the setting of every early campaign. From the sidewalk, look at the neighboring streets
  as a collection of individual decisions.

  An old building remains because someone maintains it, finds it useful, or argues for its
  value. A historic district is the accumulated result. The foundation's story helps
  explain why downtown Wilmington still offers more than a list of vanished places. Many
  of its stories retain walls, doors, and street corners you can encounter.
