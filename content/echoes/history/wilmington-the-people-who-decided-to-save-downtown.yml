claims:
  - says: "Historic Wilmington Foundation began in 1966, when preservation advocates organized to protect the city's historic places."
    source: 2
    quote: "On August 2, 1966, twelve determined Wilmington residents stepped forward to reverse the tide, signing the articles of incorporation that established the Historic Wilmington Foundation (HWF)—one of North Carolina’s earliest volunteer preservation organizations."
  - says: "This Orange Street address is its present headquarters, an associated site rather than the setting of every early campaign."
    source: 1
    quote: "Thanks in part to an anonymous donation, HWF purchased the William E. Worth House at 211 Orange Street for its headquarters."
  - says: "The foundation's story helps explain why downtown Wilmington still offers more than a list of vanished places."
    source: 2
    quote: "Today, partly because of the six-decade-long alliance between HWF, its donors, and the local community, Wilmington boasts one of the largest historic districts in the United States, spanning more than 230 blocks of historic homes, churches, warehouses, and landmarks."
