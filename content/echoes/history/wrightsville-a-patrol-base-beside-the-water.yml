teaser: "In the Second World War, the boats tied up here were hunting for submarines."
script: |
  Look past the restaurant to the water of the Intracoastal Waterway.

  During the Second World War, this was the county's main Coast Guard patrol base. The wartime
  heritage guide puts it at today's 4 Marina Street, where Bluewater Grill is now.

  The Coast Guard patrolled from bases at Wrightsville Beach, Southport and Wilmington. Barges kept
  to the inland waterway to avoid German U-boats.

  The danger was real. In July 1943, people in a cottage at Kure Beach watched a U-boat attack the
  chemical plant there.

  Today the boats on this water are mostly out for fun. Then, they were looking for submarines.
