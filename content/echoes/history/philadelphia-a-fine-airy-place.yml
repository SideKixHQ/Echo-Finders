teaser: "The enemy general moved in first. Then the President."
script: |
  Look at the stone house facing the square. For two weeks in the autumn of seventeen ninety three, this was the seat of the government of the United States.

  That summer, yellow fever had swept through Philadelphia, the capital. The city was under quarantine. So in November, President Washington rented this house, out here in Germantown, from a man named Isaac Franks.

  The cabinet came to him. Four times they met here. Thomas Jefferson, Alexander Hamilton, Henry Knox and Edmund Randolph, around one table, while Britain and France were at war. Could a president declare the country neutral on his own? Hamilton said yes. Jefferson said that was a power for Congress. They argued it out in these rooms.

  Here is the strange part. Sixteen years earlier, in the Revolution, another general had lived in this same house. Washington's enemy. The British commander, Sir William Howe.

  The next summer, Washington came back, to escape the heat of the city. He called it a fine airy place. He brought Martha and the grandchildren. And he brought the people he held in slavery. Ona Judge, who sewed for Martha. Hercules, who cooked. Moll, and Austin. The family went to church across the square.

  Look at the house again. Two generals on opposite sides, under one roof.

  And under the same roof, a cook and a seamstress who would both escape to freedom.
