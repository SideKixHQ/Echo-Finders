teaser: "In the summer of 1920, the vote for half the country was fought out in this hotel lobby."
script: |
  This hotel stands across the street from the state capitol. In the summer of 1920, it was the headquarters of a war.

  Thirty-five states had ratified the amendment giving women the vote. One more was needed. Tennessee looked like the best, and maybe the only, hope.

  Both sides moved in here. Carrie Chapman Catt, who led the national suffrage campaign, took Suite 309. The leader of the anti-suffrage side took rooms too.

  Suffragists wore yellow roses in their lapels. Their opponents wore red.

  The lobby became known as the third house of the legislature.

  Up on the eighth floor, anti-suffrage lobbyists ran a suite as a speakeasy, in defiance of Prohibition. The whiskey was free for legislators. People called it the Jack Daniel's Suite.

  The Senate passed the amendment. In the House, the vote deadlocked.

  Then a twenty-four year old representative, Harry Burn, changed his vote to aye. He had a letter in his pocket from his mother. Don't forget to be a good boy, she wrote, and help Mrs. Catt.

  Back here at the hotel, Catt heard singing coming closer. She looked out and saw people in yellow running down the hill with the news.

  Thirty-six states. And the last vote came from a son who did what his mother told him.
