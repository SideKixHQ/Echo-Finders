teaser: "For three summers, this end of the island had a resort built for Black visitors."
script: |
  Look north along the sand toward the end of the island.

  In the 1920s, this was Shell Island, then a separate island, and it was the premier resort for
  African Americans. Its backers pictured a mirror of Wrightsville Beach, a National Negro Playground.

  It had hotels, cottages, bath halls and a dance pavilion. Visitors came from fifty cities in ten
  states, because a resort like this was so unusual at the time.

  It was open for only three summers. In June 1926, a fire started in a dining room, and within half
  an hour the pavilion was in ruins. Only five buildings escaped.

  It was never rebuilt. The National Park Service now lists Shell Island Resort in its study of African
  American outdoor recreation.
