teaser: "Look at the small granite post here, with a bronze compass on top."
script: |
  Look at the small granite post here, with a bronze compass on top.

  Walk round to the south face and read it. Point for the measurement of distances from
  Washington on highways of the United States.

  This is zero.

  On the seventh of July, 1919, an army motor convoy set out from this spot to cross the
  continent. It was the first transcontinental military motor convoy, and it went by the
  Lincoln Highway. The east face says so.

  The stone was not here to see them off. Congress authorized a permanent marker the
  following year, and this one was presented to the city on the fourth of June, 1923.

  So the starting line arrived four years after the start.

  The Park Service chooses its words carefully. It calls this, symbolically, the
  official starting point for highway distances from Washington.

  Every highway in the country, measured from a post you can walk around in a few steps.

  Symbolically.
