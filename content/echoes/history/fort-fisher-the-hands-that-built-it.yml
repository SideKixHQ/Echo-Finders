teaser: "Every mound here was moved by hand, and many of the hands were not free."
script: |
  Look at the height of these mounds. Each one on the land face rose about thirty-two feet.
  Every bit of it was sand, moved by people.

  More than five hundred African Americans, both enslaved and free, worked with Confederate
  soldiers to build this fort. At times, as many as a thousand men were digging at once.

  For the enslaved among them, there was no choice in it. Perhaps five hundred enslaved
  laborers worked here under the new commander alone.

  When you read that Fort Fisher was the largest earthwork fort in the South, remember who
  moved the earth.
