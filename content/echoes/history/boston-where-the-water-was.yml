teaser: "Look around. Not a drop of harbour in sight."
script: |
  You are near the bottom of Pearl Street. Look around. Office towers, traffic, pavement.
  Not a drop of harbour in sight.

  On the night of the sixteenth of December, seventeen seventy three, this was the edge of
  the water.

  A footpath called Flounder Lane wound along the shoreline under a hill and came into this
  street. Opposite the end of the street stood Griffin's Wharf. And tied up at Griffin's
  Wharf were three ships carrying tea.

  About a hundred and fifty men, faces darkened with soot, came down from the Old South
  Meeting House. A ten minute walk. They split into three groups and boarded the ships. They
  told the crews to open the hatches and hand over the hoisting tackle, and promised them no
  harm.

  For three hours they hauled up chests, split them open with axes, and tipped the tea over
  the side. Three hundred and forty two chests. They were careful to take nothing else. One
  padlock was broken by accident, and it was replaced a few days later.

  Then they went home without a word to each other. One of them remembered it as the
  stillest night Boston had known in months.

  Afterwards the city kept building out into the harbour. The footpath became a street, and
  the street became part of the waterfront avenue. The filling nearly wiped Griffin's Wharf
  off the map.

  The most famous splash in American history happened somewhere under the ground around you.
