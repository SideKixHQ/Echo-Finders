teaser: "Every voice in the class joined the song but one. He went and enlisted instead."
script: |
  The National Park Service begins one soldier's story at this corner, on the fourteenth of February, eighteen sixty three.

  His name was Eli George Biddle. He was about seventeen, a young Black man who worked as a painter. That day, at school, the class stood to sing My Country, 'Tis of Thee. Sweet land of liberty.

  Every voice joined in but his. To him, the words did not ring true.

  After a confrontation with his teacher, he walked out, and kept walking, until he reached a recruiting office for a new regiment, the Fifty fourth Massachusetts. He signed up for three years. Only nine men had signed before him.

  That summer, at Fort Wagner in South Carolina, his company was at the head of the column. His gun was blown out of his hands. He crawled back through a ditch under fire, and reached his comrades with a severe wound in his shoulder.

  Seventy five years later, at Gettysburg, he was one of ten old soldiers, Union and Confederate, chosen to shake hands across a stone wall. The Confederate across from him said: Many years ago you were shooting at me and I was shooting at you. Thank God we both missed.

  He would not sing that it was a land of liberty. So he went and fought for it.
pronunciations:
