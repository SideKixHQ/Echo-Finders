detail: >-
  Everything here comes from one National Park Service story map, Eli George Biddle: Faithful until the End, so the echo is single-source. It gives his birth around 1846, his work as a painter in Boston, the stop dated 14 February 1863 at the corner of Cambridge and North Russell streets, the refusal to sing "My Country Tis of Thee", the confrontation with his teacher, the walk to a recruiting location and enlistment for three years with only nine before him, Company A at the head of the column at Fort Wagner on 18 July 1863, his gun blown from his hands, the crawl back through the ditch and the shoulder wound (from a later newspaper interview the map quotes), and the 1938 Gettysburg reunion where Franklin Roosevelt chose ten Union and Confederate veterans to shake hands across the wall, with the Confederate's words as Biddle recalled them. A reviewer should note the map does not say whether this corner was his school or the recruiting office; the script says only that the park service begins his story here. "About seventeen" follows from the birth year, which the map gives as approximate. The last line is the script's reading.
