script: |
  The present church replaced an earlier building, but some of the earlier church came
  with it.

  St. James's history says bricks from the first church were reused after its demolition
  in 1839. The new church was consecrated in 1840. It also records that the original
  building had used bricks brought to the port as ship ballast.

  Those details turn a wall into a sequence of journeys: material arriving by water,
  serving one building, then serving another.

  Look from the sidewalk rather than touching or inspecting the masonry. You cannot
  identify every brick's past by sight. The documented reuse is enough to change how you
  read the surface. What seems like one architectural moment may contain material from
  another. Wilmington rebuilt here without starting entirely from nothing.
