script: |
  For decades, Wilmington was a headquarters city for the Atlantic Coast Line Railroad. In
  1960, that role moved to Jacksonville, Florida.

  The museum describes a relocation of more than a thousand employees, along with
  families, belongings, records, and office equipment. The railway carried away part of
  the city's working life.

  This museum is a place to understand that change, not the vanished headquarters itself.
  Its collections preserve a local industry after the institution's center of gravity
  shifted south.

  Imagine the difference between a train departing on its regular run and a train helping
  an employer leave for good. A regular run promises another arrival. A departing
  headquarters changes the neighborhood that waits behind. Here, preserved objects keep
  the railroad visible even after its headquarters stopped calling this city home.
