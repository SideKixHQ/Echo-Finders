script: |
  Look through the fence at the north front of the White House.

  There is a story about that white paint, and people have been telling it for a long time.
  In nineteen forty-nine, a Washington newspaper printed it as plain fact.

  It goes like this. On the twenty-fourth of August, eighteen fourteen, British troops set
  the house on fire. The walls were left stained with smoke. So the house was painted white
  to hide the stains, and that is how it got its name.

  It is a good story. The dates do not fit it.

  The National Park Service says the house was carrying the name White House from around
  eighteen eleven. That is three years before the fire.

  The fire itself was real. The outer walls stood, but they were so weakened that little of
  the original building could be kept.

  And some of the scorched wood had one more journey to make. In nineteen fifty-two, a piece
  of White House timber, still marked by the British fire, was made into a gavel. With a
  message of good wishes from President Truman, it was presented to a training centre of
  the British Army, in England.

  This time, they were invited to take it.
