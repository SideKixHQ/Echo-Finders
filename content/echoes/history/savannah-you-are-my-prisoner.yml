teaser: "He walked in alone, put a hand on the governor's shoulder, and the room emptied."
script: |
  Look at the grand house on the west side of Telfair Square.

  Before it was built, this ground held another house. Government House, home of Georgia's royal governor. And one evening in January, seventeen seventy six, a young man walked into it alone, to arrest him.

  British warships had arrived off the coast. On the eighteenth, Savannah's Council of Safety voted to take the governor, Sir James Wright.

  A major named Joseph Habersham volunteered. He was twenty four.

  That evening the governor was meeting his council, here, in his house. Habersham passed the sentries at the door. He walked up to the head of the table, laid his hand on the governor's shoulder, and said,

  Sir James, you are my prisoner.

  He spoke so firmly that the councillors supposed he had a large force nearby. They fled. Through the doors, and through the windows.

  He had come alone.

  The governor gave his word that he would not leave town, and was kept under guard in his own house. He kept his word for twenty four days. Then he slipped past the sentries and was rowed out in a small boat to a British ship.

  The governor's house is gone. This one stands on its ground.

  Somewhere here, the King's council went out of the windows, because one young man walked in as if he were not alone.

