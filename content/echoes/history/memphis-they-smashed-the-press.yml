teaser: "A newspaper office in this church was wrecked by a mob in 1892. The reporter they wanted was out of town."
script: |
  Look at this church on Beale Street. In the 1890s it held the office of a newspaper, the Memphis Free Speech.

  One of its writers, and later an owner, was a young schoolteacher named Ida B. Wells.

  In 1892, three Black men who had opened a grocery store, Tom Moss, Calvin McDowell and Will Stewart, were taken from their jail cells by a mob and murdered.

  Their store had been drawing customers away from a white-owned store nearby.

  Wells wrote about it in this paper. Then she traveled the South, at the risk of her own life, gathering the facts of other lynchings.

  One of her editorials pushed some of the city's white residents over the edge. A mob ransacked the office and destroyed the printing equipment.

  She was in New York at the time. That probably saved her life.

  Her life was threatened, and she stayed in the North. She kept writing.

  In 2020 she was awarded a Pulitzer Prize, for her courageous reporting on that violence.

  They smashed the press. They could not reach the reporter.
