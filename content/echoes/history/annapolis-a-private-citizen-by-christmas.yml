teaser: "He walked into an unfinished building with a leaking roof, and gave the army back."
script: |
  Look up at the dome. It was not there when this story happened.

  The original dome was torn down in 1785, and this larger one went up after it.

  When the man in this story came here in 1783, the building was unfinished, and the roof leaked.

  For a few months it was the capitol of the United States, because Congress was meeting inside.

  On the twenty-third of December, George Washington came into the Senate chamber and resigned his commission as commander in chief of the Continental Army.

  The war was over, and he was giving the army back.

  He left at dawn the next morning for Mount Vernon. He got home before nightfall on Christmas Eve.

  A private citizen, for the first time in almost nine years.
