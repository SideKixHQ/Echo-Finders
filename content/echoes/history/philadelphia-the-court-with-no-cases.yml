teaser: "The court opened, but there was no business."
script: |
  Look at the small brick building on the corner of Fifth and Chestnut. It was built as Philadelphia's city hall. Through the seventeen nineties it was also the home of the Supreme Court of the United States.

  Today that court decides the hardest questions in the country. When it came to Philadelphia, it had almost nothing to decide.

  Its first term in this city opened in February, seventeen ninety-one. A Philadelphia lawyer wrote about the day in a letter. The court opened, he said, but there was no business.

  So the justices did the one thing they could, which was admit lawyers to practise before them. The local bar assumed Justice James Wilson, one of their own, would simply vouch for them. He would not. The Chief Justice ruled that one lawyer could not vouch for another. Some of the best known lawyers in the city had to go off and find certificates of good character, and come back after one o'clock.

  That August the court finally called a case for argument, West against Barnes. One of the parties stood up and pointed out that the paperwork had come from the wrong clerk's office. The court agreed, and dismissed it.

  One of the original justices, John Rutledge, resigned without ever sitting in a session.

  The courtroom inside is furnished the way an eighteenth century courtroom would have been, and it is open to look into.

  The most powerful court in the world started out by checking references.
