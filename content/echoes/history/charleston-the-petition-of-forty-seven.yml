teaser: "The petition lost. Seventeen years later it had the whole building."
script: |
  Look at the front of this synagogue. Tall columns, a deep porch, a heavy roof line. It was designed to look like a temple from ancient Greece.

  The congregation is older than the building. It began in seventeen forty nine, and by the end of that century it was the largest Jewish community in the country.

  In eighteen twenty four, forty seven members sent the trustees a petition. They asked for shorter Hebrew rituals. They asked for prayers and sermons in English. The trustees said no, and for a time the congregation split.

  By eighteen thirty three, the congregation was back together, and most of it was on the petitioners' side. Then the Charleston fire of eighteen thirty eight burned the first synagogue, which stood on this spot.

  This one was built to replace it in eighteen forty. When its first service was held, the year after, it was the new kind. Beth Elohim became the first Reform congregation in America, and this is now the oldest synagogue in the country in continuous use.

  The petition of eighteen twenty four was turned down. Seventeen years later, it had the whole building.
