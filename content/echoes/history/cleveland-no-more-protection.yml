tags: [cleveland, lake-view-cemetery, garfield, presidents]
teaser: "The biggest tomb of its day holds a president who wanted no guards."
script: |
  Look up at the tower. It is Berea sandstone, and it stands a hundred and eighty feet tall.

  James Garfield, the twentieth president, is buried here.

  He had been in office only four months when he was shot. It was the second of July, 1881, in a Washington railway station.

  In those days presidents had no guards around them. Americans believed a president should be open to everyone.

  For eighty days the country read every bulletin from his doctors. He died on the nineteenth of September.

  His monument here was one of the biggest and most elaborate mausoleums of its time.

  Go downstairs and you can see his casket, and his wife Lucretia's, on full display.

  The biggest tomb of its day holds a man who said he needed no more protection than the average American.
