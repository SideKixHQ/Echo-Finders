tags: [houston, san-jacinto, battleground, military, texas-revolution, sam-houston, santa-anna, 1836]
teaser: "Sam Houston did nothing all afternoon. That was the plan."
script: |
  Stand at the foot of the monument and look out over the flat ground around it. The Texans camped on one side of where it stands. The Mexican army camped on the other.

  On the afternoon of the battle, the Texans did nothing at all.

  It was the twenty first of April, eighteen thirty six. For forty days, Sam Houston had retreated across Texas, ahead of General Santa Anna. Some of his own officers had talked of mutiny. Now the two armies were camped on this plain, and that morning, some four hundred Mexican reinforcements had marched in.

  Houston told his officers nothing. Quietly, he sent a scout, Deaf Smith, with a few men and axes, to destroy Vince's Bridge, so no more Mexican troops could reach the field. Return like eagles, he told him, or you will be too late for the day.

  Then he waited. Hour after hour, the Texan camp sat still.

  Across the field, the Mexican officers decided no attack was coming. They took their afternoon siesta. Muskets were stacked.

  At about four o'clock, Houston formed his men, and they walked forward through the tall grass, silently, holding their fire.

  When they were close, two small cannon, the Twin Sisters, fired point blank into the barricade. The Texans charged, shouting Remember the Alamo.

  The battle took about eighteen minutes.

  Look at the plain again. All that waiting, for eighteen minutes.

  And Texas was a country.

