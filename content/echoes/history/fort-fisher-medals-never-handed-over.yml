teaser: "Seventy-two Medals of Honor were earned here. Some were never given to the men."
script: |
  Stand by the visitor center and count to seventy-two.

  That is how many soldiers, sailors and Marines received the Medal of Honor for what they did
  at Fort Fisher, between June 1864 and January 1865.

  For the hundred and fifty-first anniversary of the battle, the site put five of those medals
  on display, on loan from the Navy. None of the five had ever been presented to the man who
  earned it.

  They were made, and kept. The hands they were for never held them.
