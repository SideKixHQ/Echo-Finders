teaser: "When the boats came in, the children of this town waited to see one fisherman walk up the street."
script: |
  Picture the boats coming in to this waterfront, and children waiting in the park for the men to come up the street. They were waiting for one man.

  His name was Elias Gore, and in the early twentieth century he was known as the gentleman giant of Southport.

  He was a fisherman. Reports put him at somewhere from seven foot eight to seven foot eleven, around four hundred pounds, with size sixteen shoes.

  People called him Nehi.

  It was said he could haul in a full net of fish by himself, a job that usually took several men.

  His daughter grew up on the stories. His hands were so big, she said, he could pick the children up by their heads, and they all wanted the rides.

  For all his size, he was known for his gentle spirit, and for being kind to people of every size.

  He died in 1944, at thirty eight, and he is buried in the John N Smith Cemetery, the only African American cemetery in town.

  The best ride on this waterfront was a fisherman's hand.
