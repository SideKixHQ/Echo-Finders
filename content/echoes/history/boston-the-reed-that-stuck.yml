teaser: "The telephone's first sound was not a word. It was a twang."
script: |
  Look for the marker near City Hall. The building it remembers is gone. So is that end of Court Street.

  The telephone made its first sound here. Not a word. A twang.

  In eighteen seventy five, Alexander Graham Bell was using two attic rooms at one hundred and nine Court Street, above Charles Williams's workshop. Freezing in winter, his assistant remembered, and unbearably hot in summer.

  Bell did not set out to invent the telephone. He set out to build a better telegraph.

  On the afternoon of the second of June, his assistant, Thomas Watson, was in the other room with a steel reed that would not start. So he plucked it. Then he gave it several more hard plucks, and by his own account he said what he thought of it, in vivid shop language.

  In the next room, Bell had a receiver pressed to his ear. He heard the reed.

  He came running out in great excitement. The plucked reed had made its own current, and sent its sound down the wire. In Watson's words, it was the first real sound that had ever been transmitted electrically.

  The telephone began with a stuck reed, and a man losing his temper with it.
pronunciations:
  - written: "Watson"
    say: "WOT-sun"
detail: >-
  Thomas A. Watson's own account, in his 1915 speech now in the Library of Congress Bell papers, gives the attic of 109 Court Street where Williams's shop was, the two rooms Bell used as his laboratory, freezing in winter and unbearably hot in summer, the afternoon of 2 June 1875, the reed that was not vibrating and the several vigorous plucks "in vivid shop language", Bell rushing out in great excitement, and the snapped reed acting as a generator. Bell's 1911 speech, in the same collection, independently gives "the plucking of reeds that went on, on that celebrated June 2, 1875" and the building as Charles Williams, Jr.'s at 109 Court Street. Both are first person accounts from the two men involved, so they are not fully independent of each other; WBUR (2026, MIT Museum curator) supplies the better telegraph line and the marker near City Hall. "Swearing" is avoided: Watson's phrase is "vivid shop language", and the script keeps it. The exact position of the marker was not checked on site.
