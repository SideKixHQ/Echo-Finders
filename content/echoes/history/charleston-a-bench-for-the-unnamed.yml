teaser: "A bench, because there was nothing else to sit on and remember."
script: |
  Find the small bench by the water and, if you can, sit on it. It was put here so that someone would.

  Charleston was the entry point for nearly half of all the captive Africans shipped to North America. Ships with sickness aboard were held at this island.

  Between seventeen o seven and seventeen ninety nine, four pest houses were built on Sullivan's Island to quarantine the people in their holds. They stood somewhere between the fort and the western end of the island.

  Nobody knows exactly where.

  So the bench stands in for all of them.
detail: >-
  From the National Park Service page on the Bench by the Road: Charleston as the entry point for nearly half of the captive Africans shipped to North America, four pest houses built between 1707 and 1799 to quarantine enslaved passengers, never more than one at a time, with locations unknown between Fort Moultrie and the western end of the island. The bench was placed by the Toni Morrison Society; that history is not in the source fetched here, so the script does not tell it.
