teaser: "The creek's name is an Italian word. It means a hospital for the contagious."
script: |
  Look at the creek and the marsh at this end of the island. The creek is called Lazaretto.

  It is not a family name. It is an Italian word, for a hospital for the contagious.

  In colonial days, ships coming up to Savannah stopped here first. Passengers who might be carrying disease were kept on this end of the island until they were judged safe. Most of the people held here had not chosen to come. They were Africans, brought across the ocean in the holds of slave ships.

  A guidebook written in the nineteen thirties put it plainly. Traders left the ones who had fallen sick on the voyage here, at a hospital for the enslaved. Those who recovered were sent on to the slave market in Savannah. Those who died were buried nearby, in graves that were never marked.

  The Park Service puts it in one line. Mass burial on Tybee was the final port of call for many of those quarantined here.

  In eighteen sixty two, Union soldiers built gun batteries on this end of the island to fire on Fort Pulaski. Four of them stood on the old quarantine ground.

  Look at the marsh again.

  Under it are people whose names nobody wrote down.
detail: >-
  The NPS Tybee page places the lazaretto on the western end of the island and names its purpose; the NPS rifled cannon page dates the quarantine land to the 1770s and says four Union batteries were built on it; the 1937 guide describes the slave hospital and the unmarked graves. No fetched source gives the number buried. The exact site of the burial ground is not marked in any fetched source.
