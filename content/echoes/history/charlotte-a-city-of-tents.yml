teaser: "In 1917 an army camp grew up out here that was bigger than Charlotte itself."
script: |
  This old farmhouse is one of the few things left of a city made of tents.

  In 1917, with the country going to war, the Army built a training camp out here, three miles west of downtown. It took six weeks to put up.

  It was named Camp Greene, after Nathanael Greene, the general who forced the British out of the Carolinas in the Revolution.

  It grew to six thousand acres of forest and cotton fields, bought from families like the Dowds, who lived in this house.

  Recruits dug five miles of trenches into the red soil, to practice the kind of fighting going on in Europe.

  At its peak, more than sixty thousand soldiers lived here. In 1910, the whole of Charlotte had about thirty-four thousand people.

  The first winter, rain and snow turned the camp into a red quagmire.

  When the armistice came, on the eleventh of November 1918, the camp was already disappearing. Tents came down, trenches were filled in, and the land went back to civilian use.

  A city of sixty thousand came and went. The Dowd family's farmhouse stayed.
