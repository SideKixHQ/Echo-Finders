teaser: "The wagon carrying the bell broke down in the street."
script: |
  Look up at the tower on the back of the hall. The brick part is original, from the seventeen fifties. The wooden steeple on top came later.

  In September, seventeen seventy-seven, a British army was closing in on Philadelphia. Before it arrived, the State House bell was taken down from up there, to keep it out of British hands. It was not the Liberty Bell yet. Nobody would call it that for almost sixty years.

  It went north in a wagon, in a train of about seven hundred wagons carrying the army's heavy baggage, guarded by two hundred soldiers from Virginia and North Carolina. Through Germantown, through Bethlehem, to Allentown.

  A diary kept in Bethlehem that autumn has one line about it. September the twenty-ninth. The wagon which conveyed the State House bell broke down in the street, and had to be unloaded.

  They got it moving again. It spent the winter in Zion's Church in Allentown, while the British held this city, and it came home in June, seventeen seventy-eight, after they had gone.

  The bell got through the war. What finally silenced it, in eighteen forty-six, was a repair job for Washington's birthday.
