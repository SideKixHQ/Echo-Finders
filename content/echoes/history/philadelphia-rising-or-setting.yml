teaser: "Painters, he said, could never tell a rising sun from a setting one."
script: |
  Look at the hall in front of you. Inside is the room where the Constitution was signed.

  For four months in the summer of seventeen eighty-seven, George Washington presided in that room from a chair. Carved into the top of its back is a sun.

  It was not an easy summer. Large states against small states. Arguments over the slave trade.

  On the last day, the seventeenth of September, the delegates lined up to sign. While the last of them were signing, Benjamin Franklin looked at Washington's chair and said something to the men near him. James Madison wrote it down.

  Painters, Franklin said, had always found it hard to show the difference between a rising sun and a setting one. All through the session, in his hopes and fears, he had looked at that sun behind the president, and could not tell which it was.

  But now at length, he said, I have the happiness to know that it is a rising and not a setting sun.

  The chair had been made here in Philadelphia in seventeen seventy-nine, for the speaker of Pennsylvania's assembly. It went with the legislature to Harrisburg, and came back to this city in eighteen seventy-two.

  Earlier that day Franklin had asked every doubter in the room to doubt a little his own infallibility, and sign. Three still refused.

  Nothing about the carving had changed. Franklin had.
