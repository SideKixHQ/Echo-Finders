teaser: "The tablet on the tower says what happened here. It does not say who did it."
script: |
  Look at the brick tower, and the tablet on its front. It says the signal lanterns of Paul
  Revere were shown in the steeple of this church.

  It does not say who carried them up.

  On the night of the eighteenth of April, seventeen seventy-five, by the usual account, two
  men let themselves in. One was John Pulling, a member of the vestry. The other was the man
  who kept the church, its sexton. His name was Robert Newman.

  They climbed to the top of the tower, the tallest structure in the town. They held two
  lanterns near the windows, briefly. Then they got out.

  Two lanterns meant the British troops were crossing the river by water, heading for
  Lexington and Concord.

  Newman lived a block up this street, on the corner of Sheafe Street. And there is one more
  detail about that house.

  At the time, British officers were quartered in it, on the Newman family.

  So the signal that the army was moving went up from the tallest building in Boston. And the
  man who hung it was sharing his home with the army's officers.
