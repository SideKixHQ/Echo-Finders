teaser: "The night before he was hanged, a private wrote home. His family kept the letter for a century."
script: |
  Look around at these trees. In the summer of nineteen seventeen, this was not a park. It was Camp Logan, an army camp being built to train men for the war in Europe.

  The soldiers sent to guard it while it was built were Black.

  They were the Third Battalion of the Twenty Fourth Infantry, the Buffalo Soldiers. They had served in Mexico and the Philippines. In Houston, they met Jim Crow. Again and again, there were run ins with white police.

  On the twenty third of August, a false rumor went round that a mob was coming. Someone shouted, get your guns, boys. More than a hundred soldiers took their rifles and marched into the city. By the end of the night, nineteen people were dead. Fifteen were white. Four were Black.

  The Army tried a hundred and ten men. Sixty three of them stood trial together, defended by one officer who was not a lawyer. Thirteen were sentenced to death, and were not told until twelve hours before.

  One of them was Private First Class Thomas Coleman Hawkins. That night, he wrote to his family.

  I was sentenced to be hanged for the trouble that took place in Houston, Texas, he wrote, although I am not guilty of the crime that I am accused.

  The thirteen were hanged together, just before sunrise. Six more hangings followed.

  In November twenty twenty three, the Army set aside all one hundred and ten convictions. The soldiers, it said, were wrongly treated because of their race, and were not given fair trials.

  His family had kept his letter the whole time.

