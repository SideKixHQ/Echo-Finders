teaser: The oldest building in Manhattan still doing its job.
script: |
  This is the oldest public building in Manhattan still doing the thing it was built to do.

  It went up in 1766, when this was the northern edge of town and the front of the chapel
  faced the river, because that was the direction people arrived from.

  Ten years later a fire took a quarter of the city and stopped at its churchyard.

  George Washington came here on the day he was inaugurated, and kept coming for the two
  years New York was the capital. His pew is still inside.

  On the eleventh of September 2001, the towers came down about a hundred metres from where
  you are standing. Every window in this chapel survived. For eight months afterwards it
  was where the recovery workers slept and ate and had their feet seen to.

  A sycamore tree in the churchyard took the weight of the debris that would otherwise have
  hit the building. It did not survive. The chapel did.
