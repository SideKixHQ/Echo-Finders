teaser: "The first Marines signed up in a tavern."
script: |
  Look east, toward the roar of the highway. Under it, somewhere near here, is the ground where a tavern stood for almost a hundred years. Its name was the Tun. A tun is a barrel of beer.

  It was a sailors' place, close to the wharves. Benjamin Franklin was a customer. In the autumn of seventeen seventy five, members of Congress met here to plan a navy.

  On the tenth of November, seventeen seventy five, Congress voted to raise Marines. Congress made a man named Samuel Nicholas their captain. Nicholas ran an inn himself. And he turned to a friend.

  His friend was Robert Mullan. Robert's parents, Thomas and Peg Mullan, kept the Tun. Robert helped run it. Congress made him a first lieutenant. And when he needed a place to sign up recruits, he chose the obvious one. His own bar.

  So the first Marines were recruited in a tavern. A few months later, in March of seventeen seventy six, Nicholas led them ashore in the Bahamas, and they captured two British forts and a town.

  The tavern burned down in seventeen eighty one. In the nineteen seventies, the highway was built straight over its site.

  Look for the marker on this block. It went up on the tenth of November, two thousand and five. The Marines' birthday.

  Their birthplace is under Interstate ninety five.
