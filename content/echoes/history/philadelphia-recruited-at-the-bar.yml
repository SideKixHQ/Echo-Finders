    quote: "the three-story Tun Tavern derived its name from the Old English word “Tun” for keg or barrel of beer."
  - says: "It was a sailors' place, close to the wharves."
    source: 1
    quote: "Conveniently located near Philadelphia’s riverfront wharves, Tun Tavern became popular among seafarers and others who supported the city’s maritime industry."
  - says: "Benjamin Franklin was a customer."
    source: 1
    quote: "Its patrons included such noteworthy Americans as Benjamin Franklin (1706-90), John Adams (1735-1826)"
  - says: "In the autumn of seventeen seventy five, members of Congress met here to plan a navy."
    source: 1
    quote: "Beginning in the fall of 1775, the Naval Committee of the Continental Congress, whose members included John Adams, met several times at Tun Tavern to discuss naval and maritime affairs and plan operations for the fledgling Continental Navy."
  - says: "On the tenth of November, seventeen seventy five, Congress voted to raise Marines."
    source: 1
    quote: "the American colonies’ first Continental Marines, which the Continental Congress authorized on November 10, 1775."
  - says: "Congress made a man named Samuel Nicholas their captain. Nicholas ran an inn himself. And he turned to a friend."
    source: 1
    quote: "As captain for the new Marines, Congress appointed Samuel Nicholas, proprietor of the Conestoga Wagon Inn. Nicholas in turn called upon his friend Robert Mullan"
  - says: "His friend was Robert Mullan. Robert's parents, Thomas and Peg Mullan, kept the Tun. Robert helped run it. Congress made him a first lieutenant. And when he needed a place to sign up recruits, he chose the obvious one. His own bar."
    source: 1
    quote: "Robert Mullan, the son of Thomas and Peg Mullan and co-proprietor of Tun Tavern, for assistance in recruiting men to serve. Robert Mullan, commissioned as a first lieutenant, logically selected his place of business as the Marines’ recruiting station."
  - says: "A few months later, in March of seventeen seventy six, Nicholas led them ashore in the Bahamas, and they captured two British forts and a town."
    source: 1
    quote: "in March the expedition conducted an amphibious assault on New Providence Island in the British Bahamas. Under the command of Nicholas, 220 Marines and sailors captured Forts Nassau and Montague, Nassau’s Government House, and the town of Nassau."
  - says: "The tavern burned down in seventeen eighty one."
    source: 1
    quote: "Although destroyed in a fire in 1781"
  - says: "In the nineteen seventies, the highway was built straight over its site."
    source: 1
    quote: "Construction of Interstate 95 in the 1970s destroyed the Merchants Warehouse and left the site of Tun Tavern buried beneath the highway just south of the Benjamin Franklin Bridge."
  - says: "Look for the marker on this block. It went up on the tenth of November, two thousand and five. The Marines' birthday."
    source: 1
    quote: "Philadelphia lacked a marker for the site of Tun Tavern until November 10, 2005–the 230th birthday of the Marine Corps–when the Pennsylvania Historical and Museum Commission dedicated a new marker on Front Street between Chestnut and Walnut Streets."
  - says: "So the first Marines were recruited in a tavern."
