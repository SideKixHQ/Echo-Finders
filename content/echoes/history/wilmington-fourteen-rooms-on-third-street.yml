script: |
  The Latimer house was built in 1852 for Zebulon and Elizabeth Latimer. Its fourteen
  rooms offered an unusually substantial home in the growing port city.

  The museum identifies the design as Italianate, with symmetry and a central-hall
  arrangement. What looks like a single handsome facade held a complicated household
  behind it.

  Stand where you can see the windows without blocking the sidewalk. Their orderly spacing
  invites you to read the house as a finished composition. Daily life would have been less
  orderly: family responsibilities, domestic work, business pressures, and change across
  generations.

  The museum's surviving furnishings and objects connect that exterior pattern to
  particular lives. The building gives them a setting. From outside, the first clue is
  scale: enough rooms to make a family home a small working world.
