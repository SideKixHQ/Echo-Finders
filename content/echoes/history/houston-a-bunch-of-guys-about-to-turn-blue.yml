teaser: "Neil Armstrong's first call from the Moon began with the word Houston. It came to this building."
script: |
  You are at Building Thirty, Mission Control. Every Apollo flight was run from a room in here, including the one that first landed men on the Moon.

  Sixteen days before that landing, the controllers here failed a test.

  On the fifth of July, nineteen sixty nine, they ran a practice landing. Steve Bales, the twenty six year old guidance officer, saw a computer alarm he had never seen before. He did not know what it meant. He called an abort.

  The abort was wrong. The alarm was harmless. The flight director, Gene Kranz, told him to go and write rules for every alarm the computer could throw.

  On the twentieth of July, the real Eagle was falling toward the Moon. Then, on its computer, an alarm. Twelve oh two.

  From the Moon, Neil Armstrong asked for a reading on it.

  Bales had his answer. Flight, he said, we're go on the alarm. Twenty seconds, maybe longer. It was an eternity in the control room, he said later.

  More alarms came. The room kept saying go.

  Then Buzz Aldrin's voice. Contact light. Engine stop.

  And Armstrong. Houston. Tranquility Base here. The Eagle has landed.

  His first call to Earth from the Moon began with the name of this city.

  The answer came back from this building. Roger, Tranquility. You got a bunch of guys about to turn blue.

  We're breathing again.

