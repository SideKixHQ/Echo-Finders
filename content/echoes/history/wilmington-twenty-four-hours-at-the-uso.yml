script: |
  During the Second World War, this corner offered service members a place to spend their
  hours away from duty.

  The USO club opened in December 1941. Volunteers kept it operating around the clock,
  with recreation, assistance, and familiar comforts for visitors far from home.

  Its public role was built from repeated small acts: directing a newcomer, providing
  refreshments, arranging an activity, keeping the doors available. A building can support
  wartime life without being a battlefield.

  Pause at the entrance. The continuity is striking: a place created for gathering still
  serves community life. The current arts center has a different purpose, but the building
  remains a meeting point. Its wartime story is measured in the people who passed through
  and the practical welcome they found here.
