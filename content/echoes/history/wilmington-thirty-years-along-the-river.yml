teaser: "The Riverwalk can feel like something the city always had."
script: |
  The Riverwalk can feel like something the city always had. The visitors bureau says it
  was developed in the early 1980s.

  Today it stretches nearly two miles, from Nun Street to the Isabel Holmes Bridge,
  linking a long stretch of downtown waterfront.

  That project changed how people could encounter the river. A sequence of working and
  commercial edges became a connected public experience.

  Pause without blocking the path. The people moving past you are using the result of many
  separate planning and building decisions. The story is not a single spectacular opening
  but persistence over time. Wilmington gradually made a continuous place to walk beside
  the water that had shaped its economy long before visitors came here simply to enjoy the
  view.
