teaser: "The Riverwalk can feel like something the city always had."
script: |
  The Riverwalk can feel like something the city always had. Its construction instead
  unfolded over about thirty years.

  Wilmington marked its completion in November 2017. The city describes a route running
  from Nun Street toward the Isabel Holmes Bridge, linking a long stretch of downtown
  waterfront.

  That project changed how people could encounter the river. A sequence of working and
  commercial edges became a connected public experience.

  Pause without blocking the path. The people moving past you are using the result of many
  separate planning and building decisions. The story is not one spectacular opening but
  persistence over time. Wilmington gradually made a continuous place to walk beside the
  water that had shaped its economy long before visitors came here simply to enjoy the
  view.
