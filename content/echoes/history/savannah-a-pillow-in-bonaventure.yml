teaser: "He woke up and found his pillow was a grave."
script: |
  Look up into the oaks, at the grey moss hanging from every branch. Listen for birds out over the marsh.

  A young man once slept here for five or six nights, because he could not afford anywhere else.

  It was October, eighteen sixty seven. A young botanist named John Muir was walking a thousand miles from Indiana to the Gulf of Mexico with a plant press and a small bag. In Savannah he waited for money from home. It did not come. He had about a dollar and a half.

  So he walked out here at dusk. He lay down under one of the great oaks and found a little mound to use as a pillow. In the morning, he wrote, he found that his head had been resting on a grave.

  He was not frightened. He built a hut in a thicket of bushes near the river, four or five feet long, with a roof of rushes and a mattress of long moss. The birds came to scold him through the leaves, and then, he wrote, they scolded less and sang more.

  Each night he came back after dark, so that no one would suspect him of hiding, as if he had committed a crime.

  Look up at the moss again.

  He called this a town of the dead, and said the graves were powerless in such a depth of life.
detail: >-
  All facts are from Muir's own journal, edited and published in 1916. Nothing outside his own account is used. Muir writes "near the right bank of the Savannah River"; Bonaventure stands on the Wilmington River, and the script says only "near the river".
