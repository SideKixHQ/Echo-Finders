# Listening spot: the riverside edge of Bonaventure Cemetery, under the oaks above the marsh of the Wilmington River, south of the old mansion site. The cemetery has gates and daytime hours.
# Position: Bonaventure Cemetery from the cemetery polygons in the app's Savannah street file, set toward the river edge and away from the two existing Bonaventure echoes (savannah-dinner-under-the-trees, savannah-the-m-and-t-oaks). Muir's own hut cannot be located; he hid it on purpose. The spot is the landscape he describes, not his bed (medium confidence).
