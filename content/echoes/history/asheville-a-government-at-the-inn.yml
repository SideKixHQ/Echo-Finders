teaser: "This stone hotel went up in less than a year. Decades later, a whole country's government moved in."
script: |
  Look at the great stone hotel on the side of Sunset Mountain. It went up in less than a year. Four hundred laborers and twenty Italian stonemasons, working ten-hour days.

  It opened on the twelfth of July, 1913. The Secretary of State, William Jennings Bryan, gave the opening address, and said the inn was built for the ages.

  The guests over the years included President Franklin Roosevelt, and the writer F. Scott Fitzgerald.

  And a guest who brought a whole government with him. Manuel Quezon, the exiled president of the Philippines, set up the headquarters of a government in exile for the Philippines, here at the inn.

  A nation's government, run for a while from a resort in the mountains of North Carolina.
