tags: [savannah, savannah-core, monterey-square, american-revolution, monuments]
teaser: "People were arguing about it while the marble was going up."
script: |
  Look up at the tall marble column in the middle of the square. Liberty stands on top, holding a flag.

  Now look lower down, for the carved panel of a man falling from his horse, still gripping his sword.

  That is Casimir Pulaski, a Polish cavalry commander who fought for the Americans. On the ninth of October, seventeen seventy nine, he was hit by grapeshot leading an attack on the British lines around Savannah. Two days later he was dead.

  This monument was finished in eighteen fifty five. What lies beneath it is a harder question.

  One account says he was put aboard a ship bound for Charleston, died at sea, and was buried at sea. An officer of his who was wounded and on board the same ship said so. The Park Service still says he was reported to have been buried at sea.

  The other story says he was carried to a plantation called Greenwich, died there, and was buried at night under a palmetto tree. A city guidebook in nineteen ten went further. His remains, it said, were dug up in eighteen fifty four and placed beneath this monument.

  People were arguing about it while the marble was going up.

  The man falling from his horse is certain. The man beneath him is not.
