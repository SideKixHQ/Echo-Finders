certaintyNote: >-
  Where Pulaski was buried is disputed in the sources used. An 1890 guide cites a staff
  officer aboard the ship who said he died at sea and was buried at sea, and a 1929 Georgia
  Historical Society publication treats that as final; the National Park Service says he was
  reported to have been buried at sea. A 1910 city guide says instead that he died at the
  Greenwich plantation, was buried there under a palmetto, and that his remains were placed
  beneath this monument in 1854. The script gives both and settles neither.
