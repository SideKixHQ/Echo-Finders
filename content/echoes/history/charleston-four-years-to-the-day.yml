teaser: "He took the flag down. Four years later, he came back with it."
script: |
  Find the flagpole, and look up. On the fourteenth of April, eighteen sixty one, Major Robert Anderson lowered the Stars and Stripes over this fort.

  It had been bombarded for thirty four hours. The fort was on fire.

  Anderson was a Kentuckian, with southern roots and a sympathy for slavery. He was chosen for this command partly for that. And he stayed loyal to the Union anyway.

  He surrendered the fort. Four years later, he came back.

  On the fourteenth of April, eighteen sixty five, Anderson stood on a platform here, with a sergeant named Hart. Together they unfurled the flag that had flown over the fort in eighteen sixty one. And they raised it again, with an evergreen wreath tied on.

  The crowd rose, cheering and waving hats and handkerchiefs. The forts and the fleet fired their guns in salute.

  Then Anderson spoke. I thank God I have lived to see this day, he said.

  That night, in a theatre in Washington, President Lincoln was shot.

  Look up at the flagpole again.

  Four years to the day. And the same night.
detail: >-
  The National Park Service page on Robert Anderson gives the lowering of the flag on 14 April 1861 after a thirty four hour bombardment that set the fort aflame, his Kentucky birth, southern roots and sympathy for slavery as reasons for his selection, his loyalty to the Union, his return on 14 April 1865 to raise the flag that flew over the fort in 1861, and his words, "I thank God I have lived to see this day". The New South (Port Royal, S.C.) of 22 April 1865, on Chronicling America, independently reports the ceremony: Anderson and Sergeant Hart unfurling and raising the flag with an evergreen wreath, the crowd rising and waving hats and handkerchiefs, the salutes from the forts and the fleet, and the speech (in slightly different words). The National Park Service Ford's Theatre pages give Lincoln's assassination that night.
