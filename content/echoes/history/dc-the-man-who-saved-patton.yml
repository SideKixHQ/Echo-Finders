teaser: "On these flats, a soldier met the man who had once saved his life."
script: |
  Look across the river at the Navy Yard. In the summer of nineteen thirty two, this flat ground on your side was a town of shacks, built by veterans of the First World War.

  They had been promised a bonus for their service, payable in nineteen forty five. Then the Depression came. They could not wait. So they came to Washington to ask for it, and camped here, thousands of them, some with their families. The owner of the land let them stay.

  The bonus failed in the Senate. And on the twenty eighth of July, President Hoover sent in the Army.

  Cavalry, tanks, tear gas. And among the officers was George Patton.

  One of the men the troops drove out that day was Joe Angelo. In the First World War, Angelo had dragged a wounded Patton into a shell hole, and stayed with him through the night. Patton said, undoubtedly this man saved my life. Then he added that Angelo's accounts of it varied from the true facts.

  That night the camp here was set on fire.

  The veterans got their bonus four years later.

  Look at this open ground again. Nothing is left of the shacks.

  Joe Angelo was driven out of Washington by the army he had served in.
detail: >-
  Who set the Anacostia camp on fire has been disputed; the Park Service panel says the infantry did, and the script says only that the camp was set on fire. The Park Service article says Angelo was among those Patton's troops routed, but not where; the script says he was driven out of Washington.
