teaser: "One of the most famous reformers in America took a job inspecting garbage."
script: |
  This old mansion on Halsted Street is Hull-House. Jane Addams and Ellen Gates Starr opened it in 1889, to help the immigrant families of the ward around it.

  Addams described the streets outside in one long breath. Inexpressibly dirty. Schools inadequate. Sanitary laws unenforced. The street lighting bad, the paving miserable, and the stables foul beyond description.

  Tenements filled the lots from street to alley. There was no trash collection, so people dumped their waste into the alleys. And those alleys were some of the only places for children to play.

  So in 1898 the mayor appointed Jane Addams as Chicago's first woman garbage inspector.

  She took it seriously. Two years later, she and Florence Kelley were mapping the ward and going door to door. And when Addams wondered whether bad plumbing was spreading typhoid, she sent Dr. Alice Hamilton to investigate. Hamilton found that house flies carried the disease.

  People remember her for big ideas. In this neighborhood, she also went looking in the alleys.
