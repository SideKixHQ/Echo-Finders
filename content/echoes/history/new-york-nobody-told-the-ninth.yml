teaser: "Someone phoned a warning to the tenth floor. Nobody told the ninth."
script: |
  Look up at this building, to the top three floors.

  On a Saturday afternoon in March, nineteen eleven, those floors were a clothing factory. About five hundred people worked there. Most of them were young immigrant women and girls.

  Near quitting time, a fire started in a scrap bin on the eighth floor. Someone telephoned a warning up to the offices on the tenth.

  Nobody told the ninth.

  By the time the ninth floor knew, the fire was there. One set of stairway doors was locked. The fire escape collapsed. The firemen's nets were useless. People jumped or fell from those windows, a hundred feet, to the street.

  One hundred and forty six people died.

  A young woman named Frances Perkins was there. She saw it.

  She spent the rest of her life on what she saw. The next year, she took a job fighting for safer factories. New York passed thirty eight new laws. And in nineteen thirty three, she became Secretary of Labor. The first woman in any American cabinet.

  Look at the memorial plaques on the corner of the building.

  The man who keeps the archive of the fire remembers what one survivor said. The immigrant parents all told their children the same thing. In America, they don't let you burn.

  After this corner, that came a little closer to true.

