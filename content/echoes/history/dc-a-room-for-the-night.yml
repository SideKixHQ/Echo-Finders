teaser: "Upstairs in this townhouse, there were beds for women the hotels turned away."
script: |
  Look at this tall Victorian townhouse. It looks like a family home. For years it was a headquarters, and something else as well.

  Before nineteen forty three, the National Council of Negro Women had no headquarters of its own. Its work was done in Mary McLeod Bethune's living room, in a series of rented apartments. Her secretary, Arabella Denniston, would fall asleep there after the last volunteer went home.

  Then Bethune heard this house was for sale. She sent her director to look at it, and moved fast. In December nineteen forty three, the Council bought it, for fifteen thousand five hundred dollars.

  Here is the turn. Washington was segregated. A Black woman travelling to the capital could not count on a hotel room. So this house kept rooms for them. Bethune's headquarters was also a place to sleep.

  Downstairs, in the front parlour, the Council received Eleanor Roosevelt, and Josephine Baker. Upstairs, a woman who had come a long way could close a door and rest.

  Look up at the windows on the upper floors.

  Somebody was safe behind them.
