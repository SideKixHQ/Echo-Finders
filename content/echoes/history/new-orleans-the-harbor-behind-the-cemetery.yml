teaser: "There is no basin on Basin Street."
script: |
  Look at the street sign. Basin Street.

  There is no basin here now. A little over a century ago, there was.

  Turn the corner at St. Louis Street, a guidebook of nineteen hundred told its readers, and the Old Basin bursts upon the view. A square of water at the end of a canal, with oyster luggers and charcoal schooners tied up along its banks, unloading.

  The canal ran from here out to Bayou St. John, and through the bayou boats could reach Lake Pontchartrain. A schooner could come in off the lake and finish its trip close under the old city ramparts.

  It was a Spanish governor's project. The Baron de Carondelet had it dug in the seventeen-nineties, to drain the swamps behind the city and to bring trade to its back door. The digging was done by gangs of enslaved men, lent free of charge by the city's wealthy.

  By nineteen hundred and four, the guidebooks noted that a railway company had bought the land along the canal, for car yards and warehouses.

  The water is gone, and so are the schooners. The street kept the name.
detail: |
  The 1900 and 1904 Picayune guides place the Old Basin between St. Claude and North
  Franklin streets, Carondelet Walk and Toulouse, with the luggers' landing on the banks
  from St. Louis Street to Toulouse. The 1913 guide dates the canal and basin to 1794-1796
  (it names the governor as Claiborne, an error; the earlier guides credit Carondelet).
