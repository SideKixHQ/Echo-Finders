id: african-burial-ground
title: What the excavation found in 1991
summary: A federal building site uncovered the largest known African burial ground in North America.
place: African Burial Ground, Duane Street, Manhattan

at: { lat: 40.71455, lng: -74.00437 }
triggerRadiusKm: 0.07

category: history
format: short
durationS: 84
visibility: at-hand
certainty: documented
minAge: 10
quality: 0.95
tags: [new-york, slavery, archaeology, memorial]

teaser: Twenty-four feet below the pavement.

script: |
  In 1991, while the ground on this block was being dug out for a federal office building, workers found graves.

  What lay beneath the block was a cemetery. For a century, from the 1690s to the 1790s, free and enslaved Africans in this city had buried their dead here, on land outside the city's northern palisade, eventually five to six acres of it. Later New York built over it, and it was lost under landfill and buildings. The Park Service puts the number buried here at over fifteen thousand.

  The remains of four hundred and nineteen men, women and children were excavated from the part that was dug. Community activism shaped what happened next, and the descendant community reached an agreement with the government on how they would be studied and remembered. The remains were studied at Howard University, then reburied here in October 2003.

  It is the nation's earliest and largest known African American cemetery. Scholars believe it exists because of a rule: in 1697, Africans were barred from burying their dead in the city's main burial ground. So they made their own, out past the edge of town.

  You are standing at the edge of town.

detail: |
  The memorial occupies a fraction of the original site; most of the burial ground remains
  under the surrounding streets and buildings. It was designated a National Monument in
  2006.

