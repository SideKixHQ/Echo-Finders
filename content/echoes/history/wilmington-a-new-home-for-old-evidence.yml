script: |
  Cape Fear Museum began in 1898. In August 2026, it opened a new downtown home on Grace
  Street.

  The county's opening announcement describes more than four hundred artifacts alongside
  history and science galleries. The move placed the museum and a new main library on the
  same downtown block.

  You are at the new building, not the museum's earlier Market Street location. Its age
  belongs to the institution; the structure before you is a recent chapter.

  That contrast is the point of the stop. Old evidence does not need an old building to
  remain valuable. It needs care, context, and people willing to examine it. The museum's
  move brings a long-running collection into a new setting where Wilmington can keep
  asking how its past connects with the present.
