teaser: "Every ship coming upriver once had to stop out there and prove nobody aboard was sick."
script: |
  Look out at the river. For decades, ships coming in from abroad had to stop out there before they were allowed any further.

  In August 1862, yellow fever reached Wilmington. It is believed to have arrived on a steamship from the Bahamas. Six hundred and fifty four people died.

  So a quarantine station was built near this town, out on the river. The one built in 1895 had ten buildings, on a foundation above the water.

  Every ship tied up at its six hundred foot dock. Anyone found to be sick had to stay on the platform, which had its own hospital.

  The ships were sprayed with sulfur from pressurized hoses, and only then went on upriver.

  Near this corner, on the river side of Bay Street, a small office ran the station's routine affairs from the shore.

  New ways of controlling disease came in 1937, and the station was left to fall apart. Fire took many of its buildings in 1951. Hurricane Hazel took the rest in 1954.

  All that was left was a concrete base that once held up a water tower. Today it is lit at night, so boats can see it.
