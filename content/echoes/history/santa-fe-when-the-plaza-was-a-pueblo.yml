teaser: "For twelve years, this Spanish plaza was a multistory pueblo with two kivas."
script: |
  Stand in the plaza and look around. Shops, trees, benches. Now picture a fortress of adobe, several stories high.

  The Spanish laid out this plaza in the spring of 1610, at a place the local Tewa people called Ogaponge. Over at the shells by the water. The Spanish forced the Pueblo people to labor for them, and insisted that they convert.

  In 1680 the Pueblos rose up. Spanish colonists took refuge in the government buildings on this plaza, and the rebels laid siege to them. The Spanish fled four hundred miles south, on foot, to El Paso.

  For the next twelve years, the Pueblo people held Santa Fe. And they rebuilt the plaza for themselves. They turned it into one large multistory pueblo, arranged around two central squares, each with a kiva.

  In 1692, the Spanish came back. The pueblo is long gone.

  But for twelve years, the oldest capital city in the United States belonged to the people the Spanish had come to rule.
