teaser: "The dog knew before anyone else did."
script: |
  Look out at the river.

  The first steamboat ever to come down it was named for the place it was heading. The New Orleans. In the autumn of eighteen eleven she set out from Pittsburgh.

  People in Pittsburgh told the builder, Nicholas Roosevelt, that he had no right to risk his wife's life. Lydia Roosevelt went anyway, and she was expecting a baby. On board were the two of them, a small crew, and an immense Newfoundland dog named Tiger. At Louisville, waiting for the river to rise, she had the baby.

  Then, in December, the earth began to shake. The New Madrid earthquakes. So powerful, the story goes, that they made the Mississippi run backward.

  At New Madrid, terrified people begged to be taken on board. There was no room and no food for them, and the boat went on. On board, people spoke in whispers. The dog prowled the deck, moaning and growling, and when he came and laid his head in Lydia's lap, they knew a bad shock was coming.

  One night they tied up at the foot of an island. All night she heard things grinding and striking against the hull. In the morning, the island was gone.

  Lydia said she lived in constant fright, unable to sleep or sew, or read.

  Look at the river again. This is where that voyage was going, all along.

  The man who wrote the story down gave the last stretch one line. From there to New Orleans, there was no occurrence worthy of note.
detail: >-
  The voyage is told by John H. B. Latrobe, Lydia Roosevelt's brother, in a paper read to the Maryland Historical Society in 1871 and drawn from her recollections; the quotations above are his and hers. The New Orleans left Pittsburgh in the autumn of 1811 and reached Natchez and then New Orleans in the winter of 1811 to 1812. Magnitude estimates for the New Madrid earthquakes differ between sources.
