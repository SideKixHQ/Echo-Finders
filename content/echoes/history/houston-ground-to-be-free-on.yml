tags: [houston, third-ward, juneteenth, emancipation, african-american-history, parks]
teaser: "This park was bought, not given, by people who had been bought and sold."
script: |
  Look across this park. Ten acres of grass and old oaks, one whole city block.

  Nobody gave it away. It was bought, by people who had once been bought and sold themselves.

  On the nineteenth of June, eighteen sixty five, a Union general landed at Galveston and read an order. All slaves are free. In Texas, slavery had held on for two and a half years after Lincoln's Emancipation Proclamation.

  The next year, Black Texans began to celebrate the day. They called it Juneteenth. In Houston, the celebration moved from place to place.

  So the churches raised the money. Three men led them. Richard Allen, a politician. The Reverend Jack Yates, of Antioch Baptist Church. And the Reverend Elias Dibble. All three had been enslaved.

  On the tenth of July, eighteen seventy two, these ten acres were sold for eight hundred dollars. The deed names nine trustees, for the Colored People of Harris County, known as the Festival Association.

  They still had to pay for it, year by year. So they rented the ground to carnivals and circuses to make the payments.

  Fifty years later, Houston segregated its parks. Until nineteen forty, this was the only public park in the city open to Black Houstonians.

  Look at the oaks again. Since the nineteen seventies, Juneteenth has come back here every June.

  They bought the ground to be free on.

