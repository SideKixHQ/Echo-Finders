teaser: "The police were standing out front. The fire started inside."
script: |
  Look at the church in front of you. It stands where another church was burned by a mob, in May of eighteen forty four.

  That spring, Philadelphia turned on its Irish Catholics. For days there had been riots up in Kensington. Houses burned. Another church burned. And on the eighth of May, a rumour went round the city. St. Augustine's would be next.

  So the mayor came, with a body of police, and stood them on the pavement right out front. A troop of cavalry waited nearby. Thousands of people gathered in the street to look at the church. There was no violence. Just low talk, and watching.

  And while the police and the crowd were all outside, somebody had got in. A light appeared inside. The fire went from pew to pew, and up into the galleries, and out through the roof. Then the steeple caught. When the cross on top fell in, people in the street cheered.

  The firemen were there. They did not turn their engines on the church. They saved the buildings next door. The Augustinian fathers' library of rare books burned with it, and some were thrown into the street and trampled.

  In the morning, only blackened walls were left. But through the broken windows, over where the high altar had been, you could still read the words written there, as plainly as the day before.

  The Lord Seeth.
