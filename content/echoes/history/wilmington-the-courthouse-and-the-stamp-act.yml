script: |
  An earlier courthouse stood at this intersection. In the 1760s, it became a focus of
  resistance to Britain's Stamp Act.

  The tax touched printed documents and provoked organized opposition in the Cape Fear
  region. The state marker's history connects the courthouse with that struggle over
  imperial authority.

  The building is gone, and the later county courthouse farther north is a different
  structure. Here, the marker identifies a political setting that ordinary traffic now
  crosses.

  Stand safely on the sidewalk and look across the intersection. Public disagreement
  needed places where people could assemble and make demands visible. Before independence,
  this corner helped supply one. The story belongs to a town still under British rule,
  beginning to challenge who could impose terms on its public life.
