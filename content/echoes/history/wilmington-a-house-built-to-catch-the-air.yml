script: |
  Look above the columns to the small structure at the top of the mansion. Its usefulness
  went beyond the view.

  Bellamy's design included a belvedere that helped ventilate the house. The museum also
  notes the deliberate placement of the kitchen to receive early daylight. The architects
  considered climate and daily work along with appearance.

  Built between 1859 and 1861, the house combined Greek Revival and Italianate elements.
  Those labels can sound abstract until you notice how the building meets its
  surroundings: shade, height, openings, and the movement of air.

  From this sidewalk, let the building become a practical invention as well as an
  expensive residence. Beauty and function shared the same plans. The comfort it offered,
  however, depended on skilled construction and the labor of people whose freedom was
  sharply unequal.
