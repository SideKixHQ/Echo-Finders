teaser: "In the churchyard across from St. Philip's stands a stone sarcophagus. For part of the war, the grave under it was empty."
script: |
  Across the street from St. Philip's Church is its western churchyard. In the middle of it
  stands a large stone sarcophagus. It holds John C. Calhoun.

  Calhoun was vice president, secretary of state, and one of the most powerful politicians
  of his age. In the Senate he led the defence of slavery, and called it a positive good. He
  died in eighteen fifty, ten years before the war his ideas helped to bring, and he was
  buried here after what one paper called the grandest pageant the city had ever seen.

  He did not stay put.

  As the war went on, it began to look as if Charleston would fall, and some in the city
  feared what would be done to his grave. So a few men decided to move him. At night, and in
  secret.

  One of them remembered being summoned from camp in the dark. When he reached the church,
  the coffin had already been dug up and carried inside. One candle. Two or three men
  standing by. In complete silence they lifted it, carried it down the middle aisle and out
  through the north door, and buried it again in another spot.

  Some time after the war, it was dug up once more, quietly, and put back. Later the state
  paid for the sarcophagus you can see.

  The plain marble slab that first covered the grave, carved with just his name, was broken
  in the earthquake of eighteen eighty-six. The church set it against the north wall of the
  churchyard, near the place where he had lain hidden.

  For a while, then, the tomb with his name on it was empty. The man who had argued the South
  toward secession spent part of the war it led to hidden, in a secret grave beside this
  church.
