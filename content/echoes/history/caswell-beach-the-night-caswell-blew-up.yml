teaser: "The worst damage this fort ever took, its own side did."
script: |
  Beyond this gate is Fort Caswell. The property is a church retreat now, private land, so this story is one to hear from the road.

  Across the river, Fort Fisher fell to Union forces on the fifteenth of January, 1865. The troops here were ordered to abandon this fort and destroy its ammunition.

  On the seventeenth of January, they blew up the powder magazines.

  A newspaper reported being woken at two in the morning by an explosion that shook its office to its foundation.

  A witness across the water, at what is now Southport, saw a vivid flash of light travel toward the fort. Then, he wrote, it was as if a mighty volcano had sprung its blazing contents from the sea into the sky. The roar smashed the glass in his house.

  The blast destroyed the entire southeast face of the fort.

  The following day, Union forces walked into the abandoned fort and took it.

  Here is the strange part. The guns of this fort often fought Union warships, all through the war, and yet not a single soldier was killed in action here.

  The worst damage Fort Caswell ever took, its own side did.
