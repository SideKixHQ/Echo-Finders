teaser: "Ten men from this small town went out to meet ships and did not come back."
script: |
  Look among the graves under these oaks for the pilots' monument. It was put up for river pilots lost at sea.

  River pilots brought ships in from the Atlantic to the ports along this river since before there were any towns here.

  In the 1870s, ten of them were lost at sea.

  The loss was terrible for Smithville, as this town was called then, and for Wilmington.

  Smithville had grown up around the fort by the river, and the fort's commander held several nights of entertainment to raise money for a monument. One was needed, he said, so that those who live after us may find the virtues and gallant deeds of their ancestors carved in the imperishable stone.

  It still stands, a memorial to every pilot lost.

  He was writing for people he would never meet. You are one of them.
