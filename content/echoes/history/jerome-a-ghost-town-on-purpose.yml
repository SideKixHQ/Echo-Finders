teaser: "When the mine closed, the few dozen people left decided to sell the one thing they still had."
script: |
  Look out over the Verde Valley, then back up at this town, clinging to Cleopatra Hill.

  Jerome grew from a settlement of tents into a roaring mining community. For a while it was known as the wickedest town in the west. It was once the fourth largest city in the Arizona Territory.

  In the 1920s, when the copper mines were at their richest, more than ten thousand people lived here. Some counts say fifteen thousand.

  The town lived by the price of copper. The Second World War pushed demand up. After the war, demand slowed. In 1953 the signature mine closed.

  That left somewhere between fifty and a hundred hardy souls. And they had an idea. If they could not sell copper anymore, they would sell the town itself. They promoted Jerome as a historic ghost town.

  It worked. By 2010 the full-time population was four hundred and forty-four, and the town fills with tourists many days of the year.

  A ghost town, on purpose. The ghosts were the business plan.
