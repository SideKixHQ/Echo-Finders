teaser: "The cannon were firing. Something was about to leave the prison."
script: |
  Look across Walnut Street, at the corner of Sixth. On a winter morning in seventeen ninety three, cannon were firing over there. Two guns, every fifteen minutes.

  Behind that corner stood the Walnut Street prison. And something was about to leave its yard. Not a prisoner.

  His name was Jean Pierre Blanchard, a French balloonist. He had once been locked in a fortress himself, for his love of freedom. Now he had hired a prison yard as his launch pad.

  At nine o'clock, President Washington arrived. Fifteen guns saluted him. Blanchard wore a plain blue suit, and a cocked hat with white feathers. At five minutes past ten, Washington handed him a paper. Blanchard sprang into a little boat, spangled and painted blue, under a balloon of yellowish silk. He threw out some ballast, and rose, waving the flag of the United States and the flag of France.

  He flew for forty six minutes, and came down across the river in New Jersey. That evening he was back, to pay his respects to the President.

  Here is the catch. He had hoped to clear nearly three thousand dollars. A huge crowd watched, but most of it stood outside the walls. He took in four hundred and five.

  Look up, above the street.

  He flew out of a prison, and came home poorer.
