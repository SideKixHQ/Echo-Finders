tags: [new-orleans, new-orleans-core, treme, st-augustine, free-people-of-color, slavery, faith]
teaser: "They did not need the short pews. So they gave them away."
script: |
  Look at the church on this corner. St. Augustine, founded in eighteen forty one by enslaved people and free people of color.

  While it was going up, people raised money all over the city to buy its pews. The point was to keep it from becoming a Black church.

  It did not work. Free people of color bought many of the pews themselves, and Black and white families ended up sitting close together.

  Much later, this parish had a priest named Father Jerome LeDoux, and anyone who met him got a history lesson. This is how he told it.

  We had one whole aisle of free people of color. They had bought those pews for their families to worship in on Sundays. They had also bought the short pews. They didn't need those, so they gave those to the slaves.

  It did not last. The old separation came back, and the way it was done was to stop renting out pews at all.

  Look at the doors of St. Augustine.

  And for the first time in their existence, the slaves had their own place of worship.
detail: >-
  The 1938 New Orleans City Guide records the pew buying and the end of pew renting, in the language of its day, without dates for either. Father Jerome LeDoux's account is his own telling, recorded by NPR; he died in 2019. The Tomb of the Unknown Slave stands on the church grounds beside you.
