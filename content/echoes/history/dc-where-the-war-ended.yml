teaser: "Look at the curved front of the Octagon, and the window above the door."
script: |
  Look at the curved front of the Octagon, the round bay with the door at its base.

  Above that door is a round room. In the winter of eighteen fifteen, it was the
  President's study.

  On the twenty-fourth of August, eighteen fourteen, British troops had burned the White
  House, the Capitol and other public buildings. James and Dolley Madison fled the city.
  When they came back a few weeks later, they needed somewhere to live.

  This house had come through. Its resident was the French minister, and the British most
  likely left it alone because of the French flag he flew. The Madisons moved in on the
  eighth of September.

  The war went on. On the eighth of January, Andrew Jackson's troops fought the Battle of
  New Orleans.

  Then, on the seventeenth of February, in the round room above the door, the Treaty of
  Ghent was signed, and the War of eighteen twelve was over.

  New Orleans had been fought before the war was over. And the war that burned the
  President out of his house ended in somebody else's.
