visibility: at-hand
certainty: documented
minAge: 0
quality: 0.8
tags: [savannah, savannah-core, oglethorpe-avenue, revolution, duels, military, signers]
teaser: "Twelve feet apart, two of Georgia's leaders raised their pistols."
script: |
  Find the tall stuccoed house at one hundred and ten East Oglethorpe. Federal surveyors in the nineteen thirties called it the oldest brick house in the city.

  The man who lived here once killed a signer of the Declaration of Independence.

  His name was Lachlan McIntosh, a general. In the spring of seventeen seventy seven, in front of Georgia's leaders, he called Button Gwinnett a scoundrel. Gwinnett had signed the Declaration the summer before. He sent a challenge.

  The next morning, the sixteenth of May, they met at the edge of town. Four paces apart. About twelve feet.

  Both fired, at nearly the same moment. Both were hit in the thigh. Gwinnett's thigh was broken, and he fell. His friend Lyman Hall, who had signed the Declaration just beneath him, wrote that the general asked if he wanted another shot. Gwinnett answered yes, if they would help him up. The seconds stepped in.

  It was a hot week. Three days later, Gwinnett was dead.

  McIntosh was indicted, tried, and acquitted. He went north to fight under Washington, and came home, and lived for years in this house.

  Look at the door. A general walked out of it every morning, past a town that remembered.

  Twelve feet. That was all the room the argument needed.
detail: >-
  Gamble (1923) says the duel ground is believed to be the area south of Colonial Cemetery, then a children's playground; the script says only "at the edge of town". HABS (1934) dates the house 1770 or 1776 and gives the first Constitutional session of the legislature here as 1783; the 1937 guide says about August 1, 1782. The script avoids the date. The 1937 guide says McIntosh "lived here for a number of years"; Gamble says he died at his home on South Broad, which is the old name of Oglethorpe Avenue.
