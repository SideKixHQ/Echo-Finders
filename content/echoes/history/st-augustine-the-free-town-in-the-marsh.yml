tags: [st-augustine, fort-mose, african-american, military, underground-railroad]
teaser: "Out in this marsh was a town of free Black families, guarding the road to St. Augustine."
script: |
  Look out over the marsh. Somewhere out there was a town that disappeared, and was not found again for more than two centuries.

  By the late 1600s, people enslaved by the British had learned something. If they escaped to Spanish Florida, embraced Catholicism and pledged to serve the Spanish Crown, they could be free.

  In 1738 the governor granted them land, about two miles north of St. Augustine. They built their own fort, with earthen walls and thatched huts. Thirty-eight men and their families. About one hundred people.

  Its full name was Gracia Real de Santa Teresa de Mosé. North America's first free, legally sanctioned Black community.

  In return for the land, its militia would help guard the northern approaches to St. Augustine. In 1740 a British army captured the fort. A few weeks later, its leader, Francisco Menéndez, led a surprise attack and took it back.

  When Spain gave up Florida in 1763, the people of Mosé moved to Cuba. The fort fell into ruin, then disappeared.

  It was not found again until 1986, when archaeologists dug it out of the marsh.

  You still cannot walk on the site itself. It is out there, under the grass and the water. The people who knew where it was had long since sailed away.
