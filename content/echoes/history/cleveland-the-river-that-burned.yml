teaser: "A short fire on a working river became a picture the whole world remembers."
script: |
  Look at the water. On a Sunday in June 1969, this river caught fire.

  Upstream, railroad bridges near Republic Steel had trapped floating debris. Oil on the water made it burn.

  A flare tossed from a passing train probably lit it.

  The fire lasted less than half an hour, and did minor damage to the bridges.

  Clevelanders were not very surprised. The river had burned more than ten times in the century before.

  Then, in August, Time magazine featured the fire. It called the Cuyahoga the river that oozes rather than flows, in which a person does not drown but decays.

  A small fire on a working river became a world symbol of water pollution.

  It did not change the laws by itself. Changes were already in motion. It just became the picture everybody remembered.
