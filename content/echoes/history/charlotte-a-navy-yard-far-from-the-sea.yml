teaser: "The Confederate navy built its engines and torpedoes on this street, two hundred miles from the ocean."
script: |
  Look around for the sea. It is about two hundred miles away, and that was the point.

  In March 1862, the Confederate navy yard at Norfolk, in Virginia, was about to be captured by Union forces.

  So the Confederacy moved its machinery here, to a railroad town in the middle of the Carolinas, far out of reach of the Union navy.

  Along this street they built a gun carriage shop, a torpedo shop, and a forge where the largest steam hammer in the South pounded away.

  About fifteen hundred men worked here. They made marine engines, shells, torpedoes and solid shot.

  One worker, Thomas Dwyer, built a machine that turned out perfectly round cannonballs.

  For most of the war, the yard felt the fighting less than any other navy yard. Its real trouble was keeping trained workers.

  Near the end, the machinery was loaded up and sent to Lincolnton. The war ended before it could be put back together.

  And the man who owned the land, Colonel John Wilkes, simply took his property back. The Confederate government had never paid him for it.

  A navy yard, two hundred miles from the sea, that never paid its rent.
