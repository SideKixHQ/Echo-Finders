teaser: "Brick and wood, clay and timber."
script: |
  Part of this waterfront was once a wharf. A big one, on the Cooper River, built by a merchant named Christopher Gadsden.

  By seventeen seventy four, Gadsden owned four stores, several merchant ships, two rice plantations, and a whole district of Charleston. The wharf had just been finished, at great cost. To pay for itself, it needed ships, and trade.

  That year he went to Philadelphia, to the first Continental Congress. And there he argued for cutting off all trade with Britain. Others wanted South Carolina's rice and indigo left out of the boycott. Gadsden did not.

  If he won, his own wharf would sit idle. He argued for it anyway.

  When nervous delegates warned that the coastal towns could be shelled, Gadsden's reply was later written down like this. Our seaport towns are composed of brick and wood. If they are destroyed, we have clay and timber enough to rebuild them. But if the liberties of our country are destroyed, where shall we find the material to replace them?

  He was ready to let the wharf stand empty. Part of it is now the site of the visitor centre beside you.
