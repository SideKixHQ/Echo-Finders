teaser: "Two men at a door, and a whole room watching to see who would go first."
script: |
  Stand beside the brick building on the corner of Sixth and Chestnut. This is Congress Hall. For ten years the House of Representatives met on its ground floor, and the Senate upstairs.

  On the fourth of March, seventeen ninety-seven, the room downstairs was packed. The country was about to do something it had never done. Hand the presidency from one man to another.

  A man named John McKoy was there, and wrote down what he saw. When the word Washington was heard at the door, he said, the shout made the hall tremble. Washington crossed the floor at a quick step, as if eager to escape notice, and sat down. Thomas Jefferson came in next, the new vice president, to a smaller cheer. Then John Adams, the new president, to a smaller one again.

  Adams read his address, took the oath, bowed, and left to applause.

  That left Washington and Jefferson standing together, and the whole room watching them in silence.

  Washington gestured for Jefferson to go out first. Jefferson declined. Washington asked again. Jefferson went, and Washington followed him out.

  He walked in as the most famous man in the country. He walked out behind the vice president.
