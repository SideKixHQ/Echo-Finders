certaintyNote: >-
  The two NPS pages differ on the 1822 plot. The church page gives 313 arrested and says the
  church was burned; the Denmark Vesey page gives 131 arrested and charged, 67 convicted,
  calls the plot alleged, and says white Charlestonians tore the church down. Both give 35
  executed. The script hedges the arrests, the plan and the destruction.
