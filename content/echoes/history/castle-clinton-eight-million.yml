tags: [immigration, new-york, forts, nineteenth-century]

teaser: Before Ellis Island, there was this.

script: |
  The round sandstone building ahead of you was built to stop an invasion that never came.

  It went up between 1808 and 1811, on the rocks off the tip of Manhattan, about three hundred feet offshore, with a bridge back to the land. Its guns never had occasion to fire on the enemy. The landfill came later. So did almost everything else it has been.

  Because in 1855 the fort became a door. In August that year Castle Garden opened as an immigrant landing depot, the first official immigrant processing center in the nation, leased to the State of New York. Over the next thirty-four years more than eight million people came through it and out into the rest of their lives. In those years, two out of every three immigrants to the United States passed through this one building.

  It closed in 1890, when the federal government took immigration over. In 1892 the work moved out to Ellis Island, where the ferries go now. The fort stayed, and became other things again: a theatre and opera house before all that, an aquarium after it.

  Eight million arrivals, and almost nobody stops here. Most people walk past it to queue for the boat.

detail: |
  The fort has had at least five lives: coastal battery, public promenade and entertainment
  hall, immigration depot, city aquarium, and finally a national monument. Jenny Lind gave
  her first American concert in it in 1850.

