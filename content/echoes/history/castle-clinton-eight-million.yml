teaser: Before Ellis Island, there was this.

script: |
  The round sandstone building ahead of you was built to stop an invasion that never came.

  It went up between 1808 and 1811, out on a small island off the tip of Manhattan, its
  guns pointed down the harbour at a British fleet everyone expected and nobody saw. The
  landfill came later. So did almost everything else it has been.

  Because in 1855 the fort became a door. On the first of August that year it opened as the
  Emigrant Landing Depot — the first immigration station in the United States, run by the
  State of New York — and over the next thirty-five years something like eight million
  people walked through it and out into the rest of their lives. Nikola Tesla came through
  here. So did Harry Houdini, and Emma Goldman, and Joseph Pulitzer.

  In 1890 the federal government took the job over, and two years later moved it to a
  bigger island further out, where the ferries go now. The fort stayed, and became other
  things again: a beer garden, a theatre, an aquarium.

  Eight million arrivals, and almost nobody stops here. Most people walk past it to queue
  for the boat.

detail: |
  The fort has had at least five lives: coastal battery, public promenade and entertainment
  hall, immigration depot, city aquarium, and finally a national monument. Jenny Lind gave
  her first American concert in it in 1850.

