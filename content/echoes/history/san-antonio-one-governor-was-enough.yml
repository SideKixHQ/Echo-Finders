teaser: "The Spanish Governor's Palace housed exactly one acting governor, and was named a century later."
script: |
  Look at the low, plain building. Its name calls it a palace. It is really a captain's house.

  In the 1730s, the commander of the Spanish fort here, Captain José de Urrutia, built himself a home and office. It was known as the Captain's House, and it housed the garrison's commanders into the early 1800s.

  In 1804, Juan Ignacio Pérez bought it. In July 1816, the Spanish Crown appointed him interim governor of Texas.

  Only one acting governor ever lived here. But that was enough.

  By the late 1800s the house was falling apart, and was used as a shop. It looked as if it might be torn down. Then the preservationist Adina De Zavala began calling it the Spanish Governor's Palace. The name stuck. The city bought the building in 1929, and restored it.

  Architectural historians now think the restored building is bigger than it was in Spanish times.

  One governor, one good name, and a house that grew a little when it was saved.
