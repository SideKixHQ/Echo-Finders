teaser: "Look at the corner house. The directory changed its name in a year."
script: |
  Look at the brick house on the corner of Fourth and Walnut. It is a modest house, a lawyer's house. For two years it was home to John Todd, his young wife Dolley, and their two small sons.

  In seventeen ninety-three, yellow fever came to Philadelphia. Thomas Jefferson wrote that about eleven people a day were dying, and that the doctors saw no way of stopping it.

  John Todd took Dolley and the boys out of the city, to Gray's Ferry on the Schuylkill. Then he went back. He had clients who needed him. In the city he found his own father and mother sick, and both of them died.

  He came back to his wife carrying the fever. The family remembered him saying he could feel it in his veins, but he must see her once more. Within hours he was dead. The younger baby died too.

  Dolley survived. Not long after, she married James Madison, who would become the fourth President.

  But first, the city directory for seventeen ninety-four lists the family's address under a new name.

  Dorothy Todd, widow.
