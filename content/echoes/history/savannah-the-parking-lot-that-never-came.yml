teaser: "A plasterer signed his work in there. It is there because somebody got angry."
script: |
  Look at the brick house on the corner of State and Habersham, with the curved double stair up to its front door. In nineteen fifty five, it was about to be knocked down, for a parking lot.

  It was built in eighteen twenty by a carpenter and builder named Davenport, and he built it for himself. He was so respected that when he died, the city gave him civic honours. Inside, a plasterer signed his work on top of an arch. George Smith, September eighteen twenty two.

  A century later, the house was worn out. Federal surveyors in the nineteen thirties marked its condition, poor. A city guide a few years later did not even know who had designed it. It said, an unknown architect. The architect was the builder who lived in it.

  Then, in nineteen fifty five, a group of Savannah women heard about the parking lot, and they were angry. They bought the house. That fight started Savannah's preservation movement. In time, it saved this house, and many others.

  Look at the stair again, and the door at the top of it.

  George Smith's name is still in there. Because somebody got angry.
detail: >-
  The sources disagree on the builder's first name: the 1934 HABS sheet gives "Isiah Davenport" and a date of 1800 to 1810, the 1937 guide "Isaiah Davenport" and before 1800, and the 1984 HABS addendum "Isaac Davenport" and 1820, citing deeds. The script avoids the first name. The house was bought in 1955 by the Historic Savannah Foundation and restored from 1956 to 1960. The George Smith inscription is recorded by HABS in 1984 and is inside the house; "still in there" relies on that record.
