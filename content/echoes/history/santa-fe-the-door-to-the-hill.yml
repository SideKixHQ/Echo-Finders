teaser: "Everyone who built the first atomic bomb walked through a little courtyard on this street first."
script: |
  Step into the little courtyard at 109 East Palace Avenue, and find the back wall. There is a modest bronze plaque.

  In March 1943, a widow named Dorothy McKibbin went to the lobby of La Fonda, on the plaza, to hear about a job. She was introduced to a man who offered her work in an office here. He did not tell her what the job would be. She took it anyway.

  The man was Robert Oppenheimer.

  The next day she learned who her employer was. A secret laboratory in the mountains, at Los Alamos, part of the Manhattan Project.

  Soon all the civilian staff, and many of the soldiers, checked in at her office first. She gave them passes, directions or a ride, and encouragement if they were tired and confused from the journey. Every day, she and her assistants sent more than sixty-five people up. Up to the secret city, known as The Hill.

  People in Santa Fe would call her about strangers wandering around town, looking lost. Usually they were looking for her office.

  The plaque on the wall says it simply. All the men and women who made the first atomic bomb passed through this portal.

  The office stayed open until Dorothy McKibbin retired, in 1963.
