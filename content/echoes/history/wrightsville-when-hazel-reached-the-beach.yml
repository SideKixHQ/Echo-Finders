teaser: "A post in the museum yard measures storms against you."
script: |
  Look for the hurricane post in the museum's side yard. It measures storms against people.

  On October 15, 1954, Hurricane Hazel made landfall near the North Carolina and South Carolina border
  as a Category Four hurricane. It arrived with the full moon of October, the highest tide of the year.

  At Wrightsville Beach, Hazel damaged five hundred and thirty homes and destroyed eighty-nine. The
  museum gives its storm surge here as twelve feet.

  Hurricane Florence is measured on the post now too. The museum's advice is simple: come and stand
  next to it, and see how massive the storm surge is.
