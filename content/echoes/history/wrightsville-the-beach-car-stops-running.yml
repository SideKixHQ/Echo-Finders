teaser: "For fifty years you came here by rail. Then one April night, the buses took over."
script: |
  Look along Lumina Avenue at the traffic, then picture the street without it.

  From 1888, a railway ran eleven miles from downtown Wilmington to this beach. It began with steam,
  and in 1902 the line was electrified. People called the trolleys the beach cars.

  Then the roads improved. Drivers could reach the beach at their own convenience, and fewer people
  rode.

  On April 26, 1940, the Wilmington News carried the headline: Beach cars to end run here today. At
  midnight, buses took over, and the rails were taken up.

  Of twenty stops on the line, one passenger station survives, a small concrete shelter in Wilmington's
  Audubon neighborhood. In 1984 a neighbor wrote to the paper, begging the city to save it before the
  wrecking ball came.
