teaser: "Across the pond is the mouth of a cave the Dakota call the Spirit House."
script: |
  Look across the pond to the foot of the sandstone bluff. That dark opening is a cave.

  The Dakota call it Wakan Tipi, the Spirit House. It was a significant place for Native Americans.

  When the explorer Jonathan Carver stopped here in late 1766, he described the inside as covered with figures cut into the soft stone.

  Later visitors did not describe them. The soft sandstone, running water and falling ceilings may have worn them away.

  Then the railroads came. They cut back the bluff to make room for tracks, and destroyed much of the cave.

  By the late 1880s this ground was an industrial area and a rail yard. It became a city park in 2005.

  The figures are gone. The cave is still there, behind the water, closed.
