teaser: "A ship made of iron slid into the river here. Six weeks later, she was fighting iron with iron."
script: |
  Look down the street toward the river. Warehouses, a few new towers, the water beyond. In eighteen sixty one, this end of Greenpoint was building something new.

  This was the Continental Iron Works. And the ship they built here did not look like a ship at all.

  She was an armored turret gunboat, nine hundred and eighty seven tons of iron. Her guns sat inside one heavy armored turret. Her designer was an engineer named John Ericsson. They called her the Monitor.

  On the thirtieth of January, eighteen sixty two, she slid into the river from this shore.

  Six weeks later she was in Virginia, at Hampton Roads. The day before she got there, a Confederate ironclad called the Virginia had destroyed two big Union warships, and killed more than two hundred and forty men.

  On the ninth of March, the Monitor met her. Iron against iron. Her launching, one account says, ushered in the era of industrial age warfare.

  The Monitor did not last the year. She foundered in a storm off Cape Hatteras, on the last day of December.

  But look at the river.

  The age of iron warships started its first voyage here.

