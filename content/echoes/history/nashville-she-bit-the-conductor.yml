teaser: "Before she was a famous journalist, Ida B. Wells lost a case in this building."
script: |
  Look up at the capitol. For decades the state supreme court sat inside it. One of the cases it heard was brought by a young teacher named Ida B. Wells.

  She was riding a train out of Memphis. The crew told her to leave the ladies' car and move to a car where a drunk man sat and other men were smoking.

  She refused.

  When the conductor tried to drag her out of her seat, she fastened her teeth in the back of his hand.

  It took him and two white passengers to remove her.

  She sued the railroad, and she won. Five hundred dollars.

  Then the Tennessee Supreme Court overturned it.

  After that, she began writing. She became one of the most important journalists in the country, and led a crusade against lynching.

  She lost here. It did not slow her down.
