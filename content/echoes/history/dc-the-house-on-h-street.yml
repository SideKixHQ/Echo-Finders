teaser: "Look at number 604 H Street. The ground floor is a restaurant and karaoke bar."
script: |
  Look at number 604 H Street. These days it is a restaurant and karaoke bar.

  In the spring of 1865 it was a boarding house, owned by a widow named Mary Surratt.

  Her son John was one of John Wilkes Booth's most capable conspirators. Booth and his men
  often met here, to plan the kidnapping of President Lincoln and, in the end, his murder.
  Two of them lodged here for a while. Andrew Johnson, who became president when Lincoln
  died, called this house the nest that hatched the egg.

  After the assassination, detectives came to arrest the people living here. While they
  were at it, one of the conspirators, Lewis Powell, turned up at the door. He had attacked
  the Secretary of State three days before, and had been wandering the city since. They took
  him too.

  Mary Surratt was tried by a military tribunal. The case against her rested mainly on one
  witness, the man who leased her tavern in Maryland. Five of the officers who tried her
  asked the president to spare her. He refused.

  She was hanged on the seventh of July 1865, the first woman executed by the federal
  government. How much she knew is still argued over by historians.

  Near the end of his own life, Johnson is reported to have called her execution a crime.
  He was the president who had declined to stop it.
