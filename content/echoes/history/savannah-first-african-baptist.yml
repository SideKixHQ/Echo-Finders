teaser: "Look at the walls. You cannot see a single brick."
script: |
  Look at the walls of this church. Smooth, pale stucco.

  Underneath it is brick. Savannah grey brick, laid four bricks deep. And the history of this building, as recorded for the federal survey, says those bricks were formed by hand at night, on the bank of the river, by members of this congregation, after they had worked a full day for the people who owned them.

  They had been worshipping on this spot since the eighteen thirties, in an old wooden church bought from a white Baptist congregation that had moved to a new building. They paid for it with money earned working nights, with their owners' permission. Often, the survey notes, it was money they had been saving to buy their own freedom, or their family's.

  In eighteen fifty five they pulled the wooden church down and began this one. It took four years. It cost more than ten thousand dollars, and it was paid off before the end of eighteen fifty nine, the year it was finished.

  It is recorded as the first brick building in Savannah owned by African Americans.

  The stucco went on in the nineteen forties. So you cannot see a single one of those bricks. They are all still there.
