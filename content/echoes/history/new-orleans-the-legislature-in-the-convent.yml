teaser: "Look through the gate in the wall along Chartres Street."
script: |
  Look through the gate in the wall along Chartres Street.

  The building behind it is two storeys of plastered brick. Its middle section steps forward under a triangular pediment, and a steep slate roof sits over the whole thing.

  It was built for the Ursuline nuns. They lived behind this wall until eighteen twenty-four, when they moved to a new convent further downriver. A city guide of nineteen-oh-four called this the oldest building in Louisiana.

  Then the empty convent found a tenant nobody would have predicted.

  In eighteen thirty-one, the State of Louisiana leased the building from the nuns. The state legislature held its sessions inside these walls. For a while, the laws of Louisiana were argued over in a house built for nuns.

  It was short-lived. The lease ran out, and the nuns gave the building to the archbishop of New Orleans. For most of the rest of the century, it was where the archbishops lived.

  That same guide told its readers to look for one thing inside. The staircase. Each step, it said, was a single massive piece of timber, worn down by the feet of many generations.

  Most of those feet belonged to nuns and priests. For one short stretch, some of them belonged to politicians.
