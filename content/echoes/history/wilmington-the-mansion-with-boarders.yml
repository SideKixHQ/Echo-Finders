teaser: "An old family home can continue by becoming something its builders never anticipated."
script: |
  An old family home can continue by becoming something its builders never anticipated.

  After William Latimer's death in 1923, Margaret Latimer took in boarders. The museum
  records that artist Elisabeth Chant later rented a room here.

  That shift brought additional lives into a house strongly identified with one family.
  Private rooms became lodgings; a formal residence gained a practical way to keep
  operating.

  Look at the windows from Third Street. They do not reveal which occupant belonged to
  which period. A mansion can conceal a boarding house in plain sight, because a changed
  use does not always require a changed facade.

  The house survived partly through adaptation. Its story is therefore more than an
  account of affluent beginnings. It also includes the choices that allowed a large, aging
  building to remain useful.
