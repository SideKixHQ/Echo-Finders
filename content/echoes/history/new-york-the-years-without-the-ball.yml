teaser: "Twice, the biggest party in the world welcomed the new year in silence."
script: |
  Look up at the narrow building at the bottom of the square, and the pole on its roof.

  Every New Year's Eve since nineteen oh seven, a lit ball has come down that pole at midnight. Every year but two.

  It began with fireworks. When the newspaper moved into this building, its owner, Adolph Ochs, threw a party here with fireworks. Two years later, the city banned them.

  So Ochs asked his chief electrician, Walter Palmer, for something else. A ball of iron and wood, seven hundred pounds, with a hundred light bulbs. A young immigrant metalworker named Jacob Starr built it. It was lowered by hand, with rope.

  At ten minutes to midnight, the paper reported, every boiler whistle in the city began to screech. Tens of thousands stood watching the ball. And then it fell.

  Then came the Second World War, and a dimout. The lights of the city had to be dimmed.

  In nineteen forty two, and again in nineteen forty three, there was no ball.

  The crowds came anyway. And at midnight, in the middle of all these people, there was a minute of silence. Then chimes.

  Look up at the pole again.

  Twice, this square welcomed the new year by saying nothing at all.

