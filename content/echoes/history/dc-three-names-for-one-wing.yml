teaser: "Look at the brick wing that runs back from Decatur House along H Street."
script: |
  Look at the brick wing that runs back from Decatur House, along H Street.

  It has been described three different ways.

  In nineteen-oh-three, a newspaper story about this house put it plainly. On H Street, it
  said, is a long addition, formerly slave quarters.

  A federal survey of the building chose a gentler phrase. Grouped around the garden, it
  says, are the original servants' quarters, stables and carriage houses.

  In twenty eleven, historians began a new study of the wing. The report that came out of
  it, filed with that same federal survey, calls it the slave wing.

  Now turn around and look at the park. The National Park Service keeps a list of what that
  ground has been used for. A race track. A graveyard. A slave market.

  Three names for one wing. The newspaper had it right the first time.
