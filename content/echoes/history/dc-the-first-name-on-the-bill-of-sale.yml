teaser: "One building on this campus carries the name of a man the college sold."
script: |
  Look up at the grey stone towers of the university. In eighteen thirty eight, the college here was deep in debt. It might not have survived.

  The Jesuit priests who ran it found the money in people. They sold two hundred and seventy two enslaved men, women and children from their plantations in Maryland, to plantations in Louisiana. The sale brought in one hundred and fifteen thousand dollars. It saved the school.

  The priest responsible for the sale was Father Thomas Mulledy, a president of the college. And his orders said families were not to be split up. He broke up families anyway.

  For a long time, one of the buildings here carried his name. Mulledy Hall.

  In twenty seventeen, the university changed it. They chose the first name on the bill of sale. Isaac Hawkins. He was sixty five years old, and he was sold with his family.

  The university said it chose the name Isaac on purpose. In the Bible, God told Abraham to sacrifice his son Isaac, and spared him at the last moment.

  Look at the hall that carries his name.

  In eighteen thirty eight, Isaac was not spared.
