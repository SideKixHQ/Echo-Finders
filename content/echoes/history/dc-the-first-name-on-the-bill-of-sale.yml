detail: >-
  The figure of $115,000 is from an alumnus researcher quoted by CBS; NPR gives "more than $3 million today". That Mulledy broke up families "in violation of his orders" is Georgetown president John DeGioia's statement to NPR. The renaming and Hawkins's age and family are from NBC's report of the 2017 dedication.
