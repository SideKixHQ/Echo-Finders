teaser: "Steamboats could go no further than here. Then the trains came."
script: |
  Look at the river. For steamboats, this was the end of the road.

  Above Saint Paul the river falls more than a hundred feet in about fifteen miles, through a narrow gorge full of boulders. Too treacherous for steamboats.

  So Saint Paul became the head of navigation.

  In 1844 the town counted forty-one steamboat arrivals. By 1857 it had more than a thousand a year.

  A local newspaper reported that passengers and freight overflowed from every steamboat that arrived.

  Then the railroads came, and the lower landing became a railroad terminal.

  In 1875 a Saint Paul historian, J. Fletcher Williams, summed it up.

  The opening of navigation has ceased to be of any importance or interest. Our railroads have changed all that.
