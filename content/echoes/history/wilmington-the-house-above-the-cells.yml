teaser: "The neat doorway and Georgian proportions tell a story."
script: |
  The neat doorway and Georgian proportions tell a story. The walls underneath tell
  another.

  John Burgwin's house was built in 1770 on the remains of Wilmington's first jail,
  which dated to about 1744. Parts of the older structure became part of a merchant's
  fashionable residence.

  It was a dramatic change in use. A place designed to restrict movement became a place
  designed to display wealth and receive guests. Yet rebuilding did not erase everything
  that had been there before.

  From the public sidewalk, look at the house as a layered object. The older history can
  sit below the features that catch your eye. An authorized visit makes that contrast
  more tangible: beneath a domestic setting survive reminders of the town's earlier
  system of confinement.
