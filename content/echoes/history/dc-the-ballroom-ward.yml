teaser: "Look up at the columns on the F Street front."
script: |
  Look up at the columns on the F Street front. On the sixth of March 1865, guests climbed
  to that portico for Abraham Lincoln's second inaugural ball.

  It was the first time a government building had been used for one. The great hall
  upstairs was the largest empty room in the city for dancing.

  One of the clerks in the building went up to look while it was being made ready. His name
  was Walt Whitman, and he wrote down what he saw.

  Earlier in the war, this building had been a military hospital. Whitman remembered these
  same rooms filled with the worst wounded of the war, brought in from Second Bull Run,
  Antietam and Fredericksburg.

  Tonight, he wrote, beautiful women, perfumes, the violins' sweetness, the polka and the
  waltz. Then, the amputation, the blue face, the groan, the glassy eye of the dying. And
  many a mother's son amid strangers, passing away untended.

  By midnight on the night of the ball, there were more than four thousand guests.

  The building is an art museum now. Whitman saw both of its nights in the same rooms, a
  little over two years apart.
