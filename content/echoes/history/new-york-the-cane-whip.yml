teaser: "The calm general of the statues. Not on this day."
script: |
  Look east, down the street toward the river. Before landfill and highways, the shore curved in near here to make a cove. Kip's Bay, named for the Dutch farmer whose land ran down to it.

  On the fifteenth of September, seventeen seventy six, that cove filled with British warships.

  The American army had just been beaten on Long Island. The men were worn out and frightened. And when the warships opened fire, they broke. They fled north.

  George Washington went into the middle of it, trying to stop them.

  What happened next was told very differently from the calm, marble Washington of the statues. One biographer, Rupert Hughes, put it this way. He used the cane whip he carried, and he beat his people over the shoulders. He flogged not only private soldiers but officers as well. He lashed colonels across the shoulder blades. He flailed a brigadier general.

  But the next day, at Harlem Heights, Washington rallied them, and they beat the British back.

  Look east again.

  The marble general you know was made after. This is where he lost his temper.

