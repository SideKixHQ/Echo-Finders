script: |
  The Bellamy family had barely begun living in this house when Wilmington's circumstances
  changed.

  During the yellow fever epidemic of 1862, the family left the city and took refuge at
  Floral College. A residence meant to secure status and comfort could not protect its
  occupants from the city's public-health disaster.

  This house is the family's associated site, not the place to which they escaped. The
  epidemic extended far beyond one household, and leaving was not an option available
  equally to everyone.

  Look at the imposing exterior. It can suggest permanence, but the first years of its
  domestic life were disrupted almost immediately. The story turns on that mismatch: a
  carefully planned new home meeting a crisis its plans could not contain. Its owners
  departed; the larger city still had to endure the outbreak.
