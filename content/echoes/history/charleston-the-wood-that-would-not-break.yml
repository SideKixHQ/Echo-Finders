# Listening spot: The sand in front of Fort Moultrie's seaward wall on Sullivan's Island, looking out at the harbour channel where the British ships anchored.
# Position: South of the present Fort Moultrie on the beach path, from the fort's published position (medium confidence). The 1941 state guide says the first fort's site is about 100 yards out in the harbour.
id: charleston-the-wood-that-would-not-break
title: "The Wood That Would Not Break"
summary: "In June 1776 nine British warships attacked a half-built fort of palmetto logs here. The logs swallowed the cannonballs."
place: "Fort Moultrie, seaward side, Middle Street, Sullivan's Island, South Carolina"
