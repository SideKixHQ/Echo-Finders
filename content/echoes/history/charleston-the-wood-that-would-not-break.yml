tags: [charleston, sullivans-island, fort-moultrie, revolution, military, palmetto]
teaser: "A fleet against a pen of logs. Guess which one broke."
script: |
  Look out at the channel, where the harbour meets the sea. Now picture nine British warships lined up out there, and behind you, a fort that was not even finished.

  It was the twenty eighth of June, seventeen seventy six. The fort was two square pens of palmetto logs, bolted together, with sand packed between them. Part of it had never been built.

  The ships opened fire, and kept it up all day. And the strangest thing happened. The fort barely suffered.

  The shot sank into the soft, spongy palmetto logs. They did not shiver or break. Shells dropped into a little swamp in the middle of the fort, and sank harmlessly away.

  The man in command was Colonel William Moultrie. He was so short of powder that he had to write to town for more. Still, his gunners aimed at the biggest ships, and the flagship was almost torn to pieces.

  After a nine hour battle, the fleet pulled back. Charleston was saved, and the fort was named for him.

  The palmetto went on the state flag. And the first fort itself? Its site is now about a hundred yards out in the harbour. Look at the low palmettos along this shore. Moultrie explained the whole thing in one line.

  They did not know the resisting quality of our Palmetto Wood.
detail: >-
  Ravenel (1906) describes the fort as a double square pen of palmetto logs filled with sand, partly unfinished, and quotes Moultrie on the resisting quality of palmetto wood. The National Park Service gives the date, nine men of war and the nine hour battle. The link between the battle and the palmetto on the state flag is widely told but is not in these sources, so the script states only that the palmetto is on the flag.
