teaser: "Most of the pilots who ran the blockade lost everything. One of them built a house."
script: |
  Look along this side of the street for a house with a small cupola on the roof.

  When the town's historic houses were surveyed, it was the last cupola left on any house in Southport.

  It was built by a blockade runner.

  In the Civil War, Union warships sat off the mouth of the Cape Fear River to cut the Confederacy's trade. Many of this town's river pilots volunteered to run ships past them.

  They were admired for it. And all too often, the runner lost his ship, his life, or both.

  Thomas Thompson was one of the few pilots from here who made a success of it. Shortly after the war, he built this house.

  Most of the pilots who tried it lost their ships, their lives, or both.

  He got a house, with a little lookout on top.
