teaser: "The railroad remembered here did not begin with the name Wilmington and Weldon."
script: |
  The railroad remembered here did not begin with the name Wilmington and Weldon. It was
  originally chartered as the Wilmington and Raleigh Railroad.

  Its completed route reached Weldon instead of the state capital. The later name
  reflected the connection that actually existed rather than the destination first
  imagined.

  That small naming change contains a larger lesson about infrastructure. A plan on paper
  is a proposal; a working line is the result of decisions, geography, financing, and
  construction.

  Look at the name on the marker. It records the outcome, while the earlier title
  preserves the ambition. The city's future was not delivered in a straight line from
  idea to result. The railway became important through the route that could be built, and
  the city learned to use the connection it obtained.
