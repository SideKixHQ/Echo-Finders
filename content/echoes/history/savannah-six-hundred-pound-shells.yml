teaser: "The rooms inside were built for shells that weighed six hundred pounds each."
script: |
  Look at the low, grassy mound of concrete in front of you. It does not look like much. It was built not to.

  It was built to hide one enormous gun.

  In eighteen ninety five, the army ordered a new fort on this end of the island, Fort Screven. Not a brick castle like Fort Pulaski across the water, which rifled cannon had already made obsolete. Low concrete batteries instead, six of them, and a minefield in the river.

  This one, Battery Garland, held a long range gun with a barrel twelve inches across. Inside, the rooms stored its shells, six hundred pounds each, and the powder to fire them, in two hundred pound bags.

  Soldiers trained and stood guard here through the Spanish American War, the First World War and the Second. In nineteen forty seven the fort closed. In nineteen sixty one, the magazine became the island's museum.

  Look at the mound again.

  The rooms that held six hundred pound shells now hold the island's memories.
detail: >-
  All facts from the NPS Tybee Island page: Fort Screven ordered in 1895; six low profile poured concrete gun batteries and a minefield; 1897 to 1947; Battery Garland "the former gun battery and magazine for a 12 inch long-range gun"; rooms that "once stored six hundred pound projectiles and two hundred pound bags of gun powder"; the museum in 1961. The 1937 guide calls Fort Screven "an active Army post". The mound's appearance is to be confirmed on site.
