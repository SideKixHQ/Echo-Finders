teaser: "The people who started it were the ones who buried it."
script: |
  Look up at the street signs on this corner. Haight, and Ashbury. In nineteen sixty seven, thousands of young people came to this neighbourhood, for what was called the Summer of Love.

  A group called the Diggers was here first. They were actors, artists and anarchists, and they saw this place as somewhere they could transform society.

  The Diggers ran a free store. They gave away free food. On Haight Street there was a free clinic.

  By midsummer it was falling apart. Grass and acid had given way to heroin and speed. Most of the bands, and the original hippies, moved out to the country.

  So on the sixth of October, nineteen sixty seven, the Diggers held a funeral. A mock funeral, with a coffin. On the coffin it said: Hippie, Son of Media.

  The Summer of Love was over. The people who had started it were the ones who buried it.

  Look around the corner now. The tourists still come, looking for the hippies.
detail: >-
  NPR (2017) gives the date, 6 October 1967, the Diggers as counterculture purists, the mock funeral and the coffin labelled "Hippie, Son of Media", and the collapse by midsummer, with heroin and speed, and the bands and original hippies leaving for more pastoral settings. CBS News gives the Diggers as actors, artists and anarchists, their free store, free food and the free clinic on Haight Street, and the October 1967 mock funeral. NBC News (2009) gives the "death of the hippie" funeral that fall and the thousands of hippies in the 1960s, and describes tourists at Haight and Ashbury. NBC says "residents" held the funeral; NPR and CBS name the Diggers, and the script follows them. "The people who started it" is a reading of CBS's account of the Diggers at the heart of the Haight; a reviewer may prefer softer wording.
