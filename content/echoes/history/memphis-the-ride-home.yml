teaser: "He survived two years of war and eight months in Andersonville. Then he boarded a steamboat here."
script: |
  Look up the river, to the north. In April 1865 a steamboat called the Sultana left Memphis going that way, carrying Union soldiers home from the war.

  More than nineteen hundred of them were men just released from prison camps.

  One was Private Valmore Lambert, a farmer from Ohio.

  He had fought through two years of the war. He was captured near Atlanta, and he survived eight months in Andersonville, the prison where more than thirteen thousand Union soldiers died.

  The Sultana was overloaded, far beyond what it should have carried. Before leaving, the captain had a leaking boiler patched instead of properly repaired, because a repair would have taken more time.

  On the twenty-seventh of April, heading north from Memphis, three of its four boilers exploded.

  More than a thousand men died. It is still called the worst maritime disaster in American history. No one was ever held accountable.

  Valmore Lambert was among them. Where his remains are, nobody knows.

  The bodies that were found were buried at Fort Pickering, and later moved to the Memphis National Cemetery.

  He made it through the war, and through the prison. It was the boat home that killed him.
