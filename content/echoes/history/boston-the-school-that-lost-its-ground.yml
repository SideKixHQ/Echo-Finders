tags: [boston, boston-core, freedom-trail, education, latin-school, benjamin-franklin]
teaser: "This street is named after a school that is not here."
script: |
  You are on School Street. It is named after a school that is not here.

  Find the bronze statue of Benjamin Franklin, set back from the sidewalk. Close by, in the
  sixteen thirties, the town of Boston started its first school. The Latin School. A plain building of one storey, big enough for about a hundred pupils.

  Now look up the street, toward the dark stone church on the corner. That is King's Chapel.

  In the seventeen forties the chapel wanted to rebuild, bigger. It needed more ground, and
  part of that ground had the schoolhouse on it. After a good deal of haggling, the church
  built the school a new house on the other side of the street, and took the old site.

  The town was not pleased. A local wit put it in verse. A fig for your learning, I tell you
  the town, to make the church larger, must pull the school down.

  In time the school moved on again, away from this street. The street kept the name
  anyway.

  As for Franklin. He started here at eight years old, and he lasted one year.

  Of everyone who ever studied on this street, he is the one who stayed.
