teaser: "In 1941 the army came back to Fort Fisher, and built an airstrip through it."
script: |
  Notice the road. U.S. 421 runs right through the sandy ruins of what was once the
  fort's land front.

  Training at the Fort Fisher range began in October 1941. It became the main firing range
  for an anti-aircraft training camp, and planes towed targets back and forth above the beach
  while the gunners below fired at them.

  Then the army built a large airstrip here. It destroyed a sizable portion of the land front
  of the old bastion, by then eighty years old.

  Nobody pretended otherwise. Most of the trainees knew where they were, and the camp's own
  literature celebrated the fort's past. National defense simply came first.

  Preservation came later, and found less to preserve.
