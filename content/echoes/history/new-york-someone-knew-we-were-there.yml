teaser: "Trapped on the seventy ninth floor, she threw her rings out of the window."
script: |
  Stand on the street and look up this building, high up, toward the top.

  On a foggy Saturday morning in July, nineteen forty five, an army bomber came down out of the clouds over Midtown. The pilot found himself flying among skyscrapers. He flew into this one, at the seventy eighth and seventy ninth floors.

  Fourteen people died.

  The crash cut the cables of two elevators. In one of them was a nineteen year old operator, Betty Lou Oliver. She fell seventy five stories, all the way to the bottom of the shaft. She broke her pelvis, her back and her neck. And she lived.

  Up on the seventy ninth floor, Therese Fortier Willig was twenty years old. Six of them got into one office and shut the door against the fire. Somebody opened the window.

  She thought about her rings. She thought she would not be around to have them. So she took them off, she said, and threw them out of the window. Someone else might as well have use out of them.

  Then a man down on the street saw them, and signalled up. Stay where you are.

  She remembered how that felt. We all felt a little better, she said, to know that someone knew we were there.

  Firemen came. She climbed out through the broken glass.

  Look up again, from down here.

  Somebody on this street once looked up, and let them know they were not alone.

