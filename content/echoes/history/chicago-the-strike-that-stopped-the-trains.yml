teaser: "A strike at this factory stopped trains across the whole country."
script: |
  Look at the clock tower. It was the Pullman Company's administration building, the center of a factory and of a whole company town, built for the workers who made Pullman's sleeping cars.

  On the eleventh of May, 1894, the workers here went on strike.

  The company tried to wait them out. So their union, the American Railway Union, went national. Its members would refuse to handle Pullman cars. Because Pullman cars were in such wide use, the boycott crippled rail traffic across the country.

  The railroads answered by hitching Pullman cars to mail cars. Holding up the United States mail gave the federal government its opening. Thousands of U.S. marshals and Army troops were sent in. National Guard troops were stationed at the Hotel Florence, the company hotel just south of this tower.

  Fighting at rail yards around Chicago left dozens dead. The boycott dissolved in the middle of July, and the union was defeated.

  George Pullman never seemed to doubt his model town. When he died in 1897, tons of steel and concrete were placed over his casket, so that labor radicals could not get at the grave.
