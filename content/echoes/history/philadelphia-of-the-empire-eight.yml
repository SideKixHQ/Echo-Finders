teaser: "Look up under the eaves. The building gives two dates."
script: |
  Stand on Arch Street and look up at the side of this small brick meeting house, high under the eaves. There is a stone tablet set into the wall.

  It says the house was erected by general subscription, for the Free Quakers, in seventeen eighty-three. Then it gives a second date. Of the Empire, eight.

  Quakers do not fight. During the Revolution most Philadelphia Friends would not take up arms, pay war taxes, or swear an oath of allegiance. Some members broke with that. They served in the army, sat on the committee of safety, took seats in the legislature.

  The Society of Friends disowned them. Read them out of meeting, as it was called.

  So they started their own. They called themselves the Free Quakers, and people called them the Fighting Quakers. They paid for this house by subscription, and one of the people who gave was Benjamin Franklin, who was not a Quaker at all.

  As for the Empire. A Philadelphia newspaper told a story about it in nineteen eighteen. When the stone was being set, someone asked one of the Free Quakers what the words meant. I tell thee, friend, he is supposed to have said, it is because our country is destined to be the great empire over all the world. That is the story, as the newspaper told it, well over a century later.

  After the war, some of the fighters made their peace with their old meetings and went back. By the eighteen thirties, services here had stopped.

  They dated their building from the birth of a country. The country lasted. The congregation did not.
