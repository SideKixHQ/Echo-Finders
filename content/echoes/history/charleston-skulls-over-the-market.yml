teaser: "Look up under the roof of the Market Hall. Those shapes are skulls."
script: |
  Look up at the band of decoration under the roof of the Market Hall. Those shapes are
  skulls. Bulls, and sheep.

  They are an advertisement. This was a meat market.

  The land was given to the city for a market in seventeen eighty-eight, and after a great
  fire the hall and the long open sheds behind it went up in eighteen forty and forty-one.
  Every day, meat and produce came in from the rural communities nearby. The rules were strict. Cuts and weights were regulated. Vendors had to wear clean white aprons. And vendors had to bring only fresh goods, so whatever was left at the end of the day was thrown into the street.

  Which is where the market's other workers came in.

  Buzzards cleaned the streets around the market, and Charlestonians valued the service so
  much that the birds were protected by law. People called them Charleston eagles. A
  visiting reporter in eighteen seventy-four watched one pick the street clean, then fly up
  to sit on the market-house roof, protected, he wrote, like any official of the city.

  You may have heard that these sheds were a slave market. The record puts those sales
  somewhere else. Charleston sold enslaved people at the Exchange, and after eighteen
  fifty-six in private marts on Chalmers, State and Queen streets.

  These sheds were built to sell beef. One of the buildings built to sell people is still
  standing, a few blocks south of here, on Chalmers Street.
