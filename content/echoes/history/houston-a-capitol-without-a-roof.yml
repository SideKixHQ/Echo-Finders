teaser: "Houston was a national capital before it had roofs. The Congress met here in the rain."
script: |
  Look at the old hotel on this corner. Before it was a hotel, this was the capitol of a country. The Republic of Texas.

  And for its first weeks, the capitol had no roof.

  In the spring of eighteen thirty seven, Houston was a few months old. The Allen brothers had promised Congress a building if it made their town the capital, and Congress said yes. Then the lumber, ordered from Maine, failed to arrive.

  So a contractor, Thomas Ward, talked carpenters out of the town's saloons and started a one storey building on Main Street.

  By the first of May, when Congress met, it still had no roof. Branches were cut and fastened along the ridgepole.

  On the fifteenth of May, a visitor came to look around. John James Audubon, the painter of birds. The capitol, he wrote, was yet without a roof. The floor, the benches and the tables of both houses of Congress were as wet as his own clothes had been that morning.

  The hammering went on during sessions. A member asked that Major Ward be told to stop work that disturbed Congress. The motion was rejected.

  Two years later, the government moved to Austin, and this corner became a hotel site.

  Look up at the hotel. A country's laws were once made here, under branches.

  And the work went on through the debates.

