teaser: "Look up at the spire on the corner. Bostonians have called this spot Brimstone Corner for more than a century."
script: |
  Look up at the spire on the corner. This is Park Street Church, and for more than a
  century Bostonians have called this spot Brimstone Corner.

  Nobody quite agrees why.

  The first story is about sermons. The church was founded in eighteen-oh-nine, as much of
  Boston was turning Unitarian, and its early ministers preached the old orthodox faith at
  full heat. Newspapers around nineteen hundred said the name came from the first of them,
  Edward Dorr Griffin. One old Boston joke went like this. The Unitarians had managed to
  freeze over hell, and this congregation broke a hole in the ice and let the flames up
  again.

  The second story is about the cellar. A Boston historian, in a book about Park Street
  published in the early nineteen-twenties, said the sermons had nothing to do with it.
  During the War of eighteen twelve, he said, brimstone for making gunpowder was stored in
  the building.

  Brimstone is sulphur. It goes into gunpowder, and it is what hell is supposed to smell of.

  So the corner got its name from the pulpit, or from the basement. Either way, it was the
  same smell.
