teaser: "They call it the Witch House. No witch lived here. A judge did."
script: |
  Look at the dark house with the steep gables. People call it the Witch House. No witch ever lived in it.

  It was the home of Jonathan Corwin, a judge.

  In 1692 he sat on the special court that heard the witchcraft cases.

  It had begun on the first of March, when Salem authorities questioned three women. Within months more than a hundred and fifty people had been jailed.

  The court Corwin sat on sentenced nineteen people to death.

  By the end of October the governor had shut the court down. Nineteen years later a law restored the good names of the accused.

  The house has moved since then. When the street was widened in the nineteen forties, it was shifted about thirty-five feet.

  The judge's house is the only building in Salem with a direct tie to the trials. It still carries the wrong name.
