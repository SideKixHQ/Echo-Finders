teaser: "The country's first hospital, and part of the bill was paid by the Prince of Denmark."
script: |
  Look through the iron fence on Pine Street. On the lawn there is a small statue of William Penn, and behind him a long building of brick and marble, with an eight-sided cupola on each wing.

  This is Pennsylvania Hospital. Benjamin Franklin and a doctor named Thomas Bond founded it in seventeen fifty-one, and it is the oldest hospital in the United States. The east wing went up in the seventeen fifties. Franklin wrote the words for its cornerstone. Piously founded, they say, for the relief of the sick and miserable.

  A hospital needs money. This one took it from nearly everyone. Private citizens gave. The preacher George Whitefield sent a large sum.

  Then, in seventeen fifty-nine, a company of actors put on Hamlet for the hospital's benefit.

  That was thought quite shocking. Plays did not have the approval of the best people, and the managers had to decide whether they could take money earned on a stage.

  They decided the hospital's charter gave them no right to refuse it.

  Hamlet brought in forty-seven pounds, two shillings and sixpence.

  Look at the building again. The first hospital in the country. And a small part of its bills was paid by the Prince of Denmark.
