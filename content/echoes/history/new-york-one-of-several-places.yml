quality: 0.9
tags: [new-york, midtown, grand-central, revolution, military, nathan-hale, spies, plaques]
teaser: "Read the plaque. Then ask how many other plaques say the same thing."
script: |
  Find the bronze plaque on the corner of this building, at Forty Fourth Street and Vanderbilt Avenue. Read it.

  At the British Artillery Park near this site, it says, Nathan Hale was executed on the morning of September twenty second, seventeen seventy six. And it gives his last words. I only regret that I have but one life to lose for my country.

  It is a fine plaque. It may be in the wrong place.

  Hale was twenty one, a captain in the Continental Army. He volunteered to slip behind British lines and spy. He was caught.

  What we know for certain comes from the British side. An orderly book says he was taken the night of the twenty first, confessed, and was hanged the next day at eleven in the morning.

  Where? Nobody knows. New York's city guide of nineteen thirty nine pointed to a tablet on a meat packing plant, at First Avenue and Forty Sixth Street. There is another plaque at Fifty First and First, and another at Sixty Sixth and Third. Each one says, near here.

  And the words? A historian at the Library of Congress put it plainly. There is no contemporary evidence that Hale uttered these exact words. Nineteenth century writers gave them to him, and made him a martyr.

  So stand by the plaque, and read the words again.

  They may not have been his. They have been ours ever since.

