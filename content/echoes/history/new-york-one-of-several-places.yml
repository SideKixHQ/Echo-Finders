certaintyNote: >-
  Hale's capture and hanging on 22 September 1776 are documented. Where he was hanged is disputed: this 1954 plaque says near here, the Federal Writers' Project guide of 1939 points to First Avenue at 46th Street, and CBS New York lists further plaques at 51st and First and at 66th and Third. His famous last words are also disputed: the Library of Congress Information Bulletin (2003) says there is no contemporary evidence he spoke them. The script says out loud that both are uncertain.
