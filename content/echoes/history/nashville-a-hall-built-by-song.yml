teaser: "Eleven students went on tour and sang this building into existence."
script: |
  Look at the tall Victorian Gothic hall. Six stories, built in an L. This is Jubilee Hall.

  Fisk opened in 1866, in the years right after the Civil War, with help from the Freedmen's Bureau.

  In 1871, a chorus of students, seven women and four men, went on tour to raise money. The big northern cities first, then Europe and the British Isles.

  They sang. And what they brought home was enough to buy the land for this campus, and build this hall.

  Ground was broken on New Year's Day, 1873. The hall was dedicated on New Year's Day, 1876.

  Some of the black walnut furniture inside was a gift from friends in Great Britain.

  It is the oldest permanent building for the higher education of Black students in the United States.

  Eleven students, singing. This is what the songs bought.
