teaser: "In 1954 this beach had three hundred and fifty-seven buildings. One morning it had five."
script: |
  Find the state highway marker beside the road here. It is for a storm.

  On the fifteenth of October, 1954, Hurricane Hazel came ashore in southern Brunswick County, on a full moon high tide.

  This beach was a town called Long Beach then. A storm surge of seventeen feet swept across the island.

  There were three hundred and fifty-seven buildings on the island. The surge took three hundred and fifty-two of them.

  Grass covered sand dunes, ten to twenty feet high, simply disappeared.

  The marker calls it the greatest coastal flood in North Carolina's recorded history. Hazel is still the storm every hurricane here is measured against.

  Five buildings were left standing. Count the houses on this one street, and you will already have counted more than survived.
