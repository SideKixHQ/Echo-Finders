teaser: "The little fort across the water is newer than the name of the river it guards."
script: |
  Look across the river at the little stone fort. It is almost two hundred years newer than the name of this water.

  The name is Matanzas. In Spanish, it means slaughters.

  In September 1565, a French fleet sailed to wipe out the brand new Spanish settlement at St. Augustine. A hurricane caught the ships and wrecked them far down the Florida coast.

  The survivors walked north, trying to get back to their own fort. An inlet near here stopped them.

  The Spanish commander, Pedro Menéndez, marched down with seventy soldiers. He told the French their fort had already been captured, and urged them to surrender. He made no promises. They had lost most of their food and weapons in the wreck, and they gave up.

  One hundred and eleven Frenchmen were killed. Sixteen were spared, among them a few who said they were Catholic, and four craftsmen the new town needed.

  Two weeks later, more survivors reached the inlet, among them their commander, Jean Ribault. On the twelfth of October they surrendered too. This time, one hundred and thirty-four were killed.

  Why? Orders, religion, or something colder. With no new supplies until spring, there may not have been food for everyone.

  The fort came much later. The name never left.
