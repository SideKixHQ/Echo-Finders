teaser: Look up at the spire.
script: |
  Look up at the spire.

  For forty-four years that was the highest point in New York. Not the tallest church — the
  tallest anything. Ships coming into the harbour saw it before they saw the city.

  It went up in 1846. Two hundred and eighty-one feet, and nothing in this city passed it
  until 1890.

  Which means there was a stretch of time, right here, when the largest thing people in New
  York were willing to build was somewhere to pray.

  What passed it was a newspaper office. What passed that was an insurance company. Then
  the banks arrived, and they have not stopped.

  Alexander Hamilton is buried in the yard on your right. He was killed in 1804, so he
  never saw this building — he is lying beside the third church on this spot, in a
  graveyard that outlasted two of them.
