teaser: "This city is named after a man, minus one letter a newspaper could not fit."
script: |
  Look down at the river.

  On the twenty-second of July, 1796, a party of surveyors working for General Moses Cleaveland arrived at the mouth of the Cuyahoga.

  They believed it was an ideal place for a new town, and named it for him.

  His land company had three and a half million acres to sell.

  The town did not grow much until the Erie Canal was finished in 1825.

  Then, in 1831, a newspaper had a problem. The Cleveland Advertiser dropped the first a from the name, to shorten its masthead.

  From then on, the town was Cleveland.

  The founder's name lost a letter, to save room on a newspaper.
