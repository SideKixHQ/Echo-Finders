teaser: "For most of its life, this town lived on what one lookout could see."
script: |
  Look up at the steel tower on the river side of the street. It is a lookout, and for most of this town's life, what the watchman saw from up there was the town's living.

  Ships coming in from the ocean had to get past dangerous shoals at the mouth of the river. The men who took them through, and on up to the port of Wilmington, were the river pilots of this town.

  If a man here was not a pilot, he was most likely a pilot's apprentice or a seaman.

  When a ship was seen nearing the mouth of the Cape Fear River, the tower watchman sent a pilot boat out to bring her in.

  The first tower was wooden, eighty feet tall. This steel one replaced it in the 1940s.

  The building at its foot is still a dispatch site for the river pilots.

  From 2013 to 2015 it had a second job, on television, as the radio station in Under the Dome.

  The rest of the time, it has been watching for ships.
