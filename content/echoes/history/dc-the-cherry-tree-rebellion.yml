teaser: "Stand on the steps of the Jefferson Memorial and look at the cherry trees along the shore."
script: |
  Stand on the steps of the Jefferson Memorial and look at the cherry trees along the
  shore.

  In November 1938, this ground was about to be cleared for the building behind you. Some
  of the cherry trees were in the way.

  On the seventeenth, more than eighty women marched to the White House with a petition to
  save the trees. When the President's secretary came out to take it, they chanted a poem
  at him. Trees, by Joyce Kilmer.

  The next morning, about a hundred and fifty women came down to the Tidal Basin. They
  wrestled the shovels away from the workmen. They chained themselves to the trees. And
  they chained a park police sergeant to the trees as well.

  The work stopped, for a while.

  President Roosevelt called it a flimflam game, and threatened to have the women
  transplanted along with the trees. The women withdrew, and construction began the next
  month.

  The memorial was built. But part of the compromise was more cherry trees, planted along
  this side of the basin, to frame it.

  The women lost the memorial. The trees got this shore.
