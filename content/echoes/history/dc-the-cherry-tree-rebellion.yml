teaser: "Stand on the steps of the Jefferson Memorial and look at the cherry trees along the shore."
script: |
  Stand on the steps of the Jefferson Memorial and look at the cherry trees along the
  shore.

  In November 1938, this ground was being cleared for the building behind you. Some of the
  cherry trees were in the way.

  So more than a hundred and fifty women came down to the Tidal Basin, in limousines, in
  cabs and in buses. They were leaders of the city's women's clubs and parent teacher
  associations. Dozens of them chained and padlocked themselves to the trees. Others took
  the shovels out of the workmen's hands and filled the holes back in. Where trees had
  already been dug up, women sat on them.

  A park police sergeant, Carl Gillespie, walked over to find out what was going on.

  He found himself chained to a tree.

  The paper said he took it good-naturedly.

  The director of the city's parks stopped the work until the White House decided what to
  do.

  The memorial was built. But part of the compromise was more cherry trees, planted along
  this side of the basin, to frame it.

  The sergeant got his chain off. The trees got this shore.
