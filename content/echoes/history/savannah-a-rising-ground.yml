teaser: "His first step in America was onto an island nobody lived on."
script: |
  Look across the water to the trees of Tybee. Now look for the highest ground around you. It will not be very high.

  A young clergyman from England first touched America on this island, and the first thing he did was kneel.

  His name was John Wesley. He had sailed from England with General Oglethorpe and a ship full of colonists, and in the afternoon of the fifth of February, seventeen thirty six, they anchored off Tybee. Wesley wrote that the pine groves on the shore looked like the bloom of spring in the depth of winter.

  The next morning, at about eight, they came ashore. He wrote it down that day.

  We first set foot on American ground. It was a small uninhabited island, over against Tybee. Mr. Oglethorpe led us to a rising ground, where we all kneeled down to give thanks.

  Then Oglethorpe took a boat up to Savannah. Wesley gathered the rest of the passengers and read them prayers.

  A month later he was preaching in Savannah. But it started here.

  Look for the rise again.

  His first step in America was onto an island with no one on it. His second was onto his knees.
detail: >-
  Wesley's journal, February 5 and 6, 1736. The 1937 guide places Wesley's first sermon on Cockspur ("delivered here his first sermon on American soil"); Wesley's own entry records prayers and a lesson read to the passengers, so the script says "read them prayers". "A month later he was preaching in Savannah": his journal for March 7, 1736.
