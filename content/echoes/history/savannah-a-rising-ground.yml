# Listening spot: the east end of Cockspur Island, on the path toward the lighthouse overlook, looking across the water to Tybee. Inside Fort Pulaski National Monument, which charges entry and keeps daytime hours.
# Position: the east end of Cockspur from the coast data in the app's map (low to medium confidence: Wesley's "rising ground" cannot be located, and the app's street file has no tiles here). The 1937 guide identifies the island as Cockspur; Wesley calls it "a small uninhabited island, over against Tybee".
# Not a duplicate: savannah-wesleys-empty-lot is about Christ Church in Johnson Square. This is his landing, a month before he reached the town.
