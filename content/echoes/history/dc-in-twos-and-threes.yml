teaser: "People walked down to this waterfront quietly, a few at a time."
script: |
  Look along the water here, at the restaurants and the boats. In eighteen forty eight, somewhere along this southwest waterfront, at a quiet, out of the way spot, a schooner called the Pearl was waiting.

  On the fifteenth of April, people began to arrive. They came in twos and threes, so as not to be noticed. From Georgetown, from the city, some from Alexandria, across the Mall. Many of them worked in the best homes and hotels in Washington. Among them were two teenage sisters, Mary and Emily Edmonson.

  Seventy seven enslaved people went aboard. The plan was to sail down the Potomac, up the Chesapeake Bay, and on to Philadelphia, and freedom. It was the largest single escape attempt in American history.

  They got more than a hundred miles. Then a storm stopped them at the mouth of the river. A steamboat full of armed men caught up with them, and towed them back here, to a waiting mob.

  Most were sold to slave traders.

  The Edmonson sisters were freed, with money raised in the North. And the uproar started a push to end the slave trade in this city.

  Look out at the channel. They were nearly gone.
