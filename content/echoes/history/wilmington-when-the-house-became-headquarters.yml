script: |
  In 1865, the Bellamy mansion took on a job its owners had not planned.

  After Union forces entered Wilmington, military staff used the empty house as
  headquarters. The property of a Confederate-supporting household became a place from
  which Union officers worked.

  The change was part of a much larger upheaval. Wilmington's Confederate port economy was
  collapsing, and emancipation was transforming the lives of the people whose labor had
  sustained households like this one.

  Look toward the entrance from the public sidewalk. The same rooms could serve domestic
  authority in one period and military authority in another. Their walls did not settle
  the conflict; occupation changed who controlled the space. A building that appears
  unified from outside can hold profoundly different histories of power within.
