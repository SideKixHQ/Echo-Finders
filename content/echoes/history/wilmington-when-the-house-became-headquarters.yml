teaser: "In 1865, the Bellamy mansion took on a job its owners had not planned."
script: |
  In 1865, the Bellamy mansion took on a job its owners had not planned.

  After Union forces entered Wilmington, military staff used the empty house as
  headquarters. The property of a household that backed secession became a place from
  which Union officers worked.

  The change was part of a much larger upheaval. The federal government seized all of Dr.
  Bellamy's property. He had enslaved 115 people, and emancipation was transforming the
  lives of the people whose labor had sustained households like this one.

  Look toward the entrance from the public sidewalk. The same rooms could serve domestic
  authority in peacetime and military authority in war. Their walls did not settle the
  conflict; occupation changed who controlled the space. A building that appears unified
  from outside can hold profoundly different histories of power within.
