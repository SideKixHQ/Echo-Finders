script: |
  Walk in among the old brick vaults.

  This was the town's burying ground from about seventeen fifty. First for the parish of Christ Church, then, from seventeen eighty-nine, for people of every denomination. The avenue outside was called South Broad Street then.

  In December eighteen sixty-four, Sherman's army marched into Savannah.

  A history of the city, published in eighteen sixty-nine, makes an accusation about what followed. It says soldiers broke open the vaults in this old burying ground, searching for valuables they believed had been hidden inside. It says the same happened at Bonaventure, outside town. And it says Union earthworks were dug straight through the Catholic cemetery.

  That is a single account. It was written by Savannahians who had every reason to resent the occupation, and it should be heard that way.

  You might hear other stories in here about what the soldiers did. This story has an advantage. Somebody wrote it down within four years, while the damage could still be seen.

  All of these vaults were built to stay shut.
