teaser: "Turn around and look straight up State Street."
script: |
  You are on Long Wharf. Turn around and look back toward the city, straight up State
  Street. If the view is clear, the old brick State House sits at the far end.

  That straight line is the whole idea.

  When this wharf was begun, around seventeen ten, it was laid out as the main street
  carried on into the harbour. King Street, it was called then, and the wharf was built to
  the same width. The street simply kept going into the sea.

  And it went a long way. Close to two thousand feet. About a third of a mile, with
  warehouses along one side nearly the whole length. A ship could tie up at the end, and a
  merchant could step off the deck and walk one straight road to the Town House.

  The landward end of the old wharf is now under solid ground. The city filled in along the
  shore and ran a new avenue across the heads of the wharves, so what you are standing on is
  only part of the original.

  It was built for cargo.

  On the first of October, seventeen sixty eight, warships anchored off this wharf and put
  two regiments of British soldiers ashore, sent to bring an unruly town to heel. They
  marched into town with drums beating and bayonets fixed.

  The road built to bring the world into Boston had just brought in an army.
