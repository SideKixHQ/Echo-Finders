teaser: "Look out across the harbour to the low fort near its mouth."
script: |
  Look out across the harbour to the low fort near its mouth. That is Fort Sumter.

  At half past four in the morning on the twelfth of April, eighteen sixty-one, a mortar
  fired from Fort Johnson, across the water. The shell arched high over the harbour and
  burst in the air above Sumter. It was a signal. Within half an hour, every Confederate
  battery that could reach the fort was firing at it.

  And the town came out to watch.

  A Charleston writer, telling it years later, says that within five minutes this Battery
  swarmed with people. Then the houses behind you, the wharves, the rooftops. The road was
  so jammed with carriages that boys got from the pavement to the sea wall by jumping from
  one carriage roof to the next.

  They watched all that day and into the next. Fathers, brothers and sons were out in the
  batteries on the islands. On the second day the fort caught fire, its flag came down,
  and the garrison agreed to leave.

  The people on this wall had come to see a war begin. They did not expect to be in it.

  Two summers later, Union troops took Morris Island, at the harbour mouth, and the
  bombardment of Charleston began in earnest. The siege went on until February eighteen
  sixty-five. The guns were pointed at the city behind you.
