teaser: "Washington's army was winning. Then a house started shooting."
script: |
  Look across the lawn at the grey stone house. On the morning of the fourth of October, seventeen seventy seven, it was a fortress.

  Washington's army had marched all night to surprise the British camped in Germantown. At daybreak, they hit them. The British broke and ran, leaving their tents still standing. For more than a mile, the Americans chased them down this road.

  But as they ran past this house, a British colonel named Musgrave had an idea. He took six companies inside, barricaded the doors and windows, and turned a gentleman's country house into a castle.

  When Washington's reserve marched by, the windows opened fire. His officers argued. Pass it by? Or take it? General Knox said it would be unmilitary to leave a castle in our rear. So they sent a young lieutenant up the path, with a white flag and a drum, to ask for surrender. He reached the gate. A shot from a window killed him.

  They brought up cannon. The balls pierced the walls, but did not bring them down. A young French officer forced a window and climbed in. Then he climbed back out, under fire, walking, because the army was watching and he would not be seen to run.

  Meanwhile, in fog, the attack fell apart. Some Americans fired on each other. The battle was lost.

  Look at the walls. Long after the war, visitors found the marks of musket ball and grapeshot on them.

  The house held.
