tags: [charlotte, uptown, revolution, military, battle-of-charlotte]
teaser: "In 1780 a few militia horsemen waited at this crossroads for the British cavalry to ride straight in."
script: |
  Look back up the street to the crossing. Now take away the towers. Picture about twenty houses on two streets, and a courthouse right in the middle where they cross.

  That was Charlotte in late September 1780, when the British army under Lord Cornwallis came up the road.

  A militia officer, William Davie, had just under a hundred and fifty mounted men.

  He put them behind a stone wall in front of the courthouse, and along the roads behind hedges and houses. Then he waited for the British to ride straight into the middle of town.

  The next morning, British cavalry reached the edge of Charlotte, and their commander took the bait. He charged his horsemen straight at Davie's men.

  The fire from the wall threw them back. They charged again, and were thrown back again.

  Only when British infantry worked around the sides did the militia pull out.

  Five Americans were killed. The British counted forty-four casualties.

  The courthouse is long gone, and the wall with it. But the crossing is still the heart of the city.
