teaser: "He was on his way to vote."
script: |
  Find the bronze statue of the young man, here on the south side of City Hall. His name was Octavius Catto. This city has about seventeen hundred public statues. When his went up, it was the first of an African American.

  Catto was born free, in Charleston, South Carolina, in eighteen thirty nine, and came to Philadelphia with his family. He finished top of his class at the Institute for Colored Youth, and the next year he was teaching there. He played shortstop, and started one of the city's earliest professional baseball clubs. In the Civil War, he recruited Black soldiers. He presented a regiment with its flag. The motto on it said, let soldiers in war, be citizens in peace.

  After the war, he set out to make that true. He fought for a law to let Black passengers ride the city's streetcars. In eighteen seventy, the Fifteenth Amendment gave Black men the vote.

  On election day, the tenth of October, eighteen seventy one, Octavius Catto was on his way to vote. At Ninth and South Streets, he was shot three times. He was thirty two. The man accused of killing him was never convicted. A New York newspaper called him a pure minded patriot, who died as he had lived, without fear.

  In the eighteen nineties, Black Philadelphians tried to raise money for a monument to him. It took more than a century. By then, even a mayor of Philadelphia, Jim Kenney, had to ask, how in God's name did I not know this man?

  Look at him again. Citizens in peace.

  He was on his way to vote.
detail: >-
  The National Park Service names the man who shot Catto and records that he was not convicted; the script does not name him. The memorial is by the sculptor Branly Cadet.
