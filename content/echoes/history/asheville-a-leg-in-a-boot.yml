teaser: "In April 1865 Asheville's old men and boys stood behind earthworks near here and fought for five hours."
script: |
  About a hundred yards north of the marker, on what is now the campus of the University of North Carolina at Asheville, there were once rough earthworks.

  In April 1865, a Union colonel, Isaac Kirby, was ordered to scout in the direction of Asheville. He set out from Tennessee with nine hundred troops.

  The town's defenders were the Silver Grays. Forty-four men, among them a fourteen-year-old boy and a sixty-year-old Baptist minister. Their commander bullied, argued or shamed about two hundred and fifty more into joining them. They had two small brass cannons, and they took them up to the earthworks.

  At three in the afternoon, the two sides simply lined up and started firing. There was no maneuvering. Just gunfire, and a few cannon blasts, for about five hours.

  Then Kirby's men retreated, leaving rifles, canteens and haversacks behind.

  Casualties? Reports range from none to three. But it is said that the next morning, the defenders found one Union soldier's leg, still in its boot.

  People around here still argue about what to call it. A battle, a skirmish, an engagement. The marker says battle. The state's own write-up says it fell well short of one.
