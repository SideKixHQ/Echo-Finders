teaser: "This chapel looks as if it has always been here. It arrived after a long trip."
script: |
  Look at the chapel, and at the stone front that rises above its roof with three bells. It makes a small building look grander than it is.

  Visitors see this chapel looking as if its old stones had always been here. But in its first years, the mission was moved several times.

  It was founded on the twenty-fourth of May, 1690, as Mission San Francisco de los Tejas, in east Texas, near what is now Nacogdoches. After three years it was abandoned. It was moved in 1716, and moved again in 1721, to the Neches River.

  Then an agreement with France closed the Spanish presidio that protected the eastern missions. Without it, they were a ripe target for raids.

  So in 1731, the mission moved one last time, here, to the San Antonio River.

  Even here, things did not go to plan. A larger church was begun in 1762, and torn down in 1777 because it was structurally unsound. This little chapel, meant to be the sacristy, became the church instead.

  A mission that crossed Texas, and settled for its back room.
