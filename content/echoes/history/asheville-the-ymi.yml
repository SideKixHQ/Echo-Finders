teaser: "Vanderbilt built this for the Black workers building his mansion. Their community made it their own."
script: |
  Look at the building of the Young Men's Institute. People here call it the YMI.

  In the early 1890s, while George Vanderbilt was building his lavish home out at Biltmore, he put up this building as a community center for his African American workers, and for people in town. It was designed by the supervising architect of Biltmore House, Richard Sharp Smith.

  It had speakers, a gym, baths, and classes for children and adults. By 1910 it even had its own orchestra. Congregations held their worship services here. One of Asheville's first Black doctors, James Byron, kept his office here. And from 1926 until 1966, a branch of the public library.

  Then Vanderbilt stepped away. In 1906 the YMI was incorporated, with forty-nine of Asheville's Black leaders as members. They could not raise enough to buy the building outright. They raised ten thousand dollars, and took a mortgage for the rest.

  By 1977 the building had been condemned. The African American community of Asheville rallied, got it onto the National Register of Historic Places, and saved it.

  Built by a Vanderbilt. Saved by the people it was built for.
