teaser: "The port began with one ship that could not turn around."
script: |
  Somewhere beyond these port buildings is the Turning Basin, a wide bend in the water where the biggest cargo ships in the world are swung round to head back to sea.

  It is named after a ship that almost could not do it.

  On the first of June, eighteen thirty seven, a big sailing ship called the Constitution came up Buffalo Bayou to the new town of Houston. The Allen brothers had paid her captain a thousand dollars to try it. The local paper could hardly trust its eyes. The ship was moored at the landing, towering in pride above the bayou.

  Then the captain, with his fee in his pocket, found that he could not turn his ship around.

  He worked her back down the bayou. And at a bend, finally, the Constitution turned without running aground. People called the place Constitution Bend.

  Seventy seven years later, a channel fifty one miles long and twenty five feet deep was dug from the Gulf to this bend. On the tenth of November, nineteen fourteen, at eleven in the morning, President Woodrow Wilson pressed a button in Washington, and a cannon fired here. Miss Sue Campbell dropped a wreath of flowers into the water, and Port Houston was christened.

  Look toward the water. The ships that turn here now are bigger than anything the Allens could have pictured.

  It began with one that barely made it round.

