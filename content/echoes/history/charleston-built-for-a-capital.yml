tags: [charleston, charleston-core, south-of-broad, four-corners, courthouse, revolution]
teaser: "Four corners, four buildings, four kinds of law. One of them was meant for something else."
script: |
  You are standing at the crossing of Meeting and Broad. Four corners, four buildings. A
  church, a city hall, a federal post office and court, and a county courthouse. Charleston
  calls this the Four Corners of the Law. The law of the church, of the city, of the nation
  and of the state.

  Look at the courthouse, on the north-west corner. It was not built to be a courthouse.

  It went up in seventeen fifty-three as the statehouse of the colony. The Royal Governor's council met upstairs. From its balcony over Meeting Street, the Declaration of
  Independence was read aloud for the first time in South Carolina.

  In seventeen eighty-eight it burned. Only the foundations, the walls and the doorways
  were left.

  The rest of the state had asked for the capital to be moved to the middle of South Carolina, not left out on its edge. Charleston rebuilt fast anyway, anxious to keep its place in
  the government.

  By the time the work was finished, in seventeen ninety-two, the capital was in Columbia.

  So the courts moved in, and they are still there. It is the state's corner of this
  crossing. It just never got the state back.
