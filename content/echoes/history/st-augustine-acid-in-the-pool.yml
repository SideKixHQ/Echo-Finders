tags: [st-augustine, civil-rights, monson-motor-lodge, martin-luther-king, 1964]
teaser: "In 1964 a motel on this bayfront became one of the most famous pictures of the civil rights movement."
script: |
  Look along this bayfront. In 1964, one of the buildings on it was the Monson Motor Lodge.

  St. Augustine was the oldest city in the United States, and one of the most segregated. A local dentist, Robert Hayling, started the protests. When they got nowhere, he appealed to the Southern Christian Leadership Conference for help.

  Martin Luther King Junior came, and was arrested here, for trying to eat lunch at the Monson's restaurant.

  Then came the swim-in. African Americans got into the motel's swimming pool.

  The manager threw acid into the water. Muriatic acid. Then he drained the pool, and stationed guards around it.

  The pictures went out across the whole country.

  That July, President Lyndon Johnson signed the Civil Rights Act of 1964. The demonstrations here are widely credited with winning it the national attention it needed.

  A man poured acid into a pool to keep people out. The whole country saw him do it.
