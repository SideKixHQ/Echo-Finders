script: |
  In April 1791, President George Washington reached Wilmington on his Southern Tour.

  His journal described a compact town with some good houses, and a census count of about
  a thousand people. Many locals felt that count was too low. The visit brought the
  president face to face with the coastal port.

  This marker commemorates the visit; it does not prove that he stood at the exact spot
  where you are listening. That difference keeps the scene honest.

  Look along the historic streets and imagine a president trying to understand a place by
  moving through it. A tour could connect the new federal government with communities that
  otherwise knew it through correspondence and law. Wilmington was one stop in that
  effort, and Washington left a brief written impression rather than a complete portrait.
