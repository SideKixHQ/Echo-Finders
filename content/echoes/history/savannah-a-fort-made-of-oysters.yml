teaser: "Count the shells in the wall. Somebody had to eat every oyster."
script: |
  Look closely at the low, crumbling walls. They are not brick and they are not stone. Look for the shells.

  This fort was built out of oysters.

  The man who built it was Noble Jones. He was among the first little band of colonists to come up the Savannah River, and he was given this land. He named it Wormsloe, for silkworms. He planted mulberry trees to feed them.

  But this was a frontier, and the Spanish were to the south. So at the end of his land, where a narrow channel ran past, he built a fort, first of wood. Before seventeen forty one it was rebuilt in tabby, a mix of lime and crushed oyster shell, poured like concrete. It had a four pound cannon, and Jones's marines camped in huts nearby.

  A guidebook in the nineteen thirties imagined a little girl, his descendant, balancing on these walls and wondering how many oysters her great great great grandfather had to eat to build them.

  When that was written, his family was still living on this land.

  Look at the shells in the wall again.

  The oldest walls on this land were somebody's dinner.
detail: >-
  HABS (1934, revised 1936) records the 1733 grant to Captain Noble Jones, the wooden stockade "soon after 1733", the tabby fort "built before 1741, on the site of the stockade", the marines and the mulberry trees, and that the DeRenne family, "of the fifth generation from Captain Jones", owned it. The 1937 guide gives the silk origin of the name, the four pound cannon, the marines' huts, and the passage about the girl and the oysters; it says the sixth generation was living there. The guide says Jones leased the land in 1735 and received it by royal grant in 1756, against HABS's grant of 1733; the script says only that he "was given this land". The 1937 guide defines tabby as "mixture of lime and shells".
