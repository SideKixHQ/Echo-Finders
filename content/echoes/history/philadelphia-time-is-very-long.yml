tags: [philadelphia, philadelphia-core, fairmount, eastern-state-penitentiary, charles-dickens, prisons]
teaser: "Two sights in America Dickens most wanted to see. This was one."
script: |
  Look at the great wall across the street, and the gate built to look like a castle. When Charles Dickens came to America, in eighteen forty two, there were two sights he most wanted to see. Niagara Falls. And this.

  Behind this wall was an experiment. Every prisoner alone in a cell, for years, to think about what he had done. A new prisoner was led in with a black hood over his head. After that, Dickens wrote, he never looks upon a human countenance, or hears a human voice.

  Dickens spent a whole day going from cell to cell. In the first, a man sat at a loom. He had made himself a little clock out of odds and ends, with his vinegar bottle for a pendulum. On the wall over his door, he had painted a woman. He called her The Lady of the Lake. One of the visitors asked him whether time went quickly. Time is very long, gentlemen, he said, within these four walls.

  Dickens believed the men who ran this place meant well. And that they did not know what they were doing. He called it a slow and daily tampering with the mysteries of the brain, immeasurably worse than any torture of the body. Each man inside, he wrote, was a man buried alive.

  They kept it up for decades. The prison was copied more than three hundred times around the world before Eastern State gave up solitary confinement, in nineteen thirteen. Look at the wall again.

  Time is very long, gentlemen.

  Within these four walls.
