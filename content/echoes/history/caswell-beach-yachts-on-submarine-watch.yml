teaser: "In the Second World War, the Navy hunted submarines off this beach in borrowed yachts."
script: |
  Look out to sea, and then east, past the point at the end of this beach. Out there, under the water, Frying Pan Shoals runs a long way out from Bald Head Island.

  In November 1941, one month before Pearl Harbor, the Navy bought Fort Caswell, at the end of this road, for seventy-five thousand dollars.

  The buildings were painted camouflage green. Blackout curtains went into the windows.

  During the war, Fort Caswell was one of four bases in the country where German submarines were monitored.

  The Navy was short of vessels. So six boats went out from here to patrol around Frying Pan Shoals, looking for the submarines. All six were private yachts, doing Navy work.

  Picture one of them from this beach. Somebody's pleasure boat, out past the breakers, hunting a submarine.
