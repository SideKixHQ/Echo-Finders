teaser: "The last royal governor of North Carolina came here to hide. He did not like it."
script: |
  Look at the brick house with the two-story porch. It is all that is left of a fort, and the fort before this one was burned to the ground.

  In May 1775, Josiah Martin, the last royal governor of North Carolina, fled his own palace under cover of darkness. He came from New Bern to this fort, at the mouth of the Cape Fear River, where English warships lay at anchor.

  He was not impressed. He described the fort as a wretched little place.

  Then he heard that the Wilmington Committee of Safety planned to attack the fort and seize him. So the governor of the colony moved out to sea, onto a warship called the Cruizer.

  It was a wise move. Five days later the militia, in his own words, wantonly in the dead hour of night set on fire and reduced to ashes the houses and buildings within the fort.

  It was the first active violence against the British in North Carolina.

  The new federal government rebuilt the fort after the Revolution. This house, the officers' quarters, is the only building of it still standing.

  As for the governor, the Cruizer stayed his headquarters through the summer and fall. The last royal governor of North Carolina ended up running the colony from a boat.
