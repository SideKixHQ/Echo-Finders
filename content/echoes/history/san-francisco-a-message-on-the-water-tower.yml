teaser: "The graffiti on this tower was restored on purpose, by the people who painted it."
script: |
  Find the water tower, and read what is painted on it.

  It went up in 1940, when this island was a federal prison. There was no fresh water source here, so every drop came by boat, twice a week. The tank held two hundred and fifty thousand gallons.

  From 1969 to 1971, American Indians occupied Alcatraz. Nineteen months, the longest occupation of federal land in the country's history.

  The water tower is one of the most visible landmarks in San Francisco Bay, so it was an ideal place for a message to the world. Standing on each other's shoulders, they painted the letters.

  Peace and freedom. Welcome. Home of the free. Indian land.

  The occupation is credited with launching a national American Indian civil rights movement.

  When the National Park Service restored the water tower in 2012, it did not paint the words out. It invited the original occupiers and their families back, to paint them again.
