tags: [fort-fisher, kure-beach, civil-war, world-war-ii, military, african-american-history]
teaser: "Black soldiers came to these mounds in 1865, and again in 1941."
script: |
  Stand on the mounds and think about who has stood here before you.

  On the fifteenth of January, 1865, more than three thousand three hundred Union infantry
  assaulted this land face. Among them were the twenty-seventh United States Colored Troops.

  Black soldiers came back to the same sand in 1941. The fifty-fourth Coast Artillery was the
  army's only Black anti-aircraft unit with the big one-five-five millimeter guns, and it
  brought twenty-four of them here for two months of training.

  The first time, they came to take this fort. The second time, they came to train on it.

  The mounds were the same mounds.
