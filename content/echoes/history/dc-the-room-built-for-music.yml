teaser: "First a concerto. Then, in the middle of a world war, the plan for the United Nations."
script: |
  Look around the music room of this Georgetown mansion. It was made for concerts. In nineteen thirty eight, the lady of the house, Mrs. Bliss, commissioned a concerto from Igor Stravinsky. Its world premiere was played right here, conducted by Nadia Boulanger. It carries the name of the house. The Dumbarton Oaks Concerto.

  Six years later, the world was at war. And this room was taken over for something else.

  On Monday morning, the twenty first of August, nineteen forty four, diplomats from the United States, Britain and the Soviet Union sat down here. Their job was to sketch an organisation that could keep the peace once the war was over.

  They argued in detail. The Soviet side, with Ambassador Gromyko, argued that the new body should stick to security. The Americans wanted it to take on economic and social questions too. The talks ran for seven weeks. Then the Chinese delegation came, for a second round.

  What they drafted in this room became the starting point for the United Nations.

  Look at the room again. It was built for music.

  For seven weeks, it held the plan for a peace.
