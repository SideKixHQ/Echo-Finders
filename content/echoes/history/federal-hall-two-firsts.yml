teaser: The building is not the one it happened in. The corner is.

script: |
  Stand facing the columns, and know first that this is not the building.

  The one that mattered was New York's City Hall, and it stood on this exact spot. Two
  things happened in it that the country is still living inside.

  In 1735 a printer named John Peter Zenger was tried here for libel. He had published
  criticism of the royal governor in his newspaper, and under the law of the time truth was
  no defence — printing it was the crime, whether or not it was accurate. The jury
  acquitted him anyway. It was not yet law, but it was the beginning of the argument that
  became a free press.

  Fifty-four years later the same site, rebuilt as Federal Hall, was the first Capitol of
  the United States. On the thirtieth of April 1789, George Washington stepped onto a
  balcony above this street and took the oath as the first president, in front of a crowd
  filling Wall Street below you.

  That building was demolished in 1812. What you are looking at went up in 1842, as a
  customs house. The statue of Washington faces the street, roughly where the balcony was.

