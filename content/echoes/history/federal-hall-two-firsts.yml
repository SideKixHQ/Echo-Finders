teaser: The building is not the one it happened in. The corner is.

script: |
  Stand facing the columns, and know that this is not the building.

  The one that mattered was New York's old City Hall, and it stood on this site. What happened in it, the country is still living inside.

  In 1735 a printer named John Peter Zenger was tried here for libel. He had attacked the government of Governor William Cosby in his newspaper. The chief justice told the jury the law was very clear, and that the truth could not be admitted to justify a libel. Zenger's lawyer, Andrew Hamilton, argued that the truth is a defence. The jury came back with not guilty. The Park Service says the trial would lead the way for the First Amendment and a free press.

  Fifty-four years later the same building, remodelled for the new federal government, was where the First Congress met. On the thirtieth of April 1789, George Washington was inaugurated here as the country's first president.

  That building was demolished in 1812. What you are looking at opened in 1842, as a customs house.

