teaser: "This is sixty-six Phillips Street. Please look from the sidewalk."
script: |
  This is sixty-six Phillips Street. It is a private home, so please look from the
  sidewalk.

  In eighteen fifty it was a boarding house run by Lewis and Harriet Hayden. Both had
  escaped slavery in Kentucky. Lewis was out in the city. Harriet almost certainly ran the
  house. Between them it became the busiest Underground Railroad safe house in Boston.

  That summer, the census found two famous guests living here. William and Ellen Craft had
  escaped from Georgia, Ellen dressed as a white slaveholder and William posing as her slave.

  That autumn, under the new Fugitive Slave Law, slave catchers came to Boston looking for
  them. It was the city's first test of the law.

  What happened next is William Craft's own account. He said that he and Lewis Hayden had a
  keg of gunpowder under this house, with a fuse attached, ready to light if anyone tried to
  take them. That is his word. No other record of the keg survives that we know of.

  Nobody tried. The slave catchers gave up.

  An abolitionist paper later explained why. The marshal knew that the road to hell lay over
  Lewis Hayden's threshold.
