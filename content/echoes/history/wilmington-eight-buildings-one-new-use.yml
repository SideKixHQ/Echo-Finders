script: |
  The Cotton Exchange is described as a complex of eight interconnected historic
  buildings. That explains why it does not behave like one purpose-built shopping center.

  Its present use asks visitors to move through spaces that began with different
  commercial roles. Floors and passageways preserve some of that uneven history.

  Stand where a public passage turns or changes level. The interesting question is not
  simply how old the brick might be. It is how several old buildings were made useful
  together.

  This kind of reuse keeps the city legible. You can buy something in a contemporary shop
  and still notice that the setting was shaped by an earlier port economy. The present
  activity does not erase the past; it gives you a reason to encounter it at walking
  speed.
