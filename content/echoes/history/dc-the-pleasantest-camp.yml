teaser: "Under these trees, a regiment learned to be soldiers, and a poet took notes."
script: |
  Look around you at the woods on this island. Quiet trees, a long way from any traffic. In the summer of eighteen sixty three, all this was full of tents.

  Until that year, Black men could not legally enlist in the Union Army. The Emancipation Proclamation changed that. In May eighteen sixty three, Washington mustered its first Black regiment. They were sent here, to what was then called Analostan Island, and their camp was called Camp Greene.

  They were paid seven dollars a month. A white soldier of the same rank got thirteen.

  A poet came to see them. Walt Whitman rode out by ambulance, through Georgetown and across the river. He wrote down what he saw. The tents look clean and good, he said. Altogether, the pleasantest camp I have yet seen.

  On the thirtieth of July, they marched out of here, south, toward Richmond and Petersburg. By the end of the war, one hundred and eighty five men of the regiment had died.

  Listen to the woods. The tents left almost nothing behind. Archaeologists have found a few bullets, some buttons, a brass shoulder piece.

  And a poet's sentence. The pleasantest camp.
