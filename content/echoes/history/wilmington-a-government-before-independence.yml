script: |
  The old courthouse at this corner housed meetings of the Wilmington Council of Safety.
  Its members helped plan a political system to replace colonial authority.

  Opposition to Britain was only one part of the task. A different government would
  require organization: people agreeing on how public power could operate after the old
  arrangements were challenged.

  The building is gone, so let the intersection anchor the account rather than imagining a
  surviving meeting room.

  Stand safely beside the marker and look at the streets crossing here. Public life
  requires connections as well as declarations. The council's work helped connect local
  resistance with the possibility of a new state government. On this site, the future was
  something people had to discuss and arrange, not merely announce.
