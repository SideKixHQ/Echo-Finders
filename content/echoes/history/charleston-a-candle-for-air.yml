teaser: "Under the water, the only light was a candle. When it guttered, the air was going."
script: |
  Look out past the end of the island, to the open sea beyond the inlet. In the winter of eighteen sixty four, a boat went out from this shore that was hardly a boat at all.

  It was iron, forty feet long and four feet wide. It was built to go under the water.

  The crew sat in a row inside it and turned a crank by hand to drive the propeller. When it dived, their light came from a candle. When the flame began to die, it warned them the air was running out.

  It had already sunk twice, in practice. Thirteen men had drowned in it. One of them was the man it was named for, Horace Hunley.

  After that, the general in command would only let it fight on the surface.

  The submarine was based at Battery Marshall, here at Breach Inlet. For more than three months, four nights a week, it kept watch from this end of the island.

  Then, on the night of the seventeenth of February, eighteen sixty four, Lieutenant George Dixon took it out. The moon was bright. In the channel, the Union warship Housatonic lay at anchor.

  By the time her lookouts saw it, it was too close for her heavy guns to aim down at it. The torpedo struck. The Housatonic sank.

  It was the first time in history that a submarine had sunk an enemy ship in war.

  And the Hunley did not come back.

  Nobody on this shore missed it for days. They saw the gap in the blockade, and thought the Housatonic had been moved.

  Look out at the water again.

  It was found in nineteen ninety five.
detail: >-
  The South Carolina Encyclopedia entry (Richard W. Hatcher III) gives the iron hull forty feet long and four feet wide, the hand crank, the two accidental sinkings with thirteen men lost, Hunley's death in the second, Beauregard's order to operate only on the surface, Dixon's command, the attack on the night of 17 February 1864, the first sinking of an enemy ship by a submersible, the loss of the Hunley and its discovery in 1995. The National Register nomination (1976) gives the candle and its warning of failing air, the base at Battery Marshall at Breach Inlet, the watch four nights a week for more than three months, the bright moonlight, the Housatonic at anchor, the heavy guns that could not be depressed, and the shore not missing the boat for several days. The two sources differ on how many men turned the crank (seven or eight) and how far out the Housatonic lay (two or four miles), so the script gives neither number. Two independent sources for every key fact.
