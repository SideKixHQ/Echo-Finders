teaser: "Look for the old foundations in this park. They are most of what is left of a town."
script: |
  Look for the old stone foundations in this park. They belonged to the Great House, later the
  Three Cranes Tavern. In seventeen seventy-five this was the middle of Charlestown.

  That spring, about sixteen hundred people lived here. Wooden houses, workshops, warehouses,
  narrow streets, a ferry across to Boston.

  By June, most of them had gone. The British army was shut up in Boston, the colonial army
  was gathering outside, and Charlestown sat in between.

  On the seventeenth of June, the militia dug in on the hill above the town. During the
  battle, colonial soldiers fired on the British from the empty houses. General William Howe
  ordered the town set on fire.

  A British general, John Burgoyne, had been directing guns from Copp's Hill, across the
  water. He wrote that the timber church steeples were great pyramids of fire above the rest.

  Afterwards, more than four hundred and fifty families listed what they had lost. One man,
  Willson Chamberlain, began his list and ran out of room on the paper. He ended it with one
  line.

  In short, I lost most all that I had.

  The town asked Congress to pay. Congress said it lamented the distress. Nobody was ever
  compensated.

  Of the town Chamberlain lost, this is what you can still see. A tavern's foundations, in a
  park.
