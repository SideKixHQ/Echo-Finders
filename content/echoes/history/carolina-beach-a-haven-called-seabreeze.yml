teaser: "Under Jim Crow, Black families came here for the beach."
script: |
  Look around. Seabreeze does not look much like a resort now. For decades, it was exactly that.

  During the Jim Crow era, Seabreeze and Freeman Beach were havens for Black families seeking a
  day by the water. Seabreeze was established in 1922, and Freeman Beach in 1951. The same
  family built both, the Freemans, and both became symbols of pride and resilience.

  What ended them was slower than a law. Dredging near Freeman Beach. Development creeping in.
  And then the devastation of Hurricane Hazel.

  Today the north end of the island is Freeman Park, where people drive straight onto the sand.

  Some of the beach people cross for fun was once a haven.
