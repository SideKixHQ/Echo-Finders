teaser: This was not a park.
script: |
  This was not a park. It was the Commons, then the northernmost edge of the city.

  On the evening of the ninth of July 1776, soldiers of George Washington's army assembled on this ground, and heard read out a document that Congress had adopted in Philadelphia five days earlier. When the reading came to an end, the soldiers erupted into cheers.

  What happened next was not in the orders. A rowdy crowd of soldiers and civilians marched from here down Broadway to the little green at the bottom of the island, and pulled a statue of the king off its plinth.

  Washington was not pleased. In his general orders the next day he wrote that it had so much the appearance of riot and want of order in the army that he disapproved the manner.

  British troops would not leave this city for another seven years.

