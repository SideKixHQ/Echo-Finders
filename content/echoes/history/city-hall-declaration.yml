teaser: This was not a park.
script: |
  This was not a park. It was the Common — the rough field outside town where you put the
  things nobody wanted near them. A poorhouse. A prison. A gallows.

  On the ninth of July 1776, George Washington had his army formed up on this ground, in
  squares, and had an officer read out a document that had arrived from Philadelphia five
  days earlier.

  There is no record of the soldiers being told to do anything afterwards.

  What they did was walk down Broadway, about a mile, to the little green at the bottom of
  the island, and pull a two-ton gilded statue of the king off its plinth.

  Washington was not pleased. He put out an order the next morning calling it disorderly,
  and asking that in future such matters be left to the proper authorities.

  The war he had just read them into lasted another seven years.
