teaser: "Most churches begin with a cornerstone. This one began with a forge."
script: |
  Look across Sixth Street at the church, and at the ground it stands on.

  This is Mother Bethel. The National Park Service counts this lot among the oldest plots of land continuously owned by an African American.

  The first church on it was not built here. It was dragged here.

  In the seventeen nineties, Black members of Saint George's Methodist Church walked out together, rather than sit in a separate gallery made for them. A preacher named Richard Allen bought this lot so they could have a church of their own. What he had to put on it was an old blacksmith shop.

  In seventeen ninety-nine the engravers Birch and Son published a view of Walnut Street, with the city jail in the background. In the foreground, a team of horses is pulling a wooden shed down the street. Historians believe it is this church, on its way here.

  The first meeting house was dedicated in July, seventeen ninety-four. The congregation has rebuilt on this same ground more than once since, so the building in front of you is not the shed.

  Allen is known to have used a blacksmith's anvil as his pulpit. The church still keeps the anvil as its emblem. It stands for self-determination.

  Most churches begin with a cornerstone. This one began with a forge.
