teaser: "The city asked for a thousand men. More than three thousand answered."
script: |
  Stand on Main Street, in the nine hundred block, and look along it.

  One Saturday afternoon in nineteen forty two, a photographer climbed out onto the sign of a movie theater on this block, just to get it all into his picture.

  A few months before, at the turn of February into March, the cruiser USS Houston had gone down in a night battle in the Sunda Strait, off Java. Back home, people knew only that their city's ship was lost. Nobody knew what had become of her crew.

  The Navy said it would give the name to a new cruiser. So the city set itself a goal. A thousand men, to take the place of the crew they had lost.

  On Memorial Day, the volunteers lined up along this block to be sworn in. The crowd downtown was put at a hundred and fifty thousand. By the Chronicle's count, more than three thousand men answered.

  A fifty three year old logger, William Harrison Watson, tried to sign up. He was turned away for his age and his eyesight. His four sons took the oath instead.

  The mayor read the crowd a letter from President Roosevelt. Our enemies have given us the chance to prove, he wrote, that there will be another USS Houston.

  Then the city raised the money to build her. Enough for the new Houston, and for an aircraft carrier besides, the San Jacinto.

  What nobody on this street knew was that nearly three hundred of the first crew had lived. They were prisoners, forced to build a railway through the jungle between Burma and Thailand.

  Look along the block.

  They were replacing men who were still alive.

