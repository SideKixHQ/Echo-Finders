teaser: "The war filled this island, and this guest house kept handing out keys."
script: |
  Look across Waynick Boulevard at the Carolina Temple, and stay on the sidewalk.

  It dates from the early 1900s. During the Second World War it was a popular guest home, and the
  wartime heritage guide calls it Wrightsville Beach's oldest continuously operating business.

  The war filled this island. The town grew from two hundred and fifty-two residents in 1941 to
  fifteen hundred in 1945. All of them needed somewhere to sleep.

  The inn still rents small apartments, one or two rooms each, with their own kitchenettes. That is
  the same offer it made to a crowded island at war: not a holiday, a place to live.
