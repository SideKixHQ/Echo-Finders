teaser: "In 2020, Wilmington became the country's first American World War II Heritage City."
script: |
  In 2020, Wilmington became the country's first American World War II Heritage City.

  The designation recognizes a community's wartime role and its work to preserve that
  history. It reaches beyond this building, encompassing the wider city's military,
  industrial, and civilian contributions.

  The USO makes a useful downtown place to listen because it preserves a direct part of
  that experience: the gathering place for people in uniform and the volunteers supporting
  them.

  Look at the building before you. A national designation can sound like a distant
  administrative honor. Here, it points back to concrete local spaces and the people who
  used them. The title does not create the history. It asks the city today to keep that
  history available, examined, and connected to the present.
