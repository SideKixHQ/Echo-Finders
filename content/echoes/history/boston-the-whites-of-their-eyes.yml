tags: [boston, boston-core, freedom-trail, charlestown, bunker-hill, revolution, quotations]
teaser: "Everyone knows the order. Nobody can show who gave it."
script: |
  Find the bronze man in front of the monument, caught mid stride on top of a wall.

  That is Colonel William Prescott. He commanded the earthwork on this hill. At dawn on the day of the battle, with British cannon firing at it, witnesses said he walked along the top of that wall. The statue shows him doing it.

  And he usually gets the credit for the most famous order of the battle.

  Don't fire until you see the whites of their eyes.

  Here is the trouble. Nobody can show that he said it.

  Some accounts give the line to Prescott. Others give it to General Israel Putnam. The park service, which looks after this hill, calls it possibly a myth.

  What the record supports is plainer. Wait. Do not waste a shot on men too far away. Fire together, on the signal.

  Whatever was actually shouted, officers passed it along the line. And when the British came up this slope, more than fourteen hundred men fired at once.

  The words may be a legend.

  The waiting was real.

