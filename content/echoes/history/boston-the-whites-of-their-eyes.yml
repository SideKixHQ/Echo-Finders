teaser: "Everyone knows the order. Nobody can show who gave it."
script: |
  The bronze figure on these grounds is Colonel William Prescott. He is shown walking
  along the top of an earth wall, the way witnesses said he did at dawn, while British cannon
  fired at it.

  Prescott commanded the earthwork on this hill. And he usually gets the credit for the most
  famous order of the battle.

  Don't fire until you see the whites of their eyes.

  Here is the trouble. Nobody can show that he said it.

  Some accounts give the line to Prescott. Others give it to General Israel Putnam. The park
  service, which looks after this hill, calls it possibly a myth.

  What the record supports is plainer. Wait. Do not waste a shot on men too far away. Fire
  together, on the signal.

  Whatever was actually shouted, officers passed it along the line. And when the British
  came up the slope, more than fourteen hundred men fired at once.

  The words may be a legend.

  The waiting was real.
