teaser: "The firemen stood on this sidewalk. Their water reached the first window sill."
script: |
  Look up at the two spires of the cathedral, then down the long walls beneath them.

  On a night in February, eighteen ninety eight, a streetcar driver coming through this square saw fire. It was about ten minutes to eleven.

  The alarm went in quickly. It did not help. Every engine in the city was down at a big fire on River Street. The hose wagons that came had almost no pressure. Firemen stood on the Harris Street sidewalk, about where you are, and their streams barely reached the first window sill.

  It was three quarters of an hour before an engine arrived. By then the roof was gone.

  Thousands of people stood around the square and watched sparks pour from the towers like fireworks. Some of the sparks burned holes in their hats and coats.

  The next morning the paper said nothing remained but the four walls and parts of the two spires.

  The walls were built on again. Two years and eight months after the fire, the cathedral was dedicated again.

  So the shape you are looking at is the shape that crowd watched burn. What is new is almost everything inside.
