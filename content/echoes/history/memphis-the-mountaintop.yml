tags: [memphis, civil-rights, mlk, sanitation-strike, mason-temple]
teaser: "The night before he died, Martin Luther King spoke in this church for the men who collected the city's garbage."
script: |
  Look at this vast concrete church. It can seat seventy-five hundred people, on two levels.

  It was built in the early 1940s, as the headquarters of the Church of God in Christ.

  In 1968, thirteen hundred of the city's sanitation workers were on strike, and they met here regularly.

  On rainy days, Black workers were sent home without pay, while their white supervisors stayed on the clock. They had one uniform each, and nowhere to change.

  The best paid of them could not hope to earn more than seventy dollars a week.

  The week before, a march had ended in a bloody confrontation with police. A court banned further protests.

  On the third of April, 1968, Martin Luther King came here to speak for the strikers.

  He told them he had been to the mountaintop. He said he had looked over, and seen the promised land. And he said he might not get there with them.

  The next day he was killed, at the Lorraine Motel.

  It was the eve of his death, and he spent it here, with the men who collected the city's garbage.
