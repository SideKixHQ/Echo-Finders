script: |
  Look along the alley, at the two rows of little brick houses facing each other, with their shutters and white doorways. People have been living on this lane for more than three hundred years, without a break. It is called the oldest street in America that has never stopped being lived in.

  And in the nineteen thirties, some of it was about to be knocked down.

  A woman who lived here, Dolly Ottey, would not let it go. She ran a restaurant on the alley, called the Hearthstone. In nineteen thirty three, a landmarks society answered her plea, and three of the oldest houses were saved. Her own house was number one fifteen, with a mantelpiece from seventeen twenty.

  People like to say Benjamin Franklin lived on this alley. A city guidebook of nineteen thirty seven put it gently. If he did, it was so briefly that history failed to record it. The people who really lived here were tradesmen. The alley takes its name from the family of a blacksmith. A Quaker cabinet maker lived here, and a pewterer, and a man who helped found the first synagogue in the city. Not famous people. Just people.

  And people still live behind these doors. More than three hundred and eighty thousand visitors a year walk down this lane, past their windows. There are plans for a small park at the corner, named after Dolly Ottey.

  Keep your voice down.

  Somebody lives here.
