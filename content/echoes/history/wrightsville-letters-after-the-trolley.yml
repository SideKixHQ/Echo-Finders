teaser: "A trolley stop, then a post office, then hot dogs. Same small building."
script: |
  Look at the small building at 94 South Lumina Avenue, and keep the service window clear.

  It stands about where Station One of the old trolley line used to be. Until a drawbridge was
  finished in 1935, you got around this beach on foot or by trolley.

  Then the building changed jobs. Known as the Jennings Building, it became the first Wrightsville
  Beach post office, opening in November 1941.

  In 1976 it became the first Trolly Stop, and the original store was named Station 1. It is a local
  historical landmark now.

  A trolley stop, a post office, a hot dog stand. This building has always been somewhere people
  stop.
