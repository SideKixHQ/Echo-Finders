teaser: "The doorman of the Revolution had a printed list. If your name was not on it, you stayed outside."
script: |
  Stand on the northwest corner of Broughton and Whitaker. Look at the doorway nearest the corner.

  In the summer of seventeen seventy four, a man stood in a doorway here with a piece of paper in his hand. It was a printed list of names. If yours was not on it, you did not come in.

  His name was Peter Tondee, and this corner was his tavern.

  The royal governor had warned the town that anyone who met to talk about their rights would do so at their peril. On the tenth of August, they met anyway, in Tondee's. Tondee checked the list at the door. None others were admitted.

  The next summer, they raised a liberty pole out front, the first in Georgia, while the governor's friends were toasting the King's birthday. And on the fourth of July, seventeen seventy five, a year before the Declaration, Georgia's Provincial Congress sat down in Tondee's long room and began steering the colony out of the empire.

  Of Tondee himself, an old Savannah history says almost nothing is known. He helped found a charity for orphans. And he stood in this door.

  Look at the doorway again.

  Every revolution needs someone to decide who gets in.
detail: >-
  Wilson (1889) places the tavern on the northwest corner of Broughton and Whitaker and describes Tondee at the door with the list; Gamble (1923) independently gives the Provincial Congress at Tondee's tavern on July 4, 1775. The liberty pole is dated by Wilson to the King's birthday celebration, before the Council of Safety was organized at its foot on June 22, 1775. Wilson's "nothing is known beyond two facts" is paraphrased, not quoted.
