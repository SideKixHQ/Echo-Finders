script: |
  These gardens may feel as old as the house. Their present design belongs to a later
  chapter.

  In 1962, the museum hired landscape architect Alden Hopkins to create gardens in an
  eighteenth-century style. The grounds therefore interpret a period; they are not a
  garden preserved unchanged from 1770.

  That distinction adds to the experience. The orchard, herb areas, terraces, and formal
  planting give visitors different ways to approach the past. A useful plant tells a
  different story from a decorative hedge.

  Walk only along the open paths. Notice where the design invites a pause and where it
  directs your gaze. This landscape records two eras at once: the colonial world it evokes
  and the twentieth-century preservation work that chose how that world would be
  presented.
