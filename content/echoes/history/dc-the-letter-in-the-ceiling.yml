teaser: "He felt something touch his shoulder. Then he saw the letter."
script: |
  Look up at the third floor of this narrow building. For most of a century, nobody knew what was up there.

  In nineteen ninety six, the building was empty, and due to be torn down. A carpenter named Richard Lyons was sent in to make sure nobody was living there. He said he kept hearing a noise in the front room. When he went to look, he felt something touch his shoulder. Then he saw a letter, hanging down through a crack in the ceiling. He found a ladder, and climbed into the attic. Up there were letters, newspapers from the Civil War, old clothes, and a sign. Missing Soldiers Office.

  These had been the rooms of Clara Barton, after the Civil War. Families wrote to her, desperate to know what had become of their sons. There was no official system for finding the missing and the dead. So she made one, up there. Her office answered more than sixty three thousand letters, and found more than twenty two thousand missing men.

  When Lyons reported what he had found, a supervisor told him, get rid of it. Throw it away. He did not. He spent months researching it, and quietly got word to a historian at the National Park Service. In nineteen ninety seven, the Park Service announced the find, and the building was saved.

  Look up at the third floor again. She spent four years finding the missing.

  Then her own office went missing, for more than a century.
detail: >-
  The account of the noise and the touch on the shoulder is Richard Lyons's own, as told to the Associated Press in 2012. The Park Service's figures for Barton's office vary between pages (more than 60,000 letters and 20,000 soldiers found by 1867 on one; over 63,000 and 22,000 by December 1868 on another); the script uses the second.
