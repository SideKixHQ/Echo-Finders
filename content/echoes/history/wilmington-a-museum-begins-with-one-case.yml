teaser: "This museum did not begin with a building full of trains."
script: |
  This museum did not begin with a building full of trains. Its early effort included a
  single display case and a table at Riverfest.

  The foundation was chartered in 1979. Hazel Morse, Gerda Wooten, and Marguerite James
  led the effort. The railroad had left Wilmington, and they wanted to keep its history
  alive here.

  A collection needed somewhere to grow, and the work expanded from those small
  beginnings. The current museum is the outcome, not the setting of every early exhibit.

  Stand near its entrance and consider how easily ordinary equipment becomes disposable
  once a company moves on. Someone has to recognize its future value before that happens.
  These organizers turned a modest display into a commitment: the railroad could leave,
  but its story here would still have a place.
