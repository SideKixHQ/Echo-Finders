teaser: "This town changed its name for a future that never turned up."
script: |
  Look out past the boats to the river. In the 1880s, people here were sure this water would make them the next great city of the South.

  In 1887 the village of Smithville was renamed Southport, in eager anticipation of the day it would emerge as the great seaport of the southeast.

  The river had been dredged and an inlet closed off, and for the first time in two hundred years North Carolina had an easily reached deep water harbor.

  It would be, one booster wrote, the city of the South Atlantic.

  Money came from Boston, Fort Wayne and Chicago. Land prices began to soar. Dozens of new houses went up all over town.

  All it needed was a railroad. The schemes to get one fizzled.

  When the railroad finally arrived in 1911, with great fanfare, the opportunity had passed.

  The town kept the name anyway. Southport. A name for a city that never came.
