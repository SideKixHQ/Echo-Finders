teaser: "Somewhere in this garden is a small stone with a pirate's name on it."
script: |
  Somewhere in this garden is a small stone with a pirate's name on it. Stede Bonnet. It
  was put up in nineteen forty-three, and it is easy to walk straight past.

  Bonnet was not the usual kind of pirate. The old histories describe a gentleman by birth and education, of fair estate, a former army major. There seemed no reason why he took to piracy.

  In the autumn of seventeen eighteen, ships from Charles Town caught him and brought him
  back in irons. He escaped once, in a woman's dress, and was hunted down in the sandhills
  of Sullivan's Island.

  The record of the trials was printed the following year. Twenty-two of his crew were hanged in November. Bonnet followed on the tenth of December, executed, it says, at the White Point
  near Charles Town.

  White Point was this end of the town.

  There was no garden then. The point took its name from the oyster shells heaped along the shore. A Charleston historian, writing in nineteen-oh-six, recorded where the
  pirates went afterwards. They were buried on the White Point shoal, just above the
  low-water mark. Out on the mud, at the edge of the tide.

  The city later filled the shoal in. This garden was laid out in eighteen thirty-seven, and the oaks you are standing under were planted on that ground.

  They were buried where the tide came in. The city moved the tide.
