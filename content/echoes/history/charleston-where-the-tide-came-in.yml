teaser: "Somewhere in this garden is a small stone with a pirate's name on it."
script: |
  Somewhere in this garden is a small stone with a pirate's name on it. Stede Bonnet. It
  was put up in nineteen forty-three, and it is easy to walk straight past.

  Bonnet was not the usual kind of pirate. The old histories describe a gentleman. Educated,
  well off, a former army major. Nobody could say why he took to the sea.

  In the autumn of seventeen eighteen, ships from Charles Town caught him and brought him
  back in irons. He escaped once, in a woman's dress, and was hunted down in the sandhills
  of Sullivan's Island.

  The record of the trials was printed the following year. Most of his crew were hanged in
  November. Bonnet followed on the tenth of December, executed, it says, at the White Point
  near Charles Town.

  That is here.

  There was no garden then. The point took its name from the heaps of white oyster shell
  along the shore. A Charleston historian, writing in nineteen-oh-six, recorded where the
  pirates went afterwards. They were buried on the White Point shoal, just above the
  low-water mark. Out on the mud, at the edge of the tide.

  The city later filled the shoal in. This garden was laid out in eighteen thirty-seven, on
  made ground, and the oaks you are standing under grew up on top of it.

  They were buried where the tide came in. The city moved the tide.
