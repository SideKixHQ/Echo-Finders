teaser: "In 1840, Wilmington gained a connection that reached far beyond the riverfront."
script: |
  In 1840, Wilmington gained a connection that reached far beyond the riverfront.

  The Wilmington and Weldon Railroad opened a continuous line of about 161 miles. At
  completion, it was regarded as the longest continuous railroad line in the world.

  That achievement changed how the port could connect with inland markets. The river
  remained important, but goods and passengers had another long route into and out of the
  city.

  Listen beside the historical marker. Do not enter the rail corridor. The impressive part
  is not merely the distance: every mile had to function as part of a connected system.
  Wilmington's story widened along those rails. The city was no longer only a place
  reached by the river; it became an endpoint in a much larger network.
