teaser: "The surveyors measured every curve of this house. Then they got to the basement."
script: |
  Start with the front of the house. The curved double stair. The curved porch above it. The cast-iron balcony on the side.

  It was finished in eighteen nineteen, to designs by the English architect William Jay. When surveyors from the Historic American Buildings Survey came here in the nineteen thirties, this is what they wrote about. The curves. The Greek fret on the parlour ceiling. A white marble mantel, carved with women carrying baskets of fruit.

  Then they reached the basement. They listed a kitchen, a bakery, a wine cellar, and servants' quarters.

  That was all. One word. Servants.

  Behind the house stands its original carriage house. The Library of Congress record for this property now describes it as containing one of the earliest intact urban slave quarters in the South. The people who lived and worked there were enslaved by the families in the big house.

  The survey that measured every curve of the staircase did not write down a single one of their names.

  Their rooms are still standing. The house is a museum now, and the quarters are part of it.
