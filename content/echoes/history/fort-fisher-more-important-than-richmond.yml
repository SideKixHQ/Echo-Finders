teaser: "In 1864 the Navy said closing this port mattered more than taking the Confederate capital."
script: |
  Look toward the river. Everything this fort did was about what came up it.

  In August 1864, Union warships sealed the port of Mobile, Alabama. That left Wilmington as the
  last major Southern seaport open to the outside world, and this fort was its front door.

  The Secretary of the Navy, Gideon Welles, said it plainly. Closing Wilmington, he wrote, was
  more important, practically, than the capture of Richmond.

  By 1865, the supply line through Wilmington was the last one still feeding Robert E. Lee's
  army in Virginia.

  In the Navy's eyes, the war's most famous city was not its most important target. This sand was.
