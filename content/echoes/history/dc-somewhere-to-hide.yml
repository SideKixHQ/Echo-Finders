teaser: "Find the Declaration of Independence, and look closely at the ink."
script: |
  Inside the rotunda, find the Declaration of Independence, and look closely at the ink.

  For most of its life this sheet was not kept in the dark. It was a display piece. For
  years it was on show in the Patent Office, a few blocks north of here, alongside George
  Washington's camp tent. In 1876 it went to Philadelphia for the Centennial Exhibition.
  Then it came back to a cabinet in the State Department's library.

  In 1894 it was taken off display, because it was fading.

  It spent the next quarter of a century in storage. In 1921 it went to the Library of
  Congress. After Pearl Harbor it went to Fort Knox. In 1951 the Library tried sealing it in
  a case filled with helium.

  On the thirteenth of December 1952 it came here, with the Constitution, in an armored
  carrier escorted by tanks.

  Under the display cases, the Archives had built a fifty-ton safe of steel and concrete,
  with its own elevator. Every night the documents could be lowered into a vault, out of
  the light, and raised again in the morning.

  After more than a century of being looked at, the first thing it got in its new home was
  somewhere to hide.
