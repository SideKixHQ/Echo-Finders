tags: [fairfax, civil-war, military, 1861]
teaser: "A cavalry charge through this town became a picture, and the picture got bigger than the fight."
script: |
  On the first of June, 1861, a company of United States dragoons charged into this town, and back out again.

  A week later an illustrated newspaper printed a picture of the charge.

  Its caption said they killed thirty of the enemy and carried off five prisoners, in the face of fifteen hundred troops.

  Early newspaper reports said much the same. Thirty rebels killed.

  Then an official dispatch to the War Department put the Confederate loss at twenty-seven.

  And a man who had been in the town that night told reporters the count of the dead was exaggerated.

  The war had barely started. Already, the picture was bigger than the fight.
