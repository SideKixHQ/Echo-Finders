teaser: "They found the sole of a child's shoe. One of the students started to cry."
script: |
  Look around you. The paths. The trees. The playground nearby.

  Before there was a Central Park, there was a village here.

  In September, eighteen twenty five, a shoe shiner named Andrew Williams bought three lots of land, right around here. He was twenty five, and a free Black man. Slavery had not even ended yet in New York.

  Others followed him. Free Black families, and later Irish and German immigrants. They built houses, three churches, a school. They called it Seneca Village.

  Owning land mattered. In those days, a Black man in New York who owned property could vote. Seneca Village had the largest number of Black property owners in the city before the Civil War.

  Then the city decided it wanted a park.

  The newspapers started calling the villagers squatters and vagabonds. In eighteen fifty seven, the city used eminent domain to force them out. Police removed the ones who resisted. Then the village was knocked down, and the park was built over it.

  Historians still know very little about where the people went.

  In two thousand eleven, archaeologists dug here. They found bottles, dishes, buttons, a toothbrush. And the sole of a child's shoe.

  One of the students on the dig started to cry.

  Look down at the grass.

  The village is still here. Just underneath.

