teaser: Look down the street. It runs river to river.
script: |
  Look down the street. It runs across the island, toward the water at both ends.

  That is not an accident. In 1653 the Dutch decided to fence the town off.

  England and the Dutch Republic were at war, and word had reached the governor, Peter Stuyvesant, that English troops were gathering in New England for a possible invasion from the north. In March the city's council resolved to surround the greater part of the town with a high stockade. Someone, possibly Stuyvesant himself, sketched it in the margin of the court minutes: nine feet above the ground, three feet in it, with a ditch and an embankment. In the end a palisade proved too costly, and they nailed slats across posts set fifteen feet apart. It ran across the island from the East River to the Hudson.

  The colony's enslaved workers helped to build it.

  The invasion from New England never came. The English took the colony anyway, eleven years later.

  The Dutch called the wall Het Cingel, the Belt. It gave its name to the street, which means this is a street named after a thing that is not there, put up partly by people who were never free to walk away from it.

