teaser: Look down the street. It runs river to river.
script: |
  Look down the street. It runs river to river — you can very nearly see one end from the
  other.

  That is not an accident. It is the width of the island, and in 1653 the Dutch decided to
  fence it off.

  The governor, Peter Stuyvesant, ordered a palisade built right across here. Nine feet
  high, made of packed earth and fifteen-foot planks, running from the Hudson to the East
  River. It was meant to stop an English invasion.

  The people who built it were mostly enslaved Africans, owned by the Dutch West India
  Company.

  The invasion never came. The English took the colony anyway, eleven years later, by
  sailing in and asking. And in 1699 they pulled the wall down and used the wood for
  something else.

  It stood for forty-six years. It has been gone for more than three hundred.

  The street kept the name — which means this is a street named after a thing that is not
  there, put up by people who were never free to walk away from it.
