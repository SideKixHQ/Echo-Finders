teaser: Look down at the pavement.
script: |
  Look down at the pavement.

  Set into it along this stretch of Broadway are thin strips of granite, each one naming a
  date and a person. There are more than two hundred of them.

  Every strip is a ticker-tape parade. The first was in 1886, for the dedication of the
  Statue of Liberty, and nobody organised it — clerks in the offices above started throwing
  the used tape from their stock tickers out of the windows, because they could not think
  of anything better to do.

  Nobody has used ticker tape since the 1960s. They shred paper for it now.

  So this is a canyon named after confetti, which was named after rubbish.
