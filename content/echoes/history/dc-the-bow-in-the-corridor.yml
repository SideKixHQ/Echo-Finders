teaser: "Read the words cut across the front of the building."
script: |
  Stand in front of the steps and read the words cut across the front. Equal justice
  under law.

  This building opened in October 1935, and the newspapers that week noticed something odd
  about it. It was the first building the Supreme Court had ever had for its own use. The
  Court was a hundred and forty-six years old.

  Until then it had sat across the street, inside the Capitol. Its courtroom was on one side
  of a main corridor. The room where the justices put on their robes was on the other.

  So before each session, attendants stretched plush ropes across the corridor to make an
  aisle. The Chief Justice met the Court's marshal in the middle. They bowed, exchanged a
  quiet greeting, and the justices followed through into court, in full view of whoever
  happened to be passing.

  Sightseers loved it.

  When the Court moved in here, the justices brought their old chairs with them. The papers
  called the chairs the only relics of the old room.

  The robing room in this building sits behind bronze gates, where the public cannot go.

  If the bow still happens, nobody outside gets to see it.
