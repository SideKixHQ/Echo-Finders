teaser: "In 1899 you did not drive to Carolina Beach. You took the steamer."
script: |
  Think about how you got here. In 1899, the answer was a boat.

  That summer, a newspaper described the trip. The steamer left Wilmington and made the run down
  the river to the pier, a distance of thirteen miles, in less than an hour.

  Her name was the Wilmington, and she plied between Wilmington, Carolina Beach and Southport. Her
  captain and owner, John W. Harper, liked to point out the sights on the way down: the old
  wrecks, the colonial plantations, the rice fields.

  People from the city and from up-country came by the thousands every summer, to eat fish, take
  a surf bath, and catch the sea breeze.

  In 1899, the river was the way to the beach.
