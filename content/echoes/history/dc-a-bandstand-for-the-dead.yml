teaser: "This temple was built so a band could play in it."
script: |
  Walk up to the little round temple in the trees. Twelve columns, a domed roof, white marble. Step up onto its platform. It is just big enough to hold a military band.

  That was the idea. This is a war memorial, and it was built as a bandstand. Every concert played here was meant to be a tribute to the dead.

  Look down at the edge of the platform. There are names cut all the way around it. Four hundred and ninety nine people from Washington who died in the First World War. They are in alphabetical order. No ranks. No race. Seven of them are women.

  Getting the list right took a committee. The Army, Navy and Marines had one count. The American Legion had another. The names were printed three times in the local papers, so families could correct them.

  On Armistice Day, nineteen thirty one, President Hoover dedicated it. And a seventy seven year old man who had grown up in this city stepped up to lead the Marine Band. John Philip Sousa. He had led that band once, decades before. He conducted for twenty minutes.

  Stand in the middle and look out through the columns.

  It is very quiet now. It was built for music.
detail: >-
  The Park Service's two pages both give 499 names; one older page says 487 for the trees planted nearby, which is not used. The Park Service says concerts became rarer after the Second World War as bandstands went out of fashion.
