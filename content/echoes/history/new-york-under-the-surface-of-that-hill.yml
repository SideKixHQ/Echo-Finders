teaser: "They could have walked free. All they had to do was change sides."
script: |
  Look up at the column, rising out of the hilltop. Then look down at the steps under your feet.

  Underneath you is a crypt. It holds the bones of prisoners from a war fought two hundred and fifty years ago.

  During the Revolution, the British kept American prisoners in old ships, moored in the bay just north of this hill. The worst was called the Jersey. It was built for four hundred sailors. They crammed twelve hundred Americans into it.

  A boy named John Blatchford went to sea at fifteen, on a privateer. He was captured. He was sent to prison in Nova Scotia, put on trial in Britain, put to hard labor in Sumatra. And then he was put on the Jersey. Twice.

  The second time he came aboard, he looked for the men he had left three months before. Very few were there. Some had escaped. Some had been exchanged.

  But the greater part, he wrote, had taken up their abode under the surface of that hill.

  More than eleven thousand five hundred people died on those ships.

  And here is the turn. Almost every one of them could have walked free. The British offered them freedom, if they would fight for the King. Almost none of them took it.

  Look up at the column again.

  It is standing on their answer.

