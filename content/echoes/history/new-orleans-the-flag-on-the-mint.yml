teaser: "Look up at the roof of the Mint. A flag flew there for about three hours."
script: |
  Look up at the roof of the Mint, above the columns.

  Sunday the twenty-seventh of April, eighteen sixty-two. A Union fleet had fought its way up the river, and the city had nothing left to resist it with. The mayor refused to raise the United States flag himself. So the navy sent a party ashore to raise one here.

  They put it up at about eight in the morning, and went back to their ship. They left no guard. Instead, guns up in the rigging of the warship lying off the Mint were aimed at the flagstaff, with orders to fire on anyone who touched it.

  At eleven, the crews gathered on deck for prayers.

  About twenty minutes in, the guns went off. Men were on the roof. They tore the flag down and got away with it.

  Accounts disagree about who reached it first. They agree on who ended up with it. William Mumford.

  When General Benjamin Butler took command of the city, Mumford was arrested and tried for treason by a military commission.   On the seventh of June, he was hanged from a beam fixed between the two middle columns of the Mint's front porch, near where you are standing.

  Butler's biographer wrote that his life was justly forfeited. A Louisiana school history later called the hanging unjust and cruel.

  The flag he pulled down had been flying for a little over three hours.
