teaser: "This fort was built out in the water. Then, at some point nobody wrote down, the water left."
script: |
  Stand by the fort and look around. Grass, trees, a parking lot. The sea is somewhere beyond them.

  When this fort was built, it stood in the water. The site was in about ten feet of water at high tide, some four hundred and forty yards from shore. A wooden drawbridge seven hundred and twenty feet long connected it to the island.

  Work began in 1845. Yellow fever kept driving the workers away. Hurricanes kept knocking things down. On the eleventh of October, 1846, a hurricane destroyed everything built so far except the cistern, the smithy and the stable, and four workmen drowned.

  They kept going. By 1861 the fort was close to completion, just in time for the Civil War. It was garrisoned all through the war, and Key West stayed in Union hands.

  Then, slowly, it lost the sea. In 1898 the top two tiers were taken off. And sometime between 1891 and 1939, the fort became landlocked.

  Nobody wrote down the day the water left.
