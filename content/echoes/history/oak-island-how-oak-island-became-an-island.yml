teaser: "The water on this side of the island has not always been here."
script: |
  Look at the water on this side of the island, the quiet side. It is the Intracoastal Waterway, and it is the reason you are standing on an island at all.

  Oak Island was not always an island. This twelve mile strip of land was cut off from the rest of Brunswick County in the 1930s, when the waterway was finished.

  A swing bridge was put in to bring people across. In 1971 a barge hit it and destroyed it.

  A high rise bridge opened in 1975, and a second one in 2010. Two ways in, and both of them cross this channel.

  On the beach side, you face the ocean. On this side, you are looking at the water that made the island.
