teaser: "The beach was burning, and the only way to bring a fire engine was by rail."
script: |
  Look down North Lumina Avenue, along the north end of the island.

  In 1934, the Great Fire burned through here. It is thought to have started in the Kitty Cottage,
  from a careless cigarette or an electric iron.

  A brisk westerly wind drove it, then a gale shifted to the south southwest and pushed it into the
  Oceanic Hotel. In less than three hours, a third of the beach was gone. The town counts a hundred
  and three buildings destroyed.

  Wilmington's fire department was called. But there was no automobile bridge yet, and everything
  came onto the island by trolley or by boat. So the firefighters loaded an engine onto the trolley.

  It made the crossing. Then, off the tracks at last, it got stuck in the sand.
