teaser: "There is an eagle over the Cabildo's arches. It was not there yet on the day that matters."
script: |
  Face the Cabildo, the arcaded building to the left of the cathedral. Look up at the triangle above its centre arches. There is an eagle carved in it.

  That eagle was not there yet on the day that matters.

  In November eighteen oh three, Louisiana was still Spanish. Spain had already agreed to hand it back to France, and the city already knew that France had sold it on to the United States.

  On the thirtieth of November, in the council chamber of this building, the Spanish governor handed the colony to a French official named Laussat. Out in this square, the Spanish flag came down and the French tricolour went up.

  It stayed up for twenty days.

  On the twentieth of December, the American commissioners rode into the square at the head of their troops. They went up to the same building, and Laussat gave them the keys of the city. Then they all walked out onto the gallery up there to watch the flags change again.

  A guard of fifty old French soldiers had kept watch over their flag for those three weeks. As it came down, they took it in their arms, and marched away with it in silence.

  The eagle was carved into that triangle eighteen years later. By then, nobody needed telling whose building it was.
