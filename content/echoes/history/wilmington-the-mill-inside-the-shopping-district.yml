script: |
  The Cotton Exchange can feel like a collection of old shops. One of its earlier chapters
  involved something much less leisurely: milling.

  Downtown's business association identifies part of the complex with a flour and hominy
  mill before later alterations and cotton-business use. The connected buildings
  accumulated different jobs rather than appearing all at once as a shopping destination.

  Walk through only the passages open to visitors. Notice the changes in level and
  construction. They make more sense when you think of separate working buildings joined
  into a modern experience.

  The name Cotton Exchange highlights one phase. Milling reminds us that waterfront
  commerce included everyday food as well as export goods. Behind the present storefronts
  lies a city that processed, stored, sold, and shipped the things people needed.
