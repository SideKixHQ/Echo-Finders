teaser: "Wash kettles, bright and shining, full of coffee."
script: |
  Look along Washington Avenue toward the river. In the spring of eighteen sixty one, it was the road to the war.

  Troops from the eastern states landed at the foot of this avenue. Then they waited here for the trains south, to Washington. They were tired, and they were hungry.

  The women who lived around here saw it. Many of them did sewing work for the army arsenal. Early one morning, they started handing the soldiers coffee. Soon, a newspaper said, you could see a hundred women lined up along the railroad track at dawn, passing cups of home made coffee through the windows of the cars.

  A man named William Cooper had a cooper's shop just here, on Otsego Street, where they made barrel staves for the sugar islands. He had a big fireplace. He offered it to the women. They brought out their wash kettles, bright and shining, and made coffee by the gallon. Butchers and grocers sent food. Farm women from the Neck came in with wagons of milk. Someone built a long table out of rough boards.

  The Cooper Shop Volunteer Refreshment Saloon had begun. Cooper and his partner gave up nearly their whole shop for four years. By the end of the war, the kitchen had fed six hundred thousand soldiers.

  Look along the avenue again, toward the water. Six hundred thousand.

  It started with a few cups, handed up through a train window.
