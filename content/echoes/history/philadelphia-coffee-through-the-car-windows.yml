# Listening spot: Just south of Washington Avenue, east of Front Street, where Otsego Street ran and the Cooper Shop stood "some fifty yards south from Washington Avenue".
# Position: Washington Avenue and Front Street from the Overture street map (39.933448, -75.145728), moved east and a little south toward the old line of Otsego Street, which is not on the modern map (low confidence for the building; the railroad line along Washington Avenue and the landing at its foot are certain).
