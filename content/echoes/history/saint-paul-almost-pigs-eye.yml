teaser: "The city's first resident at this spot was a whiskey seller called Pig's Eye."
script: |
  Below this path, under the road, is a cave you cannot see.

  The Dakota knew it as In-yan Ti-pi. It was the first building site of what became Saint Paul.

  In 1838 a man of dubious reputation, who sold alcohol to Native Americans and to soldiers from Fort Snelling, built a cabin at the mouth of the cave.

  His name was Pierre Parrant. Everybody called him Pig's Eye.

  Two years later the army at Fort Snelling threw him out.

  The cluster of cabins downstream went by two names. The Great Marsh, or, after its best known inhabitant, Pig's Eye.

  Then a Catholic priest, Father Lucien Galtier, built a chapel on the bluff and named it for Saint Paul.

  The name stuck.

  The cave did not. Its entrance was buried in 1960, when Shepard Road was built.

  The city came within a priest of being called Pig's Eye.
