teaser: "He was resting under a tree, and he picked a flower."
script: |
  Look at the old stone house, and find the carved stone above one of the windows. The man who lived here cut those words himself, in seventeen seventy. Tis God alone, almighty Lord. John Bartram.

  Bartram was a farmer. A Quaker ploughman. And this is how he told it. One day he was busy at his plough, and tired, so he sat down in the shade of a tree to rest. He picked a daisy, without thinking. And then he looked at it. Really looked. All its tiny parts. And a thought came to him. What a shame, that you have spent so many years tilling the earth and destroying so many flowers and plants, without knowing how they are made.

  So he went into town and bought a book about plants, and a Latin grammar. A schoolmaster taught him enough Latin, in three months, to read the great botanist Linnaeus.

  He started with his own farm. Then he went further. Up to the Great Lakes. Down to Florida. Thousands of miles, until he was past seventy. He sent seeds and plants across the ocean to scientists in Europe, and he wrote the first books of travels ever written by a native born American.

  He brought what he found back here, and planted it, in a garden that ran down to the Schuylkill.

  Look at the garden around you. He filled it from half a continent.

  It started with one daisy.
