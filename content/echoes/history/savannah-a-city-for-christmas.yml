script: |
  Look at the house on the corner, with the iron porches and the battlements along the roofline. It was begun in eighteen fifty-three for Charles Green, in the Gothic style, and finished in eighteen sixty-one.

  On the twenty-second of December, eighteen sixty-four, it became the headquarters of General William Tecumseh Sherman. His army had marched from Atlanta to the sea, and Savannah was his.

  That same day, Sherman dated a telegram to President Lincoln.

  It went by way of Fort Monroe, in Virginia, and it is marked from there on the twenty-fifth. Christmas Day.

  It reads, I beg to present you as a Christmas gift the City of Savannah, with one hundred and fifty heavy guns and plenty of ammunition, and also about twenty-five thousand bales of cotton.

  Lincoln answered the day after Christmas. Many, many thanks for your Christmas gift, he wrote. He admitted that when Sherman left Atlanta for the coast, he had been anxious, if not fearful.

  Sherman kept his headquarters in this house until the first of February.

  The telegram, and a copy of the reply, are in the Library of Congress. Not many Christmas presents come with an inventory.
