tags: [new-orleans, new-orleans-core, treme, claiborne-avenue, civil-rights, mardi-gras]
teaser: "There used to be real ones, right where you are standing."
script: |
  Look up at the highway over your head, and at the concrete columns holding it up. Some of them have trees painted on them.

  There used to be real ones, right here.

  Before the highway, North Claiborne Avenue was a boulevard lined with oak trees and azaleas. People called it the Main Street of Black New Orleans. Drug stores, an insurance company, a theater, a toy store, restaurants. Black families could not shop on Canal Street then, so this was where you went. People played football and baseball under the trees, and Mardi Gras parades ended here, in celebration.

  Amy Stelly has lived in this neighborhood her whole life. She was a very young child, she says, when the interstate was rammed through. She has been fighting to take it down for as long as she can remember.

  The work began on the day after Mardi Gras, nineteen sixty eight. The oaks were ripped out of the ground, and the pillars went up in their place. Hundreds of homes and dozens of businesses along the avenue were destroyed. The highway was finished that same year.

  Years later, a woman named Barbara Lacen Keller stood under here, leaning against one of the painted pillars, and told a reporter what she thought. Claiborne Avenue, no matter what you do, will always be ours.

  Look at the painted trees again.

  They are standing where the oaks stood.
detail: >-
  Sources date the start of demolition to the day after Mardi Gras 1968 (NBC News, and Amy Stelly to WBUR); the Boston Globe gives 1968 for completion, while other accounts place the start of work in 1966. The painted columns are the work of local artists; this echo does not attribute any single painting.
