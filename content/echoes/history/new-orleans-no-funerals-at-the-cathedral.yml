teaser: "A fifty dollar fine for a funeral."
script: |
  Look at the front of this church. The plain stucco face, the open porch, the bell tower above.

  It was built for one purpose. Funerals.

  In the early eighteen-hundreds, Catholic funerals in New Orleans were held at the cathedral, in the middle of the old town. The city council came to fear that the custom was spreading disease, in a city where epidemics came back again and again.

  So the council asked the church to build a chapel out here instead, at the back edge of town, close to the cemetery. The church bought this lot in eighteen twenty-five, for four hundred and twenty-five dollars. The chapel was finished in eighteen twenty-seven.

  That same year the council made it law. A funeral at the cathedral would now cost a fifty dollar fine.

  So for years, this was where the city's Catholic dead stopped on their way to the tomb.

  Later the chapel became a parish church. It was called the Italian church for a while, then served the city's Spanish speakers, which is how it came by the name it carries now. Our Lady of Guadalupe.

  The building was enlarged, but its front was left as it was. It was made to be the last door a great many people came through.
detail: |
  Sources differ on how long it served only the dead. The HABS report says the funeral
  ordinance was struck down by the Louisiana Supreme Court in 1844, when the chapel became
  the parish church of St. Anthony of Padua; the 1913 Picayune guide says it was in
  constant use as a mortuary chapel until 1870. It was renamed Our Lady of Guadalupe in
  1918 and enlarged in 1952.
