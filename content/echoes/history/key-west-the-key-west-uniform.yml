teaser: "A tired president came here on doctor's orders, and went home in a loud shirt."
script: |
  Look at the white house in front of you. In November 1946, a tired president came here on doctor's orders.

  Harry Truman had become president without warning, when Franklin Roosevelt died. He spent the next year bringing the Second World War to an end. His doctor ordered him to get some rest. A quiet place was found for him, at the naval base in Key West.

  At first he would not dress like the locals. He wore dress shirts and slacks, even fishing.

  Then he gave in. Light, comfortable sport shirts. He and his staff called it the Key West Uniform.

  On his fifth trip, in November 1948, a Miami sportswear company sent him four brightly patterned shirts. One had a stylized bird on it. People wondered whether the president would actually wear them.

  He wore them four days in a row, and was photographed every time.

  After that, the shirts arrived by the box. Newspapers called them spiffy, dizzy and wild. A writer for Life magazine said most people agreed they were much too loud.

  As the years went on, the president's shirts only got louder.
