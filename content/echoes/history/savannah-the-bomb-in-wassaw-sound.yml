teaser: "Somewhere out there, under the mud, is a bomb the Air Force decided to leave alone."
script: |
  Look south, past the end of the island, to the water beyond. That is Wassaw Sound.

  Somewhere under it, in the mud, is a bomb that weighs seven thousand pounds. The Air Force knows it is there. It has decided to leave it alone.

  On the fifth of February, nineteen fifty eight, a B forty seven bomber was flying a training mission off the Georgia coast with a nuclear bomb aboard. A fighter jet came down on top of it. The fighter's pilot never saw him on his radar. The collision tore the fighter's wing off, and badly damaged the bomber.

  The bomber's pilot, Colonel Howard Richardson, was afraid the bomb would break loose when he tried to land. So, over the water off Tybee, he let it go. Then he brought his crippled plane down safely. The fighter pilot ejected and landed in a swamp.

  The Navy searched for more than two months. They never found it.

  The Air Force says the bomb had no nuclear capsule. A Defense Department memo from nineteen sixty six called it a complete weapon. The Air Force says that if no one disturbs it, it poses no hazard. If someone tries to raise it, it could.

  Look out at the sound again.

  Sometimes the safest thing to do with a bomb is nothing.
detail: >-
  NPR (2008) and CBS News (2001, with AP) agree on the date, the collision with an F-86, the weight and the failed search. NPR says the Navy searched "more than two months"; NBC (2004) says "nearly 10 weeks". The disagreement over the nuclear capsule is told as a disagreement, with both sides named. The bomb's exact position is unknown, so the echo is placed on the nearest shore facing Wassaw Sound.
