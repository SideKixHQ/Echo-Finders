# Drafted by Claude Code (2026-11-10) for the second Savannah batch, following the six beats of docs/writing-echoes.md (echo-format-v2).
# Listening spot: the south end of Tybee Island, on the beach where the Back River meets the ocean, looking south toward Little Tybee and Wassaw Sound.
# Position: the south tip of Tybee from the coast data in the app's map, set on the sand above the tide line (medium confidence; the app's street file has no tiles on Tybee). The bomb itself is in the water, in Wassaw Sound, and nobody knows exactly where; this is the nearest public shore that faces the sound.
id: savannah-the-bomb-in-wassaw-sound
title: "The Bomb in Wassaw Sound"
summary: "In 1958 an Air Force bomber dropped a 7,000 pound nuclear bomb into the water off Tybee after a midair collision. It has never been found."
place: "South end of Tybee Island, facing Wassaw Sound, Georgia"
