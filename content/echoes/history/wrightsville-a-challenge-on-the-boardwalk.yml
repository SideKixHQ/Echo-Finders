teaser: "A wartime boardwalk in the blackout, a soldier's challenge, and a shot in the dark."
script: |
  Look along South Lumina Avenue toward where Lumina Pavilion once stood.

  In 1943, Assistant Police Chief Brooks was patrolling the boardwalk around the pavilion when he was
  shot by a soldier assigned to Wrightsville Beach.

  The war had crowded this island. The town grew from two hundred and fifty-two residents to fifteen
  hundred, policed by two full-time officers in winter and three in summer. Lumina's outside lights
  were off for the blackout, and more and more soldiers came looking for fun.

  The town's own history calls the circumstances unclear. The belief is that Brooks failed to identify
  himself after the soldier challenged him.

  He made a full recovery, and went back on duty.
