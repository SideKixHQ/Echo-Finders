teaser: "The men sworn to protect Washington included one who was plotting against him."
script: |
  Look around this corner. Traffic, loft buildings, the roar of Varick Street. In the summer of seventeen seventy six, there was a country house here, the Mortier House. And George Washington was living in it.

  He had a guard of picked soldiers to protect him. One of them was a man named Thomas Hickey.

  That June, a plot was uncovered. Loyalists, working for the British governor of New York, had been recruiting men in the city. Some of them were in Washington's own guard. What exactly the plot was meant to do is still argued about. Kidnap him, or kill him.

  Hickey was the only one of the guards to be put to death for it. A court martial found him guilty of sedition, mutiny, and treacherous correspondence with the enemy. Washington approved the sentence himself. He ordered four brigades to march out and watch.

  Later tellers added a dish of poisoned peas, meant for the general's plate. The court records say nothing about peas.

  On the twenty eighth of June, they hanged him, in front of a crowd. A soldier named Moses Sleeper wrote it down in his diary that night. This day Thomas Hickey was executed for treachery, at New York, in the midst of a thousand troops.

  And then, in the same line, he wrote something else.

  This day arrived at the Hook, twenty sail of transports.

  The British fleet had come.

