teaser: "A young clerk was getting ready for bed when he heard the crowd."
script: |
  Look at the narrow brick house across the street from Ford's Theatre, with the steps up to its front door. The President of the United States died in there, in a small back bedroom of a boarding house. Why here?

  On the night of the fourteenth of April, eighteen sixty five, a young War Department clerk named Henry Safford was renting a room in this house. He was getting ready for bed when he heard a commotion in the street. He walked out onto those front steps, and saw a crowd. In the middle of it, soldiers were struggling to carry Abraham Lincoln. Safford waved, and called out. Bring him in here!

  They carried him through that door, to a little bedroom at the back. The bed was too short for him. They had to lay him across it, corner to corner. The Navy Secretary, Gideon Welles, was in that room all night. He wrote, the giant sufferer lay extended diagonally across the bed, which was not long enough for him. The room was small and overcrowded.

  For nine hours, the President clung to life. At twenty two minutes past seven in the morning, he died. A silence fell. The Secretary of War, Edwin Stanton, broke it. Now he belongs to the ages.

  Look at the house again. Afterwards, souvenir hunters stripped off its wallpaper and its carpets. The Petersen family's boarding house never recovered. In eighteen ninety six, the government bought it. It was the first time the country had ever bought a house to save it.

  All because of four words from a lodger on those steps.
