teaser: "Find the two old cherry trees by the large bronze plaque here."
script: |
  Find the two old cherry trees by the large bronze plaque here.

  They were planted on the twenty-seventh of March, 1912, by the First Lady, Helen Taft,
  and Viscountess Chinda, the wife of the Japanese ambassador. Only a few people watched.
  The whole cherry blossom festival grew out of that small ceremony.

  But these were not the first trees Tokyo sent.

  Two years earlier, two thousand cherry trees had arrived in Washington, a first gift from
  Japan. Inspectors from the Department of Agriculture found them full of insects and
  nematodes, and diseased. To protect American growers, they had to go. The President gave
  his consent, and in January 1910 the whole gift was burned.

  A local paper reported that about a dozen of the buggiest trees were kept back for
  study, with an entomologist standing guard, armed with a butterfly net and a cyanide
  bottle.

  Tokyo's answer was to try again. Three thousand and twenty trees this time, grafted
  from a famous collection along a riverbank outside the city.

  The first gift was burned.

  These two trees are the reply.
