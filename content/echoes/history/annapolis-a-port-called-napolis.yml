teaser: "Alex Haley had one word to go on. It was the name of this harbor, misspelled."
script: |
  Look along this waterfront for the plaque.

  When Alex Haley was researching Roots, he had one clue to where his ancestor had come ashore. A port called Napolis.

  He guessed it meant Annapolis, and he was right.

  On the twenty-ninth of September, 1767, a ship carrying about one hundred and forty enslaved men and women arrived here.

  Among the men who had put money into that cargo was Daniel of St. Thomas Jenifer, who would later sit in the convention that wrote the Constitution.

  It is believed that one of the people on that ship was Kunta Kinte. Believed, not proven.

  A family's history came down to a single word, Napolis, and a good guess.
