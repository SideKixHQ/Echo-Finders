teaser: "Almost nobody out here had heard a word of it."
script: |
  Face the back of the hall. This square was the State House yard, and you are standing in it.

  On the fourth of July, seventeen seventy-six, Congress approved the Declaration of Independence in there. Almost nobody out here had heard a word of it.

  Four days later, on the eighth, the bells of the city called people into this yard. At noon a colonel named John Nixon stood up on a raised stage and read the whole thing out loud. It was the first public reading of the Declaration.

  John Adams wrote about it the next day. He called the platform that awful stage, and he meant awe inspiring. Three cheers, he wrote, rended the welkin. The bells rang all day, and almost all night. Even the chimers chimed away.

  In the courtroom of the State House, above the judge's bench, hung the coat of arms of King George the Third. After the reading, a crowd took it down and burned it.

  About nine years later a painter named George Rutter made a new coat of arms for the same courtroom. The arms of Pennsylvania. It is one of the very few furnishings from that century still in the building, and it hangs in the courtroom now.

  The king's arms came down and burned. Pennsylvania's are still on the wall.
