teaser: "Built to keep a foreign navy out. Seized, in the end, by its own city."
script: |
  Look at the brick walls of the fort, low against the river.

  This fort was built to stop an enemy fleet. In the end it was taken from the other direction.

  In the early eighteen hundreds, President Thomas Jefferson ordered a chain of forts to defend the young nation's coast. This was one of them, built between eighteen oh eight and eighteen twelve, on top of an earthen battery left from the Revolution. Savannah named it for James Jackson, born in England, who had fought on the American side and later governed Georgia.

  Then, in eighteen sixty one, as Georgia left the Union, Savannah's own soldiers marched in and took the fort, along with Fort Pulaski, for the state.

  Look at the walls again.

  Built to keep a foreign navy out. Taken, in the end, by the city it was built to protect.
detail: >-
  Carol M. Highsmith's catalog records: Jefferson's defense system, "constructed between 1808 and 1812 over an old earthen battery from the American Revolution", and Jackson "a British native who fought for the American cause". Lee (1869): "Another fort was erected about two and a half miles below the city and named Fort Jackson, after Governor James Jackson", during the War of 1812 period, and the seizure of "Fort Pulaski, Fort Jackson, and Oglethorpe Barracks" by Savannah's soldiers under General Lawton. Lee places the Fort Pulaski seizure before the ordinance of secession and Fort Jackson's after it; the script says only "in eighteen sixty one, as Georgia left the Union".
