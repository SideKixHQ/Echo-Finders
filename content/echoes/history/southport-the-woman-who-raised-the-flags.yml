teaser: "For sixty years, one volunteer decided when this town should be afraid of the weather."
script: |
  Look at this corner of the lawn by the river. A weather tower stood here from 1901, one of a chain the Weather Bureau put up along the east coast to warn ships of hurricanes.

  It came down on a stormy night in February 2020, twisted by the wind. The town raised the money for an exact copy.

  The tower spoke in flags. Two red pennants meant gale force winds. At night, a red light over a white light said the same thing.

  For more than sixty years, the person raising those flags here was a volunteer, Jessie Stevens Taylor.

  In October 1954, Hurricane Hazel came ashore in southern Brunswick County as a Category 4 storm. Taylor was seventy five years old. Her warnings are credited with saving the lives of hundreds of people.

  President Dwight Eisenhower sent her a commendation.

  Nineteen people died in North Carolina in that storm. None of them died in Southport.
