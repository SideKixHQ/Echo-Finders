teaser: "Crushed, burned, roots snapped, and one branch still alive."
script: |
  Find the pear tree on this plaza that people call the Survivor Tree.

  It was planted here in the nineteen seventies, at the foot of the Twin Towers. And it is here again. Which should not be possible.

  In October, two thousand one, about a month after the towers fell, a worker clearing the rubble found it. It was crushed between two blocks of concrete. Its roots were snapped. Half its trunk was gone, and the rest was burned black.

  There was one living branch.

  Ronaldo Vega was there. The tree was upended, he said, thought to be dead, left for dead. Then a search team saw new growth. And they decided.

  We have to try and save this tree. It's the last living thing that's going to come out of this site.

  It was about eight feet tall when it went to a city nursery in the Bronx. Nursing it back was touch and go. In December, two thousand ten, it came home to this plaza. It stood about thirty feet tall.

  Since then, its seedlings have been sent to fire stations that lost firefighters that day. To Newtown, Connecticut. To Boston.

  Look up into its branches.

  Every spring, they are covered in blossom.

