teaser: "Before it chose a president, the Continental Congress chose a room."
script: |
  Look down the court from Chestnut Street. At the end of it is a small brick hall with a cupola on top. It was built by a guild of carpenters, and the guild still owns it.

  On the fifth of September seventeen seventy-four, the delegates to the first Continental Congress gathered in the city with a choice to make. The Speaker of the Pennsylvania Assembly, Joseph Galloway, had offered them the State House. The carpenters had offered their hall.

  They walked here first, to take a look.

  John Adams wrote that the general cry was that this was a good room. One delegate, James Duane, argued that if the State House was just as convenient, it ought to be preferred. It was a public building, he said, and this was a private one, and the Speaker deserved the courtesy. The question was called anyway. A great majority chose the carpenters.

  That same day Galloway wrote to William Franklin that Congress had met at Carpenters' Hall, notwithstanding the offer of a much more proper place. He suspected it had all been settled privately, out of doors, before anyone walked over.

  Only after that vote did they choose a president.

  The Continental Congress began by deciding where to sit. It chose the builders.
