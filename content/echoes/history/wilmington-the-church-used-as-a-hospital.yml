teaser: "In February 1865, Union forces entered Wilmington."
script: |
  In February 1865, Union forces entered Wilmington. St. James's church building was
  seized and used as a hospital.

  The congregation's history records that the building was returned that summer, repaired,
  and used for services again in December. A space designed for worship had temporarily
  become a place of wartime care.

  The change makes you see the church differently. Its doors and interior were practical
  resources in a city undergoing military occupation, not just symbols on a familiar
  street.

  From the sidewalk, consider the work required to make a building serve an urgent
  purpose, then restore it to its regular life. The hospital chapter was temporary, but it
  belongs to the building's history. Returning to worship did not mean that the preceding
  months had never happened.
