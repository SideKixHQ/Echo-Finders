teaser: "The astronauts got a cake. The men in the water got a shark."
script: |
  Look up at the great grey side of the aircraft carrier. It carries the name Yorktown. It was not the first ship to carry it.

  The first Yorktown, a carrier too, was sunk at the Battle of Midway in nineteen forty two. This one was named for it, and built in seventeen months.

  It went to war in the Pacific in nineteen forty three. It earned eleven battle stars. A film made aboard it, The Fighting Lady, won the Academy Award for best documentary.

  Twenty five years later, it was given a very different job.

  In the dark before dawn on the twenty seventh of December, nineteen sixty eight, a capsule came down in the Pacific, a thousand miles from Hawaii. It was Apollo Eight. Its three men had just become the first people to fly around the moon. The Yorktown was waiting for them.

  Navy frogmen from the helicopters fixed a floating collar to the capsule. The astronauts were hoisted up to a helicopter, and welcomed aboard with honours, a call from the President, and a five hundred pound cake.

  The frogmen stayed in the water, waiting their turn, for more than an hour. One of them said later that a white tip shark, twelve feet long, rose up from below to look at them.

  They raised their hands to the ship to warn it. Everyone on deck thought they were celebrating too.

  Look up at the deck again.

  The astronauts got a cake. The men in the water got a shark.
detail: >-
  The National Register nomination for USS Yorktown (CV-10) gives the ship's naming for the carrier Yorktown (CV-5) sunk at Midway in 1942, its construction in seventeen months, its entry into the Pacific war in 1943, its eleven battle stars, The Fighting Lady as the Academy Award winning documentary of 1944, and its recovery of the Apollo 8 spacecraft in December 1968 after the first orbital mission to the moon. The Post and Courier's 2018 interview with one of the Navy frogmen gives the predawn splashdown on 27 December 1968 about 1,000 miles south southwest of Hawaii, the flotation collar, the astronauts' welcome with honours, a call from President Johnson and a 500 pound cake, the frogmen's wait of more than an hour, the twelve foot white tip shark, and the misread signal. The shark is one man's recollection, and the script says so. The frogman is living and not named here.
