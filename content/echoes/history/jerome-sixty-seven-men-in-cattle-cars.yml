teaser: "On a July morning in 1917, this town rounded up the strikers and shipped them out by rail."
script: |
  This town has a long memory for trouble. Here is a day of it.

  On the morning of the tenth of July, 1917, hundreds of miners and other citizens, all armed, went through Jerome on what they called a drive. The object, the paper said, was cleaning up the town.

  They were after the Wobblies, the Metal Miners' branch of the Industrial Workers of the World, who had called a strike in the copper district. The miners' own international union had repudiated it. City officials called the strikers undesirables.

  Sixty-seven men were put into two cattle cars. They were given drinking water, but nothing to eat. Fifty armed citizens went along, to make sure they did not come back.

  The mayor stood in the railroad yards and watched the cars disappear in the distance. As the train pulled out, several of the men shouted back at the crowd. We'll come back.

  At Jerome Junction, twenty-seven miles away, armed men from Prescott were waiting, among them some of the most prominent businessmen of that city. Most of the strikers were sent on north by freight train, toward Needles.

  The next morning, a newspaper headline put it plainly. Sixty-seven Wobblies, shipped from Jerome in cattle cars.
