teaser: "At the top of this column, a young woman looks down at twenty one names."
script: |
  Look up to the top of this tall marble column. A young woman stands there, hands clenched, looking down. Below her, on the shaft, are twenty one names.

  They were girls and young women, many of them the daughters of Irish immigrants. Some were as young as thirteen. In the summer of eighteen sixty four, they worked at the Washington Arsenal, packing cartridges for the Union Army. Small hands were thought to be better at it.

  The seventeenth of June was a blazing hot day. A window was open for air. Outside, the superintendent had left pans of fireworks drying in the sun.

  Just before noon, they caught. A burning pellet flew in through the open window, onto the table full of cartridges. A barrel of gunpowder went up, and lifted the roof off the building.

  Two days later, a funeral procession nearly a mile long came here. Behind the hearses rode President Lincoln. He did not speak. He came as a mourner.

  As the coffins went into the ground, the crowd began to chant.

  Their co-workers raised the money for this column, and it went up a year later.

  Read the names.

  Farewell, sisters. Farewell.
detail: >-
  Told without injuries, by design. The coroner's jury found the superintendent careless and negligent but recommended no criminal charges, so he is not named. The script uses twenty one, the number of names on the monument according to the National Archives and the Park Service.
