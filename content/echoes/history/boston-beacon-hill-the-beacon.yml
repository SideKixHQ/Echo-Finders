script: |
  Find the tall column with the eagle on top. It stands in for something that is gone.

  In sixteen thirty-five, the English settlers put up a tall wooden beacon on top of this
  hill. If danger came, an attack or an outbreak, it could warn the countryside. The hill
  took its name from it.

  In seventeen seventy-five, with colonial troops gathering across the river at Cambridge,
  General Gage built a small fort up here, and had the beacon taken down. A signal to the countryside was the
  last thing he wanted.

  The British left Boston in March seventeen seventy-six. Bostonians put the beacon straight
  back up.

  It lasted another thirteen years. In seventeen eighty-nine, a storm blew it down. The
  eagle column, designed by Charles Bulfinch, took its place.

  The hill has changed even more than the beacon. It once had three peaks. Bostonians dug
  much of them away to fill in land around the city.

  The beacon is gone, and most of the hill is gone. Only the name stayed put.
