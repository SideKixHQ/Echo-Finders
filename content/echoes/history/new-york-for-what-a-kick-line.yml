teaser: "Ten police with their clubs out. Twenty kids with their arms around each other."
script: |
  Look around this small park. The benches. The iron fence. The white figures of the sculpture.

  In the summer of nineteen sixty nine, this park was a refuge for street kids. Most were runaways. Most had left home, or been thrown out, because they were gay and could not hide it.

  In the early hours of the twenty eighth of June, the police raided the bar across the street, the Stonewall Inn. Raids were nothing new. This time, people fought back.

  That first night, for some reason, the police did not chase anyone into this park.

  A man named Danny Garvin was watching from a friend's window on Grove Street. He saw about ten police on one side, holding their clubs straight out. And on the other side, about twenty young men. They rolled up their trouser legs. They put their arms around one another.

  And they formed a kick line.

  The police charged, and hit them. Garvin said he could never get that sight out of his mind. And he asked, for what? A kick line.

  The clubs did not work. There were more kick lines before the night was over. One year later, to the day, the first pride march in the country went through New York.

  Look at the park again. The benches. The fence.

  One of the kids from here, Thomas Lanigan Schmidt, said most of the people he knew back then were dead within four years.

  For one night, here, they were not the ones running.

