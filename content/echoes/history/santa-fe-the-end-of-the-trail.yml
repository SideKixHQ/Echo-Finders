teaser: "A bronze plaque in an adobe wall marks the end of an eight hundred mile road."
script: |
  Look for a bronze plaque set at eye level in the adobe wall, on the west side of this street. Above the words, oxen pull a wagon.

  It reads, This marks the route of the Santa Fe Trail, Kansas City to Santa Fe, 1822 to 1880.

  In 1821 Mexico won its independence, and opened trade with the United States. The new trail ran eight hundred miles, from Independence, Missouri, to the plaza just up the street.

  Almost overnight, the plaza became the hub of a vast network. One account from 1837 lists what filled it. All kinds of vehicles. Teamsters, camp cooks, roustabouts. Horses, mules, burros, pigs, and goats.

  Wagons were unloaded. Traders put up temporary booths. Everything was loaded, unloaded, bought and sold.

  Then in 1880 the railroad arrived, and that was the end of the trail.

  The wagons are long gone. The street you are standing on still carries the trail's name.
