teaser: "Before the football, this ground held a twenty-bed hospital that the whole state learned from."
script: |
  Look at the stadium. This ground once held North Carolina's first public hospital for Black patients.

  It was called Good Samaritan. It opened in 1891, with room for twenty patients.

  It was raised by Jane Wilkes and the parishioners of Saint Peter's Episcopal Church, in a South where every hospital was segregated.

  Its hardest day came in July 1911. A train packed with Black passengers crashed at Hamlet, and eighty-three of them needed a hospital. Good Samaritan was the closest one for Black patients.

  Doctors and nurses from all over Charlotte, Black and white, rushed here and treated all eighty-three together. Only three died.

  In 1903 it opened a school to train Black nurses, when no nursing school in the state was open to Black women.

  By the 1950s, Black Charlotte dreamed of closing it. The goal was to desegregate the hospitals.

  The old building was torn down for this stadium. The first game here was in August 1996.

  Seventy-five thousand seats, on the ground where twenty beds used to be.
