detail: >-
  The arc is from the State Department Office of the Historian's Milestones essay on the Citizen Genet affair (retired but online). The arming at Philadelphia, the two names of the ship, her being in the Delaware and Jefferson's sentence about her sailing are from the 1793 Message of the President to Congress with its papers, read on a scan at the Internet Archive (OCR spelling kept in the quotations). The script calls Genet "the ambassador of France" once, for the ear; his title was minister, and the next sentence says so.
