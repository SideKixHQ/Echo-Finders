# Listening spot: The Penn's Landing promenade on the Delaware River, near the foot of Walnut Street, Philadelphia, looking out over the river.
# Position: Jefferson's letter of 1793 says the Little Democrat "had been finCe armed at Philadelphia" and the President's message lists her "in the Delaware"; neither gives a wharf, so the pin is a public riverfront spot in the old port rather than a berth (high confidence on the river and the port, none on the ship's exact mooring, and the script does not claim one). About 170 m from the nearest echo.
