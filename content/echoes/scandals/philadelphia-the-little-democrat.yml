teaser: "The government asked him to keep one ship in port. He would not."
script: |
  Look out over the Delaware. In the summer of seventeen ninety three, a ship was being armed in this port against the wishes of the President, and the man behind it was the ambassador of France.

  His name was Edmond Charles Genet, the French minister to the United States. He called himself Citizen Genet.

  France was at war with Britain. Washington had declared the United States neutral. But the moment Genet landed in Charleston, he began handing out commissions to privateers, to seize British merchant ships.

  When he came on to Philadelphia, then the capital, Secretary of State Thomas Jefferson told him plainly. Fitting out French privateers in American ports broke American neutrality.

  Genet went ahead. A vessel called the Little Sarah was armed here, as a French privateer, under a new name. The Little Democrat.

  American officials warned him, again and again, to keep her in port. Genet threatened to take his case over their heads, to the American people.

  Jefferson put what happened next in a letter. In disregard of that request, he wrote, the Little Democrat went out immediately on a cruise.

  The cabinet agreed to ask France to call him home. By then France had a new government, and it wanted him sent back to face it. Washington knew that would almost certainly mean his execution, and he let Genet stay.

  Citizen Genet lived in the United States for the rest of his life. He died here, in eighteen thirty four.
