detail: >-
  Single source: the Los Angeles Times obituary of Mills (Times Wire Services, 3 May 1992), which gives the stop, the leap, the bleeding face, the denials, the elbow, the champagne line, the re-election and the loss of power, and his later work on alcoholism. A second independent source was not reachable: the Washington Post's 2021 obituary of Battistella and the contemporary 1974 reports are behind hosts this session could not reach. Mills died in 1992 and Battistella in 2021 (the latter from search results, not a fetched page), so no one named is alive; Battistella was public in the story under her stage name. No one was charged, so this is history. The weaving car and the leap are the paper's words; nothing about her is said beyond what it printed.
