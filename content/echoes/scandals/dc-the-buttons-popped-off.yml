teaser: "The most tightly buttoned man in Congress, by the water, at night."
script: |
  Look out over the Tidal Basin, toward the Jefferson Memorial. Early on the seventh of October, nineteen seventy four, police stopped a weaving car near here.

  In the car was one of the most powerful men in Washington. Wilbur Mills of Arkansas, for sixteen years chairman of the House Ways and Means Committee. He wrote much of the federal tax code. He was once called the most tightly buttoned up man in Congress.

  A woman jumped from the car and ran. She was Annabel Battistella, a burlesque dancer known on stage as Fanne Foxe, the Argentine firecracker. She leapt into the water, near the Jefferson Memorial.

  Mills stepped out of the car, his face bleeding.

  At first a spokesman denied that Mills had been in the car at all. Then Mills said she was one of the neighbors and friends he had been entertaining, that she had been taken ill, and that in a struggle her elbow had broken his glasses.

  The truth came out, slowly. Ten days later, back in Arkansas, he said it himself. I drank some champagne when I knew it went to my head quickly. And it did.

  He was elected again a month later. But he stepped down as chairman, and both the committee and its chairman lost much of their power. He went into hospital for his alcoholism, and spent his later years talking to anyone who would listen about the need for treatment.

  Look at the water. As one newspaper put it, this is where the buttons popped off.
