teaser: "She left the ink where they would find it. They took the bait."
script: |
  Look along First Street. During the Civil War, a prison stood close to here, at First and A Streets, North East. It was called the Old Capitol.

  In January eighteen sixty two, two women were brought here from a house on Sixteenth Street, where they had been held under guard. One of them was Rose Greenhow, a Washington hostess the Union knew as a dangerous agent of the South. The Library of Congress still files her photograph under two words. Confederate spy.

  Her daughter came with her. Little Rose was eight.

  Greenhow wrote down everything. Her room was about ten feet by twelve, with a straw bed. On her second day, a carpenter came to put bars on the windows.

  Her letters, she wrote, went through the detective police, who treated them with chemicals to bring out the treason. The newspapers reported that she used invisible ink. She wrote that she had left a preparation in plain sight on purpose, to draw attention away from her real means of communication. And they have swallowed the bait.

  Little Rose had a plan of her own. Never fear, she told her mother. I intend to dance and sing Jeff Davis is coming, just to scare them.

  One January day Greenhow stood at her barred window, to get out of the smoke and dust. A guard below shouted at her to go away from the window, and raised his musket. She did not move.

  At the start of June, mother and daughter were released and sent South.

  Look along the street again. A guard with a musket. A woman at the window who would not move. And upstairs, a girl of eight, planning a song.
