detail: >-
  Rose O'Neal Greenhow was arrested in August 1861, held in her own house on Sixteenth Street, moved to the Old Capitol Prison in January 1862 and sent South in early June 1862; she was never tried. Her room, the bars, the chemical tests, the decoy ink, Little Rose's song and the guard at the window are from her own book, My Imprisonment and the First Year of Abolition Rule at Washington (London, 1863), and are told as her account ("she wrote"). The transfer from her house is from the Chicago Tribune of 20 January 1862; her imprisonment in her own house and the Union view of her as "a dangerous agent of a hostile army" from the New York Herald of 16 December 1861; the release from the Louisville Daily Journal of 3 June 1862 (dateline Baltimore, 2 June). The prison's corner and the "Confederate spy" photograph title are from the Library of Congress catalogue. Her death at sea off Fort Fisher in 1864 is a separate echo (fort-fisher-the-spy-who-tried-to-row-ashore); this one is only the prison. The second woman, Mrs. Baxley, is not named.
