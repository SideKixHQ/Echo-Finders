detail: >-
  The verdict, the wagon finding, the sentence, the account of his style of living and the Shippen marriage are from the 1865 printing of the court martial proceedings, read on a scan at the Internet Archive (quotations keep the long-s OCR spelling, so "fumptuous" is "sumptuous"). The words of the reprimand are as the French diplomat Marbois reported them, quoted in that book's notes, and the script says so. The house and the start of the treasonous correspondence are from the National Park Service. Filed under History, not True Crime: a court martial on two counts of misconduct, ending in a reprimand, rather than a crime at the centre of the echo; James may prefer to move it. The existing Mischianza echo mentions Arnold and Peggy Shippen; this echo does not retell that evening.
