teaser: "Washington reprimanded him gently. By then it was far too late."
script: |
  Look at the outline of the old house here, on Market Street. Before it was the President's House, it was the home of the American commander of Philadelphia, Benedict Arnold.

  The British left the city in June seventeen seventy eight. Arnold marched in, and promptly made this house his residence and headquarters.

  He lived far beyond his pay. A costly carriage, a lavish table, servants in livery. The editor of the trial record later wrote that his style of living was what you might expect of a prince, not of an army officer in a simple republic. He married into the Shippen family, who were known to prefer the old order of things.

  Pennsylvania's government brought charges against him, and in the end he was court martialled.

  Among the charges was the matter of the wagons. Wagons drawn from Pennsylvania for the public service had been sent, at Arnold's request, to move private property out of danger.

  In January seventeen eighty the court gave its verdict. It cleared him of two charges, and found against him on two. On the wagons, it accepted that he had meant to pay for them himself and had not meant to defraud anyone. But a request from a general, it said, could work as an order. The request was imprudent and improper. He was sentenced to a reprimand from Washington.

  Washington's words, as a French diplomat reported them, were gentle. Even the shadow of a fault, he said, tarnishes the lustre of our finest achievements.

  It was far too late. The Park Service says that in the spring of seventeen seventy nine, while he was still living in this house, Arnold had already begun his secret correspondence with the British.
