# Listening spot: Public sidewalk on the south side of Market Street at Sixth Street, at the open air President's House site, Independence Mall, Philadelphia.
# Position: NPS places the Masters-Penn House, Arnold's residence and headquarters in 1778 and 1779, on the President's House site at Sixth and Market; the pin is on the Market Street pavement at the west end of the site (high confidence on the site). About 30 m from "Ona Judge Walked Out", which stands at the same site and tells a different subject; the existing Mischianza echo ("The Knights of the Burning Mountain") covers Arnold and Peggy Shippen only in passing, and this echo does not retell it.
