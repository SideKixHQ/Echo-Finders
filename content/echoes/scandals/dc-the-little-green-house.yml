detail: >-
  The house, its green stone, the garage comparison, the fraternity and the forgotten tenants are from Robert T. Small's dispatch in the San Antonio Light of 26 March 1924. The liquor deliveries (the testimony of Daniel F. Smith, who had worked for Mannington), the permit deals and the twenty thousand dollars (the testimony of M. P. Kraffmiller) and Mannington's refusal are from the Washington Daily News of 4 April, 16 April and 7 May 1924, three pages of one paper and so one source. None of it was tested at a trial, so the script calls it testimony and names nobody but Mannington and the president. The Senate committee was the Brookhart committee investigating Attorney General Harry Daugherty. Often filed with Teapot Dome, this is the Daugherty and Justice Department side of the Harding scandals.
