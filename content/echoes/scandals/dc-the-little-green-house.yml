teaser: "Twenty or thirty cases of liquor at a time, delivered by express. With a revenue man."
script: |
  Look along this block of K Street. In the early nineteen twenties a small house stood on it that the whole country came to know as the Little Green House on K Street.

  It was not grand. A reporter who went to look at it in March nineteen twenty four wrote that, beside the mansions of the city, it was little better than a garage. Its front was green stone, the pale apple color of shallow water in the tropics.

  The man who lived there was Howard Mannington, of Ohio. He had arrived in Washington just after President Harding's inauguration, and he knew Harding's Ohio friends.

  Liquor was against the law. But in April nineteen twenty four, a man who had worked for Mannington told a Senate committee that twenty or thirty cases of liquor at a time were delivered to the little green house by express. A revenue man came with them.

  In May, another witness said he had lived in the house with Mannington. He told the committee that deals in liquor permits and tax cases were arranged there, and that he had split twenty thousand dollars with Mannington.

  Mannington himself flatly refused to appear before the committee. That was the testimony, and it was never answered.

  By then the house had a deserted look by day. Fraternity boys had moved in.

  And the reporter asked a dozen men who had known Mannington who else had lived in the Little Green House. Scratch their heads as they would, they could not recall the name of a single person.
