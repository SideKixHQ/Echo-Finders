# Listening spot: Public sidewalk at the crossing of First Street and C Street NE, by the Dirksen Senate Office Building.
# Position: the Evening Star of 27 and 31 October 1963 puts the Carroll Arms Hotel, and the club on its second floor, at "First and C streets N.E.", "just across the street from the new Senate Office Building" (the Dirksen Building, per the Architect of the Capitol bounded by Constitution Avenue, Second Street, First Street and C Street NE). Set on the crossing at 38.89375, -77.00535 (medium confidence: the crossing is sourced, the corner the hotel stood on is not). The hotel is gone; the script does not say what replaced it. About 190 m from "A Loan From an Old Friend".
