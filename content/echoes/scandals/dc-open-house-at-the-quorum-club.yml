teaser: "Not a hideaway, said the man leaning on the bar."
script: |
  Look around this crossing, First and C Streets, North East. In nineteen sixty three, a hotel stood here, the Carroll Arms, just across the street from the new Senate office building. Upstairs, on the second floor, three rooms held a private club. The Quorum Club.

  It had opened in nineteen sixty one, for Senate staff, lobbyists and their guests. Drinks were a dollar apiece. Membership was limited to two hundred.

  One of its founders was Bobby Baker, the secretary to the Senate's Democratic majority. On the seventh of October, nineteen sixty three, with senators waiting to question him about his business ventures, Baker resigned. Three days later the Senate voted to investigate.

  And suddenly everyone wanted to know about the club upstairs. The talk was of a hideaway, for members of Congress, lobbyists and playgirls.

  So on the last day of October, the club did something it had never done. It opened its doors to the press, from ten in the morning until eleven.

  Reporters and photographers trooped through the three rooms. The club's treasurer, who also owned the hotel, leaned on the bar and said it was nothing of the kind. There seemed to be a feeling, he said, that the Q Club was a secretive organization and a hideaway. That wasn't the image we wanted.

  Bobby Baker was nowhere to be seen.

  And since the story broke, the treasurer said, not one member had dropped out. In the last few days, the club had voted to take in five more.
detail: >-
  Everything here is from the Evening Star: the club's founding, rooms, prices and membership limit (27 October 1963), the Senate inquiry and its timing (29 October 1963), and the press open house, the treasurer's words, the five new members and Baker's resignation on 7 October (31 October 1963). Three pages of one paper are one source, so this is single-source; a second paper's report of the open house would corroborate it. Baker was later convicted (in 1967) of tax evasion, theft and conspiracy, but no fetched source covers that, so the script ends in 1963 and the echo is history, not true crime. The treasurer, Thomas Pickford, is not named because whether he is alive is unknown. The woman the Star mentions in connection with the club, who was sent back to Germany, is not mentioned; she was never charged with anything.
