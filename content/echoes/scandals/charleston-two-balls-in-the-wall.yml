teaser: "Two shots, one on each side of a living man's head."
script: |
  Walk a few steps into St. Michael's Alley, the narrow lane beside the church. Before the Revolution, there was a fashionable tavern in this alley.

  One August day, two men in there were arguing politics. Doctor John Haley, an Irishman on the side of the colonists. And a New Yorker named Delancey, loyal to the King. Delancey called the doctor a liar.

  Haley challenged him on the spot. Pistols, upstairs, just the two of them, no seconds. Delancey agreed, and took one of Haley's own pistols. They faced each other across a table, and fired at the same moment. Delancey was killed.

  With no witnesses, the law called it murder, and Haley's friends hid him until the trial. One night, in the dark, a clothesline caught him by the throat, and he took it as a sign that he would hang.

  At the trial, the best young lawyers in Charleston defended him, Thomas Heyward, the Pinckneys and the Rutledges. And the proof came out of the plaster. Delancey's pistol had been loaded with two balls. Both were dug out of the wall behind where Haley had stood, one on each side of his head. Haley was acquitted.

  Look up at the windows above the alley, and choose a window.

  Two balls in the wall. And a head between them.
detail: >-
  Joseph Johnson's Traditions and Reminiscences (1851) dates the quarrel to 16 August 1771 at a house of entertainment in St. Michael's Alley; Ravenel (1906) suggests it was probably the South Carolina Coffee House. Which building it was is not known.
