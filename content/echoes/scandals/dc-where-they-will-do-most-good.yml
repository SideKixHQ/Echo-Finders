teaser: "Three shares left to place, he wrote, where they will do most good to us."
script: |
  Look up at the south wing of the Capitol, the House side. In February eighteen seventy three, inside it, the House of Representatives sat in judgement on one of its own members, Oakes Ames of Massachusetts.

  Ames made shovels. His family's shovels were used all over the world. He also had money in the railroad being built across the continent, through a company called Credit Mobilier.

  In eighteen seventy two, a lawsuit brought out two of his private letters, and the newspapers printed them. In one, he listed shares he had handed to members of Congress. Four from Massachusetts. One from New Hampshire. And I have three to place, he wrote, which I shall put where they will do most good to us. I am here on the spot, he added, and can better judge where they should go.

  The House argued about him for three days. A committee wanted him expelled. Instead, the House voted that it absolutely condemned what he had done. One hundred and eighty one members voted for it.

  That morning Ames had sat in a front seat with a large and handsome bouquet on his desk. It was a gift from the wife of General Sherman.

  The other members named in the affair escaped any vote at all.

  Ames went home to Easton, Massachusetts. Ten weeks later, in May, he died.

  Look at the House wing again. On that point, at least, his letter was honest. He was here on the spot.
pronunciations:
  - written: Mobilier
    say: moh-BEEL-yay
detail: >-
  The letter is quoted from the Chicago Tribune's reprint of 12 September 1872, which says the letters came out when H. S. McComb sued the Credit Mobilier and produced them under oath. The debate, the committee's call for expulsion, the substitute resolution and the vote of 27 February 1873 are from the New York Herald and the Chicago Tribune of 28 February 1873, each with its own Washington correspondent. The Tribune counts the vote on the Ames resolution as 181 to 35 in one place and 181 to 86 (an OCR misreading of 36, probably) in another, so the script gives only the 181. The bouquet is from the Tribune alone, so it rests on one source. The death and the shovels are from the Tribune of 9 May 1873. James Brooks of New York, censured the same day, is left out to keep the echo to one man.
