tags: [philadelphia, independence-park, congress-hall, scandal, duels, congress, 1798]
teaser: "A cane, a pair of fire tongs, and a Speaker who never called the House to order."
script: |
  Look at the brick building on the corner, Congress Hall. When Philadelphia was the capital, the House of Representatives met inside. And in seventeen ninety eight, two of its members had a fight on the floor.

  It began with an insult. Roger Griswold of Connecticut taunted Matthew Lyon of Vermont about a wooden sword, a jibe at an old story that Lyon had once been cashiered from the army. Lyon spat in his face.

  Then, on the fifteenth of February, before the House was called to order, Griswold picked up his cane, crossed the chamber, and began beating Lyon with it.

  Lyon was trapped. His desk was screwed to the floor in front of him, with another behind. He was literally pinned in a box, one account said. He had to shuffle out sideways. Behind the Speaker's chair, he grabbed the fireplace tongs.

  They closed, and fell on the floor. Two members pulled Griswold off by his legs.

  It was half past eleven. The Speaker was in his chair. He never called the House to order.

  That afternoon, Lyon challenged Griswold to a duel. Griswold said he would not fight him. A few days later, a House committee recommended that neither man be expelled.

  Somebody in town made a cartoon of it, and you can still see it at the Library of Congress. Griswold with his cane. Lyon with the tongs.

  In the struggle, one witness wrote, Mister Griswold lost his cane.

  Mister Lyon kept the tongs.
pronunciations:
  - written: Griswold
    say: GRIZ-wold
detail: >-
  The fight is from two newspaper accounts reprinted in The Mirror of Concord, New Hampshire, on 6 March 1798: an eyewitness letter first printed in the Gazette of the United States, and a second account sympathetic to Lyon (the desks, the tongs, the challenge and the refusal); the spitting is from the Speaker's evidence printed in The Mirror on 27 February 1798. The Library of Congress record of the print "Congressional Pugilists" gives the place, the date and the cane and tongs. The two newspaper accounts disagree on who struck first and how hard, and the script keeps to what both share. No injuries are described beyond "beating".
