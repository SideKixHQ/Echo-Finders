teaser: "No boat in the city would take the judge's man out to the ketch."
script: |
  Look out to the middle of the river.

  In December eighteen oh six, a United States bomb ketch lay out there with prisoners on board. The man who put them there was the senior officer of the United States Army, General James Wilkinson.

  Wilkinson said that Aaron Burr, the man who had fought the duel with Hamilton, was plotting against the country. He wrote to the Governor, William Claiborne, of Burr and his lawless banditti from the Ohio River. He asked for martial law, and for the writ of habeas corpus to be suspended. Claiborne refused.

  So Wilkinson acted on his own. On the fourteenth of December, he had a doctor, Erick Bollman, arrested and held in some unknown place. A judge was asked for a writ of habeas corpus. By the time it was granted, Bollman had been put on a vessel and sent down the river.

  Two more men, Ogden and Swartwout, were held on the ketch. Another judge granted a writ for them. But the city was so frightened that no boat could be found to take the officer of the court out to the ketch. The next day, for a large sum of money, a boat was found. By then, Swartwout was gone.

  Wilkinson told the court that he took on himself all responsibility.

  Bollman and Swartwout were taken to Washington. In February eighteen oh seven, the Supreme Court ordered them discharged. Their lawyer had put it plainly. The laws were open in New Orleans.

  And Wilkinson? The National Park Service says that in seventeen eighty seven, on a trip to New Orleans, he swore allegiance to the King of Spain, and worked for Spain as Agent Thirteen. He traded secrets for Spanish money for decades. It was suspected, but never proven, and he was never convicted.

  A New Orleans historian, Charles Gayarré, had a phrase for him. The pensioner and the tool of Spain.
