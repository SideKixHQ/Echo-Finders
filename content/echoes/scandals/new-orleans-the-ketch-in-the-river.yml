detail: >-
  The arrests, Claiborne's refusals, the writs, Bollman sent down the river, Ogden and Swartwout on the bomb ketch "lying in the middle of the river", no boat to be had, the large sum, Swartwout gone, and Wilkinson's reply are from Charles Gayarré's History of Louisiana: The American Domination (1866), which cites Martin's History of Louisiana and Claiborne's letters. The seizure "by orders of a military officer", the transport to Washington, the discharge in February 1807 and counsel's "The laws were open in New-Orleans" are from the Supreme Court's report, Ex parte Bollman and Ex parte Swartwout (1807), 8 U.S. 75. Wilkinson's 1787 oath to the King of Spain, "Agent 13", the decades of trading secrets, "suspected ... but never proven", his post as Senior Officer of the Army and his exoneration by court-martial in 1811 are from the National Park Service (Saratoga). "The pensioner and the tool of Spain" is Gayarré's phrase, attributed aloud. Nobody named is alive. Wilkinson was never convicted of anything, and the script says so; the Spanish payments are told as the Park Service's account. That Gayarré was a New Orleans historian is general knowledge (he was born in the city and wrote the history cited), not quoted from a source. Kept under history rather than true crime because no one at its centre was convicted and no crime was proven in court.
