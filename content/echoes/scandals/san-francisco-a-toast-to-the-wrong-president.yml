teaser: "Her gravestone says Union Spy. She got the job by raising a glass."
script: |
  Somewhere in the officers' circle of this cemetery is a marker that simply reads, Pauline C. Fryer, Union Spy.

  She was an actress. In April 1863 she was performing at a theater in Louisville, Kentucky, when two Confederate officers asked her to make a toast to the Confederacy, in the middle of the performance. They offered her money.

  She asked the Union provost marshal in Louisville what to do. He told her to accept.

  That night, where the script called for a toast to President Lincoln, she proposed a toast to Jefferson Davis. She was let go from the play. And the Union offered her a job as a spy.

  Later, sent into Tennessee, she was warned never to steal any documents. Only to study them and carry them in her memory. She took a fortification map anyway, and stuffed it into her boot.

  She was caught, tried at General Braxton Bragg's headquarters, and sentenced to death by hanging. Before the sentence could be carried out, she fell ill. Some accounts say she was acting. Then the Confederates retreated, and left her behind.

  President Lincoln gave her the honorary rank of major. The marker says spy. She got the job by playing a part.
