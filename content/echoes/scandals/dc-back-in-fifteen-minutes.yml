teaser: "Would you shoot me? No, of course not. So he left."
script: |
  Look at this corner of Wisconsin Avenue. In November nineteen eighty five there was a small, rather noisy French restaurant here, Au Pied de Cochon. In French, the name means the pig's foot.

  One Saturday night a Russian sat down to dinner here with his CIA handler. His name was Vitaly Yurchenko. The State Department had described him as a defector, a senior officer of the KGB. That August he had walked into the American Embassy in Rome and asked for asylum.

  ABC News reported what happened at the table. Yurchenko asked his companion, what would you do if I walked out? Would you shoot me?

  No, of course not, said the CIA man. We don't treat defectors that way.

  So Yurchenko got up and left. On his way out, it was reported, he said, if I'm not back in fifteen minutes, don't blame yourself. Nobody followed him. The Soviet compound was little more than a mile away.

  On Monday he held a news conference at the Soviet Embassy. He said the CIA had abducted him in Rome and drugged him. The State Department called that completely false.

  On Wednesday he left Washington on an Aeroflot jet. He grinned and waved to reporters, and answered no questions.

  A senator on the intelligence committee put the choice plainly. Either a real defector had been allowed just to walk away, or the Americans had been fooled by a double agent.

  Look at the corner. He was not back in fifteen minutes.
