detail: >-
  No one was charged with anything, so this is history, not true crime. The restaurant, its name, the "would you shoot me" exchange (attributed aloud to ABC News, as the Los Angeles Times did), the fifteen minutes (attributed: "it was reported"), the mile to the Soviet compound and Senator Leahy's either-or are from the Los Angeles Times of 6 and 7 November 1985. The single handler, the lack of any tail, the news conference, the State Department's reply and the Aeroflot departure are from the Chicago Tribune of 5, 7 and 10 November 1985. Yurchenko's own claim of abduction is told as his claim. Whether he was a genuine defector is still argued, and the script leaves it as the senator's question. Yurchenko's fate after 1985 is not reliably reported, so the script says nothing about it. Leahy is named in the detail only.
