teaser: "Every state job came with a contribution. The box it went into has never been found."
script: |
  Look at the Roosevelt Hotel. In the nineteen twenties and thirties, this was the place to stay in New Orleans. And Huey Long, the Kingfish, kept a suite here.

  Long was governor of Louisiana, and then a United States senator. NPR, reporting on this hotel, called him ruthless, corrupt, and massively powerful.

  Historians say that every state employee who got a job from Long was expected to contribute to his campaign fund. Long had no base of wealthy donors, and he reasoned that this was a fair source of money. The fund was kept in a locked box. People called it the deduct box.

  Some say he carried that box under his arm through this lobby, on his way up to his suite.

  In September nineteen thirty five, Long was assassinated. The box was believed to have been stolen by one of his associates.

  After Hurricane Katrina, the hotel was closed for nearly four years, and rebuilt for a hundred and forty five million dollars. Many believe Long hid the box in a wall. Even the renovation did not turn it up.

  One of the hotel's managers put it this way. There are a lot of colorful things that may or may not have happened in this room.

  But the deduct box? We sure haven't been able to find it.
detail: >-
  The hotel's 1920s and 1930s heyday, Long's suite, "ruthless, corrupt and gained massive political power", the deduct box as his political slush fund, the wall legend, the box not found in the renovation and the manager's words (Mark Wilson, the hotel's director of sales and marketing, not named aloud because he may be living and is not a public figure in this subject) are from NPR (2009). Long's offices and years, "historians say" every state employee who received a job from Long was expected to contribute, the locked box, the lack of wealthy contributors, "tucked under his arm", the assassination in September 1935, the box believed stolen by an associate, the $145 million renovation and the closure after Katrina are from NBC News (2009, Associated Press). NPR and the AP are independent. The script turns Wilson's "There's" into "There are" and "we sure haven't been able to find it" is quoted exactly. Nobody named aloud is alive.
