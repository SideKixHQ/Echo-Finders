certaintyNote: >-
  That Long's state employees were expected to pay into a campaign fund kept in a locked box is what historians say, according to the Associated Press (2009). That he carried it to his suite here, and that it was hidden in a wall, are legend, and the script says so ("some say", "many believe"). That it has never been found is the hotel's own statement to NPR and the AP.
