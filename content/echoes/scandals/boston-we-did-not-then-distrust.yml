# Listening spot: Public sidewalk on Union Street beside the Blackstone Block, between the Union Oyster House and Marshall Street, looking along the street.
# Position: Goss (1891) puts the Green Dragon Tavern "in Union Street, formerly Green Dragon Lane" without a number; Overture places the Union Oyster House (41 Union St) at 42.36133, -71.05696 and the modern Green Dragon bar (11 Marshall St) at 42.36158, -71.05684. The pin is on Union Street between them (high confidence on the street, low on the tavern's exact site, so the script says only "on this street"). About 140 m from The Spy Question (Faneuil Hall), which tells a different subject.
