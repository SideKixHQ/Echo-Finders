teaser: "They swore on the Bible to tell only a handful of leaders. One of them was the leak."
script: |
  Look along Union Street. In the autumn of seventeen seventy four, the Green Dragon Tavern stood on this street, and a group of Boston men met there in secret.

  Paul Revere was one of them. He later wrote that they were upwards of thirty, chiefly mechanics, and that they met to watch the movements of the British soldiers.

  They were careful. Every time they met, each man swore on the Bible to tell their business to nobody but a few leaders. Hancock, Adams, Doctor Warren, Doctor Church, and one or two more.

  Then a man with friends in the Tory party warned Revere that their meetings had been discovered. He repeated the very words they had spoken the night before.

  We did not then distrust Doctor Church, Revere wrote. They supposed it must be someone among themselves.

  Benjamin Church was a physician, and one of the leaders of the Sons of Liberty. And by early seventeen seventy five, he was selling information to the British commander, General Thomas Gage, in coded letters.

  One of those letters was found, and brought to George Washington. On the third of October, Washington and his leading advisors met to discuss it. Church admitted writing the letter. He said he had done it to get intelligence from the British.

  He was imprisoned, and later banished. The ship he sailed on disappeared, and he was never heard from again.

  The letter has been decoded. One line of it reads, make use of every precaution, or I perish.
