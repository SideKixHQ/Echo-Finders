detail: >-
  The Green Dragon committee, the oath, the list of leaders (Hancock, Adams, Doctors Warren and Church), the warning from a man with Tory connections, the repeated words and "We did not then distrust Dr. Church" are from Paul Revere's letter to Jeremy Belknap as printed in full in Elbridge Goss's Life of Colonel Paul Revere (1891), which reprints the Massachusetts Historical Society's 1878 text. Church as a Sons of Liberty leader, the coded letters to Gage, the council of 3 October 1775 at Washington's headquarters, his admission and defence, imprisonment, banishment and the lost ship, and the decoded line are from the National Park Service. Church was never convicted by a court (the NPS says he was put on trial and imprisoned); everyone named died in the eighteenth or early nineteenth century. The script places the tavern only on Union Street, not on this spot. The existing legend echo The Spy Question (Faneuil Hall grasshopper) does not mention Church.
