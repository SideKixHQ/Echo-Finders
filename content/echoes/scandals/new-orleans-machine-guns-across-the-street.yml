detail: >-
  The seizure of the registration office "last night" (Monday 30 July 1934), the battered door and the voter lists, partial martial law, the machine guns "across a narrow street toward City Hall", the police at 1,400 with riot guns, the 500 Guardsmen at Jackson Barracks, the radio insults, "We will never surrender to this madman" and the onlookers laughing with the soldiers are from Associated Press reports in the McAllen Daily Monitor of 31 July and the Evening Star of 1 August 1934. The Plentywood Herald's weekly news summary of 9 August 1934 independently gives the seizure of the registration office, the 1,400 police and the "moral crusade" and "smoke screen" exchange. The September primary, the 2,000 Guardsmen and the result are from the Evening Star of 28 December 1934. Gallier Hall as City Hall is from the Historic American Buildings Survey record (City Hall, 545 Saint Charles Street, documentation compiled after 1933). Nobody named is alive. No shots or injuries are described because none are in the sources.
