teaser: "The Governor's soldiers held the voting office. The Mayor's police held City Hall."
script: |
  Look at the white columns of Gallier Hall. In the nineteen thirties, this was New Orleans City Hall.

  The Mayor in here was T. Semmes Walmsley. Once a friend of Huey Long, the Kingfish. By the summer of nineteen thirty four, his bitter enemy.

  One Monday night at the end of July, more than a score of National Guardsmen came to the city hall annex, battered in the door, and took the lists of qualified voters. The Governor, a Long ally, declared partial martial law around City Hall.

  Within two days, machine guns looked from the windows across a narrow street toward City Hall.

  Long said he was cleaning up vice and corruption in the city. Walmsley said that was a ruse to seize the city government. He called five hundred more police to duty, which made fourteen hundred, and issued them riot guns. Long had five hundred Guardsmen waiting at Jackson Barracks.

  On the radio, the Mayor called the Senator a cringing coward. We will never surrender to this madman, he said.

  In September, at the primary, Long brought about two thousand fully armed Guardsmen into the city. His candidates trounced the Mayor's.

  Stand here a moment, and picture it. Ordinary people stared wide eyed at the soldiers in the voting office.

  Some stopped to laugh and joke with them.
