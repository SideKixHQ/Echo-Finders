teaser: "In 1864 a Confederate spy set out for this shore in a small boat."
script: |
  Look out at the water off this shore. In the autumn of 1864, a spy tried to reach it in a
  small boat.

  Her name was Rose O'Neal Greenhow. She was aboard the Condor, one of the fastest blockade
  runners ever built in Britain, on the ship's maiden voyage.

  The Condor ran aground, trying to avoid the wreck of another blockade runner, the Night
  Hawk. Greenhow set out for Fort Fisher in the ship's boat. It capsized. She drowned on the
  first of October, 1864.

  She is buried in Oakdale Cemetery in Wilmington. Her ship is still out there. In 2017 the
  Condor became North Carolina's first Heritage Dive Site, and divers now visit the wreck.

  She never reached the shore you are standing on.
