teaser: "Two police forces, one warrant, and the mayor on the wrong side of it."
script: |
  Look past the fountain at the front steps of City Hall. In June eighteen fifty seven, two police forces fought each other on them.

  New York had two because the state government and the city were at war. One force was the mayor's own Municipal Police. The other was the state's new Metropolitan Police. The mayor was Fernando Wood.

  That morning, the street commissioner the Governor had appointed came to his office to work. The mayor's men told him to leave, and when he would not, they threw him out. The mayor had a candidate of his own for the post, the city's leading street contractor.

  A judge issued a warrant for the mayor's arrest. The coroner brought it to City Hall. He got as far as the mayor's office, where some twenty of the mayor's police stopped him at the rail, and he was put out.

  So he came back with fifty Metropolitans. On these steps they were attacked by a crowd outside and the mayor's police from within, and driven back. Several of them were badly hurt.

  Then the militia came. The Seventh Regiment marched up and stood in front of City Hall. With bayonets outside his door, the mayor stopped resisting, the coroner served the warrant, and Fernando Wood went home under arrest.

  At one point that day, the sheriff asked the militia's general a question. Whose authority did he recognise? Whom did he intend to obey?

  The general said, Sir, I shall obey myself.
pronunciations: []
detail: >-
  The day is told from the New-York Tribune of 17 June 1857 (pages 4 to 6), which was hostile to Wood; its editorial language ("ruffians", "rowdies") is left out. The National Intelligencer of 18 June 1857 gives the fifty policemen, the warrant from Judge Hoffman, the street commissioner dispute and the state and city "in conflict". The Intelligencer also reports deaths; the Tribune of the same day says only that the recovery of one or two injured men was doubtful, so the script says "badly hurt" and no more. The Tribune also calls the regiment the "National Guard"; the script uses "the Seventh Regiment", which the Tribune uses too.
