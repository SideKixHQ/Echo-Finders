detail: >-
  Everything in the script is from James K. Hosmer's Life of Thomas Hutchinson (1896), chapter 12, "The Affair of the Letters", which quotes Hutchinson's own letters: the House sitting in the Assembly Chamber of the Old State House, the letters to Thomas Whately, a member of Parliament, Franklin's conditions (shown to a few, not printed or copied, returned), Samuel Adams reading them with the public excluded, the committee's finding, the crowd "wild to know", Hancock's copies "put into his hands in the streets", the order to print, the address to the King, Wedderburn lashing Franklin, "mild as mother's milk" (Hosmer's own phrase) and Hutchinson's "Chevy Chase" line. The Library of Congress catalogue record of the 1774 London pamphlet, "The letters of Governor Hutchinson, and Lieut. Governor Oliver, &c. printed at Boston", backs the printing. Founders Online (the Franklin Papers) is the obvious second source but does not answer from this session. Hosmer says "a Committee of Parliament"; the hearing was before the Privy Council's committee, so the script says only "a committee". "An old ballad" for Chevy Chase is general knowledge, not from the source. Hosmer is sympathetic to Hutchinson; the script attributes his judgement ("his biographer wrote").
