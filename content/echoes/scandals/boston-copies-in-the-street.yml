teaser: "The letters were never to be copied. So the copies came from the street."
script: |
  Look at the old State House in front of you. In seventeen seventy three, the Massachusetts House of Representatives sat in here.

  That year, with the public shut out, Samuel Adams told the House he had letters. Private letters, written by the royal governor, Thomas Hutchinson, and his lieutenant governor, to a member of Parliament in London.

  They had come from Benjamin Franklin. He had sent them under strict secrecy. They were to be shown only to a few leading men. They were not to be printed or copied, and they were to be sent back.

  Adams said the House could still know what was in them. So the letters were read. A committee reported that they tended to annul the charter and overthrow all liberty.

  Word got out into the streets, and people grew wild to know what was in the letters. But the leaders had promised Franklin. Nothing printed, nothing copied.

  Then John Hancock told the House that copies of the letters had been put into his hands, in the streets.

  The House gave way. The letters were printed, and the House asked the King to remove the Governor and the Lieutenant Governor.

  Franklin paid for it in London, where he was lashed without mercy before a committee. And Hutchinson's own biographer wrote that his letters were mild as mother's milk.

  Hutchinson put it his own way. Had they been Chevy Chase, an old ballad, the leaders would have made the people believe it was full of evil and treason.
