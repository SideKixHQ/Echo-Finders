teaser: "To prove he was not a crook, he confessed to something else."
script: |
  Look at the marble face of the bank in front of you. It was Alexander Hamilton's idea. He was Secretary of the Treasury, and he drew up the plan for a national bank.

  The bank moved into this building in seventeen ninety seven. That same year, Hamilton, no longer at the Treasury, published a pamphlet in this city. He had been accused of a crooked money scheme with a man named James Reynolds, and the pamphlet was his answer.

  A few pages in, he wrote this. My real crime is an amorous connection with his wife.

  His account went like this. In the summer of seventeen ninety one, a woman called at his house in Philadelphia, and asked to see him in private. Her husband had treated her cruelly and left her, she said, and she needed money to get home to her family.

  That evening, he put a bank note in his pocket and went to the house where she lodged. She met him at the top of the stairs.

  His own wife and children were away, visiting her father. The meetings went on, most of them at his house.

  In December, the husband wrote to him. He had found out, he said, and he wanted satisfaction. Hamilton wrote that it was easy to understand that he wanted money.

  The price was a thousand dollars, as a plaster for his wounded honour. Hamilton paid it in two instalments.

  He knew how this would read. This confession, he wrote, is not made without a blush.

  But he could not resist a dig at his accusers. If he were really a greedy, speculating Treasury Secretary, he asked, how was it that he had been so short of money that he had to pay a blackmailer in two payments?
pronunciations: []
detail: >-
  Hamilton's own account, from his 1797 pamphlet (Observations on Certain Documents), read on a scan of the Philadelphia edition at the Internet Archive; quotations keep the OCR spelling. The script tells it as his account ("he wrote", "his account went like this") because it is the only side the pamphlet gives, and it says nothing about Maria Reynolds that he did not write. The bank, Hamilton's plan and the building's date are from the National Park Service. Hamilton's 1791 house is not identified: reachable sources disagree on whether he was on Walnut Street or South Third Street that summer, so the echo stands at the bank instead. Single primary source for the affair; no second source was reachable (Founders Online is behind a browser check).
