# Drafted by Claude Code (2026-11-12) for the Scandals topic (affairs), filed under people until the topic exists, following docs/writing-echoes.md.
# Listening spot: Public sidewalk on the west side of South Third Street, at the north end of the First Bank of the United States frontage, between Chestnut and Walnut streets, Old City, Philadelphia.
# Position: the First Bank stands at 120 South Third Street (NPS); the pin is on the Third Street sidewalk toward the north end of its marble front, about 45 m from "The Baby Over the Bank Door", which stands at the portico and tells a different subject. High confidence on the building. Hamilton's own house in 1791 is not marked here because the sources reachable today disagree on which house it was (see the review doc).
