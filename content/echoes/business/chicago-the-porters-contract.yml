teaser: "The company that built this town signed a first in 1937, and not willingly."
script: |
  The Pullman Company did not only build sleeping cars. It ran them, on railroads all over the country, and it needed porters to serve the passengers.

  On the railroads of that time, Black workers were mostly confined to service jobs. Pullman was the nation's largest employer of African Americans. Porters were forty-four percent of the people running its cars.

  In 1925, the porters founded a union, the Brotherhood of Sleeping Car Porters. For four decades it was led by A. Philip Randolph. He did not work for Pullman, so the company could not punish him.

  The union faced a racist industry and an anti-union corporation. At first it also faced fear in its own community, because Pullman offered jobs to African Americans, and people were afraid of losing them.

  In 1937, the Pullman Company signed a contract with the Brotherhood. Higher pay, better job security, and a way to bring grievances. It was the first major labor agreement between an African American union and a corporation.

  This town was built to prove a company could look after its workers. The porters proved the workers could make the company sign.
