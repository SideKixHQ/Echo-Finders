script: |
  Zebulon Latimer came from Connecticut and built a career as a commission merchant in
  Wilmington. His business success helped support the substantial house completed here
  in 1852.

  The museum also connects his wealth with investments in gas, light, and railroad
  companies. His domestic surroundings belonged to a larger commercial network.

  This is his residence, not the place where every business transaction occurred. The
  distinction helps you read the house as evidence of economic results rather than the
  whole economy itself.

  Notice the confidence of its scale from the sidewalk. A merchant's success could
  become brick, rooms, and furnishings. The facade makes private prosperity visible,
  while the wider story asks where that prosperity came from and whose work helped
  sustain the city around it.
