tags: [boston, boston-core, downtown-crossing, telephone, bell, watson, inventions, firsts]
teaser: "The first sentence on the telephone was an errand. The wire it travelled on went into a safe."
script: |
  Find the plaque on Avenue de Lafayette. The address it remembers no longer exists.

  In March eighteen seventy six, Alexander Graham Bell had his laboratory in a boarding house here, at number five, Exeter Place. His assistant, Thomas Watson, was in the next room.

  On the tenth of March, Bell spoke into the instrument, and Watson heard him through the wire. Mister Watson, come here. I want to see you.

  The first complete sentence ever sent by telephone was an errand.

  Watson went at once.

  Later that day, Bell wrote to his father. The day is coming, he said, when wires will be laid on to houses just like water and gas, and friends will talk to each other without leaving home.

  Watson kept the wire. When the laboratory was cleared out in eighteen seventy seven, he took it down, wrote on it which two rooms it had joined, and locked it in a safe. It stayed there for more than thirty five years.

  Look at the people walking past you, talking into their phones.

  Watson kept the first piece of the wire. They are all on the rest of it.
pronunciations:
  - written: "Watson"
    say: "WOT-sun"
detail: >-
  The Library of Congress Information Bulletin (April 1999) describes Bell's notebook entry of 10 March 1876, his assistant Watson in the next room, the words "Mr. Watson, come here, I want to see you" as Bell recorded them, and his letter to "Papa" later that day predicting wires laid on to houses like water and gas. Watson's 1915 speech, in the Library of Congress Bell papers, gives the boarding house at number 5 Exeter Place, the sentence sent from Bell's laboratory to his bedroom, "I am sure that I went at once", and the wire he took down on 8 June 1877, inscribed and kept in a safe until "a year or two ago", that is about 1913, hence "more than thirty five years". Watson remembered the words as "Watson, come here, I want you"; the script uses Bell's notebook wording, and a reviewer should know the two differ. WBUR (2026) gives the Avenue de Lafayette plaque and that the address no longer exists. The final line is the script's own reading of the scene, not a sourced claim.
