tags: [wilmington, downtown]
teaser: "These shops sit in buildings tied to the cotton trade that once made this port a world market."
script: |
  These buildings can feel like a collection of old shops. Their name points to the trade
  that once ran this waterfront.

  At this address, a National Register survey lists a two-story brick building of 1919 and
  1920, designed by Henry Bonitz for Alexander Sprunt's company. Led by Alexander Sprunt
  and Son, Wilmington's cotton export trade served Bremen, Liverpool and other European
  cities. By 1915 the port handled one fifth of the cotton crop of North and South
  Carolina.

  Keep to the passages open to visitors. Next door, a storefront was taken out to make an
  open-air entry into the complex.

  The trade faded. Textile mills in the Piedmont used more of the cotton at home,
  and World War One closed the German market. Behind the present storefronts lies a city
  that stored, sold, and shipped what the world wanted.
