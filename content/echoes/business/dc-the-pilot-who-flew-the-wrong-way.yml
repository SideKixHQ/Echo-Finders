teaser: "Scheduled airmail began on this grass. The first flight did not go well."
script: |
  Find the small bronze plaque on a stone post near the road. It is easy to miss. Read the first line. The world's first airplane mail, to be operated as a continuously scheduled public service, started from this field.

  This field. In May nineteen eighteen, this part of the Mall was open ground called the Polo Grounds, used for drills. On the morning of the fifteenth, dignitaries gathered here, and President Woodrow Wilson came to watch.

  The plane was a Curtiss Jenny. The pilot was an army lieutenant, George Boyle. The mail was loaded. He took off, bound for Philadelphia and New York.

  And he got lost.

  Boyle became disoriented, and came down in a forced landing, off course.

  It did not matter. The service started that day and kept going. Within months the Post Office took it over from the army. The routes grew, all the way across the country, and helped make the airlines.

  Look at the plaque again. It does not mention the wrong turn.

  Every great service has a first day.
