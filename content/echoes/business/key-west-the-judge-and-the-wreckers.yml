teaser: "A county in Texas is named for a Key West judge."
script: |
  Look at the house at four twenty nine Caroline Street. It is believed to date from eighteen thirty eight, and to have been built by a judge.

  James Webb was the first federal judge of the Southern District of the Florida Territory. He sat here, in Key West, from eighteen twenty nine to eighteen thirty nine.

  This was a town that lived on salvage, on what could be saved from ships in trouble. And Webb brought in important laws to regulate it. That, says the government's survey of his house, is what made wrecking a legitimate business in Florida.

  Then he left for Texas. He served the Republic of Texas, and then the State.

  Later this house became the birthplace of Dr. Joseph Yates Porter, Florida's first public health officer, who fought yellow fever.

  But the judge is the one with a county. Webb County, Texas, is named for him.
detail: >-
  From the Historic American Buildings Survey record of the Webb-Porter House (HABS FL-188): believed to date to 1838 and to have been built by Judge James Webb, first federal judge of the Southern District of the Florida Territory, judge from 1829 to 1839, who introduced laws regulating salvage, "thereby making wrecking a legitimate business in Florida"; his later service in the Republic and State of Texas, and Webb County named for him; the house better known as the birthplace of Dr. Joseph Yates Porter, Florida's first public health officer (1889 to 1917), known for controlling yellow fever. "A town that lived on salvage" is an inference from the record's account of salvage law and wrecking; the HABS records of Wall and Company and Captain Watlington support it, but this record alone does not say it.
