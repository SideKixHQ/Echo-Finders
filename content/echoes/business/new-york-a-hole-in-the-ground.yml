tags: [new-york, city-hall, broadway, subway, pneumatic, invention]
teaser: "The first subway car in New York was pushed by wind. It went one block."
script: |
  Look down at the pavement of Broadway, between Warren Street and Murray Street. One block. Under your feet, in eighteen seventy, somebody dug a tunnel.

  And a railroad car rode through it, pushed by air.

  London had opened an underground railway seventeen years before. New York had nothing. So a promoter named Alfred Ely Beach built a short tunnel under Broadway, from Warren to Murray, and sent a car through it on a trial run, driven by a great rush of air.

  It worked. Beach asked the city to let him build a line all the way from lower Broadway to the Bronx.

  The public was on his side. They signed petitions. They even marched in a parade by torchlight to show their support.

  But the men who owned the buildings along Broadway did not. And they won. The plan failed.

  Thirty years later, when the city finally announced a real subway, a man named Russell Sage gave his opinion. New York people, he said, will never go into a hole in the ground to ride. Preposterous.

  The first line opened in nineteen oh four.

  Look down at the street again.

  Under it, every day, New York people go into a hole in the ground to ride.

