teaser: "Wilbur Wright flew over New York Harbor with a canoe tied under his plane. Just in case."
script: |
  Look out across the water to the Statue of Liberty. Now picture a plane made of wood and cloth, rattling up from this island.

  Under its wings, strapped to the bottom, a canoe.

  In the autumn of nineteen oh nine, the city was throwing a party for Henry Hudson and for Robert Fulton's steamboat. The guest everyone wanted was Wilbur Wright. He had just come home from Europe, where crowds had watched him fly. Now New York wanted to see it.

  It was the first time the Wrights had flown over water in America. So the canoe was there for one reason. If the engine stopped, he would come down on the harbor, and he wanted something that floated.

  He took off from this island and flew out to the Statue, and around her. The ships in the harbor answered with their whistles, hundreds of them.

  A few days later he flew again. Twenty miles, up the Hudson to Grant's Tomb and back. Hundreds of thousands of people watched from the shore.

  Look at the statue again, and the open water all around her.

  For that first flight, she was the turning point.

