teaser: "Chicago's biggest snowstorm arrived two days after a warm spell, and ended up in this river."
script: |
  Look down at the river. In the winter of 1967, Chicago was shovelling its streets into it.

  On the twenty-fourth of January that year, the high was sixty-five degrees. There were thunderstorms that evening.

  The snow started at two minutes past five on Thursday morning, the twenty-sixth. By ten past ten the next morning, a record twenty-three inches had fallen. It is still the greatest snowfall from a single storm in the city's records.

  Winds gusted to fifty-three miles an hour. Drifts four to six feet high were everywhere. In the city, twenty thousand cars and eleven hundred buses were stranded in the snow. Expectant mothers were taken to hospital by sled, bulldozer and snow plow. At least a dozen babies were born at home.

  When the city dug itself out, it had to put the snow somewhere. So it was hauled by dump truck to the Chicago River.

  Sixty-five degrees, then twenty-three inches. And the river took what the streets could not hold.
