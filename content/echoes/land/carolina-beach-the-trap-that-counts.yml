teaser: "The most famous plant on this coast is smaller than a quarter."
script: |
  Slow down and look at the ground along the wetter edges of the trail. What you are
  looking for is smaller than you expect, often no bigger than a quarter.

  It is a Venus flytrap. It has one of the smallest native ranges of any plant anywhere, a slim
  band of coastal plain around Wilmington, reaching just into South Carolina.

  Each trap is a leaf, hinged like a tiny bear trap and lined with trigger hairs. One touch is
  not enough. An insect has to brush those hairs more than once, and then the trap snaps shut,
  in less than a second.

  The plant waits to be sure. You can too. Look, but do not dig. In North Carolina, taking a
  flytrap from the wild is a felony.
