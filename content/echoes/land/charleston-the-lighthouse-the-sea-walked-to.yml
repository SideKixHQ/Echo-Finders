tags: [charleston, folly-beach, morris-island, lighthouse, erosion, coast]
teaser: "Nobody moved the lighthouse. They moved the sea."
script: |
  Look across the inlet at the lighthouse standing in the water, with waves breaking around its base. Nobody builds a lighthouse in the sea like that.

  They did not. When it was built in eighteen seventy six, it stood on land, on Morris Island.

  It was not the first light there. A lighthouse stood on Morris Island from seventeen sixty seven, at the main entrance to the ship channel. In eighteen sixty one, Confederate forces destroyed it, to hide the harbour entrance from the Union fleet.

  After the war, this tower went up in its place. Then the engineers built jetties, long walls of stone, to steer the ship channel into the harbour.

  The jetties moved the water. And the water moved the sand. Morris Island began to wash away around the lighthouse.

  Today the tower is a hundred and fifty eight feet tall, and it stands about seventeen hundred feet out to sea. The light was put out when a new lighthouse was built on Sullivan's Island, closer to the new channel.

  Look at it again. It has not moved an inch.

  The island left.
detail: >-
  From the National Park Service page on the Charleston Light: the 1767 Morris Island lighthouse, its destruction by Confederate forces in 1861, the new lighthouse of 1876, the jetties that redirected the ship channel and caused erosion, its height of 158 feet and its position 1700 feet out to sea, and its decommissioning when the Sullivan's Island light was built. The state of South Carolina owns it.
