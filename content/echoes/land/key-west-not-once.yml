tags: [key-west, southernmost-point, weather, climate, sea]
teaser: "The coldest it has ever been here is forty one degrees."
script: |
  Stand by the buoy and look at the sea. Feel the air on your skin.

  Weather records here go back to eighteen seventy one. Key West is one of the longest running climate record sites in the United States.

  In all that time, there is no record of frost here. No ice. No sleet. No snow.

  The coldest it has ever been is forty one degrees Fahrenheit. That has happened twice. In January eighteen eighty six, and in January nineteen eighty one.

  In January twenty ten, a cold wave came close. Forty two degrees. Seven nights in a row below fifty, the longest such streak the weather office had ever recorded here.

  Up the Keys, ice has been reported. Here, not once.
detail: >-
  From the National Weather Service Key West office: its climate page (continuous records back to 1871; no record of frost, ice, sleet or snow in Key West, though ice has been reported in the Upper Keys) and its statement on the January 2010 cold wave (all time record low of 41 degrees on 12 January 1886 and 13 January 1981; 42 degrees on 11 January 2010, the second coldest on record; seven consecutive days with lows below 50, the longest such streak recorded to that date). The statement dates temperature records from 1873; the climate page dates the record from 1871, which is what the script uses. Whether the 2010 streak has been matched since was not checked, so the script says "had ever recorded" as of then.
