teaser: "Everyone here measures storms by Hazel. Four years later, one did more damage and never even came ashore."
script: |
  Look at the buildings on the water side of this street. In 1954, Hurricane Hazel destroyed most of the commercial buildings on the south side of Bay Street.

  Hazel became the benchmark hurricane for an entire generation. It is the storm people here measure the others by.

  Four years later, in September 1958, Hurricane Helene came up the coast with winds estimated at a hundred and thirty miles an hour.

  It never made landfall. The eye stayed about twenty miles offshore.

  The next day, an Associated Press report said the damage in Southport was worse than anything seen in Hazel.

  Every house was said to have been damaged. A number of buildings caved in, their roofs lifted and tossed about like paper. More than half of the town's pier was carried away.

  And Helene came through near low tide.

  It missed by twenty miles, at low tide, and it was still worse than Hazel.
