teaser: "You walked uphill to get here. You probably did not notice."
script: |
  Stand at the rail and look at the water. Then turn round and look back at the cathedral.

  To get here from the square, you walked uphill. You probably did not notice. A guidebook from nineteen oh four made the same point. The slope starts a long way back, it said, and rises so gently that you cannot feel it.

  That slope is the levee. A great bank of earth between the city and the Mississippi, added to again and again as the years went on.

  Because when the river floods, it rises far above the level of the streets behind you. The cathedral you are looking at sits lower than the water in front of you can reach.

  A New Orleans writer in the eighteen nineties described the yellow floods rising high above the land, threatening to tear the levees like cobwebs.

  Now look left and right along the bank. The river does not run straight past the old city. It bends around it.

  The same writer said the river had shaped its banks here into the edges of the moon in its first quarter.

  That is the crescent. That is why it is the Crescent City. Not a nickname somebody chose. A description of the water you are standing above.
