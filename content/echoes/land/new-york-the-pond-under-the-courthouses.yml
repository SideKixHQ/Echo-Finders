teaser: "Under the courthouses there was a pond. Filling it in made a slum."
script: |
  Look around you. Courthouses, granite steps, lawyers hurrying. And in the middle, a little park with a shallow pool.

  That pool is a reminder. In the seventeen hundreds, there was a real pond here, called the Collect, in a hollow of marshland. A stream ran out of it, west, all the way to the Hudson.

  And in seventeen ninety six, a man named John Fitch was out on that pond, testing a steamboat. More than ten years before Robert Fulton's.

  Then the city grew up around the water. In the hard times of eighteen oh eight, the city put men to work, as relief, draining it. For a while the new ground was a place for holidays, for sailors and oystermen.

  But the pond did not go quietly. The filled land began to sink into the half drained swamp. Houses settled. Taverns emptied. The people who could leave, left. Those who could not, freed slaves and new immigrants, were left behind.

  Out of that sinking ground grew Five Points, the most infamous neighbourhood in New York history.

  And the stream? It became a street. Canal Street, named for the stream, and following its course.

  Look down at the pool.

  The water was here first. The city is still standing on its bed.

