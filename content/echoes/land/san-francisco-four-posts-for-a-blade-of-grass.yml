tags: [san-francisco, golden-gate-park, ocean-beach, sand-dunes, john-mclaren, trees]
teaser: "A newspaper said a blade of grass here would need four posts to hold it down."
script: |
  Look at the trees around you, and then down at the ground between them. Under the leaves, it is sand.

  In eighteen seventy three, a newspaper laughed at the city's new park. A dreary waste of shifting sand hills, it said, where a blade of grass cannot be raised without four posts to support it, and keep it from blowing away.

  The park had two great problems: fresh water, and dunes that would not stay put.

  The man who solved the dunes was the gardener, John McLaren. He tried native lupine and barley. They could not hold the sand.

  So he used a beach grass from the coasts of Northern Europe. When the wind buries it, it keeps growing, until the dune is too high for the wind to carry more sand to the top.

  The first years were hard. Time after time, he woke to find thousands of young trees covered with sand. He dug them out, and nursed them back to life.

  For fertiliser, he asked the city for the sweepings from its streets. In those days, the streets were full of horses.

  Look at the trees again. Every one of them is growing on that.
detail: >-
  From the 1940 Federal Writers' Project guide to San Francisco, Golden Gate Park chapter: the Santa Rosa Democrat's 1873 jibe about shifting sand hills and four posts, the two chief problems of fresh water and moving dunes, native lupine and barley failing to hold the sand, Ammophila arenaria from the coast of Northern Europe growing as fast as the wind covers it until the wind no longer carries sand to the top, McLaren waking to find thousands of young trees covered with sand and digging them out, and his request for the sweepings from the city streets. The guide's aside that McLaren was annoyed "when the automobile drove the horses from the streets" supports the horses. "Every one of them" is a turn, not a census: the guide says the whole landscape is man's handiwork on the former dunes.
