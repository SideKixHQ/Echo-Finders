teaser: "Beside this street runs a stone-lined ditch that Santa Fe has used since before the Pueblo Revolt."
script: |
  Look for the stone-lined ditch running beside this street. It might be dry, or there might be water in it. Either way, this is the Acequia Madre. The mother ditch.

  When the Spanish founded Santa Fe in 1610, they probably began digging it almost at once. It was already in use at the time of the Pueblo Revolt, in 1680.

  It takes its water from the Santa Fe River, and runs west through the city for over two miles, first along this street. It is four to five feet wide, and most of it is lined with stone. It supplied the town with water for the household, and for irrigation.

  It is probably the oldest Spanish acequia system left in the Southwest. And you can still trace it, walking down the street named after it.

  It is not used regularly now. It only carries water when the river runs high.

  Dug when the town was new, and still waiting for the river.
