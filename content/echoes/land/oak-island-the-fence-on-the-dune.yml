teaser: "That little fenced square on the beach is somebody's nursery."
script: |
  In summer, look along the beach near this pier for a small square of fencing with a sign on it. That is a sea turtle nest.

  A loggerhead laid her eggs near this pier one night, and went back to the ocean. Volunteers from the Oak Island Sea Turtle Protection Program fenced off the nest and put up signs, asking people to give the eggs some space.

  The eggs take a little less than two months to hatch. That nest was about a hundred yards from the water, so the volunteers planned to help the young turtles make their way to the ocean.

  It is a busy beach for turtles. In 2023 the program recorded one hundred and thirty-three nests, the third highest on record. In 2024 the first sea turtle nest in all of North Carolina was found on this island.

  Give the fence room. Somebody under that sand has a long walk ahead.
