teaser: "When the red ball went up, the whole city could go skating."
script: |
  Look up at the tower of this little stone castle, perched on its rock. It looks like a toy from a fairy tale. But it has been doing serious work.

  In the nineteen thirties, the United States Weather Bureau kept its instruments in this tower. And in winter, the castle did one more job. When the ice on the lake below was thick enough to skate on, it flew a banner with a red ball.

  Picture New Yorkers looking up at this tower, waiting for the red ball to go up.

  Central Park's weather record goes back to eighteen sixty nine. It has seen a lot.

  The coldest it has ever been here was fifteen below zero, on the ninth of February, nineteen thirty four. The hottest, one hundred and six degrees, on the ninth of July, nineteen thirty six. The biggest snowstorm, twenty seven and a half inches, came in January, twenty sixteen.

  Look down at the water below the rock. Is it frozen?

  If it were, you would want a castle to tell you so.

