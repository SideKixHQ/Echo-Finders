teaser: "Every street here runs straight. Except this one."
script: |
  Every street around here runs straight, at right angles, the way William Penn liked it. Except the one you are standing on. Dock Street bends.

  Now look at the building beside you. Its end is not flat. It is round, a curve of stone columns with a little round lantern on top. This is the Merchants' Exchange, finished in the eighteen thirties, and its architect fitted it onto a triangle of ground between Third Street, Walnut Street, and this odd curving road.

  So why does the road curve?

  When Penn first came to Philadelphia, he left the big ship out on the Delaware and went up a creek in a skiff. That creek ran here. Dock Creek. In the seventeen nineties the city covered it over, and the street took its line.

  Before this building, merchants did their deals in coffee houses and taverns down by the river. This was the first large building in the city put up for doing business. Ships' cargoes changed hands in it. So did stocks. The Philadelphia Stock Exchange met here.

  Penn came up this line in a small boat. A hundred and fifty years later, the city's money was following it too.
