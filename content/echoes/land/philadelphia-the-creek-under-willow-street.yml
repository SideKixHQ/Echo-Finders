teaser: "Under your feet is a creek with a Lenape name."
script: |
  Look along Willow Street, here at Second. There is a creek under this street.

  Its first name was Cohoquinoque. The settlers called it Pegg's Run, after a man who owned the meadows. And Willow Street was laid right along its bed.

  The writer John Watson remembered it from when he was a boy. To the south, a high, steep bluff, where the old city ended. To the north, a wide marsh, where the Delaware flowed in at high tide. Second Street crossed it on a low causeway that everyone called the Hollow.

  When the river flooded, boats rowed right over the top of the causeway, from bank to bank. In summer, the marsh was loud with thousands of frogs, and men came to shoot snipe and plover. Floods left catfish stranded in the ponds, for boys to catch.

  And in winter, the whole marsh froze into one great pond. All the skaters of Philadelphia, he wrote, even the grown men, came here to skate.

  Then the city filled it in, with loose rubbish, year after year. Streets went over it, and houses. By eighteen forty two, Watson wrote, the creek ran hidden, in a tunnel under Willow Street.

  Look along Willow Street once more.

  It runs where the creek ran.
