teaser: "An empty stretch of beach that is, in season, a nursery."
script: |
  Look south along the sand toward the posted signs and the rope. It can look empty. In nesting
  season, it usually isn't.

  Audubon calls the south end of Wrightsville Beach its busiest nesting site. Colonies of Least
  Terns and Black Skimmers nest here, and skimmers have been nesting on this beach since 2009.

  These birds nest directly on the sand, and their nests are often difficult to see. Even a brief
  disturbance can make the adults leave, exposing eggs and chicks to heat and predators.

  From March 1 to September 15, postings protect the places where birds are building nests, laying
  eggs and raising chicks. So stay outside the signs and watch from here. If a bird starts calling
  loudly, it is telling you to back away.
