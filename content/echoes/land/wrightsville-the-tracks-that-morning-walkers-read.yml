teaser: "Sea turtles come ashore in the dark. Volunteers read their tracks at dawn."
script: |
  Look at the open sand between the dunes and the water. Overnight, something might have crossed it.

  Sea turtles nest at night, so volunteers with the Wrightsville Beach Sea Turtle Project check for
  their tracks in the sand at dawn. Every day between May 1 and August 31, they walk the length of
  the beach looking for signs of nesting.

  When they find a nest, it is roped off as a federally protected area. Then they watch it daily
  until it hatches, about 45 to 70 days later.

  If you see a roped nest, leave it alone. If you see a turtle, stay quiet, keep your distance and
  keep lights off it. By the time most of us reach the beach, the morning walkers have already read
  the night.
