teaser: "This flower waited centuries in the mud of a dried lake."
script: |
  Find the concrete pond just behind the visitor center. In early summer, it fills with pale pink lotus flowers, with bright yellow centres. They are among the first to bloom here.

  They should not exist.

  A lotus seed is small and dark, and it can lie in the mud for years, waiting. In nineteen nineteen, a Japanese botanist named Ichiro Ohga found some of these seeds in a dried lakebed in northeast China. He brought them to the United States.

  Then, in March nineteen fifty two, a plant scientist here at Kenilworth, Horace Wester, got them to sprout, in the hot houses.

  The Park Service says the seeds were up to a thousand years old. That is an estimate. Nobody can put an exact date on a seed. But the Park Service calls them the oldest seeds ever to germinate successfully.

  But the plants in this pond come from those seeds.

  So look at the flowers again. Each one lasts only a few days.

  The family they come from waited a thousand years for its turn.
detail: >-
  The seeds' age is an estimate and is told as one ("up to 1,000 years old", Park Service). The claim that they are the oldest seeds ever to germinate is attributed to the Park Service in the script rather than stated as fact; a reviewer may prefer to cut it. The National Register nomination for the gardens would be a second source, but npgallery.nps.gov was unreachable from this session.
