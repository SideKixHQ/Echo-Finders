teaser: "It is not named for angels."
script: |
  Stand under the branches and follow one with your eyes, down to where it rests on the ground and rises again.

  In nineteen forty one, the state guide described this tree. Its limbs spread over fourteen thousand five hundred and sixty square feet. Its trunk was twenty one feet around.

  You might think the name means angels.

  It means the Angel family, who once owned this ground.
detail: >-
  The 1941 Federal Writers' Project guide gives the spread of the limbs, the circumference and the site's former ownership by the Angel family; it also calls the tree a thousand years old, a figure the script leaves out because the guide gives no basis for it.
