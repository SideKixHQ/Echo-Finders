teaser: Almost every forest you have driven through today is second growth. One is not.
script: |
  Almost everything you have driven through today grew back. The southern Appalachians were
  logged hard between about eighteen eighty and nineteen thirty, and most of what looks
  ancient out there is a century old at most.

  The gorge on your right is the exception.

  It is around two thousand feet deep with walls to match, and the timber companies looked
  at it and could not make the arithmetic work. There was no way to get logs out that cost
  less than the logs were worth.

  So it was left. Not protected, not fought over — just skipped.

  It is one of the few places in the eastern United States where you can look at a forest
  that nobody ever got around to cutting down.
