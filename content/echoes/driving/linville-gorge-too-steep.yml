teaser: Almost every forest you have driven through today is second growth. One is not.
script: |
  Almost everything you have driven through today has a past. By the early nineteen thirties much of the land in these mountains had been stripped by logging and poor farming, and most of what looks ancient out there grew back afterwards.

  The gorge on your right is different.

  Linville Gorge is fifteen hundred feet deep, and when the Park Service wrote up this stretch of road, it called it the deepest canyon in the eastern United States. The lumber companies cut the country around it. A narrow gauge railway carried the timber out to a mill. But the gorge itself, the record says, was largely untouched.

  In nineteen fifty one it was set aside as the first designated wilderness area in the East.

  It is one of the few places out here where you can look at a forest that was never cut down.

