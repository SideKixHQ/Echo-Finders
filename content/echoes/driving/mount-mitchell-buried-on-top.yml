teaser: The highest ground east of the Mississippi is off to your left.
script: |
  Off to the left is the highest ground anywhere east of the Mississippi. Six thousand six hundred and eighty four feet.

  It is named after Elisha Mitchell, a minister and a professor at the University of North Carolina. In eighteen thirty five he went up into the Black Mountains and measured one of the peaks at six thousand four hundred and seventy six feet, higher than Mount Washington in New Hampshire, which had been taken for the highest point in the range.

  Not everybody accepted it. It was suggested that he had been mistaken, and had never measured the highest peak at all.

  In June eighteen fifty seven he went back up, alone, partly to settle the question. He did not come down. Days later his body was found in deep water at the foot of a cliff about forty feet high. His watch had stopped.

  Later surveys confirmed that this was indeed the highest point east of the Mississippi. The mountain that had been called Black Dome now carries his name.

