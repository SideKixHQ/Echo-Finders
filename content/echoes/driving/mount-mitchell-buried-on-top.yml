teaser: The highest ground east of the Mississippi is off to your left.
script: |
  Off to the left is the highest ground anywhere east of the Mississippi. Six thousand six
  hundred and eighty-four feet.

  It is named after a professor called Elisha Mitchell, who measured it in the eighteen
  thirties and said it was the tallest. A former student of his said it was not, and said so
  publicly, at length.

  In eighteen fifty-seven Mitchell went back up to take the measurements again and settle
  it. He did not come down. They found him days later in a pool below a waterfall.

  His figures were correct, and the argument ended the way arguments do when one side stops
  being available.

  He is buried on the summit.
