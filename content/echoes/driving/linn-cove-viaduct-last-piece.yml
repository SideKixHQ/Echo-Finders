teaser: The road you are on was the last part to be finished, and it took the longest.
script: |
  The road ahead curls around the side of the mountain on concrete legs.

  Construction on the Blue Ridge Parkway started in nineteen thirty-five. This stretch,
  about seven miles of it, did not open until nineteen eighty-seven.

  The hold-up was the mountain. Grandfather Mountain is old, steep and unusually rich in
  rare plants, and the ordinary way to put a road across something like that is to cut a
  shelf into it and push the spoil over the side. Nobody was willing to do that here.

  So they built it from the top down instead. Each segment of the viaduct was cast off-site,
  carried out along the piece already finished, and lowered into place. Almost no heavy
  machinery ever touched the ground underneath it.

  The Parkway is four hundred and sixty-nine miles long. The last seven took a third of the
  time.
