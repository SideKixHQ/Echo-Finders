teaser: Look at the tops of the ridges. Something is missing.
script: |
  Look at the tops of the ridges around you. The trees stop, and then there is grass.

  That is odd. These summits are nowhere near high enough to be above the tree line —
  there are forests on mountains twice this height. Something else is keeping them bare.

  They are called balds, and after a century of argument there is still no agreed
  explanation. Cattle grazing is the obvious one, except some were bare before the cattle.
  Fire. Ice-age climate that never quite reverted. Grazing by animals that are extinct.

  What is agreed is that they are closing. Without something to keep them open, the forest
  comes back, and it has been coming back for decades.

  So the mystery is solving itself, in the least useful way.
