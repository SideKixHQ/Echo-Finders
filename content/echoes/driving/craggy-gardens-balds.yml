teaser: Look at the tops of the ridges. Something is missing.
script: |
  Look at the tops of the ridges around you. The trees stop, and then there are shrubs and grass.

  They are called balds, and the Park Service's own history of this road says plainly that the origin of the balds is unclear.

  One idea is natural: fires started by lightning. Another is human: that people cleared them to graze livestock in the summer. Grazing was widespread in the Great Craggies until the nineteen twenties, when it was stopped to protect the water supply for Asheville.

  What is clear is that a bald does not have to stay bald. Further down the Parkway, Tennessee Bald was largely bare when the road was being planned in the nineteen thirties. Today it is covered in spruce and fir.

  So the mystery might be solving itself, in the least useful way.

