# Narrators.
#
# Kept here rather than in code because the questions that matter about a voice are
# licensing questions, and they belong beside the content they read.
#
# Note on adding a second voice: transcript timings belong to a *render*, not to a script.
# Two narrators reading the same words produce different durations, so a second voice means
# re-rendering every echo AND re-timing every transcript — it roughly doubles both TTS cost
# and offline package size. Worth doing; not worth doing by accident.

# ── Do not delete a voice ─────────────────────────────────────────────────────
#
# A voice id is a pointer into the ElevenLabs account, not a copy of the voice. Delete the
# voice and every id below stops resolving — no render, no re-render, no correction.
#
# For a **designed** voice this is unrecoverable. Voice Design is not deterministic: feeding
# the same description in again produces a different voice, not the same one back. There is
# no export, no backup and no undo. The account is the only copy.
#
# Two things follow.
#
# **Before the library is rendered, this is the single point of failure in the project.**
# Losing the voice means re-rendering everything that exists in a voice that is not the one
# anybody approved.
#
# **Afterwards the exposure shrinks but does not close.** Rendered mp3s are ours and live in
# our own storage, so past echoes are safe. But every correction, every new echo and every
# re-timed transcript needs the same voice — and a library where echo 47 was fixed in a
# different voice is a broken library, not a slightly inconsistent one.
#
# Worth checking against the plan, too: custom voice slots are tied to the subscription
# tier, so downgrading can remove voices. Confirm before changing plan.
#
# **Two designed voices are held as of 23 September 2026** — the default narrator and the
# kids narrator — alongside one stock voice. Custom-voice slots were briefly thought to be
# limited to one on this plan; in the event both designs coexist. Worth re-checking before
# any plan change, because the limit is real on some tiers and a downgrade removing a
# designed voice is the unrecoverable case above.
#
# Stock voices do not occupy a custom slot, which is why the male narrator costs nothing to
# keep. It is also the reason a third *designed* voice should be argued for rather than
# assumed: see the note on how many voices, below. One sound that is unmistakably ours is
# worth more than several that anyone could pick.

# ── Finding out what a voice is ───────────────────────────────────────────────
#
# The ElevenLabs interface does not put "where did this voice come from" anywhere obvious,
# and it is the one fact about a narrator with legal weight. `node scripts/voice-info.mjs`
# asks the API and prints name, accent and origin for every voice listed below.
#
# You can also answer it from memory, because origin is decided by how you got the voice:
#
#   Picked from ElevenLabs' own built-in voices        → stock
#   Typed a description and generated one (Voice Design) → designed
#   Browsed the Voice Library and added someone else's  → stock, but see below
#   Uploaded recordings of a person                     → cloned
#
# Uploading audio is the only route to a clone, and it is not something that happens by
# accident. If you never uploaded a recording, nothing here is cloned, and there is no
# right of publicity to clear.
#
# The Voice Library is the one to look at twice. Those voices were made by other users, and
# some of them are clones of real people. ElevenLabs requires contributors to hold consent
# — but that consent is theirs, not ours, and we are the ones shipping the result inside a
# product licensed to a third party.

defaultVoiceId: IMlxLW3qgn0MWgfz7Vnh

voices:
  - id: IMlxLW3qgn0MWgfz7Vnh
    role: Main female narrator — the default voice of the product
    name: TODO — the voice's name in ElevenLabs
    provider: elevenlabs
    locale: TODO — e.g. en-GB or en-US
    # stock    : an ElevenLabs library voice
    # designed : generated from a description, resembling no particular person
    # cloned   : replicated from a real person's recordings — engages that person's right
    #            of publicity, which several US states treat as surviving their death
    # recorded : a human read it
    # Designed — generated from a description via Voice Design, on 23 September 2026.
    # It resembles no particular person, which is the answer that closes the hardest
    # question on this file rather than deferring it: there is no right of publicity to
    # clear, because there is no person. See the note below.
    origin: designed
    # The brief it was designed from, kept verbatim.
    #
    # Not a recovery mechanism — Voice Design is not deterministic and this will not bring
    # the same voice back. It is here for three other reasons.
    #
    # It records *intent*. If this voice ever has to be replaced, a person or a model
    # working from this brief lands somewhere recognisably the same, which is the most
    # anyone can promise.
    #
    # It is **editorial direction as much as audio direction**. "A trusted storyteller
    # revealing something hidden beneath a familiar place" is the product, stated better
    # than any of our own documents state it, and scripts should be written to be read by
    # this person. See docs/writing-echoes.md.
    #
    # And its last sentence is contemporaneous evidence. A brief that says in writing
    # "avoid ... imitation of any recognizable person", dated to the moment of creation, is
    # exactly what a right-of-publicity question years from now would want to see. It cost
    # nothing to write and it is the difference between asserting the voice imitates nobody
    # and being able to show it. See docs/protection-policy.md, Risk 4.
    designPrompt: |
      A distinctive female narrative voice in her early forties with a neutral
      international English accent and subtle British influence. Her voice is warm,
      intimate, intelligent, and slightly mysterious, with a smooth lower-mid register and
      gentle natural texture. She speaks at a measured pace, allowing important details to
      breathe without sounding theatrical or sleepy. Her delivery creates atmosphere
      through restraint, curiosity, and quiet emotional tension. Clear articulation,
      controlled dynamics, and natural conversational phrasing. She sounds like a trusted
      storyteller revealing something hidden beneath a familiar place. Cinematic but
      believable, immersive but never melodramatic. Avoid exaggerated breathiness,
      artificial suspense, radio-announcer delivery, and imitation of any recognizable
      person.
    designedAt: "2026-09-23"
    # Does the ElevenLabs plan permit redistribution inside a product licensed to a third
    # party — an airline — rather than only published by us? See docs/01-services.md.
    #
    # Marked true on James's statement of 23 September 2026: chosen specifically from
    # voices permitting redistribution for life. Recorded with its provenance rather than
    # asserted flatly, because this is the field somebody will ask about years from now,
    # and "it says true" is a worse answer than "he selected on that basis, on that date".
    # The licence terms themselves still want saving somewhere durable.
    redistributionCleared: true
    notes: >-
      Designed and approved on 23 September 2026 — replaced the earlier default
      (plP9aw1rizYgjFfuvLQ7), a placeholder from the first pass now cast to nothing.

      Designed rather than stock or cloned, and that is worth more than it sounds. It
      settles Risk 4 in docs/protection-policy.md for this voice outright: a cloned voice
      carries a real person's right of publicity, which survives their death and runs
      seventy years in California, and a Voice Library voice carries a consent chain held
      by whoever contributed it rather than by us. A designed voice has neither, because
      there is no person behind it.

      It is also a brand asset rather than a rented one. Nobody else can pick this voice
      out of a library, so the product has a sound of its own — the nearest thing to
      owning a voice without employing one, and the thing that makes a series feel like a
      series.

  - id: hP72SDESIJq2YuAblBqz
    name: TODO — the voice's name in ElevenLabs
    provider: elevenlabs
    locale: TODO — e.g. en-GB or en-US
    origin: TODO — run scripts/voice-info.mjs
    redistributionCleared: false
    notes: >-
      Male narrator. Listened to on 22 September 2026 and judged good.

      One male and one female voice is the intended shape. Measured cost, from the package
      builder, for an echo plus its simple telling in both voices:

        12 echoes · both voices · 24.6 MB   (walking budget 60 MB)  — fine
        30 echoes · both voices · 61.6 MB   (walking budget 60 MB)  — over
        250 echoes · both voices · 513 MB   (flight budget 250 MB)  — impossible

      So: carry both on a walking route, carry one on a flight package. That is a per-mode
      decision the builder already takes, via EchoJourneyOptions.voiceIds.

      Worth considering before building a picker, because it costs nothing and may be
      better: **casting** rather than choosing. Assign voices per echo — this one told by
      her, that one by him — so the tour alternates. Each echo is rendered once, so package
      size and TTS bill stay at one voice, and half an hour of a single narrator is more
      monotonous than two. It also pairs naturally with perspectiveIds: two accounts of the
      same event, in two voices, is a thing an audio documentary would do deliberately.

      A picker and a cast answer different needs. A picker serves preference and
      accessibility — some listeners genuinely follow one voice more easily. A cast serves
      the listening experience. They can coexist, but only the picker costs double.

  - id: UrTldiIxfedDl9tlesyS
    role: Kids narrator
    name: TODO — the voice's name in ElevenLabs
    provider: elevenlabs
    locale: en-US
    # Designed on 23 September 2026, replacing the stock placeholder (MkTSSXNgnBULS6ek4pon)
    # that carried this role through the first pass. Ours, not rented, and resembling no
    # performer — see the brief below.
    origin: designed
    # The brief it was designed from, kept verbatim. Same three reasons as the default
    # narrator: it records intent, it is editorial direction as much as audio direction, and
    # its final sentence — "avoid ... resemblance to any recognizable performer" — is dated
    # contemporaneous evidence for docs/protection-policy.md, Risk 4.
    #
    # Read the middle of it as a writing rule, because it is one: "engaging children and
    # adults without sounding childish". That is the same line this file already draws about
    # not casting the kids voice at plain-language cuts — a shorter telling is not a younger
    # listener, and treating them as one is patronising.
    designPrompt: |
      An original female storyteller in her early thirties with a clear contemporary
      American accent. Her voice is bright, welcoming, curious, and naturally expressive,
      with a light-medium pitch and a genuine sense of discovery. She speaks with energetic
      clarity and a friendly smile in her voice, engaging children and adults without
      sounding childish, overly cheerful, or like a classroom instructor. Her delivery is
      conversational and animated, using subtle shifts in emphasis to make surprising facts
      feel exciting. Warm, intelligent, playful, and trustworthy, with crisp pronunciation
      and a comfortable medium pace. Avoid cartoon qualities, exaggerated enthusiasm, sales
      language, and resemblance to any recognizable performer.
    designedAt: "2026-09-23"
    # Same basis as the default narrator: designed from a description, so no person's
    # publicity right attaches, and chosen under a plan permitting redistribution for life.
    redistributionCleared: true
    notes: >-
      Kids narrator. The one extra voice that earns itself: children's content read by an
      adult documentary narrator sounds wrong in a way no direction fixes.

      Cast it to echoes whose category is `kids`, and to nothing else. In particular **not**
      to the simple telling of an adult echo — `simple` means plainer and shorter, which
      serves tired listeners, second-language listeners and anyone who just wants the short
      version. Reading those in a children's voice would be patronising. A simple variant
      stays in whatever voice its echo is cast to.

# ── How many voices ───────────────────────────────────────────────────────────
#
# Casting makes extra voices free. Each echo is rendered once, so ten narrators cost exactly
# what two cost, in package size and in TTS. The real cost is elsewhere, and it is brand
# coherence: a product with eight narrators has no voice of its own. What makes a series feel
# like a series is a consistent sound.
#
# So the answer is not "one per category". It is:
#
#   Two general narrators, alternating. What we have. Variety without losing coherence.
#
#   One dedicated kids voice. This one genuinely earns it — children's content read by an
#   adult documentary narrator sounds wrong in a way no direction fixes.
#
#   Nothing else, until a category proves it needs one.
#
# True crime is the tempting fourth, and the one to resist. A distinctively grave narrator
# makes it sound like entertainment, which is precisely what the Respect value warns against:
# "avoid turning pain, tragedy or identity into disposable entertainment." A measured read
# from a general narrator treats the subject more seriously than a genre voice does.
#
# Worth knowing before adding voices at all: **voice is not delivery.** The same narrator can
# be directed — ElevenLabs stability and style settings change the read considerably. A
# darker tone for a difficult echo is a setting, not a second voice, and it costs nothing to
# try first.
