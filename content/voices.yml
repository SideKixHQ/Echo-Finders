# Narrators.
#
# Kept here rather than in code because the questions that matter about a voice are
# licensing questions, and they belong beside the content they read.
#
# Note on adding a second voice: transcript timings belong to a *render*, not to a script.
# Two narrators reading the same words produce different durations, so a second voice means
# re-rendering every echo AND re-timing every transcript — it roughly doubles both TTS cost
# and offline package size. Worth doing; not worth doing by accident.

defaultVoiceId: plP9aw1rizYgjFfuvLQ7

