# The shortest possible route that still earns being a route: two stops, 150 metres, and a
# road crossing between them.
#
# It exists because the distance *is* the story. An echo cannot make someone feel that the
# killing and the memorial are three minutes apart; only walking it can. This is the clearest
# case in the library for why a route is not just a playlist with coordinates attached.
id: central-park-west-lennon
mode: walking
name: Central Park West — three minutes apart

origin:
  name: The Dakota, 1 West 72nd Street
  at: { lat: 40.77625, lng: -73.97596 }
  timeZone: America/New_York

destination:
  name: Strawberry Fields
  at: { lat: 40.77541, lng: -73.97461 }
  timeZone: America/New_York

# 150m of walking, plus a signalled crossing of Central Park West, plus the time you stand
# on the pavement outside the Dakota — which is most of it.
durationS: 420

waypoints:
  - { name: The Dakota, at: { lat: 40.77625, lng: -73.97596 }, dwellS: 150 }
  - { name: West 72nd Street entrance, at: { lat: 40.77557, lng: -73.97531 } }
  - { name: Imagine mosaic, at: { lat: 40.77541, lng: -73.97461 } }
