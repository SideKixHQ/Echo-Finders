# A suggested drive (proposed 2026-11-11, for James's approval).
#
# Home ground, and the densest stretch of road in the library: a slow loop of downtown
# Wilmington (Water Street, Market Street, Orange Street, Third Street from Ann to Davis),
# then out Oleander Drive past Independence Mall and Airlie Gardens, over the causeway to
# Wrightsville Beach, down Lumina Avenue to the south end and up to Shell Island, and home
# by Eastwood Road and Market Street. Every echo it passes is approved.
#
# Downtown it is a crawl on purpose: Market Street between the river and Fifth carries more
# echoes than any road we have. The beach is the stop.
#
# Waypoint positions are road nodes from Overture Maps 2026-09-23.0 (transportation/segment,
# OpenStreetMap contributors, ODbL), picked at the corner or entrance nearest the landmark or
# echo each is named for; the landmarks are the echoes' own positions in content/echoes.
id: wilmington-wrightsville-beach-loop
mode: driving
name: "Wilmington to Wrightsville Beach and back"
area: Cape Fear Coast
# The road the line on the map follows between waypoints (`scripts/build-route-paths.py`).
follows: Oleander Drive

origin:
  name: Wilmington, North Carolina
  at: { lat: 34.23979, lng: -77.94958 }
  timeZone: America/New_York

destination:
  name: Wilmington, North Carolina
  at: { lat: 34.23979, lng: -77.94958 }
  timeZone: America/New_York

# About 51 km of town and beach road, much of it at 25 to 35 mph, plus half an hour on the
# sand at Lumina and a stop at Airlie Gardens. An estimate.
durationS: 9000

waypoints:
